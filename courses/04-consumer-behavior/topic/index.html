<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>오늘의 주제 | 소비자행동론</title>
  <style>
    /* 강의실 스크린에 띄우는 화면이다. 뒷자리에서 읽히는 것이 첫째다.
       글자 크기를 화면 폭에 매어 두어, 노트북이든 프로젝터든 같은 비율로 보인다. */
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:#101b2d;color:#f7f9f5;overflow:hidden;
      font-family:"Malgun Gothic","맑은 고딕",-apple-system,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .deck{position:relative;height:100vh;height:100dvh}

    .slide{
      position:absolute;inset:0;display:grid;align-content:center;
      padding:clamp(40px,7vw,120px);
      opacity:0;visibility:hidden;transition:opacity .28s ease;
    }
    .slide.on{opacity:1;visibility:visible}

    /* 번호를 배경처럼 크게 깔아 둔다. 몇 번째 이야기인지 눈으로 잡힌다. */
    .slide:before{
      content:attr(data-no);
      position:absolute;right:clamp(20px,4vw,80px);top:calc(50% - 0.5em);
      font-size:clamp(14rem,34vw,30rem);font-weight:800;line-height:1;
      color:rgba(255,255,255,.04);letter-spacing:-.06em;pointer-events:none;
    }

    .tag{
      margin:0 0 clamp(14px,2.4vh,30px);
      color:#c8ef64;font:700 clamp(.8rem,1.3vw,1.15rem)/1 Arial,sans-serif;
      letter-spacing:.22em;text-transform:uppercase;
    }
    .tag b{font-weight:700;letter-spacing:.06em}

    h2{
      position:relative;margin:0;
      font-size:clamp(2.1rem,6.4vw,6.4rem);line-height:1.16;letter-spacing:-.055em;
      max-width:18em;
    }
    /* 물음표를 라임으로 떼어 놓으면 '묻고 있다'는 것이 한눈에 들어온다 */
    h2 em{font-style:normal;color:#c8ef64}

    .rule{
      width:clamp(60px,7vw,120px);height:6px;background:#c8ef64;
      margin:clamp(22px,3.6vh,46px) 0 0;border-radius:3px;
    }

    /* 표지 */
    .cover h1{
      margin:0;font-size:clamp(2.6rem,8vw,7.6rem);line-height:1.08;letter-spacing:-.06em;
    }
    .cover p{margin:clamp(18px,3vh,34px) 0 0;color:#9fb0c4;
      font-size:clamp(1rem,1.9vw,1.7rem);line-height:1.7}

    /* 아래 진행 표시 */
    .bar{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08)}
    .bar span{display:block;height:100%;background:#c8ef64;transition:width .28s ease}

    .foot{
      position:fixed;left:0;right:0;bottom:clamp(16px,2.6vh,30px);
      display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,20px);
      color:#7e93b2;font-size:clamp(.78rem,1.1vw,.95rem);
    }
    .foot b{color:#dfe7f2;font-variant-numeric:tabular-nums}

    .arm{
      position:fixed;top:50%;transform:translateY(-50%);
      width:clamp(46px,4.6vw,68px);height:clamp(46px,4.6vw,68px);
      border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;
      font-size:clamp(24px,2.6vw,36px);line-height:1;cursor:pointer;
    }
    .arm:hover:not(:disabled){background:rgba(255,255,255,.24)}
    .arm:disabled{opacity:.18;cursor:default}
    .arm.prev{left:clamp(12px,1.6vw,26px)}
    .arm.next{right:clamp(12px,1.6vw,26px)}

    .home{
      position:fixed;top:clamp(14px,2.2vh,24px);left:clamp(14px,1.8vw,26px);
      color:#7e93b2;text-decoration:none;font-size:clamp(.76rem,1vw,.9rem);
    }
    .home:hover{color:#c8ef64}

    /* 목록 보기 — 네 주제를 한 화면에 늘어놓아 어디쯤인지 짚어 준다 */
    .map{
      position:fixed;inset:0;z-index:5;background:#0c1523;
      display:none;align-content:center;gap:clamp(10px,1.6vh,20px);
      padding:clamp(30px,6vw,90px);
    }
    .map.on{display:grid}
    .map button{
      display:flex;align-items:baseline;gap:clamp(14px,2vw,28px);
      padding:clamp(12px,1.8vh,22px) clamp(14px,2vw,26px);
      border:0;border-radius:12px;background:transparent;color:#dfe7f2;
      font:inherit;text-align:left;cursor:pointer;
    }
    .map button:hover{background:rgba(255,255,255,.07)}
    .map button.now{background:rgba(200,239,100,.12);color:#fff}
    .map button i{
      font-style:normal;color:#c8ef64;font-weight:800;
      font-size:clamp(1rem,1.6vw,1.5rem);min-width:1.6em;
    }
    .map button span{font-size:clamp(1rem,2.1vw,2rem);line-height:1.35;letter-spacing:-.03em}

    .hint{
      position:fixed;right:clamp(14px,1.8vw,26px);top:clamp(14px,2.2vh,24px);
      color:#7e93b2;font-size:clamp(.72rem,.95vw,.85rem);text-align:right;line-height:1.7;
    }
    .hint kbd{
      display:inline-block;padding:1px 6px;margin:0 1px;border-radius:5px;
      background:rgba(255,255,255,.1);color:#dfe7f2;font:inherit;font-size:.92em;
    }

    @media(max-width:720px){
      .hint{display:none}
      .slide:before{opacity:.6}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none !important}}
  </style>
</head>
<body>

<div class="deck" id="deck">

  <section class="slide cover on" data-no="">
    <p class="tag">소비자행동론 · 제1장</p>
    <h1>오늘 우리가<br>물을 것</h1>
    <p>네 가지 물음으로 소비자 행동에 들어갑니다.</p>
    <div class="rule"></div>
  </section>

  <section class="slide" data-no="1">
    <p class="tag">물음 <b>01</b></p>
    <h2>소비자 행동이란<br>무엇인가<em>?</em></h2>
    <div class="rule"></div>
  </section>

  <section class="slide" data-no="2">
    <p class="tag">물음 <b>02</b></p>
    <h2>소비자 행동에 영향을<br>미치는 요소는<br>무엇인가<em>?</em></h2>
    <div class="rule"></div>
  </section>

  <section class="slide" data-no="3">
    <p class="tag">물음 <b>03</b></p>
    <h2>소비자 행동을<br>연구함으로써<br>누가 혜택을 받는가<em>?</em></h2>
    <div class="rule"></div>
  </section>

  <section class="slide" data-no="4">
    <p class="tag">물음 <b>04</b></p>
    <h2>마케터는 소비자 행동<br>개념을 어떻게<br>적용하는가<em>?</em></h2>
    <div class="rule"></div>
  </section>

</div>

<div class="map" id="map"></div>

<a class="home" href="../">← 소비자행동론</a>
<p class="hint">
  <kbd>←</kbd> <kbd>→</kbd> 넘기기 · <kbd>M</kbd> 목록 · <kbd>F</kbd> 전체 화면
</p>

<button class="arm prev" id="prev" type="button" aria-label="이전">‹</button>
<button class="arm next" id="next" type="button" aria-label="다음">›</button>

<p class="foot"><b id="now">1</b> / <span id="all">5</span></p>
<div class="bar"><span id="bar"></span></div>

<script>
  const slides = [...document.querySelectorAll(".slide")];
  const map = document.getElementById("map");
  let at = 0;

  /* 목록은 표지를 뺀 네 물음만 보여 준다. 표지는 짚을 것이 없다. */
  map.innerHTML = slides.slice(1).map((s, i) => {
    const t = s.querySelector("h2").textContent.replace(/\s+/g, " ").trim();
    return `<button type="button" data-go="${i + 1}"><i>0${i + 1}</i><span>${t}</span></button>`;
  }).join("");
  map.querySelectorAll("[data-go]").forEach((b) => {
    b.addEventListener("click", () => { go(Number(b.dataset.go)); showMap(false); });
  });

  function go(i) {
    at = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach((s, k) => s.classList.toggle("on", k === at));
    document.getElementById("now").textContent = at + 1;
    document.getElementById("bar").style.width = ((at + 1) / slides.length * 100) + "%";
    document.getElementById("prev").disabled = at === 0;
    document.getElementById("next").disabled = at === slides.length - 1;
    map.querySelectorAll("[data-go]").forEach((b) => {
      b.classList.toggle("now", Number(b.dataset.go) === at);
    });
  }

  function showMap(on) {
    map.classList.toggle("on", on === undefined ? !map.classList.contains("on") : on);
  }

  document.getElementById("all").textContent = slides.length;
  document.getElementById("prev").addEventListener("click", () => go(at - 1));
  document.getElementById("next").addEventListener("click", () => go(at + 1));

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") {
      e.preventDefault(); go(at + 1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault(); go(at - 1);
    } else if (e.key === "m" || e.key === "M") {
      showMap();
    } else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } else if (e.key === "Escape") {
      showMap(false);
    } else if (e.key === "Home") {
      go(0);
    } else if (e.key === "End") {
      go(slides.length - 1);
    }
  });

  /* 스크린을 누르거나 손가락으로 밀어도 넘어간다. 강의실에서 마우스를 찾는 것보다 빠르다. */
  document.getElementById("deck").addEventListener("click", (e) => {
    if (e.target.closest("a,button")) return;
    go(at + (e.clientX < innerWidth / 3 ? -1 : 1));
  });

  let x0 = null;
  addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) go(at + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });

  go(0);
</script>

</body>
</html>
