<script>
const slides=[{"kind": "concept", "title": "소비자 관점의 혁신 (Innovation)", "answer": "혁신은 소비자가 새롭다고 인식하는 제품·서비스·속성·아이디어 등을 뜻한다. 기술적으로 새롭다는 사실과 소비자의 새로움 지각은 다르며 동일한 제공물도 집단에 따라 다르게 받아들일 수 있다.", "example": "이미 다른 나라에서 널리 쓰는 결제 방식도 처음 접하는 소비자에게는 혁신일 수 있다."}, {"kind": "concept", "title": "연속적 혁신", "answer": "기존 소비 행동에 비교적 작은 변화를 요구하는 혁신이다. 제품이 개선되어도 익숙한 사용 방식이 크게 바뀌지 않으므로 학습 부담이 상대적으로 작을 수 있다.", "example": "기존 방식으로 사용하는 세제의 뚜껑과 계량 표시를 개선한 제품을 생각할 수 있다."}, {"kind": "concept", "title": "동적 연속적 혁신과 단절적 혁신", "answer": "동적 연속적 혁신은 기존 소비 관행을 눈에 띄게 바꾸지만 전면적으로 대체하지는 않는다. 단절적 혁신은 새로운 행동과 학습을 크게 요구한다. 분류는 소비자와 사용 맥락에 따라 달라질 수 있다.", "example": "교재의 전기차 사례에서는 운전 외에 충전과 이동 계획의 변화가 중요하다. 처음 등장한 인터넷은 정보 탐색과 소통 방식을 크게 바꾸었다."}, {"kind": "concept", "title": "혜택에 따른 혁신 유형", "answer": "기능적 혁신은 성능과 문제 해결, 쾌락적·미학적 혁신은 감각적 즐거움과 경험, 상징적 혁신은 사회적 의미와 자기표현의 새로운 혜택에 초점을 둔다. 하나의 혁신이 여러 혜택을 함께 제공할 수 있다.", "example": "새 이어폰이 소음을 줄이고 음악 경험을 풍부하게 하며 스타일을 표현한다면 여러 혜택이 결합된다."}, {"kind": "concept", "title": "혁신과 공동 창조 (Co-Creation)", "answer": "소비자가 아이디어 제안·설계·시험 등에 참여해 혁신 개발에 기여하는 과정이다. 참여는 실제 욕구를 찾는 데 도움이 되지만 참여자의 취향이 전체 시장을 대표한다고 보장하지는 않는다.", "example": "사용자와 함께 가방 수납을 시험하고 의견을 설계에 반영하되 다른 고객에게도 적합한지 확인한다."}, {"kind": "concept", "title": "혁신의 결과와 의도하지 않은 영향", "answer": "혁신은 편익과 함께 새로운 비용·위험·사회적 결과를 만들 수 있다. 채택률만 보지 않고 획득·사용·처분과 다양한 이해관계자에게 미치는 영향을 살펴야 한다.", "example": "새 배송 서비스가 편리해져도 포장 폐기물이나 디지털 접근성이 낮은 이용자의 어려움이 늘 수 있다."}, {"kind": "concept", "title": "저항·비채택·채택의 구분", "answer": "저항은 혁신을 받아들이지 않으려는 반응이며 단순한 미인지나 구매 연기와 구분한다. 채택은 혁신을 자신의 이용 방식에 받아들이는 것이며, 한 번의 시험이나 구매가 지속 사용을 보장하지는 않는다.", "example": "제품을 몰라서 사지 않은 사람, 필요할 때까지 기다리는 사람, 기존 방식이 좋아 거부하는 사람은 이유가 다르다."}, {"kind": "concept", "title": "고노력 채택 과정", "answer": "중요성과 위험이 높을 때 소비자는 정보를 수집하고 평가·태도를 형성한 뒤 시도와 선택을 거칠 수 있다. 구체적인 논거와 비교, 위험을 줄일 정보가 중요하다.", "example": "고가 가전을 고르며 사양·설치 조건·사용 비용을 비교한 뒤 체험하고 결정한다."}, {"kind": "concept", "title": "저노력·경험적 채택 과정", "answer": "저관여 상황에서는 먼저 시도한 뒤 경험을 통해 평가할 수 있고, 감각적·정서적 경험이 채택을 이끌 수도 있다. 모든 혁신이 충분한 사전 분석을 거쳐 채택되는 것은 아니다.", "example": "새 음료를 소량 시음한 뒤 맛이 좋아 반복 구매하거나, 새로운 전시 경험에 끌려 서비스를 이용할 수 있다."}, {"kind": "concept", "title": "채택 시기에 따른 다섯 집단", "answer": "혁신자, 초기수용자, 조기다수자, 후기다수자, 후기채택자를 상대적인 채택 시기로 구분한다. 교재의 전형적 모형은 2.5%·13.5%·34%·34%·16%를 제시하지만 실제 시장이 반드시 이 비율을 따르지는 않는다.", "example": "어떤 소비자는 카메라는 빨리 채택해도 새로운 결제 서비스는 늦게 받아들일 수 있다."}, {"kind": "concept", "title": "채택자별 정보와 지원", "answer": "초기 집단은 새로운 가능성에, 다수자는 실제 효용·신뢰·지원에 주목할 수 있다. 채택 시기만으로 성격이나 능력을 단정하지 말고 비용·위험·필요의 차이를 확인해야 한다.", "example": "실험을 즐기는 사용자에게는 시험 기능을, 안정성을 원하는 사용자에게는 검증된 사례와 지원을 제공할 수 있다."}, {"kind": "concept", "title": "채택과 확산 (Adoption and Diffusion)", "answer": "채택은 개별 소비자가 혁신을 받아들이는 과정이고 확산은 시간이 지나며 시장·사회 시스템에 채택이 퍼지는 과정이다. 개인의 의도와 시장 전체의 누적 채택을 구분해야 한다.", "example": "학생 한 명이 앱을 이용하기 시작하는 것은 채택, 학내 여러 집단으로 사용이 퍼지는 것은 확산이다."}, {"kind": "concept", "title": "S자형과 지수형 확산 곡선", "answer": "누적 채택의 S자형은 초기에는 느리고 이후 빨라졌다가 포화에 가까워지며 증가가 완만해지는 형태이다. 교재의 지수형은 초기부터 비교적 빠르게 채택이 늘고 점차 증가가 둔화하는 누적 형태를 다룬다. 실제 곡선은 제품과 시장에 따라 다르다.", "example": "학습·위험이 큰 제품은 초기 확산이 더딜 수 있고 이해하기 쉬운 저위험 제품은 초기에 빠르게 퍼질 수 있다."}, {"kind": "concept", "title": "확산과 제품 수명 주기", "answer": "확산은 채택자의 증가에, 제품 수명 주기는 도입·성장·성숙·쇠퇴 등 시장 판매의 변화에 초점을 둔다. 누적 채택자 수와 기간별 판매량은 다른 지표이며 재구매·교체·경쟁도 판매에 영향을 준다.", "example": "신규 채택이 둔화해도 기존 사용자의 교체 구매로 판매가 이어질 수 있다."}, {"kind": "concept", "title": "상대적 이점과 지각된 가치", "answer": "상대적 이점은 기존 대안보다 더 나은 혜택을 제공한다고 느끼는 정도이다. 가치는 혜택뿐 아니라 금전·시간·노력·전환 비용을 함께 고려한 평가이다. 기능이 많아도 중요하지 않거나 비용이 크면 채택되지 않을 수 있다.", "example": "새 앱이 기능은 많지만 계정 이전과 학습에 시간이 많이 들면 기존 앱을 유지할 수 있다."}, {"kind": "concept", "title": "불확실성과 지각된 위험", "answer": "성능, 표준, 지속 지원, 사용 결과와 손실 등에 대한 불확실성은 채택을 늦출 수 있다. 소비자가 무엇을 걱정하는지 파악해 체험·설명·보증·지원 등 실제 대응을 설계해야 한다.", "example": "연결 기기의 규격과 장기 지원이 불확실하면 소비자는 다른 사용자의 경험을 기다릴 수 있다."}, {"kind": "concept", "title": "호환성 (Compatibility)", "answer": "소비자의 욕구·가치·규범·기존 생활 방식과 혁신이 맞는 정도이다. 기술 규격의 일치뿐 아니라 행동과 문화의 적합성도 포함한다. 적합성이 낮으면 혜택이 있어도 변화 부담이 크다.", "example": "예약 서비스가 편리해도 근무 중 스마트폰을 쓸 수 없는 고객에게는 이용 시간과 다른 예약 경로가 필요하다."}, {"kind": "concept", "title": "시험 사용 가능성과 복잡성", "answer": "시험 사용 가능성은 제한적으로 먼저 경험해 볼 수 있는 정도, 복잡성은 이해와 사용이 어렵다고 지각하는 정도이다. 작은 체험과 단계별 안내는 학습과 위험 부담을 줄일 수 있다.", "example": "체험 계정에서 핵심 기능 하나를 직접 수행해 보게 하고 초기 설정을 안내한다."}, {"kind": "concept", "title": "관찰 가능성과 사회적 적합성", "answer": "다른 사람의 사용과 결과를 볼 수 있으면 혜택을 이해하기 쉬워질 수 있다. 집단의 규범·지위 의미도 채택을 촉진하거나 억제한다. 눈에 띈다는 이유만으로 긍정적 확산을 보장하지는 않는다.", "example": "동료가 새 도구로 작업 시간을 줄이는 모습을 보면 효용을 이해하기 쉽지만 사용이 비난받는 분위기에서는 채택을 주저할 수 있다."}, {"kind": "concept", "title": "정통성·적응성과 사회 시스템", "answer": "정통성은 해당 범주에서 적절한 것으로 인정되는 정도와 관련된다. 적응성은 혁신을 상황과 욕구에 맞게 조정할 여지이다. 현대성·동질성·관계망·의견 선도자·문화도 확산에 관여하며 영향은 촉진과 억제 양쪽으로 나타날 수 있다.", "example": "사용자가 실제 생활에 맞게 조정하고 신뢰하는 동료에게 경험을 전할 수 있으면 확산을 도울 수 있다."}, {"kind": "problem", "topic": "혁신의 정의", "title": "오래전부터 해외에서 쓰던 서비스가 국내 일부 소비자에게 처음 소개되었다. 혁신으로 볼 수 있는가?", "answer": "소비자가 새롭다고 인식한다면 혁신으로 분석할 수 있다. 전 세계 최초인지보다 해당 소비자의 지식·경험과 사용 변화가 중요하다.", "example": "같은 결제 방식도 숙련 사용자와 처음 접한 사람에게 새로움이 다르다."}, {"kind": "problem", "topic": "참신성의 정도", "title": "세제 계량 표시 개선, 충전 계획이 필요한 전기차, 처음 등장한 인터넷을 행동 변화의 정도로 비교하라.", "answer": "익숙한 사용을 유지하는 개선은 연속적, 전기차의 충전·이동 변화는 동적 연속적, 처음 등장한 인터넷처럼 행동을 크게 바꾸는 것은 단절적 혁신으로 살펴볼 수 있다. 분류는 맥락을 명시해야 한다.", "example": "기술의 복잡성과 소비자가 바꿔야 할 행동의 정도는 같지 않다."}, {"kind": "problem", "topic": "혜택 유형", "title": "새 이어폰의 소음 감소·새로운 음악 경험·자기표현을 각각 어떤 혁신 혜택으로 볼 수 있는가?", "answer": "소음 감소는 기능적, 음악에서의 감각적 즐거움은 쾌락적·경험적, 자기표현은 상징적 혜택이다. 하나의 제품에 여러 혜택이 함께 존재한다.", "example": "광고는 표적 소비자가 중요하게 여기는 혜택을 구체적으로 보여 줄 수 있다."}, {"kind": "problem", "topic": "공동 창조", "title": "열성 사용자들이 만든 신제품이 일반 고객에게 어렵다는 평가를 받았다. 원인과 보완책을 제안하라.", "answer": "참여자의 지식과 요구가 전체 시장을 대표하지 않았을 수 있다. 초보자와 다른 사용 상황의 소비자도 시험에 참여시켜 사용성과 학습 부담을 확인한다.", "example": "핵심 사용자에게 익숙한 용어가 입문 고객에게는 장벽일 수 있다."}, {"kind": "problem", "topic": "저항과 비채택", "title": "제품을 모르는 A, 다음 달 필요할 때 살 B, 기존 방식을 고수하며 거부하는 C를 구분하라.", "answer": "A는 미인지에 따른 비채택, B는 구매 연기, C는 혁신 저항으로 볼 수 있다. 같은 미구매 결과라도 이유가 달라 메시지와 지원이 달라져야 한다.", "example": "인지 부족에는 알림이 필요하고 실제 불편에 대한 저항에는 문제 해결이 필요하다."}, {"kind": "problem", "topic": "채택 과정", "title": "고가 장비는 비교 후 체험하고, 새 음료는 시음 후 평가했다. 채택 과정을 비교하라.", "answer": "장비는 정보 탐색과 평가가 앞서는 고노력 과정, 음료는 시도 후 경험을 통해 태도가 형성되는 저노력 과정으로 볼 수 있다. 가격 외에 위험과 관여도도 확인한다.", "example": "모든 제품에 길고 상세한 설명부터 제공하는 방식이 맞는 것은 아니다."}, {"kind": "problem", "topic": "채택 집단", "title": "신제품을 가장 빨리 쓰는 소비자가 모든 범주에서 혁신자인가? 전형적 비율도 실제 시장에 그대로 적용되는가?", "answer": "둘 다 단정할 수 없다. 채택 집단은 범주별 상대 시기에 관한 구분이며 필요·지식·자원에 따라 달라진다. 모형의 비율은 실제 시장의 고정된 법칙이 아니다.", "example": "신형 카메라의 초기 구매자가 새 금융 앱에는 신중할 수 있다."}, {"kind": "problem", "topic": "채택과 확산", "title": "한 학생의 앱 가입과 이후 여러 학과로 사용이 퍼지는 현상을 구분하고 지표를 제안하라.", "answer": "개인의 이용 시작은 채택, 시장과 집단으로 퍼짐은 확산이다. 개인의 활성 사용·지속 이용과 집단별 누적 채택률·기간별 신규 채택을 구분해 살펴볼 수 있다.", "example": "가입 수만으로 지속 사용이나 전체 시장 침투를 모두 설명하기 어렵다."}, {"kind": "problem", "topic": "확산 곡선", "title": "누적 이용자가 처음에는 느리게, 이후 빠르게 늘고, 마지막에는 증가가 둔화했다. 어떤 형태이며 주의할 점은?", "answer": "S자형 누적 확산으로 볼 수 있다. 초기 학습과 불확실성, 이후 구전과 가용성, 포화 등을 검토하되 곡선 모양만으로 원인을 확정하지 않는다.", "example": "동일한 S자형도 가격 인하나 유통 확대 등 여러 요인으로 만들어질 수 있다."}, {"kind": "problem", "topic": "제품 수명 주기", "title": "신규 채택은 줄었는데 판매량은 유지된다. 확산 이론과 모순되는가?", "answer": "모순되지 않는다. 누적 신규 채택과 기간별 판매는 다른 지표이고 교체·재구매가 판매를 유지할 수 있다. 측정 단위와 기존 고객의 구매를 확인해야 한다.", "example": "휴대기기의 교체 수요는 첫 구매자 증가가 둔화한 뒤에도 남을 수 있다."}, {"kind": "problem", "topic": "지각된 가치", "title": "기능이 더 많은 앱으로 바꾸지 않는 고객을 ‘비합리적’이라고 볼 수 있는가?", "answer": "그렇게 단정할 수 없다. 기능 편익이 중요하지 않거나 데이터 이전·학습·구독 비용이 클 수 있다. 기존 대안과 비교한 총혜택·총비용을 조사해야 한다.", "example": "설정과 계정 이전 부담을 줄이면 전환 의향이 달라질 수 있다."}, {"kind": "problem", "topic": "불확실성", "title": "새 기기의 규격과 장기 지원을 걱정하는 고객에게 어떤 정보를 제공해야 하는가?", "answer": "지원되는 규격, 호환 범위, 지원 기간과 실제 정책을 명확히 알린다. 체험과 사용 사례를 제공하고 확인되지 않은 미래 지원을 약속하지 않는다.", "example": "광고의 막연한 안심보다 구체적 지원 조건이 판단에 도움이 된다."}, {"kind": "problem", "topic": "학습 요건", "title": "고객이 제품은 유용해 보이지만 설정이 어렵고 생활 방식에 맞지 않는다고 한다. 개선안을 제시하라.", "answer": "복잡성은 단계별 설정 안내와 기본값 개선으로, 호환성은 실제 이용 시간·환경에 맞는 기능과 경로로 개선한다. 제한된 시험 사용을 제공해 직접 효용을 확인하게 한다.", "example": "기능 설명을 늘리는 것만으로 생활 방식의 불일치를 해결하기는 어렵다."}, {"kind": "problem", "topic": "관찰 가능성", "title": "동료의 사용 시연이 긴 기능 목록보다 효과적이었다. 이유와 한계를 설명하라.", "answer": "사용 결과가 눈에 보여 혁신의 혜택을 이해하기 쉬워졌을 수 있다. 다만 동료와 자신의 상황이 다르거나 집단 규범이 부정적이면 같은 효과를 보장하지 않는다.", "example": "작업 시간 절약을 실제 흐름에서 보여 주면 추상적인 성능 수치보다 이해하기 쉬울 수 있다."}, {"kind": "problem", "topic": "통합 전략", "title": "새 학습 서비스를 출시한다. 상대적 이점·시험 사용·관계망·부정적 결과를 고려한 확산 계획을 제안하라.", "answer": "기존 학습 대비 편익을 확인하고 작은 과제로 시험하게 하며 초기에 설정을 지원한다. 실제 경험을 공유할 경로를 마련하고 지속 이용과 접근성·시간 부담 등 부작용도 점검한다.", "example": "체험 가입 이후 학습 성과와 이탈 이유를 확인해야 출시 홍보만의 성과를 넘어서 볼 수 있다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제15장 · 혁신: 채택, 저항, 확산';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
