</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "사이코그래픽스: 가치, 개성, 라이프스타일", "source": "20261114_145039.jpg"}, {"kind": "paragraph", "text": "도입\n 이 장에서는 소비자 행동에 미치는 사이코그래픽스, 즉 가치, 개성, 라이프스타일의 영향을 설명한다. 제품 맞춤화와 개인화를 향한 지속적인 트렌드는 이러한 영향력을 보여 준다. 예를 들어, 가치는 소비자가 개인주의를 더 중요시하는지 아니면 사회적 그룹에 더 중점을 두는지를 결정한다. 개인주의를 중시하고 개성이 뚜렷한 소비자는 자신의 사진이 들어간 제품이나 예술품, 의류, 스포츠 장비와 같이 소비자의 라이프스타일에 맞게 맞춤화할 수 있는 제품을 구매하는 경향이 있다. 온라인 사이트들은 다른 소비자들과 어떤 점이 더 비슷하고 가능한지에 비해 더 자신만의 스타일을 갖고자 하는 소비자의 자기 지도와 선호도가 높다. 소비자의 정치적 관여도는 그들의 가치와 개성 측면과 관련이 있어,", "source": "20261114_145039.jpg"}, {"kind": "heading", "text": "14-1 가치", "source": "20261114_145054.jpg"}, {"kind": "paragraph", "text": "소비자를 분류하기 위해 마케터들은 연령, 성별, 인종, 사회 계층, 종교와 같은 사회경제적 특성에서 얻을 수 있는 내용보다 심층적인 소비자 행동에 관한 이해를 위해 사이코그래픽스(psychographics)를 사용한다.\n 가치(value)는 바람직한 최종적 결과에 대한 지속적인 믿음이다. 예를 들어, 건강을 유지하고, 가족을 안전하게 보호하고, 자존감을 갖고, 자유로워지는 것이 좋다고 믿을 수 있다. 이러한 가치는 다양한 상황과 시간에 걸쳐 행동, 사람, 정책을 평가하고 선택하는 기준으로 작용한다. 따라서 환경을 얼마나 중요하게 생각하는가가 소비자들 버리거나, 재활용을 하거나, 재활용 재료로 만든 제품을 구입하거나, 전기차나 하이브리드 차를 선택하는 결정에 영향을 미칠 수 있다. 가치는 그러한 행동을 수행하거나 하지 않는 사람들을 도덕적이다거나 비도덕적이라고 판단하는데도 쓰인다. 가치는 매우 깊게 뿌리박혀 있어서 사람들이 이를 의식하지 못하거나 설명하지 어려워할 수 있다.\n 여러 가치의 전체 집합과 이들의 상대적 중요성이 가치 체계(value system)를 구성한다. 주어진 상황에서 행동하는 방식은 흔히 한 가치가 다른 가치에 대해 상대적으로 얼마나 중요하게 여겨지는지를 반영한다. 예를 들어 휴가를 가족들과 함께 쉬면서 보낼 것인가 아니면 의료 봉사 활동을 할 것인가 하는 결정은 가족과 건강에 부여하는 상대적 중요성에 의해 결정된다. 소비자는 특정 행동이 자신에게 중요한 한 가지 이상의 가치와 일치하지만 다른 한 가지 이상의 중요한 가치와 일치하지 않는다는 것을 인식할 때 가치 갈등(value conflict)을 경험한다. 예를 들어, 즐거움의 추구와 지속 가능한 교육을 모두 중요하게 여기며 여가를 말하는 소비자는 텍사스의 오스틴 시티 리미츠(Austin City Limits)와 영국의 글래스튼베리(Glastonbury)와 같은 음악 축제에 참석하기 위해 차가 공원으로 후속 이용해 다른 주 국가로 여행할 때 가치 갈등을 느낄 수 있다. 이 경우 그 사람은 나중에 이 행동을 정당화하거나 자신의 죄책감이 약해질 수 있다.\n 가치는 아이들이 우선적으로 학습하는 것 중 하나로 가치 체계는 적어도 10살 정도 될 때 자리를 잡는다. 11장에서 살펴본 것처럼, 사람들은 준거집단 및 기타 영향에 노출됨으로써 이루어지는 사회화 과정을 통해 가치를 학습한다. 따라서 교육에 높은 가치를 두는 많은 부모님이 대졸을 다섯기 때문에 그리고 부모님과 선생님들은 이러한 가치를 강력히 가르치게 때문에 있다. 개인들은 조직과 문화 속에서 다른 사람들에 대한 노출 속에서 이 가치를 학습하게 된다. 동일한 집단에 소속된 사람들은 흔히 유사한 가치와 가치 체계를 유지한다.\n 문화 변용(acculturation)은 개인이 새로운 문화에 대한 가치와 해위를 학습하는 과정이다(12장 참조). 예를 들어, 미국에 도착하는 이민자들은 미국 생활에 대한 새로운 가치를 배우고, 자신의 가치 중 일부를 전달한다. 소비자들은 새로운 문화의 매력점이자 자신이 수용한 가치를 갖고 있다고 여길 때 그 문화에 대한 가치를 재택할 가능성이 높다. 또한 문화 변용은 새로운 문화 속의 사람들의 응집력이 있을 때, 그들의 가치를 명확하게 전달할 때, 자신이 가진 가치에 자부심을 표현할 때 더 빠르게 일어난다.7", "source": "20261114_145054.jpg"}, {"kind": "heading", "text": "14-1a 사람들이 가지고 있는 핵심 가치", "source": "20261114_145058.jpg"}, {"kind": "paragraph", "text": "사람들의 개인적인 가치는 그 구체성에 따라 다를 수 있다. 가장 광범위하고 추상적인 수준에서 핵심 가치(core values)는 개인의 가치 체계의 핵심을 나타낸다. 이러한 매우 지속적이고 강하게 유지되며, 추상적인 가치는 많은 상황에서 적용된다. 예를 들어, 서구 문화의 많은 부모들이 자유의 가치를 가르치기 때문에, 이 가치는 서구의 삶의 많은 영역에 스며들어 있다. 있는 그대로의 자유, 하고 싶은 것을 할 자유, 원하는 대로 옷을 입을 자유, 그리고 원하는 곳에 갈 자유에 대한 믿음으로 이어진다.\n 개인들이 그들의 가치를 형성하는 데는 다양한 방법이 있다. 심리학자 밀턴 로키치(Milton Rokeach), 그리고 샬롬 슈워츠(Shalom Schwartz)의 연구를 포함한 많은 영서를(는) 주장한다. 한 연구에 따르면 사람들은 서로 영향을 미치는 연구에 따르면, 그림 14-2는 하나의 가치 범주에 포함된다. 대부분의 학자 들은 핵심 가치를 두 종류의 가치를 포함한 두 부류로 나누어 어떤 가치 범주 안에서 핵심 가치 목록이 7종류 공통적으로 포함한다. (1) 성취, (2) 안전, (3) 사회적, (4) 인상적인 영향성, (5) 유능성, (6) 용감함, (7) 자기 결정이다.\n 7개 영역 내에는 수많은 가치를 담고 있다. 슈워츠는 이 가치 유형의 포괄적 가치가 존재한다. 궁극적 가치(terminal values)로 묘사되는 이 가치는 추상적이고 바람직한 종착 상태이며, 수단적 가치(instrumental values)으로 표시된 것은 어떤 원한는 특정 상태에 도달하기 위해 필요한 가치들이다. 예를 들어, 친사회적 향이 있는 두 가지 유형의 궁극적 가치는 공동체 구원이다. 이러한 궁극적 가치를 성공하는 태 사람, 용서, 도움, 정직, 신의심 같은 수단적 가치들이 도와준다.\n 이 체계는 두 가지 상의 범주와 가치를 포함한다. 성욕, 안전, 친사회적, 헌장적 순으로 가치는 ‘타인의 안정을’ 중요성을 공통적으로 포함하며, 유능성, 용감, 성취, 자기 결정 가치는 ‘자아의 성장’의 중요성을 공통적으로 포함한다. 그림 14-2는 늦은 보여 준다. 유사한 가치는 표면에서 가깝게 배열된다. 두 개의 넓은 가치 클러스터 내의 가치는 유사하며, 표형의 반대쪽에 있는 가치와는 다르다.\n 사람들은 모든 가치를 동일한 정도로 중요하게 여기지 않을 수 있으며, 현재 삶의 단계에서 가장 중요하게 여겨지며 미래에서 덜 중요하게 여기는 가치로 자연스럽게 옮겨질 수 있다. 따라서 중용적 가치 (예: 건강, 내적 조화, 가족 조화)를 중시하는 것과 목표로 한, 야망, 성공에 가치를 두어야 하는 것 사이에는 긴장이 있을 수 있다. 예를 들어, 젊은 바티로 젊므 쉬브로는 자기 자신을 손해보게 하며 즐거움을 제공하려고 노력하려는 것과 손님들이 음주 후 운전하지 않도록 안전을 책임지는 것 사이에서 갈등을 겪을 수 있다.\n 핵심 가치는 소유물, 소비, 일, 여가, 가족, 교육, 환경 등 다양한 생활 영역에서 소비자 행동에 영향을 미치지만, 때로는 미미한 영향을 미친다. 핵심 가치는 특정 생활 영역에 특화된 영역별 가치(domain-specific values)와 다르며, 예를 들어 소비자 건강과 같은 특정 생활 영역의 특수한 가치들과 관련된 가치이다. 핵심 가치와 특정 영역의 가치는 범위는 다르지만 중요성과 관련된 특정 영역에 가치이다. 핵심 가치는 특정 영역의 가치(예: 건강)는 하나 이상의만, 이들은 함께 개인의 가치 체계의 일부를 이루며, 특정 영역의 가치(예: 건강)는 하나 이상의 핵심 가치를 달성하는 데 수단이 될 수 있다(예: 성취감과 자기 존중).", "source": "20261114_145058.jpg"}, {"kind": "heading", "text": "핵심 가치 분할 모형", "source": "20261114_145103.jpg"}, {"kind": "paragraph", "text": "핵심 가치 분할 모형은 원형으로 배열된 일곱 개의 주요 가치를 포함하고 있다. 일부 가치는 자기 지향적(self-oriented)인 반면 다른 가치는 타인 지향적(other-oriented)이다. 예를 들어, 향유(enjoyment)와 자기 결정(self-direction)은 자기 지향적 가치이며, 질서체계(prosocial) 가치와 순응을(resrictive conformity) 타인 지향적 가치이다. 일부 가치는 성과(achievement)나 성장 지향적(growth-oriented)이며, 성숙(maturity)과 보안(security)은 안정성 지향적(stability-oriented) 가치이다. 인접하여 서로 가까운 것으로 나타난 가치는 융합되는 특성을 보유하며, 반대쪽에 위치한 가치는 주로 상반되는 특성을 지닐 수 있다. 조사된 두 가지 가치(instrumental values)는 바람직한 행동 습관을 나타내며, 광표로 표시되는 수단적 가치(instrumental values)는 바람직한 중간 상태를 나타낸다. 원형 안으로 표시된 인물의 속성 역시 이러한 가치의 하나이다. 첫째, “타인과 안정” 가치는 정직, 충성, 순응, 연세, 사회질서, 국가 안보, 가족 안전, 건강, 소속감, 친구와 사교성을 반영한다. 둘째, “자아와 성장” 가치는 즐거움, 흥분, 자기 존경, 성취, 자기 결정, 영향력, 모험의 연대에서 인물에게 지시할 행동을 지배한다. 향유는 안락한 삶, 만족, 행복, 쾌활한 삶을 포함한다.\n한편 인쇄에서 순서대로 배열된 네 가지 도구적 가치와 네 가지 최종 가치는 무엇인가? 이러한 가치가 서로 충돌하는 경우가 있는가? 언제 그러한 일이 발생하는가? 당신에게 특별히 중요하고 유용한 세 가지 또는 네 가지 궁극적 가치와 수단적 가치는 무엇인가? 이들의 주변 환경에 매우 다른 가치를 지닌 사람들은 있는가?", "source": "20261114_145103.jpg"}, {"kind": "heading", "text": "14-1b 글로벌 소비자 문화를 특징짓는 가치", "source": "20261114_145106.jpg"}, {"kind": "paragraph", "text": "가치는 소비자 행동에 중요한 영향을 미치며, 시장이 더욱 글로벌화되고 있기 때문에, 마케터들은 글로벌 소비자 문화를 특징짓는 가치를 이해할 필요가 있다. 세계 각국의 사회가 고유의 문화와 규범을 유지하고 있지만, 국가 간 교류의 가속화와 범례의 증가, 전 세계 온라인 연결성, 공유 교육 및 업무, 이주, 자원, 제품, 아이디어의 광범위한 유통, 글로벌 브랜드, 연예인, 미디어 등의 이유로 점점 더 글로벌 소비자 문화의 일원이 되고 있다. 현실은 글로벌 소비자 문화는 특정한 특성을 가진 하나의 삶에서 출현하고 있다는 것이다. 많은 학자들은 글로벌 소비자 문화를 특징짓는 11개의 영렬한 가치를 설명하고, 증가하는 상호 연결성 및 소셜 미디어(14장 서두의 스냅 촛감 참조), 전화하는 가족 구조13(3장을 갈은 다른 구성 요소를 이정 각기장에서 다루었다). 이 장에서는 가계 구조의 변화, 남성의 가장 역할 변화로 남녀의 자아와 성격 간의 관련성에 미치는 영향, 구체적으로 물질주의, 쾌락주의, 개인주의, 위약과 미래 지향의 가치들이 포함된다. 이들은 결국 소비자의 삶의 질을 증로이고, 이러한 가치는 소비자의 삶의 양식, 성격, 자기 정체감에 제각기에 중요하며, \n 물질주의\n 글로벌 소비자 문화에서 영향력 가지 중 하나는 물질주의(materialism)이다.12 사람들은 물질적 소유물로부터 큰 행복과 만족을 얻을 수 있도록 댐, 많은 물질주의적인 가치관을 가진 사람들은 아울의 행위 자체보다 결과물을 중요시고, 더 많은 물질 소유가 자신들을 전체 더 행복하게 것이라고 믿으며, 자신이 속한한 집단의 소유와 양과 중요성을 통해 사회 성공을 측정한다. 물질주의적인 개인들은 자동차, 보석, 브랜드 같은 고가치의 소비재를 새는 경향이 있다(그림 14-3 참조). 또한 구체적인 물질적 소유물은 감각적, 자의, 의미마에 헤워드라와 같은 상징적 물품, 갖고 싶은, 물질주의가 높은 사람들에게 더 중요하다.13 \n 물질주의자들은 자신이 감당할 수 있는 것보다 더 많이 신채를 지게 되는 경향이 있다. 이성은 이들의 구매가 일시적으로 중대케하고 위해 실제보다 더 많을 소유한 할 것이라고 예상기 때문에 것이다.14 물질주의 소비자들은 더 큰 집, 더 많은 차, 더 비산 옷을 가치를 더 행복해질 것이라고 믿으며, 이러한 행복, 증가는 종종 일시적이기 때문에 이 많은 스트레스와 우울과 전반적 웰빙 감소를 경험할 수 있다.15 사실, 물질적인 소유를 과 돈에 너무 많은 중심을 두면 사회적 관계들로부터 자신을 오묘로 만들고, 이로 인한 이들의 고독감은 우울즈움으로 전짐되였다. 그럼에도 소비자들이나 후회 활동에 가치를 두는 소비자는 가치 갈등을 경험할 수 있다.16 물질주의자이로 동시에 사회 참여 활동에 가치를 두는 소비자도 있다. 불전체의 소유는 보다 웰빙을 더욱 감소시킨다.17 물질주의적인 소비자들도 긍정적인 측면도 있다. 물질적인 소비는 창의적 자율 가치와 연관되는 데 학교와 직무 위해 열심히 일할 수 있게 하고, 가족과 친구와 지위 지적 생활을 하는 데 전반적인 웰빙을 향상킬 수 있다.18 멕, 검색과 쇼핑 자체가 즐거움을 추구 전반적인 높도에 소비자들, 이를 등러하기 시작한다 경제 불황 시기에 물질주의의 높온 가치를 도였던 소비자들은, 더 현격리 시작한다. 그들은 긍정적인 경험, 소규모 구매, 내구성 있는 구매에서 쵝락적 가치를 찾기 시작한", "source": "20261114_145106.jpg"}, {"kind": "paragraph", "text": "다.19 영화 스트리밍 서비스 이용, 친구 및 가족과의 사회적 모임, 공동 요리 파티 등 경험에 집 중하는 것은 이러한 경험과 관련된 긍정적인 감정이 물질적 소유물보다 더 오래 지속되기 때 문에 합리적이다.20 겨울 코트, 비디오 게임 콘솔, 태블릿 컴퓨터와 같은 내구성 있는 구매에 대한 지출도 이치에 맞는데, 이는 이러한 제품이 오랜 기간 동안 지속적인 경험을 제공하기 때 문이다.21\n 물질주의는 그림 14-2의 여러 가지 가치와 관련이 있다. 예를 들면, 소유물은 사회적 인 정을 얻기 위한 수단적 가치의 한 형태로 기능할 수 있으며, 즐거운 쾌락을 제공한다. 이러한 가치는 소비자 자신에게, 그리고 세대를 거쳐 미디어, 상업 환경, 프로모션 활동, 특정 특정 사회화 관행을 통해 부모에서 자녀로 전해진다.22 물질주의는 또한 기본적인 생존 욕구에서 발생할 수 있다. 공포 관리 이론(terror management theory)23과 같은 관점에 따르면, 물질주의 는 의 불가침성과 관련된 믿음으로 형성되기 위해 부분적으로 물질적인 기호를 사용한다. 불가침성은 반면, 공산사회나 특정 종교 단체에서 구성원들은 물질적 소유물 자체를 원치 않는 선택을 하며, 이 장에서 더 자세히 설명하겠지만, 일부 사람들은 물질주의와 관련된 절약과 물질적 단 순함의 삶을 살려고 한다.24\n 쾌락주의\n 글로벌 소비자 문화의 하나는 쾌락주의(hedonism)로, 맛있는 음식과 음료, 음악, 쇼핑 휴 가, 스포츠 이벤트, 친구들과의 교제 등과 같은 재미있고 기분 좋은 경험을 즐기는 것이다. 쾌락주의 경 향은 많은 국가의 소비자에게 공통적이다.25 쾌락주의는 핵심 가치 범후의 항구 가치와 밀레니 얼 세대와 같은 세대 범주의 한 형태일 수 있다.26\n 예를 들면, 매콤한 맛의 음식은 바비큐 요리, 고추 피클, 후이퐁 푸드(Huy Fong Foods)가 제 화치킨 소리라차와 같은 매운 소스를 포함하고 좀 핫라고 한다. 이제는 타바스코(tabasco) 몇 다른 미국 회사에서도 이러한 소스를 판매하고 있다. 사실, 유명한 캐러핀즈(Barry Callebaut)사는 초콜릿에 매콤한 고추를 넣은 제품을 개발하고 있다.\n 또 다른 예로, 신체 수행과 관련된 건강한 쾌락이 있는데, 운동, 일부 음식, 레저 활동 모두 그 예다. 과학 연구에 따르면, 건강한 소비자 라이프스타일은 쾌락주의에 따른 건강에 대한 우려에도 불구하고, 소비자들은 맛이 좋지 않으면 저지방, 저칼로리 제품으로 전환하지 않을 것이다. 사실, 한 연구에 따르면 소비 자들은 건강한 음식이 맛이 없다는 직관적인 인식을 가지고 있다.28\n 개인주의\n 글로벌 문화는 개인주의를 중시한다.29 개인주의와 독립성을 중시하는 것은 사양용 부족 를 소유하는 것처럼 강렬하게 경험할 수 있지만, 대중교통을 이용하는 것보다 자신의 자동차 를 소유하는 것을 중시하거나, 팀 스포츠(즉구보다는 개인 스포츠(골프, 자전거 타기, 달리기 를 즐기고, 의사의 상담하기보다는 자기 치료를 하는 것으로 표현될 수 있다.\n 일반적으로 개인주의의 문화에서조차도 상호 의존성과 사회적 관계를 선호하는 타인 중심 적(allocentric) 소비자가 있다. 반면, 개인 중심적(idiocentric) 소비자는 개인의 자유와 자주성을 더 중시하는 경향이 있다. 이 두 유형의 소비자들의 행동은 이러한 차이를 반영한다. 개인 중 심적 소비자들은 스포츠와 모험, 재정 모험, 도박, 브랜드에서 더 많은 위험을 보이려 하고, 비자들의 전체 집단을 위한 일반적 선택을 선호하지 않는다. 개인 중심적 소비자의 선택 선호는 선택 집단의 크기에 따라 달라진다. 소규모 집단의 경우, 자신과 타인의 선호를 잘 알지 반영", "source": "20261114_145111.jpg"}, {"kind": "paragraph", "text": "은 선택을 하지만, 대규모 집단의 경우 자신의 신호를 더 강하게 반영하는 선택을 한다.30 타인 중심적인 소비자들은 건강, 샴페인, 독서, 음식 균형에 더 많은 관심을 보인다.31\n 일과 여가의 균형 모든 문화에서 일과 여가의 가치가 동일하지 않다. 미국에서는 기업의 구조 조정, 생산성 강조, 실질 소득 감소로 인해 소비자들이 그 어느 때보다 더 열심히, 더 오랫동안 일하고 있다. 실제로, 미국 직원의 70%는 휴가중에도 최소한 일과 시간 동안 일을 했다.32 많은 소비자들은 휴먼 리소스 때문에 연휴와 휴가를 가지지 못했다고 보고했있다. 후불유나 일과 여가에 두는 중요성은 다르며, 유럽의 30개국 중 벨기에, 프랑스, 이탈리아, 네덜란드, 염은 여가 시간을보다 더 중요하게 여기는 사람들 비율은 영국, 네덜란드, 프레인, 스페인에서 매우 높았고, 체코공화국, 알바니아, 아르메니아, 조지아, 불가리아에서 매우 낮았다.33 많은 소비자들은 더 오랜 시간을 일하기 좋아도, 여가 시간을 돈만큼 소중하게 여기며, 여가 활동에 더욱 많은 시간을 할애하기 위해서는 비용을 지불할 것이다. 예를 들어, (Amazon)(미국), 크로거 (Kroger)(미국), 까르푸하이퍼마쉐(carrefour Hypermarches)(프랑스), 에데카 첸트랄레(Edeka Zentrale)(독일), 테스코(Tesco)(영국)은 고객들에게 식료품 배달 서비스를 제공하는 이러한 기관들로 소비자들은 주간 식품 쇼핑의 짐을 덜 수 있게 했다. 영국의 고릴라(Gorillas)와 즉시 배달 식료품 쇼핑에특화 소형 창묵업 플링크\u001c(flink), 게티르(Getir), 고릴라스(Gorillas)와 같은 국내 신생 업체들은 즉시 배달 식료품 쇼핑에서 점점 성장하는 폭풍우 수준으로 30분 이내에 집으로 배달받기를 원하는 고객들을 대상으로 한다.34 많은 소비자가 느낄 때 시간당 임금을 받지 않거나 혹은 받을 수 있는 사람들뿐만 아니라, 일련의 마케터와 기업가들이 고객들에게 몇 달동한 참석 할수 있는 기회를 제공하기 때문에, 운동과 브릴의 참여, 음악회, 영화, 문화 축제,스포츠 그리고 기타 단체활동을 좋아하는 사람들을 위한 테마 크루즈의 인기가 높아지고 있다.33\n 과학기술 많은 문화권의 소비자들은 기술 발전에 매료되고 끌린다. 이러한 매력에 대한 애정을 ‘테크노필리아(technophilia)라고 부르기도 한다. 미국, 일본 및 기타 국가의 소비자들은 컴퓨터, 스마트폰, 태블릿, 스마트워치, 인터넷, 모바일 Wi-Fi가 그들의 삶의 필수적이라고 믿고 있다(인터넷) 반믄을 이용하고 있다.35 그럼에도 불구하고, 기술 발전이 너무 빠르고 그 결과가 알려지지 않아 소비자들이 따라가기 어려울 수 있으며, 얼굴 인식이나 홍채 스캔과 같은 기술은, 최근성을 무력화하고, 중고에서 개인 가치 전통 같은 자율성을 무력화하기 위해 매개된 능력을 나타낼 수 있다. 이와 같은 상황에서, 여전히 일부는 상시 감시, 로봇 트럭, 입증되지의 인각 리 대매, 심인 도움말 같은 기술의 이류은 면을 두려워하며, 기술을 최소한으로 사용하며 검소하고 단순한 생활 방식으로 전환하려고 한다.\n 건강 미국과 기타 지역의 소비자들은 자존감(사회 외모)과 장수 및 생존을 극대화하기 위해 건강을 매우 중요하게 여긴다. 글로벌 소비자 문화에서 건강 중시는 운동과 지방, 저칼로리, 저탄수화물, 저염, 저청분, 저콜레스테롤을 섭췌뿐만 아니라 특별한 영양 혜택이 있는 음식의 인", "source": "20261114_145114.jpg"}, {"kind": "paragraph", "text": "가를 통해 반영된다. 체중을 조정하고 싶지만 어려움을 겪는 소비자들은 위해 음식의 소량 (“더 작은 봉지에 담긴 진짜”보다 저칼로리 버전(같은 맛, 더 적은 체중) 제품을 선호할 수 있다는 것 비지분은 또한 선별을 안내하기 위해 성분 및 건강 혜택에 대한 간단한 정보 라벨을 제공한 반면, 시간 제약으로 인해 체계적으로 읽히지않고 주목 받지 못한다. 이와는 수행하기 위해, 클립플린드에 있는 데이브 슈퍼마켓(Dave’s Supermarkets)와 같은 식료품점은 지자랑 및 베리, 과일, 채소, 견과 및 주요 요리에 “참! 그레잇 푸드(Go! Food)” 스티커를 사용한다. 건강 의식의 트렌드에 대응하여, 웬디스(Wendys) 패스트푸드 체인은 글루텐이 없는 메뉴를 제공하고 있으며 식단에 모든 전채와 애피타이저가 포함되기도 한다는 점을 소비자에게 알 살충제, 첨가물, 식품 관련 질병 및 오염 물질에 대한 우 환가 증가에 따라 미국의 유기농 식품 수요는 매해 증가 하고 있다. 기분이 좋고, 젊고, 슬림하며 외적으로 매력 적인 것 및 장기의 건강 결과에 대해 우려하며, 이는 유기농 식품 소비 증가로 이어질 수 있다.43 표 14-1에서 볼 수 있듯이, 미 국 소비자들은 모든 카테고리에서 천연 제품을 포함하여 식품 산업 전반으로 유기농 제품을 확대하고 있다. 유기 농 시하는 소비자로 그들이 원하는 소비자들은보다 가격에 민감 한 경향이 있는데, 이는 유기농 식품이 때때로 비유기농 식품 보다 더 비싸기 때문이다.\n클리닉의 등장으로 이어졌다. CVS는 타깃(Target)의 옆구 부서를 인수한 후, 미국 내 CVS 매장 과 타깃의 매장 내 미닛 클리닉(Minute Clinics)을 설치하고 있다. 이 클리닉들은 주로 국가에서 관리해 팔공공 의 혜택인 국고 근지원, 탁제 및 알코올, 경고라벨은 건강 가운데 반영한다. 웰니스 휴가는 생산 웨어 통합 피티클로서 특히 브랜드와 기타 건강 관련 이유로 점점 더 인기를 얻고 있다. 어떤 소 유해 화학물질을 포함하거나 중기를 박출하는 재료를 피한다.46 건강 및 피트니스 앱과 기 는 높은 수요를 보이며 계속 증가하고 있다.47 가치의 행동을 일반화되지 않을 수 있다. 많은 소비자들이 동물과 환경 보호를 중시하고 이에 대해 이야기하지만, 실제로 실천하는 사람은 적다. 미국 성인의 40% 이상이 비타민, 유 럽과 다른 지역에서도 비타민 비음이 증가하고 있다.48 일부 마케팅운동은 지나치게 큰 열 양이나 키지를 제공하게 비판을 받고 있으며, 많은 일부는 유기농 식품보다는 새롭게 과다 또는 부족한 성분에 의 비난을 받고 있다. 가격에 민감한 소비자들은, 싱글스클럽(Sam’s Club)이나 코스트코(Costco)와 같은 창고형 클럽 대형 할인 매장에서 식료품을 구매한다. 이렇게 구입한 식료품은 대용량 팩이므로 더 늘 탐, 지방, 칼로리를 소비하게 될 가능성이 있다.49 이러한 우려로 인해 패스트푸드 레스토랑의 실 요 메뉴에 영양 정보를 게시하고 있다. 맥도날드는(McDonald’s)는 메뉴판에 포함된 모률 함 양을 줄이기 각 주문이 샐러 조감울 포함시와 아이들이 더 건강한 음식을 선택하도록 장려할 있으며, 클레멘타인데와 요거트와 같은 신선제품을 제공하고 있다.50", "source": "20261114_145118.jpg"}, {"kind": "heading", "text": "젊음", "source": "20261114_145120.jpg"}, {"kind": "paragraph", "text": "글로벌 소비자 문화는 젊음을 매우 중요하게 여긴다. 이는 노화의 징후를 방지하거나 줄이기 위한 다양한 제품(주름 크림, 염색약, 모발 이식)을 통해 입증된다. 로레알(Loreal)과 같은 회사들은 미국, 중국, 인도에서 남성과 여성을 대상으로 얼굴, 메이크업, 기타 미용 제품을 제공하며, 온라인 채널을 통해 판매량을 늘리고 있다.5) 12장에서 설명했듯이 나이 든 이른 세대 소비자들은 더 활동적이고 젊어 보이려고 노력한다. 성형 수술은 전 세계적으로 남녀 모두에게 가장 빠르게 성장하는 의료 산업 중 하나이다.\n이러한 가치들(몸짱주의, 쾌락주의, 개인주의, 일과 여가의 균형, 기술 매력, 건강 중시, 중용 등)은 글로벌 소비자 문화를 특징짓는 ‘자아의 성장’ 개념을 포함한다.\n글로벌 소비자 문화에서 발견되는 네 가지 가치는 그림 14-2의 핵심 가치 목록 왼편의 ‘단일 소비자의 성격, 인간성, 행동, 감정과 순응의 중요성’을 포함하여, 경쟁적, 집합적, 이러한 가치는 집 소비자들은 집을 더욱 중요하게 여기고, 가깝고 편안하며 매력적이고 편안하게 만들기를 원한다. 미국 가정의 경우, 집은 가족이 함께 모이는 가장 중요한 장소이다. 요즘 외식이 점점 더 보편화되면서, 점점 더 많은 미국인들은 집에서 음식을 조리하고 있기 때문에, 소비자들은 좋은 품질의 부엌용품에 많은 관심을 두고 있다. 많은 사람들은 연결의 기회도 찾는다. 집과 직장 분위기, 가정 구성원들이 외부 세계에서 느끼는 스트레스에 대해 가장 세심히 조정하고자 하였다. 집은 소비자들이 휴식을 취하는 가장 개인적이며 안전한 장소로, 문제를 잊고 가족, 스튜디오, 노트북을 포함한 기술을 사용하여 휴식을 취할 수 있게 해 주며, 브랜드와 인터넷 연결을 유지할 수 있게 한다. 집은 또한 따뜻하고, 편안하고, 안정적인 느낌을 줄 수 있는 개인적 피난처이며, 이는 이케아(IKEA)와 같은 가구 회사가 잘 이해하고 있다(그림 14-4 참조).\n가족과 자녀 문화마다 가족과 자녀에 두는 가치가 다르다. 예를 들어, 아시아와 유럽의 부모들은 미국 부모들보다 교육을 더 중시하는 경향이 있다. 아시아 중산층 가정에서는 자녀 교육은 음식 제공 다음으로 우선순위에 있다! 글로벌 소비자 문화에서도 자녀에게 높은 가치를 둔다. 기업들은 직원들에게 제공하는 휴가를 통해 특히 육아 휴가 기간을 늘리고 있으며, 페이스북 창립자 마크 저커버그(Mark Zuckerberg)와 같은 유명 인사들은 육아 휴가를 사용해 새로 태어난 아기와 시간을 보내는 것의 장점을 공개적으로 지지하고 있다.\n미국 부모들은 일반적으로 자녀 관련 제품들에 대해 매우 까다로워며, 많은 문화권에서도 마찬가지이다(그림 14-5 참조). 예를 들어, 레고의 본사인 덴마크의 레고(LEGO)는 이제 전 세계에서 가장 큰 장난감 회사가 되었으며, 많은 가정에서 아이에게 해리 포터와 스타워즈에 나오는 주인공들만 만들고 싶어", "source": "20261114_145120.jpg"}, {"kind": "paragraph", "text": "하는 자녀를 위해 플라스틱 블록을 구매하고 있다.55 장난감, 게임 및 기타 놀이 도구는 말할 필요도 없이 수없이 많은 시리얼, 주스, 디저트, 청량음료 및 기타 스낵 제품이 어린이들을 표적으로 하고 있다. 특정 제품 범주의 브랜드는 어린이로 표적을 옮길 때 마케팅에 대한 사회적 염려와 관심이 적용된다. 예를 들어, 패션제이는 이제 어린이 건강에 대한 우려로 어린 이용 패스트푸드와 뮤비 목록도 장난감을 제공하는 것을 금지하고 있다.56\n 진본 전 세계 사람들은 진본(authenticity)을 중시한다. 이들은 1873년에 제조된 최초의 리바이스(Levi’s) 501 청바지와 1951년에 제작된 최초의 펜더(Fender) ‘정기’ 베이스 기타와 같은 원래 물건, 또는 현재의 리바이스 501이나 펜더 프리시전 베이스와 같이 과거의 중요성을 보존하고 계승한 상품에 있는 실재성(authen ticity) 지향에 관련이 있다. 이러한 가치는 역사, 전통성, 우정, 애착, 의미, 성장감, 자기 존중 등을 포함한다. 이러한 가치를 지지하는 소비자들은 값싼 모조품이나 위조품의 진품보다 현실 덜 가치 있게 여긴다. 소비자는 진본적인 브랜드에 대해 가까운 애착을 느낀다. 예를 들어, 진본인 가족은 진실되고 진정한 상호작용과 자녀 관심을 염려 속 또는 장난 및 가족 행사에서 축하하며 즐기는 가족을 나타낸다. 진본을 갖는 맥주 브랜드보다 더 진본은 조건이다.59 소비자 경험을 진정하여 때문에 가치 있게 여겨질 수 있다. 예를 들어, 일부 소비자들은 동네 곳곳 카페숍에서 에스프레소를 마시는 것을, 세계적인 그리고 일련된 점포 내 브랜드 경험을 지닌 스타벅스나 커피 빈 전략보다 더 진짜라고 믿는다. 장인 예술가들이 만든 맞춤형 수제 기타는 어디에서도 구할 수 없는 진짜 제품으로 인기가 점점 더 높아지고 있는 것은 밝혀졌고, 진본 및 실재성의 가치가 증가하고 있다.60 그러나 브랜드의 혜택에 대해 지나치게 진정하고 정직하게 말하는 것은, 폐쇄 제품의 경우 반발을 불러일으킬 수 있으며, 이러한 제품은 만소 과정을 필요로 할 수 있다.\n 환경 환경 보호와 지속 가능한 소비는 전 세계적으로 중요한 가치가 되었다. 소비자들은 천연 자원을 보호하고, 오염을 방지하며, 자연 세계를 지속 가능하게 유지하려, 환경 친화적인 상품, 서비스 및 활동을 지지하는 데 점점 더 관심을 가지고 있다. 이는 모든 소비자에게 해당되지만, 특히 12장에서 설명하였듯이, 이 세계에 태어난 주마(Zoomers)와 알파 세대에 해당된다. 업들도 소비자들의 이러한 환경 가치를 기반으로 자신들이 명성을 쌓고 있다. 전 세계 모든 회사들은 지속 가능성 규정을 준수하고 소비자 요구에 부응하기 위해 철저히 플라스틱 포장을 교체하고 있다. 혼다 시빅(LEAF)과 토요타 프리우스(Prius)는 더 깨끗하게 운행되며 연료 효율이 높기 때문에 ‘구매자를 끌어들인다’고 말한다. 테슬라(Tesla), 르노(Renault), 포드(Ford) 등 여러 자동차 제조업체들은 전기차 수요의 증가를 경험하고 있다. 2020년, 테슬라는 더 넓은 시장에 이", "source": "20261114_145125.jpg"}, {"kind": "heading", "text": "14-1c 가치가 변하는 이유", "source": "20261114_145127.jpg"}, {"kind": "paragraph", "text": "를향해 위해 첫 크로스오버 차량인 모델 Y를 출시했다(그림 14-6). 환경에 대한 관심은 세계 곳곳의 생태 관광에 대한 인기를 높이고, 자원봉사자들이 멸종 위기 야생 동물을 돕는 체험형 휴가의 수요를 증가시키고 있다.\n 소비자의 친환경 행동에 반응하는 다양한 요인이 있다. 잘 재처리된 재정거래 비용, 흐름과 위험. 단일한 방식으로 바꾸는 어려움, 타기적인 따돌림과 아웃파웃도 있다. 또한 남성과 여성 모두 감동을 여정적으로는 고정 관념을 가지고 있어 남성의 친환경 행동을 저해할 수 있다.63\n 14-1c 가치가 변하는 이유\n 사회의 제도들이 끊임없이 진화하기 때문에 가치 체계도 변화하고 있다. 장기적인 연구 결과에 따르면, 에미드, 유럽의 가치 체계는 전후 2차 세계 대전이 지나온 뒤 큰 세대별, 성 역할의 변화, 현대적인 것에 주목하는 방향으로 움직이고 있다. 100년 전의 미국은 서유럽과 달랐지만, 다른 문화권(그리고 오늘날은 전통 엘리트 집단만이 아니라 전반적으로 포함하고 있는 가치 면에서 더 유사해지고 있다. 비록 아직까지 선진국 소비자와 개발도상국 소비자 간에 가치를 일치하지는 않지만, 부분적으로는 문화적 차이보다는 경제적 차이에서 기인하는 것으로 보인다. 그래서 전 세계의 가치 체계는 완전히 접근할 않기 때문에, 마케터들은 목표 시장의 소비자 가치를 깊이 이해하기 위해 광범위한 조사를 해야 한다.\n 14-1d 가치의 영향 요인\n 소비자 집단 사이에 가치들이 어떻게 다른가? 이 절에서는 문화, 민족, 사회계층 및 연령이 가치에 영향을 미칠 수 있는 방식에 대해 살펴본다.\n 문화와 가치\n 사람들은 점점 더 글로벌 소비자 문화의 일원이 되고 있다. 하지만 각기 다른 나라의 사람들은 다양한 문화적 경험에 노출되기 때문에, 가치에 있어서 분명하고 현저한 문화적 차이가 생긴다. 한 연구에 따르면, 브라질인들 사이에서 중요한 세 가지 가치는 진정한 우정, 성숙한 사랑, 행복이며, 반면 미국 소비자들은 가족의 안전, 사회 평화, 자유를 중요한 가치로 꼽았다.64 또 다른 연구에서는 브라질 소비자들은 자신이 이룩한 성과를 보존하는 것, 타인에 대한 존경, 쾌락, 즐거움, 행동, 명성 등을 통합하는 것을 중요하게 여긴다. 일부 가치는 국경을 넘는다. 28개국의 결과를 살펴본 결과, 물질주의에 대한 강조가 집단 수준에서 제품에 대한 중요성의 대변으로 연관되어 있음을 발견했다.65\n 고전적 연구에서 기어트 홉스테드(Geert Hofstede)는 문화가 네 가지 핵심 가치 차원에 따라 다를 수 있음을 발견했다:66", "source": "20261114_145127.jpg"}, {"kind": "paragraph", "text": "장, 성공, 경쟁 같은 남성적 가치(홉스테드의 정의)에 의한를 강조하는 정도\n • 힘의 균형: 사회 구성원들이 지역 수준에서 동등한 정도\n 문화는 이 네 가지 차원을 기준으로 분류할 수 있다. 어느 네 가지 차원의 일부는 그림 14-2의 핵심 가치 복합 문화와 잘 맞아떨어진다. 예를 들면, 개인주의에 친화적인 가치는 자아 지향적 가치와 타인 지향적 가치에 대응한다. 남성성 대 여성성 차원은 성취 대 친사회적 가치에 대응한다.\n 주어진 문화가 어디에 위치하는지 이해하면 교차 문화적 차이의 대한 통찰을 제공할 수 있다. 예를 들면, 힘의 균형 및 복합성과 회피가 낮고 여성성 가치가 강화된 개인주의 성향이 높은 국가들의 경우에는 레스토랑에서 팁을 줄 가능성이 낮은 것으로 나타났다.67 또한 남성성과 불확실성 회피가 높은 국가에서는 스포츠 및 팬덤에 열에 대한 가치 만족도가 더 높은 반면, 미국과 독일과 같은 힘의 균형 및 복잡성이 높은 국가 소비자들은 평범한 광고보다는 재미있고 유머러스하며, 재미있고 창의적인 독창적 광고를 더 선호한다.68\n 마지막으로, 미국 남성들은 일상 소비를 통해 행동 지향적인 사업으로서의 자아 유지를 지지하는 경향이 있다.이는, 높은 남성성이 높은 문화에서 가치 있어서 간단한,70\n 민족 정체성과 가치\n 더 큰 문화 내의 민족 집단은 다른 민족 하위문화와 다른 가치를 가질 수 있다. 122장에서 논의한 바와 같이, 하층사회의 Hispanic, 아프리카 미국인들은 특정 집의 가치를 부여하고, 아프리카 미국인 사이에 미국인 소비자들. 매가치는 높은 가치를 부여한다.71 다른 국가의 소비자들도 다른 민족적 가치를 가질 수 있다. 예를 들면, 중국의 소비자는 지역을 이유로 페레로 브랜드를 찾아, 특히 선물을 하는 상황에서는 프리미엄 브랜드를 고려한다. 이를 모두 페레로(Ferrero)는 프리미엄 초콜릿 브랜드로 포지셔닝하고 모든 선물 상황에 적합한 날뛴 포장으로 탈양으로써 중화지 수익을 올렸다?8\n 사회 계층과 가치\n 서로 다른 사회계층은 13장에서 설명한 바와 같이 특정한 가치들을 지니고 있으며, 이는 그들의 취득과 소비 패턴에 영향을 미친다. 동유럽 및 라틴 아메리카 국가들이 시장경제를 받아들이에 따라 물질주의와 삶에 대한 정부 통제의 감소와 정치 및 종교적 그리고 이념적 가치 등 동유럽 국가집단과 함께 조정으로 조차는 국가들이 증가하고 있다. 최상류층은 고비자동차를 자워을 갖고 있으며, 이들이 사회적, 문화적, 시민운동 등에 활동적인 이유를 설명해 주는 사회 확인의 가치를 둔다. 이들은 또한 주택, 의류, 자동차 및 다른 형태의 소비를 통한 자기표현을 숭오히 여긴다.73\n 연령과 가치\n 같은 세대에 속한 사람들은 다른 세대들의 가치들과는 다른 비슷한 가치를 공유한다.정치적 경험과 자아 탁비, 그리고 자아의 시대인 1960연대에 자라난 베이비붐 세대는 개인주의, 도덕감, 자기 결정 및 성취에 가치를 둔다. 12장에서 설명했던 것과 같이, 특정한 생활양식 같은 특정 가치가 태연, 사람들이 살고 있는 시기, 또는 그들의 생업형 들(cohort)에", "source": "20261114_145132.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261114_145134.jpg"}, {"kind": "paragraph", "text": "소비자들은 일반적으로 자신이 누리고 있는 가치와 일치의 위해 제품을 구매하고, 서비스를 이용하며 소비자의 가치 지향적 특성이 마케터의 그들이 여는 전략에 대한 반응에 영향을 미친다는 것이다. 이러한 소비자는 동질한 가치를 공유한 집단을 이루는 사람들이며 이처럼 가치를 기반으로 하는 집단은 거의 모든 구입 행동에 잠재력이 있다는 것이다. 따라서 구매 가능성이 높은 가치를 두고 마케터는 소비자 대상에 대한 가치를 이해하고 그런 집단을 표적으로 삼을 수 있다. 예를 들면, 마르크스 &amp; 스펜서(Marks &amp; Spencer)는 값싸고 유행을 따르는 것보다 고품질의 전통적인 디자인에 우선순위를 두는 시장에 표적으로 삼고자 했다. 프로크터&amp;갬블(Proctor&amp;Gamble)의 레이서블블레이드는 소비자들이 현재 사용하는 면도기보다 더 나은 면도기를 사용하길 원한다는 사실을 알고 있다. 헤자와헤김은 가족에 대한 소중한 가치를 지향하는 소비자그룹에게 광고 문안을 개발하기 위해 자녀를 둔 여성의 도시화를 모색하면서 큰 성공을 거두었다. 새로운 제품이나 서비스를 개발할 때, 소비자들은 자신들의 가치를 잘 알고 있을 때보다 새로운 상품을 생산하는 데 사용될 특정 가치를 찾는 일에 훨씬 부주의할 수도 있을", "source": "20261114_145134.jpg"}, {"kind": "heading", "text": "14-1e 가치 측정 방법", "source": "20261114_145139.jpg"}, {"kind": "paragraph", "text": "가치를 기준으로 시장을 세분화하려면 마케터들은 먼저 관련 소비자들의 가치를 식별하고, 그 중요성을 평가하며, 가치의 변화나 트렌드를 조사해야 한다. 이는 도전적인 작업이다. 가치는 중앙적인 믿음이기 때문에 믿음의 이유와 일치하지 않거나, 변화 또는 개인적인 가치에 관해 깊이 생각하고 이야기하지도 못한다. 따라서 마케터들은 소비자의 가치를 평가하기 위해 다양한 비계량적(질적인) 및 질적(직접적인) 방법을 사용한다.\n 문화유산으로부터 가치 추론하기\n 비계량적 방법 중 하나는 광고, 브랜드 및 제품, 여론 조사, 텔레비전 프로그램, 패션 같은 사회의 문화적 유산을 조사하여 가치를 측정하는 것이다. 광고는 사회의 거울이며, 이로 인해 광고는 사회적 가치를 반영한다. 예를 들어, 지도리가 실시한 연구는 미국의 1960년대, 1970년대, 1980년대에 광고 카피 속에 나타난 가치에 대한 연구는 신용의, 가족, 현대성, 자유, 설득, 독특함의 가치를 반영하여 등장한 가치를 밝혀 냈다. 이 연구 결과에 따르면 과거 문화적 차이가 가치 트렌드에 반영돼서 나온 것을 알 수 있다. 예를 들어, 대만, 홍콩 및 한국은 전통적으로 강한 가족 제도와 애국심을 발견할 수 있다. 대만과 홍콩은 더욱, 대만, 홍콩, 한국 광고의 많은 것에서 발견된다.\n 일치하는 달을 강조하여 광고의 주제를 강조한다. 한국과 과거 가난했던 것의 정체성을 내세우고, 광고는 실용적인 주제를 강조하며 더 나은 삶을 약속했고, 홍콩의 광고는 부의 쉬운 삶을 강조했으며, 대만의 광고는 두 도시 사이의 책임과 위엄보다는 전통이 더욱 강하게 강조됐다.\n 마케터들은 제품과 브랜드 이름을 조사함으로써 가치를 추론할 수도 있다. 미국에서는 물질주의(그랜드 하이스트(Grand Hyatt) 호텔), 쾌락주의(옵세션(Obsession) 향수), 시간단축주의(루손 피자), 가족주의(버저비 쿡 파스타(Ronzoni Quick Cook Pasta)), 과학기술(마이크로소프트(Microsoft)), 편리함(레디-윕 토핑) 같은 가치를 반영하는 제품 명칭이 흔하다. 차는 또한 집념의 상징 (예: ‘마니(Monney), 과거 영화 제목, TV 프로그램, 콘서트 이름은 그들 자신 또는 제작자, 작가, 배우 등의 반영이다. 예를 들어\n 의 버지니(Buzzy Bee)와 같은 브랜드는 뉴질랜드 국민은 우리의 국가 문화에 대한 자부심을 상징한다.\n 소비자의 가치를 문화유산에서 추론하는 것은 간접적이어서 그들의 개별적인 반응과 관련성에 한계가 있다. 또 다른 한계는 문화의 가치 차이가 모두 상품의 광고나 브랜드에 반영되지 않는다는 것이다. 이러한 도전을 해결하기 위해 직접적인 질적 및 질적인 가치 측정 방법이 사용된다.", "source": "20261114_145139.jpg"}, {"kind": "heading", "text": "수단-목적 사슬 분석", "source": "20261114_145141.jpg"}, {"kind": "paragraph", "text": "마케터들은 수단-목적 사슬 분석(means-end chain analysis)을 통해 소비자들이 제품에 대해 중요하게 여기는 속성을 더 잘 이해하여 소비자들의 가치를 파악할 수 있다. 수단-목적 사슬 분석은 원래 전쟁성 이론과 개인의 이론으로, 제품과 브랜드의 속성과 소비자들의 더 깊은 개인적 가치 사이의 연관성을 파악하려 한다. 이 방법은 정량적 설문 조사에서만 사용할 수 있나? 이 장의 초반에서는 연구들이 소비자들이 어떤 속성을 선호하면 소비자들이 의사판단에 얼마나 영향을 미치는지를 분석했다. 예를 들어, 한 연구자는 칼로리가 낮다고 하고, 다른 맥주는 그렇지 않다고 한다. 한 단계에서는 한 연구자가 소비자가 어떤 속성을 선택하는지를 분석하고 본다. 다른 단계로는, 칼로리가 낮은 맥주를 선호하는지를 연구한 후, 왜 그 제품을 구매하는지를 또 추론해 본다. 3단계에서는 연구자가 ‘왜’ 소비자가 칼로리가 낮은 맥주를 선택하는지를 더 심층적으로 질문한다. 3단계에서는 연구자가 왜 소비자가 칼로리가 낮은 맥주를 선택하는지를 분석한다. 한편, 다른 연구자는 칼로리가 낮은 제품을 선호하면, 해당의 제품이 칼로리는 낮지만 가격이 비싸다면, 다시 ‘왜’ 중요한지를 묻는다. 여기에서 중요한 점은 소비자들이 중요하게 여기는 속성은 매우 다양할 수 있지만, 동일한 속성이 모든 소비자들에게 같은 의미를 갖는 것은 아니라는 점이다. 또 어떤 소비자는 동료들과 어울려 맥주를 마시는 것을 더 좋아하기 때문에 친구들과의 사교 상황을 더 중요하게 생각할 수도 있다. 이에 따라 마케터는 소비자들이 맥주를 선택할 때 중요하게 생각하는 속성을 찾고, 그렇게 해달라고만 말할 수 있다.\n 그림 14-7에 제시된 수단-목적 사슬에는 여러 계층이 주목이 있다. 먼저, 소비자는 중간 속성에 이어 수단적 가치(예: 소속감)를 중요하게 여긴다. 그런 다음 소비자는 이러한 속성이 자신이 원하는 궁극적 가치에 미치는 영향을 고려한다. 궁극적 속성은 최종 상태인 긍극적 가치(예: 사회에서는 자신감 있게 원한 수단을 제공하기 때문에 이러한 전체 과정을 수단-목적 사슬이라고 한다.", "source": "20261114_145141.jpg"}, {"kind": "heading", "text": "가치 질문지", "source": "20261114_145146.jpg"}, {"kind": "paragraph", "text": "그림 14-7은 특정 제품 속성이 매우 다른 혜택과 가치와 연관될 수 있음을 보여 준다. 예를 들어, 라이트 맥주의 ‘칼로리가 적다’는 속성은 제품 증거 바탕의 상위레벨인 혜택으로 이어지며, 이는 결국 건강존중과 소속감이라는 두 가지 궁극적 가치를 이끈다. 두 번째로, 가치는 매우 다른 제품과 속성과 연합될 수 있다. 예를 들어, 라이트 맥주의 ‘칼로리가 적다’는 속성과 속젓살에 밑일 수 있는 붕지에 담겨 나온다는 속성은 둘 다 소속감이라는 궁극적 가치에 어필할 수 있다.\n 마케터들은 수단-목적 사슬 분석을 사용하여 특정 가치와 일치하는 제품 속성을 선별할 수 있다. 또한, 소비자들은 자신의 겉모습과 다른 사람이 자신을 어떻게 생각하는 가에 기인하여 ‘중요한’ 관계가 있다고 여긴다. 그래서 제조업체들은 이러한 관계에 가치에 기반하여 호소할 수 있다. 예를 들어, ‘소속감’이라는 가치는 경쟁 브랜드와 비교해 다양한 이점과 혜택을 제공하는 특정 가게에 어필할 수 있다.\n 마케터들은 수단-목적 사슬 분석을 이용하여 특정 제품 탐색과 관련된 사실을 발견할 수 있다. 일부 소비자들은 가게에 대한 경험을 잘 알고 있으며, 나리한 관계와 속성이 연관된 가치를 안다. 광고를 개발하는 데 있어, 그들은 입력과 소비자들과 상호 긴장감을 조성하려 하는 경향이 있다. 또한, 소비자들이 중요시하는 가치를 활용하는 광고를 통해 그들의 마음을 끌 수 있다.\n 예를 들어, 광고가 솔직하고 저렴함을 강조하는 반면, 소비자들은 다른 가치(당신의 생활과 호흥: 매일 아침의 즐거움 등)를 강조할 때, 소비자가 막무가내로 연결할 수 있게 된다면 그러한 선택을 용기값이다.\n 마지막으로, 마케터들은 수단-목적 사슬을 사용하여 브랜드 시장을 세분화하고 특정 혜택과 관련된 가치에 기초하여 소비자에게 어필할 수 있다. 예를 들어, 요구르트를 먹을 때 제품의 맛과 영양 가치를 중요하게 생각하는 소비자들에게는, 높은 프로틴 함유와 저지방을 강조하는 제품 속성 설명을 두어 제품의 장점을 설명할 수 있으며, 흡연을 걱정하는 소비자들에게는 다른 속성을 강조함으로써 그들의 불안과 고민 완화 같은 속성을 통해 이 시장에 도달할 수 있다(그림 14-8 참조).\n 가치 질문지\n 마케터들은 질문지를 이용하여 직접적으로 가치를 평가할 수 있다. 문헌적 가치 척도 답은 일부 직무자들은 소비자 행동의 특정한 본원에 관해 해설한다. 9가지 전반적인 부분과 일부 다른 전반적인 문맥, 이와 관련된 널리 알려진 것이 로키치 가치 조사(Rokeach Value Survey, RVS)이다. 이 질문지는 그림 14-2에 설명된 19개의 수단적 가치와 18개의 궁극적 가치를 합해 소비자가 부여하는 중요도를 조사한다. 이 질문지는 표준화되어 있어, 모든 응답에 대한 범용적 세트의 척도다. 연구문헌은 “특정 소비자 그룹에게 가장 중요한 가치를 확인하고, 시간이 지남에 가치가 안정적인지, 소비자 그룹 간에 어떤 가치가 변했는지, 그리고 어떤 가치가 행동에 영향을 미치는지를 확인하는 데 도움이 된다.", "source": "20261114_145146.jpg"}, {"kind": "heading", "text": "14-2 개성", "source": "20261114_145148.jpg"}, {"kind": "paragraph", "text": "RVS에서 파생된 효율적인 가치 도구는 가치 목록(list of values; LOV) 등과 같이 시장세분화 및 포지셔닝을 위해 사용될 수 있는 더 작은 가치 세트를 추정한다.96 일부 설문 조사 프로젝트는 일, 주택, 복지 등 다양한 생활 영역에 걸쳐 소비자 가치를 체계적으로 추적한다. 예를 들어, 1981년부터 46개 유럽 국가에서 소비자 가치를 조사한 유럽 가치 조사(EVS)가 있다.97\n 14-2 개성\n 비슷한 배경을 가지고 동일한 문화권에서 자란 사람들은 유사한 가치를 가지는 경향이 있다. 그러나 동일한 가치를 가진 사람이라도 개성의 차이로 인해 동일한 방식으로 행동할 필요는 없다. 가치가 비하면 차별적, 상반, 또는 사건에 대한 믿음이라면 개성은 더 포괄적이다. 개성(personality)은 행동과 생각, 감정, 느낌, 반응에 영향을 미치는 행동으로 일관성을 가지는 것을 의미한다. 이런 행동은 개인의 선천적인 성향과 후천적인 경험의 상호작용에서 구상되는 감정, 생각, 행동, 동기의 개인적 패턴을 포함한다. 개성의 개념은 소비자 행동을 이해하는데 도움이 되며, 같은 자극에 대해 더 넓은 수준의 소비자 행동에 미치는 영향을 파악할 수 있다. 잘 알고 있는 것처럼 기업의 세분시장의 규모는 더 작아질수록, 한 소비자 집단이 소비자 행동에 비치는 인과 관계의 일관성이 증가함에 따라 효과의 크기는 일반적으로 더 작아진다. 예를 들어, 갑자기 전에 관심을 갖는 것처럼 개성은 편집호에, 라이프스타일은 생활 전체에 영향을 줄 수 있다. 그러나 이러한 태도가 우리가 수집한 정보에 반응하는 뉴스를 선택하는 데도 영향을 미친다는 점은 고려할 수 있다. 개성 특성은 주가 행동 모두에 영향을 미칠 수 있지만, 일반적으로 더 적은 영향을 미친다.\n 14-2a 5요인 성격 모형\n 성격 이론가들은 사람들의 사고, 감정, 행동 패턴을 주도하는 몇 가지 핵심 특성 또는 차원을 식별했다. 이 특성들이 다양한 삶의 영역에 반복표로 표현되는 생활양식 기초를 가지고 있다는 증거가 있다.98 비록 이러한 특성이 구체적인 이름과 순서도 연구자와 연구마다 다를 수 있지만, 인간 성격에서 일반하게 나타나는 다섯 가지 차원이 탐색되었다. 이 핵심 특성들은 5요인 성격 모형(Big-Five personality traits) 또는 요인 모형(‘Big Five’)이라는 불린다.\n5요인 성격 모형은 신경증성(신경질), 외향성(외향성), 개방성(개방성), 우호성(우호성), 성실성(성실성)이다. 이들은 기억하는 데 OCEAN 또는 CANOE라는 약어가 도움이 될 수 있다.100\n 신경증성(neuroticism)은 불안과 같은 부정적인 감정과 기분 변화를 경험하는 경향이다. 이는 사람이 불안하고 불안정하며 감정기복이 심한 것이 아니라 편안하고 자신감 있으며 쾌활하게 있는지를 나타낸다. 신경증성이 높은 사람들은 감정적 반동성과 정서적 부적응 경향을 자주 포함한다.\n 외향성(extraversion)은 외부 세계의 교류를 즐기고 적극적으로 추구하는 경향이다. 이는 사람이 더 열정적이고 사교적이며 단호하고 활동 지향적이 어며 더 민감지 않고 조용하게 혼자 있는지를 나타낸다. 외향성이 높은 사람들은 다른 사람들과의 상호작약과 대화를 자주 포함한다.\n 개방성(openness)은 새로운 경험, 아이디어, 감정 및 모험을 더 적극적으로 추구하는 경향이다. 이는 사람이 지적으로 호기심이 많고 창의적이며 미학하며 예술에 민감지 아니며 더 실용적이고 전통지에 현실지적인지를 나타낸다. 개방성이 높은 사람들은 지적 호기심과 경험에 대한 욕구를 자주 표현한다.\n 우호성(agreeableness)은 사회적 조화를 즐기고 적극적으로 추구하는 경향이다. 이는 사", "source": "20261114_145148.jpg"}, {"kind": "paragraph", "text": "이 더 도움이 되고 권위에 존중하며 용의하는지 아닌지를 넘어 더 경쟁적이고 논쟁적이며 자기 중심적인지를 나타낸다. 우호성이 높은 사람들은 자주 동정심이 넘치는 것으로 표현된다.\n 성실성(conscientiousness)은 성격 차원상(적극적이고 자기가 훈련된(자제력) 경향이다. 이는 사람이 더 야망적이고 조직적이며 집착이 있는지 아니면 더 즉흥적이고 쉽게 산만해져 활동성이 있는지를 나타낸다. 상실성이 높은 사람들은 자주 근면한 사람들로 표현된다. 5요인 성격 모형은 사람들의 평균적인 성격의 사회경제적 및 성과의 수준과 관련을 보여준다(그림 14-9 참조). 예를 들어, 한 연구에서 여성은 남성보다 외향성, 우호성, 신경증 수준이 더 높다고 보고했다. 또한, 한 대규모 연구에 따르면 개방성 특성은 성격 증가와 장기 행동과 좁은 긍정적인 관계가 있으며 신경증 특성은 재정적 이득과 직장 성과 수준을 부정적인 관련이 있다고 한다. 성실성 특성 중 진심성 속력은 지능과 부정적인 관련에 있다. 또한, 외향성, 개방성, 성실성 특성은 미래의 주관적 웰빙과 긍정적으로 관련이 있었며, 신경증 특성은 부정적으로 연관되어 있다는 증거도 있었다. 이성감 수준이 높은 사람들은 더 큰 자기 통제력을 획득했다. 미래의 소비자 의사소통, 신경증 수준이 높은 사람들은 재정적 제약을 더 받았다는 경향이 있었으며, 외향성 수준이 높은 소비자들은 “자포감이 브랜드 로열티를 감소시켰다”고 한다.106 즉 소비자들은 우호성 특성 및 흥미로운 브랜드 개성을 가진 장난감과 비디오 게임에 대한 선호도 사이에 긍정적인 연관성을 나타내었다. 우호성과 몇 개방성 특성은 브랜드 호불호에 긍정적인 관계가 있었다.\n 연구자들은 설문 조사와 요인 분석과 같은 통계 기법을 활용하여 5요인 성격 모형을 연구한다. 이러한 기법은 사람들이 유사하게 응답하는 많은 조사 항목들로부터 요인의 수를 선택한다. 예를", "source": "20261114_145154.jpg"}, {"kind": "heading", "text": "14-2b 소비자 행동에 영향을 미치는 구체적인 성격 특성", "source": "20261114_145159.jpg"}, {"kind": "paragraph", "text": "들어, 사람들의 규율을 지키는 것, 질서를 유지하는 것, 의무를 다하는 것을 측정하는 질문에 유사하게 응답하기 때문에(제거된 점수 혹은 낮은 점수), 이 세 항목은 실성적 특성 차원으로 구성된다. 또한, 5요인 성격 모형을 측정하기 위한 다양한 종합적인 도구가 있다.107 예를 들어, NEO-PI-R 성격 검사 도구는 240개의 항목을 포함한다.108 HEXACO 성격 검사 도 구는 100개의 항목과 6개의 성격 요인들을 포함한다.109 심리 측정 측정이 우수한 효율적인 측정 도구 중 하나는 10항목 성격 검사(TIPI)이다.110 그림 14-10은 이를 제시한다.\n 14-2b 소비자 행동에 영향을 미치는 구체적인 성격 특성 5요인 성격 모형은 소비자 행동을 해석 내지는 예측할 두며, 특정한 몇 가지 행동보다는 많은 행동에 조금씩 영향을 미치는 경향이 있다. 연구자들은 소비자 행동에 더 강한 영향을 미치는 다양한 구체적인 특성을 식별했으며, 앞으로 더 많은 발견이 있을 것이다. 이러한 구체적인 특성들", "source": "20261114_145159.jpg"}, {"kind": "paragraph", "text": "은 성격 특성과 개인적 가치를 결합한 것이기 때문에 각각 자아와 성장 특성, 타인과 안정성 특성으로 구분할 수 있다. 자아와 성장 특성에는 인지 욕구, 독창성 욕구, 쾌락 지구 수준, 경쟁력이 포함된다. 타인과 안정성 특성에는 자기 성찰과 독단성이 포함된다. 두 그룹의 특성을 연결하는 특성으로 통제 소재가 먼저 설명되고, 그다음에 다른 구체적인 특성들이 소개된다.\n 통제 중심\n 사람들은 좋은 결과나 나쁜 결과 또는 사건을 내부 원인이나 외부 원인으로 귀인하는 경우가 다르며, 이를 통제 중심(locus of control)이라고 한다.111 내적 통제를 하는 사람들은 더 많은 책임을 자신에게 귀인시키므로, 제품이 실패했을 때 자신을 탓하거나 부족했다고 여길 수 있다. 반면, 외적 통제를 하는 사람들은 실패의 원인을 다른 사람, 사건, 오늘도 불운과 같은 외부 원인에 돌린다. 따라서 그들은 실패의 결과를 잘못된 제품 품질이나 형편없는 서비스 제공업자에게 귀인한다. 마찬가지로 소비자들은 소비자의 만족 및 불만족 판단, 재구매 의사 결정, 소비자 불평 등에 귀인하기도 한다. 통제 중심은 소비자의 만족 및 불평과 선택을 예측하는 주요 결정 요인으로, 10장에서 살펴보았다.112\n 통제에 대한 강한 욕구는 있지만 이를 발휘할 수 없는 능력이 낮다고 느끼는 소비자들은 스포츠 경기에서 팀의 성패를 신경 쓰지 않거나 불평으로 이어지지 않게끔 자신의 행위를 통제할 수 있다. 마찬가지로 상태에 따라 달라지는 통제 중심은 상황에 따라 변한다. 예를 들면, 사치를 소비하는 것은 이 상황에서 실질적으로 나타나는 유연한 통제 중심이다. 통제 중심이 있는 사람들은 자신을 포함해 타인에게 어떻게 느끼는지에도 영향을 미친다. 소비자가 자신의 장단점을 잘 볼 수 있다고 생각한다면 좋은이 좋지 않은 날이 바로 앞에 있다고 생각할 때 더 자주 시차 보상을 소비를 하게 된다. COVID-19 팬데믹 동안 독일에서 수행된 한 연구에 따르면, 내부 통제 중심은 자신의 건강 상황을 이해하고 통제 매개 질병을 예방하기 위한 상생 행동을 예측했다.113 또한 외부 통제 중심은 규칙을 지키려는 행위의 감소와 관련 있었다.114 통제 중심은 5요인 성격 모형의 개방성과 자기 열정이 자기 존중 가치와 관련된 지적 경향이다. 이는 행동의 원인으로 인식하는 자기 자산(내적자)과 타인(외적자)을 포함한다.\n 인지 욕구\n 제품, 속성, 혜택 등에 대해 깊이 생각하는 것을 즐기는 소비자들은 높은 인지 욕구(need for cognition, NFC)를 가지고 있다.116 이 특성은 5요인 성격 모형의 개방성과 그 지적 측면, 그리고 자기 방향 가치와 관련이 있으며, 특히 개방적 사고, 지적 탐구, 논리적 사고와 관련이 있다(그림 14-2 참조).\n 높은 인지 욕구를 가진 사람들은 생각하는 것을 좋아하지 않으며, 직관을 명확하거나 자신의 감정에 의존하는 것을 선호한다. 흥미롭게도, 인지 욕구는 고유와 연관이 있지만 그것도는 강하지 않다. 따라서 경제적 상황 등으로 인해 교육 수준이 낮더라도 높은 인지 욕구를 가질 수 있다. 인지 욕구가 다양한 소비자들은 제품 관심도, 정보 탐색, 다양한 정보 원천에 대한 반응에서 차이를 보인다. 구체적으로 인지 욕구가 높은 소비자는 즉흥적 구매 행동이 상대적으로 낮으나 분석적으로 정보를 처리하고, 경험을 통해 정보의 정확성을 평가하고 제품과 경험을 접근한다. 이들은 새로운 제품 기능을 알려주는 정보를 즐기며, 그러한 제품이나 서비스에 대한 세부 사항이 포함된 광고를 선호하고 정보를 깊이 긍정적으로 반응한다. 또한, 이들은 다른 소비자들보다 메시지를 더 신중하게 검토하며, 메시지의 신뢰성이", "source": "20261114_145206.jpg"}, {"kind": "paragraph", "text": "나 가치를 고려한다.117 반면, 낮은 인지 욕구를 가진 소비자들은 매력적인 모델, 유머, 또는 기 타 단서를 사용하는 짧은 메시지에 더 긍정적으로 반응한다. 이러한 사람들은 생각이 거의 필 요 없는 결정을 내리는 경향이 있다.\n 독특성 욕구 상품과 서비스의 구매, 사용, 자포, 처분을 통해 독특한 위치와 경험을 추구하는 소비자들은 독특성 욕구(need for uniqueness, NFU)를 나타낸다.118 독특성 욕구는 세 가지 행동 차원을 포 함한다. 창의적 반대 일치 선택(소비자의 선택이 사회적 규범을 반영하면서도 다소 차별화된 노력인 경우), 금지된 또는 일치 선택(소비자의 비동조의 강도를 감수하면서도 독특함을 확립 하기 위해 기존에 순응하지 않는 대안을 선택하는 것), 마지막은 과잉 희미행동(정상적인 물 건에 대한 흥미를 잃고, 규범을 따르며 독특함을 재확립하기 위해 노력하는 것) 등으로 나타난 다는 5요인 성격 모형의 개방성과 그 경험 추구, 그리고 독립적이고 상상력이 풍부한 자기 방향성을 포함한다.\n 한 연구에서, 독특성 욕구를 가진 소비자들이 자신의 결정을 설명하도록 요청받았 을 때, 비전통적 선택을 하였고, 그들의 선택과 이유가 규범에서 벗어난다는 것을 인식하고 있었다.119 미리보기에서 독특성 욕구를 가진 소비자들은 잘 알려진 글로벌 브랜드를 피하고 소규모의 지역 브랜드를 선호할 수 있다.120 또한, 이들은 너무 인기를 끌게 될 옷을 착용하고 새로운 패션 트렌드를 만들 수도 있다. 맞춤형 아이템의 중요한 점은, 제품은 자신만의 사양에 맞 추어 맞춤화될 수 있다. 이는 이 장의 도입 예시에서 설명한 바와 같다.\n 최적 자극 수준 사람들은 각기 다른 최적 자극 수준을 가지고 있다. 최적 자극 수준(optimal stimulation level: OSL)은 사람들이 지루함(자극이 너무 낮을 때)과 스트레스(자극이 너무 높은 때) 사이에서 찾 고 확보하는 이상적인 자극 수준이다.121 사람들은 일반적으로 너무 자극적이거나 전혀 자 극적이지 않은 것보다 적당히 자극적인 것을 선호하는데, 이 자극의 최적 수준은 사람마다 다르다.122 예를 들어, 낮은 자극 욕구를 가진 소비자들은 회나 매우 독특한 메뉴를 제공하는 식당보다는 적당히 창의적인 음식을 제공하는 식당에서 먹는 것을 선호할 수 있다. 다른 사 람들과 비교했을 때, 높은 자극 욕구를 가진 사람들은 더 많은 다양성을 추구하고, 호기심이 많 으며, 위험을 감수하고, 혁신적이며, 반복에 빨리 지루해하며, 심지어 고준도위험 활동에도 참여할 수 있다.123 이 특성 부모, 5요인 성격 모형의 외향성(열정)/개방성(호기심) 특성과 그 리고 즐기움(쾌락), 성취(희망으로 삶), 자기 방향성(낙천) 가치와 관련이 있다. 높은 자극 욕구 를 가진 소비자들은 스카이다이빙, 모험, 파티프 같은 활동을 즐길 수 있다.124\n 경쟁 사람들은 다른 사람을 능가하려는 욕구의 정도에서 차이를 보인다. 경쟁은 5요인 성격 모형의 성실성(끈질성) 특징과, 성취(야망, 유능함, 사회적 인식) 및 자기 결정성(성취감) 가치와 관 련이 있다. 경쟁을 중시 전자 기기와 같은 물질적 아이템의 과시적 소비를 통해 다른 사람들 을 능가하려는 욕구와 연관되어 있다. 또한, 경쟁은 소비자들이 직접적으로(예: 스포츠나 토", "source": "20261114_145209.jpg"}, {"kind": "paragraph", "text": "박을 통해) 또는 감정적으로(예: 스포츠 경기를 관람할 때 다른 사람들보다 더 감정고가 하는 욕구에서) 중요한 역할을 한다.125 경쟁적인 소비자에게 마케터들은 종종 새로운 제품이나 서비스를 가장 먼저 시도하고 구매할 기회를 강조하는 메시지를 사용하는데, 일부 마케터들은 제품에 대한 평시적 브랜드를 줄이고, ‘하고 있는’ 소비자들만의 인식을 할 수 있는 미묘한 차별의 신호를 강조함으로써 성공을 자극한다.126 지도욕이 높은 소비자들은 지위적 소비에 종종참하고, 지식이 높은 지역의 소비자들에 비해 경쟁적으로 알 수 있는 가능성을 인식할 때에는 경쟁적인 사고방식을 만들어내고 소비를 증가시키도록 자극된다.127 선호 집단에는 친구, 팔로워, 팬, 좋아요, 공유 등의 수로 경쟁할 수 있는 훌륭한 매력적 단위이다.128 이러한 자기타인의 타인 특성 외에도, 소비자 행동에 영향을 미치는 구체적인 성격 특성으로는 자기 성찰의 독선주의 같은 타인과 안녕성 특성이 있다. \n 자기 성찰 개인들은 다른 사람들의 행동 단서를 얼마나 참고하고 따르는지, 즉 자기 성찰(self-monitoring) 수준에 따라 차이가 있다. 자기 성찰이 높은 사람들은 자신의 태도에 맞게 다른 사람들의 요구와 영향을 민감하게 받아들이며, 자기 성찰이 낮은 사람들은 자신의 선호와 욕구에 더 많이 이끌리고 규범적 기대에 덜 영향을 받는다.129 자기 성찰은 5요인 성격 모형의 몇몇 측면(특정한 사회적응성(또는 외 되는) 및 환경성 순응(순종 사회적 규칙과 관련)이 있다. \n 자기 성찰이 높은 사람들과 낮은 사람들은 광고 소스에 대한 반응에서도 차이를 보인다. 자기 성찰이 높은 사람들은 이미지 지향형 광고에 더 잘 반응하며, 높은 자기 성찰 일치하는 이미지를 가진 것으로 광고되는 방식으로 그들의 소비에 사용하려는 경향을 지향하려고 한다. 반면, 자기 성찰이 낮은 사람들은 특정 주장 메시지에 더 잘 반응하며, 제품 사용으로 기대하는 추가 이득을 지향할 의향이 더 높다. 따라서, 마케터는 소비자를 내용으로 분류하기 위한 개념으로 자기성찰에 대한 인식을 갖는 데 도움을 얻을 수 있다. 이러한 연구결과에 따르면, 자기 성찰이 개인의 취향에 강한 영향을 끼치지 않을 경우, 비교대상에 대한 민감성이 높다. 그 결과 자기 성찰이 낮은 소비자들은 또한 타협적 대안을 수용할 가능성이 적고(8장 참고) 선택 대안의 다양성을 수용할 가능성이 낮다. \n 사회적 영향에 대한 소비자의 민감성 자기 성찰과 관련되어 있다고 한다. 일부 소비자는 다른 사람들에 관해서는 자신의 이미지를 합상시키고자 하는 욕구가 더 크며, 따라서 그들의 영향이나 지침을 기꺼이 받아들이려 한다.131 사회적 및 정보 처리 자신감이 낮은 소비자들은 자기 자신감이 높은 소비자들보다 광고에 더 영향을 받는 경향이 있다. \n 독단성 독단성은 사람들의 생각과 행동이 변화와 새로운 아이디어에 얼마나 개방되어있는지를 나타낸다. 독단성을 보연ㄴㄴㄴ(가 낮은 독단 보연, 친사회적으로 응이 되는, 자전적인 집단, 종, 공통, 깨끗함와 관련이 있다. 독단성이거나 폐쇄적인 사람들은 기존 사고방식을 로모션, 새로운 광고에 비교적 적합하는 경향이 있다.예를 들어, 초기 연구 중에는는 나아가 소비자들의 신제품 수용이 그들의 독단성에 달려 있을을 발견했다.132", "source": "20261114_145214.jpg"}, {"kind": "heading", "text": "14-2c 정치 성향", "source": "20261114_145216.jpg"}, {"kind": "paragraph", "text": "정치 성향은 다양한 소비자 행동에 영향을 미치는 중요한 심리적 특성이다. 정치 성향은 사람들이 개인적 가치와 개성 특성과 함께 움직이도록 이끄며, 다른 사람들에게 영향을 미친다. 정치 성향(political orientation)은 사회의 운영 권위와 권리 분배 방식에 대한 사람들의 신념을 나타낸다. 이러한 신념은 더 보수적인 것에서 더 진보적인 것으로 배열될 수 있다. 정치 성향에는 (a) 진중-변화와 (b) 위계-공동체 두 가지 구체적인 차원이 있다. 진중-변화 차원은 사회적 질서, 규칙 및 전통을 지지하고 유지하려는 사람들의 바람을 반영하여 안정과 예측 가능성을 중시하는 경향에 관한 것이다. 반면, 진보적인 성향을 가진 사람들은 변화와 다양성을 추구하는 반면, 진보적인 성향을 가진 사람들은 현재의 사회 질서에 동의하지 않고 변화를 지지하는 편이다. 다음으로 위계-공동체 차원으로 보자면, 보수적인 성향을 가진 사람들은 사회의 위계에 반대하고 평등적 위치를 받아들이는 반면, 진보적인 정치 성향을 가진 사람들은 사회 위계에 반대하고 평등적 위치를 받아들이는 편이다. 따라서 더 진보적인 정치 성향을 가진 사람들은 사회 정의와 평등에 더 큰 비중을 두는 반면, 더 보수적인 정치 성향을 가진 사람들은 강력한 체계 정당성 신념을 가지고 있다. 체계 정당성(System justification)은 사람들이 사회 체계의 공정성, 정당성, 확고함, 또는 옳음에 관해 믿어버리는 신념으로, 사람들은 체계로부터 그것을 유지 받는 것으로 이해한다. 많은 사람들이 믿는 것은 많아야 하는 신념으로, 사람들은 이러한 위계가 있음이 세상의 대부분을 공정하다는 믿음에서 비롯된다. 이러한 권력, 위계, 또는 수직적 불평등 관계를 받아들이는 것은 권력 거리 신념이라고도 한다.\n 정치 성향, 가치, 개성 특성 정치 성향은 개인적 가치와 개성 특성의 네트워크에 깊이 뿌리내리고 있다. 보수적인 정치 성향은 가족 및 국가 안보, 전통, 권력 가치와 같은 보안 가치와, 통솔력, 순응, 정직함과 같", "source": "20261114_145216.jpg"}, {"kind": "heading", "text": "정치 성향의 매력", "source": "20261114_145221.jpg"}, {"kind": "paragraph", "text": "은 제한적 소용 가치와 긍정적으로 연관되어 있다(그림 14-2 참조). 반면, 진보적인 정치 성향은 내적 조화와 평화로운 세계와 같은 보안 가치, 그리고 평등, 공정, 도움과 같은 친사회적 가치와 긍정적으로 연관되어 있다. 5요인 성격 모형의 개성 특성에 관해서는, 보수적인 성향은 성실성, 절제, 정중함과 긍정적으로 연관되어 있으며, 진보적인 성향은 경험에 대한 개방성과 긍정성과 긍정적으로 연관되어 있다. 구체적인 개성 특성에 관해서는, 보수적인 성향은 개인적인 절제, 규율, 환경에 대한 욕구와 양의 방향으로 연관되어 있으며, 진보적인 성향은 복합심리인 대한 관용과 개방적 사고와 긍정적으로 연관되어 있다.137\n 소비자 행동에 대한 시사점 사람들의 정치 성향은 다양한 소비자 행동과 연관되어 있다. 더 진보적인 정치 성향을 가진 사람들은 독특성을 나타내는 제품과 브랜드를 통해 사회적 위계에서 수평적으로 자신을 구별하는 경향이 있다.138 반면, 보수적인 성향을 가진 사람들은, 공공행사나 사교 행사에서 제품을 통해 사회적 위계에서 수직적으로 자신을 구별하려 하며, 여가 활동과 사치적 서비스와 같은 가처분 품의 신호로 사용하는 경향이 있다.139 즉각적인 정치 성향을 가진 사람들에 비해, 진보적인 정치 성향을 가진 사람들은 더 다양한 제품과 혁신적인 디자인을 구매하고, 새로운 휴대폰, 자동차, 정오용품, 화장품, 가전 등 새로운 설계 제품을 시도하는 경향이 있다.140 이에 비해, 진보적인 성향을 가진 사람들은 보수적인 성향을 가진 사람들보다 보물을 더 도와 준다고 느끼는 제품에 더 많은 관심을 가진다. 뿐만 아니라, 보수적인 성향을 가진 사람들은 친례하는 행사 탈락과 같은 조직적인 몸과, 마차, 국가의 스포츠 행사를 후원하는 잘 알려진 공용품 세탁 바구니와 같은 가정용품이 있다. 자녀를 위한 보육 프로그램에 대한 경우 또한, 보수적인 성향은 자기 부모들 느 귀찮은 따분한 프로그램을 허용하는, 개인의 권리를 침해하는 정책이라고 보며, 반대 목소를 결집하는 프로그램을 허용하는 이른 부분들의 개인적 가치와 특성과 일치한다.141 또한, 보수적인 성향을 가진 사람들은 자신이 소비하는 제품과 서비스에 대해 “받을 만한 자격이 있다”는 생각보다는 “받을 만한 가치가 있다”는 믿는 데 때문에, 더 많은 사람들보다 더 만족을 경험할 수 있기 있고, 진보적인 성향을 가진 사람들은 불만족하고, 그로 인해 자신들의 삶에 대한 변화를 제기할 가능성이 크다.142 미국과 15개 유럽 국가에서 조사된 진보적인 성향을 가진 사람들은 정치적 이유로 특정 제품을 구매하거나 보이콧할 가능성이 컸었다.143 관리 거리의 변는 중요성을 줄여 두는 반면, 불완전한 기업의 잘못된 행동에 회의적인 태도를 더 많이 느끼는 경향이 있으며, 이는 해외 인의무 부정적 도덕적 감정을 줄이 반잘못한 기업에 대해 더 부정적인 반응을 보이게 한다.144\n 정치 성향의 매력 명백히, 사람들의 정치 성향은 정치적 영역을 넘어 소비 영역에서도 중요한 영향을 미친다. 그 중요성에도 불구하고, 다음 세 가지 점을 염두에 두는 것이 좋다. 첫째, 정치 성향은 흑백 논리적 특성이 아니며, 두 극단 사이에 무수히 많은 중간적 정치 성향이 존재한다. 둘째, 정치 성향은 전진적 선거를 전환할 전반적 수류 수 있으며, 정치의 특성과 전략도 늘 변한다. 따라서 정치 성향, 미디어 소비, 투표 행동 사이에는 체계적이지만 완변하지 않은 연관성이 있다.145", "source": "20261114_145221.jpg"}, {"kind": "heading", "text": "14-3 라이프스타일", "source": "20261114_145224.jpg"}, {"kind": "paragraph", "text": "둘째, 개인적 가치와 특성 같은 다른 심리적 요인들과 연령, 성별, 소득, 교육, 민족성 같은 사 회경제적 요인이 소비자 행동에 영향을 미치며, 그 영향력이 더 클 수 있다. 예를 들어, 정치 성향이 효과에 비해 사회경제적 지위가 고급차 구매 가능성에 미치는 영향은 매우 새 배 더 컸 다.144 또한, 접근동기유형이라는 성격 특성은 분석에 포함했을 때 정치 성향을 낮춘 고후 고 동인에 대한 전통적 모형과는 매우 다른 곳으로 안내한다.145 정치 성향이 소비자를 분류하는 다양한 상황적 및 문화적 요인에 따라 달라질 수 있다.146 예를 들어, 진보적 정치 성향을 가진 전 사람들은 일반적으로 친환경 이니셔티브와 ‘그린 마케팅 캠페인’에 더 개방적이다. 그려 나 사회보수적 정치 성향을 함대는 소비자로 구성되어 우리가 영향력을 발휘하고자 하는시장을 무엇 책임을 다하는 것에 대해 이러한 친환경 이니셔티브에 더 민감하게 반응할 수 있 다.147 또한, 보수적 정치 성향을 가진 사람들은 목표를 달성할 수 있다고 느낄 때 정치 성향 의 한 계기어 감소경향을 보이기도 한다.148 예를 들면, 진보적 정치 성향을 가진 사람들이, 더 방하게 성장을, 비와 혁신의 관점에서, 바라보는 경향이 있다면, 보수적 정치 성향을 가진 사 람들은 그러한 정치 성향을 가진 사람들보다 일 자리 창출, 안정성, 결과의 관점에서 바라볼 수 있다.149 다음으로, 사회구비성은 사회의 다양성을 수용하는 것이라면, 보수적 성향을 가진 소 비자들은 더 냐용성이 떨어지는 경향이 있다. 반면, 진보적 정치 성향을 가진 사람들은 이러한 못을 극복하기 위해 사회구성원 각각의 도사를 중요하게 생각하는 경향이 있다. 미,희 일반적 인 정치 성향은 소비자 시장을 구조화하는 방식에 중요한 개인적 특성 중 하나이지만, 또한 정 치 성향은 계속한 연구와 이해를 통한 변화를 거쳐야 한다는 점을 이해해야 한다. 정지 성향이 자 활동에 미치는 영향을 고려하는 것은 마케터들에게 매우 매력적이다.\n 14-3 라이프스타일\n 라이프스타일은 소비자의 가치와 개성과 밀접하게 관련되어 있다. 가치와 개성이 소비자 의 일반적이고 장수적인 특성을 나타내는 반면, 라이프스타일(lifestyle)은 소비자의 구체적인 일상 생활 활동·관심사·의견(Activities-Interests-Opinions; AIO)으로 표현된다.152 소비자 라이프스 타일은 개인의 가치와 개성 특성과에 더 큰 연관성 네트워크에 배치되어 있다. &lt;표 14-2&gt;에 요 약해 준다.", "source": "20261114_145224.jpg"}, {"kind": "heading", "text": "14-3a 라이프스타일 패턴과 트렌드", "source": "20261114_145231.jpg"}, {"kind": "paragraph", "text": "사람들이 여가 시간에 무엇을 하는지는 흔히 라이프스타일의 좋은 지표가 된다. 어떤 소 비자는 스키와 같은 야외 활동을 좋아할 수 있으며, 다른 소비자는 웹 서핑을 선호할 수 있 다. 정치적 성향과 견해도 포함 구매, 소비, 재산 의사 결정에 영향을 미칠 수 있다. 154 예를 들면 활동에 참여하고 다른 의견과 관사룰 가진 소비자들은 사실상 마케터들에게 무뚝한 라 이프스타일의 레 서릴 수 있다.\n 또 하나의 라이프스타일 패턴은 시장은 과거에 대한 그리움(nostalgia)을 갖고 있거나 옛 물건 들을 갈망하는 사람들로 구성한다. 154 이 세그먼트는 종종 ‘빈티지’ 제품, 오래된 영화, 콜렉터즈 (collector’s) 아이템, 소설에 관심을 가진다, 그리고 소비자에 어떤 전쟁이 있었떤 제품을 위한 웹 서점을 나타낸다. 이들의 여 러 세그먼트를 좋아하는 TV 시리즈를 따라가며, 그 시리즈, 등장인물, 청소년기와 젊은 성인 한 눈에는 개발은 한 비공식적인 브랜드 커뮤니티를 형성하는 개에 중점을 두고 있다. 시리 즈 브랜든 반드시 연예인나 스포츠기의 아니더라도 된다. 그 이상의 소통하는 문활은 소비자들 사이에 발전하고, 이런 브랜드를 중심으로 구축된 소비자의 커뮤니티는 브랜드 문화와 트렌드를 형성 한다. 예를 들어 진정성, 가정, 가족 및 자녀를 중요시하는 근본적 소비자 문화의 트렌드를 설정 하고 있다.\n 또 다른 예는 쾌락주의에 초점을 맞춘 소비자 세분 시장이다. 이들은 영양가 있는 음식 과 패션에 대한 관심이 낸뎌, 스노브모딩과 같은 육한 소포에 참여할 수 있다. 이 허형 성죄는 냉소적인 예산에 얄린 라이프스타일상 강하다. 이중식는 근본적 소비자 문화의 트렌드를 를 선정하고 따른다.\n 결함; 지속 가능성, 미니멀리즘은 전 세계적으로 부상하 늘 그린 라이프스타일의 세 가지 구성 요소이다. 이런 그린에 선명한 콘텐츠를 가진 많은 미디어와 트렌드에 의해 보급되고 있 다. 경향: 오늘 날 자기 지향적에서, 소비자들은 대개 소비에 대 해 전체적인 관점을 취하고 제품과 서비스를 가장 폭넓을 수 성하는 데 있어 자원으로 활용하는 정도이다. 지속 가능성은 환경 보호와 미래 세대에 대한 책임감에 기반을 잡는다. 156 미니멀 리즘은 소유물을 적게 가지고, 집과 패션에서 간소한 미학을 추 구하며, 신중한 소비를 실천하는 것을 포함한다. 157 그린 라이 프스타일은 우호성과 생산성의 개성 복성과 관련이 있으며, 정 숙(진정한 주의, 유행을 따르지 않는 삶); 종교적 친사회주의; 정치, 사 람) 개인의 가치와 관련이 있다. 이 라이프스타일은 물질 재보다 를 선호하며, 일과 여가 시간 사이의 균형을 찾는 트렌드와도 일치한다. 158 그런 라이프스타일을 가진 소비자처럼,\n 이와 비슷하게 지속으로 받는 요한 수와 음식 관련 라이프스타일을 가 으나 식당에서 먹는 것 대상을 실천한다. 이런한 라이프스타일 은 물질주의적이지 않으며, 다른 사람의 영향력에 따라 행동하기 가라재 가치관 더 의식한다. 159 이 라이프스타일을 가진 소비", "source": "20261114_145231.jpg"}, {"kind": "paragraph", "text": "자원은 가능한 경우 대중교통을 이용하거나, 카풀차량을 통하거나, 혼자서 자전거를 탄다.58) 앞 부분의 기술은 대부분 현재 용돈 수준을 감당하기 위해 이 소비자 스타일을 강요 받았을 수 있지만, 어떤 유형의 소비자인지에 대한 일관된 자신감이 없다면 다른 사람으로부터의 영향을 받기 마련이란 점에서 계속 자신의 습관을 유지하도록 만들지도 모른다. 필자는 이 사람만큼 자 기만의 라이프스타일을 지키기 위해 그렇게 극단으로 치닫지는 않았지만, 그렇다고 하더라도 제니퍼 브랜드에 집착하고, 비싼 옷을 즐겨입거가, 집을 자주 옮겨 다니거나, 자동차를 늘리기 위한 빚 에 소비매몰의 파멸에 빠질 일은 없었다고 말한다.59) 필자는 과거에 자기 자신이나 다른 사람들 을 평가할 때도 그렇게 하곤 했었다고 밝힌다. 예컨대, 삶의 후기 2년 차 소비자들은 새로운 자원 을 소비코프 스타일로 편입할 수 있다고 평가했던 것이다. 오늘날에는 소비자들이 좀더 개인적인 생활과 관련된 관행을 실천의 대상으로 삼는데, 그중에서 22개의 상징성을 탐색한다. 인명과 동 맥시즌, 방문 은사와 같이 지속 가능한 라이프스타일 타이틀과 관행의 중요한 영역들의 삶을 통 제하는 가까운 거리의 목표에 관심이 많다는 점에서, 종업원들의 헌신뿐만 아니라. 또 다른 거 래이며, 모든 가족 구성원들의 삶의 방식에 관여하고 통제하는 숙련된 감독관이 되기도 한다.\n자유로운 활동을 위한 공간을 좁히는 이러한 역할의 행동 가정형, 자원만을 중시하는 가정형, 소비 가치와 연결된 생활을 중시하는 가정형 등은 간단한 가사분담 각본에도 영향을 미치고 있 다.\n 한편, 환경 여행을 포함하는 최근 연구는 다양한 활동의 조합 방식이 자원하는 이들의 유형에 따라 구분됨을 보여주고 있다. 예컨대, 글램핑을 즐기는 이들은 자신들이 의존하는 전기 자원과 같은 자연환경으로부터 공급되는 서비스, 배출되", "source": "20261114_145233.jpg"}, {"kind": "heading", "text": "14-4 사이코그래픽스: 가치, 개성, 라이프스타일의 결합", "source": "20261114_145241.jpg"}, {"kind": "paragraph", "text": "이 장은 사이코그래픽스 연구가 가치, 개성, 라이프스타일 변수를 결합한다는 관점으로 시작했다. 이 핵심점을 설명하기 위해, 마지막 섹션에서는 마케터 연구에서의 여러 사이코그래픽 응용에 대한 간단한 설명을 제공한다.\n 14-4a VALS™\n 가장 널리 알려진 사이코그래픽 도구는 스트래티직 비즈니스 인사이트(Strategic Business Insights)가 소유한, 역전의 가치 및 라이프스타일로 알려진 VALS(Values and Lifestyles)이다. VALS는 집단을 구분하기 위해 두 가지 요인을 기준으로 미국 소비자를 세분화한다. 첫 번째 요인은 자원과, 두 번째는 소비결정의 동기를 포함하여 8개의 집단에서 주요 인구통계적 변수 뿐 또 무엇보다도 중요한 요인은 기본적인 소비결정을 내리는 동기를 사용하는 것이다. 이 모델의 밑에는 세 가지 주요 동기가 존재한다. 기본적인 모티베이션은 개인이 소비자 행동을 유도하는 동기로 보고한 것이다. 예를 들어 행동 중에서 표현되는 자기 개념에는 다양한 모티베이션이 있다. 기본 동기 3개에 의해 동기가 부여된 사람과 다른 사람들의 의견보다는 지적인 관점에서 처리하는 사람들은 성취에 의해 동기가 부여 사람들, 다른 사람들의 보도물과 자신의 성공이 반영된 제품과 서비스를 구매하는 경향이 있다. 자기 현에 의해 동기가 부여된 사람은 사회적 또는 신체적 행동, 다양성, 위험을 선택한다.\n 소득, 연령, 교육 등 주요 인구통계적 변수와 자원 및 동기 변수를 결합한 VALS는 8개의 소비자 집단을 규명했다고(그림 14-15 참조), 자원 계층에서 가장 아래쪽은 소득 수준이 가장 낮은 생존자(survivors)이다. 이들의 초점은 기본적인 일상적 필요충족에 있는 데 있기 때문에 돈을 사용하는 데 신중하고, 유행하는 옷을 입는 데 관심이 없으며, 브랜드 충성도가 높다. 신봉자(believers)는 자원을 적게 갖고 있으며, 이상에 의해 동기부여가 되고, 신앙의 영성에서 영감을 추구한다. 이상에 의해 동기가 부여되는 또 다른 집단은 사고자(thinkers)이다. 그들은 성숙하고, 교육 수준도 높으며, 구매 계획을 세울 때 적극적으로 정보를 탐색한다. 이들은 신봉자에 비해 더 많은 자원을 갖고 있으며 스타일보다는 내구성을 중시하는 가치 지향적인 소비 행태를 보인다.", "source": "20261114_145241.jpg"}, {"kind": "heading", "text": "14장 사이코그래픽스: 가치, 개성, 라이프스타일", "source": "20261114_145244.jpg"}, {"kind": "paragraph", "text": "성취 지향적인 두 집단은 노력가(strivers)와 성취자의 가치관분들은 갖고 있지만 더 성공적인 사람들을 모방하려고 노력하는 사람들과 성취자(achievers)(많은 자원을 갖고 있으며, 직장과 경력을 중시하고, 생산성을 개선하는 기술을 중시하는 사람들)과 있다. 자기표현 집단에서 제작자(makers)는 자급자족을 중요시하고, 도지를 소유하고자 하는 열망이 크며, 야외 활동과 자동차 및 엔지니어링에 관심이 있다. 체험자(experiencers)는 트렌드에 접하는 젊스의 사람이 되는 것(최초로 그것을 하는 것)을 좋아하고, 자극을 추구하며, 매우 사교적이다. 충분한 자신의 삶을 kontrol 할 능용을 가진 혁신자(innovators)는 최상의 자원/반응을 갖고 있기 때문에 세 가지 모든 기본 동기에 어떤 정도 불특할 수 있다. 이 소비자들은 신제품 및 신기술을 수용하려겠지만, 광고에 대해 매우 회의적이다.\n VALS가 잘 알려져 널리 사용되고 있지만, 진행되고 있는 다양한 사이코그래픽 조사가 존재한다. 이들 중 하나인 퓨처스 컴퍼니(Futures Company)의 MONITOR MindBase는 9개의 광범", "source": "20261114_145244.jpg"}, {"kind": "paragraph", "text": "위한 집단으로 구분하는 사이코그래픽 세분화 시스템이다.173 MindBase는 태도, 생활 주기 자료, 성별, 연령 및 기타 인구 통계 변수 요소를 바탕으로 각 집단의 행동 방식과 이유를 결정한 다음 이와 관련한 정보를 마케팅 목적으로 해석한다. 예를 들면, MindBase는 현대적 소비자들은 삶이 매우 바쁘기 때문에 ‘시간이 핵심이다’라는 느낌을 갖고 있다. 따라서 이 집단은 편의성, 맞춤 및 단순화를 중요시한다. 헌렛거 가치만이 있는 사람들은 한 번만 살 수 있다는 유어요한(you only live once)적인 모토로 살아간다. 이들은 자신을 유일한자로 보고 자신의 개성을 자유롭게 표현하며, 창의적이고, 파격적인 제품을 소중하게 생각한다.\n딜로이트(Deloitte), 맥킨지(McKinsey & Company), 닐슨(Nielsen)과 같은 대형 컨설팅 및 연구 회사들은 지속 가능한 소비 라이프스타일, 세대별 소비자 라이프스타일, 해외 라이프스타일 등 특정 소비자 라이프스타일에 대한 연구를 정기적으로 수행한다.174\n 요약\n 소비자들은 사회화와 문화 적응 과정을 통해 무엇이 중요한지에 대한 지속적인 편의의 가치를 배운다. 우리의 가치는 체계적인 가치 시스템 속에 존재하며, 일부 가치는 다른 것보다 더 중요하게 여겨진다. 궁극적 가치는 많은 상황에서 행동을 이끌어내는 바람직한 최종 상태이며, 수단적 가치는 이러한 궁극적 상태에 도달하기 위해 취하는 행동을 의미한다. 핵심 가치는 개인의 가치 시스템의 중심이며, 더 작고 덜 중요한 가치는 특정 행동 영역 내에서 관련이 있다. 문화로부터 소비자 문화로부터 물려받는 가치를 포함하여, 쾌락주의, 개념주의, 인지적 우유, 인간주의 등의 가치는 소비자들이 일상생활 속에서 발휘하는 가치와 행동 가치를 형성하게 된다. 또한, 그룹은 소비자 문화를 구성하여, 가족과 자녀, 친정과, 환경을 포함한 단일적인 소비자 가치 집단을 특성짓는다. 가치는 문화, 대중매체, 경제적, 사회 계층, 연령에 의해 영향을 받는다. 마케터들은 집단의 인구통계적 특성뿐만", "source": "20261114_145250.jpg"}, {"kind": "paragraph", "text": "신발은 더 보수적인 곳에서 더 진보적인 것으로 배열될 수 있다. 사람들의 정치 성향은 더 깊이 자리 잡은 개인적 가치와 개성 특성에 내재되어 있으며, 연령, 성별, 민족성과 같은 사회경제적 특성과 연관되어 있고, 소비자 행동에 반영된다. 따라서 더 진보적인 소비자는 더 가식적 외향성을, 더 다양한 문화와 혁신적인 디자인을 선호하는 반면, 더 보수적인 정치 성향을 가진 사람들은 전통적이고 지위가 있는 상품을 선호하는 경향이 있다. 하지만 두 그룹 모두 적절한 메시지와 규제를 사용한다면 보편적으로 행동할 가능성이 크다.\n 마케터들은 또한 소비자 행동에 대한 추가 통찰을 얻기 위해 행동 패턴, 관심사, 의견으로 이루어진 라이프스타일을 조사하는 데 관심을 갖는다. 절약, 단순함, 지속 가능한 소비는 전 세계적으로 변화하는 라이프스타일의 예이다. 마지막으로, 마케팅 연구자들은 가치, 개성, 라이프스타일에 대한 사이코그래픽 연구를 사용하여 브랜드를 포지셔닝하고, 시장을 세분화하며, 소비자 행동을 예측할 수 있다.", "source": "20261114_145253.jpg"}], "notes": [{"source": "20261114_145039.jpg", "text": "CONSUMER BEHAVIOR 14장\n 사이코그래픽스:\n가치, 개성, 라이프스타일\n 학습목표\n 1. 소비자 행동에 영향을 미치는 인물 가치 와 삶의 가치를 설명하고, 포괄적 소비 가치 척도는 특정 영역의 가치를 식별 하는 데\n 2. 개인의 소비자 행동에 어떻게 영향을 미 칠 수 있는지 설명한다.\n 3. 라이프스타일이 활동, 관심사 및 의견에 의해 어떻게 표현되는지 설명한다.\n 4. 마케터들이 가치, 개성 및 라이프스타일 변수를 결합하는 사이코그래픽스 응용 프로그램을 설명한다.\n 가치, 개성, 라이프스타일(valules, personality, and lifestyles)은, 함께 사이코그래픽스의 근본적인 구성 요소를 이루며, 이는 소비자의 심리적 및 행동적 특성의 가변적인 설명이다(그림 14-1 참조). 마케터들은 연\n 그림 14-1 ▶ 14장의 개관: 사이코그래픽스: 가치, 개성, 라이프스타일\n 이 장에서는 정치, 인종, 사회 계층과 같은 도전 응원 요인의 융핵적이 며 등이 소비자의 행동에 영향을 미칠 수 있는지를 논의 후었다. 이번 장에서는 이러한 인류학적 요인의 개개 요소 즉, 가치, 개성, 라이프스타일이 소비자 행동에 어떠ㅎ 영향을 미치는지를 설명한다. 소비자의 사이코그래픽은 동일한 인류학적 요인을 공유하고 있는 소비자의 구체적 행동 특성을 보여준다 예를 들어 마케터들은 세분화된 인류학적 요인을 바탕으로 소비자의 특별한 욕구와 선호를 파악할 수 있다. 소비자들이 구매하는 브랜드 범주, 프로모션 선호도, 인구학적 요소와 라이프스타일 요소를 결합하면, 특정 대응 전략을 수립할 수 있는데 대표적인 사이코그래픽 프로파일을몇 가지 후술한다.\n 가치, 개성, 라이프스타일은 소비자 행동에 영향을 미치는 광범위하고 다면적 요인들이다. 예를 들어 브랜드 태도는 단기적이며 상황에 따라 시시각각 변화할 수 있는 반면, 소비자의 가치, 개성, 라이프스타일은 시간이 지나도 쉽게 변하지 않는 경향이 있다. 왜냐하면, 소비자의 가치, 개성, 라이프스타일은 시간이 지나도 좀 더 안정적이고 예측 가능한 경향이 있기 때문이다. 브랜드 태도와 특정 행동, 예를 들어, 브랜드 구매 행동은 많은 맥락적 요소에 따라 변화, 소비자의 가치, 개성, 라이프 스타일은 특정 행동의 더 깊은 원인을 파악하려는 경향이 있다. 가치, 개성, 라이프 스타일에 기반을 둔 마케팅 전략은 소비자의 사이코그래픽 구성을 이해 하는 데 필수적이다. 이는 소비자가 어떠한 관점하 행동을 이끄는지와 소비자 행동 트렌드를 예측하는 데 중요하다. 이번 장은 이러한 통찰력을 제공한다.\n 사이코그래픽스 · 가치 · 개성 · 라이프스타일 · 사이코그래픽 응용"}, {"source": "20261114_145054.jpg", "text": "가치, 개성, 라이프스타일 시 간이 지나면서 다양한 소비자들이 유사한 행동을 미치는 비교적 견 해방적이고 안정적인 사유적 특성이 있다. 본 장의 활동이 미치는 영향을 대해 이야기한다.\n 사이코그래픽스 소비자의 개인의 가치, 개성 특성, 라이프스 타일과 같은 심리적 및 행동적 특성에 대해 설명하는 것.\n 가치 체계 여러 가치의 전체 집합 및 이들의 상대적 중요성.\n 가치 갈등 소비자가 특정 행동이 자신의 중요한 가치 중 하 나 이상에 일치하지만, 다른 중요한 가치 중 하나 이상에는 일 치하지 않다는 것을 인식할 때 발생하는 현상."}, {"source": "20261114_145058.jpg", "text": "핵심 가치 사람이 여러 상황에서 가진 강한 신조들을 강화해 가지는 매우 추상적이고 정의된 비이디한 가치로 개인의 가치 체계의 중심에 위치한다.\n 궁극적 가치 동이나 즐거움과 같은 바람직한 종착 상태를 나타낸다.\n 수단적 가치 특정 궁극적 상태에 이르기 위해 사용하는 특정 방식, 즉 특정 궁극적 가치를 달성하기 위한 특정 행동과 관련된 중요한 가치이다.\n 영역별 가치 소비, 건강, 일, 여가, 가족, 교육, 환경 등 특정 생활 영역에 특정 행동 영역에 적용되는 가치이다."}, {"source": "20261114_145103.jpg", "text": "그림 14-2 핵심 가치 분할 모형\n A. 자아와 성장\n 1. 성숙 ● 성숙한 사랑 ● 진정한 우정 ● 자기 존경 ● 아름다운 세계 ● 용감함 \n 7. 자기 결정 ● 성취감 ● 자기 존중감 ● 심사숙고 후의 ● 상상력 ● 개성 ● 자립 ● 독립 ● 논리적 \n 6. 성취 ● 사회적 인정 ● 흥미진진한 삶 ● 야망 ● 유능함 \n 향유 ● 안락한 삶 ● 만족 ● 행복 ● 쾌활한 \n B. 타인과 안정성\n 2. 안전 ● 국가 안보 ● 자유 ● 내적 조화 ● 가족 안전 ● 깨끗한 ● 평화로운 세계 \n 3. 친사회적 ● 구원 ● 용서 ● 순수한 ● 평등 ● 원조정신 ● 정직 ● 사랑 \n 4. 환경적 순응 ● 순종적 ● 공손한 ● 자제력 ● 책임감 ● 예의바른 ● 복종 \n 한국인의 가치 상대적인 가치"}, {"source": "20261114_145106.jpg", "text": "물질주의는 매체와 다른 요인들이 반복적으로 강조하는 중요한 소비자 가치이다.\n 그림 14-3 물질주의 코코, 프라다, 구찌 같은 명품 광고는 물질주의를 만족의 척도를 삼는 소비자들을 타깃으로 한다."}, {"source": "20261114_145111.jpg", "text": "쾌락주의 쾌락주의 즐거움 추구의 원칙."}, {"source": "20261114_145118.jpg", "text": "표 14-1 미국의 유기농 식품 및 식품 외 제품 판매 2006년부터 2022년까지 미국에서 유기농 식품 및 유기농 비식품의 연간 판매는 해마다 급격히 증가하였다.\n 유기농 제품 종류 미국의 판매량(단위: 10억 달러)\n 2006년 2014년 2022년 유기농 식품 $17.2 $35.9 $57.5 유기농 식품 외 제품 $0.9 $3.2 $6.0\n Source: Organic Trade Association, State of the Organic Industry 2015 and 2011, and U.S. Organic Industry Survey 2022, Organic Industry Survey, www.ota.com"}, {"source": "20261114_145120.jpg", "text": "그림 14-4 집에 놓은 가구를 두고 소비자들이 집에 놓을 가구를 두고 많은 시간을 보내면서, 마케터 및 회사들은 집에서 다양한 즐거움을 줄 수 있는 가구들을 만들어 판매하고 있다. 예를 들어, 이케아는 실용성과 장식용 가구를 제공하여 소비자들이 개입할 수 있는 교환 가능한 모양과 같은 가구를 개발하고 있다."}, {"source": "20261114_145125.jpg", "text": "그림 14-5 ▶ 가족과 자녀를 중시하기 광고주들은 게임이나 취미를 통해 함께 시간을 보내는 가치를 강조하여 자녀와의 가족을 표현한다."}, {"source": "20261114_145127.jpg", "text": "그림 14-6 환경 중시하기 환경에 대한 관심과 지속 가능한 소비는 점점 더 중요한 가치 트렌드가 되고 있다. 안전, 기술, 디자인, 엔터테인먼트에 대한 관심이 증가하면서, 이는 테슬라와 모델 Y와 같은 전기차의 판매를 증가시키고 있다.\n 개인주의 대 집단주의: 문화가 집단보다 개인에 중심을 두는 정도 불확실성 회피: 문화가 비구조화된 상황보다 구조화된 상황을 선호하는 정도 남성성 대 여성성: 문화가 삶의 질, 따뜻한 인간 관계, 돌봄 같은 여성적 가치에 비해 수"}, {"source": "20261114_145134.jpg", "text": "마케터들은 글로벌 소비자 문화의 소비자의 특정 가치가 소비 패턴, 시장세분화, 신제품 아이디어, 광고 개발 전략, 윤리적 고려 사항 등에 어떻게 영향을 미치는지를 이해해야 한다. 이는 여러 마케팅 전략과 기업의 전반적인 성과에 영향을 미칠 것이다.\n 시장세분화 마케터들은 공통의 가치를 가진 소비자들을 다른 가치들을 지닌 집단과 구분할 수 있으며, 이러한 과정을 가치 세분화(value segmentation)라고 부른다. 집단 간은 아주 작은 차이일지 몰라도 이러한 방법으로 세분화할 수 있다. 예를 들어, 매년 20억 달러 이상의 성장을 기록하는 화장품 브랜드 아베다(Aveda)는 건강, 내구성, 지역 및 스타일을 중요하게 여기는 소비자를 포함한 다양한 가치 세분 시장을 대상으로 하는 제품들을 판매한다. 마케터들은 또한 특정 세분 시장의 소비자들이 선호하여 구매한 브랜드를 유사한 속성들로 구성된 브랜드들 속에서도 더욱 쉽게 발견되고 싶어 하기 때문에 이들이 브랜드를 통한 상징적 의미를 찾아내는 데 매우 중요한 역할을 해야 한다고 생각한다. 여러 가지 및 고급스러운 같은 속성들 가운데 하나를 발전시키는 사람들은 가격 및 고급스러운 같은 속성을 소비자들에게 하고, 모바일과 아웃도어는 자연을 중요하게 여기는 사람들을 겨냥한 브랜드로 유명하다. 그리고 또 다른 속성을 중요하게 여기는 음식은 새로운 스타일을 좋아하고 비주류 스타일을 찾을 것이다. 예를 들어, 비디 슐덤(Bloody Shulder) 부트는 고객과의 친밀도를 강조하며, 환경 보호를 경제적인 비즈니스와 접목시킬 수 있을 것이라고 복스웰은 설명했다. “우리의 가치 있는 고객들은 환경 보호 의식이 높은 사람들이다. 대부분의 새로운 소비자 제품은 이러한 세대와 간단한 타깃으로 한다.”\n 가치 세분화: 소비자를 각각의 유무한 가치에 따라 그룹화하고, 이러한 가치를 기준으로 마케팅 활동 및 커뮤니케이션을 맞춤화하는 것.\n 신제품 아이디어 가치를 사용하면, 다른 제품들에 대한 소비자들의 반응에도 영향을 미친다. 소비자의 중요한 사회적 가치가 충족될 수 있을 때 성공 가능성은 높아지는데, 예컨대 홈스킨(HomeSkin)이라는 건강 관리제품은 여성들의 피부를 건강하고 아름답게 가꾸려는 사회적 가치를 반영하고 있으며 이로써 많은 사람들에게 매력적인 요소로 다가가고 있다. 또한 아이디어가 다양한 가치를 동시에 반영할 때 그 영향력은 더욱 커진다. 예를 들어, 건강 가치를 지향하는 소비자들은 제품의 성분과 기능에 민감하게 반응하는 경향이 있는데, 이러한 특성을 반영한 자연 성분 제품은 시장에서 경쟁우위를 확보할 수 있다. 한 사례로, 이 기업의 판매전략은 고객들에게 자연 성분의 원료를 강조하는 것이었고 이를 통해 소비자들의 건강 가치와 자연 보호 가치가 동시에 부각되었다고 할 수 있다.\n그리고 또한 ‘정의’의 가치를 중시하는 소비자들은 윤리적 소비라는 개념이 점점 확산될수록 그러한 가치를 지닌 브랜드에 대해 강한 호감을 보인다. 윤리적 패션 브랜드인 ‘60일21 프로젝트’는 단순한 외형의 디자인이지만 생산과정에서 노동자의 권리를 보장하고, 환경에 미치는 부정적 영향을 최소화하는 것을 목표로 하고 있다. 이와 같이 특정 가치를 중심으로 제품을 기획하고 메시지를 구성하면, 소비자는 자신의 가치와 일치한다고 느끼는 브랜드에 보다 강한 애착을 갖게 된다.\n 광고 개발 전략 표적 시장의 가치 프로파일을 잘 검토해보면 마케터가 중산층 독립의 젊은 고객 또는 다른 집단의 삶의 모습을 반영하는 광고 전략을 개발할 수 있다. 광고는 소비자가 그 브랜드에 대해 긍정적으로 인식하고 애착을 느끼도록 유도하는 데 중요한 도구이며, 특정 가치를 기반으로 한 광고 메시지가 보다 강력한 설득력을 발휘하기도 한다. 예를 들어, 책임과 헌신의 가치를 중시하는 소비자들을 대상으로 한 광고에서는 가족과의 유대, 공동체 의식, 사회적 책임 등을 강조하는 이미지와 문구를 사용할 수 있다.\n한편, 마케터들은 소비자의 가치를 조작하려는 광고 전략을 사용할 때 조심해야 한다. 하버드의 한 연구에서는 광고를 통해 주장하고자 하는 메시지가 소비자의 기존 가치와 지나치게 상충할 경우, 오히려 역효과를 낳을 수 있다는 결과를 나타내기 때문이다. 예를 들어, 한 기업이 절제와 검소의 가치를 소중히 여기는 소비자들을 대상으로 지나치게 사치스러운 이미지를 강조한 광고를 집행한다면, 그 광고는 소비자들의 거부 반응을 불러일으킬 수 있다.\n할리데이비슨(Harley-Davidson)은 자사 고객의 자율과 개성, 자유라는 가치를 광고에 적극적으로 반영함으로써 강력한 브랜드 이미지를 구축했다. 그 고객 자신이 표적 그룹이며 그들의 가치에 많이 공감했던 점이 성공 요인으로 작용한 것이다. 소비자들이 광고 속에서 자신의 가치를 발견할 수 있도록 하는 것이 마케터의 중요한 과제라고 할 수 있다.\n또한 아이디어로는 크라우드 소싱과 같은 방법을 통해 마케터 내부 또는 여러 고객 집단의 참여를 유도하여, 보다 다양한 관점과 가치를 반영하는 커뮤니케이션 전략을 구사하는 것이다. 광고 메시지 개발에 있어 이러한 커뮤니케이션의 중요성을 반드시 파악해야 한다.\n 윤리적 고려 사항 소비자들은 가치를 활용하여 마케팅의 활동을 포함한 다른 사람들의 행동에 대한 ‘선악성’을 평가한다. 예를 들어, 도덕성과 중요"}, {"source": "20261114_145141.jpg", "text": "수단-목적 사슬 분석\n 수단-목적 사슬 분석은 제품과 서비스의 속성(수단)이 소비자들의 가치(목적)와 어떻게 연결되는지를 분석한다.\n 긍극적 가치:\n(자존감) 나 자신에 대해 좋게 느낀다\n (소속감) 다른 사람과 시간을 보낸다\n 수단적 가치:\n건강 유지 재미와 우정 시간 절약\n 혜택: 상쾌함 씻어야 할 체중 증가 방지 냄새가 없음\n 속성: 끓일 수 있는 적은 칼로리 봉지에 들어 있음\n 제품: 쌀 저칼로리 맥주\n 그림 14-7 ▶ 수단-목적 사슬의 예 수단-목적 사슬 분석은 제품과 서비스의 속성(예: 칼로리 억제, 냄새 없음)이 소비자의 수단적 가치(예: 건강 유지, 시간 절약), 궁극적 가치(예: 자존감, 소속감)에 어떻게 연계되는지를 확인한다(예: 쌀로 지은 식사에 대해 느끼는 감정). 사슬의 최상단에는 소비자의 궁극적 가치가 있다. 수단-목적 사슬의 예시가 있으면 특정 브랜드의 소비자들이 중요하게 지각한 가치에 관련된 속성을 마케터들이 중요하게 지각한 가치에 관련된 속성을 식별하는 데 도움을 주며, 이는 브랜드 포지셔닝과 시장세분화에 유용하다. 라면이나 디오도란트에 대한 수단-목적 사슬을 개발할 수 있는가?"}, {"source": "20261114_145146.jpg", "text": "그림 14-8 제품 혜택 가치 마케터들은 제품이 혜택(예: 지방 0%)과 가치 있는 속성(즐거움 100%)에 호소할 수 있는 새로운 방법을 찾고 있다.\n 로키치 가치 조사(RVS) 심리학자 밀턴 로키치가 제안한 도구로, 도구적 가치와 궁극적 가치를 측정하는 설문지이다."}, {"source": "20261114_145148.jpg", "text": "개성 사람들을 서로 구별하고 행동에 영향을 미치는 감정, 사고, 행동의 특징인 인적 특질 패턴.\n 5요인 성격 모형 사람들의 성격에 영향을 미치는 5요인 성격 모형은 신경증성, 외향성, 개방성, 우호성, 성실성이다."}, {"source": "20261114_145154.jpg", "text": "그림 14-9 ■ 5요인 성격 모형 다음은 5요인 성격 모형, 각 특성의 구체적 측면, 그리고 예시의 요약이다.106 5요인 성격 모형의 보편성은 놀랍다. 이론, 연구, 적용에 따라 구체적인 특성, 용어, 예시의 정의는 다소 다를 수 있다. 예를 들어, ‘신경증’ 차원은 때때로 ‘정서적 안정성’이라고도 불린다. 사람들은 각 차원과 관련하여 낮거나 높은 개 점수를 받을 수 있다. 예를 들어, 신경증 차원의 변동성 측면에서 낮은 점수를 받은 사람들은 외면적으로 차분하고, 강인하며, 안정감을 느낀다. 마지막으로, 신경증 차원의 질측 측면에서 낮은 점수를 받은 사람들은 거의 우울감을 느끼지 않으며, 일반적으로 자신을 편안하게 여긴다. 또한, 우호성 차원의 동정 측면에서 낮은 점수를 받은 사람들은 더 논쟁적이거나 싸움을 걸기 쉬운 수 있다.\n 사람의 개성\n 신경증(N) 변동성 (불안함) 질적 (불안정함)\n 외향성(E) 열정 (사교적) 단호함 (행동 지향적)\n 개방성(O) 지적 (호기심 많은) 경험 (창의적)\n 우호성(A) 연민 (도움이 되는) 관용함 (관계 존중)\n 성실성(C) 근면성 (이해심) 질서 (조직적)"}, {"source": "20261114_145159.jpg", "text": "그림 14-10 ▶ 5요인 성격 모형을 측정하기 위한 효율적인 도구\n 10항목 성격 검사(TIPI)는 5요인 성격 모형을 측정하기 위한 효율적인 도구이다. 각 특성은 상반되는 두 항목으로 나타났다. 여기에는 질문에 대한 응답은 굵은 글씨체의 항목에 상반된 항목에 제시되어 있다. 특정 성격 특성 점수는 두 항목(긍정적인 혹은 부적인 방향으로 역코딩한 후)을 계산하여 얻는다. 물론, 성격 특성을 더 세심하고 자세하게 정의하고 측정하는 흥미로운 연구도 할 수 있다. TIPI는 매우 간단한 도구이다. TIPI는 전체 성격 특성 프로파일에 대한 신뢰성을 더 많이 대신 다 공통 요인인 성격 간성이라고 하는 용어를 사용하는 각 5요인 성격 특성에서 신뢰의 점수는 어떻게 되는가? 그리고 당신과 가까운 사람들이 이들 중에서 어떻게 점수를 얻는가?\n 다음은 여러분에 해당할 수도 있고 해당하지 않을 수도 있는 여러 성격 특성이다. 각 진술에 숫자를 기입하여 그 진술에 얼마나 동의하는지 또는 동의하지 않는지의 정도를 나타내라. 이렇게 할 수 있는 한, 여러분 스스로 어느 범주에 해당하는지를 생각하지 않도록 노력하라.\n 10항목 성격 검사 (TIPI)\n 전혀 동의하지 않음 별로 동의하지 않음 동의여부 비동일함 약간 동의함 매우 동의함\n 1 2 3 4 5 6 7\n 나는 다음과 같이 나 자신을 본다.\n 1. _____ 외향적이고, 외정적인.\n2. _____ 비관적이고, 우울한.\n3. _____ 진실하고, 솔직한.\n4. _____ 신경질적이고, 긴장, 자기 절제적.\n5. _____ 상상력이 있고, 창의적.\n6. _____ 사교적이고, 활기찬.\n7. _____ 새로운 경험을 즐기는, 변화무쌀한.\n8. _____ 무신경하고, 무인정한.\n9. _____ 동정심이 많은, 친구를 잘 사귀는.\n10. _____ 차분하고, 정서적으로 안정적인.\n11. _____ 전통적이고, 전통방식을 선호하는.\n TIPI 척도 점수* (R은 역코딩된 항목을 나타냄):\n외향성: 1, 6R 우호성: 2R, 7 성실성: 3, 8R 정서적 안정성: 4R, 9 개방성: 5, 10R\n 주: 역코딩된 항목은 점수를 반대로 변환 바뀌게 계산한다(즉, 1↔7, 2↔6, 3↔5, 4↔4).\n Source: Adapted from Samuel D. Gosling, Peter J. Rentfrow, and William B. Swann Jr, “A Very Brief Measure of the Big-Five Personality Domains,” Journal of Research in Personality 37, 2003, pp. 504–528. Reprinted by permission from Elsevier.com."}, {"source": "20261114_145206.jpg", "text": "통제 중심 사람들의 사건과 결과의 원인을 자신(내적)에게 돌리는 경향 또는 자신이 아닌 외부(예컨대, 상황, 운, 또는 운명 등)를 돌리는 경향.\n 인지 욕구 사람들이 생각하고 인지적 도전에 참여하는 것을 얼마나 좋아하는지 정도."}, {"source": "20261114_145209.jpg", "text": "독특성 욕구 다른 사람들과 비교하여 특정 제품 또는 서비스의 구매, 사용, 처분을 통해 독특한 위치와 경험을 원하는 욕구."}, {"source": "20261114_145214.jpg", "text": "자기 성찰 사람들이 행동하는 방식을 대한 단서로 알기 위한 다른 사람들 얼마나 참고하고, 단서를 따르는 정도."}, {"source": "20261114_145216.jpg", "text": "마케팅 시사점\n 인구 개성 특성들은 흔히 행동과 관련되어 있을 수 있기 때문에 마케터들은 이를 잘 파악하여 인구 통계 특성들에 대한 다양한 개성 유형이 존재하는지를 살펴보면, 커뮤니케이션 메세지를 조정함으로써 소비자들을 목표로 삼을 수 있다. 국제적 마케팅에서도 문화간 개인이 개성에 있어 얼마나 다른지에 대한 차이점을 이해하여야 한다. 개성 특성이 국가간에 다르다면 마케터들은 국가간 커뮤니케이션에 개인적 요소를 가미하고, 덜 개인적인 제품 대비 커뮤니케이션을 시행할 수 있다. 예를 들어 보면, 일본 소비자들을 대상으로는 자존감이 낮은 문화적 맥락을 보여주는 반면, 미국 소비자들을 대상으로는 자존감이 높은 문화를 보여주는 것이 더 나을 것이다. 소비자들이 개성에 있어 방향성과 강도 수준이 다양하다는 것을 인식하는 것은 세분화 전략을 세우는 데 매우 유용할 수 있다. 예를 들어 소비자를 새로운 생각을 수용하는 사람들 또는 보수적으로 새로운 것에 대한 것을 시도하려는 것에 조심스러운 사람들로 구분할 수 있다.\n자극을 즐기는 소비자를 대상으로 한 벤앤제리(ben & Jerry’s)와 이스트크림은 새로운 아이스크림 단어에 투자하기 위한 초대장과 함께 아이스크림을 포함하는 기본적인 테스트를 경험할 페이스북 앱을 판매에 출시하였다. 모험을 즐기는 소비자에게 소구하기 위해 콘소메 스타일의 치킨 맛 아이스크림인 Buffalo Angels Kings Krispies의 형태로 계획을 발표하였다. 결과적으로 젊고 실험적인 소비자들이 사이트에 가입하고 참여하도록 장려하고 두 회사 브랜드 모두에 대한 새로운 애착을 형성하도록 성공하였다. 이러한 마케팅 캠페인이 소비자들에게 호소될 수 있었던 것은 마케터들이 이에 관심이 있는 소비자들에 초점을 맞출 수 있었기 때문이다. 이와 관련하여 소비자들이 페이스북에 자신의 아이디어를 제출하고, 최고의 아이디어를 선정하는 것을 도왔다. 이들이 소셜 미디어 연결망을 계속해서 감수하다 보면 경험 뒤치 간의 것이다.라고 선언하였다.\n 정치 성향 사람들의 사회defined 일반적 정치적 입장들에 대해 종합하는 전반적인 가치가 있는 신념의 집합.\n 체계 정당화 사람들이 자유 의지를 가지고 있으며 세상이 대체로 공정하기 때문에 “사람들은 자기가 받은 것을 얻고 받은 것은 벌을 면한다고” 믿는 신념."}, {"source": "20261114_145224.jpg", "text": "라이프스타일 소비자의 구체 적인 일상 활동, 관심사, 의 견 등을\n 소비자 라이프스타일의 구성 요소\n 활동 일 가사 취미 휴가 오락 사회적 행사 지역 사회 쇼핑 스포츠\n 관심사 직업 가족 집 여가 미디어 성취 패션 음식 지역 사회\n 의견 자신 사회 문제 정치 문화 경제 비즈니스 제품/브랜드 교육 미래\n 사회인구학적 특성 나이 성별 교육 직업 소득 가구 크기 주거 형태 지역 크기 지리적 위치\n 표 14-2 활동, 관심사, 의견\n 라이프스타일은 특정하고 구체적인 소비자 활동, 관심 사, 의견의 패턴을 말한다. 다음은 소비자의 다양한 활동·관 심사, 의견의 예시다. 소비자 세분시장 혹은 라이프스 타일에 따라 상이해질 수 있는 사회인구학적 특성(예:가 막 연령) 을 기반으로 한 설명을 보완하고 풍부하게 만 든다."}, {"source": "20261114_145231.jpg", "text": "그림 14-11 ▷ 절약에 호소하기 일부 소비자들은 특히 어려운 경제 여건에서 절약의 가치를 중요시하며, 일부 광고는 이러한 돈을 절약하는 가치를 강 조한다."}, {"source": "20261114_145233.jpg", "text": "마케팅 시사점\n 소비자 라이프스타일은 시장세분화, 커뮤니케이션 및 신제품 아이 디어에 대한 중요한 시사점을 갖고 있다.\n 세분화 및 표적화하기 ∙ 광고는 라이프스타일에 대한 정보를 활용하여 특정 인를 위한 소비자 라이프스타일을 선택할 수 있다. 보육원, 청소 서비스나 같은 서비스는 시간을 절약하고 편리함을 제공하며, 이러한 서비 스들은 생활이 바쁜 소비자를 표적으로 삼게 된다. 소비자들은 개 인의 기호에 따라 라이프스타일이 다른 소비자를 위한 맞춤형 제 패키지를 더 가지 휴대용 제공한다. 예를 들어, 미래 소비자의 도 센터에 대한 구군을 수축하는 내려받는 기반으로 구군에서 관광하 고 가르는 것이 얼마나 쉬운지를 설명하는 캠페인은 보통 한번 정 원 여행규모를 표적으로 한다.\n 또 다른 예로, 포드(Ford)는 미래의 신규 자동차 구매자인 비환경 고 친환경적인 대량생산 라이프스타일을 내세운 캠페인을 벌이고 있디 다(그림 14-12 참조). 포드는 사전 단계로 잠재적 자동차 구매자들이 네모 포커스(Ford Focus)와 이스케이프(Escape) 차량의 연료 절감 특 성에 대하여 알 수 있도록 공공하고, 환경에 대어 오염을 줄이는 방 방법, 회사의 미래의 비전에 관해서 이메일을 보내는 등 다양한 방법 의 홍보 활동을 진행하였다. 또한 차량을 절감하고 환경에 부담을 덜 기 위한 회사의 최신 방법에 관한 차량을 경험하여 설명하는 온라 인의 웹사이트 내를 포함한 운전자에 데 도움을 주는 인포고시 영 영진다. 단연에서는 포드가 고도리마이브(Drive) 캠페인을 통해 전년 자"}, {"source": "20261114_145241.jpg", "text": "커뮤니케이션 마케터는 특정 라이프스타일에 소구하기 위해 광고 메시지와 프로그램을 설계하여 원하는 라이프스타일의 상황에서 제품을 등장시킬 수 있어야 한다. 소셜 미디어, 모바일 마케팅을 사용하면 다양한 라이프스타일 세그먼트와 소통하는 마케팅 목표 지향적 캠페인도 만들 수 있다. 코카콜라의 MyCoke.com같은 사이트들은 웹 페이지의 페이지 뷰, 유투브, 트위터 링크를 통해 음악과 게임 같은 새로운 기능을 정기적으로 게시하여 브랜드 팬들이 계속해서 다시 방문하도록 한다.\n 신제품 아이디어 마케터는 종종 특정한 라이프스타일을 가진 사람들의 충족되지 않은 욕구를 발걸음으로써 새로운 제품 및 서비스 아이디어를 개발할 수 있다. 예를 들어, 일본의 인테리 도쿄DDI트 DOCOMO는 젊은 고객이 해외 여행을 좋아하고, 다른 음식을 시도하고 싶어 한다는 사실을 알게 되었다. 이러한 요구에 대응하여, 회사는 중국어 메뉴와 일본어 작성된 식당 메뉴를 일본인으로 하여금 휴대폰에서 다운로드받아 사용할 수 있도록 스마트폰 앱을 개발했다. 이와 비슷한 앱들은 중국어, 한국어, 태국어, 인도네시아어로 된 말을 즉시 문어로 번역할 수 있는 아이폰 앱을 제공하여, 여행하는 사람 구입을 돕는 또 다른 번역을 제공하고 있다."}, {"source": "20261114_145244.jpg", "text": "그림 14-13 ▶ VALS 미국 세분 시장\n 핵심자 책임지는 세련된 호기심 강한\n 주요 동기\n 이상\n 성취\n 자기표현\n 사고자 사회 지론 무시함 만족한\n 성취자 목표 지향적 모든 등시 성취형\n 체험자 자극에 목마른 흥분을 찾는 충동적\n 신봉자 융풍에 없는 충성된 도덕적인\n 능력자 높은 자원인 고소득\n 제작자 자립적인 사를 성도 현실적\n 생존자 과거를 그리워하는 억제하려는 신중한\n 고자원 고혁신\n 저자원 저혁신\n VALS는 두 가지 차원, 즉 기본(교육, 소득, 직능 등)과 주요 동기(이성, 성취, 자기 표현)를 기반으로 소비자를 8개로 구분해 체계적으로 프로파일링한 미국에서 가장 널리 이용되는 세분화 기반으로 알려져 왔다.\n당신은 VALS 틀에 근거하여 어떤 하부군? 아래 웹사이트에서 VALS 설문을 실시해보자(www.strategicbusinessinsights.com/vals/presurvey.shtml).\n Source: Reprinted with permission from VALS™ Program, SRI Consulting Business Intelligence (SRIC-BI), www.sric-bi.com/VALS"}, {"source": "20261114_145250.jpg", "text": "마케팅 시사점 VALS 및 기타 사이코그래픽 응용 도구들은 시장세분화, 신제품 및 프로모션 아이디어, 광고 캠페인에 사용될 수 있다. 분석을 진행해 보면, 많은 개인의 특정한 라이프스타일의 유형에 따라 동일한 광고 전략과 문장(메시지) 개발, 매체 선택을 위해 소셜 미디어 성향을 이해하고 설명할 수 있다.\n핵심 시사점을 이해하고 이에 도달하기 위한 인구통계적인 분석과 함께 사이코그래픽 응용 도구를 사용하는 경향이 많다. 예를 들면 힐튼가든인(Hilton Garden Inn)의 커뮤니케이션 메시지는 맞춤형으로 대상의 개별의 소명을 따라서 인생에서 궁극적으로 해야 할 일을 깨닫고 그에 대한 답을 찾기 위해 쓰였다. 이 프로모션의 표적 집단은 30~54세의 2차 단계 내에서 성공의 측면으로 자신의 성공을 간결한 여행자를 표적으로 하였다. 인생의 이른 시기에 힘들게 노력해서 얻은 성공과 꿈을 실현한 해답을 찾기 위해, 힐튼가든인은 광고 슬로건 “우리는 성공을 위한 답을 제공합니다.”를 지원했다."}, {"source": "20261114_145253.jpg", "text": "복습과 토론을 위한 질문\n 1. 궁극적 가치, 수단적 가치, 영역별 가치의 차이점을 설명하라.\n2. 핵심 가치 집합 모형의 일곱 가지 개인적 가치는 무엇이며, 이것이 어떻게 소비자 행동에 영향을 미치는가?\n3. 소비자 환경주의란 무엇이며, 소비자 행동에 어떤 영향을 미치는가?\n4. 마케터는 수단-목적 사슬 분석, RVS, LOV를 어떻게 활용하는가?\n5. 개성은 어떻게 정의되는가?\n6. 오오기 개성 특성은 무엇이며, 이들이 어떻게 소비자 행동에 영향을 미치는가?\n7. 마케터가 소비자 행동에 영향을 미치기 때문에 관심을 갖는 개성 특성은 어떤 것들이 있는가?\n8. 소비자의 정치 성향이란 무엇이며, 이것이 소비자의 개성과 가치, 개성, 소비 행동과 어떻게 연관되는가?\n9. 소비자의 라이프스타일의 세 가지 주요 요소는 무엇이며, 이것이 소비자의 개인적 가치와 개성 특성과 어떻게 연관되는가?\n10. 소비자의 사이코그래픽 특성이란 무엇이며, 마케터들은 이를 어떻게 조사할 수 있는가?\n 미주(endnotes)는 한경사 홈페이지 www.hankyungsa.co.kr의 공지사항에서 PDF 파일로 다운로드할 수 있습니다."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch14-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch14-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch14-book-edits',content.innerHTML));const saved=localStorage.getItem('ch14-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
