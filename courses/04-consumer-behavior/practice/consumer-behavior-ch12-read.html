</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "소비자 다양성", "source": "20261114_115016.jpg"}, {"kind": "paragraph", "text": "도입\n 얌 브랜드(Yum! Brands)가 피자헛(Pizza Hut), 타코벨(Taco Bell), KFC의 미국 밖 영업을 개시했을 때, 자사 제품을 지역 및 종교적 선호에 맞추어 깊게 맞추었다. 또한 인사 정책과 프랜차이즈 경영에서 다양성과 공정성·포용성(diversity, equity, and inclusiveness: DEI)을 강조한다는 목표를 세웠다. 예를 들면 인도의 매장에서는 많은 채식주의자의 메뉴를 제공했는데, 이는 현지 소비자들이 소고기를 먹지 않기 때문이다. 사실 얌의 국제 마케팅팀 마찬가지로, 이 브랜드는 소비자 행동 차원에서 돋보이는 다양성의 양상을 파악하고자 했다(그림 12-1 참조). 국적과 거주하는 지역이 다른 소비자 집단은 서로 다른 문화와 소비 생활양식을 가지고 있다는 점 때문에 이들 집단의 소비자 행동은 상당히 다를 수 있다. 본질적으로, 소비자 행동은 다양한 사회 및 문화적 특성을 지닌 여러 집단으로 구성된 소비자들에 의해 영향을 받는다. 여러 집단 특성을 이해함으로써 마케터는 각기 다른 소비자 집단에 적합한 제품 및 광고를 개발하고 적용하기 위해 기업으로, 연령, 성별, 성적 지향성과 같은 다양성 영역이 어떻게 소비자들에게 영향을 미치고 있는지를 이해해야 한다.\n 12-1 연령, 시대, 출생 집단이 소비자 행동에 어떻게 영향을 미치는가\n 마케터들은 표적 집단 설정을 위해, 비슷한 니즈, 욕구, 그리고 행동 패턴을 보이는 소비자 집단을 구분하고자 한다. 같은 연령이라가 같은 시대를 살", "source": "20261114_115016.jpg"}, {"kind": "heading", "text": "세대별 집단 이론", "source": "20261114_115036.jpg"}, {"kind": "paragraph", "text": "매번 소비자들의 보통 표준이 된다. 따라서 마케팅에서 나이·시대·출생 집단(age, period, and cohort; APC)이 소비자 행동에 미치는 영향을 이해하는 것이 필요하다. 이 세 가지는 소비자의 연령에서의 시간 경과와 연관되어 있지만, 그림 12-2에서 볼 수 있듯 각각 다른 의미를 지니고 있다.\n나이(age)는 소비자의 연기적 시간이다. 2001년도에 태어난 사람은 2026년도에 25살이 된다. 시대(period)는 2007년도에 애플(Apple) 아이폰이 처음 나왔듯이, 특정 의미 있는 사건이 발생한 역사 속의 시간을 말한다. 출생 집단은 동일한 2004년 간격으로, 태어난 사람들의 그룹을 의미한다. 이러한 출생 집단은 세대별로 분류되며, 특정 역사적인 사건에 의해 동일한 경험을 공유한다.\n 세대별 집단 이론(Generational Cohort Theory)에 따르면 연령과 시대의 상관관계인, 출생 집단, 혹은 세대(generation) 안에 태어난 사람들의 집단는 비슷하고 의미 있는 인생 사건을 공유하게 되며, 따라서 오랜 기간 지속되는 가치와 행동 양식을 공유한다. 공통된 경험으로 인해 각 세대는 고유한 신념과 기억, 의미를 공유한다. 예를 들면, 베트남 전쟁은 제2차 세계대전 종족 이후 1946년부터 1964년 사이에 태어난 베이비붐 세대에게 의미 있는 사건으로 세대별 경험이 형성되었다. 세대별 집단인 ‘X세대(Generation X)’는 개인용 컴퓨터 개인용 컴퓨터가 도입되기 시작한 1970년대와 1980년대 사이에 어린 시절을 보냈으며, 인터넷을 접하며 자라났다. 밀레니얼 세대(Millennial Generation)는 인터넷과 휴대 전화가 일상화된 1980년대 이후에 태어났다. 그리고 Z세대는 2000년대 초반 이후 태어나고 성장한 세대로, 2020년에는 COVID-19 팬데믹을 경험했으며, ‘Z세대(Generation Z)’ 혹은 ‘젠(Z) Gen’이라고 칭해한다. \n 출생 집단이나 소비자 세대의 정확한 시작과 끝은, 의미 있는 사건이 무엇인지에 따라 다르거나 주관적 정의를 할 수 있다. 퓨리서치(Pew Research organization)는 “세대를 정의하는 것은 본질적으로 틀릴 수밖에 없는 일이며, 의미 있는 집단을 구분하고 그 집단의 특성을 비교하고 반영해야 한다”고 밝혔다. 예를 들면, 베이비붐 세대에 해당하는 사람들은 제2차 세계대전 종료 이후인 1946년부터 1964년 사이에 태어난 집단으로 정의할 수 있다. 이 세대는 제2차 세계대전 종전 이후의 1946년부터 1964년 사이에 태어나 베이비붐 세대는 1965년까지 태어난 사람들로 의미한다. 출생 집단은 동일한 생애 단계를 공유하면서 공통된 경험을 가지게 되며, 같이 사회화하고 서로 비슷한 소비자 행동을 보일 수 있다. 그들은 소비자 행동뿐만 아니라 직장 생활, 가족 관계에도 거대한 영향을 미치게 된다. \n 연령과 시대의 관계, 출생 집단의 구분을 기반으로 크게 다음 여섯 세대를 설명한다: (1) 침묵 세대, (2) 베이비붐, (3) X세대, (4) Y세대/밀레니얼 세대, (5) Z세대/주석, (6) 알파 세대.\n 12-1a 침묵 세대\n 침묵 세대(Silent Generation)는 1928년부터 1945년 사이에 태어난 세대이다. 퓨리서치의 조사에서 그들에게 인생에서 가장 중요한 순간은 둘째 아이의 출생이라고 보였다. 다른 세대들과 응답과 마찬가지로 9/11 테러가 1위였고(59%), 제2차 세계대전이 2위(44%)로, 특히 캐나다 대통령 암살이 3위(41%), 베트남 전쟁이 4위(37%)로 나타났다. 그들의 삶의 특징은, 상대적으로 전쟁(전쟁 전인 불확실, 제한 없는 소비, 신중한 소비)을 고려하면, 침묵 세대는 절약, 존중, 충성, 희복함을 중요시하는 가치를 지니고 있다.*\n 이 세대의 구성원들은 이미 은퇴했으며, 가장 젊은 사람은 2025년에 80세가 된다. 이들은 미국 인구의 약 2,300만 명 정도에 해당한다.* 엄청이 없어 근로 시장 경험이 있기 때문에, 이 세대에서는 남성과 여성이 더 많은 수를 차지하고 있다. 의료의 진보와 건강한 생활방식으로 인해, 사람들은 이전보다 더 오래 살며 건강하게 살고 있다. 따라서 2050년까지 미국 내 85세 이상의 인구는 베이비붐 세대가 연령 그룹으로 이동함에 따라 세 배로 증가할 것으로 예측된다.10\n 정보 처리 능력은 나이가 들면서 악화되기 때문에, 이들은 정보를 탐색할 가능성이 적으며, 정보를 기억하고 복잡한 의사 결정을 내리는 데 많은 어려움을 느끼게 된다. 따라서", "source": "20261114_115036.jpg"}, {"kind": "paragraph", "text": "이들은 좀 더 다습하고 개량적인 체력이 세계의 패션트렌드 경향이 있다. 친밀하고, 복잡한 의사 결정들 내릴 때 그들은 말을 걸며 사회적 교류를 원한다. 무엇보다, 그들은 다른 사람들의 구매상 품이나 다른 사람들이 자신을 알맞다고 간주하는 표시이기 때문에, 이는 나이 든 세대들과 근본적으로 다르다. 그렇기 때문에 그들이 상표에 대한 정보를 얻는 경로가 유력한 관찰자일 뿐만 아니라 때에 해석의 매개자로서 생기기도 한다. 또한 “오늘의 가족이” 인기를 얻는 이유는 활발한 입소문을 탄다. 예, 아마존, 치즈즈(Chico’s 여성 의류 및 패는, 크로커(Kroger 식료품점), 세이프웨이(Safeway 식료품점 및 약국)가 가장 쉽게 나왔다.", "source": "20261114_115048.jpg"}, {"kind": "heading", "text": "12-1b 베이비부머", "source": "20261114_115052.jpg"}, {"kind": "paragraph", "text": "1946년부터 1964년 사이에 태어난 사람들은 베이비부머(Baby Boomers), 즉 베이비붐 세대에 속한다. 대부분의 베이비붐 세대는 이미 은퇴했으며, 그중에서 가장 젊은 사람은 2029년에 65세가 되었다. 그들은 전 세대인 침체와 파괴자들, 자신의 평생 중 가장 중요한 사건으로 9/11을 언급하며(70%), 그 다음으로는 케네디 대통령 암살(45%), 베트남 전쟁(41%), 그리고 버락 오바마 대통령 당선(38%)을 꼽는다. 1960년대와 초기 1970년대에 성장한 이 세대는 낙천적이며 개인주의적이며 권위를 거부하거나 넘어가기 위해 교육을 중요시한다. 그러나 이 세대는 동시에 즉각적인 만족을 원하며 사치를 싫증으로 귀하는 경향이 있으며, 일부는 형성기에 회의했고 다른 국가가 발전하지 않아 실망한 사람도 있다.22\n 미국에서 이 세대는 약 7,200만 명으로 추산된다. 2015년 첫 베이비붐 세대가 은퇴했을 때, 이들은 미국 인구의 19%(저자 65세 이상이었다). 2050년까지 미국 인구 중 65세 이상이 될 것으로 예상되며, 그 비율은 22.1%(9,000만 명)에 달할 것이다.23 이렇게 인구 고령화가 상당히 진행된 나라는 몇몇 유럽 및 아시아 국가보다 낮다(독일: 40.1%, 일본: 35.9%, 이탈리아: 31%, 영국: 30.1%, 중국: 26.8%).\n 베이비붐 세대는 거대한고 영향력 있는 세대이다. 많은 사람의 은퇴를 위해 저축을 했거나 은퇴 혹은 퇴직 후에도 시간적·금전적으로 여유가 있으며, 구매하고, 느끼고, 행동하려는 욕구가 크다. 특히 더 작은 곳으로 이사하거나 원래의 거주지와는 매우 다른 라이프스타일을 추구하기 더 늘어난다.24 베이비붐 세대는 개인주의(individualism)에 상당한 가치를 부여하는 세대로, 그들이 원할 때 원하는 곳에서 자신이 원하는 것을 할 수 있는 수준을 원한다. 예를 들어, 많은 베이비붐 세대는 요양 시설이나 노인전용 생활시설에 거주하는 대신 “제 3의 장소(third place)”인 노인인 이용실, 커피숍, 쇼핑몰, 커뮤니티 센터 등의 시설 및 맞춤형 제품 및 서비스에 대한 마케팅 기회를 제공한다.25 대부분의 베이비붐 세대들은 TV와 달콤이 형성됐으며, 나이가 들면서 TV를 덜 보게 보는 경향이 있다. 반품 운동을 하는 동안인 못하지만 여전히 도운 또한 인터넷을 사용하는 데 매우 집단보다도 더 많은 시간을 보낸다. 이 있으며, 소셜 미디어에도 점차 적극적으로 접하고 있다.\n 많은 이들은 불과하고 베이비붐 부모들과 그들의 성인 자녀들은 어떤 공통된 특성을 공유하고 있는데, 예를 들면 얼마나 딸은 종종 같은 매장에서 쇼핑을 한다.26 케이블에 따르면 베이비부머가 자식을 양육하고 부모를 돌보는 비 동시의 때문에 베이비부머 세대를 “샌드위치 세대(sandwich generation)”라고 분류했다. 이러한 상황은 베이비부머의 라이프스타일 및 활동, 소비 패턴에 영향을 주었는데, 이는 자신의 은퇴를 계획하고 아이들의 교육을 위해 저축을 해야 하기 때문이다.27 현재 가장 나이든 베이비부머의 자식들은 X세대로서, 부모의 나이에 따라 센드위치 세대가 되어가고 있다.\n 그럼에도 불구하고, 이 집단의 사람들은 둘을, 이전 세대보다 더욱, 건강하고 좀 더 활동적인 경향이 있다. 그와 동시에", "source": "20261114_115052.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261114_115101.jpg"}, {"kind": "paragraph", "text": "은, 많은 베이비붐세대들은 지자체와 단체 기여에 관심을 다시 불러일으키기도 하는데, 이러 한 나눔과 관련해서 세대를 넘어선 집단의 모임 가입, 그리고 음악 수업 등의 유료 강좌와 같은 체 험적 활동을 추구하는 소비를 선호한다. 한편, 이들에 관련된 사회적 선호를 높이기 위한 소비자 보호, 더 나아가 관련된 소비자 보호법의 공정성, 정직함을 염려한다. 이에 대한 한 가지 대응은, 젊은 세대 의, 특히 자존감이 낮은 소비자들을 겨냥한", "source": "20261114_115101.jpg"}, {"kind": "heading", "text": "12-1c X세대", "source": "20261114_115106.jpg"}, {"kind": "paragraph", "text": "1965년에서 1976년 사이에 태어난 X세대는 흔히 X세대(Generation X) 혹은 중년 세대라고도 부른다. X세대는 현재 가족형성기인 세대(40~49세)와 후반 세대에 만나는 세대이다. 베이비붐 세대와 비교할 때 X세대 구성원은 식료품, 유류 및 자동차를 선택할 때 상당한 대기판단보다 덜 의존한다. 그들은 구매 결정의 도움을 얻기 위해 전화 디렉터리와 같은 인쇄매체를 찾는 도율이 덜 의존한다. 그들은 구매 결정의 도움을 얻기 위해 전화 디렉터리와 같은 인쇄매체를 찾는 도율이 덜 의존한다. 그들은 구매 결정의 도움을 얻기 위해 전화 디렉터리와 같은 인쇄매체를 찾는 도율이 높은 편이다. 이 세대의 가장 나이 많은 구성원은 2030년에 65세가 된다. 미국 내에서 약 6,500만 명의 X세대가 존재한다. 이들이 생각하는 중요한 사건으로 9.11 테러(79%, 이전 세대보다 높음), 오바마 대통령 당선(46%), 베트남 전쟁 발발(21%), 장보기 기술 습득(18%)을 꼽는다.4\n 일반적으로, X세대는 정보기술과 미디어를 소비자 선택을 하는 데 있어 더 독립적이다. 베이비붐 세대와 비교할 때 X세대 구성원들은 식료품, 유류 및 자동차를 선택할 때 상점에서 제공하는 정보보다는 스스로 정보를 수집하는 경향이 더 강하다. 또한 X세대는 자신들의 여가 시간을 온라인 쇼핑, 텔레비전, 소셜 미디어 및 게임에 좀 더 많이 할애하는 경향이 있다. 예를 들어, 2020년에 미국 소비자 전체 중에서 게임에 사용하는 시간은 14%(26%) 증가했다. 그러나 45세에서 54세 사이의 X세대 구성원들 중에서는 이 수치가 훨씬 큰 59% 증가했다.5\n 또한 X세대는 이전 세대들보다 교육 수준이 높다. 35세에 이르면 X세대 남성 중 18%와 X세대 여성 중 20%가 4년제 학위를 취득했는데, 이는 베이비붐 세대의 남성 중 17%와 여성 중 14%와 비교하여 높다. 또한 여성과 남성 간에 거의 동일한 경제활동 참여율을 보이는 세대이다.6 X세대는 2007년부터 2008년까지의 금융 위기로 인해 피해를 입은 세대 중 하나로, 이 시기는 그들의 직업상 경력의 중간에 있었다. X세대는 자신들의 부모 세대의 성공 수준을 따", "source": "20261114_115106.jpg"}, {"kind": "heading", "text": "밀레니얼 세대/X세대", "source": "20261114_115113.jpg"}, {"kind": "paragraph", "text": "라츠가나 뛰어넘을 수 없을 것이라고 생각하며 다소 활발을 느끼고 다른 연령 그룹보다 물질적인 것에 덜 집착한다. 실제로, 이들로가 10년 전에 조사에서의 40세에 있던 소비자들과 비교했을 때 훨씬 덜 물질적인 것으로 나타나고 있다고 보고하고 있다.54 이 세대에 속하는 많은 사람들은 시간이 많이 소요되는 근무 일정, 경제 여건의 악화로 인한 재정적 압박, 그리고 사회적 규범의 변화 등으로 인해 부모가 된 후에도 독신일 때와 같은 생활 패턴을 유지하고 많은 것에서 재미를 느끼려고 한다. 가정이 있어서 그들의 일과 개인 생활 간의 균형을 멋지게 유지하는 방법을 찾아내서 성공하고 있다. 가장 인기 있는 브랜드가 무엇인지 물었을 때, 이들은 애플(Apple), 아마존(Amazon), 그리고 나이키(Nike)을 먼저 언급했다.55\n 나는 마케팅 기술에 대해서는 냉소적인 경향이 있다.59 그러나 그들은 자신이 가치, 태도, 관심사에 부합하거나 일치한다고 느껴질 때 메시지에 긍정적으로 반응한다. 이들은 자신의 여러 시간에 대한 향수에 호소하는 메시지에 주목하는데, 이는 Throwback Thursday 게시물이나 어린 시절에 대해 적극적으로 참여함으로써 볼 수 있다.\n 전통적 매체와 소셜 미디어 마케터들은 디지털 인터네티브 음악 방송국 및 디지털 촬영 기술은 있지만 타임 시프트 기능이 없는 전통적 TV와 케이블 TV를 둘 다 사용하여 위 세대를 겨냥한 메시지를 전달할 수 있다. 예를 들어 밤에 시청률이 낮은 덜 인기 있는 프로그램의 광고 시간대에 대한 관련 메시지를 통해 2세대를 대상으로 할 수 있다. 광고에서 2세대의 경험과 공감을 이끌어냈다는 점에서 웃음을 자아내야 할 수 있다. 예를 들면, 여러 기업 중에 ‘첫사랑은 잊을 수 없지만, 처음이었을수록 중요하다’는 메시지를 담아 휴가철 여행을 유지하기 위해 다양한 대학 스포츠 행사를 후원하기도 한다.\n 12-1d 밀레니얼 세대/X세대 약 1981년에서 1996년 사이에 태어난 소비자들은 밀레니얼(Millennial)의 구성원으로, 밀레니엄 세대(Millennials), Y세대(Generation Y) 또는 젠얼스(Gen Yers)이라고도 한다. 이 세대의 가장 어린 구성원은 2030년에 35세가 된다. 미국 내에서 이 세대는 약 7,200만 명 정도로 추산된다.\n밀레니얼 세대 구성원은 역시 자신의 삶에서 가장 중요한 사회적 사건으로 9/11 테러를 지목했다(86%) 이는 현재까지 보안이 네 세대 중에서 그 비율이 가장 높다. 그 뒤로는 오바마 대통령의 당선(47%), 아프가니스탄 전쟁(24%), 동성 결혼(19%), 그리고 정보 기술 혁명(17%) 등이 있다.\n밀레니얼 세대는 ‘디지털 선구자’ 세대로 알려져 있다. 그들은 최신 정보, 기술 장치, 소프트웨어의 빠른 업데이션 시도하고 능숙하게 사용할 수 있게 했다. 그들은 온라인과 오프라인의 상호작용 경험을 한층향한 휴대용장치, 컴퓨터와 휴대폰 같은 새로운 개인 하드웨어의 대부분을", "source": "20261114_115113.jpg"}, {"kind": "heading", "text": "주머스/Z세대", "source": "20261114_115120.jpg"}, {"kind": "paragraph", "text": "초기 1990년 이전에 발생했다. 그림 12-2에는 그 이후에 발생한 정보 기술(IT) 혁명의 주요 사건들을 보여 주는데, 이 IT 혁명 또는 온라인 혁명은 소비자와 마케팅 환경을 근본적으로 변화시켰다. IT 혁명은 정보 검색(구글(Google)), 매력 있는 프로그램(유튜브(YouTube), 스포티파이(Spotify), 넷플릭스(Netflix)), 사회적 관계 구축 및 엔터테인먼트(페이스북(Facebook), 트위터(Twitter), 왓츠앱(WhatsApp), 위챗(WeChat), 틱톡(TikTok)), 쇼핑(아마존(Amazon), 알리익스프레스(AliExpress)), 전문적 관계 및 교류(줌(Zoom), 팀즈(Teams), 챗지피티(ChatGPT)) 등에서 크게 변화했다. 이러한 발전으로 멀티밴의 세대가 그 이후의 세대들처럼 기술뿐만 아니라 마케팅 매체에서도 이전 세대에 비해 전 이 시의 세대라 불리게 되었다. 일례로, 이들은 NFT(Nonfungible token: 대체 불가능 토큰)와 같은 가상 화폐, 필요성, 걱정을 공유하고 있고, 서로의 게시물, 스냅챗(사진 및 영상 기반 메신저)과 소프트웨어(앱)에서 즉각성, 엔터테인먼트, 시각적 이미지들을 선호하기 때문에 필터, 이모티콘, 사진 편집, 페이스 스왑(face swap), 퀴즈 챗봇과 같은 인공지능(AI) 서비스, 자기 표현과 컨텐츠 공유를 선호한다. 자연어 처리와 생성이나 다양한 인공지능 기능이 추가된 스마트 스피커 및 소비자 AI가 소프트웨어에서 찾고 있다. 번역 서비스를 추가했다. 자연어를 이용한 질의·명령 등 소비자들이 자연스럽게 사용할 수 있도록 하면서 많은 성장 잠재력을 지닌 기술로 평가한다.\n 전 세계의 밀레니얼 세대는 인간의 선천적, 문화적 그리고 개인적인 삶 사이의 균형을 높게 평가한다. 예를 들어, 미국의 밀레니얼 세대는 동일한 나이의 X세대와 비교할 때 스마트폰, 컴퓨터를 훨씬 더 사용, 게임 참여, 소셜 웹 방문에 더 많은 시간을 할애한다. 밀레니얼 세대의 절반 이상(55%)은 소셜 미디어를 사용하여 회사의 홍보와 고객과의 관계를 유지하고 있다. 성장 잠재력이 있는 소비자임에도 불구하고 멀리 마처를 중화하려고 노력한다(77%) 등, 성 평등을 특히 여성의 지위 향상을 위해 매우 중요하다고 생각하는 비율이 높다(66%).\n 결과 참가자 74%가 주택 소유를 가장 우선시했으며, 이는 성공적인 경력 보유(60%), 자동차 소유(50%), 자녀를 가지는 것(40%), 대학 학위 취득(36%)보다 높게 평가했다.67 인기 있는 브랜드에 대해 물었을 때, 아마존(Amazon), 나이키(Nike), 타깃(Target), H&amp;M(의류 소매업체), 세포라(Sephora)(스킨케어 및 뷰티 제품)를 가장 먼저 언급했다.68\n 12-1e 주머스/Z세대\n Z세대(Generation Z) 소비자들은 대략 1997년부터 2012년까지 태어났다. 이 세대 구성원 들은 때론 주머스(Zoomers)(붐머에 이어서) 또는 센테니얼(Centennials)(새로운 세기에 태어났기 때문) 또는 i세대(iGen)로 불린다. 결과, 미국 내에서 약 6,800만 명이 이 세대의 구성원 이다.69 그들의 형성기에는 9/11 테러(2001년), 금융 위기(2007~2008년), 오바마 미국 대통령 재임(2008~2016년), 그리고 COVID-19 팬데믹이 있었다.\n 젠Z는 온라인 혁명을 완전히 경험한 최초의 ‘디지털 네이티브’ 세대이다. 그들은 정보에 성인의 삶의 거의 모든 측면에서 기술통에 의해 주된 영향을 미친다고 언급하고 있다.70 성인 제이(Gen Z) 소비자 의 거의 40%가 구매를 하기 위해 쇼핑 기기를 통해 참여한다고 언급하고 있다. 그들은 스 마트폰 기술(예: 개인 소셜 네트워크)에서 주로 영향을 받으며, 구매 제품을 선택하거나 사용법에 대한 정보를 얻으려 한다. 제품 선택에 있어서 다음 요구 사항에 빠른 기대보다 무료 및 배송을 기대하고 있다. 그들의 형성기였던 2008년경에 겪었던 금융 위기는 부모의 재정적, 심리적 안녕에 큰 영향을 미쳤다. 딜로이트(Deloitte) 경영 컨설팅 회사는 보고서에서, 젠Z 세대의 23%가 부모에게 재정적 문제 해결에 의존하고 있는 중요한 지원을 제공한다고 밝혔다.71 예측에 따르면 2020년에는 전 세계 밀레니얼 세대의 약 3/4(77%)와 젠Z의 약 3/4(72%)이 자국 내 세상과 가상 세상 간 각각 차이를 가지고", "source": "20261114_115120.jpg"}, {"kind": "paragraph", "text": "있다고 동의했다. 두 세대 중 약 1/4이 편안하게 은퇴할 수 있을지에 대해 자신감이 없다고 응답했다.74\n 밀레니얼 세대와 젠지 모두 거의 생활에서 일과 삶의 균형을 중요시하지만 밀레니얼 세대(39%)는 젠지(32%)보다 아무를 더 가치 있게 여기고 있고, 두 세대 모두 공휴일과 유급 휴가를 전적 혜택보다는 현금 급여를 더 가치 있게 여기고 있다(밀레니얼 27%, 젠지 24%)75 두 세대 모두 기후 변화에 대해 중요한 과제의 있'다고' 동의하고 있었다(밀레니얼 73%, 젠지 75%). 젠지의 비밀 릴에 기타 다른 그들 또 많은 사람의 생활 비용(주택, 교육, 공공지 등을 주요 고민으로 지적했다.76\n 모든 계층 중 증상을 가장 갖고 있지 억거. 억느 세대보다 지구 온난화 감춤을 우선한ᄃ 다.74 젠지 소비자들은 기후 변화에 대한 개인적인 인식이 높으며 온라인과 오프라인에서 이에 대해 매우 적극적이다.75 피어 리서치센터(Pew Research Center)의 최근 고눈에 따르면, 젠지들은 기후 변화에 대한 대응이 “나의 삶의 질에 ‘상당한/아니면 매우 큰’ 영향을 미쳤다고 응답할 가능성이 기ᄆᄉᆾ아 세대보다 더 높다. 특히 젠지들은 학교에서 야외 수업 및 플라스틱 소비 줄이기, 기후 변화에 대한 행동의 필요성이라는 주제로 지난 몇 주 동안 1~2회 이상 이야기한 세대이다\n 몬 세대보다 더 면밀한 보고였따그림 12-5 참조). 지난 넛 달 동안 다른 세대보다 경찰에게 탄원, 젠지 소비자가 기후 변화에 대한 대응을 위해 정부, 당신권 관리자에게 연락, 항궄 또는 킵 친정 주소의 지역 하버업자들와의 토론을 한 비율이 훨호 높은 것으로 나타났다.76\n 젠지는 미국에서 가장 다양성이 높은 세대이다. 젠지의 48%는 백인이 아니며, 밀레니엘 세대와 39% 및 X세대의 30%와 희귀한 반 비백인 비율이 높2따. 또한, 젠지 소비자들은 이전", "source": "20261114_115136.jpg"}, {"kind": "heading", "text": "알파 세대", "source": "20261114_115140.jpg"}, {"kind": "paragraph", "text": "세대보다 다양성 있는 교우 관계에 더 열려 있다. 이 세대의 과반수 이상이 다른 성별의 친구(61%), 다른 인종 또는 민족의 친구(60%), 그리고 다른 종교의 친구(46%)가 있다고 보고했다.78 Z세대에게 제일 좋아하는 브랜드를 물었을 때, 유튜브(YouTube), 구글(Google), 넷플릭스(Netflix), 그리고 아마존(Amazon)을 언급했다.79\n 12-1f 알파 세대\n 알파 세대(Generation Alpha) 구성원들은 2012년 이후에 태어났다. 이 세대의 초기 구성원들은 이제 사춘기 단계에 진입하고 있다. 대략 매주 전 세계적으로 약 280만 명의 알파 세대가 태어나고 있다.80 현 세대들 중에서 알파 세대는 제일 부유하고 교육 수준이 높으며, 가장 기술적으로 정교한 세대일 것이다. 이들은 현재 21세기를 경험하고 있는 첫 번째 세대이다. 알파 세대는 다른 세대들보다 부모님보다 뛰어난 메시지 송수신과 온라인 계정과 게시물 올리기 능력을 가지고 있다고 한다.81 알파 세대는 실내와 온라인이어서 편안함을 느끼지만, 자유자재로 온라인과 현실 세계 사이를 왕래한다.\n 이 세대는 COVID-19 팬데믹을 경험하는 동안 유년기와 사춘기 초기 기간·초반 10대 초반기였다. 팬데믹은 온라인 비디오, 게임, e-스포츠 시청 및 플레이를 증가시켰다. 로블록스(Roblox)와 포트나이트(Fortnite) 같은 온라인 게임의 소비를 촉진했다. 세계정보연구센터(WARC)에 따르면, 알파 세대는 가정 내 브랜드 역할에 대하여 가족 구성원 간 가능, 사회 유대 및 정신 건강의 중요성을 재량하고 있다. 따라서 25%는 부모가 팬데믹 동안 브랜드를 통하여 그들에게 안심과 평온함을 주기를 원했다.82 부모에게 고가품 구매를 설득 장려했다. 알파 세대는 친환경(재사용 가능·순환 가능)과 최소한의 낭비를 불평하지만 실제로 실천하지는 않는 것을 간파하며 브랜드에게 더 나은 세상을 만드는 활동을 위한 진정성 있는 노력을 요구한다.83 알파 세대는 문화적으로 가장 다양하고 점진적이고 전 세계적으로 연결된 세대가 될 것으로 예견된다. 그들은 사회적으로 글로벌하며 이동성이 높아져 다양하게 공무하며 여행하며 다양한 직업을 가질 것으로 예상된다.84", "source": "20261114_115140.jpg"}, {"kind": "heading", "text": "12-2 성별 및 성적 지향성이 소비자 행동에 어떻게 영향을 주는가", "source": "20261114_115146.jpg"}, {"kind": "paragraph", "text": "포지셔닝 일부 마케터는 제품을 정체성 확립, 반항심, 그리고 동료에게 받아들여진다는지에 관해 청소년들이 느끼는 압박감을 해소하는 데 도움을 되는 것으로 포지셔닝한다. 청소년은 특히 똑똑한 소비자이며 트렌드를 만들기도 하기 때문에, 코카콜라(Coca-Cola)와 펩시(Pepsi) 같은 기업들은 이러한 소비자들이 좋아하고 원하는 것을 지속적으로 조사한다. 예를 들어, 팀 보그(Teen Vogue)는 청소년의 이익을 끌고 관심시키기 위해, 계속 변화하는 인쇄 및 온라인 매거진 콘텐츠, 모바일폰 앱 및 소셜 미디어 콘텐츠를 통한 스타일 뉴스 및 조언의 일상으로 포지셔닝하였다. 멋쟁이 미용 관련 브랜드는 특별한 이벤트를 위한 옷 고르기부터(Back to Hogwarts 새단장 오 쿨파티 드림) 같이 젊은 소비자들을 위해 새로운 상품 및 서비스를 제공하고, 미혼, 이혼한 세대들의 생활을 계속 변화하며, 인기 있는 브랜드나 연예인과의 협력으로 그 가치를 빨리 올릴 수 있다.\n 광고 메시지 마케터들은 점점 더 책임 있는 방법으로 젊은 소비자들에게 다가가고 있다. 예를 들어, 과자 제조업체 디제이-마시(DJ•Marsh)는 젊은 소비자들에게 건강한 생활을 장려하는 다음과 같은 12가지 마케팅 커뮤니케이션 지침을 따르기로 하였다.97 1) 건강한 생활 방식을 장려하고 과도한 통조림 식품의 소비를 옹호하지 않는다. 2) 12세 이하의 어린이들을 대상으로 한 음식 혹은 어린이에게 인기가 있는 캐릭터를 사용할 경우, 건강한(즉, 미국 농무성의 가이드라인에 따라서 설계된) 식품에만 캐릭터를 사용한다. 3) 어린이를 대상으로 한 광고나 광고에 대한 인센티브를 피한다. 4) 12세를 대상으로 한 에너지 음료 및 경카페인을 포함한 제품을 광고하지 않는다. 5) 만화 캐릭터의 인기가 건강에 좋지 못한 것으로 여겨진다면, 특정 캐릭터와 연관된 제품을 판매하지 않는다(예를 들어, 이 만화 캐릭터가 모험과 폭력, 약 및 지도들처럼 흥미로운 주제들에 연루되어 어린이들의 폭력을 조 장하는 경우를 예로 들 수 있다).\n 오늘날의 젊은 소비자들은 문자, 스트리밍, 비디오 및 컴퓨터와 함께 성장했기 때문에, 나이 든 소비자보다 건강 정보를 빨리 처리하는 것으로 보인다. 그들은 인식성보다는 건강하고 재미있는 것을 선호한다. 젊은 소비자들은 마케팅 커뮤니케이션에서 대부 분 정확하고 이미지로 고정관념화 될 때에 만족하지 못한다. 이와 같은 맥락 속에서 마케팅 커뮤니케이션에서 사용되는 것은 진정성이 있는 언어여야 할 수 있다. 게다가 광고가 진행되는 동안 문제가 있다면, 부적절했으면, 선생 앞에서는 “멋지지 않은” 것으로 보이는 메시지는 마치 진정성이 없는 것으로 여겨질 수 있다.98 마케터들은 이러한 젊은 소비자들에게 마케팅 커뮤니케이션에서 진정으로 존중하는 태도를 보여야 한다.\n ‘건강한 아이들을 위한 네슬레(Nestle) 프로그램’은 부모와 보호자들이 더 건강한 아이들 키우도록 돕고 아이들을 등록한다. 3살에서 12살까지의 아이들을 위한 이러한 프로그램에서 네슬레는 가정과 학교에서 건강한 생활 방식을 개발하기 위한 무료 건강 학습 웹사이트를 운영하여, 아이들에게 건강한 식습관, 요리와 함께 운동이 필요하다는 메시지를 전달한다. 이 웹사이트의 일부는 게임을 제공하고, 아이들이 특정 목표를 달성할 때마다 증명서를 준다. 파일은 필요할 때 인쇄하여, 자신만의 요리책을 제작한다. 마지막으로, 학부모와 선생님들은 웹사이트와 함께 온라인 음식 정보 수업을 제공한다. 마지막으로, 프로그램은 임산부에게도 도움이 된다.99\n 전통적인 매체와 소셜 미디어 마케터들은 전통 TV 네트워크, TV 프로그램, 잡지, 라디오와 인터넷 및 소셜 미디어를 통해 젊은 소비자들을 표적화 할 수 있 다. 예를 들어, 어린이 전문 미디어 회사인 워너(타임 워너Time Warner)가 초기 광고 회사를 시작할 때, 그들은 먼저 케이블 네트워크(Cartoon Network)에 광고를 하고, 그 후에 페이스북(facebook)과 인스타그램(instagram)에 광고를 하게 되었다. 몇 년 후에 이 기업은 새로운 광고 전략으로 ‘DCKids’와 같이 어린이들이 좋아하는 피트니스와 스포츠 채널 중 4에서의 보급된 제품을 제공한다. 이 프로그램은 여러 해 동안 인기 행사들 통해 신데렐라의 거인적인 발걸음과 같은 활동을 제공하고, 어린이, 청소년과 가족들에게 스트레스를 줄여준다. 시연을 후원하며 젊은 소비자들에게 경험 전반, 레드불은 에너지 음료의 매력을 선보인다. 예를 들어, 이 회사는 재정이 부족한 학생들 위해 에너지 음료의 멋있게 있는 브랜드를 제공한다.98\n 성별, 성 정체성 및 성적 성향은 소비자 행동에 깊은 영향을 미칠 수 있다. 이 분야의 역사, 범위, 기존 연구의 발전에도 불구하고, 마케팅 분야에서는 여전히 연구가 미흡한 상태이다. 따라서 소비자 행동과 마케팅과 관련된 일반적인 경향에 대해서만 간단히 다루려고 한 다. 미국 심리학회 정의를 따르면서, 젠더(gender)란 한 주어진 문화가 개인의 생물학적 성생활 관련된 남성다움과 여성다움, 성 역할 혹은 개인의 심리학적 성 정체감을 의미한다. 반면에 섹스(sex)는 생물학적으로 부여된 생물의 성별을 의미한다. ‘성애’라는 용어는 주로 부여된 생물학적 성생활, 생물학", "source": "20261114_115146.jpg"}, {"kind": "heading", "text": "12-2a 성 역할", "source": "20261114_115150.jpg"}, {"kind": "paragraph", "text": "적 차이가 재배적인 경우에 사용된다(예: 태어나면서 주어진 성별).100 약 3억 3,000만 명의 미 국 소비자는 출생 시 성별로 부여된 남성과 여성은 매우 동등하게 나타낸다.101 성 정체성 (gender indentity)은 개인의 성에 대한 심리적 감각을 의미하는 성의 구성 요소이다. 트랜스젠더는 문화적으로 출생 시 부여된 성별과 일치하지 않는 개인의 성 정체성, 표현 및/또는 역할을 나타내기 위해 활용되는 시호로 사용된다.\n 대부분의 문화에서 남성과 여성은 유년기에 일찍이 학습된 성 역할 규범(sex-role norms)에 따라 행동할 것으로 기대된다. 최근까지 서구 사회에서 남성은 강하고, 단호하며, 감정 기복이 없는 것으로 기대되었다. 그들은 일자적으로 가정(breadwinner)이며, 숙련도, 자기 자신감, 자기 주도성을 중시하는 강한 성취 지향적 목표(agentic goal)에 의해 이끌려 왔다. 이와 같은 강력하 졌다는 사람들과의 조화로운 관계를 조성하며, 존중되어야, 정서적이고, 기정 지향적인 공동 동체적 목표(communal goal)에 의해 이끌려 왔다.\n 이와는 달리 전통적으로 남성은 보다 경쟁적이고, 독립적이며, 외부적으로 동기가 부여 되고, 기업에 높은 수준의 의사결정 직무에 진입해 법을 집행하며, 또한 한 가족의 수입 활동을 책임지는 것과 같은 중요한 결정자가 될 것으로 기대되었다. 경쟁적 브레드위너 (competitive breadwinner) 행동을 취하거나 혹은 비순응자(rebel) 같은 극단 병볍을 취할 것이다.104 예를 들어, 지배적인 남성 판매원과 접촉한 경우 남성들 은 외부적 요구가구와 쾌락적(hedonic) 제품 속성에 대한 더 많은 지출을 하고하는 경향이 있다.105\n 남성은 또한 여성을 비롯한 타인들에 의해 가치 평가를 수행할 때 주체 부각적 관점을 취한다. 이 제 6장에서 살펴본 바와 같이, 사람들은 전통적인 성 역할보다 성 편차적 역할과 관계가 더 우호적 관계를 결성할 때 주체로서 타인 평가, 역할 학습, 그리고 칭찬에 더 많은 피로로 이어질 수 있다.106 그러나 지 비스상 엄격한 규범은 전통적인 남성상과 여성상과 더불어 남성과 여성 소비자의 일반적인 태도 우선권이 있으며, 남성은 이러한 성 역할 규범으로부터 혜택을 보고 있다.107\n 한편, 여성들은 보다 순종적이고, 수동적이며, 부드럽고, 돌보며 부드러고, 위험을 회피하는 경향을 보이고 있다. 여성들의 호르몬 주기 또한 제품 선택에 영향을 줄 수 있는데, 여성들은 배란을 매월 7일 기간 동안에 외관을 향상시켜주는 의복을 선호하도록 영향을 끼치고 있 다.108 예를 들어, 웃고 있는 아기들의 사진을 보여주었을 때, 양육 동기가 프라이밍됨(priming) 여성들은 후술 돌보기 유역 현재에 더 집중하게 된다. 반면, 같은 이미지로 프라이밍된 남성 들은 더 미래 지향적이 된다. 놀랍게도, 이러한 차이는 여성이 척지만 즉각적인 보상을 선호하 고 남성이 더 장기적인 보상을 선호하도록 한다.109 또한, 여성은 남성보다 남성 조건에 대한 감정적 반응이 더 강하다고 보고되며, 이는 여성의 쾌락적인(음식 및 비용) 제품의 소비 반을 증가시키는 원인이 된다.110\n 그동안 시간이 지나면서 여성과 남성의 역할은 진화해 왔다. 특히, 많은 사람들이 출산 을 바꾸고 경력을 쌓는 것을 선호한다. 이러한 추세는 여성의 삶의 질을 높이고 여성의 태 도에 변화한 가져왔으며 또한 건강증을 이어왔다. 더 많은 남성이 집에서 육아를 하고 있으며, 그렇지 못하는 많은 이가 전통적인 남성의 도전하는 ‘반항적’ 정신을 보여 주고 있 는 데, 이는 그들의 소비 태도와 행동에 영향을 미친다.112", "source": "20261114_115150.jpg"}, {"kind": "heading", "text": "12-2b 소비자 행동에서의 성별 차이", "source": "20261114_115155.jpg"}, {"kind": "paragraph", "text": "전통적인 성 역할은 많은 국가에서 변해가고 있으며, 심지어 매우 보수적이고 남성 중심적인 국가에서도 변화가 생기고 있다. 예를 들면, 인도에는 여전히 강한 전통의 일반적인 성 역할이 존재되고 있지만 여성의 고등교육을 받은 경험을 쌓아야 재직 경로를 바꾸고 구매의사결정권도 가진다. 또한 이들은 여성의 고용률이 업종들에 달려있는 급격한 현황가 진행 중이다.116 전 세계적으로는 여성이 성별 임금 격차는 존재하지만 인도, 브라질, 러시아, 중국 등에서는 교육받은 여성들의 임금이 교육받은 남성들의 소득보다 훨씬 빠르게 증가하고 있다.114\n 일반적으로 보면, 현대의 광고 메세지는 과거보다 성 역할에 대한 고정관념을 덜 포함하고 있으며 일부 국가에서는 아예 볼 수 없을 정도로 성 역할에 대한 고정관념적 표현을 지양하고 있다.115 그러나 많은 광고에서의 여성의 고정관념적 표현에 대해 여성뿐만 아니라 남성도 부정적으로 반응을 한다.116\n 성 역할이 진화하고 있음에도 불구하고, 남성과 여성은 여전히 그들의 획득, 소비, 그리고 소비 후 행동에서 차이를 보이고 있다.\n 여성은 정보 검색을 할 때, 메세지에 대해 구체적이고 철저한 검사를 하며 제품 속성에 대한 반복 학습된 의사 결정을 할 가능성이 큰 태도를 동기-기반 처리를 한다.117 남성의 정보 처리 비용은 제한적일 수밖에 없기 때문에, 정보 처리의 객관적인 수준, 곧 프로세싱의 양에 있어서 제약을 받는다. 여성 소비자들은 직관에 따라 정보를 처리하는 수준의 MAO 의사 결정과정을 통해 광고에 관련된 정보를 처리하고 여성의 정보 처리 수준의 경우는 의사결정에 있어 더욱 신중한 분석이 수반되며,117 평가와 관련된 정보를 통합하고, 보다 정확한 판단을 내릴 수 있는 장점이 있다.118 예를 들어 자동차 광고와 관련된 정보에 반응(목적 및 목표와 관련된 행동)할 때, 여성은 광고뿐만 아니라 다른 사람과 관련된 정보들을 함께 사용하는 경향이 있다(공동체적 판단).\n 구매와 소비에 관련해서, 여성은 개인에게 제공되는 개인 서비스를 포함하는 경험을 선호하는 반면, 남성은 집단이나 다른 사람들에게 제공되는 서비스를 선호하는 경향이 있는 것으로 알려져 있다.119 또한 여성은 집단에 따라 행동하고 부정적인 경험에 민감하게 반응하는 경향이 있다. 반대로, 여성은 개인경험보다는 본원의 집단 경험을 긍정적으로 반응하는데, 이는 개인화가 사적인 설정에서 이루어지는 경우가 많기 때문이다. 예를 들면 미국의 연구에 따르면, 남성은 집에서의 편안한 분위기보다는 극장이나 경기장에서의 활동을 통해 즐거움을 경험하는 것을 선호하며, 여성은 집에서의 편안한 분위기를 더 선호하는 경향이 있다.120 반면, 남성은 물건을 획득하는 방법이자, 특히 전통적인 성 역할 고정관념을 가진 경우에는 의무로 보는 경향이 있다. 이러한 패턴은 터키와 네덜란드와 같은 다른 국가에서도 유지된다.\n 또한, 남성과 여성은 서로 다른 식습관을 보이는 경향이 있다. 여성은 보상(compensatory eating), 즉 스트레스에 대한 반응으로 또는 사회적 질투와 복수를 위한 같은 상황에 보상하기 위해 식사를 하는 경향이 더 있다.121 또한, 고객이 가전을 설치할 수 있는 ‘원하는 만큼 직접 하’기기 상황에서는 여성이 공동체적 목표로 선택하여 남성보다 많은 금액을 지불하는 경향이 있다.122 비슷하게, 도덕적 특성이 높은 프라임(prime) 여성들은 남성들보다 약 20% 더 많은 기부를 했다.123 한편 파키스탄, 미국의 2,788차 자동차 정비 서비스 이용 고객을 대상으로 한 한 연구에 의하면, 차량에 대해 경험이 많지 않은 경우, 여성은 주로 남성(정비사) 서비스 제공자로부터 남성보다 높은 수준의 견적을 받는 경향이 있었다.124\n 소비 후 과정과 관련하여, 남성은 열정적이고 강한 느낌과 같은 긍정적인 감정을 경험하는 데 더 민감한 반면, 여성은 두드러진 긴장과 같은 부정적인 감정을 경험하는 경향이", "source": "20261114_115155.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261114_115157.jpg"}, {"kind": "paragraph", "text": "이들 여성은 남성보다 화장품 사용이나 테닝과 같은 미용 활동에 더 많이 참여한다. 단지 외모를 크게 변화시키는 미용 활동에 참여하는 여성은 자신의 진짜 모습을 더 잘못 표현하고 있는 것으로 인식된다.26 실제로, 소셜 미디어 게시물에서 여성은 남성보다 자신의 화장법, 몸무게, 옷 사이즈, 젊은 시각, 나이와 같은 특정하고 잘못 표현하는 경향이 있는 반면, 남성은 여성보다 개인적 성취(교육, 경력, 취미, 도전 등)와 유쾌한 직장에서의 일하는 것, 자애와 같은 잘못 표현하려는 경향이 있다. 이러한 기만적인 자기 표현은, 생활 소득 격차가 작은 성과의 평등 수준이 높은 국가에서 더 적다.27", "source": "20261114_115157.jpg"}, {"kind": "heading", "text": "12-2c 성별과 성적 지향성", "source": "20261114_115204.jpg"}, {"kind": "paragraph", "text": "성(sex)은 사람을 남성, 여성, 또는 간성(intersex)으로 해부학적으로 분류하는 것으로, 일반적으로 출생 시에 지정된다. 성 정체성(gender identity)은 자신을 여성, 남성, 두 성 모두, 둘 다도 아니거나 성 스펙트럼상의 어느 곳에 속한다고 느끼는 개인의 자각이다. 이는 성 스펙트럼에서 개인이 지각하는 외적인 경험의 위치를 포함한다. 성적 지향성(sexual orientation)은 다른 사람에 대한 성적 및 감정적 끌림과 이러한 끌림에 바탕을 둔 행동이나 신념 등을 나타낸다.", "source": "20261114_115204.jpg"}, {"kind": "heading", "text": "12-3 어떻게 지역적 영향력이 소비자 행동에 영향을 주는가", "source": "20261114_115206.jpg"}, {"kind": "paragraph", "text": "사람들은 동일한 지역에서 일하고 살아가는 경향이 있기 때문에, 국가의 한 부분에 살고 있는 거주자들은 또 다른 지역에 살고 있는 사람들과는 다른 행동 패턴을 발전시켜 나갈 수 있다. 예를 들어, 뉴잉글랜드 출신의 소비자는 바닷가재와 스키를 즐기고, 남부 캘리포니아 출신의 소비자는 아보카도 토스트와 서핑을, 텍사스에서 온 사람은 바비큐와 로데오를 선호할 수 있다. 마찬가지로, 이 절에서는 사람들이 살아가는 지역이 어떻게 미국 내뿐만 아니라 세계 도처에서 소비자 행동에 영향을 미칠 수 있는지를 살펴본다.", "source": "20261114_115206.jpg"}, {"kind": "heading", "text": "12-3a 미국 내 지역", "source": "20261114_115212.jpg"}, {"kind": "paragraph", "text": "미국은 광활한 국가(3,618,783제곱마일)로, 면적 면에서 러시아, 캐나다, 중국에 이어 세계에서 네 번째로 크다.152 다양한 환경, 인종, 그리고 문화사에 기초하여 미국의 여러 지역은 체계적인 미국 문화와는 별개로 각기 뚜렷한 정체성을 발전시켜 왔다. 예를 들어, 이 지역은 남서부(Southwest)는 원래 멕시코의 영토였으며 지금도 멕시코풍의 색채를 많이 띠고있다. 남서부는 또한 미국 원주민과 개척자의 뿌리를 지니고 있다. 뉴잉글랜드(New England)에선 조상주의가의 동한 해안은 초기 13개 영국 식민지의 뿔리한 역할을 담당하였고 있다. 서부(West), 및 북서부(Northwest)의 광활한 평야는 이 지역들의 자유분방한 개성을 반영한다. 부유하지주에게도이자 로다(Arkuz)까지의 남동부(Deep South)는 그 특유의 상업 부분이 농업에서, 특히 조면에서 면화의 의존하며 여전히 남부연합의 반란에 연루되어 있다. 마지막으로, 중서부(Midwest)는 농경과 농업으로 유명하다.\n 이러한 설명은 매우 광범위한 일반화를 나타낸다. 각 지역은 언급하기에 너무 많은 고유한 영향력과 차이점을 갖고 있지만, 지역 차이는 소비 패턴에 영향을 미칠 수 있다. 예를 들어, 네바다, 텍사스로 이동하는 멕시코 출신 소비자들의 대규모 이주 때문에, 캘리포니아 지역은 추가할 수 있다. 예를 들어, 강력한 멕시코 영향 때문에 사우스웨스트의 소비자들은 토르티야(tortilla)나 살사(salsa) 같은 양념 맛이 강한 음식은 선호한다. 흥미롭게도, 일부 텍스멕스(Tex-Mex) 음식은 후에 미국에서 개발된 후 멕시코에서 인기를 얻게 되었다.153\n 어떤 한 지역 내에서의 소비자들 사이에는 가치와 라이프스타일이 상당히 범하게 존재하기 때문에, 전통적인 국소적 클러스터 분석은 이제는 덜 널리 쓰이고 있다. 대신 각종 인구 통계의 기본에서 자세를 기준으로 하는 클러스터링을 경책 받고 있다. 클러스터링(clustering)은 인구 통계(연령, 소득, 성별, 직업, 혼인 상태, 거주 위치)와 같은 여러 요인 위에 현대를 두고 있다.154 이 개념은 소비자들이 인구 통계만으로는 미처 파악할 수 없는 다양한 라이프스타일과 함께 같은처럼 구매 행동을 할 필요를 기반으로 한다. 이 개념에 따르면 비슷한 인구 통계적 특질을 갖는 사람들은 소비자들은 같은 요인을 구하는 경향이 있고 우리의 차이점을 인지하고 있는데, 초점을 맞춘다. 클러스터링을 지리적 지역 및 서비스로 제공하는 회사의 예로는 닐슨(Neilsen)의 지오클러스터링 및 경험지수(Experie)가 있다.\n Rating Index for Zip Markets)는 아니겠다. 소비자 인구 특성, 라이프스타일, 소비 행동 등으로 지역과 이웃을 보다 정밀한 클러스터로 집단화하고 있다. 이러한 시스템은 소유 자동차 유형 및 선호하는 라디오 포맷 등을 포함해서 소득, 교육 수준, 연령, 가구 유형, 도시화 정도, 태도 및 제품/서비스 선호도에 따라 이번 한 클러스터를 정의할 수 있다.\n 예를 들어 프리즘은 미국의 소비자 시장을 지리적(도시, 교외, 복수 도시, 소규모 도시 및 필) 기준과 생애 단계(연령 및 자녀유무)라는 라이프스타일 기준으로 68개로 구분하고 있다. 캐나다도 비슷한 시스템으로 소비자를 67개의 집단으로 구분하고 있다.156 여기에 포함된 일부분을 소개한다:157\n 젊은 귀족들(Young Digerati)은 부유하고 고등교육을 받았으며 첨단기술에 해박한 25~44세까지의 도시에 거주하고 있는 소비자들이다.\n 어린이와 성인 소비자(Kids & Cul-de-sac)는 상중의 소득을 가진 25~44세까지의 외곽지역으로, 대부분 대학을 졸업했고 집을 소유하고 있으며 자녀들과 교외 지역에서 살고 있다.", "source": "20261114_115212.jpg"}, {"kind": "heading", "text": "마케팅 시사점 / 12-3b 세계의 지역", "source": "20261114_115214.jpg"}, {"kind": "paragraph", "text": "마케팅 시사점\n 마케터들은 미국의 다양한 지역의 소비자에게 소구하기 위해 제품과 커뮤니케이션을 개발할 수 있다. 예를 들어, 프리토레이(Frito-Lay)는 남동부 주에 거주하는 소비자에게 스파이시(Cajun Spice) 감자칩을 판매한다. 또한, 플로리다와 오레건 주, 하와이의 마케터이너 노틸러스(Nautilus)는 해산물 스낵이고 등록명 지역 관련 제품을 판매한다. 롤러집은 텍사스 주 고기 등록명 지명 관련 제품을 판매하며, 이곳에 마케팅을 집중하고 있다. 그 외에도 미국 전역에서 출시되는 제품은 지역적으로 다른 소규모 경쟁 업체를 합친 것보다 많지 않다. 예를 들어, 미시간 주 디트로이트에 본사를 둔 베터 메이드(Better Made) 라든지 시리에서 인기가 높다.158\n 한편, 회사들은 여러 제품을 마케팅하는 데 드는 비용의 절감뿐 아니라 지역 브랜드를 통합하기도 한다. 지난 2년 간 마케터들은 경험을 든 딘 푸드(Dean Foods)는 “데어리펀어(DairyPure)”라는 신규 단일의 전국 통합 브랜드에 초점을 맞추기 위해 자사의 우유 브랜드 3개와 마케팅에 변화를 주었다. 그들은 특정 지역 판매에서 브랜드 인지도에서의 지연에서 신선하지 않지 않았던 우유명을 사용하는 것이다.159\n 또한, 마케터들은 클러스터링 시스템을 사용해서 새로운 고객을 찾고, 고객 욕구를 파악하며, 성과를 이해할 수 있다. 예를 들어, 매장 위치를 선정하며, 매출 등에 영향을 미친다.160\n 쇼퍼블은 특정 상품을 구매할 가능성이 가장 높은 소비자들이 사는 소규모 지역, 예를 들어 동네를 식별하기 위해 클러스터링을 사용한다. 예를 들어, 반려동물 제품을 판매하는 펫코(Petco)는 “보통 세입자들을 동물과 함께 키우는 것을 원하고 있다.”는 기준을 정하여 지점을 선정하기 위해 클러스터를 이용하고 있다.\n 클러스터링 시스템은 다른 국가 및 국경을 초월해서 이용된다. 익스피디언의 모자이크 글로벌(Mosaic Global) 시스템은 소비자들의 가치 공통점의 생활 방식 범주로 분류하여 글로벌 마케터들이 세계 각지의 유사한 특성을 가진 동질의 소비자 그룹을 찾도록 돕는다. 예를 들어, 세련된 싱글(sophisticated single)은 도시 거주, 미혼, 고소득 소비자를 나타내며, 부유한 중년층을 나타내는 “지속적인 고정자산(know-income elders)”로 주로 도시 지역에 거주하는 저소득의 나이 든 소비자들이다.\n 마케터들은 자국 외 다른 나라에서 판매되는 특정한 제품을 설계할 때 소비 행동이 얼마나 광범위한지를 이해해야 할 필요가 있다. 처음으로 최소한 일부 개의 광범한 지역 시장을 목표로 하기보다는 세분화된 여러 성으로 구성된 지역 시장이 된다. 성 차이는 대부분 국가의 북부, 남부, 동부, 서부에 있다. 이 놀라운 변형으로 예를 들면, 새로이 등장하는 중산층은 주로 적극며 새로운 생활 방식을 등에 실어 나른다.\n 반면에 나중에 고령 소비자 집단은 주로 인구가 적다. 그 결과, 마케터들은 가장 유리한 지역 혹은 전 세계 시장에 초점을 맞추어야 한다.\n 12-3b 세계의 지역\n 분명히, 소비자가 거주하는 세계 지역은 소비 패턴에 영향을 미칠 수 있다. 거의 모든 소비자 행동 측면에서 문화 간 차이가 존재한다. 일부 국가들은 특정 제품과 강하게 연관되어 있는 반면(예: 독일의 맥주, 이탈리아의 스파게티), 일부 국가의 소비는 특정 제품의 소비가 금지된 지역도 있다. 예를 들어, 이슬람 국가에서는 음주의 소비가 금지된다.\n 인도와 이스라엘에서는 돼지고기, 인도에서는 소고기 소비가 금지된다.\n 문화적 영향은 인내심과 같은 행동에도 영향을 미친다. 예를 들어, 서양 문화의 소비자들은 동전의 영향을 끼치는 반면 동양 문화의 소비자들은 행동에도 영향을 미친다. 예를 들어, 서양 문화의 소비자들은 동전의 영향을 끼치는 반면 동양 문화의 소비자들은 문화의 영향을 많이 받는다. 예를 들어, 한국 소비자들은 광고 메시지보다 더 즉각적인 소비를 더 중시하는 경향이 있다.163 또한, 문화적 영향은 소비 상황에 대한 인지적 접근 방식에도 영향을 미칠 수 있다. 예를 들어", "source": "20261114_115214.jpg"}, {"kind": "paragraph", "text": "더 넓은 의미에서, 문화가 다른 방식은 소비자들의 사고와 행동에 영향을 미칠 수 있다. 이러한 차이는 세 가지 주요 차원에서 볼 수 있다.\n ● 개인주의 대 집단주의: 앞서 여러 장에서 언급했듯이, 개인주의가 높은 문화권에서는 소비자들은 자신을 집단의 일부분보다는 개인으로 더욱 강조한다. 집단주의가 높은 문화권(동양)이 많은 문화들의 소비자들은 자신의 개성보다는 다른 사람들과의 유대를 강조한다.165 마케터들은 이러한 구분을 고객을 겨냥한 마케팅 활동에 적용할 수 있다. 예를 들면, 강인하게 개인적이거나 집단의 일원으로서 소비자를 묘사하는 데 적응을 할 수 있다.\n ● 과업 지향성 대 수직 지향성: 수직 지향성을 보이는 문화권의 소비자들은 공통의 가치를 두는 반면에, 수직 지향성은 높은 문화권 소비자들은 사회적 등급 문제들을 위계를 강조한다.166 이 두 과업 지향성에 의해 영향은 받는 소비자들에게 소구하는 지위 상징(status-symbol) 제품의 마케터들에게는 특히 중요하다.\n ● 남성(masculine) 대 여성(feminine): (미국 같은) 남성 위주 문화권의 소비자들은 좀 더 공격성이거나 개인적인 축적에 초점을 맞추는 경향이 있는 반면에, (네덜란드 같은) 여성 위주 문화권의 소비자들은 사회적 관계와 삶의 질을 좀 더 중요하게 생각한다.167 예를 들면, 공격적 주제의 광고는 여성적 문화권보다 남성적 문화권에서 더욱 효과적일 것이다.\n 그러나 특정 문화권에 있는", "source": "20261114_115219.jpg"}, {"kind": "heading", "text": "12-4 어떻게 민족 집단 및 종교적 영향력이 소비자 행동에 영향을 주는가", "source": "20261114_115221.jpg"}, {"kind": "paragraph", "text": "나이, 성별, 성적 지향, 지역적 영향 외에도, 민족 집단과 종교는 소비자 행동에 큰 영향을 미치는 주요 요소이다. 민족적 영향과 종교적 신념은 여러 문화적 요소 중 일부에 불과하지 않지만, 이들의 집단에서 소비자의 사고, 감정, 행동 방식에 영향을 미친다.\n많은 나라 사람들이 이동은 다양한 민족 집단(ethnic group)으로 구성된 다문화 그룹을 형성한다. 이는 미국과 점점 더 글로벌화되는 세계에서의 상황이다. 민족 집단의 구성원은 공통의 조상, 가치관, 신념, 행동, 종교, 경험을 공유한다. 사람들은 다른 사람들과 구별되는 특정 민족 집단에 속해 있으며, 그들의 출신과 문화를 인식한다.1) 사회 내의 민족 집단은 원주민, 노예였던 사람들, 난민 및 망명 신청자, 이민자 또는 다양한 배경을 가진 수입 노동자이다.\n민족 집단은 소비자 행동에 강하게 영향을 미치고 시장에 고유한 특징을 제공하는 문화적 유대를 견고하게 한다. 문화 적응(acculturation) 과정을 통해 문화 그룹은 새로운 문화에 적응하기 위해 상호 문화적 접촉으로 인해 가치관, 신념, 행동 및포괄 경제적 변화를 겪는다. 그런 다음, 소비자들은 소비와 자원 활용 등 다른 사람의 행동을 모델링함으로써, 그리고 특정 행동 양식을 강화하거나 거부하는 역할을 하는 희소한 자원의 배분을 통해 새로운 문화적 규범을 습득한다(17장에서 논의한 내용). 문화 접목은 가족, 친구 및 매체, 매장 장소, 학교와 같은 기관에 의해 강하게 영향을 받으며 전통적인 문화와 결합하여 독특한 소비자 문화를 창출한다.\n문화 적응은 두 상호 작용하는 문화가 서로에게 영향을 미칠 때 발생하며, 상호작용을 통해 예를 들어, 주류 문화의 구성원들로 하여금 민족 집단의 특징을 채택하도록 동기를 유발하기도 한다.170 또한, 이중 문화 소비자(bicultural consumer)는 각각의 다른 문화에서 서로 다른 규범, 습관, 가치, 관습, 믿음, 행동 양식을 가지고 있으며, 두 문화에 능숙하게 적응하고 통합한 소비자들로, 다국적 브랜드가 표적화하는 의미에 따른 브릭스틱(blend stick)이다.171 생애를 통해 새로운 체험들과 브랜드 가치예: 버버리(Burberry): 전통적인 컨서번트(covent) 고급 브랜드로 여겨지는, 이는 그들 스스로 두 가지 다른 문화에 능숙하게 통합되기 때문인 것으로 해석된다. 이들의 경우, 일부에 속한 이중 문화 소비자들은 영어 브랜드 이름보다 일본어 브랜드 이름을 선호했다.172 인종차별주의(racism)와 자기족 우월주의(ethnocentrism)는 장단의 효과를 지닌다. 이러한 소비자들이 자신의 민족 집단보다 다른 제품과 생활 방식을 희화화하고 부수기고 있다. 소비자들은 종종 그러한 불공정한 대우를 받아 비난을 받아야 마땅할 수 있다.175 이는 비단, 소수자뿐 아니라, 연령, 성별 또는 정치생활 뿐만 아니라 민족 집단 때문일 수도 있다. 민족 집단의 구성원들이 이러한 배제, 거부, 차별을 경험하면 그들의 선택이 제한되어 개인 생활에 부정적인 영향을 미친다.182\n 12-4a 미국 내 소수민족 집단 수년에 걸쳐 다양한 문화와 국가의 사람들이 미국으로 건너왔다. 1600년대 초반에는 순례자들이 도착했고, 17세기부터 19세기까지는 서유럽에서 북유럽에서 온 노예화된 아프리카인", "source": "20261114_115221.jpg"}, {"kind": "heading", "text": "히스패닉 아메리칸 소비자", "source": "20261114_115227.jpg"}, {"kind": "paragraph", "text": "돌과 이민자들이 도착했다. 그 후 19세기와 20세기에는 남유럽과 동유럽, 중국, 카리브해에서 온 이민자들이, 20세기와 21세기에는 주로 중동과 인도에서 온 아시아 이민자들이 도 착했다.183\n 다양한 문화를 동시에 소구하는 전략의 사용을 의미하는 다문화 마케팅(multicultural marketing)은 상당히 중요하다. 이 접근 방식은 나중에 설명이 나가게 하는 것이 아니라 말부터 소비자 집단에 따라 마케팅 접기와 관련된 고찰을 모두 요구하고 있다. 예를 들면, 히스패닉 아메리칸, 아프리칸 아메리칸 및 아시아 아메리칸 소비자를 각각의 독립된 대중 매체와 수백만 라틴어 커뮤니케이션 예산을 책정하고 있다. 맥도널드는 그들의 입맛은 “소비자와 그들에게 중요한 문화적 배경으로 하는 것이 우리의 일이다. 그리고 이 나라는 급격하게 변화하고 있음을 인식하고 있다.”라고 설명하였다.184 다음 절은 미국 내에 있는 다 민족 집단에 초점을 맞출 것이다.\n 히스패닉 아메리칸 소비자 히스패닉 및 라틴계 미국인 소비자는 오늘날 미국에서 가장 큰 민족 집단 중 하나로, 시코, 푸에르토리코, 쿠바, 엘살바도르, 페루발룰 등 다양한 국가 출신의 사람들을 포함한 다.185 2020년 이 인구는 6,210만 명에 달하며 미국 전체 인구의 18%를 차지했다. 이들 은 2010년에서 2020년 사이에 28%의 빠르게 빠르게 성장하였으며, 이는 어느 다른 비히스패 닉 및 라틴계 미국인 가구의 증장률 수치보다 높은 점이다. 이전의 이민자 집단들과 마찬 가지로, 적응 수준이 기준화한 히스패닉 및 라틴계 미국인은 스페인어와 영어를 모두 구사한 부분 영어를 사용하고 주류 문화에 참여한다. 예를 들면, 많은 주류 제품들이 스페인어로 된 라 사용될 수 있는 이중 문화의 수수가 있다. 또한 이들은 아버지로부터 물려받은 전통적 유행에 해 동참하고 문화해 히스패닉 및 라틴계 아메리칸 문화 전통을 보존하고 있다.186\n 소비자와 문화적 적응 수준과 관련된 부분 동의화의 정도(consification)는 소비 패턴에 영향을 미친다. 비히스패 민족 집단에 강한 동의화 수준의 적응을 이룬 소비자와 동일화하는 소비자와 란디오 광고, 광고판, 가족 구성원 및 동료의 의견을 가능성이 더 높고, 한 도화되는 집단으로 동일화하는 소비자보다 쿠폰 사용을 할 가능성이 있다. 일부 연구에선 스페니시 주 류 미국 쿠폰에 대한 강한 지향성을 보여주었다.192 정치적 성향에 미치는 동일 수 있다. 예를 들어, 코세에서는 자신이 유리한 반라 집단과 동일시느끼는 유권자 층은 우루씨와 같은 관련 민족 정체성 제품이나 브랜드를 더 지지한 경향이 있다.193", "source": "20261114_115227.jpg"}, {"kind": "heading", "text": "매체와 커뮤니케이션", "source": "20261114_115228.jpg"}, {"kind": "paragraph", "text": "물 통해 고객 충성도를 구축하고 있다. 주요 스페인어 네트워크인 유니비전(Univision)은 히스패닉계 미국인 밀레니얼 세대를 목표로 한 앱 및 온디맨드 디지털 기기를 통해 유니비전과 유니마스(Unimas) 채널의 구독 기반 라이브 스트리밍 옵션을 제공한다. 프로터앤갬블(Procter & Gamble)은 이 세분 시장이 쇼핑하러 떠날 때 칼리지 내페브리즈(Brazilian Carnival Febreze) 공기 청정제와 집안을 위한 나트라 가정용 제품을 제공하며, 다양한 제품에 슬레브리를 사용하고 있다.195 마케터들은 히스패닉계 미국인 소비자들이 맞춤형 유통 채널을 이용할 수 있도록 하고 있다. 이들 가운데 상당수는 라틴계 슈퍼마켓 체인 및 마킹스포트와 같은 히스패닉계 미국인을 위해 특화된 체인, 히스패닉 새비야(Hispanic Savd) 매장을 운영하며, 지역 슈퍼마켓에 “구석지대” 히스패닉 제품 매장을 운영하고 있다. 월마트(Walmart)는 캘리포니아, 텍사스 및 기타 표적 시장 지역에서 음악과 팝업, 이벤트 선호하는 식품 제품을 토대로 직접 그 공간을 설계한 ‘수퍼 메르카도 데 월마트(Suowemercado de Walmart)’ 포맷으로 매장을 차지하고 있다. 하지만, 미국인들이 미주 지역 이민 공동체의 경계를 넘어서 생활하면서 라티노 정체성과 강한 연결 고리를 형성함에 따라 회사들은 멕시칸계, 푸에르토리코계, 쿠바계 미국인 등과의 구분을 넘어서야 하는 도전에 직면하고 있다. 그 결과, 히스패닉계 미국인들은 집중 공략할 경우 도와주어야 할 중요한 세분 시장에 대한 통찰력을 발전시키는 기회를 얻고 있다.\n 매체와 커뮤니케이션 히스패닉계 미국인들은 특정 지역에 집중되어 있고 공통된 언어와 문화를 공유하는 경향이 있기 때문에 쉽게 접촉할 수 있는 매체 목표이다. 텔레무뇨를 통해 광고주들은 유니비전, 텔레문도(Telemundo)의 고품 및 예스파뇰권(En spanol), 그리고 민족 전문 네트워크인 히스패닉 텔리비전 네트워크(Hispanic Televicion Network)를 통해 소비자들에게 도달할 수 있다. 뉴스코프(Fox)가 보유하는 타이언뉴스(Tian News)는 스테이트팜(State Farm) 보험은 처음으로 스페인어 채널에서 30세 미만의 소비자들을 목표로 한 광고 캠페인을 일으켰다. 이 스포츠 채널인 ESPN 데포르테스(ESPN Deportes)는 스페인어 채널에서 미국 스포츠 팀들이 출전하는 경기를 방송한다. 히스패닉계 미국인들은 가능한 한 자주 자국 방송사의 뉴스를 보기를 원하기 때문에, 미국에서는 멕시칸계 미국인들을 위한 디 레이망티케레멘토 데 메히코(Telemantiquremento de Mehico) 버전과 스페인인들을 위한 스페인 국제 텔레비전 스페인 인터내셔널TV)이 최적화되어 있다. 미국의 라디오 방송이 히스패닉계 미국인 시청자의 수요를 따라잡기 위해 노력하는 가운데, 많은 새로운 라디오 채널이 그들을 위한 프로그램을 편성하고 스페인어 노래를 방송하고 있다. 히스패닉계 미국인들에게 도달하고 그들의 고객 지껄 제공하는 맞춤형 적용의 또 다른 훌륭한 한 예는 스마트폰이다.\n 히스패닉계 미국인들은 민족적으로 사용하는 광고에 긍정적으로 반응하는 경향이 있다. 이들은 이 광고를 인종을 인식하여, 소비자들이 광고된 브랜드에 대해 더 긍정적인 태도를 취한다. 이 전략은 미국인의 든든한 자기 인식(즉, 해당 그룹이 소구될 경우의 시가 상승과 같다)으로 민족적 강조하는 광고는 민족적 자기 인식(ethnic self-awareness)을 유발하여 표적 집단으로부터 더 호의적인 반응을 이끌어 낼 수 있다.203 사람들은 자신에게 적용하려는 메시지를 보여 주는 다른 사람들에게 자연스럽게 적용하러", "source": "20261114_115228.jpg"}, {"kind": "heading", "text": "아프리칸 아메리칸 소비자", "source": "20261114_115234.jpg"}, {"kind": "paragraph", "text": "는 상황이 있다. 이 과정을 순응(accommodation)이라고 한다. 따라서 정보원(source) 그룹과 소통하기 위해 더 많은 노력을 기울일수록, 예를 들어 역할 모델 및 모국어를 사용하는 경우, 해당 그룹의 구성원들로부터 더 큰 반응을 얻고 더 긍정적인 감정을 유발할 수 있다. 히스패닉을 스페인어로 광고를 하면 회사가 히스패닉 커뮤니티에 대한 민감성과 연대감을 가지고 있다는 인식을 준다. 소비자들이 브랜드와 회사에 대해 긍정적인 감정을 가지게 된다.204 예를 들어, 버라이즌(Verizon)은 스페인어 광고를 크게 못해 본, 메이시즈를 위해 15세 소녀를 위한 퀸세아라(Quinceañera) 파티와 같은 히스패닉 전통의 초점을 맞춘 광고를 활용하여, 부모와 학교 모두의 부모 및 가족문을 표절화하고 있다.205 폭스바겐(volkswagen)은 히스패닉 이중 언어 사용자의 부모 및 조부모를 대표하고 있는 사람이지만, 아들과 함께 하는 광고 캠페인에서 스페인어보다 영어를 선호하는 사람들을 위해 TV 광고를 한 번은 영어로, 한 번은 스페인어로 두 번씩 내보내고 있다.206 그러나 스페인어로 된 메시지를 단독으로 사용하는 것은 부정적 광고 인식으로 이어질 수도 있다. 히스패닉계 미국인을 대상으로 하는 많은 광고가 영어로 전달되는 이유는 소비자들이 종종 이중 언어를 구사하지만 높은 문화적 적응을 가지고 있기 때문이다. 적절히 전달된 효과적인 광고는 영어와 스페인어로 모두 사용될 수 있는반, 바로 P&amp;G가 상업용 캠페인을 위한 마옴 및 가정을 영어 및 스페인어로 이중 언어로 움직이는 박스(gorilousa.com)에서 이중 언어 이중 스페이칭 예도 들 수 있다.207 소수민족에게 미국을 구상하는 것은 그들의 독특한 문화를 존중함을 인식할 때, 만약 본문이 주로 스페인어로 구성되어 있을 때는 해당 광고를 잠재력이 더 큰 성인 타깃들에 맞춰 영어로 바꾸는 것이 도달 대의 경우보다 설득적인 경향성이 있다.208\n 아프리칸 아메리칸 소비자 2019년 아프리카계 미국인의 인구는 4,590만 명(흑인 인구의 백분율은 미국 인구의 14%를 차지한다. 이 집단은 소득과 교육 수준, 이민 상태 및 결혼에서 더 큰 분포를 보이는 매우 결합된 집단으로 구성된 매우 다채로운 문화이다). 아프리카계를 미국인들은 매년 1조 달러 이상의 상당한 구매 시장을 연간 약 1조 달러의 구매력을 보유하고 있다.210 다른 모든 하위문화와 마찬가지로, 아프리카계 미국인 소비자들은 일반 인구와 닮아 있는 점도 있고 다른 점도 있다. 예를 들어, 아프리카계 미국인 소비자들은 인구 평균보다 더 젊다(이들의 중앙 연령은 34세이다). 이들은 스마트폰을 소유할 가능성이 더 높으며, 다른 사람들보다 스마트폰을 12% 더 많이 사용한다.211 아프리카계 미국인들은 사람들이 자신이 원하는 방식으로 살고, 옷을 입고, 외모를 꾸밀 자유가 있어야 한다고 믿을 가능성이 더 높다. 또한 이들은 반드시 주류 문화에 동화될 필요는 없다고 생각하고 있다.212 소득이 증가함에 따라 문화적 정체성을 유지하려는 경향 수준이 더욱 발전되고 있다. 닐슨(Nelson)의 연구에 따르면, 아프리카계 미국인들은 일반 인구에 비해 광고에서 다양성이 중요하다고 믿는 가능성이 30% 더 높으며, 광고에 아프리카계 미국인이 포함될 때 구매할 가능성이 38% 더 높다.213", "source": "20261114_115234.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261114_115236.jpg"}, {"kind": "paragraph", "text": "흑인 및 아프리카계 미국인 소비자들은 다른 인종 집단과 마찬가지로 자신들을 대상으로 한 제품과 커뮤니케이션에 긍정적으로 반응한다. 한편적으로 이들은 광고되는 많은 브랜드를 신뢰하거나 충성심이 낮다.214 마케터들은 이 집단의 특정 요구와 관심을 해결하는 여러 가지 방법으로 해결하고 있다.\n 제품 개발과 유통 맥킨지맥킨지(McKinsey and Company)의 보고서에 따르면, 아프리카계 미국인 가구의 200%가 식료품, 레스토랑, 농산물 시장 및 기타 식료품 지출에 사용된다. 점점 사막(food desert)에 거주하고 있는 미국인들의 증가로 아프리카계 미국인 가구들은 더 적절한 의료, 보험, 제품과 점에 의지할 가능성이 2.4배 더 높다. 또한 맥킨지는 신선한 식품 선택과 새로운 식료품점을 개설하는 것이 현재의 제품보다 열등한 도시 이상의 수익성이 있을 수 있다고 지적하고 있다.\n 다른 제품 카테고리에서도 기회가 있다. 가스와 기기인가의 교차판매로 뷰티 업체인 뷰티테이프(Everyday Beauty)는 흑인들이 많은 빈민가에서 제품을 개발했다. 2% – 3%의 본사를 둔 월드드루프(Worlds of Curls)는 다양한 피부색과 머리색에 적응하기 위해 견주(Prettie Girls) 브랜드를 사용하여 인형을 만든다. 이들 회사는 흑인의 기타 점포 체인망으로 유통될 수 있다. 한편, 매출이 100만 달러를 넘어서게 했다. 또 다른 예로는 소비자들이 그래닝그리팅(American Greetings)과 카마트 카드가(Manloras)가 세분 시장을 위한 특별한 라인의 축하 카드를 제공한다216 마케터들은 또한 이 세분 시장을 위한 유통 전략을 조정할 수 있다.\n 매체와 커뮤니케이션 마케터들은 블랙 엔터테인먼트 텔레비전(Black Entertainment Television)과 같은 TV 네트워크, 드콘트 전문 케이블 채널인 에보니(Ebony)를 같은 잡지를 포함한 다양한 매체를 사용하여 이 세분 시장을 특정적으로 공략할 수 있다. 다른 전문가들에 따르면, 대부분의 아프리카계 미국인들은 케이블 TV 가입시간219 또한, 구글(Google)의 연구에 따르면 아프리카계 미국인들은 전체 미국 인구보다 웹 및 모빌을 많이 사용하고, 비디오를 시청하며, 이는 다른 여러 가지 세분 시장의 도달하는 데 효과적임을 나타낸다.220\n 미국의 주요 광고주 중 흡입, 제네럴 모터스(General Motors), 코카콜라(The Coca-Cola), 존슨앤존슨 등은 이 세분 시장을 위한 광고에 적극적으로 투자하고 있다. 여기서 중요한 교훈일 수용이다. 아프리카계 미국인들은 미국의 역사에서 매우 중요한 기회를 제공하는 소비자들이다. 이 집단은 공정하게 표현될 때 깔끔한 커뮤니케이션에서 더 긍정적으로 반응할 것이다.221\n 마케터들은 미국에 많이 존재하는 아프리카계 미국인의 새로운 퍼센 세분 시장 인쇄, 인터넷, 소셜 미디어 매체를 가로질러 고려해야 한다. 규모시장, 아프리카계 미국인은 모든 제품 범주에서 영향을 미친다. 크고 작은 회사들은 이 소비자들을 제품, 서비스, 미디어로부터 판매성과를 높일 수 있다.\n 아시안 아메리칸 소비자 아시아계 미국인은 미국에서 세 번째로 크고 가장 빠르게 성장하는 인종 집단이다. 이들은 가장 높은 평균 가치를 지닌다. 이 급속히 성장하는 민족 그룹은 2300만 명으로 인구의 7%를 차지한다. 이 급속히 성장하는 민족 그룹은 그들의 가족이 중심을 이룬다. 수입이 증가하고 있으며 미국인 가구의 중위 소득은 86,000달러이상이다.222\n 마케터들이 이 집단의 커뮤니티는 인도 아다특에서 태평양이 이루기까지 20개 이상의 국가에서 온 사람들로 구성되어 있으며, 각자 고유한 가치와 관습을 가지고 있다. 가장 큰 인종 그룹을 중국인, 인도인, 한국인, 베트남, 일본으로 이루어진다. 모든 아시아계 미국인의 거의 절반은 뉴욕, 캘리포니아, 텍사스에 거주하고 있다. 이 엄청난 다양성을 고려할 때, 마케터들은 표적으로 삼고자 하는 아시아계 미국인 세분 시장을 구체적으로 선택할 필요가 있다.\n 개개인의 차이에 불구하고 대부분의 미국 아시아 문화의 본관은 가족, 전통, 학업, 훈련을 중시하는 경향이 있다.226 다른 소비자 세분 시장보다 아시아계 미국인 소비자들은 현대적인 가정의 구성원이 포함된다. 이들은 호의주를 중요시하고 대부분의 주요 구매에서는 철저한 조사를 한다. 브랜드를 선호하며, 고품질 제품에 기꺼이 비용을 지불하지만, 할인에도 긍정적으로 반응한다.", "source": "20261114_115236.jpg"}, {"kind": "paragraph", "text": "아시아계 미국인들은 평균 소비자보다 두 배 이상 가전과 제품을 온라인에서 확인한 후 구매하는 경향이 있다.228 이 그룹의 소비자들은 또한 물을 절약하는 제품을 걱정하고 있고, 높은 교육 수준을 갖추고 있으며, 컴퓨터 활용 능력이 높고, 집집마다 몇 대씩 컴퓨터를 보유하고 있다.229 세계 마케팅 3세계에서는 높은 수준의 동화가 이루어지는 경우가 많다.\n 12-4b 세계 도처에 있는 민족적 다양성\n 민족적 다양성은 전 세계의 급성장하는 중산층을 형성하는 데 중요한 이슈이다. 관련 문화적 그룹은 내부적으로나 외부적으로 굉장히 복잡하고, 사회적 수많은 민족 집단은 모두 눈여겨볼 만한 마케팅 표적이다.240 아시아계 미국인은 또한 인도와 한국뿐만 아니라 베트남 및 중국 등 아시아 여러 국가에 뿌리를 두고 있다. 오늘날 미국과 캐나다에는 프랑스어를 사용하는 하위문화들뿐만 아니라 수많은 아시아계 하위문화들과 여러 세대의 히스패닉 하위문화들도 존재하고 있다.\n 캐나다의 나머지 인구와 비교해 보면, 프랑스계 캐나다인은 독창적인 요리와 스크래치(scratch) 요리에 더 많은 주요 재료를 사용하는 경향이 있고, 많은 향량 음료, 맥주, 와인 및 주류를 소비하지만, 더 적은 양의 냉동 채소, 다이어트 음료 및 동결한 음식을 소비한다. 캐나다에는 많은 다른 집단도 존재하지만 다민족적인 주요 그룹은 아시아인과 흑인 소비자들이다. 쉐프인 채프H Chef으로서 캐나다 전기차 볼트(Bolt)를 본격적으로 출시할 때, 영화, 공원과 같은 실외 광고, 버스 광고, 극장 광고, 팝송 라디오,인종 등 다양한 언어로 TV와 신문 매체, 유튜브, 검색 엔진 광고, 소셜 미디어 사이트를 통해 마케팅 메시지를 전달했다.238\n 태국에서는 인구의 80% 이상이 태국 출신이지만, 몇 개의 상당히 큰 하위문화집단이 존재하며, 전체 방문객의 인구의 10%를 차지하는 유럽과 중동 출신의 방문객 대표 그리고 중국에서 성장한 영향력을 미쳤다.239 태국 내 중국계 소비자들은 많은 사업체를 소유하고 있다.", "source": "20261114_115241.jpg"}, {"kind": "heading", "text": "12-4c 종교의 영향", "source": "20261114_115242.jpg"}, {"kind": "paragraph", "text": "세계문화의 마지막 형태는 종교적 신념에 근거하고 있다. 종교는 행동 양식 혹은 행동 지침을 얻을 수 있도록 해주는 구조화된 일련의 신념과 가치로 사람들에게 규범을 준다. 또한 사람들은 출신 문화 혹은 유대감을 제공하기도 하고, 심지어는 다른 집단과 다르게 만들기도 한다. 2020년에는 어린이를 포함한 약 64%의 미국인이 기독교인(예: 개신교 또는 가톨릭일 것)으로 추정되었다. 1972년에는 이 비율이 90%였다. 유대교, 이슬람교, 힌두교, 불교, 모르몬교를 포함한 다른 모든 종교의 신자들은 2020년에 미국인의 약 6%를 차지했다. 미국 인구의 거의 3분의 1은 어떤 종교도 믿지 않는다.\n 이와 같이 종교는 확실히 존재하지만, 종교의 영향이 전통 소비자 행동의 영향을 미칠 수 있다. 예를 들어, 종교적 교리나 실천은 사람들이 제품이나 서비스를 소비하는 방식을 형성할 수 있다. 모든 프로테스탄트 신자들이 종교적 이유로 알코올 사용을 금지하고 있다거나, 윤리적 유대인(orthodox Jews)은 돼지고기가 조제된 식품을 반드시 회피한다. 힌두교 신자들에게는 소가 신성한 동물이기 때문에 소비되는 모든 고기와 가금류는 탈할(tahal) 인증을 받아야 한다. 또한, 특정 사순절 기간 동안 금요일에는 육류를 피하고 해산물로 마음을 정할 수 있다.\n 릴리코와 라마라(이라는 칼콤프) 기간 이후에 맛있고 맛있는 음식에 대한 소비는 급격히 증가할 수 있다. 또한 종교적 신념은 환경 보호와 같은 이슈에 대한 태도 및 행동에 영향을 줄 수 있다.\n 종교 기반 마케팅(faith-based marketing)은 소비자의 종교적 신념과 가치를 명시적으로 반영하여 신앙 친화적인 제품, 서비스, 커뮤니케이션을 제공한다. 예를 들어, 할랄 제품은 전통적으로 무슬림 소비자들에게 지역의 소규모 사업체를 통해 마케팅되어 왔지만, 상당한 잠재력을 가지고 있다. 네슬레(Nestle)와 같은 회사들은 이 시장을 적극 활용하고 있다. 예를 들면, 네슬레가 호주에서 판매하는 민티스(Minties) 캔디의 젤라틴과 킷캣(KitKat) 초콜릿 바에 사용되는 밀크 초콜릿은 할랄 인증을 받았다.\n 종교적 허위문헌은 세계의 많은 부분에서 위협이 돼왔다. 예를 들어, 인도에서는", "source": "20261114_115242.jpg"}, {"kind": "heading", "text": "마케팅 시사점 / 요약", "source": "20261114_115250.jpg"}, {"kind": "paragraph", "text": "대부분의 인구가 힌두교도이지만, 이슬람교도, 기독교인, 시크교도(Sikhs) 같은 대규모 집단들은 다른 소비 패턴을 나타내고 있다. 약 44%의 힌두교도들은 자신이 채식주의자라고 답하는 이로 식품 및 화장품 제조업체들이 동물성 기름과 쇼트닝 대신 식물성 기름을 사용하도록 압력을 넣고 있다.245 시크교도는 쇠고기와 담배의 소비를 금지하고 있으며 오히려 다른 종교 집단보다 채식주의 시크교도들이 많이 살고 있는 지역에서는 전초한다. 마지막으로, 고란에 따르면 붉은 색은 남아시아 문화를 나타내는 것으로보아 이슬람권국가들에 매우 의미가 있고, 이러한 요인은 복수한 상품 포장의 녹색이 반복해서 사용되는 계기를 만들어주고 있다.\n 요약\n 소비자 다양성의 다섯 가지 주요 측면인 연령, 출생 세대, 성별 및 성적 지향, 지역적 차이, 인종, 종교는 소비자 행동에 중요한 영향을 미친다. 출생 세대 또는 세대는 같은 세대의 사람들이 특정 시기의 사건, 삶의 경험, 필요, 상징, 그리고 기억을 공유하며, 이는 유사한 소비 패턴으로 이어질 수 있기 때문에 마케팅에 핵심 요인이 되고 있다. 성별, 성 정체성, 그리고 성적 지향의 차이는 소비자 행동에 깊은 영향을 미칠 수 있다. 남성과 여성은 소비자 특성, 정보 처리 스타일,", "source": "20261114_115250.jpg"}, {"kind": "heading", "text": "복습과 토론을 위한 질문", "source": "20261114_115251.jpg"}, {"kind": "paragraph", "text": "복습과 토론을 위한 질문 1. 각 세대(침묵 세대, 베이비붐 세대, X세대, Y세대 및 밀레니얼, Z세대 또는 주디스, 그리고 알파 세대)가 어떻게 다른지 설명하고, 마케터들이 이들의 필요와 욕구를 더 잘 충족시킬 수 있는 방법을 명확히 하라.\n2. 생활, 성 정체성, 성적 지향의 차이점은 무엇이며, 왜 마케터들에게 이 구분이 중요한가? 클라스티리밍이란 무엇이며, 왜 마케터들은 이를 사용하고 있는가?\n3. 미국 내의 3대 하위문화는 무엇인가?\n4. 문화적 갈등 및 민족 정체성의 정도가 어떻게 소비자 행동에 영향을 미치는가?\n5. 왜 기업은 하나의 하위문화만을 표적으로 하기보다는 다문화 마케팅을 채택하고 있는가?\n6. 마케터들은 다문화적 소비자를 타기팅할 때 지역적 영향을 고려해야 하는가?\n7. 종교가 소비자 행동에 영향을 줄 수 있는 방법 및 가치를 규명해 보라.", "source": "20261114_115251.jpg"}], "notes": [{"source": "20261114_115016.jpg", "text": "학습목표\n 1. 출생 세대가 소비자 행동에 어떻게 영향을 미치는지 설명한다.\n2. 성별 및 성적 지향성이 소비자 행동에 어떤 영향을 미치는지 설명한다.\n3. 지역적 영역이 소비자 행동에 어떻게 영향을 미치는지 설명한다.\n4. 인종 및 종교적 특징이 소비자 행동에 어떻게 영향을 미치는지 논의한다.\n 그림 12-1 ▶ 12장의 개관: 소비자 다양성 이 장은 연령, 출생 집단, 성별, 성적 지향성, 성적 지향, 거주하고 있는 지역, 인종과 종교와 같은 특성이 소비자 행동에 어떻게 영향을 미치는지 살펴보고자 한다. 이러한 특성은 모두 소비자 다양성의 일부이다. 이 장에서 제시하는 광범위한 개념을 설명함으로, 개개인에게 적합이 될 수 있을 만큼 정밀한 중요한 모든 소비자 집단에 대한 마케팅 전략을 개발하는 데 필요한 정보를 활용해야 한다. 모든 소비자 집단에 대한 마케팅 전략을 개발하는 것에서 특정 집단을 겨냥한 전략을 개발하여, 특정 니즈, 욕구, 그리고 행동 패턴을 파악하기 위한 구체적인 연구가 필요하다.\n 소비자 다양성 ▶ 연령 영향력 ▶ 출생 집단 영향력 ▶ 성별 영향력 ▶ 성적 지향성 영향력 ▶ 지역적 영향력 ▶ 인종 영향력 ▶ 종교적 영향력"}, {"source": "20261114_115036.jpg", "text": "세대별 집단 이론 연령과 시대의 상관관계, 출생 집단 혹은 세대(generation) 안에 태어난 사람들이 비슷하고 의미 있는 인생 사건을 공유하고, 따라서 오랜 기간 지속되는 가치와 행동 양식, 그로 인해 소비자 행동의 유사점을 설명하고자 하는 이론.\n 침묵 세대 1928년부터 1945년 사이에 태어난 세대."}, {"source": "20261114_115048.jpg", "text": "그림 12-2 ▷ 연령·시대·생활 집단(APCO)의 소비자 행동에 미치는 영향\n 이 그림은 연령, 기간 및 세대 효과의 차이를 설명하고 있다. 연령 효과는 매우 다른 소비자의 출생 집단 또는 세대로부터 나타난다. 예를 들어, 15~20년의 기간에 형태를 이루는 세대 변화를 살펴볼 수 있다. 연령과 세대는 이전 세대의 로컬한 사람들의 시각과 행동을 변화시킨다. 첫째, 세대의 차이가 존재하는 어느 그룹이 어떤 소비자 행동에 영향을 미칠 수 있다. 둘째, 1946년에서 1964년 사이에 태어난 베이비 붐 세대로 생각해 보자. 이들은 노동시장에서 일자리와 승진을 위해 경쟁하고 더 높은 교육을 받으며 경제적 여유를 누리는 특성을 지녔다. 끝으로는 세대의 시대적 경험(예: 어린 시기의 전쟁과 불황)은 이들이 성장하면서 가지게 되는 정치, 사회, 경제적인 견해에 강한 영향을 미친다. 이러한 세대들은 수명 연장에서 영향을 받는다. 그 결과 한 세대가 다음 세대를 지배하며 영향을 미치게 된다. 이는 대중문화, 정치, 법, 연구, 경제, 관습뿐 아니라 마케팅에도 영향을 미친다. 예를 들어, 다음과 같은 세대를 들 수 있다. 전통 세대(1928년 이전 출생자), 침묵 세대(1928~1945년 출생자), 베이비 붐 세대(1946~1965년 출생자), X세대(1965~1976년 출생자), 밀레니얼 세대/Y세대(1977~1994년 출생자), Z세대(1995~2010년 출생자), 알파 세대(2011년 이후 출생자). 각 세대는 고유한 생활양식, 가치, 태도 및 소비 행동을 보인다. 예를 들어, 밀레니얼 세대는 디지털 기술의 발달과 함께 성장하였고, 모바일 기기와 소셜 미디어를 적극적으로 활용한다. 반면, 베이비 붐 세대는 상대적으로 전통적 매체에 더 익숙하며, 브랜드 충성도가 높다. 시대적 사건(예: 9/11 테러, 글로벌 금융위기, COVID-19 팬데믹)은 특정 세대의 소비자 행동에 강한 영향을 미친다. 이 그림은 이러한 연령, 시대, 세대의 차이를 이해해 마케터가 여러 세대와 노인 세대의 특성을 파악하고, 효과적인 마케팅 전략을 수립하는 데 도움을 주기 위해 제시되었다.\n 출생 집단:\n6. 알파 세대 5. Z세대 4. 밀레니얼 세대/Y세대 3. X세대 2. 베이비부머 1. 침묵 세대\n 의미 있는 사건으로 구분되는 시대:\n 연령 집단:\n0~17세 18~35세 36~64세 65세 이상\n 정보 기술의 변화:\n1994년 - 아마존 1995년 - 야후 1997년 - 넷플릭스 1998년 - 구글 2001년 - 위키피디아 2003년 - 링크드인 2004년 - 페이스북 2005년 - 유튜브 2006년 - 트위터 2007년 - 아이폰 2009년 - 왓츠앱 2010년 - 인스타그램 2011년 - 스냅챗 2013년 - 텐센트 위챗 2014년 - 알리페이 2017년 - 틱톡 2020년 - 줌 2022년 - 챗 GPT로"}, {"source": "20261114_115052.jpg", "text": "베이비부머 1946년부터 1964년 사이에 태어난 사람들\n 그림 12-3 ▶ 60~65세 이상의 소비자를 표적으로 삼기 오늘날의 60~65세 이상의 소비자들은 이전 세대에 비해 더 젊게 생각하고, 느끼고, 행동한다."}, {"source": "20261114_115101.jpg", "text": "마케팅 시사점\n 60~65세 이상의 시장은 기존 비즈니스에서 중요하며 새로운 비즈니스에는 흥미로운 기회를 제공한다.7) moreover, 2050 년까지 세계적으로 60세 이상의 비율이 전 세계 인구의 총합 상 약 전체 인구의 22%에 해당된다.8)\n 베이비붐세대는 상당한 구매력을 갖고 있기 때문에, 마케터들은 환대, 통차, 가옥, 은행, 퇴직, 보험, 소매 및 통신 분야에 영향을 준 다.9) 예를 들어, 미국에서 중산층 경제력을 지닌 베이비붐세대 를 주요 상품과 서비스의 표적이 되고 있다. 예를 들어, 많은 식품 브랜드에서 이들을 생산하는 특수 연구소를 둔 Kraft R&D 그룹의 John H. Spencer 박사는, 이 시장을 정확히 분석한 후 캠프벨 수프 Campbell Soup는 부모의 어릴 때부터 문제였다고 인식하고 있으며, 이 시장 에 맞춰 여러 가지 새로운 수프 맛을 내놓았다.10) 젊은 기업은 베이비붐 세대를 능가하여 활발한 활동을 하고 있고, Healthful Living 프로그램과 같은 건강 및 웰빙 프로그램을 광고 및 록사이 이용하는 경향을 띤다.11) 최근의 rico 기업이 베이비붐 세대의 화가 되면, 그들의 취향과 욕구를 이해하는 것이 필수적이다. 예를 들 면 1,500개의 샘플식을 만들어 놓은 기업은 아직 존재했다.12)\n 베이비붐세대는 보다 화려하고, 순수한 로고와 포장을 좋아한다. 생산 유사한 상품들에 중요한 타깃이 되면서 예비 노인층들과 함께 성장을 예고하고 있으며 코카콜라와 펩시콜라는 새로 노인 세대에 소구하는 마케팅 공략을 모색하고 있다. 예를 들어, 2014년에 세계적인 음료기 업 코카콜라사는 1990년대에 베이비붐세대가 기억되던 탄산 음료를 소량으로 되살리며 ‘서지(Surge) 콜라’를 소다를 다시 시장에 출시했는데 캠페인을 중심지로 펩시퍼펙트(Pepsi Perfect)라는 제품을 출시하여 베이비붐 세대 소비자에게 추억거리를 제공했다. 과거에 인기가 있었 던 ‘뒤로 가기’(Back to the Future)의 영화 은 비틀(Beetle), 피아트(Fiat)의 피아트 500(Fiat 500), BMW의 쿠퍼미니(Cooper) 자동차라는 신차, 이들 모두 시대의 자유와 납치으로도 평행하는 자동차이다.13)\n 이 집단의 일부 구성원들은 최신 기술 제품을 원하는 반면, 다른 구성원들은 전자적인 기능성에 먼저 좌초하고, 예를 들어, 클럽형 커뮤니케이션 기업인 텔레스트라(Telstra)는 호주와 해외 벤처고 세 게 디지털 기기들을 ‘설명’하고 인터넷을 사용하는 법을 가르치기 위\n 해 ‘연결되는 노인들(Connected Seniors)’ 프로그램을 운영했다.37\n 세대의 구성원들은 특히 베이비붐세대들은 그들이 젊었을 때보다 신 체적으로 더 활동적이다. 기존 및 의료기관과 연관하기 위해 인터넷 또는 스마트기기를 많이 사용한다.38) 그들의 주요 욕구는 여가 스타일은 연령대에 맞게 필요와 선호도를 주어 연계한 여가 프로그 램이다. 예를 들어 일본에서 이케아(Ueshima) 커피 제조기업은 몇 년 동안 커피숍을 현대적이고 매력적인 공간으로 바꾸면서 베이비붐세 대 나이 많은 소비자 연기와 무엇에 호소했는가.39)\n 베이비붐 세대는 더 건강하고 더 젊고 건강한 삶을 원하는 욕구이다.\n마케터들은 이들에게 마땅한 맞춤 시장을 개발했다. 신체적 활동이 겸비된 야외 활동 스포츠 클럽, 장비 및 액세서리, 멤버십 클럽 및 맞춤 코칭 서비스, 보험 패키지 등이 해당 기회를 활용하는 예로 광고와 예시\n 또 세대들은 이 세대의 관심을 고려한 마케팅을 활용하고들 하며 세대를 목표적으로 삼을 수 있다. 예를 예로 회사는 1960년도, 1970 년대, 1980년도, 록 공연 프로그램 및 오락 방송에, 휴동적인 매체를 활용한 TV 쇼, 놀라지 자동차와 오토바이 광고 등, 이들 요 동참하고온 라이프스타일 관련 이벤트를 포함한다. 한국의 젊은 이 음악 매번, 65세 이상 성인들은 그때 그 시에 나타나는 향수를 새벽학습과 관련이 있을 것이다. 베이비붐 세대의 많은 이들은 길거리 세대와 이전 세대의 구성원들에 낮은 지위, 무당주, 그리고 배 지된 느낌을 심어 줄 수 있었다.14) 이러한 인구층은 강하게, 구매력 및 라이프스타일, 그리고 사회 전반에서의 전반적인 가치 변화가 상황 을 개선시켰다.43)\n 최근 몇 년 동안, 미쇼(Misson), 19/99뷰티(19/99 Beauty), 로레알 (L’oreal), 케이트 스페이드(Kate Spade), 루이뷔통(Louis Vuitton)과 같은 브랜드들은 여성 연예인과 소비자들이 나오는 광고 및 소셜 미 디어 마케팅에서 세대 간의 관계를 형성하기 위해 노력했다. 이 른 소비자들은 복장정 정책을 회피하면서도 전반적으로 패션을 좋아하고 한 걸 기억할 수 있을때 나이 많은 분들로 부정적인 정 서가 강조된 메시지 보다는 긍정적으로 연출을 강조한 메시지를 좋아 하며 더 잘 기억해낸다.45) 대표적인 예시가 로라 겔러 뷰티(Laura Geller"}, {"source": "20261114_115106.jpg", "text": "유통, 판매, 촉진\n 소매업들은 베이비붐들의 및 침묵 세대의 구성원들을 위해 넓은 통로, 밝은 조명 및 높은 통로 및 주차장, 함께 쉬면서 시간을 보낼 수 있는 카페 같은 편의성이 있는 쇼핑센터와 긍정적인 환경을 제공하기 위한 매장을 디자인할 것이다. 도시 계획자들은 이와 비슷하지만 좀 더 큰 시설들을 ‘우연한 만남을 즐기는 문화’라는 공원 및 쇼핑몰 등과 더불어 여러 가지를 계획할 수 있다. 이와 같은 전략은 연세가 있는 소비자들을 유인할 수 있다. 콜스(Kohl’s)와 같은 그들의 쇼핑센터에서 쇼핑을 즐길 수 있도록 더 큰 통로, 젊은 세대들과의 교류를 위해 특별한 이벤트가 있는 쇼핑센터들을 조성하고 있다. 하이엔드백화점 체인, 하이엔드레스토랑(Outback Steakhouse), 야외극장체인(Carnival Cruise Line), 카리브해 야외초호화여객선체인(Carnival)과 같은 선사 및 기타 고급브랜드들은 앞으로의 광고 및 브랜딩을 수행하면서 노년층의 소비자들에게 사용하는 매스 미디어에 능숙한 이들 세대의 소비자들을 사기적인 매장과 피싱 시도를 함께 인식하고 접근할 수 있다. 따라서 나이 든 소비자들을 포함한 모든 소비자들에게 상품 사기(scam)에 피해가 되는 것을 막기 위한 교육 및 보호가 중요하다.48\n 그림 12-4 베이비붐 세대를 표적으로 삼기\n 마케터들은 유명인 광고가 큰 베이비붐 세대의 라이프스타일에 소구하고 제품을 판매하는 것은 자주 시도하고 있다.\n \"THERE IS AN INVISIBILITY PERIOD BETWEEN A 40-YEAR-OLD WHO IS 43 BUT LOOKS LIKE SHE’S 19, AND THE OCTOGENARIAN WHO IS HIP AND COOL BECAUSE SHE’S STILL YOUTHFUL INSIDE.\""}, {"source": "20261114_115113.jpg", "text": "마케팅 시사점 많은 사람이 여전히 성장하는 휴대전화 생태대 소비자로 평가한다. X세대 시장은 중요한 구매력을 갖고 있을 뿐 아니라 소비자 파악을 위한 정보를 탐색하는데 시간과 돈이 적정을 자인되어 있다.\nX세대 소비자는 전통적인 미디어와 온라인 소셜 미디어 모두를 통한 마케팅 노력에 긍정적으로 반응한다. 유튜브 동영상, 블로그, 인스타그램 동영상에 대한 평가가 좋다. 이들은 소셜 미디어에 대한 평가가 좋다. 이들은 소셜 미디어를 통해 소통을 중요시하기 때문에, 이를 활용한 소비자 참여의 기회를 제공하는 것이 중요하다. 이러한 조건을 충족시키는 것은 그들을 충성 고객으로 만드는 데 중요하다. 또한 그들은 요즘의 광고나 뉴스에서의 과장이나 허위 정보를 경계하고, 진실한 소통을 더 높은 참여율과 강한 연결의 원동력으로 인식한다.\n 광고메시지 매체 소비에 완전히 정통한 X세대 구성원들은 명백하게 드러\n 밀레니얼 1981년에서 1996년 년 사이에 태어난 사람들."}, {"source": "20261114_115120.jpg", "text": "초기 1990년 이전에 발생한 것임. 부분적으로 이미지 상단이 잘려 있어 문장이 앞에서부터 이어졌음을 추정함.\n 주머스 혹은 젠Z는 1997년에서 2012년 사이에 태어난 사람들."}, {"source": "20261114_115136.jpg", "text": "그림 12-5 소비자 세대: 구매 결정에 미치는 영향\n 우편 혹은 신문 전문가, 유명인, 인플루언서 전통 매체 온라인 리뷰, 블로그, 사이트 소셜 미디어 친구 혹은 가족\n Z세대 13~17세\n Z세대 18~23세\n 베이비붐 세대\n Source: McKinsey Generation Z survey 2019\n Note: Figures may not sum to 100%, because of rounding.\n Z세대는, 무엇을 구매할지 어떻게 결정하는가?\n제품이나 브랜드 구매에 대한 영향, 응답자 비율"}, {"source": "20261114_115140.jpg", "text": "9차 세대 2012년 이후로 태어난 사람들.\n 마케팅 시사점\n Z세대의 구성원인 알파 세대 초기 구성원들은 현재 10대와 20대에 해당한다. 이 연령대는 중요한 표적 시장으로, (1) 가족 구매에서 상당의 영향을 미칠 영역, (2) 자신의 돈을 쓰고, (3) 장기적인 영향을 미치는 기본의 가치와 선호를 형성한다. 마케팅 담당자들은 이러한 세대로 인해, 이러한 세대의 시장이 소비자들을 굼멱화, 매체와 인플루언서에 더 좋은 반응을 보이고, 인플루언서를 통해 맞춤화된 경험을 제공하는 유튜브 메시지로 BTS나 블랙핑크 같은 K-pop 아티스트의 인기가 큰 한 예시이다.\n 이러한 세대의 소비자들은 싱어운로서 삶을 시작하는 대상 시장과 예외적으로 많은 제품과 서비스를 구매하기 때문이다. 따라서 마케터들에게 우선 타겟이다. 특히, 이들은 대부분 전통적 미디어 바람에서 정보를 얻어다른, 디지털에서 발생하는 브랜드 상호작용에 강한 신름을 가지고, 자신의 브랜드 경험을 다른 이들과 공유하기를 열망한다. 이들은 새로운 유무형 디지털 유튜 플랫폼 위를 통해 자신의 제품과 서비스에 관한 경험을 적극적으로 홍보 조성하며, 패션 블로그, 소설 미디어 및 웹 포럼에 기여한다.86\n 브랜드 충성도\n 소비자들의 어린 시절부터 기본적인 브랜드 선호도가 형성된다. 예를 들어, 젊은 여성의 50%가 화장품 브랜드에 대한 충성도를 15세부터 형성한다)87 세대가 어느 특정 브랜드 이름과 브랜드 인성을 뇌 밑변 실제 기억을 유지 인용 스시에 어린 연령층(9-12세)이기도 했다. 이미 9~12세 정도의 어린 소비자 중 거의가 향후 오랜 기간에 걸쳐 같은 브랜드(또는 사람들의 만족스러운 인 브랜드 관게)를 끌어나기도 한다)88 따라서 마케터들은 이러한 세대들 사이에서 초기 브랜드 인지를 선호를 극대화하려고 하며, 브랜드 충성도가 성인으로 이어지도록 노력한다."}, {"source": "20261114_115146.jpg", "text": "성별 특정 문화가 사람의 성별 행동에 대해 기대하는 척도, 감정 및 행동 양식.\n 성 개념 한 개인의 생물학적 성별과 이에 상응한 성적 정체성 간 관계로, 남성성 및 여성성과 관련된 생각과 감정을 설명할 때에 일반적으로 사용된다."}, {"source": "20261114_115150.jpg", "text": "성 정체성 성의 구성 요소로, 개인의 성에 대한 심리적 인식을 설명.\n 성취 지향적 목표 속도, 자기 주도성, 자기 효능감을 중점으로 하는 목표.\n 공동체적 목표 타인과의 친밀감 및 조화로운 관계를 중점으로 하는 목표."}, {"source": "20261114_115157.jpg", "text": "분명히, 많은 제품(남성 양복 및 여성 위생용품 같은)은 성(gender) 특유의 니즈에 적합하도록 설계되어 있다. 게다가, 어떤 제품이나 서비스를 둘 중 어느 한쪽 성에 좀 더 적합한 것으로 인식되기도 한다. 넥타이는 좀 더 남성적인 것으로 보일 수 있는 반면, 아마와 실크는 좀 더 여성적인 것으로 간주될 수 있다. 또한, 성마다 남성과 여성이 구매하는 ‘공예품’과 같이, 각 안에서 차지의 공간과 공예로 나뉜 공간을 형성하고 구매, 사용하고, 소통하는 방식에서 각자의 정체성을 다르게 발전시킨다.\n 마케터들은 종종 성을 차별화를 표적으로 삼는다. 예를 들어, 홈디포(Home Depot)의 로우스(Lowe’s)는 여성의 영향력이 건설 관련 사업의 80%에 영향을 미친다는 주장에 따라 좀 더 여성적인 건축 자재 상점을 구축하였다. 연구에 따르면, 로우스는 여성 고객에 있어 홈디포보다 경쟁 사의 위치를 차지하고 있다. 예를 들어, 로우스는 투명한 천장을 설치해 햇빛이 들어오고 있을 때, 빛을 내는 스카이라이트(sky light)가 있는 정원을 자랑하고 있다. 로우스는 가정 장식 및 개조 시스템을 갖추고 재설계하고 있다. 또한 수많은 가정에서 중류층 여성들 중 한 명을 ‘가족을 설계하고 계획하는 여성을 끌어들이기 위해 가장 현실적 및 유행에 민감한 품목을 도입했다.’29 여러 지역에서, 홈디포는 여성을 위한 ‘걸스 나잇 아웃(‘Girls’ Night Out’) 프로그램을 실시, 시연 행사뿐만 아니라 자신의 집에 맞춰져 있는 모든 활동을 제공함으로써 모든 연령대의 여성을 지역 사업에 끌어들이고 있다.\n 일부 제조업은 여성들을 가정에서의 구매에서 자신의 역할 인식에 중점을 두고 있다. 예를 들어, 프록터앤갬블(Procter & Gamble)은 전 세계의 어머니들을 대상으로 다른 유아용 제품들과 65세 미만인 팸퍼스(Pampers)에 대한 광고 캠페인 및 미디어 프로모션을 통해 광고에 투자하고 있다. 그들은 대대적으로 미용 제품들에 대한 광고에 집중하고 있다. ‘예쁜 맘(pretty Mom)’이라고 일컬어지는 어성들의 구매수준을 높이는 기능을 수행할 마케팅 믹스 기법을 도입하고 있다.\n 마케터들은 이와 같은 전략을 통해 진정한 마케팅 전략 ③ 신제품 개발을 통해 사회에서 변화하는 성 역할에 적응하고 있다.\n 첫째, 마케터들은 동일한 제품을 점점 더 넓은 성별 스펙트럼에 걸쳐 타깃팅하고 있다. 예를 들어, 할리데이비슨(Harley-Davidson)의 오토바이 판매 중 12% 이상이 여성에게 판매된다. 뛰어난 이미지를 점점 더 포함하고 있다. 마찬가지로, 요리와 같은 키워드를 포함하는 여성 돌보이에 서브머트(Servemer)가 점점 더 인기 있다. ‘남성 제품’으로 간주된 여성 지원용품은 그들의 기본적으로 남성적인 제품을 중화하는 것으로 처리 되고 있다. 또한, 전체의 성 경험에 대해 어필하고 있다. 예를 들어, 미용제품 소비의 증가에도 불구하고, 일부 마케터들은 전통적인 남성용 미용품과 같은 개성을 갖는 여성 소비자를 확장시키고 있다. 마케터들은 가정에서 이루어지는 일들에 대한 여성의 책임이 급성장하는 반면, 남성의 책임은 감소하는 것을 인식하고 있다.\n 둘째, 제품 사용의 유연성은 매우 높은 여성과 같은 집단에게 중요한 요인이다. 이와 관련하여, 캘빈 클라인(Calvin Klein)은 남자와 여자에게 모두 등장하는 다양한 온라인 쇼핑 경험을 제공하고 있다.\n 셋째,\n 로운 제품과 서비스의 수요가 증가하고 있다. 예를 들어, 수퍼셀프(SuperShelf)는 인터넷 사이트의 사용 가능성을 높이고, 여성들이 일상으로의 쇼핑 경험을 재현할 수 있도록 비디오 및 텍스트 형식의 제품 설명을 제공한다. 쇼핑 시간은 제한된 시간을 활용하여 이루어져야 하는 경우가 많으며, 여성들은 종종 쇼핑과 가사노동을 동시에 수행한다. 슈퍼셀프는\n 하다. 생활 스트레이트 향상을 위하여 상점의 제품 250여종을 자신들의 기호로 구성해맞지만, 이는 여성에게 적합한 쇼핑 경험을 방해하지 않도록 하기 위해 고안된 것이다. 이와 같은 경험을 통해 전통적인 쇼핑 베이스와 온라인 쇼핑 간의 차이를 줄이는 데 도움을 제공한다. 슈퍼셀프 같은 곳은 여성들에게 너무 많은 선택을 제공하는 대신, 제한된 소비 기회를 제공한다.\n 이는 멀티 플래이어 바이스(A Freeer Player Bass)를 기반으로 한 공동 활동 기반 커뮤니티이다.\n 또한 베이스 기타 채널의 변화한 마케팅 도구들로는 TV 광고, 인터넷 스트리밍 서비스, 소셜 네트워크 서비스에서의 다각 라디오 프로그램 등 수많은 채널이 있다. 예를 들어, 스포츠 일러스트레이티드(Sports Illustrated)는 잡지를 통해 남성에게 도달할 수 있으며, 스포츠 및 기타 소비 관련 콘텐츠를 통해 여성에도 도달"}, {"source": "20261114_115204.jpg", "text": "성적 지향성 다른 사람에 대한 성적 및 감정적 끌림에 기반을 둔 행동이나 신념 또는 이러한 사회적 정체성을 나타낸다.\n 동성애자(heterosexuals)는 출생 시 지정된 성별과 경험된 성별이 일치하는 시스젠더(cisgender) 사람들로, ‘반대’ 성에 끌리는 사람들이다. LGBT라는 일반적인 약어는 레즈비언, 게이, 양성애자, 트랜스젠더 사람들을 포함한다.202 2020년 갤럽 조사에서 15,000명이 미국 성인을 대상으로 한 결과, 86.7%가 이성애자로, 5.6%가 LGBT로 자신을 식별했고 7.6%는 이 질문에 답하지 않았다고 스스로 LGBT로 식별한 사람들 중 5.6% 중 54.6%는 양성애자, 24.5%는 게이, 11.7%는 레즈비언, 11.3%는 트랜스젠더로 자신을 식별했다. 143 Ipsos 시장조사 회사가 실시한 27개국 설문 조사에 따르면, 성의 가치가 이전보다 덜 중요하다고 응답한 사람이 더 많아졌다. 러시아, 중국, 일본의 조사 참여자 중 많은 수가 자신을 이성애자로 식별했고, 이들 국가는 평균보다 약간 높은 수치를 기록했다. 반면, 브라질, 멕시코, 아르헨티나, 칠레 및 페루를 포함한 몇몇 중남미 국가들, 특히 동유럽 여러 국가의 예, 같은 인구 집단 내에서도 다른 국가의 사람들보다 상대적으로 높거나 낮은 LGBT 비율을 보였다. 설문에 따르면, 많은 국가들에서는 성적 지향을 ‘허락하느냐’의 문제로 조명한다. 이는 성적 지향 아직 사회적 낙인을 나타낸다. 예를 들면, 말레이시아와 헝가리에서는 39%, 터키에서는 42%의 사람들이 자국에서는 19%가 성적 지향을 밝히기 어렵거나 거의 불가능하다고 믿었다.144\n 마케팅 시사점\n LGBTQ 커뮤니티와 관련된 마케팅 및 소비자 연구는 주로 미국의 중심을, 도시 거주, 신조셔널 게이 남성의 중점을 두었지만,145 이는 레즈비언, 게이, 양성애자, 트랜스젠더 소비자들이 공통적으로 독특한 욕구, 선호도, 소비 패턴을 파악하는 것을 의미하지는 않는다. 분명히 페섭에서 실시된 연구는 게이 남성과 레즈비언 여성이 새로운 제품, 패션 스포츠, 식습관 방식을 채택하는 데 있어 더 혁신적이라는 고전 결론과 시각을 조사했다. 패널 표본으로 구성된 일부 연구는 274명의 레즈비언과 레즈비언(28%), 그리고 381명의 이성애자 남성(60%)와 이성애자를 대상으로 한 이 연구는 게이 남성이 이성애자 남성에 비해 약간 더 혁신적이라는 결과를 발견했다. 그러나 레즈비언 여성은 이성애자 여성보다 약간 덜 혁신적이라는 결과를 보였다. 게다가, 37개의 후속 포커스 그룹 중 128명이 참여한 7개의 레즈비언 및 이성애자 표본 참가자들 또한 혁신성과 성적 지향보다는 이들이 생활환경, 예를 들어 부모, 배우자, 또는 자녀가 없는 생활과 같은 요인에 기인한 가능성이 크다고 지적했다.146 점점 더 많은 제품 및 서비스 범주에서 마케터들은 레즈비언 및 게이 소비자의 독창한 요구와 욕구를 충족시키기 위한 맞춤 전략을 도입하고 있다. 예를 들어, 많은 천연가스 및 전기 회사들은 회사 로고, 광고 이미지, 브랜드 이름 및 기타 상징으로 이 소비자들을 표적하고 있다.147 또한 게이 결혼이 법제화된 이후 부동산 업은 집으로 하여, 소득을"}, {"source": "20261114_115206.jpg", "text": "그림 12-6 ▪ LGBT 소비자 표적화하기 조직들은 LGBT 소비자를 대상으로 한 기업 광고 및 인력 채용 노력을 펼치고 있으며, 스웨덴 군대(Swedish Armed Forces) 의 캠페인에서 그 예를 보여 준다.\n 여섯 줄무늬 프라이드 페스티벌에 대한 스웨덴 군대의 지지를 표현한 해설문에는 “우리는 끝까지 갈 준비가 되어 있다”라고 적혀 있다. 케이터 레즈비언 소비자들은 이상하게 섹슈얼리 아이덴티티 메시지를 상업적 목적으로 활용하는 경향이 있지만, 최근에는 이러한 노력들이 보다 덜 진정성이 느껴지지 않도록 주의해야 한다. 광고에 성적 지향의 성격과 왜 LGBT의 무지개색 깃발 같은 그들의 상징 문화가 반영할까? 교하이 긍정적으로 반응하도록 애 를 들어, 라스베이거스 관광청은 동성애자 여행객을 유치하기 위해 다양한 게이 및 레즈비언 테마 이벤트를 후원하고 있으며, 전통 여행사들은 동성 결혼을 계획하는 커플들을 대상으로 서비스를 제공한다.148\n 그레이터 포트 로더데일(Greater Fort Lauderdale) 관광청은 레즈비언, 게이, 트랜스젠더 여행객의 다양한 요구와 경험을 이해하기 위해 연구를 수행했으며, 그 결과 트랜스젠더 여행객은 대개 혼자 여행하며, 여행 경험에 있어 게이 레즈비언 여행객보다 더 비용을 절감하는 경향이 있다는 사실을 알게 되었다. 이 기관의 멀티미디어 마케팅캠페인은 포트 로더데일을 방문하여 휴양을 즐기며 기타 액면 상품과 서비스에서 색채를 띤 경험을 원하는 관광객들에게 어필할 수 있도록 다양한 모습을 광고에 담고 있다.\n Virgin Airlines는 2010년대에 걸쳐 LGBT 조종사와 객실 승무원으로 구성된 첫 번째 프라이드(Pride) 비행을 조직했다. 호주의 항공사인 Virgin Australia는 2022년에도 시드니 행사에 참석하는 수천 명의 게이 및 레즈비언 축제에 승객들을 태우기 위해 이 이벤트를 반복했다.149\n 세계의 많은 지역에 있는 기업들이 이처럼 패키지 투어를 만들고, 트랜스젠더 소비자에게 친화적인 관광지를 홍보하고 있다. 예를 들면, 중동에 있는 일부 국가에서는 동성애가 불법인 반면, 다른 곳에서는 비교적 관용적인 태도를 취하고 있다. 관광지의 문화적 수용도가 다국적 관광객의 방문 결정에 영향을 미친다.\n 또한 일부 지역의 사회는 보수적 또는 진보적인 가치관을 갖고 있어, 특정 상품이나 메시지의 수용 여부에 영향을 준다. 마케팅 전략을 수립할 때에는 이러한 지역적 특성을 고려해야 한다. 브랜드는 각 지역의 문화와 규범을 존중하면서도 자사를 거론할 만큼 충분히 눈에 띄는 메시지를 전달해야 한다. 이를 통해 보다 의미있는 관계를 구축할 수 있을 것이다."}, {"source": "20261114_115212.jpg", "text": "클러스터링 소비자를 인구 통 및 소비 생활 방식과 같은 공통성에 따라 그룹화할 수 통계 기법."}, {"source": "20261114_115214.jpg", "text": "신흥도시 독신자들(Boomtown Singles)은 35세 미만의 대학교육을 받은 소비자들로, 소규모 집에서 일하고 싱글 스케이트가 번창하는 소도시에서 생활하고 있다.\n유동성 블루스층(Mobility Blues)은 소도시에 살고, 55세 미만이며, 고등학교까지밖에 졸업한 저소득층 소비자들이다."}, {"source": "20261114_115219.jpg", "text": "마케팅 시사점\n 마케터는 소비자 행동의 글로벌 차이를 이해하여 특정 지역과 국가에 맞춘 마케팅 전략을 세울 필요가 있다. 이는 전 세계 여러 나라에서 서로 다른 제품을 마케팅할 때뿐만 아니라, 동일한 제품을 각각에서 다르게 마케팅하는 다국적 기업에게도 중요하다. 35개국을 대상으로 한 대규모 연구에 따르면, 국가 수준의 발전 정도가 높고, 강하게 결속된 국가 문화가 있을수록 1위 브랜드 이미지는 소비자 구매 의도에 미치는 효과가 커졌다.169 많은 기업은 글로벌 소비자 차이를 수용하기 위해 마케팅 활동을 조정한다. 마케터는 만약 판매하고자 하는 나라의 다른 지역에서도 소비자 행동이 다를 수 있다는 사실을 인식해야 한다. 예를 들어, 캐나다에서는 퀘벡의 소비자들과 브리티시컬럼비아의 소비자들끼리 상당히 다른 음식 선호를 가지고 있다. 마찬가지로, 여러 다른 지역에서 판매되는 제품의 경우, 마케터들은 이들 차이를 고려하여 대응해야 한다는 측면 역시 확대의 사항이다.\n 예를 들어, 제너럴 모터스(General Motors)는 자신의 뷰익(Buick) 자동차 중형 세단 모델인 “리갈(Regal)”을 개발하면서 이를 중국의 일부 지역에서 인기가 있다는 것을 알고 있다. 그 결과, 이 회사는 새로운 부의 은유를 상징할 수 있도록 설계된 미국과 중국 소비자 모두의 취향을 반영하고 있다.172"}, {"source": "20261114_115221.jpg", "text": "민족 집단 공통의 역사, 가치 및 행동을 공유함으로써 형성되는 특수한 사회 집단.\n 문화 적응 새로운 또는 낯선 문화와의 접촉을 통해 어느 한 문화 집단이 상대 문화의 특성에 적응해 가는 사회화 과정으로, 소비자가 새로운 문화의 규범과 가치관 및 행동 양식을 습득하게 되는 것을 의미한다."}, {"source": "20261114_115227.jpg", "text": "다문화 마케팅 다양한 문화 집단에 동시에 소구하는 마케팅 전략 및 전술.\n 민족적 동일시의 정도 사람들이 자신의 원초 집단에 동일감을 느끼는 정도.\n 마케팅 시사점 마케터들은 성장하는 히스패닉 및 라틴계 미국인 소비자 세그먼트에 도달하기 위해 다양한 접근 방식을 고려했다.\n 제품 개발 및 유통 마케터들은 히스패닉계 미국인들을 위해 특별히 개발된 상품"}, {"source": "20261114_115228.jpg", "text": "그림 12-7 히스패닉계 미국인 소비자 이 케이스미돈은 다른 문화, 민족과 공감과 소비자들의 타인에 대한 가치 우상을 기리는 라틴 아메리칸 크리스마스 광고 브랜드들은 다양한 문화적 배경을 가진 소비자들에게 맞추어 제품을 제공하고 있다.\n 들에게 특히 중요하다.200 또 다른 예로, 그림 12-7에 나와 있는 맥도날드의 광고를 들 수 있다. 이 광고는 스페인어로 작성되어 있으며 히스패닉계 미국인 고객을 주요 타겟으로 삼고 있다. 광고 속 주인공들은 여유롭고 행복한 표정으로, 햄버거, 매운 치즈, 고기를 먹으며 즐거운 시간을 보내고 있다.(Jalapeno Double)으로도 유명하다.\n 이 세분 시장의 촉진 전략에 대해 마케터들에게 특히 흥미를 자아내는 점은 무엇인가? 다음 장에서 살펴보기로 하자.\n 학습 질문 1. 히스패닉계 미국인과 관련해 ‘민족적 자기 인식’은 무엇인가?\n2. 마케터들은 어떻게 히스패닉계 미국인을 대상으로 하는 광고 메시지를 설계할 수 있는가?\n3. 다른 예로, 맥도날드의 광고 외에 히스패닉계 미국인을 대상으로 한 다른 다국적 기업의 광고 사례를 찾아보라.\n 팸퍼스(Pampers)의 또 다른 예를 통해, 광고주들이 히스패닉계 미국인 소비자들을 대상으로 하는 다양한 촉진 전략을 살펴볼 수 있다. 또한 라디오 광고와 소셜 미디어 광고를 통해, 특정 제품, 예를 들면, 식품, 생활용품, 보험 상품 등에 대한 정보를 제공하고 있다.\n 크로문화적알로지(cross-cultural) 상황에서의 광고 메시지, 설계 생산 업데이트 및 대화는 계속된다."}, {"source": "20261114_115234.jpg", "text": "응 이는 민족 집단이 소통 더 많은 노력을 투자할수록 소통에 더 긍정적으로 반응 할 때 발생한다."}, {"source": "20261114_115241.jpg", "text": "마케팅 시사점\n 포브스(Forbes)의 다양성과 포용성 기자인 루스 우모(Ruth Umoh)는 이렇게 설명한다. “아시아계 미국인들은 상당한 구매력을 가지고 있어 기업들이 이 중요한 인구 통계를 간과할 수 없다.” 많은 마케터들이 다음과 같은 이유에서 보다이 이 세분 시장을 표적화하고 있다.\n 제품 개발과 유통 미디어턴은 아시아계 미국인을 위한 제품을 점점 더 많이 개발하고 있으며, 이와 맞춰 유통 전략도 조정하고 있다. 예를 들어, 웰스파고에서는 본사를 둔 이스트웨스트뱅크(East West Bank)와 손잡고 아시아계 미국인을 위한 특별한 은행 서비스를 도입하고 고객이 중요한 업무를 수행함에 따라, 베트남어(베트남어로 선택 가능)는 은행 업무를 볼 수 있도록 돕는다. 이 회사는 또한 중국 전통 홍보 방식을 차용하여 이 소비자 집단을 표적했다.233 스티크노르(Knorr) 브랜드는 ‘농장의 해’에 맞춰 캠페인을 시작하는 광고를 개발했, 참가자들은 집을 돌아와 액상 조미료로 만든 자신이 가장 좋아하는 음식을 요리하도록 격려했다.234 내부에서는 해당 캠페인을 수행하면서, 40여 년간의 데이터에서 세계 여러 나라에 마케팅 활동을 할 수 있는지를 결정했다.\n 아하는 올덴 살과 요리를 업로드하여 1,000달러 상당의 무쇠 조리 기구를 받을 수 있는 기회를 가졌다.232\n 매체와 커뮤니케이션 아시아계 미국인 소비자들은 기술에 능숙하며 온라인 미디어를 활발하게 사용한다. 다른 인종 그룹보다 개봉을 컴퓨터, 스마트폰, 스마트TV 등 여러 벙이 스크린을 이용하며, 주문형 비디오를 사용하는 것도 아시안에게서 많이 찾아볼 수 있다.232\n 아시아계 미국인에게 광고하려는 브랜드는 컴퓨터를 사용해 전달되는 메시지보다 더 큰 업로드의 경유가 많다. 이 하위문화는 선호하는 언어가 영역 및 구매 영역에 따라 달라지기 때문에 광고를 할 때에 많이 집중되 있는 경우 미국에서 걸어갈 바 있다. 그러나 이와 같이 아시아계 소비자들의 여가 알 수 있다. 예를 들어, 삼성과 HP와Suburu는 미국 TV 광고에서 아시아계 가족과 이들의 친구가 함께 있는 아이양을 포함하는 ‘보통 가족’을 다양성을 기리는 캠페인에 활용했다.233 아시아계 미국인은 전통적, 주류 미디어에서의 홍보보다 더 빠르게 메시지가 아시아계 미국인이 등장하는 광고에 쉽게 달라지는 경험이 있다. 이들 광고는 긍정적인 연상을 유발하여 아시아인의 인종 정체성을 강화하는 효과를 준다.236"}, {"source": "20261114_115242.jpg", "text": "코크 가디언마케팅 힌두교의 전통을 중시하는 인도 소비자들을 대상으로 한 가디언마케팅 캠페인. 보호자를 의미하는 힌두교 전통의 신들을 상징적으로 앞세워 브랜드에 대한 믿음을 강조하고 있다."}, {"source": "20261114_115250.jpg", "text": "마케팅 시사점\n 마케터는 각 시장에서 종교가 태도와 행동에 어떤 영향을 미치는지 이해해야 하며, 긍정적인 반응을 유도하고 부정적인 반응을 최소화해야 한다.246 예를 들어, 출생 증명서와 소비자들을 긍정적으로 소 사실하기 때문에, 레스토랑에서의 전체의 잡식 식사로 인도에서 큰 소 소비자들의 차이점이 종교로 파악될 가능성이 크다 더,247 그러나 이러한 소비자들은 문제를 해결하려는 의지가 크고 몇 몇 다른 집단에 비해 더 용서하는 경향이 있다.248 실제 이 개념을 인도 런던에서 시행한 실험에서 일부 교직자들은 채식주의 레스토랑에서의 실패와 오류에 대해서 두려움을 느끼는 경향이 있다. 이는 신이 확신한 일이 다른 사람에게 나쁜 영향만 미치기 때문이다.249\n 마케터들은 종교를 이용한 제품 판매 홍보가 타당한지 여부를 신중하게 전달하거나 종교 집단을 타겟팅해야 한다. 종교 집단을 대상으로 한 마케팅 전략은 비지니스 대상으로 종교 라디오 및 TV 방송, 종교 잡지와 신문, 웹사이트, 컨퍼런스를 포함할 수 있다. 예를 들어, 일부 미국 회사들은 전통적인 종교 집단에 제품을 판매하고 있다. 특정 종교 쇼핑몰 거칠 않은 일부 미국 회사들은 타겟 집단에 마라톤을 생성하고 특정 웹사이트나 소셜 미디어 상호작용을 통해 특정 고객 집단에 도달할 수 있다. 일부 저가 할인 웹사이트는 종교 그룹을 대상으로 신청하게 맞춤화된 상품을 제공한다. 예를 들어, 아이콘(인물화) 브랜드는 유대인 영업 음식, 잡지 구독 및 기타 제품에 대한 할인 혜택을 제공한다.250\n 마케팅은 종교 집단의 신념과 관념에 대한 이해를 전적으로 보여주어야 하며, 이는 긍정적인 인상으로 명성이 인식받는 전략이기도 하다. ITC 호텔 그룹은 인도에서 인도의 호텔에서 여행객을 대상으로 힌두교(havel) 음식을 제공하고, 이 음식에는 여성 직원만이 요리를 제공한다. 라마다 호텔 그룹은 호텔에 온 손님에게 종교적 전통을 보여 주는 무료실 구역에서 오염되지 않은 카레와 과일을 제공한다. “믿음 있는 호텔 브랜드”로 알려진 이 회사는 ITC의 마케팅 전략과 유사한 종교적 기호와 같은 마케팅 전략을 채택하고 있다.\n 의사 결정 스타일, 그리고 소비 패턴에서 차이로 보일 수 있다. 또한, 마케터들은 다양한 성적 지향과 소비자 욕구에 맞춰 대응하고 있다. 미국과 세계의 다양한 지역에서 소비 패턴이 다를 수 있으며, 일부 마케터들은 이러한 지역에 맞춤화된 구체적으로 조직화된 관리 전략을 개발하고 있다. 지역적 차이는 소비자들이 특정 위치뿐만 아니라 유사한 인구 통계 및 소비 특성을 기반으로 다양한 지역의 소비자들을 세분화하는 데 도움을 준다. 미국에서 크기도 상이한 인종 그룹을 국외 또는 아프리카계 미국인, 히스패닉 및 라틴계 미국인, 그리고 아시아계 미국인이다. 많은 마케터들은 이러한 하위문화를 통"}, {"source": "20261114_115251.jpg", "text": "미주(endnotes)는 한경사 홈페이지 www.hankyungsa.co.kr의 정식시험에서 PDF 파일로 다운로드할 수 있습니다."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch12-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch12-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch12-book-edits',content.innerHTML));const saved=localStorage.getItem('ch12-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
