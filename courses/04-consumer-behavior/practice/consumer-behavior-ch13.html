<script>
const slides=[{"kind": "concept", "title": "가구와 가족 (Household and Family)", "answer": "가구는 같은 주거 단위를 공유하는 한 명 이상의 사람이며, 가족은 혈연·결혼·입양 등으로 연결된 관계를 중심으로 이해한다. 모든 가구가 가족인 것은 아니며 다양한 가족 형태를 실제 생활과 돌봄 관계에 맞게 살펴야 한다.", "example": "혼자 사는 학생도 하나의 가구이고, 혈연관계가 없는 친구 두 명의 공동 거주도 가구이다."}, {"kind": "concept", "title": "가족 유형과 다양한 생활 형태", "answer": "핵가족·대가족뿐 아니라 한부모·재혼·동거·무자녀 가구 등 다양한 생활 형태가 존재한다. 마케터는 전형적인 가족 이미지보다 구성원의 수, 연령, 돌봄과 지출의 분담을 확인해야 한다.", "example": "같은 두 사람 가구라도 신혼부부와 고령 부모·성인 자녀 가구의 가전과 서비스 요구는 다를 수 있다."}, {"kind": "concept", "title": "가족 생애 주기 (Family Life Cycle)", "answer": "성인의 연령, 자녀의 유무와 나이, 부양 관계 등의 변화에 따라 가족의 욕구와 지출이 달라진다. 결혼·출산·독립·은퇴가 모두에게 동일한 순서로 진행되는 것은 아니다.", "example": "어린 자녀가 있을 때는 돌봄과 안전에, 자녀 독립 후에는 여가나 노후 준비에 지출의 우선순위를 둘 수 있다."}, {"kind": "concept", "title": "가족 구조의 변화", "answer": "교재는 결혼 지연·동거, 맞벌이, 이혼, 소규모화, 동성 커플 가구 등을 가족 구조 변화의 요인으로 다룬다. 변화는 주거·식품·가전·서비스의 구성과 메시지 설계에 영향을 준다.", "example": "소규모 가구에는 소용량 식품과 공간을 적게 쓰는 가전이 적합할 수 있다. 가구 규모만으로 구매력을 단정하지는 않는다."}, {"kind": "concept", "title": "맞벌이와 역할 과부하 (Role Overload)", "answer": "일과 가사·돌봄의 여러 역할이 겹치면 시간과 에너지가 부족해질 수 있다. 시간 절약과 이용 편의가 중요해지며, 구매·가사 역할이 누구에게 배분되는지도 달라질 수 있다.", "example": "퇴근 후 조리 시간을 줄이는 식재료와 예약 가능한 세탁 수거 서비스가 생활 부담을 줄일 수 있다."}, {"kind": "concept", "title": "가족 구매의 여덟 가지 과업", "answer": "문제 인식, 정보 수집, 영향력 행사, 선택, 구매, 결제, 소비, 소비 후 행동을 구분한다. 한 사람이 여러 과업을 수행하거나 여러 사람이 같은 과업을 나누어 맡을 수 있다.", "example": "자녀가 컴퓨터 교체를 제안하고 부모가 결제해도 정보 탐색과 최종 선택은 함께 할 수 있다."}, {"kind": "concept", "title": "구매자·지불자·사용자의 구분", "answer": "구매 버튼을 누른 사람, 비용을 낸 사람, 실제 사용자가 다를 수 있다. 구매 기록에 나타난 사람만 조사하면 선택 기준과 만족·불만족의 원인을 놓칠 수 있다.", "example": "조부모가 결제하고 부모가 주문한 아동용 의자의 사용자는 자녀이다. 안전과 관리의 판단에는 부모도 관여한다."}, {"kind": "concept", "title": "가족 의사결정 참여 그리드 (HDM)", "answer": "의사결정 과업을 행에, 가족 구성원을 열에 두어 참여 관계를 살펴보는 도구이다. 제품과 상황별로 영향과 역할의 분담을 파악하며 모든 구매를 하나의 고정된 가족 권력 구조로 해석하지 않는다.", "example": "여행 계획의 탐색·선택·결제·사용에 누가 참여했는지 표시하면 누구에게 어떤 정보를 제공할지 정하기 쉽다."}, {"kind": "concept", "title": "자율적 결정과 파트너 주도 결정", "answer": "자율적 결정은 한 구성원이 자신의 소비를 비교적 독립적으로 결정하는 경우이다. 파트너 주도 결정은 여러 구성원의 소비에 관한 결정에 한 파트너가 가장 큰 영향을 미치는 경우이다.", "example": "자기 독서용 책을 혼자 고르는 것과 가족 모두의 식료품을 한 파트너가 주로 결정하는 것은 구분된다."}, {"kind": "concept", "title": "자녀 주도 결정과 공동 결정", "answer": "자녀 주도 결정에서는 자녀가 가족 소비의 선택에 큰 영향을 미친다. 공동 결정에서는 구성원들이 의사결정에 함께 기여한다. 참여 정도와 최종 결제 권한은 서로 다를 수 있다.", "example": "가족 외식 장소를 자녀가 정할 수도 있고, 휴가지의 일정과 예산을 가족 모두가 협의할 수도 있다."}, {"kind": "concept", "title": "파트너의 영향과 갈등 해결", "answer": "지식, 관심, 이용 경험, 시간, 자원 및 역할 규범에 따라 파트너의 영향이 달라질 수 있다. 갈등은 정보 교환·설득·협상·양보 등을 통해 조정하며 성별만으로 결정권을 추정하지 않는다.", "example": "한 사람은 차량 가격을, 다른 사람은 승하차 편의를 중시하면 우선순위를 비교하고 예산 안의 대안을 협의할 수 있다."}, {"kind": "concept", "title": "자녀의 영향과 양방향 사회화", "answer": "보호자는 소비 지식과 규범을 가르치고 자녀도 새로운 제품과 디지털 이용 정보를 전달한다. 자녀의 영향은 나이·지식·제품·가족의 의사소통 방식에 따라 달라진다.", "example": "부모가 가격 비교와 예산 관리를 알려 주고, 자녀는 온라인 주문 방법을 알려 줄 수 있다."}, {"kind": "concept", "title": "사회계층과 계층 구조", "answer": "사회계층은 사회적 지위와 생활 경험·가치·행동 등에 관련된 집단 구분이다. 사회마다 계층 구조와 이동 가능성이 다르며 경계가 언제나 명확한 것은 아니다.", "example": "비슷한 사회적 환경은 여가 활동과 매체 이용에 공통점을 만들 수 있지만 같은 계층의 모든 사람이 같은 브랜드를 쓰는 것은 아니다."}, {"kind": "concept", "title": "사회계층의 결정 요인", "answer": "소득, 직업, 교육은 사회계층을 파악하는 주요 요인이다. 현재의 구매 능력과 지위·가치·생활 방식은 관련되지만 동일하지 않으며 복수 지표와 소비 상황을 함께 살펴야 한다.", "example": "일시적으로 소득이 증가했다고 교육 경험, 직업적 지위와 취향이 즉시 모두 바뀌는 것은 아니다."}, {"kind": "concept", "title": "계층 간 소비 영향: 하향·상향·수평", "answer": "하향 확산은 상위 계층의 취향이 다른 계층으로, 상향 확산은 하위 계층에서 시작된 스타일이 상위 계층으로 퍼지는 현상이다. 수평 확산은 비슷한 계층이나 집단 사이의 전파이다.", "example": "고급 패션의 대중화, 거리 패션의 고급 브랜드 채택, 동료 집단 사이의 유행 전파를 각각 비교할 수 있다."}, {"kind": "concept", "title": "사회적 이동과 계층 경계의 변화", "answer": "상향·하향 이동은 사회적 지위의 상승·하락이며 세대 내 변화와 부모 세대와의 비교를 구분할 수 있다. 계층 간 소비 경계가 흐려져도 자원과 기회의 차이가 사라지는 것은 아니다.", "example": "부모보다 높은 지위의 직업에 진입하는 경우와 자신의 경력 중 실직으로 생활 조건이 악화되는 경우는 분석 기준이 다르다."}, {"kind": "concept", "title": "과시적 소비와 자발적 단순성", "answer": "과시적 소비는 제품의 획득·전시로 지위와 자원을 드러내는 소비이다. 자발적 단순성은 물질적 소유를 줄이는 생활을 의식적으로 택하는 것이다. 적게 소비한다는 결과만으로 동기를 단정할 수 없다.", "example": "고급 시계를 남에게 보여 주려는 소비와 소유물을 줄여 생활의 여유를 얻으려는 선택은 목적이 다르다."}, {"kind": "concept", "title": "지위 상징과 보상적 소비", "answer": "지위 상징은 사회적 지위나 정체성을 전달하는 제품·브랜드이다. 보상적 소비는 결핍·위협·부정적 감정을 보완하려는 소비로, 지위 표현과 함께 나타날 수도 있다.", "example": "승진에서 탈락한 뒤 인정받는 느낌을 얻으려고 비싼 물건을 구매했다면 보상적 동기를 살펴볼 수 있다."}, {"kind": "concept", "title": "돈의 의미와 소비의 행복", "answer": "돈은 교환 수단 외에도 안전, 자유, 성취, 인정 등의 의미를 가질 수 있다. 소비에서 얻는 행복은 금액뿐 아니라 경험, 관계, 사용 방식과 기대에 따라 달라진다.", "example": "같은 보너스를 비상자금으로 남기는 사람과 가족의 함께하는 경험에 쓰는 사람은 돈에 부여하는 의미가 다를 수 있다."}, {"kind": "concept", "title": "계층별 소비와 마케팅의 적용", "answer": "상류층·중산층·근로 계층·빈곤이나 주거 불안을 겪는 소비자는 자원과 제약이 다를 수 있다. 실제 예산, 시간, 접근성을 조사해 제품·가격·유통을 설계하고 계층에 대한 낙인이나 능력 단정을 피한다.", "example": "저렴한 대용량 상품도 선결제 금액과 보관 공간이 필요하다. 자원이 제한된 가구에는 소용량과 가까운 판매처가 더 유용할 수 있다."}, {"kind": "problem", "topic": "가구·가족", "title": "혼자 사는 학생과 혈연관계가 없는 친구들의 공동 거주를 가구와 가족의 개념으로 설명하라.", "answer": "둘 다 하나의 가구로 볼 수 있다. 가구는 한 명 이상이 주거 단위를 공유하는 개념이며 가족과 일치하지 않는다. 가족관계와 실제 돌봄·지출 관계는 추가로 확인해야 한다.", "example": "가구 구성원 수를 조사하는 것과 가족관계를 조사하는 것은 다른 정보를 얻는다."}, {"kind": "problem", "topic": "생애 주기", "title": "같은 나이의 두 소비자 중 한 명은 어린 자녀를 돌보고 다른 한 명은 혼자 산다. 나이만으로 소비를 예측하기 어려운 이유는?", "answer": "부양 관계와 가족 생애 단계에 따라 시간·예산·안전·공간 요구가 다르기 때문이다. 자녀 유무와 나이, 함께 사는 사람, 돌봄 역할을 함께 확인해야 한다.", "example": "같은 연령이라도 유아용품과 1인용 간편식에 대한 수요는 다를 수 있다."}, {"kind": "problem", "topic": "구조 변화", "title": "소규모·맞벌이 가구가 늘어나는 상권에 식품점을 연다. 상품과 서비스를 제안하라.", "answer": "실제 수요를 조사해 소용량·간편 조리 메뉴와 예약 픽업 등을 검토한다. 보관 공간과 시간 제약을 함께 고려하고 소규모 가구가 모두 고소득이라고 가정하지 않는다.", "example": "낱개 판매와 퇴근 시간 예약 수령은 다른 제약을 각각 줄일 수 있다."}, {"kind": "problem", "topic": "역할 분담", "title": "자녀가 노트북을 제안하고 형제가 사양을 비교했으며 부모가 최종 결정·결제하고 자녀가 사용했다. 과업을 구분하라.", "answer": "자녀는 문제 인식과 소비, 형제는 정보 수집을 맡았다. 부모는 선택과 결제에 참여했다. 실제 주문을 누가 했는지에 따라 구매 역할도 구분할 수 있다.", "example": "후기를 작성하거나 수리를 요청하는 사람은 소비 후 과업을 맡는다."}, {"kind": "problem", "topic": "구매자와 사용자", "title": "부모의 주문 내역만 보고 학생용 책상의 만족도를 판단하면 어떤 정보를 놓치는가?", "answer": "실제 사용자인 학생의 자세·공간·사용 불편과 선택에 영향을 준 사람의 기준을 놓칠 수 있다. 주문자·지불자·사용자 및 영향자를 나누어 조사해야 한다.", "example": "부모는 가격과 내구성에, 학생은 높이와 수납에 주목할 수 있다."}, {"kind": "problem", "topic": "HDM 그리드", "title": "가족 여행의 의사결정 참여를 조사하는 표를 어떻게 구성하고 활용할지 설명하라.", "answer": "행에 탐색·선택·구매·결제·소비 등 과업을, 열에 구성원을 두고 참여를 표시한다. 역할이 겹치는 부분과 정보가 필요한 사람을 확인하며 다른 제품에도 같은 분담이 있다고 가정하지 않는다.", "example": "여행에서는 자녀가 탐색을 맡고 가전에서는 부모가 탐색을 맡을 수 있다."}, {"kind": "problem", "topic": "결정 유형", "title": "① 자기 책을 혼자 고름 ② 파트너가 가족 식료품을 주로 고름 ③ 자녀가 외식 장소 결정 ④ 모두 휴가를 협의함. 유형을 구분하라.", "answer": "① 자율적 결정, ② 파트너 주도 결정, ③ 자녀 주도 결정, ④ 공동 결정이다. 유형은 해당 소비에서 누가 얼마나 기여하는지를 중심으로 판단한다.", "example": "공동으로 결정해도 결제나 예약 업무는 한 사람이 맡을 수 있다."}, {"kind": "problem", "topic": "가족 갈등", "title": "한 파트너는 차량 가격, 다른 파트너는 승하차 편의를 중시한다. 해결 과정과 기업의 지원을 제안하라.", "answer": "각 기준과 이유를 확인하고 예산·편의 수준을 비교해 양보 가능한 조건을 협의한다. 기업은 견적 비교와 시승, 구체적인 편의 정보를 제공할 수 있다.", "example": "가격만 강조하면 다른 구성원의 사용 불편을 해결하기 어렵다."}, {"kind": "problem", "topic": "소비자 사회화", "title": "부모는 예산 관리를 가르치고 자녀는 모바일 주문을 알려 준다. 가족 영향의 방향을 설명하라.", "answer": "보호자에서 자녀로 향하는 사회화와 자녀에서 보호자로 향하는 역방향 영향이 함께 있다. 지식과 역할에 따라 서로 배우는 양방향 과정이다.", "example": "새로운 결제 기능을 배우는 것과 소비 규범을 익히는 것은 서로 보완적이다."}, {"kind": "problem", "topic": "소득과 계층", "title": "‘가구 소득이 같으면 사회계층과 취향도 같다’는 주장을 평가하라.", "answer": "소득은 주요 지표이지만 직업·교육·생활 경험과 같지 않다. 가구 규모와 부양 부담에 따라 구매 능력도 달라진다. 복수 지표와 실제 욕구를 함께 살펴야 한다.", "example": "일시적 고소득과 안정적 자산·직업적 지위는 구분할 수 있다."}, {"kind": "problem", "topic": "계층 간 확산", "title": "고급 브랜드 스타일의 대중화와 거리 패션의 고급 브랜드 채택을 구분하라.", "answer": "앞은 상위 계층에서 다른 계층으로 퍼지는 하향 확산, 뒤는 반대 방향의 상향 확산으로 볼 수 있다. 실제 출발점과 전파 경로를 확인해야 한다.", "example": "동료 사이에서 유사한 스타일이 퍼지면 수평 확산도 살펴볼 수 있다."}, {"kind": "problem", "topic": "사회적 이동", "title": "부모보다 높은 지위의 직업에 진입한 경우와 실직으로 생활 조건이 악화된 경우를 설명하라.", "answer": "앞은 세대 간 상향 이동, 뒤는 개인의 생애 중 하향 이동으로 분석할 수 있다. 소득 변화뿐 아니라 직업·사회적 지위와 생활 조건의 변화를 함께 확인한다.", "example": "사회적 이동은 소비 우선순위와 지위 불안에도 영향을 줄 수 있다."}, {"kind": "problem", "topic": "소비 동기", "title": "같은 고급 시계를 A는 지위를 보이려고, B는 실패 뒤 자신감을 얻으려고 샀다. 동기를 비교하라.", "answer": "A는 과시적 소비, B는 보상적 소비의 동기가 두드러진다. 하나의 구매에 두 동기가 함께 있을 수도 있어 제품 가격만으로 동기를 단정할 수 없다.", "example": "기능이 같은 물건도 누가 어떤 상황에서 샀는지에 따라 의미가 다르다."}, {"kind": "problem", "topic": "자발적 단순성", "title": "물건이 적은 두 가구 중 한 곳은 생활 철학으로 줄였고 다른 곳은 예산 부족으로 줄였다. 차이는?", "answer": "전자는 자발적 단순성으로 볼 수 있지만 후자는 자원 제약에 따른 결과일 수 있다. 겉으로 보이는 소비량보다 선택의 자발성과 동기를 확인해야 한다.", "example": "소유물이 적다는 사실만으로 환경 가치가 높다고 판단할 수 없다."}, {"kind": "problem", "topic": "계층별 마케팅", "title": "저소득 가구에 단위가격이 낮은 초대형 포장만 판매하면 충분한가?", "answer": "충분하지 않다. 선결제 금액, 운반, 보관 공간, 점포 접근성 등의 제약이 있다. 실제 상황에 맞는 용량·가격·구매 경로를 함께 설계해야 한다.", "example": "소량을 가까운 곳에서 구매하는 선택은 단위가격 외의 비용도 고려한 결과일 수 있다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제13장 · 가족 및 사회계층의 영향';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
