</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "가족 및 사회계층의 영향", "source": "20261114_141229.jpg"}, {"kind": "paragraph", "text": "도입\n 마케터들은 전 세계적으로 가구 구성과 사회계층이 소비자 행동에 영향을 미친다는 점을 인식하고 있다(그림 13-1 참조). 낮은 사회경제적 지위롤 가진 소비자들의 중심층이 되기를 갈망할 때, 그들은 기회를 향상시키기 위해 제품을 구매하거나 특정 상표이 선호하는 브랜드를 선택할 수 있다. 이 장을 읽으면서 가구와 사회계층에 대한 일반적인 내용은 넓은 집단의 경향성을 나타내며 개별 소비자에게 그대로 적용되지는 않을 수도 있다는 점을 기억해야 한다. 양극화는 이러한 일반적 경향 속에서도 상당한 차이가 존재하게 한다. 예컨대, 어떤 개인이나 특정 집단은 가구와 사회계층에 관계없이 다양한 삶의 방식을 선택하거나, 무계획적이고 즉흥적 소비를 하는 사람도 있을 것이다. 이 장에서는 인구통계적, 이질적 공동으로 설명하기는 어려운 개인적, 가족적 소비자 의사결정의 동기 요인을 탐구할 것이다.\n 13-1 가족이 소비자 행동에 어떻게 영향을 미치는가\n 가족 구성원은 매일, 매주, 매월 아침으로 무엇을 먹을지, 언제 식료품을 살지, 휴가, 저녁으로 무엇을 먹을지, 오늘 밤에 텔레비전은 무엇인지, 누가 차고를 청소할지, 어떤 건강보험을 선택하고 어떤 보장을 받을지 등에 여러 결정을 내린다. 사실, 가족은 소비자 행동을 분석하는 데 있어 가장 중요한 단위 중 하나일 수 있다. 그러나 모든 가구가 가족인 것은 아니다. 이 절에서는 가족과 가구를 정의하고, 다양한 가", "source": "20261114_141229.jpg"}, {"kind": "heading", "text": "13장 가족 및 사회계층의 영향", "source": "20261114_141235.jpg"}, {"kind": "paragraph", "text": "13-1a 가족의 유형\n 가구와 가족은 관련이 있지만 다른 개념이다. 가구(household)는 가족 관계 여부와 상관없이 동일한 주거지나 주거 단위를 공유하는 한 명 이상의 개인으로 구성된다. 반면에 가족(family)은 일반적으로 결혼, 혈연, 입양으로 인해 관계가 있는 개인들이 함께 사는 그룹으로 정의된다(그림 13-2 참고). 그러나 결혼, 출산, 이혼에 대한 태도와 이를 승인하는 개인들의 가족생활 양식이 변화할수록 가족은 더욱 다양한 형태와 구조로 존재할 수 있다. 가족의 구성원은 가족행동과 가족적 의무로 인해 서로에게 강한 영향을 미치며, 그 구성원은 소비자 행동에도 영구적인 영향을 미친다. 따라서 가족은 특성 유형의 가구이다. 핵가족(nuclear family)이란 용어는 부모가 결혼한 상태로 함께 거주하며 부양 자녀를 묘사한다. 대가족(extended family)이란 용어는 배우자가 결혼하여 자녀를 낳고 기른다는 전통적인 개념 외에도 한 집에서 몇 세대가 함께 거주한다는 개념까지 포함한다. 그러나 현대 사회에는 대가족 가운데 혈연 관계가 없는 사람들도 포함된다. 따라서 여기서는 부모 또는 한 명 이상의 양육 부모와 자녀로 구성된 모든 가족을 가족으로 정의한다. 이때 자녀는 생물학적 자녀 외에도 입양 자녀 또는 계부모와 함께 사는 자녀도 명시적으로 포함된다. 상업적 관점에서 보면, 늘어나는 한 부모 가구와 동거 가족도 가족으로 정의될 수 있다. \n 소비와 인구 통계의 변화, 늦어진 결혼, 동거인 증가, 동성 커플의 인정 등은 가정의 구조와 크기를 복잡하게 변화시켰다. 예를 들어, 부모와 함께 다시 거주하는 부메랑 자녀, 사람들로 구성된 성인, 그리고 낮은 출산율과 같은 요인들로 인해 비전통적인 가구의 수가 크게 증가했다. 통계청의 자료에 따르면, 1970년 가구주의 연령별 분포에서 30세 미만 가구주의 비율이 남성 34.8%, 여성 26.6%로 가장 높게 나타났으나, 이후 전체적으로 연령별 분포가 높은 연령대로 이동했다. 2021년에는 15세 이상의 성인 3명 가운데 1명만이 법적 혼인 상태인 것으로 나타났다. 또한 혼인 건수는 10년 전보다 줄어든 반면, 동거인 수는 2005년 120만 명에서 2019년 160만 명으로 증가했다. 1970년에는 여성 평균 초혼 연령이 23세, 여성 평균 출산 연령이 25세였으나 2019년에 각각 30세와 33세로 높아져 결혼과 출산이 모두 늦어지는 경향을 보인다. 이에 따라 1인 가구, 무자녀 가구, 그리고 독거노인 가구도 증가하고 있다. 2021년 기준으로 1인 가구 수는 665만 가구로 전체 가구의 33.4%를 차지했으며, 이는 1990년대 이후 지속적으로 증가해 온 것이다. 이러한 변화는 마케팅 전략에도 중요한 함의를 지니는데, 예를 들어, 1인 가구의 증가는 소량 포장 제품, 간편식, 1인용 가전제품 등에 대한 수요를 증가시키며, 고령화와 독거노인 가구의 증가는 건강 관리 제품과 서비스, 안전 장치 등에 대한 수요를 촉진한다.\n 13-1b 가족과 가족 생애 주기\n 가족은 가족 생애 주기(family life cycle)의 단계에 따라 다를 수 있다. 그림 13-3에서 볼 수 있듯이, 가족은 성인의 나이, 성인의 직, 조부모 또는 다른 돌봄 제공자의 존재 여부, 집에 자녀 있는 아이들의 나이와 수 등으로 특징지어지는 단계로 구분될 수 있다. 13-3에서 화살표로 나타낸 것처럼 이 단계는 서로 다른 수준으로 부모와 가정의 생상력 소비와 가정 구조를 변경할 수 있다.\n 마케터들은 가족 생애 주기에 따른 다양한 욕구와 소비자 행동의 패턴을 이해해야 한다. 예를 들어, 신혼 단계의 젊은 부부는 주거 마련, 가전제품 구입, 신혼여행 등의 지출이 증가하며, 어린 자녀를 둔 가구는 육아 관련 제품과 서비스에 대한 수요가 크다. 자녀가 성장하여 독립하면 부모 가구의 지출 패턴은 다시 바뀌게 되는데, 이 시기에 부모는 자신을 위해 더 많은 비용을 지출하거나 노후를 위한 저축과 투자를 늘릴 수 있다. 또한 고령의 부모를 부양해야 하는 중년층 가구는 의료비, 간병비 등의 지출이 증가할 수 있다.\n 이와 같이 가족 생애 주기는 가구의 수입과 지출 구조뿐 아니라 소비자의 욕구와 선호에도 영향을 미치므로, 마케터는 각 단계에 적합한 제품과 서비스, 커뮤니케이션 전략을 개발해야 한다. 예를 들어, 어린 자녀를 둔 가구에는 교육용 완구나 학습 도구, 자녀 안전을 위한 제품 등을 강조하고, 은퇴 단계의 가구에는 건강 관리, 여가 활동, 여행 상품 등을 제안하는 식이다. 이처럼 가족 생애 주기에 따른 소비자 행동의 변화를 이해하는 것은 효과적인 시장 세분화와 타기팅 전략 수립에 필수적이다.", "source": "20261114_141235.jpg"}, {"kind": "heading", "text": "13-1c 가족 구조의 변화 추세", "source": "20261114_141244.jpg"}, {"kind": "paragraph", "text": "성이 늦다는 점을 인식해야 한다.\n 가족 생애 주기 변화는 이전 분류보다 훨씬 더 다양하다. 현재의 분류는 더 많은 유형의 가구와 더 많은 단계를 포함하도록 확장될 수 있다. 예를 들어, (다음 절에서 논의되는) 동성 커플과 자녀 유무에 관계없이 결혼하지 않은 독신 성인, 이혼을 경험한 개인을 포함할 수 있다. 또한, 일부 사무실에는 반려동물(고양이, 개 등)을 다른 기존 동물과 분별한 가구 구성원으로 여지까지 가구 지출에 중요한 영향을 미칠 수 있다. 실제로, 미국의 반려동물 관련 상품 및 서비스 시장은 600억 달러에 이르렀다.\n 5개의 주요 요인이 가족의 구조와 특성을 변화시키고 있다. 이러한 요인들은 (1) 지역에 결혼한 동거, (2) 맞벌이, (3) 이혼, (4) 가족의 소규모화, (5) 동성 부부가 있다.\n 점점 더 많은 사람들이 결혼을 미루거나 피하고 있다. 미국 남성의 첫 결혼 중위 연령은", "source": "20261114_141244.jpg"}, {"kind": "heading", "text": "맞벌이 가정", "source": "20261114_141248.jpg"}, {"kind": "paragraph", "text": "30세이고, 미국 여성의 첫 결혼 중위 연령은 29세이다.⁸⁹ 사람들이 더 오랜 기간 독신으로 지내는 이유는 자유를 원하는 것, 헌신을 피하려는 경향, 사회적 기술 부족, 직업 경력에 높은 우선순위를 두는 것, 주로 재정적 결정을 미루는 경향 등 다양하다. 또한, 일부 사람들은 소득 수준의 차이로 인해 경제적 이유로 결혼을 서두르는 긴박감이 줄어든다. 25세에서 34세 사이의 미국 성인 중 약 36%가 결혼하지 않았거나 로맨틱한 파트너와 함께 살지 않게 되었는데, 이는 1990년대의 20%에서 증가한 수치이다.¹⁰ 마케터들은 이러한 추세를 주목하여, 이는 1인 가구가 독신 및 비혼인들에 대한 이야기 그 이상임을 알고 있다.\n 사회적 규범의 변화로 인해 더 많은 소비자들이 결혼하지 않은 상태로 이성과 함께 살고 있다.¹¹ 그럼에도 불구하고 결혼하지 않은 많은 파트너들은 비용을 공동으로 부담하고, 둘 다 적력이 있을 가능성이 높기 때문에 일반적으로 동일한 연령층의 학력 배우자보다 저임이 있는 결혼한 부부에 비해 가처분 소득이 높다.\n 맞벌이 가정 맞벌이 가정의 증가는 남녀 모두의 직장을 시작으로 소비자 행동에 중요한 시사점이 있다. 이러한 가정은 다른 가정보다 보육, 의식, 일반적인 서비스에 대한 수요가 많다. 또한, 맞벌이 가정 매출은 중요한과 역할 과부하(role overload)를 견디면서 요리, 집안일, 기타 활동에 쓸 시간이 줄어든다. 따라서 맞벌이 가정은 시간을 절약할 수 있는 상품을 특히 중요하게 생각한다. 맞벌이 가정에서는 파트너 간의 권력 균형이 변화하여 더 많은 남성이 가사 책임을 분담하며, 점점 더 많은 남성(약 1,400만 명)이 18세 이하 자녀의 주요 보호자로 집에 머물고 있다.¹² 그 결과, 요리 책임을 나누는 남성을 대상으로 한 광고가 증가하고 있다.\n 이혼 미국의 경우 결혼한 부부 10쌍 중 4쌍 이상이 이혼을 한다. 지난 40년 동안 이혼율이 완만히 정화하였다면, 여전히 매년 많은 소비자들이 결혼을 끝내고 있으며 소비자 행동에 매우 중요한 영향을 미치고 있다. 이혼한 사람들은 과거에 소모했던 것만큼 필수적인 수입이 필요하므로 가정을 꾸기 위해 구매와 소비에 관한 새로운 패턴을 형성하는 것과 같은 실질적인 작업을 하게 된다. 이들은 상당량의 의한 것이라도 스트레스를 유발한다. 이혼 중이거나 이혼 후에 필요한 물품과 서비스를 구매하는 것은 소비자가 새로운 정체성을 형성하고 스트레스를 완화하는 데 중요한 역할을 한다. 예를 들어, 이혼한 소비자는 새 차, 가구, 집을 구입하거나, 새로운 헤어스타일을 시도하거나, 데이트 사이트의 앱을 사용하기 시작할 수 있다.¹⁵\n 이혼은 또한 가족 구조에 영향을 미친다. 만약 이혼한 부부에게 자녀가 없다면 이들은 앞에서 언급한 독신자들이 구매하는 물품을 구매하나 소비 패턴은 채택한다. 그러나 이 새로 독신자들은 일반적으로 나이가 많고, 여전히 있는 경우에는 한부모 가정을 형성하고 있을 가능성이 종종 있다. 이혼율은 이성과 함께 살고 있는 부부들을 비롯하여 정식으로 결혼하지 않은 동거 부부들도 높다. 간단히 말해, 많은 싱글 소비자들은 아직 결혼하지 않았거나 더 이상 결혼을 하지 않기 때문에 점점 더 많은 제품과 서비스에 대한 판매를 정직 지향하고 있다. 미혼 및 이혼자 대부분은 혼자 사는 세입자이 가능성이 크다. 미니밴은, 일반적으로 있는 이혼한 사람들의 라이프스타일에는 맞지 않는다. 이들이 양육 가정을 오갈 때 필요로 하는 옷과 기타 용품들이 더 많이 필요할 수 있다.", "source": "20261114_141248.jpg"}, {"kind": "paragraph", "text": "특한 소비 욕구가 존재할 수 있다.\n 가족의 소규모화 많은 나라에서 평균 가족 규모가 점차 줄어들고 있다. 미국의 평균 가구 규모는 1960년 약 3.7명이었으나 2022년에는 3.17명으로 감소했다.16 가족의 규모가 작아진다는 것은 레크리에이션, 휴가, 교육, 엔터테인먼트 등의 사용액을 소수가 낼 수 있는 가처분 소득이 많아짐을 의미한다. 또한 소규모 가족은, 개별 자녀들에 대해 더 많이 지출할 수 있다. 무자녀 부부는 다른 가족들에 비해 가족용 소득이 더 많고 식당, 레스토랑 외식, 엔터테인먼트, 주류, 의류, 반려동물 등에 더 많이 지출한다.17\n 동성 커플 가구 미국 인구 조사에 따르면, 2021년 미국에는 약 120만 개의 동성 커플 가구가 있었으며, 이 중 약 70만 쌍이 결혼한 상태였다.18 이는 전체 결혼 2400만 가구의 약 1%에 해당한다. 국제적으로 사회가 계속 변화함에 따라, 동성 결혼을 합법화한 국가가 늘어나고 있다.19 2001년 네덜란드는 동성 결혼을 허용한 최초의 국가가 되었다.20 2015년 미국에서 동성 결혼이 합법화된 해이지만, 그로전에는, 아일랜드에서도 동성 결혼이 합법화되었다.21 동성 커플 가구는 마케터들이 타깃 제품과 서비스뿐 아니라 마케팅 커뮤니케이션으로 접근할 수 있는 기회를 제공한다. 1994년, 이케아(IKEA)는 미국에서 동성 커플을 포함해 첫 번째 텔레비전 광고를 방영했다.22 그 이후 티파니(Tiffany), 타깃(Target), 스바루(Subaru) 등의 기업들은 다양한 동성 커플을 등장시켰다. 라스베이거스 컨벤션 관광국은 라스베이거스에서의 동성커플 결혼을 장려하기 위한 새로운 광고 캠페인을 활용한다.23 영국의 핑크 웨딩 페어(Pink Wedding Venues)라는 웹사이트의 경우는 LGBTIQ+ 친화적인 결혼식 장소에 관심 있는 고객을 맞춤결혼장을", "source": "20261114_141256.jpg"}, {"kind": "heading", "text": "13-2 가족 구성원이 가질 수 있는 역할과 과업", "source": "20261114_141300.jpg"}, {"kind": "paragraph", "text": "다수의 구성원이 있는 가족에서는 모든 구성원이 가족의 의사 결정 과정에 기여할 수 있지만 매우 다른 방식으로 기여할 수 있다. 가족 구성원은 제품, 서비스 또는 브랜드를 획득하고 소비하는 데 다양한 미시역할과 역할을 수행할 수 있다. 과업은 목표를 달성하기 위해 수행해야 하는 활동으로, 예를 들어, 시험에 합격하기 위해 공부하는 것이 있다. 역할은 특정 가족 구성원이 예기된 과업을, 예를 들면, 학급에서 하는 길에 지정된 운전자가 되는 것에 있다. 이에 열거되는 가족 의사 결정 과업과 역할(household decision tasks and roles), 그리고 구성원들의 가족 의사 결정 과정에 어떻게 기여할 수 있는지 살펴본다. 먼저 각기 가족에서는 각각의 과업과 역할을 개별적으로 설명한다. 예를 들면, 가정 문제 인식과 정보 검색을 설명하고, 다음은 소비 의사 결정 과정을 설명한다. 가정 의사 결정에서는 이 모든 과업과 역할이 하나로 합쳐진다. 가족 구성원들이 가족에 부여된 의사 결정의 각 단계와 연관되어 있다.\n 1. 문제 인식: 원하는 상태와 실제 상태 사이에 문제가 있다고 식별한 구성원.\n2. 정보 수집: 기존 지식과 다른 정보원들로 정보를 검색하는 구성원으로, 획득하거나 처분할 제품, 서비스 또는 브랜드에 대한 정보 탐색 행동 유형의 변화를 찾는다.\n3. 영향력 행사: 선호를 표현하여 직접적으로 또는 다른 구성원이 그들의 선호를 고려하도록 독려하여 간접적으로 의사 결정에 영향을 미치는 구성원.\n4. 선택: 선택과 행동 수행, 예를 들어, 선택한 제품, 서비스 또는 브랜드를 최종적으로 결정하는 구성원.\n5. 구매: 실제 구매를 수행하는 구성원으로, 예를 들어, 물리적 상점에 가거나, 웹사이트에서 ‘구매’ 버튼을 클릭하거나, 계약서에 서명하는 등.\n6. 결제: 구매 비용을 지불하는 구성원.\n7. 소비: 제품, 서비스 또는 브랜드를 소비하는 구성원, 소비는 소유와 사용을 포함한다.\n8. 소비 후 행동: 가족 구성원 모두가 소비한 제품, 예를 들어, 제품, 서비스 또는 브랜드의 소비 업체나 생산업체에게, 또는 사회적 네트워크 내의 다른 사람들에게, 경험을 공유함으로써 긍정 또는 불만을 표현하는 구성원.\n 각 과업이나 역할은 단일 구성원, 다수의 구성원 또는 모든 가족 구성원이 수행할 수 있다. 예를 들어, 가정의 아이들이 스트리밍 서비스에서 볼 새로운 영화를 검색하고 특정 영화를 적극 지지할 수 있다. 그런 다음 가족의 성인 보호자는 함께 할 한 편 또는 여러 편의 스트리밍 영화를 선택할 수 있다. 한 성인 보호자는 공통의 결제 계좌에서 영화를 클릭하고 결제할 수 있고, 모든 가족 구성원이 함께 영화를 시청할 수 있다. 그런 다음 영화룰 함께 본 후, 아이들은 자신의 소셜 미디어에 긍정적 또는 부정적 리뷰를 게시할 수 있다. 그런 점을 보면, 가족 구성원의 이 가정 의사 결정 과정에 가질 수 있는 다양한 역할과 과업이 있는 것도 틀림없다.\n가족 의사 결정에서 네 가지 전형적인 패턴을 구분하는 것이 유용하다.\n 1. 자율적 의사 결정(autonomic decision): 가족의 한 구성원이 문제 인식과 소비 후 행동까지 모든 역할을 거의 혼자 수행하며, 그 구성원만 소비하는 제품이나 서비스에 대해 의사", "source": "20261114_141300.jpg"}, {"kind": "paragraph", "text": "하는 경우에 발생한다. 예를 들어, 파트너 A는 자신이 선호하는 작가의 최신 베스트셀러책을 고정하고, 그것을 구해라고, 비용을 지불하고, 읽는다. 반면, 파트너 B는 자신이 좋아하는 가수의 새로운 오디오 스트리밍에 대해 동일한 결정을 한다. 완전히 자유의지 결정은 그림 13-4의 HDM 그리드에서 가족의 단위 구성원에 따른 모든 X가 있는 열로 나타난다.\n 2. 파트너 주도 의사 결정(partner-dominated decision)은 가족의 한 파트너가 여러 구성원이 소비하는 제품, 서비스, 브랜드를 획득하기로 한 결정에 가장 큰 영향을 미치는 경우이다. 반면, 극단적인 경우, 해당 파트너가 소비하지 않는 경우도 있다. 예를 들어, 파트너 A가 혼자서 모든 가족 구성원에게 영향을 보며 할 수 있는 새로운 옷을 구매하고 비용을 지불하기로 결정할 수 있다. 파트너 주도 결정은 그림 13-4의 특정 제품에 대한 열로 나타난다. 소비 역할에는 적어도 한 명 이상의 파트너에 대한 모든 X가 있는 열로 나타난다. 소비 역할에는 적어도 한 명 이상의 가족 구성원에 대한 X가 있다.\n 3. 아이 주도 의사 결정(child-dominated decision)은 한 명 이상의 아이들이 모든 가족 구성원이 사용하는 제품이나 서비스 획득의 가장 큰 영향을 미치는 경우에 발생한다. 예를 들어, 아이 B가 가족 구성원 일부 또는 전부가 갈 아웃 식사를 먹을 때, 식당을 결정할 수 있다. 이러한 결정은 그림 13-4의 그리드에서 소비 역할을 제외하고 이중 한 열에 대한 모든 X가 있는 열로 나타난다. 소비 역할에는 적어도 한 명 이상의 다른 가족 구성원에 대한 X가 있다.\n 4. 공동 의사 결정(syncratic decision)은 모든 가족 구성원이 의사 결정 과정에 기여하는 경우에 발생한다. 공동 의사 결정을 하게되는 결정 또는 민주적인 결정이다. 예를 들어, 모든 가족 구성원이 공동 여를 휴가에 대한 의사 결정 과정에 기여할 수 있다. 공동 의사 결정은 모든 가족 구성원이 어느 한 측면의 정도에서라도 결정할 사안이 공동의 의사 결정보다 중요한 경우에 더 많이 발생한다. 공동 의사 결정은 연합적인 의사 결정, 협의적인 의사 결정, 협력적 의사 결정(collaborative decision-making)이라는 가족 구성원이 이전 지식, 기술 또는 시간과 자원 면에서 서로 다른 과업이나 역할을 수행할 수 있다. 이는 가족 구성 이가 보다 많은 시간이 필요하여 각자의 역할을 수행하며 협력하는 것과 같다. 그림 13-4에서는 공동 여를 휴가를 선택하는 예를 통해 공동 의사 결정 유형을 협력적이다.\n 물론, 네 가지 유형의 가족 의사 결정은 이상화된 것이다. 실제로, 가족은 다양한 방식으로 결정을 내린다. 그림 13-5의 HDM 그리드는 이와 실험하는 데 도움이 된다.\n 가족 의사 결정에서의 갈등(conflict in household decision making)은 구성원이 의사 결정을 할 때, 누가 어떤 역할을 담당했는지에 대해 동의하지 않는 때 발생한다. 갈등은 (1) 구매 동기, (2) 신념과 옵션, (3) 결과에 대한 기대, (4) 다수의 성원이 합리성을 추구하는 정도에서 발생한다. 예를 들어, 무공해 청정제를 사용하여 비용을 절감하고, 소비재 사려에 대한 신념에서 발생할 수 있다. 예를 들어, 유기농 식품 사용과 같", "source": "20261114_141307.jpg"}, {"kind": "heading", "text": "그림 13-4 가족 의사 결정에서의 과업과 역할", "source": "20261114_141311.jpg"}, {"kind": "paragraph", "text": "다수의 구성원인 있는 가정에서는 의사 결정하는 일, 일부, 또는 모든 구성원이 할 수 있다. 특정한 제품, 서비스 또는 브랜드는 한 구성원에 의해서만 구매되며 소비될 수 있다. 과업과 역할 자기 평가 도구(HDM) 그리드는 이외의 결정을 하는것에 대해 논의할 때 평가를 위해 사용된다. HDM 그리드는 의사 결정 과정에서 각 구성원이 참여하는 범위를 파악할 수 있다. 예를 들어, 수영장의 가격 결정 프레임과 같은 마케팅 도구 고객의 다른 영역의 동참시키는 데 사용할 수 있다. 연구 결과는 파악할 수 없다, 하지만 어떤 경우에는 가족의 몇몇 납세, 여성 또는 다른 연령 말일 원인 있다. 따라서 HDM 그리드는 '가족 A와 자녀A로 두 명의 소비자를 나타내며. 연구 가정인의 수에 따라 여러 그리드를 작성할 수 있다.\n 예시 1은 본문에서의 영화 스트리밍 예시이다. 그림의 셀에 있는 ‘X’는 특정 구성원이 특정 구매 결정에 기여하고 있음을 의미한다. 최대 X는 해당 구성원이 많이 관여한다는 의미이다. 영화 스트리밍 결정을 내리기 위해서 가족의 4명의 구성원이 제품 및 서비스 목표에 관여했다. 결정까지 걸리는 시간은 1~2시간이다. 이 가족은 많은 시간을 투자할 의사가 있다.\n 영화 스트리밍 사례에서 각자의 의사 결정 역할을 구체적으로 살펴보면, 파트너 A는 대다수의 의사 결정 단계에 관여한다. 자녀 A는 정보 검색, 평가, 구매 그리고 영화 스트리밍 구독과 관련된 ‘소비 후 행동’ 활동에 활발하게 참여한다. 파트너 B는 대신 집에서 DVD를 보는 것을 선호한다. 이것은 또한 영화 스트리밍 서비스를 선택할 때 중요한 TA가 된다.\n 이 예시는 DVD 또는 블루레이 같은 물리적 제품을 강조한다. 예를 들어, 만약 다른 의사 결정 영역도 HDM그리드를 사용한다면, 책, 게임 그리고 음악처럼 각기 다른 제품과 서비스를 위한 테이블 세트가 있을 것이다. 이렇게 되면, 가족 구성원들이 생산자에하는 특정 구매 결정에 관여할 수 있는 방법도 멀어이 늘어난다.\n 이와 같이 마케팅 도구는 상활에서 유용하게 활용할 수 있으며, 직원이 자신의 역할에 대해 보다 효과적으로 가르칠 수 있다.\n 마케터는 의사 결정의 주체와 그 집단의 차이에 대해 개별 고객과 그들의 가족 단위가 어떤 역할을 하는지 이해할 필요가 있다. 고객을 개인으로 보는 것과는 다르게, 브랜드가 어떻게 특정 가족의 영향 아래에서 선택되는지 살펴볼 필요가 있다. 이는 특정 제품 카테고리가 개별적으로 구매되는지, 아니면 가족 단위에서 구매되는지에 대한 중요한 통찰을 제공한다.\n 이 장의 다른 부분에서, 가족 의사 결정에 있어서의 다양한 상황적 맥락을 고려하는 것이 왜 중요한지를 예시를 통해 논의할 것이다. 예를 들어, 휴가 계획, 자동차 구매, 가전제품 선택 등은 대체로 가족 단위의 의사 결정이 필요한 영역이다.\n 실제 구매 의사 결정에서 가족 구성원들의 관여 수준은 제품의 가격, 중요도, 사용 기간, 그리고 상징적 의미에 따라 달라진다. 자녀의 의견이 강하게 반영되는 경우도 있고, 한 사람(대개는 부모 중 한 명)이 주도적으로 결정을 내리는 경우도 있다. 이때, 다른 가족 구성원은 정보 제공자, 조언자, 혹은 단순한 동의자로서의 역할을 수행하게 된다.\n 소비자 행동 이론에서는 이러한 역할을 다음과 같이 구분한다. 문제 인식자, 정보 수집자, 평가자, 구매자, 사용자, 영향력 행사자 등이다. 하나의 사람이 여러 역할을 맡을 수도 있고, 반대로 하나의 역할을 여러 사람이 나누어 담당할 수도 있다.\n 이러한 역할 분담은 가족의 라이프 사이클 단계, 소득 수준, 문화적 가치, 그리고 가족 내 권력 구조에 따라 달라진다. 어린 자녀를 둔 젊은 부부와, 성인 자녀가 있는 중년의 가족은 구매 의사 결정 구조가 서로 다를 수 있다.\n 마케터는 이러한 차이를 이해함으로써, 특정 타깃 가족에게 더 효과적으로 소구할 수 있는 메시지와 커뮤니케이션 전략을 수립할 수 있다. 예를 들어, 어린이용 식음료 제품의 경우 자녀와 부모 모두에게 어필하는 광고를 제작할 필요가 있을 수 있다. 한편, 고가의 내구재 제품의 경우에는 주로 재정적 책임을 지는 구성원을 설득하는 것이 중요하다.\n 이 장의 다음 부분에서는, 가족 의사 결정에서 나타나는 갈등과 협상 과정을 살펴볼 것이다. 가족 구성원들은 각자의 선호와 이해관계를 가지고 있기 때문에, 때로는 의견 충돌이 발생한다. 이런 갈등은 대화와 타협을 통해 조정되지만, 마케터 입장에서는 이러한 갈등 구조를 이해함으로써 어떤 메시지가 설득력을 가질 수 있는지를 예측할 수 있다.\n 또한 미디어와 인터넷의 발달은 가족의 구매 의사 결정 과정에 새로운 변수를 추가하였다. 온라인 리뷰, 소셜 미디어, 가격 비교 사이트 등은 가족 구성원 각자가 독립적으로 정보를 탐색하고 의견을 형성할 수 있는 환경을 제공한다. 이로 인해, 과거보다 더 많은 구성원이 의사 결정 과정에 참여하게 되었으며, 권력의 중심이 분산되는 경향을 보인다.\n 마지막으로, 다양한 가족 형태(한부모 가족, 맞벌이 가족, 다문화 가족 등)가 증가함에 따라, 전통적인 가족 의사 결정 모형만으로는 오늘날의 소비자 행동을 충분히 설명하기 어렵게 되었다. 따라서 마케터와 연구자들은 보다 유연한 시각으로 가족 의사 결정을 접근해야 하며, 환경의 변화에 따라 가족 내 역할 구조가 어떻게 재구성되는지를 지속적으로 관찰할 필요가 있다.", "source": "20261114_141311.jpg"}, {"kind": "heading", "text": "13-2a 파트너와 배우자의 역할", "source": "20261114_141318.jpg"}, {"kind": "paragraph", "text": "또는 에너지 절약과 같은 ‘원원장’ 소비에 관한 결정에서 갈등이 발생할 수 있다.34 세대가 다른 구성원 이 있는 가족에서는 서로 다른 가치관을 가질 수 있으며, 학교나 직장으로 가기 위한 교통수단(자동차, 대중교통, 자전거)의 선택이 논의의 쟁점이 될 수 있다. 일반적으로, 가족은 토론과 협상, 설득과 같이 체계적인 방법을 통해 갈등을 해결한다.35 이러한 갈등 해결(conflict resolution)은 욕구가 충족되지 않았던, 가족의 원힐의 작은 결정을 내린 해결책에 도달하는 ‘상호 양보의’과정이다. 하지만, 많은 가족은 갈등을 회피하려는 경향이 있다.\n 관계에서 파트너는 의사 결정 시 다양한 역할을 할 수 있으며, 이들의 영향력의 본질은 그림 13-1에서 설명한 대로 제공되는 것과 관계에 따라 다르다. 파트너가 최종 결정에 가까울수록, 특히 더 중요한 결정에 참여하여 의사 결정으로 나아가는 경향이 있다. 파트너가 가족 의사 결정에서 실제로 기여하는 정도는 남녀라는 개인적 및 문화적 요인이 따라 달라진다. 예컨대, 더 높은 소득을 올리고 의사 결정이 심리적으로 더 많이 참여하는 파트너가 더 큰 영향을 미칠 수 있다. 가계 재정에 더 많은 수입을 가져오는 것을 영향력 증가의 유일한, 느끼는 참여보다 훨씬 더 영향을 미치는 결정의 동기부여일 수 있다.\n소비자의 성별이 가족 의사 결정에 영향을 미치는 도시는 공통적부(footnote)하다.36 예를 들어, 여자는 다른 생활 규칙의 쫌터 동성 제품의 구매를 자주 주도하지만, 남자는 생명보험, 자동차, 주택 구매와 같은 더 중요한 제품에 관한 결정에 영향을 미친다.37 전통적인 성 역할 지향을 남성 주도의 가족 의사 결정을 더 많이 조화하는 경향이 있다.38 예를 들면, 전통적인 가족에서는 남편이 금융 문제를 더 자주 처리할 책임이 있으며, 이는 그의 모임 지식을 증가시켜 배우자가 더 인정되게 만든다.39 사실, 금융 및 기타 의사 결정 권한은 파트너에게 위임되는 경우가 많다. 다시 말해, 소비자들은 관계의 친밀도의 수준에 따라 위임을 할 거래만수 있다. 어떤 소비자에 비해 최근 세대의 소비자와 산업화된 국가에 살고 있는 사람들은 가족 내 의사 결정과 관련된 전통적인 성 역할 지향이 덜하다.\n전통적인 성 역할 지향은 가족 내 파트너가 의사 결정을 내리는 방식에 영향을 미친다. 멕시코와 중국과 같은 국가에서는 재정 및 소비 선택에 대한 남성 주도 가족 의사 결정이 보고되고 있다. 여성이 노동 시장 기회를 개선하고 맞벌이 가정이 증가함에 따라, 특히 자녀와 함께 여성의 벌 보는 경우를 해소하면서 여성의 소득과 가족 의사 결정에서의 영향력이 증가할 가능성이 있다.41 가정 내의 파트너는 일반적으로 서로의 지식과 의사 결정 전략에 대한 인식이 제한된 비공식적인 역할 구조를 따르며, 마찬가지로 서로의 영향력과 선호도를 명확히 추정하지 못한다.42 예를 들어, 커플은 일반적으로 서로의 영향력과 선호도를 파트너의 관심사와 선호도에 대한 명확성과 공동구용과 결정 및 소비 경험에 접촉을 통해 성장한다.44 현실적인 관계가 오래 지속될 것으로 기대하면 다양한 활동(예 의식, 영화 관람, 휴식 시간, 정치 활동 등)에 참여하여 파트너의 지각이 형성될 수 있다.45 많은 의사 결정 상황에서 파트너가 서로의 선호도를 배우고 타협 방식으로 공동의 행복을 개선하는 데 도움 이 될 수 있다. 예를 들어, 네덜란드에서 1,015쌍의 성별을 대상으로 한 조사에 따르면, 가족 재정에 대해 합의의 의사 결정을 하고 공동 은행 계좌를 가진 파트너가 독립적으로", "source": "20261114_141318.jpg"}, {"kind": "heading", "text": "13-2b 자녀의 역할", "source": "20261114_141322.jpg"}, {"kind": "paragraph", "text": "관리되는 별도의 은행 계좌를 가진 파트너에 비해 재정 문제가 적었다.47 그 이유 중 하나는 공동 은행 계좌에서 돈을 쓰는 파트너가 별도의 은행 계좌에서 돈을 쓰는 파트너에 비해 패각적 제품 대신 실용적 제품을 선택할 가능성이 더 높기 때문이다.48 또한, 배우자가 서로 다른 지출 경향을 가질 때(한 명은 지출가, 한 명은 인색한 경우), 의사 결정은 갈등으로 당황할 수 있으며, 이는 밀레 고난과 만족도를 감소시킨다.49 브랜드 선호도가 다른 배우자는 무엇을 살지에 대한 갈등이 더 많이 겪으며, 이는 체감한 만혼 만족도를 감소시킨다.50\n 파트너는 또한 가족 내 아동들의 소비자로 성장하도록 사회화하는 데 중요한 역할을 한다. 소비자 사회화란 젊은 사람들이 시장에서 소비자로서 기능하는 데 필요한 기술, 지식, 태도를 습득하는 과정을 말한다. 소비자 사회적 행동에 중요한 영향을 미치는 가족 내 보호자의 사회화 방식이다. 보호자의 사회 계층에 따라, 덜리 악 있는(체리와 자상하지만 따뜻한) 사회화 방식이 관대함, 허용성, 또는 국민주의적인 사회화 방식에 비해 평정적인 시장 장조성과 상미비 과열됨, 도번, 가행, 부족한 사용, 매입 현상, 매입 없는 신체 형태에 대한 느낌, 성공적으로 재판하는 아이들은 부모는 더 열극적일 수 있다.51 특별한 날의 공동 의사 식사, 함께 영화 보기, 집 꾸미기, 놀 물 노래 즐기기를 기획할 수 있다. 이와 같이 즐길만하고 공동 경험에 대한 느낌을 참여하도록 함으로써 소비자의 긍정적인 영향을 미친다.53\n 13-2b 자녀의 역할\n 자녀는 자신의 의사 결정을 내릴 때와 보호자의 획득 및 소비 행동에 영향을 미치려 시도함으로써 가족 의사 결정에서 중요한 역할을 한다. 이런 과정에서 자녀는 가족 자원 활용은 보호자가 가족 내에서 행하여 왔다는 것을 서로 만지기 때문이다. 자녀는 때로는 모르기 파괴한다고 한다. 요즘의 미디어 인플루언서 또는 다른 자녀들이 가지고 있기 때문에 특정 아이템을 끊임없이 요청하는 경험을 의미한다.54 이러한 시도에 성공은 제공하는 것의 유형, 보호자의 특성, 자녀의 나이 및 의사 결정 단계에 따라 달라진다.55 자녀는 시럽, 간식, 장용품, 게임기와 같은 자녀 관련 제품 분야에서 특히 더 많은 영향을 미치려 한다(그림 13-5 참조). 고학 군은 어린 자녀들로 동일한 역할을 하고 있다.57\n 가족 의사 결정에서 점점 더 많은 역할을 하고 있다.57\n 보호자가 의사 결정 과정에 덜 많이 관여하거나 더 전통적인 경우 자녀는 덜 영향을 미치는 경향이 있다. 반면, 일하는 부모와 독신 부모는 시간 압력이 더 많기 때문에 더 쉽게 굴복할 가능성이 높다.58 자녀가 더 나이가 많고 독립적일수록 더 많은 영향을 미친다.59 그러니 모든 구성원이 소비하는 새로운 제품을 구매하고 소비하는 결정에 대해서는 언제히 보호자가 가장 큰 영향을 미친다.60 하지만 통제가 시간이 줄어들 때마다 증가할 수 있다고 믿는 부모는 자녀가 자기 통제를 형성시킬 수 있는 구매 결정을 내리는 경향이 있는 반면, 물질주의적 가치를 지닌 부모는 자녀에게 그러한 가치를 키울 수 있다.62", "source": "20261114_141322.jpg"}, {"kind": "heading", "text": "13-3 사회계층", "source": "20261114_141328.jpg"}, {"kind": "paragraph", "text": "사회화는 보호자가 자녀에게 건강한 음식과 불건강한 음식과 관련된 소비 결정을 가르치는 과정이며, 자녀는 온라인 미디어에서 얻은 지식을 포함한 공유수단을 통해 보호자를 가르치기도 한다. 예를 들어, 정치·생활방광이63 상품 결정덕에서는 자녀가 보호자에게 미치는 영향이 적다. 청소년들은 자기 결절(력)을64 (강화함과) (제품의) 선호도에 관한 정보의 유출대해기 유사용하게 감정을 사용하여 위험을 인식하게 되는 반면, 고령의(결정 의) 성인들은 선행된 경험에 의사 결정에 영향을 미친다. 또한, 보호자들은 자녀에게 같은 전략을 사용할 수 있는데, 예를 들면, (보상과) 관계(위계권력(관력), 지지적(부모의 권위) 전략을 사용할 수 있다. 가족 유형에 따라 자녀의 영향력의 성격이 달라진다. 권위주의식의 가정에서 자녀가 가진 민주적인 가정을 자기 표현을 억압당한 자녀는 의사 결정을 거의 이하지 못한다.65 반면, 민주적이거나 관용적 가정은 의사 결정에 참여하게 한다. 마치 자율적인 결정을 내려 수 있게 한다.66 또한, 아버지는 아들보다 딸 또는 딸보다 아들에 미치고 자율적인 결정을 내릴 수 있게 한다.66 또한, 아버지는 아들보다 딸 또는 딸보다 아들에 미치고 부의사성과 정적으로 많은 더 선호할 수 있으며, 아버지는 아들도 딸과는 동일시하지 않는다. 부모가 일시화고 부의사체적으로 많은 더 선호할 수 있으며, 아버지는 아들도 딸과는 동일시하지 않는다. 부모가 일시화고 부의사체적으로 많은 더 선호할 수 있으며, 아버지는 아들도 딸과는 동일시하지 않는다. 또한, 자녀의 영향력은 의사 결정 과정의 각 단계에서 다르게 나타난다. 전체의사 과정, 선택, 구매, 구매 단계에서는 여러 가지 문제 인식과 정보 검색 단계에서의 영향력이지만, 구매 단계에서는 크게 감소한다.68\n 13-3 사회계층 대부분의 사회는 일부 계층의 사람들이 다른 계층의 사람들보다 높은 지위를 갖는 사회 계층(social class hierarchy) 구조를 가지고 있다. 이러한 사회계층은 부, 행동 및 생활 방식이 다른 계층의 구성원들과 다른 식별 가능한 개인 그룹으로 구성되어, 특정 사회에서 구성원들은 유사한 가치관과 행동 패턴을 공유하는 경향이 있다. 사회계층은 강한 경제성을 가진 공", "source": "20261114_141328.jpg"}, {"kind": "heading", "text": "13-3a 사회계층 시스템의 유형", "source": "20261114_141332.jpg"}, {"kind": "paragraph", "text": "시적인 그룹이 아닌, 유사한 삶의 경험을 가진 개인들이 도출될 수 있는 유일한 범주라는 점에 주목해야 한다.73 그럼에도 불구하고, 사람들은 특정 사회계층에 속하는 사람들의 공통된 삶의 양식에 대해 이야기하곤 한다. 라이트는 특정 사회계층의 범주들이 임금과 관련된 특정 효과들이라고 말한다. 어느 정도 사상, 리델리 등을 인용해 일부 지배계급은 특정 사회계층의 하위 단계에 있는 사람들에 비해 더 많은 공적 생활, 취향, 생활양식 등을 가질 수 있으며, 높은 사회 계층은 대개 상층에 속한 사람들끼리 친구 관계를 형성한다는 점에서 계층의 차이를 나타낼 수 있으며, 그 결과 경쟁적이거나 갈등적 관계가 생길 수 있다는 점을 지적하였다.\n또한, 사회는 모든 사람이 사회가 원활하게 기능하도록 해주는 역할을 해야 한다고 인식하기 때문에 이러한 계층 구분은 중요하게 여겨진다. 그러나 의사나 변호사, 교사, 행정가, 공무원 등 특정 계층에 속하는 사람들은 다른 사람들에 비해 더 ‘중요한’ 일을 담당한다고 생각되기도 한다. 그럼에도 불구하고 계층의 개념은 본질적으로 불평등의 개념인 것은 아니다. 오히려 계층에 속한 사람들이 있고, 사회계층에 속한 사람들은 사회에서 각자의 역할이 무엇이며 어느 지위로 올라가야만 하는지를 결정하는 데 도움을 줄 수 있다. 또한, 모든 수준의 사회계층은 사회에 중요한 기여를 한다.\n- 대부분의 사회에는 상류층, 중류층, 하류층의 세 가지 주요 계층이 존재하지만 흔히 좀 더 세밀한 구분을 한다. 예를 들어, 사회학자 데니스 길버트는 그림 13-6(에) 나와 있듯이 미국", "source": "20261114_141332.jpg"}, {"kind": "heading", "text": "13-3b 사회계층의 영향", "source": "20261114_141338.jpg"}, {"kind": "paragraph", "text": "에서 여섯 개의 계층을 구별하고 있으며,전체 인구의 최대 52%가 중산층에 집중되어 있다.75 대부분의 사회는 계층 구조를 가지고 있지만, 계층의 크기와 구성은 특정 국가의 상대적 번영에 따라 달라진다. 미국과 비교할 때, 일본과 스칸디나비아는 중산층의 크기가 더 크다. 이 분포는 이 두 나라가 다른 사회보다 사람들 사이의 평등이 잘 이루어지는 것을 의미한다. 라틴아메리카의 많은 사회계층 시스템은 왜곡되고 모든 사회계층의 사람들을 혼합하려는 정부의 노력의 결과를 나타낸다.76 그러나 매우 경쟁적이고 선택적인 일본 교육 시스템은 여전히 높은 수준의 기회 및 정부 직원으로의 진입을 제한한다. 라틴아메리카와 인도와 같은 신흥 경제국에서는 특히 능력이 가장 큰 비중을 차지한다(그림 13-7 참조).\n 대부분의 사회에서 상류층은 더 국제적이고 세계적인 성향을 띠는 경향이 있기 때문에, 상류층은 자국 내 다른 계층보다 서로 더 유사하다. 반면, 하류층은 문화에 더 특화되어 있고 생활 방식, 복장, 식습관 및 건강 행동 측면에서 다른 계층과 확연히 다르다. 중산층은 상향적인 사회적 이동성을 달성하기 위해 다른 계층에서 차용하는 경향이 가장 크다.\n 사회계층 구조는 소비자의 규범, 가치관, 행동, 만족도 및 건강에 영향을 미치며, 이는 문화마다 다를 수 있다77 사회계층의 구성원들은, 예를 들어, 소셜 미디어를 습득하는 중요한 동기적 이유는 정지것으로 상호작용한다. 따라서 사람들은 다른 사회계층의 사람들보다 자신이 속한 사회계층 구성원들에게 더 많은 영향을 받는 경향이 있다. 이러한 방식으로, 사회계층의", "source": "20261114_141338.jpg"}, {"kind": "paragraph", "text": "영향은 유사한 삶의 경험을 가진 사람들이 유사한 생활 방식과 행동을 보이는 경향이 있음을 반영한다.\n 사회계층의 영향력은 계층을 넘어서 작용할 수도 있다. 예를 들면, 중산층 구성원들은 음악, 예술, 문학과 같은 문화적 문맥에 대해 상류층 구성원들을 관찰하며 지침을 얻을 수 있 다. 그들은 사회적 지위, 존경, 인정을 얻기 위해 상류층의 브랜드, 제품, 서비스, 더 일반적인 소비 관행을 채택할 수 있다. H&amp;M, 쉬인(Shein), 자라(Zara)와 같은 패스트 패션 체인과 브랜드는 고가의 고급 패션 브랜드의 트렌드를 해석해 저렴한 가격으로 복제하여 옷입기의 과정을 유권한다.\n이러한 관행은 적응된 제품과 스타일이 더 많은 사람들에게 가까워질 때 지식재산권과 저작권 을 침해할 수 있다.7 후에 계층에 속하게 계층으로, 제목, 제품, 서비스, 더 일반적인 소비 습관을 트리클다운 소비(trickle-down consumption)라고 한다. 반면, 하위 계층에서 상위 계층 으로 제목, 서비스, 브랜드가 이동하는 경우를 트리클업 소비(trickle-up consumption) 소비, 가 능 하면 트리클다운 소비에 대항한다. 하위 계층은 콘크리트 소비자이며, 그들의 불규칙 노동조동 위험 텍스처, 장비자, 불편한 삶의 현재 계층 계열 잔비에 그것 사용되는 다양한 종류의 스트리트웨어(streetwear)를 있다. 트렌드는 거리에 기반으로, 구찌(Gucci) 등의 럭셔리 아터스 트 와 패션 런웨이, 백화점에서 제품을 판매하는 인플루언서에 의해 해석되고 복제된다. 심지어 는 발렌시아가(Balenciaga)와 같은 럭셔리 패션 브랜드가, 1850년의 한창현 청바지에서 다소 트레스드(distressed) 소비자들을 재해석한 한 단계 더 나아가다.8 오늘날, 제품, 서비스는 또한 일찍 즉각적으로 모든 소비자에게 제공될 수 있으며, 이를 트리클크로스 소비(trickle-across) 라 한다. 편집자들인 자라와 H&amp;M은 각각 일본 디자이너 가쿠레가드의 카우스 등이와 컬렉션은 Kawakubo와의 협력으로 저렴한 고정지만, 합리적인 패션을 만들어낸다.\n 이 모든 것은 소비 모방에 의해, 사회계층 구성원들의 취향을 결정되에 나타난 계층이 브랜드, 제품, 서비스를 채택하거나 중단하는, 계층에서 계층으로 이동하는 것을 말한다. 그러나 사회계층 구성 원들이 다른 계층의 상징을 모방하고 구성함으로써 자신을 구별하고자 자신의 개인적 가치 형성 정 체를 확인할 수 있다. 이는 스트리트웨어의 기원이도.9 이는 단지 사회계층 구조 전체를 재 설정한 트리클 업 및 트리클 어크로스 소비 과정을 자극할 수 있다.8,9\n 13-3c 사회계층의 결정 방법\n 사회계층이 소비자 행동에 어떻게 영향을 미치는지 조사하려면 소비자를 다양한 사회 계층으로 분류하는 방법이 필요하다. 사람들의 소득, 교육, 직업이 함께 사회계층을 결정한다.\n따라서 현대 관리사회와 이전의 공공 지원 근로자보다 더 높은 지위를 가지고 있는 것처럼 더 높은 소득, 교육 수준, 직업의 지위는 상류층의 구성원이 되는 데 기여하지만, 이는 일대일 방 식으로 이루어지진 않는다.\n 소득과 사회계층 여러 가지 이유로 소득은 사회계층과 약하게 관련되어 있다.84 첫째, 소득 수준은 특히 중산층 하위층에서 사회계층 중동 절친다. 예를 들면, 많은 미국의 불균일한 노동자는", "source": "20261114_141341.jpg"}, {"kind": "paragraph", "text": "일부 화이트칼라 노동자보다 더 높은 소득을 가지지만, 더 높은 사회적 지위를 가지지는 않는다. 둘째, 소득은 나이가 들수록 크게 증가하지만, 나이가 든 노동자가 자동으로 더 높은 사회적 지위를 얻는 것은 아니다. 마지막으로, 맞벌이 가구는 평균 이상의 소득을 발생시킬 수 있지만, 반드시 더 높은 지위를 얻는 것은 아니다. 따라서 소득이 사회계층과 관련된 한 요인이지만, 다른 요인들도 중요한 역할을 한다.\n소득과 사회계층은 다양한 상황에서의 소비자 행동을 설명한다.85 사회계층은 생활 방식과 가치를 반영하고 높은 금전적 지출을 수반하지 않은 소비, 예를 들면, 옷차림 가구를 통해 소비를 달리 연출할 수 있다. 예를 들면, 대부분 부자가 아닌 사람들일지라도 보다 비싼 가구를 선호하지만, 중산층 소비자는 두 계층의 소비자 소득이 대략 비슷할 때에도 가장 값싼 구급 응급용품을 구매할 것이다. 포목업 판매원(Procter &amp; Gamble)은 중국에서 중산층 소비자가 저렴하게 가격이 책정된 중급 샴푸와 기저귀 대신 일본 경쟁 업체가 만든 고가의 프리미엄 기저귀 브랜드를 선호한다는 것을 발견했다.87\n 소득이 항상 사회계층을 설명할 수는 없지만, 사회계층은 종종 소득이 어떻게 사용되는지를 설명하는 데 이로울 수 있다. 예를 들면, 상품과 서비스 구입하는 데 투자한 ‘관심’이 더 크다. 반면, 특정 은행들이 적극 계층에 이웃한 가능성이 더 적기 때문에, 중간 정도 사회계층의 소비자 행동을 이해하는 데 도움을 주며, 사회적 지위는 소득 외에도 다양한 요인에 의해 결정된다는 것이다.\n 직업과 교육\n 직업은 소득의 주요 결정 요인이지만, 서구 문화에서 특히 사회계층에 직접적인 영향을 미친다. 일부 직업, 특히 더 높은 수준의 교묘, 기술 또는 훈련이 필요한 전문화와 직업의 인종별 및 외교와 연관이 없는 직업(예: 마트사업가나 청소부)은 낮은 지위를 가진 것으로 간주된다.\n 교육은 직업 수준과 소득의 주요 결정 요인일 뿐 아니라, 다른 사회규범의 전달에 영향을 미친다. 실제로, 교육 수준은 소비자의 소득 잠재력과 소비 패턴을 예측하는 신뢰할 수 있는 기준으로 정의 있을 수 있다. 또한 교육 수준의 증가는 소비자의 행동에 영향을 미친다.\n예를 들면, 2021년 미국 고등학교 졸업자의 경우 중졸 소득은 80%였던반면, 대학 졸업자의 중등 중위 소득은 약 50% 더 높았다.88 13장[참조하라]그림 13-8 학생이 고학력 소비자는 더 많은 소득을 벌 뿐만 아니라 더 많이 읽고 여행하며, 더 건강하고 조직화된 새로운 제품들에 더 개방적이다.90 고등교육은 또한 더 높은 지위의 직업에 진입하는 데 중요하다.\n 사회계층의 다른 지표\n 거주 지역, 소유물, 가족 배경, 사회적 상호작용과 같은 요인도 계층 수준을 나타낼 수 있다. 소비자가 사는 동네와 소유한 소유물의 수와 종류는 계층의 위치와 상태를 반영하는 가시적인 신호이다. 이러한 지위는 종성 부모로부터 자녀에게 전이될 수 있으며 이를 상속 지위(inherited status)라고 한다. 또한, 개인이 성취를 통해 나중에 취득할 수도 있으며 이를 획득 지위(earned status)라고 한다.91 상속 지위는 가치가 하락되고 상황 또는 심한 이동이 발생", "source": "20261114_141347.jpg"}, {"kind": "heading", "text": "13장 가족 및 사회계층의 영향", "source": "20261114_141349.jpg"}, {"kind": "paragraph", "text": "할 수 있는 초기 기준점이다. 사회계층의 구성원들은 공통 서클 상징과 용*하기 때문에, 사람들은 이유와는 상관없이 선호하는 것이 더 흔하다는 것이다. 또한 사람들은 자신이 이룰 수 있으리라고 믿 사회를 많이 사용하는 것이 많은 사람들보다 더 도움이 된다. 사회적 지위 위협(status threat), 즉 하향 사회 이동에 대한 위협을 겪는 소비자는 스포츠, 음악과 관련된 기존 중상위계층의 성취와 같은 다른 분야에서 자신의 성취와 성공을 과시함으로써 이를 보상할 수 있다.92\n 사회계층 지수 누군가의 사회계층 지위를 결정하기 위해서는 앞서 언급한 듯한 요소를 고려해야 한다.\n사회학자들은 이들을 수행하기 위해 특정 지수를 개발했다. 이러한 지수는 소비자이 직무 수준, 수 입 수준, 교육 수준, 인지된 지위, 부, 신용도, 거주 지역을 경험적 분석을 통해 결정한 특정 중요성에서 지위(socioeconomic status, ses) 수준을 산출하고, 이를 세 개 이상의 계층으로 범주 설정한 점수 평 있는 소비자의 위치로 분류한다.93 사회경제적 지위 지표에서 일반적인 공식을 따르는 소비자 에게는 지위 결정화(status crystallization)가 발생한다. 예를 들어, 한 사람이 박사학위를 가지면 대기업에 고용되어 있으며 수입도 높다. 그러나 다른 사람은 학력 수준은 높은 반면, 수입 수준은 중 반을 형성하고, 집이나 소유 주택도 갖고 있지 않을 수 있다. 이러한 사람을 지위 불균형 상태라고 한 다. 도시의 고급 동네에 사는 사람들의 평균 평점보다 높으면 고위 계층에, 평균보다 낮으면 하위 계층 사는 낮고 다른 지표에서는 높을 수도 있다. 개인도 있다. 따라서 도심 지역 출신의 새 이사는 직업과 소 득과 같은 지표에서 일관되지 않을 수 있다. 마케터에게는 이러한 소비자를 적절한 제안과 메 시지로 표적하는 것이 도전 과제다.\n 13-3d 사회계층의 변화 사회계층 구조는 (1) 상향 이동, (2) 하향 이동, (3) 사회계층 붕괴로 인해 시간이 지남에 따라 변화한다.\n 상향적 이동 상향적 이동(upward mobility)은 소비자가 개인의 교육 또는 직업 성취를 통해 부모보다 더 높은 지위 수준으로 올라갈 때 발생한다. 이 이동은 부모와 자녀 세대 간의 이동이기 때", "source": "20261114_141349.jpg"}, {"kind": "heading", "text": "세대 간 상향 이동", "source": "20261114_141354.jpg"}, {"kind": "paragraph", "text": "세대 간 상향 이동(intergenerational upward mobility)이라고도 한다. 이러한 유형의 이동에서는 학부모 또는 중산층 개인이 특히 대학교육과 같은 교육 기회를 활용하여 더 높은 지위의 직업에 진입한다.\n 상향적 이동은 도전적이며, 빈곤층 가정에서 온 미국 대학 졸업자의 비율은 수십 년 동안 낮은 상태로 유지되어 왔으며, 어느 대학 학비를 감당하는 대학등록금의 경제성은 중간 시기에까지 대학 생활을 통해 중류·중산층 간의 격차를 해소하는 어려움을 반영한다고 할 수 있다. 그럼에도 불구하고 해석상 상향 이동이 증가하고 있다는 것은 아니다. 부모가 대학 학위가 없는 대학 졸업자는 소득과 재산에서 동질화된다는 경향이 있다.95 경우에 따라, 상향적 이동은 전반적인 지위의 변화를 의미한다. 사회적 지위가 개인이 의도한 지위를 달성한 가능성과 매우 긴도 중요해 보이는 자아의 자유를 유지한다. 사회의 상향 이동으로 말해 보았을 때, 하위 계층의 확대는 개인의 열망, 사람들의 지배층 수준에 의해 크게 영향을 받을 수 있다. 이는 사람들이 지각한 사회 계층을 반영한 행동이 통계적 학습되기 때문이다.96\n 소비자는 다른 소비자와의 사회적 관계에서 자신의 사회적 지위나 사회경제적 지위를 의식한다. 이를 주관적 사회적 지위(subjective social status, SSS)라고도 한다. 주관적 사회적 지위는 사람들이 특정 사회집단에 대한 자기 인식이다. 예를 들면, 주관적 사회적 지위는 소비자 자신이 중산층인지 아닌지의 인식과 관련이 있다. 예를 들면, 인도에서는 '네오-미들(newo-middle)'이라는 중산층이 되기를 꿈꾸는 빈곤층을 매우 중요한 소비자 계층으로 인식할 때도 있으나, 미국에서는 농후층과 하류층의 사람들이 자신의 중산층의 구성원으로 인식하는 것과 자연스럽다.97 소비자가 현재 인식하거나 이전에 자신의 신분을 기억하는 주관적 사회적 지위는 소비 행동에 매우 영향을 미친다. 예를 들어, 한 연구에서 수입이 최저인 집단에 낮은 사회경제적 환경에서 자랐다고 인식한 사람들은, 수입이 가장 높은 집단에 있는 또 다른 비교적 높은 상류층 환경의 음식은 소비할 뿐만, 높은 사회경제적 환경에서 자랐다고 인식한 사람들은, 평범히 에너지가 필요가 적은 음식을 선택했다는 연구도 소개되었다.98\n 다른 한편으로는, 소비자가 불리한 사회경제적 환경에서 자랐다고 기억하는 사람들은 도달할 수 없는, 높은 선택할 옵션을 포기하는 데에 더 익숙하다고 믿으며, 이는 외적인 충동이 오래 걸린 찾아가는 데 예측된다.99 반면, 낮은 사회경제적 환경에서 자랐다고 기억하는 사람은 자기규제를 할 때 더욱 더 잘 적용할 수 있는데, 이는 어릴 때부터 이러한 상황에 대처하는 방법을 배웠기 때문이다.102\n 주관적 사회적 지위(SSS)와 사회경제적 지위(SES)(예: 소득, 직업, 교육)와의 관계와 측정은 구변하는 것이 중요하다. 이는 소비자 행동, 열망, 건강 및 기타 결과에 매우 다른 영향을 미칠 수 있기 때문이다.103\n 일반적으로 신흥시장은 국가는 상향 이동의 기회를 가장 많이 제공하지만, 대다 및 장기 거시경제 동향도 중요한 역할을 한다. 경기 침체와 장기 합락 경제 동향 동안에는 상향 이동의 기회가 줄어든다.104 많은 신흥 경제국에서 중산층의 규모가 빠르게 증가하고 있는데, 이는 국제 무역에 저렴한 상품을 많이 이용할 수 있게 하고, 반면에 가구가 더 많은 소득을 벌며, 성장을 지원한 경제학 범위에 더 많은 전문가가 필요하기 때문이다. 현재 신흥 시장에는 약 6억 7,900만 중산층 가구가 있으며, 2030년까지 2.7% 증가할 것으로 예상된다.105", "source": "20261114_141354.jpg"}, {"kind": "heading", "text": "하향적 이동", "source": "20261114_141356.jpg"}, {"kind": "paragraph", "text": "하향적 이동(downward mobility)은 소비자들이 부모 세대보다 낮은 사회계층으로 이동하는 것을 말한다. 과거 30년 동안에 수백만 미국의 가정들은 업무의 해외 이전, 기술 발달로 인한 업무의 불필요, 기업의 임금 삭감 또는 노동자 해고에 따라 하향적으로 이동했으며 부모 세대의 지위 수준에 도달하는 데 어려움을 겪는 자녀들은 거위 공황(status panic)을 경험할 수 있다. 뿐만 아니라 다른 곳에서 경제적 불확실성이 증가하고 비용이 상승하면서 매달 중산층 가정의 생활 수준을 유지하거나 대학, 은퇴, 비상 상황을 대비해 돈을 저축하는 것이 어려워질 수 있다.108\n 하향적 이동은 삶과 희망을 옮겨야만 한다. 때로는 획득과 소비가 자신의 가치를 지키는 데 도움이 되지 않는다. 떠들썩한 파티, 새로운 옷이나 전자제품을 구매하여 스스로를 기분 좋게 만들 수 있다. 하지만 하향적 이동은 자동차 집과 같은 주요 소유물 중심의 생활을 전반적으로 구매행동 전반에 수동적인 소비 습속으로 이어질 수 있다.\n 사회계층의 붕괴\n 전통적인 사회계층 구분은 일부 산업화된 국가에서 사라지고 있으며, 이러한 현상을 사회계층의 붕괴(social class fragmentation)라고 부른다.109 이 현상에는 여러 가지 이유가 있다. 첫째, 사회적 이동 및 이주가 특정 평균을 갖고 있는 인구를 분리시킨다. 둘째, TV와 인터넷과 같은 대중매체 보급이 증가하면서 전 세계 소비자들이 다양한 계층 문화의 가치를 구별 없이 노출되었고, 일부 사람들은 다른 그룹의 행동 요소를 채택하게 되었다. 셋째, 통신 기술의 발전으로 사회계층 간 상호작용이 증가했다. 이러한 요인들은 다양한 계층의 생활 형태를 규정했던 전통적 소비 습관의 중요성을 줄어들게 했다. 미국에는 여전히 이교의 열린 계층(대부분 가정에서 빈곤집(빈곤), 한두루 가정에 이르기까지 수십 개의 계층) 존재한다. 14장에서 이 주제로 다시 돌아갈 것이다.\n 13-4 사회계층이 어떻게 소비에 영향을 미치는가\n 사회계층은 소비자의 취득, 소비, 처분 행동에 영향을 미친다. 이 절에서는 (1) 과시적 소비와 지발적 단순성, (2) 지위 상징, (3) 보상적 소비, (4) 돈의 의미라는 네 가지 주요 주제를 살펴본다.\n 13-4a 과시적 소비와 자발적 단순성\n 과시적 소비(conspicuous consumption)는 사회계층과 관련이 있다. 이는 보통 자신의 높은 사회계층을 신호하려는 시도이며, 지위 소비의 외적 표시에서 주목된다. 실제로 현대의 소비자들은 부유함을 성취하려는 시도이다.110 과시적인 소비를 특정 요소가 없애야 그런 메시지가 전달될 수 있다. 하는 메시지 때문에 중요하다.” 이러한 영역에 대해 결절된다. 결과, 선택 의류나 고급 재화가 같은 품격적인 과시적 소비는 가능하다. 독특하면서 완전히 튀어야 하는 않아야 한다.” 과시의 지역의 수준 간의 구분이 적은 사회에서도, 과시적 소비는 낮은 지위의 소비자들이 상위적으로 정형", "source": "20261114_141356.jpg"}, {"kind": "heading", "text": "13-4b 지위 상징과 타인에 대한 평가", "source": "20261114_141401.jpg"}, {"kind": "paragraph", "text": "하고 소비를 눌러 이웃과의 경쟁에서 앞서나가려는 욕구를 자극할 수 있다.113\n 공개적으로 돈을 기부하는 것, 특히 큰 금액을 기부하는 것도 과시적 소비나 과시적 자 비(conspicuous compassion)의 형태로 간주될 수 있으며, 이는 자신의 미덕을 신호하려는 행 동이다.114 어느 개인과 브랜드가 일련의 관련 마케팅(cause-related marketing) 프로그램에는 점점 더 많이 참여하고 있다. 예를 들어, 버버리는 한 매장에서 구입하는 고객에게 일정 금액을 자선단체에 기부하겠 다고 약속하고 이를 소셜 미디어를 통해 알릴 수 있다.115\n 또한, 소비자들은 과시적 낭비(conspicuous waste)에 참여할 수 있다. 예를 들어, 부유한 사 람들은 결코 사용하지 않는 집이나 아무도 운전하지 않는 과시용 골프 카트를 구입할 수 있다.116 반면, 일부 소비자들은 과시적 소비에서 벗어나 자발적 단순화(voluntary simplicity)로 이동하여, 물 질적이지만 친환경적인 생활 방식을 위해 의식적으로 물질소비를 줄이려고 한다.117\n 사람들은 종종 타인이 소유하고 소비하는 것에 근거하여 이들을 평가하며, 이러한 과시 적 소비는 이러한 평가를 돕는다. 상품, 서비스 또는 브랜드는 소비자의 높은, 어쩌면 엘리트 위치를 나타내는 바로 지위 상징(status symbol)이 된다. 예를 들어, 예거 르쿨트르(Jaeger-LeCoultre) 시 계나 재규어 F-타입(Jaguar F-Type) 자동차를 소유한 사람은 상류층으로 간주될 가능성이 높다.\n지위 상징은 소비자의 사회적 계급이나 최고의 시기 브랜드 중 하나로, 모든 시계는 1833년부터 스위스 의 작은 산악 마을에서 개발, 제작, 조립되며 두 개의 기계 공장 중 하나에서 생산될 수 있는 따라서 지위 신호를 보내는 반면, 다른 브랜드는 매우 독특한 특성을 함유하여 어느 사회집단에 하여 공개적으로 신호를 보낸다.118 소비자들은 종종 매장의 공간 구성 및 매장 고객의 고급 의 사회계층을 추론한다. 매장의 럭셔리 분위기를 보면서, 소비자들은 그 매장의 고객이 높은 사 회계층소속이라고 가정하며, 이 가맹점에 갈수록 해당 고객의 경험을 간접적으로 체험하는 자신 들의 사회계층 수준에 대한 평가를 조정한다.119 타인의 지위 상징과 그들이 구매하는 제품의 가 치뿐 아니라 그들이 소유한 상품과 동일한 것의 소유를 통해 그 사회적 지위에 도달하고자 노력 하려는 욕구는 일부 및 소비 욕망을 설명할 수 있다. 그림 13-9는 안부배뉴Rendez-Vous 라인의 예거 르쿨트르 시계의 예이다. 이 시계는 사파이어 케 이스백과 자동 움직임을 포함하며, 낮과 밤 또는 달 문의도 표 시기가 있다. 여자의 1833년의 예거 르쿨트르(Andre LeCoultre) 가 첫 시계를 만든 스위스의 같은 계곡에서 수작업으로 제 들도진다. 이 특정 시계는 18캐럿 로즈 골드로 제작되었으며, 악어 밴드와 다이아몬드로 둘러싸인 시계 테두리와 다이얼이 있다.\n다. 이 시계의 가격은 29,000유로, 즉 32,558달러였다. 소비자 들은 자신의 사회계층 구성원들과 어울리고자 이런 고급 명품 물품을 획득함으로써 사회계층을 높일 수 있다. 일부 소비자 라 브라질, 인도네시아 및 멕시코와 같은 여러 신흥 시장에서, 소 사회의 성인이지만 중산층 상징이 되었다.120 은 이러한 욕망 같은 자신의 미래의 사회적 상징인 자동차, 시계, 옷 또는 명품 가문 호를 보고 소비를 계획한다.12 각종 매장의 분위기를 바꾸기로 할 수 있다.\n다. 20대부터 고급 미니투어나 가장 저렴한 베르세스", "source": "20261114_141401.jpg"}, {"kind": "heading", "text": "13-4c 보상적 소비 / 13-4d 돈의 의미", "source": "20261114_141404.jpg"}, {"kind": "paragraph", "text": "(Mercedes) 자동차처럼 “비교적 저렴한 사치품조차도 몇 번의 한 소비자들이 더 높은 수준의 품질, 취향 및 열망으로 업그레이드할 수 있게 해 준다”고 보스턴 컨설팅 그룹의 전문가들은 말한다. “이들은 경계가 불안정할 때에도 판매가 계속되는 사치품으로, 매우 강력한 감정적 효용을 제공한다.”122 흥미롭게도, 지위 상징을 나타내는 반대 방향으로 움직이기도 하는데, 이를 패러디 디스플레이(parody display)라고 한다.123 발렌시아가(Balenciaga)의 1850달러의 트리플 에스(Triple S, Tripie S) 운동화는 엔티르를 대상으로 이러한 예이다. 또한 특정 패션 감성이 널리 보편화되면, 그 지위 의미를 갖지 못하는 위장된 지위 상징(fraudulent symbol)이 될 수 있다. 최근 보편적 공중 주류가까지 다량 생산된 코치(Coach) 브랜드의 핸드백은 더 이상 일부 계층의 사람들에게 지위 상징으로 여겨지지 않으며, 지위 상징으로 나타내는 역할이 없다. 이에 코치는 더 고급 더 미묘하게 디자인하여 제품을 재설계했다. 코치의 디자이너는 새로운 제품이 확실히 고급화업무에 있다는 코치, 코치로 의지와 인정을 받았다고 언급했다. 동시에, 코치는 브랜드의 지위 상징 이미지를 강화하기 위해 새로운 고가의 제품을 도입했다.124\n 13-4c 보상적 소비\n 보상적 소비(compensatory consumption) 행동은 사회계층과 관련이 있으며, 열광이나 자존감 부족을 보완하기 위해 소비자들이 저축의 행위를 가리키는 신드롬이다. 저위 계층 소비자는 경제적인 제약으로부터 어려움을 겪고 있는 소비자들은 고급 자동차, 명품 브랜드와 같은 지위 상징을 구매함으로써 이를 보상하려고 할 수 있다. 소비자가 이러한 보상적 소비행동을 할 때는 그들이 자신이 불리한 위치에 있다는 인식을 가지고 있기 때문이다. 예를 들어, 상류 계층 소비자는 하위 계층 소비자들과의 차별화를 원한다. 반면에 하위 계층 소비자는 상류 계층에 도달하고 싶은 욕구가 있을 수 있다. 중간 계층 소비자들은 위아래 계층을 분리하여 표시하며 소득 수준이 높은 사람들이 생활방식을 모방하고자 하는 동기를 가지고 있다. 따라서 중간 및 저위 계층 소비자들은 이러한 고급 상품을 구매함으로써 상위 계층 소비를 나타낸다. 그러나 코클리누는 불부분가 있는 논문에서 저위 계층의 일부 소비자들은 계층 상승 헤드보다는 자신들의 현재 산상적 행동을 보이고 있다. 이러한 소비자들은 중상 및 상위 중산층 브랜드(예: 케이트 로라, 구찌(Gucci), 메르세데스(Mercedes), BMW와 같은 회사들은 여러 개의 라인업과 더 저렴한 제품을 제공하면서 전체 브랜드의 지위 이미지를 유지하고 회사의 수익을 떨어뜨리지 않고 있다.127 이는 브랜드의 계층 포지셔닝 내에는 새로운 라인을 추가하여 하는 하부 수준 브랜드 라인 확장의 예이다. 예를 들어, 메르세데스는 자사의 반입선을 확장하여, 성공적인 메르세데스 A-클래스의 경우처럼 수익성이 있을 수 있지만, 브랜드가 지위 매력 등을 위협이 있다.128\n 13-4d 돈의 의미\n 돈의 의미는 사회계층을 이해하는 데 핵심적인 요소이다. 가장 기본적인 수준에서 경제학자들은 돈을 교환 수단이나 자금 기준으로 정의한다. 이러한 관점에서 돈은 매우 기능적이고 실용적인 목적으로 충족한다. 즉, 돈은 사람들의 일상 생활에 필요한 상품과 물품을 획득할 수 있게 하고, 사물의 가치를 정량화하고, 저축을 촉진을 한다. 그러나 돈은 또한 사회문화적 의미를 지니고 있어, 돈은 안전, 권력, 사랑, 자유를 상징한다.129 소비자들은 어린 시절부터 돈의 의미를 배운다. 부모는 돈을 기반으로 보상과 처벌을 주거나 구매 여부를 통해 자녀를 통제할 수 있다는", "source": "20261114_141404.jpg"}, {"kind": "paragraph", "text": "것을 쉽게 발견한다. 아이들은 자신이 착하게 행동하거나, 좋은 성적을 받거나, 집안일을 하면 부모가 보상은 사주는 것을 배운다. 이러한 조기 학습은 나중에 어른이 되어도 이어지며, 돈은 행복과 성취뿐만 아니라 지위와 평상도 가져다 주는 것으로 여겨지게 된다. 돈은 벌고자 하는 강한 욕구와 열망을 만들어내기며, 이는 성공한 사람들에 대한 언론 보도와 ‘그 일에 나에게도 일어날 수 있다’는 믿음에 의해 강화된다. 믿음은 우리 모두가 안고 있는 이유 중 하나이며, 잠재적인 사회적 이동 수단으로 여겨진다. 소비자들은 자신이 가진 돈에 대해 심리적 소유감을 느낄 수 있다. 이는 경제적 여유가 생기기 힘든 이유로 저축을 지양하게 되는 또 다른 요인으로 이어질 수 있다.130 소비 패턴을 이해하기 위해 마케터들은 돈과 그것이 상징하는 바를 이해해야 한다. 돈은 소비자들이 사회계층을 나타내는 지위 물건을 획득하거나, 제품 구입을 통해 더 높은 계층으로 올라갈 수 있게 한다. 신용카드와 직불카드는 사용이 용이해 지출을 늘리는 반면, 디지털 화폐의 확산은 돈의 본디느 물리적인 면을 없앨 필요를 일깨워준다. 예컨대 많은 온라인 상점은 여전히 카공화국과 암호화폐 또는 비트코인과 공지 지불 수단으로 채택했다는 점.131 다른 예로, 그린라이트(Greenlight) 회사는 부모가 자녀와 함께 사용할 수 있는 신용카드를 제공하고 있다.132\n 돈의 양명성 돈은 단지 열심히 일한 대가로 인식될 수 있으며, 필요한 제품들을 획득하고 삶의 질을 향상시키며 타인이나 사회로 도움을 주는 능력을 가진다. 어두운 속면에서 보면 돈에 집착하는 것은 분명, 나쁘다. 말하자면, 물질주의란 돈은 부정적인 것으로써 그저 보여주기식 돈은 탐욕, 부정직, 그리고 도박, 매춘, 마약 거래와 같은 잠재적인 문제를 불러올 수 있다(7장 참조). 더구나 다른 사람들과 그들이 가진 부를 함께 나누지 않는 사람들은 이기적이고 탐욕스러운 것으로 비쳐진다. 흥미롭게도, 연간 가구 소득이 25,000달러 이하인 소비자들은 소득의 약 4%를 자선단체에 기부하는 반면, 소득이 100,000달러 이상인 소비자들은 소득의 약 3%를 기부한다.134\n 돈과 행복 돈이 행복을 살 수 있다는 대중적인 믿음은 거의 사실이 아니다. 상대적으로 가난한 사람들도 행복할 수 있고, 부유한 사람들도 슬플 수 있다. 그러나 이 믿음이 완전히 틀린 것도 아니다. 극적인 빈곤을 경험하고 기본적인 일상 필요를 충족할 수 없는 소비자들은 현재의 지출에 대한 스트레스와 미래 경제 상황에 대한 걱정을 경험하며, 이는 행복을 감소시킨다.135 더욱이, 가난한 환경에서 자란 사람들은 일생에 대체로 불만족스러운 경험을 쌓으며 긍정적인 신체와 정서적 발달을 기대한다. 이는 그들의 건강과 기아에 어느 정도의 미 적절 계획과 같은 장기적인 재정적 및 기타 약속을 할 가능성을 줄일 수 있다.136 그러나 연구에 따르면, 기본적인 인간의 필요가 충족되는 가난한 국가에서는 높은 연대감과 사랑을 가진 소비자들이 삶에 만족할 가능성이 높다.137 미국의 대규모 조사에서는 높은 소득이 일상적인 스트레스와 불행을 줄이는 역할을 하기는 하지만, 전반적인 삶에 대한 만족감과는 관련이 없다.138 따라서 돈이 불행에 대한 치료제는 아니지만, 전반적인 삶의 만족도를 낮출 수 있다. 소비자들은 돈을 어떻게 쓰느냐에 따라 행복을 증가시킬 수도 있다. 예를 들어, 물질적 소유물보", "source": "20261114_141408.jpg"}, {"kind": "heading", "text": "13-5 사회계층별 소비 패턴", "source": "20261114_141411.jpg"}, {"kind": "paragraph", "text": "다른 경험을 구매하거나, 돈 기쁨 및 개보다는 작은 기쁨 여러 개를 구매하거나, 다른 사람에게 혜택을 주기 위해 돈을 사용하거나, 소비된 자원이서 기대의 즐거움을 연장하는 것이다.139 소비자들이 느끼는 긍정적인 감정(매마코커제)을 하루를 보내거나 콘서트에 가는 것과 같은 소비사건을 할 때마다 강해진다. 몰에서 쇼핑을 하면서 고유함 및 느낌는 좋은 감정보다 오히려 자주적인. 많은 가지 이유는 소비 경험이 종종 다른 사람들과의 공유이나, 이는 소비자들의 사회적 관계를 강화하기 때문이다.141 소비자가 돈을 어떻게 쓰느냐는 그들의 사회적 및 로맨틱 관계 형성에도 관련이 있다. 일부 소비자들은 파트너에게 금이거나 거짓말하는 소비자화는 관계에 타해를 줄 수 있다.\n 경제적 추구기 동안 소비하는 것은 소비자들에게 과식과 방치하거나 줄이는 데 도움이 되며, 긍정적인 감정을 유발하고 또한 감사의 마음을 높이는 데 도움이 된다.142 또한 경제적 축주는 사람들의 기억의 정도를 증가시켜 재정 역량을 인식하고 중요한 선호도를 식별할 수 있게 하여 장기적인 삶의 만족도를 높일 수 있다.143\n 앞 절에서는 사회계층이 재남적인 획득 및 소비에 어떻게 영향을 미치는지에 대해 살펴보았다. 이번 절에서는 특정 사회계층의 소비 패턴을 좀 더 포괄적으로 살펴봄으로써 논의를 확장하고자 한다. 많은 사회에서 뚜렷한 계층 구분이 희미해지고 있지만, 논의를 간결하게 하기 위해 ① 상류층, ② 중산층, ③ 근로 계층, ④ 소득수준을 중심으로 다룰 것이다. 이것은 또 본문의 경향이며 개인의 행동을 선형화하는 이론을 기억할 필요가 있다. 마케터는 복잡하고 독특한 소비 패턴을 지닌 다양한 소비자 세분 시장을 식별하기 위해 더 깊이 파고들어야 한다.\n 13-5a 상류층\n 대부분의 사회에서 상류층(upper class)은 귀족, 상속 재산의 ‘올드 머니(old money)’, 신흥 사회 엘리트(또는 누보 리치), 그리고 상류 중산층(전문가들)을 포함하는 다양한 개인으로 구성된 그룹이다. 미국에서 상류층은 월튼(Walton) 가문과 마스(Mars) 가문의 구성원처럼 ‘올드 머", "source": "20261114_141411.jpg"}, {"kind": "heading", "text": "13-5b 중산층", "source": "20261114_141416.jpg"}, {"kind": "paragraph", "text": "나' 엘리트 소비자들로 구성된다. 이 소비자들은 다른 계층의 구성원들보다 돈을 저축하고 투자하는 경향이 있다. 이들 중 많은 소비자가 여전히 가격에 민감하지만, 품질과 독점성의 지표로서 가격이 어떤 제품 특성을 사용하는지 구매를 신중하게 조사하는 경향이 다른 소비자들보다는 덜 보인다. 상류층은 소득무답이지만 다양하며, 그 구성원들은 소비 행동과 관련된 공통의 가치와 생활 방식을 공유한다. 이 소비자들은 자신을 직업, 정치적, 재정적, 사회적 이해 수준보다 여가는 경험이 있어 국경의 한계를 초월하거나, 예술과 문화에 투자하거나, 여행하거나, 자전 및 시민 문제에 참여가 중요하다. 이런 가족에는 등의 고상한 품 브랜드를 구매하도록 유아하고 있다. 그래야 참조되지만(그림 13- 10 참조). 현재 미국에는 1,000만 가구 이상이 백만장자 계층에 속해 있으며, 1,300만 가구가 50만 달러 이상의 자산을 보유하고 있다.12 세계경제 관점에서 보면, 세계인구의 상위 1%만이 백만장자를 보유하고 있으며(39%), 빠르게 따라잡고 있다(10%). 최근의 한 연구에 따르면 중국 가구가 백만장자 계층에 속하며 그 수는 매년 순자산이 최소 3,000만 달러 이상인 소비자는 초고액 순자산 보유자(HNWI)로 불리며 2021년 기준으로 전 세계에 약 60만 명의 UHNWI 개인이 있었다.154 이처럼 이 계정군은 매력적인 세계적 시장을 대표한다. 크레딧 스위스(Credit Suisse) 같은 투자 은행으로부터 전문적인 자산 및 부동산 관리 서비스를 이용할 수 있다.155\n 13-5b 중산층\n 미국의 중산층(middle class)은 주로 화이트칼라 근로자로 구성되어 있으며, 이들 중 다수가 대학에 다녔지만 학위를 취득하지 않은 사람도 일부 포함한다. 퓨리서치(Pew Research Institute)에 따르면, 미국 가구의 약 50%가 중산층에 속해 있으며, 이는 1970년 추정치인 61%에서 감소한 수치이다.156 중산층 소비자의 가치와 소비 형태는 다양하지만, 많은 이들이 상류층을 모방하려는 경향이 있다. 이는 교육과 직업, 의복과 행동을 포함하며, 이들은 종종 상류층 소비자들을 중요하게, 골프와 테니스와 같은 여가 활동에 대해 지식을 쌓음으로써 그들을 동경한다.157 이러한 경향은 극장 관람, 독서, 가정 계발을 위한 서적 및 교육 수업에도 확장된다. 중산층 소비자들은 상류층이 구매하는 상품을 모방하려고 노력한다. 또한 한편으로는 중산층 소비자들이 부에 대한 인식을 가지며 저축 가능성을 향상시키기 위한 다양한 재무 활동을 시도하는 반면, 다른 한편으로는 여행하는 등의 새로운 소비 유형을 경험하는 데 기꺼이 돈을 지불한다.158 이러한 방편적 소비 성향이든 절제되는 중산층 소비자에게 두드러진다.159", "source": "20261114_141416.jpg"}, {"kind": "heading", "text": "13-5c 근로 계층 13-5d 빈곤과 노숙을 겪는 소비자", "source": "20261114_141418.jpg"}, {"kind": "paragraph", "text": "라틴아메리카에서는 빠르게 성장하는 중산층 인구가 곧 하루를 인구보다 많아질 것이 다. 그러나 브라질과 칠레에서 수백만 명의 소비자가 중산층에 합류하고 있는 반면, 이 지역 내 다른 나라의 하류층 소비자들은 여전히 경제적 어려움을 겪고 있다.166 메치고 중산층과 미국 중산층은 가처분 소득의 일부 부분을 자동차, 의류, 빠구, 가정용품 등에 지출한다는 점 에서 많이 유사하다. 메히코나 브라질의 중산층은 빠르게 성장하고 있으며, 현재 전체 가구의 약 33%를 차지하고 있다. 이들은 슈퍼마켓이나 퀵마트(Quick Mart) 소비점과 남아프리카의 이드마트 스(Advance) 교포와 같은 많은 지역 기업의 브랜드의 성장을 좌동시키고, 가속화한다.167 요즈음 라틴아메리카에서는 이 계층의 늘어난 가처분 소득을 노리는 포드(Ford), 얌 브랜즈(Yum!\nBrands), 월마트(Walmart) 같은 다국적 기업의 관심을 끌기에 충분한 만틈 빠르게 성장하고 있다.168\n 근로 계층(working class)은 주로 블루칼라 근로자로 대표된다. 중산의 안전교육을 쌓 남성이 라는 고정원한 근로 계층이 널리 하잗지고, 인종적으로 다영하며, 소비의 함유율이 높아지며, 여가와 오락에 있어서 변화의 꾀하고 있다. 근로 계층 소비자들은 오랜 시간에 걸쳐 동일 지역 에서 동안의 도움이 없이 오련 공동체 안에 모집해 있는 많은 부분의 있어 경제적 지원을 가족 구성 원에게 크게 의존한다.164 이와 같은 이유든 그들의 간초된 예상은 고로에 비해 변화 않을다. 그 결 과 용량이 낮은 제품이나 상하 교육, 심리, 치의, 의료 서비스의 자신과 타가치의 능력을 보유할 확이 적다. 또한 이들은 수동적인 정보 탐색과 복잡한 일에 대한 낮은 참을성을 사가지게 된 다. 또한, 상류 계층에 비해 근로 계층 소비자들은 긴급한 예산을 운용한다. 장기적인 균향보다는 긴급한 요구를 만족시키는 데 기우하는 것은 숙지다.165\n 근로 계층 소비자의 욕구는 의류, 자동차, 가전제품, 가구, 레저 등이 소비자들은 지출한 자금으로 하기 하는 경향이 있다. 물론 때로, 많은 사람들은 투자가 아닌 지출 계좌를 선해야 경제적 안정 성을 추구한다.166 더욱이, 이 소비자들은 지족 말에 예산 제한 때문에 대부분 구매 시기를 앞당기는 행동이 시간 간격 생각을 잘 하지 못하는 수 있다.\n 마케팅 관첨에서는 브랜드 제작자와 연구 분석자들은 계층 소비자들은 수표를 현금화하는 등의 각 기 능에 대해 상점이나 전문 서비스에 수수료를 지불해야 한다.166 또한, 근로 계층 소비자들은 제품의 품질을 가격(또는 가격이 더 높은 모델을 의미함)에 따라 판단하는 경향이 있으며, 할 인 매장에 의존하고 유휴, 구매할 때 제품 정보가 부족한 경우가 많다.169\n 사회적 계층의 하위에는 빈곤과 노숙을 겪는 소비자들이 있다. 이들의 소득은 의료비와 같은 다양한 정부 지원 프로그램으로 보충되며, 이 소득은 그들이 살고 있는 사회에서는 충 분하거나 사회적으로 받아들여질 만한 수준으로 여지다. 사용된 특정 빈곤 측정 기준에 따 르면, 2021년 미국에는 약 7.8%(310)에서 11.6%(3,700만 명)의 사람들이 빈곤을 겪은 것으로 추정 된.170 여러 연구에 따르면, 점점 자인의 부족한 소비자들은 무한한 권리라 같은 특정 서비스 차원의 부정적인 경험을 후쇄 좋길과 같은 다른 서비스 차원으로 일반화하는 경향이 있다.", "source": "20261114_141418.jpg"}, {"kind": "paragraph", "text": "이는 재정 자원 부족 경험이 인지 자원을 고갈시키기 때문일 수 있다.171 재정적 제약은 경제하는 것을 또한 고갈로부터 손실의 과보상으로 이어져 비만을 초래할 수 있다.172 최저임금 인상은 가구가 더 많은 칼로리를 구입할 수 있도록 도울 뿐만 아니라, 일부 가구가 더 건강한 칼로리를 구매하도록 장려할 수 있다.173 일부 소비자들은 주거지가 없거나 임시 구조물, 자동차 또는 빈 집에서 생활한다.174 숨을 쉬는 사람들은 일부 국가에서 성장한 사회의 집단을 상징하지만, 실업, 영양실조 및 나쁜 사람들의 투표율을 추정하고 조사하는 것은 어렵다. 미국의 추정치에 따르면, 어느 날 밤에도 약 60만 명이 노숙을 하고 있으며, 이 인구는 경기 침체 시 증가하여 70만 명이 넘는 경우도 있다.175 노숙을 겪는 사람들 그룹에는 집을 임대하거나 소유할 수 없는 사람들이 포함되지만, 많은 경우 그들의 고용 상태인 소비, 의료 비용, 알코올 남용장, 정신 질환, 여성 가정이 포함된다. 또한, 대부분의 응답자가 그들의 사랑을 우선시할 수 있도록 했다. 연구는 미국에서 매년 약 250만 명이 어린, 즉 30명 중 1명인 것으로 알려진다.176 노숙을 겪는 사람들의 주요 투쟁은 생존과 품질의 삶을 위한 투쟁이다. 수입에 특별한 보호 수단이 존재하지 않으면, 사회적 고용, 생활에 대한 시간을 중간급이라고 표현했다.177 소득의 거의 대부분을 주택에 소비하기 때문에, 그들이 “주택 비용 부담이 큰”으로 육성하거나 과소 육성에 시달리는 사람들이 너무 많은 것 같다. 이들은 무한한 존재가 아니라, “거인이 무엇이든지” 노출되는 상황에서 더 어려워지는 집요의 증가로 경험한 역할에 있는 집단이다. 부족한 통제, 곤경 및 수치감은 특히 이들 집단에 의해 증가될 수 있다.178 사업 전략의 많은 다른 사람들의 범위: 예를 들어, 노숙인들이 물과 사용을 담당하지 않는 것은 의미없다. 빈곤에 시달리는 사람들에게 마케팅의 경우에는 이동수단, 통신, 복지 혜택의 부족 등과 같은 장애를 평가해야 한다. 빈곤에도 불구하고 대부분의 노숙 소비자들은 여전히 가치 있는 물품들을 갖고 있으며, 이것은 최대한 사용하고 더 이상 사용이 불행할 때 폐기한다.", "source": "20261114_141424.jpg"}, {"kind": "heading", "text": "메시지 / 요약", "source": "20261114_141426.jpg"}, {"kind": "paragraph", "text": "수많은 사람 중에서 특정한 시장세분을 표적으로 하는 광고주는 해당 집단의 특독성을 반영하여 캠페인으로써 효과적이 수 있다. 상류층을 표적으로 하는 광고 캠페인의 주된 메시지는 특정한 고급스런 지위를 암시할 수 있다. 고가 상품을 위한 다른 메시지로는 “열심히 일한 것에 대한 보상”, “보상”이 있다. 하고 싶은 다른 일 직장이 있기 전에 도달한 주거지에 있다면 할 수 있다. 특정 제품을 은 생활하는 지역 상점들과 교제할 수 있다. 10만 달러가 넘는 수값짜리 자동차 마티로 직접 만든 특별한 마디집, 그리고 맞춤 양복 등과 같은 고가의 상품들은 구매욕을 그들에게 중요하다. 중요한 사건 및 스포츠 경기 또한 많은 사람을 한데 묶으면서도 가족이나 친지들끼리 함께 상점가로 향하는 계기를 마련할 수 있어 또한 이와 같은 행사들은 건전한 가족 여가기능을 도와주면서도 사회통합을 증진시키는 계제를 마련한다. 개인적으로는 또한 메시지는 사회계층을 정의하는 상징물로서의 우월함을 강조하는데 사용할 수 있다.\n 직접 매체에 대한 노출을 계량적 자료, 따라 대다자 광고주는 특정 독자층을 가진 잡지들(이타임, 포춘, 포브스 등) 은 각기 소비자를 직접 눈에 띄지 않게 상징화(initial exposure; 좋지 신경을 사로 잡는 것)를 상하게 되도록 했다고 한다. 또한 광고와 두 사람의 매체를 중시하는 초기 노출이 중요한 것이다. 예를 들어 두 가지 이상의 신문을 통해 계절 상품 광고를 동시에 건청함으로써 광고에 의한 주의를 환기시킬 수 있다. TV 광고 등과 같은 방송광고 역시 한 집단의 접촉하는 동영상을 상으로써 청각적으로 이들이 서로가 서로를 인지하는 데 있어서 차별적 공정을 이룰 수 있다. 잠재고객들이 전기 자기 스크린과 접촉하는 시간과 같은 요인들은 마케터의 통합 중심의 광고물 스타일이 어떤 소비자들에게 아무런 매체가 영향을 미칠 수 있을지에 대해 큰 역할을 하게 될 것이다. 예를 들어 어떤 사람의 경우 뉴스 프로그램이 끝난 이후 TV를 시청하고 다른 계층들과 같이 신문을 읽는 습관을 갖고 있다면 이 상대적으로 낮다. 혹은 소비자들이 수다를 좋아하는 성격을 지니고 있다면 “바쁜 존재”와 같이 특정 매체의 모임에 참여할 가능성이 높은 반면 집에 특독하다. 그러나 TV 오 및 기타 일렉트로닉 미디어는 부가적으로 관심을 끌기보다는 TV 프로그램 방영 중에 광고에 노출됨으로써 필요한 모든 계층의 소비 습관을 규명할 수 있는 중요한 매체 표지 창상에 도달하기 위해서는 수치를 이해하고 선정하게 해 확확한 용을 의미한다.\n 상류층 고객을 대상으로 하는 마케터들은 개인별 서비스 제공과 함께 특정 상품을 판매하는 유명인응을 위환경 수 있다. 예를 들어, 베버리힐스(Beverly Hills)의 로데오 드라이브(Rodeo Drive) 같은 유명 쇼핑 거리의 고급 뷰티살롱에서 최소 6,000달러 이상의 지불 가격이 들어받는다면 과시적 소비는 소비자들은 대부분 상징적인 상품으로 광고 메시지를 매력, 특히 해당 소비자의 다른 사람에게 노출하는가 하는 중요한 역할을 충족시킬 수 있다. 휴리스틱(heuristic tree) 같은 물리적 환경은 제품을 판매하는 전문가의 행동은 어떤 시간 안에 어떤 기호에 의해 제품을 저렴한 지를 순간적으로 알 수 있게 하는 할 수 있도록 할 수 있다. 이 값은 해당 품목의 명성의 높비 십분렁 오래된 신뢰를 기대할 수 있다. 예를 들어, 달러리, 언디, 리듬과 같은 매장을 여러 저렴한 가격에 품수 있도록 예산에 맞춰 동수한 소비자들에게 소구한다.\n 1인 가구, 가족, 비전통적인 장기 거주 형태를 포함한 가구는 획득 및 소비 패턴에 큰 영향을 미친다. 다양한 가구의 비율은 (1) 늦은 결혼과 동거, (2) 맞벌이 가구, (3) 이혼, (4) 소규모 가구, (5) 동성 및 트랜스젠더 가족 등의 요인으로 인해 증가하고 있다. 가족 구성원들은 가족 의사 결정과정(문제 인식, 정보 탐색, 영향, 선택, 구매, 지불, 소비 및 소비 후 행동)에 다양한 역할을 할 수 있다. 또한, 가족 구성원들은 결정이 주용인자인지, 파트너 중심인지, 자녀 중심인 지, 또는 동시적인지에 따라 의사 결정 과정에서의 역할이 다르다. 자녀의 태도, 사용 및 걱정 과정에 영향을 미치는 특정은 가구가 전통적인지, 결정이 중요한지, 그리고 결정을 내리는 데 시간이 얼마나 있는지에 따라 달라진다.", "source": "20261114_141426.jpg"}, {"kind": "paragraph", "text": "사회의 개인들은 세 가지 기본적인 지위 수준(상, 중, 하)과 더 세분화된 지위 수준(예: 중상 및 중하층)으로 그룹화될 수 있으며, 이는 사회계층을 형성한다. 계층 구분은 통계 계층의 구성원들이 공동된 생활 경험을 공유함으로, 따라서 특정한 소비 행동 패턴도 공유하는 경향이 있기 때문에 중요하다고 간주됩니다. 집단에너지 있으나 하지만, 개인은 자신의 계층 구성원들과 장기적으로 상호작용하기 때문에 그들로부터 영향을 받을 가능성이 가장 크다. 그러나 영향력은 상위 계층의 가치와 행동을 하위 계층이 모방하는 ‘트리클 다운 소비’, 하위 계층에서 시작된 트렌드가 상류 계층으로 퍼지는 ‘트리클 업 소비’, 그리고 진입과 같은 가치와 행동이 퍼지는 ‘트리클 어코스 소비’를 통해 계층을 넘어 전달될 수 있다.\n 사회계층을 결정하는 다양한 요인이 있으며, 그중 주요한 것은 소득, 직업, 교육이다. 사회계층 구조의 전체에 영향을 미치는 세 가지 주요 트렌드는 상향 이동, 하향 이동, 정체계층의 분화이다. 사회계층은 때때로 마케팅 전략을 통해 소비자 행동에 영향을 미친다. 이때 과시적 소비(소비를 통해 자신의 지위를 과장되게 보여 주기 위해 제품을 획득하고 전시) 또는 과시적 단순소비(덜 물질적인 생활 방식을 의식적으로 선택), (2) 지위 상징(사회적 지위를 나타내는 제품), (3) 보상적 소비(개인적 결핍을 보완하기 위해 구매), (4) 돈의 의미이다. 사회계층의 구분이 모호해지고 있지만 전체 시장 내에서 상류층 중산층, 근로 계층, 노동자 계층 등 네 가지 계층이 상당 부분을 차지한다.", "source": "20261114_141433.jpg"}], "notes": [{"source": "20261114_141229.jpg", "text": "학습목표\n 1. 가족 생활 주기와 기타 요인들이 다양한 유형의 가구와 가족에 어떻게 영향을 미치는지 설명한다.\n 2. 가정 내 구성원들이 가족 소비 결정 과정에서 어떠한 역할을 수행하는지와 의사결정에 영향을 미치는 요인이 무엇인지 설명할 수 있도록 한다.\n 3. 사회계층 구조, 사회계층의 주요 결정 요인, 그리고 계층적 행동들에 대해 설명하고 이들이 마케터들에게 왜 중요한지 설명한다.\n 4. 레퍼런스 그룹, 준거그룹 및 의견지도자들이 어떻게 소비자 행동에 영향을 미치는지 설명한다.\n 5. 특정 사회계층의 소비 패턴 및 마케터를 위한 시사점을 서술한다.\n 그림 13-1 ▶ 13장 개관: 가족 및 사회계층의 영향\n 이 장의 첫 번째 부분에서는 다양한 가족의 유형, 가족 구조의 변화 추세, 가족 내 의사 결정에서 가구 구성원의 역할을 포함하여 가족이 소비자 행동에 미치는 영향을 조사한다. 다음으로는 소득, 직업, 교육 등 사회 계층의 결정 요인, 시간에 따른 사회계층의 변화, 그리고 사회계층이 소비자 행동에 미치는 영향을 분석한다.\n 가족의 영향 · 가족의 유형 · 가족의 구조 · 가족 내 의사결정 역할\n 사회계층의 영향 · 사회계층의 영향 · 사회계층의 결정 요인 · 시간이 지나면서 변화하는 사회계층 · 사회적 소비 · 특정 사회계층"}, {"source": "20261114_141235.jpg", "text": "그림 13-2 가족생활 가족은 형태와 크기가 다양하다.\n 가족 구조에 대한 인구 및 사회적 요인과 같은 일반적인 경향은 다음과 같다. 미혼, 이혼 또는 별거로 인해 혼인 상태가 아닌 성인의 비율이 증가하고 결혼과 출산을 미루는 경향이 높아지고 있다. 또한 한 부모 가구, 재혼 가구, 동거 가구, 동성 커플 가구 등의 비율이 증가하면서 가족의 형태가 점점 더 다양해지고 있다. 이러한 변화는 가정의 소비 패턴에도 영향을 미쳐, 예를 들어 1인 가구의 증가는 소포장 식품과 배달 서비스, 소형 가전제품 수요를 증가시키고, 맞벌이 부부 가구의 증가는 시간 절약형 제품과 서비스, 가사 대행 서비스 수요를 증가시킨다. 마케터는 이러한 가족 구조 변화와 그에 따른 소비자 요구의 변화를 면밀히 분석해야 한다.\n 가족 생애 주기 보충자료: 가족 생애 주기는 보호자의 수와 연령, 그리고 그들이 부양하는 자녀의 나이 등에 따라 달라지는 가족의 발달 단계이다. 각 단계는 소비자의 필요와 욕구, 구매력, 지출 패턴에 큰 영향을 미치며, 이에 따라 마케팅 전략 또한 달라져야 한다."}, {"source": "20261114_141244.jpg", "text": "그림 13-9 미국의 가족생활 주기\n 이 자료는 가족의 변화에 따른 가구의 변화를 보여 준다. 각 사각형은 가족생활 주기의 단계를, 화살표는 변화의 형태를, 이름은 가구의 구성을, 연령은 연령의 구간을 나타낸다. 이 다이어그램은 여러 가지 가능성이, 한부모와 독립, 자녀 없는 부부 등을 포함해 다양하게 존재하고 있더라도 단지 여러 단계가 이루어질 수 있다는 사실을 보여주기 위한 것이다. 예를 들면, 한부모와 있으면서도 결혼과 이혼, 재혼을 여러 번 경험하는 사람도 있다. 또한, 한편으로 한 가족만으로 있는가 가족생활 주기는 실제로는 어떤 분류보다 더 다양하고 세분화되어 있을지도 모른다. (일반 설명은 다를 수 있다는 점을 유의해야 한다.)\n 단기족 15세 미만 자녀 (33~41세)\n 단기족 15세 이하 자녀 (40~50세)\n 성인 피부양자가 있는 부부 (63~70세)\n 자녀가 독립한 부부 (57~73세)\n 동시기혼 자녀 없음 (22~30세)\n 독신/이혼 자녀 없음 (26~42세)\n 이혼/독신 15세 미만 자녀 (27~41세)\n 이혼/사별 나이 든 자녀 (44~62세)\n 과거 자녀만족 (66~84세)\n 자연된 결혼률 증가"}, {"source": "20261114_141256.jpg", "text": "마케팅 시사점 편의성을 제공하는 제품과 서비스는 맞벌이 가구와 이혼한 가구를 대상으로 마케팅을 하고 있다. 맞벌이 가정에서는 파트너 모두가 추가, 자동차 및 기타 제품에 대한 구매 결정에 커다란 영향은 미인다. 따라서 법선 제품을 판매하는 마케터들은 두 파트너 모두에게 호소해야 한다. 또한 결혼을 미루는 젊은이들이 늘면서 미흔인 성인들을 부부 대상으로 직접 판매함으로써 엄청난 기회가자 각자의 삶을 이 여갈 수 있도록 돕는 데서 수익을 얻는다.\n대안적 가족은 광고 아이디어의 유용한 원천이다. 결혼과 출산을 지연하고 있는 솔로 가족은 아마도 결혼을 하지 않기로 결정할 것이다. 가령 할로마크(Hallmark)는 혼란 가정을 위한 인사 카드를 제공하고 있다. 그 중에는 직장으로의 복귀를 격려하는 카드, 독신 상태의 여성을 믿는 마케팅에 매력적인 이혼, 단독 양육자, 아이 없는 커플 등과 같은 소비자들을 타기팅하기 때문에, 전통적이지 않은 형식의 결혼식, 출산식(baby shower), 졸업식, 새집들이 파티에 줄로 된 다양한 인사 카드를 제공한다. 메트로(Metro)라는 브랜드 이름이 지닌 신지도의 합기 현상적 유명인, 게이 친구와 함께 클럽을 피운댈로 데이 파티에 참여한 음악, DJ는 남자에게는 여성들만을, 여자가 아닌 여성에게는 남자들만을 들우있었다. 또한 마케터들은 젊은 기억성과 혼성적 자기 변화를 겪는 소비자들을 대상으로 이러한 전환의 스트레스를 줄이는 제품과 서비스를 제공할 수 있다.29 마케터들은 게이 프라이드 행사 후원 외소인(Out), 윈윈(Win), 더 애드보컷(The Advocate) 같은 성적 소수자 대상 잡지와 웨인)의 페이스북 페이지에 등장하는 소비자, 특정 지역의 옥외광고, 동성 결혼 커플을 등장하는 TV 광고 등을 통해 동성 커플을 표적으로 한다. 동성 커플 타깃팅하는 마케팅은 다양한 색알의 신분과 사회적 이슈와 연관성 갖는 법정 대표성 함부를 해야 한다. 예를 들면, 레브언의 커플이 구썹워 일을 함께 하는 남성 동성 커플과 다르며 그들의 경험이 다르다. 레인보우 워싱(rainbow washing)이나 레인보우 워싱으로 불리는 무의미 없고, 레인보우 워싱은 무적 절표의 소비자 및 기업들이 무지개 문양의 제품이나 현실적인 변화를 낳지 않는 LGBTIQ 평등에 대한 진행적인 지지의 표시로 소비자 신뢰를 구축한다. 그러나 브랜 내지지, 최소한의 논리와 책임감을 통합한 결과를 이루어야 하며 향햘할 관계 유지의 고성할 수 있다. 이는 성적 소수자 소비자들을 정작 존중하고 호의적으로 통할 뿐만 아니라 재정적, 심리적으로 성장 가능한 커뮤니티 지원을 제공하는 것이 포함된다.31"}, {"source": "20261114_141300.jpg", "text": "가족 의사 결정 과정의 역할 가족 구성원이 가족의 의사 결정 과정에서 수행할 수 있는 역할에는 문제 인식자, 정보 수집자, 영향력 행사자, 선택자가 있으며, 구매, 결제, 소비, 소비 후 행동을 수행하는 사람이 있다."}, {"source": "20261114_141307.jpg", "text": "가족 의사 결정에서의 갈등 가족 구성원이 의사 결정을 할 때, 누가 어떤 역할을 담당했는지에 대해 동의하지 않을 때 발생한다."}, {"source": "20261114_141311.jpg", "text": "예시 1. 영화 스트리밍\n 가족 의사 결정: 영화 스트리밍하기\n 가족 구성원\n 의사 결정 과정의 과업과 역할 파트너 A 파트너 B 자녀 A 자녀 B\n 1 문제 인식 X X\n 2 정보 검색 X X\n 3 영향력 행사 X X X\n 4 선택 X\n 5 구매 X\n 6 결제 X\n 7 소비 X X X\n 8 소비 후 행동 X X X\n 의사 결정 관여도 중간 낮음 중간 중간\n 구매까지 걸리는 시간: 1~2시간\n 각 과업에서의 구성원의 활동: 일반, X=약간, XX=많이, XXX=아주 많이\n 예시 4. 공동 여름 휴가\n 가족 의사 결정: 공동 여름 휴가\n 가족 구성원\n 의사 결정 과정의 과업과 역할 파트너 A 파트너 B 자녀 A 자녀 B\n 1 문제 인식 XXX\n 2 정보 검색 XX XX XXX XXX\n 3 영향력 행사 XXX XXX XXX XXX\n 4 선택 XXX XXX XXX\n 5 구매 XXX\n 6 결제 XXX\n 7 소비 XXX XXX XXX XXX\n 8 소비 후 행동 XXX XXX XXX XXX\n 의사 결정 관여도 높음 높음 높음 높음\n 구매까지 걸리는 시간: 1년"}, {"source": "20261114_141318.jpg", "text": "갈등 해결 문제에 연루되면, 항상 모든 가족 구성원이 만족할 만한 결과를 내는 것은 아니다."}, {"source": "20261114_141322.jpg", "text": "그림 13-5 자녀 소비자 타깃팅 자녀용 게임 사이트는 장난감과 안전한 온라인 놀이 공간을 결합한다."}, {"source": "20261114_141328.jpg", "text": "마케팅 시사점 마케터들은 가족 구성원들이 서로 다른 의사 결정 역할을 수행할 수 있기 때문에 의사 결정자와 구매자인을 대상으로 고려하는 것은 매우 편편한 전략은 아닐 수 있다. 예를 들어, 많은 제품은 아동용이라 하더라도 성인들이 구매자가 있으며(달래고) 사용하는 아동인 경우가 있는 반면, 많은 십대들이 자신이 사용할 제품의 경우가 있다. 애들 이외의 제품에 대한 영향력 행사자, 의사 결정자 및 구매자에 제약하는 사실을 인식해야 된다. 예를 들어, 아동용 제품에서 성인(부모와 조부모)은 의사 결정에 관여한 가족 구성원이 무엇인지를 결정하는 데 중요한 역할을 하는 행위자로 간주해야 한다. 프로모션 메시지는 실제로 제품에 대한 의사 결정을 내리는 대상인 가족 구성원에게 초점을 맞추어야 한다. 그러면, 이러한 행동 결과 일반 밀스(General Mills) 및 제너럴 푸드(General Foods)는 시리얼 제품을 전통적으로 부모에게 광고해왔다. 그러나 캐드버리(Cadbury)와 같은 회사는 새로운 지각 제품을 개발했으며, 상당한 수준의 소셜 미디어 상정을 운용한 ‘맛봄 기술 이벤트’를 개최하여 아동들이 제품 돌입을 이용하도록 했다.69 가족 외출 같은 의사 결정에서는 부부가 두 응요한 역할을 수행할 수 있다. 자녀가 여러 가지 다양한 활동을 체험하기를 원하는 멕시코, 일본, 유럽, 중동의 부모들을 표적으로 하는 키자니아(KidZania) 놀이 센터는 4~14세 어린이들을 대상으로 한다. 입장료를 지불하고 들어간 어린이들은 일하는 연출을 즐기고 H&M 같은 유행사 브랜드의 소품들을 사용하여 다양한 직업 ‘놀이’를 즐길 수 있다.70 또한 디즈니 주니어(Disney Junior)와 클럽 펭귄(Club Penguin)과 같은 자 내용을 게임이 사이트는 부모들이 이 사이트들을 자녀가 인터넷에 온 (입하고) 있지만, 이자ㄴ들 장소로 보지 때문에 전 세계적으로 소비자들과 기업 간의 쌍방향 커뮤니케이션을 촉진하기 위해평면 화면과 가상현실을 결합해 볼 수 있도록 혼합을 제공하고 있다. 이는 직접적인 소비자 경험을 제공함으로써 사회화에 매우 중요한 역할을 하며, 온라인 마케팅을 받는 방법을 가르치며, 창의적인 광고를 보고, 그리고 자녀들은 정보 처리 중심인 사고를 촉지를 한다. 많은 웹사이트는 온라인개인정보보호법(COPPA)을 통해 수집, 저정, 제3자에게 전해져야 할지를 결정하는 등의 규정을 준수하고 있으며, 일부 미국 주에서는 온라인 사이트에 접속하는 자녀의 개인 정보를 보호하는 특별 규정을 있다.72 \n 사회계층 지위의 높고 낮음에 따른 사회 구성원 범주."}, {"source": "20261114_141332.jpg", "text": "전형적인 직업 투자자 상속인 최고 경영자\n 자본가 계층\n 전형적인 소득 200만 달러\n 고용된 근로자\n 상류층 상급 관리자 중견관리간부 전문직 종사자 중소기업 소유주 14%\n 중산층\n 하급 관리자 준전문가 관리, 근로 감독과 비소매 판매 30%\n 근로 계층\n 저숙련 육체노동자 사무직 소매 판매 30%\n 하층 최저임금 육체노동자13% 계절적 서비스 종사자\n 실업자 시간제 일부 비공식 근로자 12%\n 반근 근로 계층\n 그림 13-6 ▶ 미국의 사회계층 미국 사회계층의 구조를 이해하는 다양한 방법이 있다. 이 모델은 사회학자 데니스 길버트가 정의한 사회계층을 보여준다. 그림은 오늘날 미국 사회구조의 기본 모습을 보여주지만, 수치는 절대적인 것이 아니라 대략적이다. 상위 1퍼센트 계층의 위치는 과거에 비해 훨씬 더 높아졌다. 오바마는 2013년 불평등 심화를 해결하기 위해 “우리 시대의 결정적 도전과제”로서의 불평등 문제에 대한 성찰이 필요하다고 언급하였다. 경제회복의 수혜는 소득분포의 상위 수준에서의 소득이 올라간 것에서 더 높은 수준의 사회계층에서의 상향이었지, 나머지 대다수 사회구성원들은 하위계층으로의 상대적인 하향만을 시간의 경과 속에서 경험하였다.\n Source: Dennis L. Gilbert, The American Class Structure in the Age of Growing Inequality, Sage Publications, 2010, 304."}, {"source": "20261114_141338.jpg", "text": "그림 13-7 ▸ 문화별 계층 구조 사회계층의 상대적 규모와 구조는 문화에 따라 다양하다. 예를 들어, 일본과 스칸디나비아는 상류층과 중산층이 보다 평등하게 분포되어 있는 반면, 라틴아메리카와 인도와 같은 신흥 경제국에서는 중산층과 하층보다 상류층이 더 큰 비율을 차지한다. 미국은 상류층과 중산층의 비율은 크지만 하층의 비율도 상당한 비중을 차지한다.\n 일본 모델\n 미국 모델\n 인도 모델\n 스칸디나비아 모델\n 라틴아메리카 모델"}, {"source": "20261114_141341.jpg", "text": "트리클 다운 소비 상류층이 채택한 제품, 서비스, 행동이 하위 사회계층은 물론 다른 사회계층으로 확산되는 현상\n 트리클 업 소비 하류층 소비자들이 채택한 제품, 서비스, 스타일, 행동이 다른 사회계층에 지배 영향을 미치는 소비자 행동\n 트리클 어크로스 소비 제품, 서비스, 또는 행동이 상류층 내부의 동등한 사회계층의 다른 구성원들에게 확산되는 현상"}, {"source": "20261114_141347.jpg", "text": "상속 지위 출생과 함께 부모로부터 전수된 지위.\n획득 지위 생애 동안 성취를 통해나중에 획득된 지위."}, {"source": "20261114_141349.jpg", "text": "지위 위협 소비자가 하향 사 회 이동을 두려워할 때\n 그림 13-8 ▶ 교육 성취에 따른 소득 및 실업률 25세 이상 미국 소비자의 경우, 높은 교육 성취는 취업 및 수입 확대 와 관 관 성을 의미한다. 2021년에 과 같은 실업률을 보였다. 박사 학위자 소득은 626달러에 불과했다. 고등 소득은 1,908달러였으며, 고졸 이\n\n 사회경제적 지위(SES) 직장 수준, 교육 수준 및 소득 수준과 같은 지표를 통해 측정되는 개인의 사회적 위치.\n사회경제적 지위의 주요 지표 는 직무 수준, 소득 및 교육이다.\n 상향적 이동 지위 수준을 향 상시키는 것"}, {"source": "20261114_141354.jpg", "text": "주관적 사회적 지위(SSS) 소비자가 사회에서 자신의 위치를 인식하는 상대적 사회적 지위를 의미. 이는 소비자가 특정 사회집단에서 자기 자신을 어떻게 인식하는지에 대한 것이다."}, {"source": "20261114_141356.jpg", "text": "하향적 이동 부모 세대보다 낮은 계층으로 이동하는 것.\n 과시적 소비 자신의 (주로) 높은 사회계층을 타인에게 알리기 위해 상품, 서비스, 브랜드를 뽐내며 소비하는 것."}, {"source": "20261114_141401.jpg", "text": "과시적 자비 자신의 미덕을 알리기 위해 공개적으로 자선단 체에 기부하는 것\n 과시적 낭비 사용하지 않는 재화나 서비스소를 눈에 띄게 구 매하는 것\n 자발적 단순화 물질적인 삶을 줄이기 위해 적극적 소비를 회 피하는 것\n 지위 상징 자신의 높은 사회 계층을 다른 소비자에게 알리는 상품, 서비스, 브랜드.\n 그림 13-9 명품 소비와 지위 상징 때때로 소비자들은 비싼 시계, 악세서리, 패션 브랜드, 자동차와 같 은 물품들이 타인에게 지위와 일체감 신호를 보내는 메시지를 전달하기 때문에 이러한 물품을 구매한다."}, {"source": "20261114_141404.jpg", "text": "패러디 디스플레이 지위 상징의 하위 버전과 저질 사치품에서 상위 계층으로 이동하는 현상.\n 가짜 상징 너무 널리 사용되어 그 지위 상징으로서의 의미를 잃은 제품, 설 또는 브랜드를 의미함.\n 보상적 소비 하위 계층이나 저소득 소비자들이 열등감 해소를 위해 자동차, 시계 또는 브랜드를 구매하는 행위."}, {"source": "20261114_141411.jpg", "text": "마케팅 시사점\n 상황적 이동의 가치적인 표상에 대한 욕망을 활용하는 것은 특정 제품 카테고리에 효과적일 것이다. 예를 들어, 부의 상징을 사용하는 물품은 상류층 소비자들을 유혹하고 하류층 고객으로 빠졌거나(Bulgari는 다이아몬드와 사파이어 장식을 한 고가의 휴대전화인 세르펜티를 판매했다.145) 특히 짧호로 지위 상징 브랜드 로고를 크게 드러내는 상품에서 볼카리는 좀 더 많은 비용을 지불할 것을 전달하는 한편때 팔찌를 더 낮은 가격에 제공하여 소비자게서 경우도 있다. 이러한 이동성은 또한 하의로 이동성을 또한 하인즈(Heinz)와 코카콜라(Coca-Cola) 같은 일상적인 제품을 판매하는 마케터들에게 좀 더 저렴한 가격으로 판매할 수 있는 소형 패키지 시장에 내놓도록 한다.146 하류층 소비자 대부분은 재포장으로 같은 회사가 다시 탄산음료나 제품을 제공할 때 더 무거워함으로써 카드 판매했다.\n 많은 국가에서 소매점 결제는 사용이 보편화되고 있으며, 기호품, 특히 연금술적으로 작은 행동, 또는 자가형의 효과가 있다. 하류층은 카드 사용으로 돈을 소비한 파서를 받았고 그렇고 공공 정책 목표와 일치하는 상품을 구입하는 것은 일반적으로 소득이 높은 사람들이 사용하고 있다. 그러나 일부 하류층 소비자들은 세금 또는 사회 향상 프로그램을 위해 부담을 지우지 않기 위해 현금을 선호하고 신용카드가 아닌 현금만을 사용하는 소비자가 점점 더 늘어나고 있다."}, {"source": "20261114_141416.jpg", "text": "그림 13-10 상류층 소비자를 표적화하기 일부 광고들은 고급 또는 한정된 홍보용으로 상류층을 표적으로 한다."}, {"source": "20261114_141424.jpg", "text": "마케팅 시사점 사회마케팅은 시장세분화를 위한 효과적인 방법이 될 수 있기 때문에 제품 또는 서비스 개발, 메시지, 매체 선정, 유통 경로 선택에 영향을 미친다.\n 제품 또는 서비스 개발 사회계층 중의 몇 가지는 어떤 제품을 소비자가 원하는지 결정할 수 있다. 상품을 소비자들은 그들의 명성과 사회 지위에 대한 욕구를 충족시키기 위해 생필품 자동차, 수입 와인, 고급 레스토랑, 연극 티켓과 이와 유사한 것을 선택하도록 설계된 제품에 돈을 쓴다. 특히, 마케터들은 제품의 품질을 적절한 가격 수준의 품질 좋은 제품을 위하여, 가격 단위 및 금융 옵션을 상대적으로 설계한다. 물가를 올리는 모든 제품이 이러한 욕구를 충족시키기 위해 설계되며, 구매력이 문제인 경우를 위해 설계된다. 예를 들면 멕시코의 소비재업체 일렉트라(Elektra)는 근로 계층 소비자들에게 가전제품과 자동차 구매를 위한 신용을 제공한다.179\n 마케터들은 중층 다른 계층을 위한 다른 제품라인을 개발한다. 예를 들어, 오리진은 다양한 동일가격대의 클렌저라인을 개발하면서, 그릇은 상위 계층 고객을 대상으로 하고, 기존 6단계짜리 올레이 피부복합 크림은 하위 계층 고객을 대상으로 한다. 조금만 많은 마케터가 특정 계층을 대상으로 하여 이들의 욕구를 깊이 이해하고 그에 맞는 제품을 만든다. 예를 들면, 이탈리아의 소비 패션 회사 로로피아나(Loro Piana)는 브랜드를 귀하시키기 않고도 상대적으로 많은 독창성을 보유하는 고급 캐시미어 및 모직 의류를 제공한다. 또 다른 예로, 제이슨 우(Jason Wu)나 필립 림(Phillip Lim)과 같은 디자이너들은 타깃(Target) 점포에서 합리적인 가격의 의류를 가지고 있음 고객층을 넓혀 중층을 공략하고 있다.182"}, {"source": "20261114_141426.jpg", "text": "메시지\n 매체 노출\n 그림 13-11 예산에 맞추어 소비자에게 소구 월마트, 달러리, 언디, 리드과 같은 매장은 어떤 매입 저렴한 가격에 품목으로 예산에 맞춰 동수한 소비자들에게 소구한다.\n 요약"}, {"source": "20261114_141433.jpg", "text": "복습과 토론을 위한 질문\n 1. 핵가족, 매개족, 구성ㅈ라는 용어를 정의하라.\n 2. 가족의 기본적인 구조와 특성을 변화시킨 다섯 가지 핵심적인 요인은 무엇인가?\n 3. 가족 의사 결정에서 가족 구성원이 수행할 수 있는 여덟 가지 과업 또는 역할은 무엇인가?\n 4. 사회계층이란 무엇인가?\n 5. 사회계층의 결정 요소는 무엇인가?\n 6. 사회계층 평가가 변화하는 이유는 무엇인가?\n 7. 소비자가 과시적 소비, 과시적 냉비, 자발적 단순소비에 참여하는 이유는 무엇인가?\n 8. 평범 계시는 지위 상징과 어떻게 다른가?\n 9. 어떤 상황에서 보상적 소비가 발생하는가?\n 10. 왜 기업이 다양한 사회계층 소비자를 만족시키기 위해 다양한 제품을 개발하는 이유는 무엇인가?\n 미주(endnotes)는 한경사 홈페이지 www.hankyungsa.co.kr의 공지사항에서 PDF 파일로 다운로드 할 수 있습니다."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch13-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch13-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch13-book-edits',content.innerHTML));const saved=localStorage.getItem('ch13-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
