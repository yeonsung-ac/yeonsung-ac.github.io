<script>
const slides=[{"kind": "concept", "title": "사회적 딜레마: 나와 타인의 이익", "answer": "개인의 이익과 다른 사람·사회의 이익이 충돌할 수 있다. 소비와 마케팅의 평가는 당사자의 즉각적 편익뿐 아니라 비용을 부담하는 다른 이해관계자도 고려해야 한다.", "example": "행사 때 입은 옷을 사용하지 않은 것처럼 반품하면 개인은 이익을 얻어도 판매자와 다른 고객이 비용을 부담할 수 있다."}, {"kind": "concept", "title": "시간적 딜레마와 장기적 결과", "answer": "즉각적 보상과 장기적 이익이 충돌하는 상황이다. 단기 판매나 즐거움만 추구하면 이후의 경제적·사회적·환경적 결과를 놓칠 수 있다.", "example": "잦은 신제품 구매의 즉각적 즐거움과 장기 예산·폐기물 부담을 함께 비교할 수 있다."}, {"kind": "concept", "title": "소비와 마케팅의 밝은 면·어두운 면", "answer": "제품과 마케팅은 편의·관계·삶의 질을 높이기도 하고 과소비·기만·배제·환경 부담을 만들기도 한다. 같은 활동에 편익과 손실이 공존할 수 있어 여러 결과를 함께 평가한다.", "example": "배달 서비스는 접근성을 높이지만 포장과 노동 환경 등의 쟁점도 함께 살펴야 한다."}, {"kind": "concept", "title": "마케팅 윤리", "answer": "제품·가격·유통·촉진과 이해관계자 관계에서 무엇이 옳고 책임 있는지 판단하는 도덕적 기준이다. 법적 허용 여부와 윤리적 적절성은 구분되며 투명성·정직·공정성 등을 고려한다.", "example": "추가 비용을 마지막 단계에서만 드러내는 설계는 소비자의 이해와 선택을 방해하는지 평가해야 한다."}, {"kind": "concept", "title": "소비자 윤리와 일탈적 행동", "answer": "소비자 윤리는 취득·사용·처분에서의 도덕적 판단과 행동을 다룬다. 일탈적 행동은 일반적으로 수용되는 규범을 벗어난 행동이며 기업뿐 아니라 소비자 행동도 다른 사람에게 피해를 줄 수 있다.", "example": "일부러 거짓 불량을 주장해 환불을 받는 행동은 판매자와 다른 고객에게 비용을 전가할 수 있다."}, {"kind": "concept", "title": "취득 쟁점: 절도와 오용", "answer": "매장 절도, 무단 이용, 반품 제도의 악용 등은 타인의 자원과 권리를 침해할 수 있다. 발생을 이해할 때 기회·유혹·규범·정당화와 통제 환경을 함께 살피되 설명을 정당화와 혼동하지 않는다.", "example": "‘다들 그렇게 한다’는 생각으로 디지털 콘텐츠를 무단 이용해도 피해가 사라지는 것은 아니다."}, {"kind": "concept", "title": "암시장·위조품·모방의 쟁점", "answer": "공식 경로 밖의 거래와 원래 상품으로 오인시키는 위조품은 출처·품질·권리와 안전 문제를 일으킬 수 있다. 모든 저가 대안과 위조품을 동일시하지 말고 정체와 거래 정보를 명확히 해야 한다.", "example": "유명 브랜드 정품이라고 속인 제품은 단순히 비슷한 용도의 저가 상품과 다른 문제를 만든다."}, {"kind": "concept", "title": "중독적·강박적 취득의 쟁점", "answer": "교재는 심각한 부정적 결과에도 반복되는 구매·취득을 소비자 쟁점으로 다룬다. 일시적인 충동 구매와 지속적인 문제 행동을 구분하고 짧은 사례만으로 개인을 진단하지 않는다.", "example": "구매 순간의 기분 전환이 반복 지출과 후회를 낳을 때는 단순 판매 확대만으로 성과를 평가하기 어렵다."}, {"kind": "concept", "title": "취약한 소비자에 대한 마케팅", "answer": "정보 이해·판단·교섭 능력과 자원이 제한된 상황에서는 마케팅에 더 취약할 수 있다. 어린이 등에게 광고 의도·가격·조건을 이해하기 쉽게 설명하고 취약성을 이용한 압박을 줄여야 한다.", "example": "게임의 유료 아이템을 안내할 때 실제 금액과 결제 여부를 분명히 보여 주어야 한다."}, {"kind": "concept", "title": "소비 쟁점: 유해한 사용과 과소비", "answer": "교재는 음주·흡연·약물, 과식, 도박·게임 등 소비의 부정적 결과를 다룬다. 제품 접근과 소비를 촉진하는 방식이 소비자·주변인에게 미치는 영향을 살피고 상황별 보호와 책임 있는 정보를 고려한다.", "example": "크기와 추가 구매만 강조하기보다 실제 이용 조건과 비용을 이해할 수 있게 안내할 수 있다."}, {"kind": "concept", "title": "개인정보와 소비자의 통제", "answer": "소비자는 어떤 정보가 수집되고 왜·어떻게 이용되는지, 누구와 공유되는지를 이해할 수 있어야 한다. 정보의 관련성과 최소 수집, 명확한 설명과 선택·통제 가능성은 윤리적 평가의 핵심이다.", "example": "할인 신청에 불필요한 정보까지 요구하기보다 목적에 필요한 항목과 선택 항목을 구분한다."}, {"kind": "concept", "title": "이상화된 자아 이미지와 사회 비교", "answer": "광고의 제한된 외모·생활 이미지는 소비자가 자신과 비교하는 기준이 될 수 있다. 비현실적 기준과 배제의 영향을 평가하고 다양한 소비자와 실제 사용 상황을 존중해야 한다.", "example": "한 가지 체형만 정상처럼 보여 주기보다 다양한 사용자가 제품을 이용하는 장면을 제공한다."}, {"kind": "concept", "title": "처분의 윤리와 사용 가능한 제품", "answer": "처분은 폐기 외에도 재사용·수리·판매·기부·재활용 등을 포함한다. 기능이 남은 제품의 조기 폐기와 처리 비용을 살피며 제품 상태와 수취인의 요구에 맞는 경로를 선택한다.", "example": "사용 가능한 책상은 상태를 알리고 중고 판매나 기부를 검토할 수 있다. 필요한 수요가 있는지도 확인한다."}, {"kind": "concept", "title": "기업의 사회적 책임 (CSR)", "answer": "기업은 경제적 성과와 함께 소비자·종업원·공급자·지역사회·환경 등 이해관계자의 영향을 고려한다. 일회성 홍보보다 본업의 설계·운영과 장기적 책임이 연결되어야 한다.", "example": "환경 기부를 하면서도 제품 포장과 공급 과정의 낭비를 줄이는 실행을 함께 점검한다."}, {"kind": "concept", "title": "환경 의식적 행동과 지속 가능성", "answer": "환경을 중시하는 태도만으로 실천이 보장되지 않는다. 정보·가격·시설·시간 등 행동 장벽을 줄이고 실제 효과를 확인해야 한다. 구매부터 사용·처분까지 영향을 함께 살핀다.", "example": "재활용 의미를 알리는 것과 함께 알아보기 쉬운 분류 안내와 접근하기 쉬운 수거함을 제공한다."}, {"kind": "concept", "title": "그린워싱과 기업 위선", "answer": "그린워싱은 환경 편익을 실제보다 과장하거나 오해하게 하는 홍보이다. 기업 위선은 내세운 도덕적 가치와 실제 행동의 불일치이다. 범위·근거·한계를 명확히 밝히고 운영을 개선해야 한다.", "example": "포장 일부만 개선했는데 제품 전체가 환경 부담이 전혀 없다고 표현하면 범위를 오인시킬 수 있다."}, {"kind": "concept", "title": "윤리적 소싱과 공급망", "answer": "원재료 조달과 생산에서 노동·환경·사회적 책임을 고려하는 것이다. 최종 제품의 이미지뿐 아니라 공급망의 실제 관행과 확인 가능한 증거를 살펴야 한다.", "example": "원재료의 출처와 생산 조건을 확인하고 문제가 드러나면 시정 과정을 추적하는 것이 중요하다."}, {"kind": "concept", "title": "지역사회 참여와 책임의 일관성", "answer": "지역사회 지원·봉사·공익 활동은 사회적 책임의 한 방식이다. 실제 지역의 필요, 지속성·성과, 본업의 행동과의 일치를 살펴야 한다. 기업과 소비자 모두 좋은 행동을 이후의 문제 행동에 대한 면허로 삼지 않아야 한다.", "example": "봉사 활동을 홍보하면서 직원과 지역 주민에게 주는 일상적 부담을 방치하면 신뢰를 얻기 어렵다."}, {"kind": "concept", "title": "보이콧과 바이콧 (Boycott and Buycott)", "answer": "보이콧은 문제 있는 기업·제품의 구매를 거부해 변화를 요구하는 행동, 바이콧은 가치에 부합하는 기업·제품을 의도적으로 구매해 지지하는 행동이다. 근거·목표와 실제 행동을 구분해 평가한다.", "example": "환경 문제를 이유로 특정 상품을 사지 않는 것과 신뢰할 수 있는 대안을 적극 구매하는 것은 방향이 다르다."}, {"kind": "concept", "title": "소비자 대응과 소비자 문해력", "answer": "소비자는 불평·공동 대응·옹호 활동과 교육 등으로 문제에 대응할 수 있다. 교재는 집단 소송과 보복적 행동도 다루지만 사실에 근거한 정당한 대응과 허위 주장·방해를 구분해야 한다. 문해력은 정보와 조건을 이해하고 비판적으로 평가하는 능력이다.", "example": "광고 근거와 비용을 확인하고 실제 경험의 증거를 보관해 문제를 구체적으로 전달할 수 있다."}, {"kind": "problem", "topic": "사회적 딜레마", "title": "행사에서 입은 옷을 새 상품처럼 반품해 개인 비용을 줄였다. 이해관계자 관점에서 평가하라.", "answer": "개인의 절약과 판매자·다른 소비자의 비용이 충돌한다. 재판매 손실과 처리 비용, 가격과 신뢰에 미치는 영향을 함께 보아야 하며 제도의 존재가 악용을 정당화하지 않는다.", "example": "단기 이익만 보면 비용을 부담하는 다른 사람을 놓치기 쉽다."}, {"kind": "problem", "topic": "시간적 딜레마", "title": "기업이 이번 달 판매를 위해 조건을 숨겼다가 장기 신뢰를 잃었다. 어떤 충돌인가?", "answer": "즉각적 성과와 장기적 관계·평판 사이의 시간적 딜레마가 드러난다. 동시에 소비자의 이해와 선택을 해치는 윤리 문제도 있다.", "example": "판매량과 함께 반품·불평·재이용·신뢰를 살펴야 한다."}, {"kind": "problem", "topic": "윤리와 법", "title": "‘금지된다는 규정을 못 찾았으니 윤리 문제도 없다’는 주장에 답하라.", "answer": "법적 허용과 윤리적 적절성은 같은 판단이 아니다. 정보의 정직성, 공정성, 취약성의 이용과 이해관계자의 피해를 별도로 평가해야 한다.", "example": "사용자가 이해하기 어려운 조건을 이용해 결제를 유도하는 방식은 별도의 윤리 검토가 필요하다."}, {"kind": "problem", "topic": "소비자 윤리", "title": "소비자가 ‘다들 무단 이용하니 나도 괜찮다’고 말한다. 설명과 정당화를 구분하라.", "answer": "또래 규범에 대한 인식은 행동의 발생을 설명하는 요인일 수 있지만 타인의 권리와 자원 침해를 정당화하지 않는다. 실제 피해와 대안의 이용 가능성을 함께 살펴야 한다.", "example": "관행처럼 보인다는 사실이 올바르다는 근거가 되지는 않는다."}, {"kind": "problem", "topic": "위조품", "title": "정품이라고 속인 저가 상품의 문제를 소비자와 브랜드 관점에서 설명하라.", "answer": "소비자는 출처와 품질을 오인하고 금전·안전상의 손실을 겪을 수 있다. 브랜드는 권리와 신뢰·매출에 피해를 받을 수 있다. 단순한 저가 대안과 위조·기만을 구분한다.", "example": "광고 이미지와 상표, 실제 공급자와 제품 정보를 확인할 수 있어야 한다."}, {"kind": "problem", "topic": "문제 구매 행동", "title": "기분 전환을 위해 반복 구매하고 부정적 결과가 커진 사례를 한 번의 충동 구매와 구분하라.", "answer": "반복성, 통제의 어려움, 지속적 손실과 생활상의 영향이 중요한 분석 요소이다. 교재의 강박적 구매 쟁점과 연결할 수 있지만 짧은 설명만으로 개인을 진단해서는 안 된다.", "example": "구매 횟수 하나만으로 문제의 성격을 확정하기 어렵다."}, {"kind": "problem", "topic": "취약한 소비자", "title": "어린이용 앱에서 가상 화폐와 실제 결제 금액을 알아보기 어렵게 표시했다. 개선안을 제안하라.", "answer": "실제 금액과 유료 여부·조건을 쉽게 이해하게 표시하고 결제 확인과 적절한 통제 경로를 제공한다. 광고와 콘텐츠를 구분하고 이해의 어려움을 이용해 구매를 압박하지 않는다.", "example": "복잡한 화폐 환산보다 실제 비용을 함께 보여 주면 판단을 돕는다."}, {"kind": "problem", "topic": "개인정보", "title": "할인 쿠폰 신청에 목적과 무관한 정보를 필수로 요구한다. 윤리적 검토와 개선 방향은?", "answer": "수집 필요성·목적·이용 범위·공유와 보관을 검토하고 필요한 정보로 최소화한다. 선택 항목과 통제 경로를 명확히 하며 할인 편익만으로 과도한 수집을 정당화하지 않는다.", "example": "사용자는 무엇을 제공하고 어떤 서비스를 받는지 이해할 수 있어야 한다."}, {"kind": "problem", "topic": "자아 이미지", "title": "광고가 한 가지 외모만 이상적인 소비자로 제시한다. 소비자 행동과 윤리의 쟁점을 설명하라.", "answer": "사회 비교를 통해 현실의 자아와 광고 이미지 사이의 차이를 느끼게 할 수 있다. 배제와 비현실적 기준의 영향을 고려하고 다양한 사용자와 실제 사용 상황을 보여 주어야 한다.", "example": "상품 편익을 설명하는 것과 소비자 자체가 부족하다고 암시하는 것은 다르다."}, {"kind": "problem", "topic": "처분", "title": "사용 가능한 가구를 새 유행 때문에 버리려 한다. 대안과 판단 기준을 제시하라.", "answer": "계속 사용·수리·중고 판매·기부·재활용을 검토한다. 상태와 안전, 운반 비용, 실제 수요와 적절한 처리 경로를 확인해야 한다. 기부가 모든 경우의 정답은 아니다.", "example": "필요한 사람이 없는 곳에 일방적으로 보내면 처리 부담만 옮길 수 있다."}, {"kind": "problem", "topic": "CSR", "title": "기업이 기부액은 크게 홍보하지만 본업의 환경·노동 문제는 개선하지 않는다. 어떻게 평가할 것인가?", "answer": "기부는 책임 활동의 일부일 뿐이다. 소비자·직원·공급자·지역사회·환경에 미치는 본업의 영향을 함께 평가하고 내세운 가치와 운영의 일치를 확인해야 한다.", "example": "좋은 활동 하나가 다른 문제에 대한 책임을 없애지는 않는다."}, {"kind": "problem", "topic": "환경 행동", "title": "재활용 의향은 높지만 수거함이 멀고 분류법을 모른다. 캠페인을 개선하라.", "answer": "동기만 강조하기보다 명확한 분류 정보와 접근 가능한 수거 시설을 제공해 능력·기회 장벽을 줄인다. 참여량뿐 아니라 적정 분류와 실제 처리 결과도 확인한다.", "example": "생활 동선 안의 수거함과 구체적 안내가 실천을 돕는다."}, {"kind": "problem", "topic": "그린워싱·소싱", "title": "포장 일부만 재활용 소재인데 제품 전체를 ‘환경 영향 없음’이라고 홍보했다. 문제와 개선책은?", "answer": "환경 편익의 범위와 정도를 과장해 그린워싱이 될 수 있다. 실제 소재 비중과 적용 범위·근거·한계를 명확히 알리고 조달·생산·사용·처분의 영향도 점검한다.", "example": "인증이나 출처도 실제로 확인할 수 있는 범위에서만 제시해야 한다."}, {"kind": "problem", "topic": "보이콧·바이콧", "title": "문제 기업의 상품을 사지 않는 행동과 가치에 맞는 다른 기업을 적극 구매하는 행동을 구분하라.", "answer": "전자는 보이콧, 후자는 바이콧이다. 둘 다 소비를 통해 가치를 표현하고 변화를 요구할 수 있으나 거부와 지지라는 방향이 다르다. 대상과 근거를 정확히 확인해야 한다.", "example": "불매 의사를 말하는 것과 실제 구매를 바꾸는 행동도 구분해 볼 수 있다."}, {"kind": "problem", "topic": "문해력과 대응", "title": "기만적 광고를 경험한 소비자가 허위 후기를 올려 보복하려 한다. 더 적절한 대응을 제안하라.", "answer": "실제 광고·거래·제품 경험의 증거를 보관하고 사실에 근거한 불평과 해결 요구를 전달한다. 필요하면 적절한 소비자 지원·옹호 경로를 확인한다. 허위 주장과 방해는 정당한 문제 제기와 구분해야 한다.", "example": "다른 소비자에게 정보를 전할 때도 확인한 사실과 개인적 평가를 나누어 쓰는 것이 도움이 된다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제17장 · 소비자 사회에서의 마케팅, 윤리, 사회적 책임';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
