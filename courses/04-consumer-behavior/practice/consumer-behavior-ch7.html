[
{"code":"7-1a","topic":"교재 개념 · 문제 인식","q":"이상적 상태: 우리가 원하는 상태","a":["이상적 상태는 소비자가 현재 자신이 처한 상태와 비교하여 도달하거나 유지하고 싶어 하는 상태이다. 제품이나 서비스를 이용해 얻고 싶은 성능, 편리함, 즐거움, 생활 모습 등이 이에 해당한다.","이상적 상태는 개인의 목표와 기대, 과거 경험, 주변 사람과의 비교, 새롭게 접하는 정보 등에 따라 달라질 수 있다. 소비자가 원하는 수준이 높아지면 현재 제품에 고장이 없어도 현재 상태와 이상적 상태 사이의 차이를 인식할 수 있다.","이 차이를 중요하게 느끼고 해결하려는 동기가 생기면 정보 탐색이나 구매를 고려할 수 있다. 따라서 이상적 상태의 변화는 문제 인식을 유발하는 한 가지 계기가 된다."],"e":["현재 사용하는 휴대전화는 정상적으로 작동한다. 그런데 여행 사진을 더 선명하게 찍고 싶어지면서 ‘야간에도 깨끗한 사진을 찍을 수 있는 상태’를 원하게 된다. 이것이 소비자의 이상적 상태이다.","기존 휴대전화의 야간 사진 품질과 자신이 원하는 품질 사이의 차이를 중요하게 느끼면, 더 좋은 카메라를 갖춘 휴대전화의 정보를 찾아볼 수 있다. 제품이 고장 나서가 아니라 원하는 상태가 달라져 문제를 인식한 경우이다."]},
{"topic":"문제 인식","q":"문제 인식이란 무엇이며, 현재 상태와 이상적 상태의 차이는 소비자의 구매 동기를 어떻게 유발하는가?","a":["문제 인식은 소비자가 현재 경험하는 상태와 자신이 원하는 이상적 상태 사이에 차이가 있다고 느끼는 것이다. 이 차이를 중요하게 여기고 해결하려는 동기가 생기면 구매 의사결정이 시작될 수 있다.","현재 상태가 나빠지거나 이상적 상태가 높아지면 차이가 커질 수 있다. 다만 차이를 인식했다고 해서 곧바로 구매하는 것은 아니며, 비용이나 상황에 따라 해결을 미룰 수도 있다."],"e":["휴대전화 배터리가 빨리 닳아 일상적인 사용이 어려워지면 현재 상태가 나빠진 것이다. 반면 기존 휴대전화에 문제가 없어도 더 좋은 카메라로 여행 사진을 찍고 싶어지면 이상적 상태가 높아진 것이다.","두 경우 모두 원하는 상태와의 차이를 느끼지만, 교체 비용이 부담스럽다면 구매를 미룰 수 있다."]},
{"topic":"내적 탐색의 의미와 정도","q":"내적 탐색이란 무엇이며, 동기·능력·기회는 내적 탐색의 정도에 어떤 영향을 미치는가?","a":["내적 탐색은 문제를 해결하는 데 필요한 정보를 자신의 기억에서 찾아내는 과정이다. 소비자는 제품 지식, 브랜드 정보, 과거의 평가와 경험 등을 떠올린다.","동기는 정보를 생각해 보려는 의지이며, 구매 문제가 중요할수록 적극적인 탐색을 유발할 수 있다. 능력은 저장된 지식과 경험을 활용할 수 있는 정도이다. 기회는 기억을 탐색할 시간과 주의의 여유로, 시간 압박이나 주의 분산은 탐색을 제한한다."],"e":["노트북을 교체하려는 학생이 예전에 사용한 브랜드와 배터리 성능을 떠올리는 것이 내적 탐색이다.","전공 과제에 중요한 구매라면 깊이 생각하려는 동기가 커지고, 사용 경험이 많으면 떠올릴 정보도 풍부해진다. 그러나 수업 직전에 급하게 결정해야 한다면 기억을 충분히 탐색하기 어렵다."]},
{"topic":"내적 탐색에서 인출되는 정보","q":"내적 탐색에서 소비자는 어떤 정보를 인출하며, 브랜드·속성·평가·경험의 회상에는 각각 어떤 요인이 영향을 미치는가?","a":["브랜드 회상은 구매 후보가 될 브랜드를 떠올리는 것이다. 전형성, 친숙성, 목표와 사용 상황, 브랜드와 연결된 신호가 영향을 준다. 브랜드를 떠올렸다고 반드시 고려집합, 즉 실제 검토할 후보에 포함되는 것은 아니다.","속성 회상은 가격이나 성능 같은 특징을 떠올리는 것이다. 접근성은 쉽게 인출되는 정도이고 진단성은 대안의 차이를 판단하는 데 유용한 정도이다. 현저함, 생생함, 소비자의 목표도 영향을 준다.","평가 회상은 세부 정보를 잊어도 남아 있는 전반적인 호감이나 비호감을 떠올리는 것이다. 경험 회상은 자신이 겪은 사건과 감정에 관한 자서전적 기억을 떠올리는 것으로, 생생하고 두드러진 경험이 중요한 단서가 될 수 있다."],"e":["운동화를 살 때 익숙한 브랜드가 떠오르는 것은 브랜드 회상이다. 그중 가격이 너무 높은 브랜드는 실제 구매 후보에서 제외할 수 있다.","‘가볍다’는 특징을 기억하는 것은 속성 회상이고, ‘이 브랜드가 좋다’는 느낌은 평가 회상이다. 예전에 그 신발을 신고 여행하며 발이 편했던 장면이 떠오르는 것은 경험 회상이다."]},
{"topic":"내적 탐색의 정확성","q":"내적 탐색은 항상 정확한가? 확증 편향·억제·기분은 기억의 인출에 어떤 영향을 미치는가?","a":["내적 탐색은 기억의 일부만 선택적으로 인출하므로 항상 정확하거나 완전하지는 않다. 확증 편향은 기존 신념을 지지하는 정보를 더 쉽게 떠올리거나 그 정보에 집중하는 경향이다.","억제는 특정 속성이나 정보를 떠올리는 과정에서 다른 관련 정보의 인출이 방해되는 현상이다. 기분은 현재 감정과 관련된 기억이 떠오르는 정도와 대상에 대한 평가에 영향을 줄 수 있다."],"e":["좋아하는 카페를 생각하며 친절했던 날만 떠올리고 주문이 잘못됐던 경험은 잘 떠올리지 않는다면 확증 편향이 나타난 것이다.","카페의 저렴한 가격을 집중해서 떠올리다 좌석의 불편함을 놓칠 수 있다. 또 기분이 좋은 날에는 즐거웠던 방문 경험이 더 쉽게 떠오를 수 있다."]},
{"topic":"외적 탐색의 의미와 유형","q":"외적 탐색이란 무엇이며, 구매 전 탐색과 지속적 탐색은 어떻게 다른가?","a":["외적 탐색은 기억 밖의 환경에서 의사결정에 필요한 정보를 수집하는 과정이다. 내적 탐색만으로 정보가 충분하지 않을 때 추가로 수행할 수 있으며, 관심이나 즐거움 때문에 이루어지기도 한다.","구매 전 탐색은 현재의 구매 문제를 해결하기 위한 탐색이다. 지속적 탐색은 당장의 구매 계획과 관계없이 장기적인 관심이나 즐거움을 바탕으로 계속 정보를 모으는 것이다. 이렇게 축적한 지식은 이후 구매에도 활용할 수 있다."],"e":["고장 난 노트북을 교체하기 위해 이번 주에 가격과 사양을 비교하는 것은 구매 전 탐색이다.","구매할 계획이 없어도 평소 신제품 리뷰와 기술 소식을 즐겨 보는 것은 지속적 탐색이다. 나중에 노트북이 필요해지면 이때 쌓은 지식이 도움이 된다."]},
{"topic":"외적 탐색의 정보원","q":"소비자는 외적 탐색에서 어떤 정보원을 이용하며, 각 정보원의 특징은 무엇인가?","a":["소매점 탐색은 매장, 판매원, 포장과 설명 자료를 이용하는 것이다. 검색 엔진과 제3의 미디어 탐색은 검색 결과, 광고, 웹사이트와 소셜 미디어 등을 통해 정보를 찾는 것이다.","개인 상호 간 탐색은 친구나 친척, 다른 소비자의 경험과 후기를 참고하는 것이다. 독립적 탐색은 독립적인 비교 자료나 공공기관의 정보를 활용하는 것이다. 체험적 탐색은 샘플이나 시험 사용 등으로 직접 경험하는 것이다.","같은 온라인 채널에도 판매자의 설명, 소비자 후기, 독립기관의 자료가 함께 존재할 수 있다. 소비자는 정보의 제공 주체와 이해관계, 자신의 사용 조건에 대한 적합성을 함께 판단해야 한다."],"e":["헤드폰을 살 때 매장 직원에게 기능을 묻고, 검색으로 제품 설명을 확인하고, 친구에게 사용 경험을 듣는다. 이어 독립기관의 비교 자료를 읽고 매장에서 직접 착용해 본다.","직접 착용하면 무게와 압박감을 확인할 수 있고, 비교 자료에서는 여러 제품의 성능을 같은 기준으로 살펴볼 수 있다."]},
{"topic":"외적 탐색량과 동기·능력·기회","q":"소비자의 외적 탐색량은 무엇에 의해 달라지며, 정보를 처리하려는 동기·능력·기회는 어떤 역할을 하는가?","a":["외적 탐색량은 정보를 더 알아보려는 동기, 정보를 이해할 능력, 탐색할 기회에 따라 달라진다. 가격이나 사양처럼 구매 전에 확인하기 쉬운 탐색적 속성과, 사용해야 판단하기 쉬운 경험적 속성의 차이도 관련된다.","동기에는 관여도와 지각된 위험, 탐색의 비용과 혜택, 고려대상의 수, 상대적인 브랜드 불확실성이 관여한다. 이어 제품 유형, 탐색에 대한 태도, 기존 지식과 정보의 불일치, 다른 이의 존재도 영향을 줄 수 있다.","능력에는 소비자 지식과 인지 능력, 감정 관련 요인, 인구통계학적 요인이 관련된다. 스스로 안다고 느끼는 주관적 지식과 실제로 아는 객관적 지식은 다를 수 있다.","기회에는 이용 가능한 정보량, 정보 제공 양식, 시간의 여유, 함께 결정할 선택 묶음의 수가 관련된다. 구매가 중요해도 정보가 복잡하거나 시간이 부족하면 실제 탐색은 제한될 수 있다."],"e":["처음 자동차를 사는 소비자는 손실 위험이 크고 브랜드 간 차이를 잘 몰라 비교하려는 동기가 높을 수 있다. 그러나 전문용어를 이해하지 못하면 정보 처리 능력이 탐색을 제한한다.","같은 기준의 비교표와 충분한 시간이 주어지면 탐색하기 쉬워진다. 가격과 연비는 자료로 비교할 수 있지만 승차감은 시승을 통해 확인하는 편이 적합하다."]},
{"topic":"외적 탐색에서 수집하는 정보","q":"소비자는 외적 탐색에서 브랜드명·가격·기타 속성에 관한 정보를 왜 수집하는가?","a":["브랜드명은 소비자가 관련 지식, 이미지, 경험과 평가를 연결하는 중심 단서이다. 소비자는 브랜드명을 통해 대안을 구별하고 기존 기억과 새 정보를 연결한다.","가격은 필요한 지출과 제품의 가치를 판단하는 데 활용한다. 품질을 추론하는 단서가 될 수도 있지만 높은 가격만으로 높은 품질이 입증되는 것은 아니다.","기타 속성은 소비자의 목표에 맞는 제품인지 비교하는 근거이다. 같은 제품이라도 편안함, 경제성, 건강 등 구매 목표에 따라 중요하게 살펴볼 속성이 달라진다."],"e":["운동화를 고를 때 브랜드명으로 과거 사용 경험을 떠올리고, 가격으로 예산에 맞는지 판단한다. 오래 걸을 목적이라면 쿠션과 착용감을, 비 오는 날 신을 목적이라면 방수 성능을 자세히 확인한다.","비싼 운동화라도 자신의 발에 맞지 않으면 원하는 가치를 주지 못할 수 있다."]},
{"topic":"외적 탐색의 편향","q":"외적 탐색은 항상 정확한가? 기존 신념과 선호는 정보의 수집과 해석에 어떤 편향을 일으키는가?","a":["외부 정보를 새로 수집해도 소비자의 탐색과 해석은 편향될 수 있다. 소비자는 신뢰한다고 생각하는 출처만 반복적으로 이용하거나, 좋아하는 브랜드에 유리한 정보를 선택적으로 살펴볼 수 있다.","초기에 형성된 선호는 이후 어떤 정보를 찾는지와 그 정보를 어떻게 해석하는지에도 영향을 준다. 따라서 많은 정보를 찾았다는 사실만으로 균형 잡힌 판단을 했다고 볼 수는 없다."],"e":["특정 휴대전화 브랜드를 좋아하는 소비자가 긍정적인 리뷰만 찾아보고, 발열 문제를 지적하는 후기는 ‘사용자가 잘못 썼기 때문’이라고 해석할 수 있다.","판단을 보완하려면 경쟁 제품도 같은 조건에서 비교하고, 긍정적 후기와 부정적 후기의 근거 및 사용 환경을 함께 확인해야 한다."]},
{"topic":"외적 탐색의 단계와 수행 방식","q":"소비자는 외적 탐색을 어떤 단계와 순서로 수행하며, 브랜드별 탐색과 속성별 탐색은 어떻게 다른가?","a":["외적 탐색은 제품 범주와 대략적인 조건을 파악하는 초기 탐색, 예산과 필수 조건으로 후보를 줄이는 단계, 남은 후보의 세부 정보를 확인하는 후속 탐색으로 진행될 수 있다. 초기 선호는 이후 정보 수집과 해석에 영향을 줄 수 있다.","브랜드별 탐색은 한 브랜드의 여러 속성을 확인한 다음 다른 브랜드로 이동하는 방식이다. 속성별 탐색은 하나의 속성에 대해 여러 브랜드를 비교한 뒤 다음 속성으로 이동하는 방식이다. 소비자는 탐색 중 두 방식을 함께 사용할 수도 있다."],"e":["노트북을 살 때 먼저 용도와 예산을 정하고, 조건에 맞는 후보 세 개를 추린 뒤 배터리와 무게 등을 자세히 확인한다.","A 제품의 가격·무게·배터리를 모두 확인한 후 B 제품을 살펴보면 브랜드별 탐색이다. A·B·C의 가격을 먼저 비교하고 이어 세 제품의 무게를 비교하면 속성별 탐색이다."]}
]

<script>

const slides=JSON.parse(document.getElementById('slide-data').textContent),el=id=>document.getElementById(id);let index=0,revealed=false;
const ideal=slides.shift();
const originalQuestions=slides.slice();
function topicFromQuestion(code,q,i){const source=originalQuestions[i];return {code,q,topic:'교재 해설',a:[...source.a],e:[...source.e]}}
const textbookTopics=[
topicFromQuestion('7-1','문제 인식',0),
{...ideal,topic:'교재 해설'},
{code:'7-1b',q:'실제 상태: 우리가 현재 처한 상태',topic:'교재 해설',a:['실제 상태는 소비자가 현재 자신의 상황을 어떻게 지각하는지를 의미한다. 실제로 소유하고 사용하는 제품의 성능, 이용 경험, 자원의 부족 등을 바탕으로 현재 상태를 판단한다.','제품의 소진이나 노후화, 고장, 생활 여건의 변화 등으로 실제 상태가 달라질 수 있다. 현재 상태가 원하는 이상적 상태에 미치지 못한다고 느끼고 그 차이를 중요하게 여기면 문제를 인식할 수 있다.'],e:['샴푸가 거의 다 떨어져 머리를 감기 어려워진 상황은 실제 상태의 변화이다. 깨끗하게 머리를 감고 싶다는 이상적 상태는 그대로여도 현재 사용할 샴푸가 부족해지면 새로 구매할 필요를 느낀다.','반면 샴푸가 충분하고 사용에도 만족한다면, 같은 광고를 보더라도 구매 필요성을 크게 느끼지 않을 수 있다.']},
topicFromQuestion('7-2','내적 탐색: 기억으로부터의 정보 탐색',1),
{code:'7-2a',q:'얼마나 많이 내적 탐색을 수행하는가',topic:'교재 해설',a:['내적 탐색의 정도는 익숙한 브랜드 하나를 간단히 떠올리는 수준부터 관련된 지식과 감정, 경험을 폭넓게 검토하는 수준까지 다양하다.','동기가 높으면 관련 기억을 더 적극적으로 탐색할 수 있다. 능력은 기억에 저장된 지식과 경험을 활용할 수 있는 정도이며, 기회는 탐색에 쓸 시간과 주의의 여유이다. 시간 압박이나 주의 분산은 기억을 충분히 탐색하기 어렵게 만든다.'],e:['평소 마시던 생수를 고를 때는 익숙한 브랜드 하나만 떠올릴 수 있다. 반면 중요한 발표용 노트북을 고를 때는 이전 제품의 성능, 고장 경험, 서비스 만족도까지 자세히 떠올릴 수 있다.','다만 구매가 중요해도 제품 경험이 없거나 결정할 시간이 부족하면 내적 탐색에는 한계가 생긴다.']},
topicFromQuestion('7-2b','어떤 종류의 정보가 내적 탐색으로부터 인출되는가',2),
topicFromQuestion('7-2c','내적 탐색은 언제나 정확한가',3),
topicFromQuestion('7-3','외적 탐색: 환경으로부터 정보 탐색',4),
topicFromQuestion('7-3a','우리는 정보를 어디에서 탐색하는가',5),
topicFromQuestion('7-3b','우리는 외적 탐색을 얼마나 많이 수행하는가',6),
topicFromQuestion('7-3c','외적 탐색에서 어떤 종류의 정보가 수집되는가',7),
topicFromQuestion('7-3d','외적 탐색은 항상 정확한가',8),
topicFromQuestion('7-3e','우리는 외적 탐색을 어떻게 수행하는가',9)
];
const shortQuestions=[
{topic:'단답형 개념 설명 · 고려집합',q:'고려집합(consideration set)이란 무엇인가?',a:['고려집합은 소비자가 구매를 결정할 때 실제 선택 후보로 검토하는 대안들의 집합이다. 알고 있거나 기억에서 떠올린 모든 브랜드가 포함되는 것은 아니며, 예산과 목적 등에 맞는 대안만 후보가 될 수 있다.'],e:['운동화 브랜드 다섯 개를 알고 있어도 예산과 착용 목적에 맞는 A·B·C만 비교한다면 이 세 브랜드가 고려집합을 이룬다.']},
{topic:'단답형 개념 설명 · 접근성',q:'정보의 접근성(accessibility)이란 무엇인가?',a:['접근성은 기억에 저장된 정보를 얼마나 쉽고 빠르게 떠올릴 수 있는지를 의미한다. 반복해서 접하거나 최근에 떠올린 정보는 선택 순간에 쉽게 인출될 수 있다.'],e:['휴대전화 광고에서 배터리 지속시간을 여러 번 접한 뒤, 제품을 고를 때 다른 사양보다 배터리 정보가 먼저 떠오르는 경우이다.']},
{topic:'단답형 개념 설명 · 진단성',q:'정보의 진단성(diagnosticity)이란 무엇인가?',a:['진단성은 정보가 대안 간의 차이를 구별하고 판단하는 데 얼마나 유용한지를 의미한다. 쉽게 떠오르는 정보라도 모든 대안이 비슷한 값을 가진다면 선택을 구별하는 데는 유용하지 않을 수 있다.'],e:['노트북 세 제품의 저장 용량이 모두 같으면 그 정보로는 후보를 구별하기 어렵다. 반면 배터리 사용시간이 크게 다르고 오래 사용하는 것이 중요하다면 배터리 정보의 진단성이 높다.']},
{topic:'단답형 개념 설명 · 현저함',q:'정보의 현저함(salience)이란 무엇인가?',a:['현저함은 정보가 주변의 다른 정보에 비해 두드러져 주의를 끄는 정도이다. 현저한 정보는 기억되거나 회상될 가능성이 높지만, 실제 비교에 유용한 진단적 정보와 반드시 일치하지는 않는다.'],e:['제품 포장에 크게 표시된 한정판 문구는 눈에 잘 띈다. 그러나 소비자가 알레르기 성분을 확인해야 한다면 작은 글씨의 성분 정보가 판단에는 더 중요할 수 있다.']},
{topic:'단답형 개념 설명 · 확증 편향',q:'확증 편향(confirmation bias)이란 무엇인가?',a:['확증 편향은 기존 신념이나 선호를 지지하는 정보를 더 주목하거나 떠올리고, 그에 맞추어 정보를 해석하려는 경향이다. 기억을 이용하는 내적 탐색과 새 정보를 수집하는 외적 탐색 모두에서 나타날 수 있다.'],e:['좋아하는 브랜드의 긍정적 후기는 신뢰하면서 같은 브랜드의 부정적 후기는 특별한 예외라고 생각하는 경우이다.']},
{topic:'단답형 개념 설명 · 억제',q:'내적 탐색에서 억제(inhibition)란 무엇인가?',a:['억제는 특정 정보를 회상하는 과정이 다른 관련 정보의 회상을 방해하는 현상이다. 그 결과 소비자는 판단에 필요한 속성을 충분히 떠올리지 못하고 일부 정보에 치우칠 수 있다.'],e:['노트북의 저렴한 가격을 반복해서 떠올리는 동안 이전에 확인했던 짧은 배터리 지속시간을 떠올리지 못해 선택에서 빠뜨리는 경우이다.']},
{topic:'단답형 개념 설명 · 구매 전 탐색',q:'구매 전 탐색(prepurchase search)이란 무엇인가?',a:['구매 전 탐색은 현재 인식한 구매 문제를 해결하고 구매 결정을 내리기 위해 수행하는 정보 탐색이다. 필요한 제품을 비교하고 선택의 불확실성을 줄이는 데 목적이 있다.'],e:['고장 난 냉장고를 이번 주에 교체하기 위해 판매점 가격과 크기, 배송일을 비교하는 경우이다.']},
{topic:'단답형 개념 설명 · 지속적 탐색',q:'지속적 탐색(ongoing search)이란 무엇인가?',a:['지속적 탐색은 당장의 구매 필요와 관계없이 제품 범주에 대한 관심이나 탐색 자체의 즐거움 때문에 계속 정보를 수집하는 것이다. 축적된 지식은 미래의 구매에 활용될 수 있다.'],e:['자동차를 당장 살 계획은 없지만 관심이 있어 평소 신차 리뷰와 시승기를 꾸준히 보는 경우이다.']},
{topic:'단답형 개념 설명 · 탐색적 속성',q:'탐색적 속성(search attribute)이란 무엇인가?',a:['탐색적 속성은 제품을 구매하거나 사용하기 전에 정보 탐색으로 비교·평가하기 쉬운 속성이다. 가격, 크기, 무게, 표시된 사양 등이 이에 해당한다.'],e:['노트북을 구매하기 전에 제품 설명에서 무게 1.2kg, 저장 용량 512GB, 가격 100만 원을 확인하고 다른 제품과 비교하는 경우이다.']},
{topic:'단답형 개념 설명 · 경험적 속성',q:'경험적 속성(experience attribute)이란 무엇인가?',a:['경험적 속성은 제품이나 서비스를 직접 사용하거나 경험해야 평가하기 쉬운 속성이다. 구매 전 설명이나 후기는 판단을 도울 수 있지만 자신의 실제 경험을 완전히 대신하지는 못할 수 있다.'],e:['신발의 실제 착용감이나 헤드폰을 오래 썼을 때의 편안함은 사양표만으로 충분히 판단하기 어려워 직접 착용해 보는 것이 도움이 된다.']}
];
slides.splice(0,slides.length,...textbookTopics,...originalQuestions,...shortQuestions);
const terminology=[
['문제 인식','Problem Recognition'],['문제인식','Problem Recognition'],
['이상적 상태','Ideal State'],['실제 상태','Actual State'],['현재 상태','Actual State'],
['내적 탐색','Internal Search'],['외적 탐색','External Search'],
['동기·능력·기회','Motivation, Ability, Opportunity; MAO'],
['동기','Motivation'],['능력','Ability'],['기회','Opportunity'],
['고려집합','Consideration Set'],['브랜드 회상','Brand Recall'],
['속성 회상','Attribute Recall'],['평가 회상','Evaluation Recall'],['경험 회상','Experience Recall'],
['전형성','Prototypicality'],['친숙성','Familiarity'],['브랜드 신호','Brand Cues'],
['접근성','Accessibility'],['진단성','Diagnosticity'],['현저함','Salience'],['생생함','Vividness'],
['자서전적 기억','Autobiographical Memory'],['온라인 처리','Online Processing'],
['확증 편향','Confirmation Bias'],['억제','Inhibition'],['기분','Mood'],
['구매 전 탐색','Prepurchase Search'],['지속적 탐색','Ongoing Search'],
['소매점 탐색','Retailer Search'],['개인 상호 간 탐색','Interpersonal Search'],
['독립적 탐색','Independent Search'],['체험적 탐색','Experiential Search'],
['검색 엔진','Search Engine'],['관여도','Involvement'],['지각된 위험','Perceived Risk'],
['주관적 지식','Subjective Knowledge'],['객관적 지식','Objective Knowledge'],
['인지 능력','Cognitive Ability'],['탐색적 속성','Search Attribute'],['경험적 속성','Experience Attribute'],
['브랜드별 탐색','Search by Brand'],['속성별 탐색','Search by Attribute'],
['재인','Recognition'],['회상','Recall']
].sort((a,b)=>b[0].length-a[0].length);
// Match all terms in one pass so longer concepts keep their own translation.
const termMap=new Map(terminology);
const termPattern=new RegExp(terminology.map(([ko])=>ko).join('|'),'g');
function bilingual(text){
 const seen=new Set();
 return text.replace(termPattern,(ko,offset)=>{
  const following=text.slice(offset+ko.length);
  if(seen.has(ko)||/^\s*\(/.test(following))return ko;
  seen.add(ko);
  return ko+' ('+termMap.get(ko)+')';
 });
}
slides.forEach(s=>{s.q=bilingual(s.q);s.a=s.a.map(bilingual);s.e=s.e.map(bilingual)});
let questionCount=0;slides.forEach(s=>{s.label=s.code||String(++questionCount).padStart(2,'0')});
const numberStyle=document.createElement('style');numberStyle.textContent='.question{grid-template-columns:120px minmax(0,1fr)}.number:has(.textbook-number){font-size:32px;padding-top:8px}.number:has(.textbook-number) small{display:none}.jump b{min-width:46px;flex-shrink:0}@media(max-width:850px){.question{grid-template-columns:100px minmax(0,1fr)}.number:has(.textbook-number){font-size:27px}}@media(max-width:480px){.question{grid-template-columns:1fr}}';document.head.append(numberStyle);
function paragraphs(target,items){target.replaceChildren(...items.map(text=>{const p=document.createElement('p');p.textContent=text;return p}))}
function render(){revealed=false;const s=slides[index];el('question').textContent=s.q;el('topic').textContent=s.code?'교재 해설':s.topic;paragraphs(el('answer'),s.a);paragraphs(el('example'),s.e);el('number').textContent=s.label;el('number').classList.toggle('textbook-number',Boolean(s.code));el('page').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;el('counter').textContent=(index+1)+' / '+slides.length;el('progress').style.width=((index+1)/slides.length*100)+'%';el('answers').hidden=!revealed;el('reveal').textContent=revealed?'개념 해설·예시 숨기기':'개념 해설·예시 보기';el('reveal').setAttribute('aria-expanded',String(revealed));el('prev').disabled=index===0;el('next').disabled=index===slides.length-1;document.querySelectorAll('.jump').forEach((b,i)=>{b.classList.toggle('current',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});window.scrollTo(0,0)}
function move(delta){if(index+delta<0||index+delta>=slides.length)return;index+=delta;render()}
function toggle(){revealed=!revealed;el('answers').hidden=!revealed;el('reveal').textContent=revealed?'개념 해설·예시 숨기기':'개념 해설·예시 보기';el('reveal').setAttribute('aria-expanded',String(revealed))}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('reveal').onclick=toggle;el('list').onclick=()=>el('map').showModal();el('close').onclick=()=>el('map').close();
el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{el('full').textContent='전체화면 사용 불가'}};
document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'전체화면 종료':'전체화면');
el('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(el('map').open||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'&&!e.target.matches('button')){e.preventDefault();toggle()}else if(e.key==='Home'){e.preventDefault();index=0;render()}else if(e.key==='End'){e.preventDefault();index=slides.length-1;render()}});
slides.forEach((s,i)=>{const b=document.createElement('button'),n=document.createElement('b'),t=document.createElement('span');b.className='jump';n.textContent=s.label;t.textContent=s.q;b.append(n,t);b.onclick=()=>{index=i;render();el('map').close();el('reveal').focus()};el('map-content').append(b);const article=document.createElement('article');article.className='print-item';const h=document.createElement('h1');h.textContent=s.label+' · '+s.q;article.append(h);[['개념 해설',s.a],['예시로 이해하기',s.e]].forEach(([label,items])=>{const heading=document.createElement('h2'),body=document.createElement('div');heading.textContent=label;paragraphs(body,items);article.append(heading,body)});el('print-view').append(article)});
const jumpButtons=[...el('map-content').children];
[[0,'교재 해설 · 13개 주제'],[13,'복습 · 주요 질문 01~10'],[23,'복습 · 단답형 개념 설명 11~20']].forEach(([i,title])=>{const h=document.createElement('h3');h.textContent=title;h.style.cssText='grid-column:1 / -1;margin:18px 0 7px;font-size:17px';el('map-content').insertBefore(h,jumpButtons[i])});
render();
</script></body></html>
