<script>
const slides=[{"kind": "concept", "title": "사이코그래픽스 (Psychographics)", "answer": "가치·개성·라이프스타일 등 심리적 특성을 활용해 소비자를 이해하는 접근이다. 인구통계가 누구인지를 보여 준다면 사이코그래픽스는 무엇을 중요하게 여기고 어떻게 살아가는지를 더 살펴보게 한다.", "example": "나이와 소득이 비슷해도 한 사람은 야외 활동에, 다른 사람은 집에서의 취미에 예산을 쓸 수 있다."}, {"kind": "concept", "title": "가치와 가치 체계", "answer": "가치는 바람직한 결과나 행동 방식에 관한 지속적인 믿음이다. 가치 체계는 여러 가치와 그 상대적 중요성의 구조이다. 같은 가치들을 지녀도 우선순위가 다르면 선택이 달라질 수 있다.", "example": "두 사람 모두 안전과 자유를 중시해도 여행에서 안전을 우선하는 사람과 자유로운 일정을 우선하는 사람의 선택은 다르다."}, {"kind": "concept", "title": "궁극적 가치와 수단적 가치", "answer": "궁극적 가치는 추구하는 바람직한 최종 상태이고 수단적 가치는 그 상태에 이르는 바람직한 행동 방식이다. 제품 속성 자체와 삶의 목표를 구분해야 한다.", "example": "가족의 안전은 최종 목표가 될 수 있고, 책임 있게 행동하고 신중히 선택하는 태도는 그 목표를 위한 수단이 될 수 있다."}, {"kind": "concept", "title": "핵심 가치와 가치 간 관계", "answer": "핵심 가치는 가치 체계의 중심으로 여러 상황에 걸쳐 적용된다. 어떤 가치들은 서로 보완하고 다른 가치들은 충돌한다. 소비에서는 성장·자율성, 안정·안전, 타인에 대한 관심 등의 균형이 드러날 수 있다.", "example": "새로운 경험을 원하는 마음과 익숙한 환경에서 안전하게 쉬고 싶은 마음이 휴가지 선택에서 충돌할 수 있다."}, {"kind": "concept", "title": "물질주의와 경험 소비", "answer": "물질주의는 소유물과 물질적 획득을 삶과 성공의 중심으로 두는 경향이다. 경험 소비는 활동과 사건에서 얻는 경험에 초점을 둔다. 물건도 경험을 제공할 수 있으므로 두 범주를 단순히 나누지 않는다.", "example": "악기를 사는 것은 물건 구매이지만 가족과 연주하는 경험을 얻기 위한 소비일 수 있다."}, {"kind": "concept", "title": "쾌락·개인주의·일과 여가의 가치", "answer": "즐거움, 자기 결정과 개성 표현, 일과 여가의 균형은 제품과 서비스의 편익 평가에 영향을 준다. 여러 가치가 동시에 작용하며 문화와 개인에 따라 중요성이 달라진다.", "example": "가사 서비스를 구매해 여가 시간을 확보하는 것은 편리함과 일상 균형의 가치를 반영할 수 있다."}, {"kind": "concept", "title": "건강·가족·진정성·환경 가치", "answer": "교재는 건강과 젊음, 가정과 가족, 진정성, 환경 등에 대한 가치를 다룬다. 마케터는 실제 제품·서비스가 그 가치에 어떻게 기여하는지 연결해야 하며 가치 표현과 행동이 항상 일치하는 것은 아니다.", "example": "전통 제작 방식을 중시하는 소비자에게는 역사뿐 아니라 실제 제작 과정과 재료 정보를 제공한다."}, {"kind": "concept", "title": "가치의 형성과 변화", "answer": "가치는 가족·문화·사회화, 매체, 경제 환경, 사회계층과 생애 경험 등의 영향을 받는다. 비교적 지속적이지만 사회와 역할이 바뀌면 중요성이 달라질 수 있다.", "example": "돌봄 역할을 맡은 뒤 개인 여가보다 가족의 안전과 시간 관리에 우선순위를 둘 수 있다."}, {"kind": "concept", "title": "문화 자료로 가치 추론하기", "answer": "광고·방송·패션·제품 등 문화적 자료에 나타난 표현을 분석해 사회적 가치를 추론할 수 있다. 그러나 매체가 보여 주는 이미지가 모든 소비자의 실제 가치나 행동을 대표하지는 않는다.", "example": "여러 시기의 광고에서 자유·가족·성공 표현을 비교하면 어떤 가치가 강조되는지 탐색할 수 있다."}, {"kind": "concept", "title": "수단–목적 사슬과 래더링 (Laddering)", "answer": "래더링은 소비자가 제품을 선호하는 이유를 반복해서 질문하여 궁극적인 가치관까지 탐색하는 심층면접 기법이다. 영어 Ladder는 사다리를 뜻한다. 속성(Attribute, A) → 혜택·결과(Consequence, C) → 가치(Value, V)의 순서로 ‘왜 그것이 중요한가’를 물으며 제품과 내면적 가치의 연결을 파악한다.", "example": "속성(A): ‘왜 이 자동차를 선택했습니까?’ → ‘안전장치가 우수해서.’ 결과(C): ‘안전장치가 왜 중요합니까?’ → ‘사고 시 가족을 보호할 수 있어서.’ 가치(V): ‘가족 보호가 왜 중요합니까?’ → ‘가족의 행복과 안정이 가장 중요해서.’"}, {"kind": "concept", "title": "가치 질문지: RVS와 LOV", "answer": "질문지를 통해 가치의 중요도를 측정하고 비교할 수 있다. 로키치 가치 조사(RVS)와 가치 목록(LOV) 등이 예이다. 응답은 언어·문화·문항과 자기표현의 영향을 받을 수 있어 다른 자료와 함께 해석한다.", "example": "가족 안전을 중요하게 평가한 응답과 실제 구매의 가격·안전 선택을 함께 살펴본다."}, {"kind": "concept", "title": "개성 (Personality)", "answer": "개성은 생각·감정·행동에서 나타나는 비교적 일관된 개인적 패턴이다. 무엇이 바람직한지에 관한 가치와 구분된다. 같은 가치를 가진 사람도 개성과 상황 때문에 다른 방식으로 행동할 수 있다.", "example": "건강을 중시해도 새 운동에 도전하는 사람과 익숙한 운동을 꾸준히 하는 사람의 행동은 다르다."}, {"kind": "concept", "title": "5요인 성격 모형 (Big Five)", "answer": "경험에 대한 개방성, 성실성, 외향성, 우호성, 신경성의 다섯 차원으로 성격을 살펴본다. 신경성의 반대 방향을 정서적 안정성으로 표현하기도 한다. 각 차원은 연속적인 정도이며 구매를 결정하는 낙인이나 진단이 아니다.", "example": "새 경험에 대한 선호와 계획적인 정보 탐색은 서로 다른 성격 차원에서 살펴볼 수 있다."}, {"kind": "concept", "title": "통제 소재 (Locus of Control)", "answer": "결과의 원인을 자신의 행동·능력 등 내부에 두는지, 운·타인·환경 등 외부에 두는지와 관련된다. 만족·불만족과 대응에 영향을 줄 수 있지만 실제 책임과 개인의 귀인을 구분해야 한다.", "example": "제품 설정 실패를 자신의 사용 미숙으로 해석하는 경우와 설명·서비스 부족으로 해석하는 경우를 비교할 수 있다."}, {"kind": "concept", "title": "인지 욕구 (Need for Cognition)", "answer": "생각하고 분석하는 활동을 즐기려는 성향이다. 높은 소비자는 논거와 상세 비교에 주목할 수 있다. 낮은 소비자에게는 간결한 설명과 쉬운 단서가 유용할 수 있지만 지능이나 능력의 높낮이를 뜻하지 않는다.", "example": "한 소비자는 노트북 성능표를 읽는 과정을 즐기고 다른 소비자는 핵심 용도별 추천부터 보고 싶어 할 수 있다."}, {"kind": "concept", "title": "독특성 욕구와 자극 추구", "answer": "독특성 욕구는 소비를 통해 다른 사람과 차별화하려는 성향이다. 자극을 추구하는 성향은 새로움·흥분과 관련된다. 맞춤화·새 경험이 소구할 수 있지만 두 특성이 완전히 같은 것은 아니다.", "example": "직접 색을 조합한 가방은 차별화에, 새로운 체험 상품은 자극 추구에 관련될 수 있다."}, {"kind": "concept", "title": "경쟁성·자기 감시·독단성", "answer": "경쟁성은 타인보다 앞서려는 성향, 자기 감시는 사회적 단서에 맞춰 자기표현을 조절하는 경향이다. 독단성은 기존 신념을 경직되게 유지하는 경향과 관련된다. 한 특성만으로 소비자를 설명하지 않는다.", "example": "모임에 따라 옷차림을 조절하는 것과 남보다 먼저 신제품을 갖고 싶어 하는 것은 서로 다른 초점이다."}, {"kind": "concept", "title": "정치 성향과 소비 해석의 한계", "answer": "교재는 정치 성향이 가치·개성 및 소비와 관련될 수 있음을 다룬다. 관찰된 연관을 개인의 취향에 대한 확정적 예측이나 인과관계로 해석해서는 안 된다. 문화·상황·자원 등의 다른 요인도 함께 고려한다.", "example": "친환경 제품을 고른 한 번의 행동만으로 특정 정치 성향을 추정할 수 없다."}, {"kind": "concept", "title": "라이프스타일과 AIO", "answer": "라이프스타일은 일상적인 활동(Activities), 관심사(Interests), 의견(Opinions)으로 표현되는 생활 방식이다. 절약·지속 가능성·미니멀리즘 같은 패턴도 실제 활동과 상황을 함께 확인해야 한다.", "example": "주말 자전거 이용은 활동, 자전거 장비에 대한 관심은 관심사, 교통 정책에 대한 견해는 의견이다."}, {"kind": "concept", "title": "VALS: 동기와 자원의 결합", "answer": "VALS는 이상·성취·자기표현의 주요 동기와 자원을 결합한 세분화 틀이다. 사고자·신봉자, 성취자·노력가, 체험자·제작자, 혁신자·생존자라는 여덟 집단을 다룬다. 자원은 돈만이 아니며 이 틀을 모든 국가와 개인에게 자동 적용하지 않는다.", "example": "비슷한 자기표현 동기라도 자원과 생활 조건에 따라 새로운 체험과 직접 제작 활동 중 다른 방식으로 표현될 수 있다."}, {"kind": "problem", "topic": "사이코그래픽스", "title": "나이·소득이 같은 두 소비자가 등산 장비와 홈카페에 각각 지출한다. 추가로 무엇을 조사해야 하는가?", "answer": "가치·개성·활동·관심사·의견을 조사해야 한다. 인구통계만으로 포착하지 못한 동기와 생활 방식을 살펴 실제 선택 이유와 상황을 확인한다.", "example": "같은 예산도 건강·사회적 교류·집에서의 휴식 중 무엇을 중시하는지에 따라 다르게 쓰인다."}, {"kind": "problem", "topic": "가치 체계", "title": "안전과 자유를 모두 중요하게 생각하는 두 사람이 다른 여행 상품을 고른 이유를 설명하라.", "answer": "가치의 보유 여부뿐 아니라 상대적 중요성이 다를 수 있다. 하나는 안전하고 정해진 일정, 다른 하나는 자유로운 탐색을 더 우선할 수 있으며 실제 상황도 함께 봐야 한다.", "example": "가치 체계는 여러 가치의 우선순위를 포함한다."}, {"kind": "problem", "topic": "가치의 종류", "title": "‘가족의 안전을 위해 책임감 있게 제품을 고른다’를 궁극적·수단적 가치로 구분하라.", "answer": "가족의 안전은 추구하는 최종 상태인 궁극적 가치, 책임 있게 행동하는 것은 그 목표를 위한 수단적 가치로 이해할 수 있다. 제품의 기능은 이 목표와 연결되는 별도의 속성이다.", "example": "안전장치는 속성이고 가족을 보호한다는 것은 그보다 깊은 의미이다."}, {"kind": "problem", "topic": "물질주의", "title": "고가의 악기를 산 사람을 곧바로 물질주의자라고 판단할 수 있는가?", "answer": "판단할 수 없다. 소유와 지위 자체가 삶의 중심인지, 연주·관계·자기성장의 경험이 목적인지 조사해야 한다. 지출 금액만으로 가치의 중심을 알 수 없다.", "example": "가족과 합주하기 위해 오래 쓸 악기를 선택했을 수 있다."}, {"kind": "problem", "topic": "가치와 편익", "title": "일과 여가의 균형을 중시하는 소비자에게 가사 서비스의 어떤 편익을 설명할 수 있는가?", "answer": "절약한 시간을 가족·취미·휴식에 쓸 수 있다는 편익을 연결한다. 실제 절약 시간과 서비스 품질·비용을 구체적으로 설명해야 가치에 대한 선언을 넘어설 수 있다.", "example": "예약의 유연성과 작업 후 관리 부담도 실제 생활 균형에 영향을 준다."}, {"kind": "problem", "topic": "가치 변화", "title": "자녀 출생 후 상품 선택에서 안전과 편리함을 더 중시했다. 가치의 지속성과 모순되는가?", "answer": "반드시 모순되지 않는다. 가치는 비교적 지속적이지만 생애 경험과 역할 변화로 상대적 중요성이 달라질 수 있다. 기존 가치가 사라졌다고 단정하지 않는다.", "example": "자유를 계속 중시하면서도 당분간 가족 안전을 더 우선할 수 있다."}, {"kind": "problem", "topic": "가치 추론", "title": "광고에서 친환경 표현이 늘었다는 사실만으로 소비자들이 모두 친환경 제품을 산다고 결론 내려도 되는가?", "answer": "안 된다. 문화 자료는 강조되는 가치를 추론하는 단서이며 개인의 실제 가치와 행동을 직접 증명하지 않는다. 설문·면접·구매와 사용 자료로 보완해야 한다.", "example": "환경에 관심이 있어도 가격과 이용 편의 때문에 선택이 달라질 수 있다."}, {"kind": "problem", "topic": "래더링", "title": "‘가벼운 노트북이 좋다’는 응답에서 수단–목적 사슬을 만들고 후속 질문을 제안하라.", "answer": "래더링(Laddering)은 제품을 선호하는 이유를 반복해서 질문하여 궁극적인 가치관을 탐색하는 심층면접 기법이다. Ladder는 ‘사다리’라는 뜻이다. 핵심 구조는 속성(Attribute, A) → 혜택·결과(Consequence, C) → 가치(Value, V)이다. 이 문제에서는 가벼움(A) → 이동 부담 감소(C) → 자유로운 생활이나 성취(V)라는 연결을 가정할 수 있다. ‘가벼우면 어떤 점이 좋습니까?’, ‘이동 부담이 줄면 왜 중요합니까?’처럼 질문하고, 실제 가치 연결은 응답을 통해 확인한다.", "example": "자동차 사례: 속성(A)은 ‘왜 이 자동차를 선택했습니까?’ → ‘안전장치가 우수해서.’ 결과(C)는 ‘안전장치가 왜 중요합니까?’ → ‘사고 시 가족을 보호할 수 있어서.’ 가치(V)는 ‘가족 보호가 왜 중요합니까?’ → ‘가족의 행복과 안정이 가장 중요해서.’ 이처럼 ‘왜 그것이 중요한가’를 반복하여 소비자의 내면적 가치를 파악한다."}, {"kind": "problem", "topic": "가치 측정", "title": "LOV 설문에서 가족 안전을 높게 평가한 응답자들이 가장 저렴한 제품을 샀다. 어떻게 해석해야 하는가?", "answer": "가치와 행동이 자동으로 일치하지 않음을 살펴야 한다. 가격 제약, 안전성 정보, 대안과 응답의 자기표현 영향을 확인한다. 설문 하나로 응답이 거짓이라고 단정하지 않는다.", "example": "선택 가능한 제품이 모두 기본 안전 요건을 갖췄다고 생각했을 수 있다."}, {"kind": "problem", "topic": "개성과 가치", "title": "두 사람 모두 건강을 중시하지만 한 사람은 새로운 운동, 다른 사람은 정기적인 걷기를 선택했다. 설명하라.", "answer": "건강이라는 가치가 같아도 개방성·계획성 등의 개성과 시간·비용·환경이 다를 수 있다. 가치가 무엇을 중시하는지라면 개성은 반응과 행동의 패턴에 초점을 둔다.", "example": "같은 목표에 도달하는 활동 방식이 다를 수 있다."}, {"kind": "problem", "topic": "Big Five", "title": "새로운 경험을 즐기는 성향과 계획을 세워 꾸준히 수행하는 성향을 각각 어떤 차원으로 살펴볼 수 있는가?", "answer": "앞은 경험에 대한 개방성, 뒤는 성실성과 관련해 살펴볼 수 있다. 두 특성은 동시에 존재할 수 있으며 짧은 사례만으로 전체 성격이나 구매를 확정하지 않는다.", "example": "새 운동을 계획적으로 배우는 사람은 두 특성을 함께 보일 수 있다."}, {"kind": "problem", "topic": "인지 욕구", "title": "상세 성능표를 즐겨 보는 고객과 핵심 추천을 먼저 원하는 고객에게 정보를 어떻게 제공할 것인가?", "answer": "핵심 편익 요약과 상세 비교 자료를 함께 제공해 정보 처리 선호에 맞게 선택하도록 한다. 인지 욕구의 차이를 지능이나 제품 이해 능력의 우열로 보지 않는다.", "example": "첫 화면에는 용도별 요약을, 별도 영역에는 근거와 사양을 제공할 수 있다."}, {"kind": "problem", "topic": "독특성·자기 감시", "title": "직접 색을 조합한 가방을 고르는 행동과 모임에 맞춰 복장을 바꾸는 행동을 비교하라.", "answer": "앞은 차별화를 추구하는 독특성 욕구, 뒤는 사회적 단서에 맞춰 자기표현을 조절하는 자기 감시와 관련될 수 있다. 실제 동기는 면접으로 확인해야 한다.", "example": "같은 사람이 자기 스타일을 유지하면서도 상황에 맞게 조절할 수 있다."}, {"kind": "problem", "topic": "AIO", "title": "‘주말에 캠핑함·장비에 관심 있음·자연보호가 중요하다고 봄’을 AIO로 분류하라.", "answer": "캠핑은 활동, 장비에 대한 관심은 관심사, 자연보호에 대한 견해는 의견이다. 세 정보를 함께 보면 라이프스타일을 더 구체적으로 이해할 수 있다.", "example": "활동만 같아도 장비와 환경에 대한 관심 수준은 다를 수 있다."}, {"kind": "problem", "topic": "VALS 적용", "title": "자기표현 동기가 비슷한 소비자들이 다른 상품을 고르는 이유를 VALS 관점과 한계까지 설명하라.", "answer": "자원과 생활 조건이 달라 자기표현의 방식이 달라질 수 있다. VALS는 동기와 자원을 함께 보지만 모든 국가와 개인을 자동 분류하는 규칙은 아니므로 현지 조사와 행동 자료로 검증해야 한다.", "example": "새 체험을 즐기는 소비와 직접 만들기를 통한 표현이 다른 형태로 나타날 수 있다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제14장 · 사이코그래픽스: 가치, 개성, 라이프스타일';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
