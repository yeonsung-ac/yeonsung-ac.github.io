      "고려집합(Consideration Set)은 소비자가 실제 선택 후보로 비교하는 대안의 집합이다. 알고 있는 모든 브랜드가 포함되는 것은 아니다.",
      "예산과 목적, 기억과 정보에 따라 후보가 정해진다. 후보 수와 비교 구성이 선택의 부담과 평가에 영향을 줄 수 있으므로 적절히 좁히고 보완해야 한다."
    ],
    "e": [
      "가상의 학생이 노트북 브랜드를 다섯 개 알아도 예산과 용도에 맞는 세 모델만 비교한다면 그 세 모델이 고려집합이다.",
      "새로운 조건에 적합한 모델을 놓쳤다면 후보를 다시 검토할 수 있다. 처음 만든 집합이 항상 완전한 것은 아니다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"아는 브랜드 전체가 고려집합은 아니다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">알고 있는 대안</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">기억과 새 정보</text><path d=\"M280 95v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">고려집합</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">실제로 비교하는 후보</text><path d=\"M280 203v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">최종 선택</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">목적과 기준으로 결정</text></svg><figcaption>아는 브랜드 전체가 고려집합은 아니다.</figcaption></figure>"
  },
  {
    "label": "07",
    "topic": "개념 해설",
    "q": "중요한 선택 기준과 맥락 효과",
    "a": [
      "가격·성능·편의·안전 등 기준의 중요도는 소비자의 목표와 사용 상황, 선택 시점에 따라 달라질 수 있다. 처음부터 모든 속성의 중요도가 고정된 것은 아니다.",
      "어떤 대안을 함께 제시하는지와 정보의 표현 방식도 비교에 영향을 준다. 유인 효과나 중간 대안의 매력처럼 상대적 구성에서 생기는 선택을 구분해야 한다."
    ],
    "e": [
      "가상의 학생이 통학용 노트북을 고르면 무게와 배터리를 중시하고, 영상 편집이 목적이면 처리 성능을 더 중시할 수 있다.",
      "비싼 고성능 모델이 추가되어 중간 모델이 합리적으로 보이더라도 실제 용도와 예산에 맞는지 따로 확인해야 한다."
    ]
  },
  {
    "label": "08",
    "topic": "개념 해설 · 그림과 예시",
    "q": "보완적 모형과 가중합계",
    "a": [
      "보완적 모형(Compensatory Model)은 한 속성의 약점을 다른 속성의 강점이 상쇄할 수 있는 선택 방식이다. 여러 평가를 종합하여 대안을 비교한다.",
      "가중합계는 속성별 평가에 중요도를 곱한 뒤 더하는 방식이다. 점수 척도와 방향을 일치시켜야 하며 숫자는 소비자의 평가와 중요도 가정을 표현한다."
    ],
    "e": [
      "가상의 노트북 평가에서 성능 중요도를 0.4, 배터리 중요도를 0.6으로 정한다. 5점 척도에서 A는 성능 3·배터리 5, B는 성능 5·배터리 3이라고 하자.",
      "A는 3×0.4+5×0.6=4.2, B는 5×0.4+3×0.6=3.8이다. 이 가정에서는 A가 높지만 중요도를 바꾸면 결과도 달라질 수 있다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"높은 총점과 필수 조건 충족은 다른 선택 논리이다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">보완적 규칙</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">약점을 다른 속성의 강점으로 상쇄</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">비보완적 규칙</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">필수 조건 미달은 다른 장점으로 대체 불가</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">확인</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">상쇄할 조건과 반드시 지킬 조건 구분</text></svg><figcaption>높은 총점과 필수 조건 충족은 다른 선택 논리이다.</figcaption></figure>"
  },
  {
    "label": "09",
    "topic": "개념 해설 · 그림과 예시",
    "q": "비보완적 모형과 필수 조건",
    "a": [
      "비보완적 모형(Noncompensatory Model)은 특정 속성의 부족을 다른 장점으로 상쇄하지 않는 규칙을 사용한다. 필수 조건과 중요한 속성에 따라 후보를 제한할 수 있다.",
      "정보처리의 부담을 줄일 수 있지만 종합하면 매력적일 대안을 제외할 수도 있다. 왜 해당 조건이 필수인지 목적과 연결해야 한다."
    ],
    "e": [
      "가상의 학생이 가방에 넣고 이동해야 하므로 무게 1.4kg 이하를 필수 조건으로 정한다. 무거운 모델은 성능이 좋아도 제외한다.",
      "이 경우 높은 성능 점수가 무게의 부족을 보완하지 않는다. 총점을 더하는 방식과 선택 원리가 다르다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"높은 총점과 필수 조건 충족은 다른 선택 논리이다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">보완적 규칙</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">약점을 다른 속성의 강점으로 상쇄</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">비보완적 규칙</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">필수 조건 미달은 다른 장점으로 대체 불가</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">확인</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">상쇄할 조건과 반드시 지킬 조건 구분</text></svg><figcaption>높은 총점과 필수 조건 충족은 다른 선택 논리이다.</figcaption></figure>"
  },
  {
    "label": "10",
    "topic": "개념 해설 · 그림과 예시",
    "q": "결합적 모형과 분리적 모형",
    "a": [
      "결합적 모형(Conjunctive Model)은 정한 속성들의 최소 기준을 모두 충족해야 후보로 남긴다. 분리적 모형(Disjunctive Model)은 선택한 중요한 속성 중 적어도 하나의 높은 기준을 충족하면 후보로 남길 수 있다.",
      "모든 조건을 만족해야 하는지, 하나의 강한 장점으로도 통과하는지 구분해야 한다. 이 규칙은 후보를 걸러내는 방식이며 남은 대안에서 추가 비교가 필요할 수 있다."
    ],
    "e": [
      "가상의 학생이 가격 120만 원 이하, 무게 1.4kg 이하, 배터리 10시간 이상을 모두 요구하면 결합적 규칙이다. 하나라도 미달하면 탈락한다.",
      "“배터리가 매우 길거나 화면 품질이 탁월하면 후보로 넣는다”는 규칙은 분리적 방식의 예이다. 두 기준의 통과 방식이 다르다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 226\" role=\"img\" aria-label=\"후보를 거르는 조건의 연결 방식이 다르다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">결합적</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">정한 최소 기준을 모두 통과</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">분리적</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">핵심 속성 하나 이상의 높은 기준 통과</text></svg><figcaption>후보를 거르는 조건의 연결 방식이 다르다.</figcaption></figure>"
  },
  {
    "label": "11",
    "topic": "개념 해설 · 그림과 예시",
    "q": "속성별 선택: 사전편집식과 속성별 제거",
    "a": [
      "사전편집식 모형(Lexicographic Model)은 가장 중요한 속성에서 우수한 대안을 고르고 동률이면 다음 속성을 비교한다. 다른 약점의 총점 보완을 요구하지 않는다.",
      "속성별 제거(Elimination by Aspects)는 속성과 기준을 순차적으로 적용하여 미달 대안을 제외한다. 가장 높은 값을 고르는지, 기준 통과 여부로 거르는지를 구분해야 한다."
    ],
    "e": [
      "가상의 학생이 배터리가 가장 긴 노트북을 고르고 동률일 때 무게를 비교하면 사전편집식이다.",
      "먼저 예산 기준으로 거르고, 이어 무게 기준으로 제외한 뒤 남은 후보를 비교하면 속성별 제거의 예이다. 같은 속성 정보도 규칙에 따라 쓰임이 다르다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"가장 높은 값의 선택과 최소 조건 통과를 구분한다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">사전편집식</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">가장 중요한 속성의 우수성부터 비교</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">속성별 제거</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">속성의 기준 미달 후보를 순차 탈락</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">같은 정보 · 다른 규칙</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">중요도와 통과 기준을 명확히 정의</text></svg><figcaption>가장 높은 값의 선택과 최소 조건 통과를 구분한다.</figcaption></figure>"
  },
  {
    "label": "12",
    "topic": "개념 해설 · 그림과 예시",
    "q": "이익·손실·준거점과 프레이밍",
    "a": [
      "소비자는 결과를 절대 금액만이 아니라 준거점에 비춘 이익과 손실로 해석할 수 있다. 같은 크기의 변화도 손실로 느끼는지에 따라 반응이 달라질 수 있다.",
      "프레이밍은 같은 사실을 어떤 관점과 형식으로 제시하는가이다. 표현이 평가에 영향을 주어도 실제 수량과 거래 조건은 동일하게 비교해야 한다."
    ],
    "e": [
      "가상의 광고에서 지방 25%와 살코기 75%라는 표현은 같은 구성을 다른 관점으로 보여 준다.",
      "월별 비용을 작게 표시해도 계약 기간 전체의 지출은 따로 계산해야 한다. 느낌의 차이와 실제 조건의 차이를 구분한다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"표현이 달라져도 거래 조건을 같은 단위로 확인한다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">이익 관점</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">얻게 되는 것에 초점</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">손실 관점</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">잃거나 포기하는 것에 초점</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">동일한 사실 확인</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">실제 금액 · 수량 · 조건 비교</text></svg><figcaption>표현이 달라져도 거래 조건을 같은 단위로 확인한다.</figcaption></figure>"
  },
  {
    "label": "13",
    "topic": "개념 해설 · 그림과 예시",
    "q": "감정 기반 결정과 평가이론",
    "a": [
      "감정 기반 결정에서는 대상과 미래 경험에 대한 느낌이 선택에 중요한 역할을 한다. 고노력 선택에서도 감정은 사라지지 않으며 상세한 상상과 해석을 포함할 수 있다.",
      "평가이론은 사건을 목표·통제 가능성 등과 관련하여 어떻게 해석하는지에 따라 감정이 달라질 수 있다고 본다. 같은 사건도 소비자마다 다르게 느낄 수 있다."
    ],
    "e": [
      "가상의 고객이 여행의 낯선 환경을 도전의 기회로 보면 기대가 커지고, 통제하기 어려운 위험으로 보면 불안할 수 있다.",
      "가격과 일정이 같아도 해석에 따른 감정이 달라진다. 감정이 작용한다는 이유만으로 선택이 항상 비합리적이라고 볼 수는 없다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"고노력 선택에서도 감정과 인지적 판단이 함께 작용한다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">상황의 해석</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">목표 · 기회 · 위험</text><path d=\"M280 95v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">미래 감정과 심상</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">얼마나 즐겁거나 후회할까?</text><path d=\"M280 203v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">선택과 실제 경험</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">예상과 실제를 비교하여 학습</text></svg><figcaption>고노력 선택에서도 감정과 인지적 판단이 함께 작용한다.</figcaption></figure>"
  },
  {
    "label": "14",
    "topic": "개념 해설 · 그림과 예시",
    "q": "정서적 예측 (Affective Forecasting)",
    "a": [
      "정서적 예측은 선택 후 자신이 어떤 감정을 얼마나 강하게, 얼마나 오래 느낄지 예상하는 것이다. 현재의 선택은 미래의 즐거움과 후회에 대한 예상에도 영향을 받는다.",
      "예측과 실제 경험이 다를 수 있다. 특정 장면에 집중하면서 일상에 대한 적응과 다른 활동을 놓치면 감정의 크기와 지속을 잘못 예상할 수 있다."
    ],
    "e": [
      "가상의 소비자가 새 휴대전화를 사면 매일 매우 즐거울 것이라고 예상한다.",
      "실제로는 금방 익숙해져 사용 편의가 더 중요하게 느껴질 수 있다. 구매 순간의 설렘과 장기간의 경험을 함께 상상해야 한다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"즐거움과 후회의 예측은 항상 정확하지 않다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">구매 전 예상</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">감정의 강도와 지속</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">사용 후 실제</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">적응과 여러 상황이 작용</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">차이 확인</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">다음 선택의 예상 수정</text></svg><figcaption>즐거움과 후회의 예측은 항상 정확하지 않다.</figcaption></figure>"
  },
  {
    "label": "15",
    "topic": "개념 해설 · 그림과 예시",
    "q": "심상 (Imagery)과 사용 경험의 상상",
    "a": [
      "심상은 대상이나 사용 장면을 마음속에 구체적으로 재현하는 것이다. 실제 경험 전에도 사용을 상상하면서 편익과 감정, 어려움을 평가할 수 있다.",
      "생생한 상상이 실제 성능의 증거는 아니다. 즐거운 장면뿐 아니라 사용 조건과 제약도 함께 떠올려 선택의 적합성을 검토해야 한다."
    ],
    "e": [
      "가상의 고객이 여행용 가방을 끌고 계단과 대중교통을 이용하는 장면을 상상한다.",
      "광고 속 멋진 여행 모습뿐 아니라 이동 동선과 짐의 무게도 생각하면 손잡이와 바퀴, 수납이 자신의 목적에 맞는지 더 구체적으로 판단할 수 있다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"광고의 생생함은 실제 성능을 증명하지 않는다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">사용 장면 상상</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">장소 · 동선 · 경험</text><path d=\"M280 95v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">편익과 제약 확인</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">즐거움과 불편 모두 고려</text><path d=\"M280 203v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">적합성 검토</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">상상과 실제 정보를 함께 사용</text></svg><figcaption>광고의 생생함은 실제 성능을 증명하지 않는다.</figcaption></figure>"
  },
  {
    "label": "16",
    "topic": "개념 해설 · 그림과 예시",
    "q": "결정 연기와 선택 회피",
    "a": [
      "결정 연기는 즉시 대안을 고르지 않고 선택을 뒤로 미루는 행동이다. 정보 부족·어려운 상충관계·위험과 후회에 대한 우려가 관련될 수 있다.",
      "항상 게으름이나 비합리성 때문은 아니다. 추가 정보를 기다리는 것이 유용할 수도 있지만 연기의 비용과 해결되지 않은 필요도 함께 보아야 한다."
    ],
    "e": [
      "가상의 학생이 노트북 후보의 장단점이 비슷하여 선택을 미룬다. 더 필요한 정보와 마감 시점을 정하면 다음 행동이 분명해질 수 있다.",
      "모든 후기를 읽겠다는 목표만 유지하면 계속 연기할 수 있다. 확인할 핵심 조건과 기다리는 비용을 함께 살핀다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"선택을 미루는 이유를 구체화해야 다음 행동을 정할 수 있다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">연기의 이유</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">정보 부족 · 위험 · 상충</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">추가 확인</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">무엇을 더 알아야 하는가?</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">결정 시점</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">기한과 연기의 비용 검토</text></svg><figcaption>선택을 미루는 이유를 구체화해야 다음 행동을 정할 수 있다.</figcaption></figure>"
  },
  {
    "label": "17",
    "topic": "개념 해설 · 그림과 예시",
    "q": "비교하기 어려운 대안의 선택",
    "a": [
      "다른 범주의 대안은 공통 속성이 적어 직접 비교하기 어렵다. 각 대안의 전체 인상으로 평가하거나 상위 목표와 공통 기준으로 번역하여 비교할 수 있다.",
      "무조건 같은 점수표에 넣는 것이 정답은 아니다. 여가·휴식·관계 같은 선택 목적을 먼저 정하면 서로 다른 경험의 비교 기준을 만들 수 있다."
    ],
    "e": [
      "가상의 소비자가 주말에 영화·식사·공원 산책 중 무엇을 할지 고민한다.",
      "휴식이 목적이면 혼잡과 이동 부담을, 친구와의 대화가 목적이면 대화 가능성과 시간을 공통 기준으로 볼 수 있다. 같은 대안도 목표가 바뀌면 평가가 달라진다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"비교 기준은 선택의 목적에 따라 달라진다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">다른 범주의 대안</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">영화 · 식사 · 산책</text><path d=\"M280 95v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">상위 목표</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">휴식 · 대화 · 새로운 경험</text><path d=\"M280 203v16 m-6 -6 6 6 6 -6\" fill=\"none\" stroke=\"#596971\" stroke-width=\"3\"/><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">공통 기준</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">시간 · 부담 · 목적 충족</text></svg><figcaption>비교 기준은 선택의 목적에 따라 달라진다.</figcaption></figure>"
  },
  {
    "label": "18",
    "topic": "개념 해설",
    "q": "소비자 특성과 고노력 선택",
    "a": [
      "지식과 전문성, 목표·기분·선택 성향은 무엇을 비교하고 얼마나 처리하는지에 영향을 줄 수 있다. 정보가 쉽게 처리된다고 느끼는 경험도 판단의 단서가 될 수 있다.",
      "전문가가 항상 오류 없이 결정하거나 특정 기분이 언제나 같은 처리 방식을 만드는 것은 아니다. 실제 과업과 여건, 편향 가능성을 함께 확인해야 한다."
    ],
    "e": [
      "가상의 숙련된 사진가는 카메라의 사용 조건을 구체적으로 비교할 수 있지만 익숙한 브랜드를 더 호의적으로 볼 수도 있다.",
      "초보자는 용어가 어려워 포기할 수 있으므로 사용 목적과 연결된 설명이 필요하다. 지식 수준과 정보 형식을 함께 고려한다."
    ]
  },
  {
    "label": "19",
    "topic": "개념 해설 · 그림과 예시",
    "q": "의사결정 특성: 정보량·형식·시간 압박",
    "a": [
      "정보의 양과 제시 형식, 대안 수와 시간 압박은 선택의 부담과 전략을 바꿀 수 있다. 많은 정보를 제공한다고 항상 더 나은 선택이 이루어지는 것은 아니다.",
      "브랜드별 설명과 속성별 비교표는 서로 다른 탐색을 돕는다. 핵심 속성의 의미를 설명하고 같은 조건에서 비교할 수 있게 설계해야 한다."
    ],
    "e": [
      "가상의 판매 사이트가 사양을 긴 문장으로 나열하면 고객이 모델 간 차이를 찾기 어렵다. 같은 항목의 비교표는 특정 속성의 차이를 확인하기 쉽게 한다.",
      "표를 만들더라도 중요하지 않은 항목까지 지나치게 늘리면 부담이 커진다. 필요한 정보와 깊이 있는 추가 정보를 나누어 제공할 수 있다."
    ],
    "visual": "<figure class=\"concept-figure\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 334\" role=\"img\" aria-label=\"같은 내용도 제시 형식에 따라 비교의 부담이 달라진다.\"><rect x=\"15\" y=\"10\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#c12a79\"/><text x=\"280.0\" y=\"39\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">브랜드별 정보</text><text x=\"280.0\" y=\"67\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">한 모델의 여러 속성을 확인</text><rect x=\"15\" y=\"118\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#1488ad\"/><text x=\"280.0\" y=\"147\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">속성별 정보</text><text x=\"280.0\" y=\"175\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">같은 속성에서 여러 모델 비교</text><rect x=\"15\" y=\"226\" width=\"530\" height=\"82\" rx=\"10\" fill=\"#657400\"/><text x=\"280.0\" y=\"255\" text-anchor=\"middle\" fill=\"white\" font-size=\"20\" font-weight=\"700\">처리 여건</text><text x=\"280.0\" y=\"283\" text-anchor=\"middle\" fill=\"white\" font-size=\"16\">정보량 · 시간 · 이해도</text></svg><figcaption>같은 내용도 제시 형식에 따라 비교의 부담이 달라진다.</figcaption></figure>"
  },
  {
    "label": "20",
    "topic": "개념 해설 · 그림과 예시",
    "q": "집단 맥락과 개인·집단의 목표",
    "a": [
      "동행자와 공동 의사결정은 정보 제공, 자기표현과 관계 유지, 책임과 후회에 대한 고려를 통해 선택에 영향을 준다. 개인 목표가 집단의 상호작용 속에서 조정될 수 있다.",
      "집단이면 항상 더 많이 쓰거나 더 합리적이라고 단정할 수 없다. 누가 참여하고 어떤 역할과 목표를 갖는지, 의견 차이를 어떻게 처리하는지 중요하다."
    ],
    "e": [
      "가상의 가족이 여행지를 정할 때 한 사람은 휴식을, 다른 사람은 활동과 관광을 원한다.",
      "예산과 이동시간, 각자의 우선순위를 공유하면 공통 기준을 만들 수 있다. 한 사람의 선호만 가족 전체의 선호라고 가정해서는 안 된다."
    ],

  },
  {

</script><script>
'use strict';
const slides=JSON.parse(document.getElementById('slide-data').textContent),el=id=>document.getElementById(id);let index=0,revealed=false;
function paragraphs(target,items){target.replaceChildren(...items.map(text=>{const p=document.createElement('p');p.textContent=text;return p}))}
function render(){revealed=false;const s=slides[index];el('question').textContent=s.q;el('topic').textContent=s.code?'교재 해설':s.topic;paragraphs(el('answer'),s.a);paragraphs(el('example'),s.e);if(s.visual)el('answer').insertAdjacentHTML('beforeend',s.visual);el('number').textContent=s.label;el('number').classList.toggle('textbook-number',Boolean(s.code));el('page').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;el('counter').textContent=(index+1)+' / '+slides.length;el('progress').style.width=((index+1)/slides.length*100)+'%';el('answers').hidden=!revealed;el('reveal').textContent=revealed?'개념 해설·예시 숨기기':'개념 해설·예시 보기';el('reveal').setAttribute('aria-expanded',String(revealed));el('prev').disabled=index===0;el('next').disabled=index===slides.length-1;document.querySelectorAll('.jump').forEach((b,i)=>{b.classList.toggle('current',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});window.scrollTo(0,0)}
function move(delta){if(index+delta<0||index+delta>=slides.length)return;index+=delta;render()}
function toggle(){revealed=!revealed;el('answers').hidden=!revealed;el('reveal').textContent=revealed?'개념 해설·예시 숨기기':'개념 해설·예시 보기';el('reveal').setAttribute('aria-expanded',String(revealed))}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('reveal').onclick=toggle;el('list').onclick=()=>el('map').showModal();el('close').onclick=()=>el('map').close();
el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{el('full').textContent='전체화면 사용 불가'}};
document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'전체화면 종료':'전체화면');
el('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(el('map').open||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'&&!e.target.matches('button')){e.preventDefault();toggle()}else if(e.key==='Home'){e.preventDefault();index=0;render()}else if(e.key==='End'){e.preventDefault();index=slides.length-1;render()}});
slides.forEach((s,i)=>{const b=document.createElement('button'),n=document.createElement('b'),t=document.createElement('span');b.className='jump';n.textContent=s.label;t.textContent=s.q;b.append(n,t);b.onclick=()=>{index=i;render();el('map').close();el('reveal').focus()};el('map-content').append(b);const article=document.createElement('article');article.className='print-item';const h=document.createElement('h1');h.textContent=s.label+' · '+s.q;article.append(h);[['개념 해설',s.a],['예시로 이해하기',s.e]].forEach(([label,items])=>{const heading=document.createElement('h2'),body=document.createElement('div');heading.textContent=label;paragraphs(body,items);if(label==='개념 해설'&&s.visual)body.insertAdjacentHTML('beforeend',s.visual);article.append(heading,body)});el('print-view').append(article)});

const summaryHeading=document.createElement('h3');summaryHeading.textContent='그림 핵심 정리 · 3개 주제';summaryHeading.style.cssText='grid-column:1/-1;margin:18px 0 7px;font-size:17px';el('map-content').insertBefore(summaryHeading,el('map-content').children[20]);
render();
</script></body></html>
