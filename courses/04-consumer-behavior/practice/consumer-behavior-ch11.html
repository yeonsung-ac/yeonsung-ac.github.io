<script>
const slides=[{"kind": "concept", "title": "사회적 영향력 (Social Influence)", "answer": "개인·집단·대중매체가 제공하는 정보와 명시적·묵시적 압력은 소비자의 생각과 행동에 영향을 준다. 사회적 영향력은 원천, 도구, 유형, 강도의 네 측면으로 살펴볼 수 있다.", "example": "친구의 운동화 추천을 듣고 성능을 알게 되기도 하고, 친구들과 어울리려고 같은 브랜드를 고르기도 한다."}, {"kind": "concept", "title": "마케팅 원천과 비마케팅 원천 (Marketing and Nonmarketing Sources)", "answer": "마케팅 원천은 광고·판매원처럼 기업이 관리하는 원천이다. 비마케팅 원천은 독립적인 언론·소비자·가족처럼 기업이 직접 통제하기 어려운 원천이다. 소비자가 지각하는 상업적 이해관계는 신뢰성에 영향을 준다.", "example": "노트북 회사의 광고와 독립적인 소비자의 사용 후기는 같은 제품을 다루어도 원천이 다르다. 협찬 콘텐츠는 일반 소비자의 독립적 후기와 구별해야 한다."}, {"kind": "concept", "title": "의견 선도자 (Opinion Leader)", "answer": "특정 제품 범주에 대한 지식과 경험을 바탕으로 다른 사람의 판단에 영향을 미치는 사람이다. 유명인일 필요는 없으며, 전문성과 정보 공유 성향이 중요하다.", "example": "친구들이 카메라를 살 때마다 사진 동아리 선배에게 렌즈와 기종을 묻는다면 그 선배는 카메라 분야의 의견 선도자이다."}, {"kind": "concept", "title": "인플루언서와 협찬 관계 (Influencer and Sponsorship)", "answer": "인플루언서는 미디어와 팔로워 관계를 활용해 제품과 브랜드에 영향을 미친다. 영향력은 팔로워 수뿐 아니라 전문성, 콘텐츠와 제품의 적합성, 신뢰성에 달려 있다. 협찬 관계를 숨기면 신뢰를 해칠 수 있다.", "example": "등산 장비를 실제로 사용하는 등산 콘텐츠 제작자의 사용 설명은 관련성이 높다. 제품을 제공받았다면 그 관계를 명확히 알리는 것이 중요하다."}, {"kind": "concept", "title": "마켓 메이븐과 리뷰어 (Market Maven and Reviewer)", "answer": "마켓 메이븐은 여러 제품·점포·가격·구매처에 걸친 폭넓은 시장 정보를 제공한다. 리뷰어는 사용 경험이나 평가를 전달한다. 리뷰어 모두가 의견 선도자인 것은 아니며, 리뷰의 구체성과 신뢰성을 함께 살펴야 한다.", "example": "어디에서 생필품을 싸게 사는지 잘 아는 친구는 마켓 메이븐에 가깝다. 처음 산 청소기의 후기를 남긴 사람은 리뷰어 역할을 한다."}, {"kind": "concept", "title": "준거집단의 세 유형 (Associative, Aspirational, and Dissociative Reference Groups)", "answer": "준거집단은 개인이 태도와 행동을 판단할 때 비교 기준으로 삼는 집단이다. 소속 준거집단(associative reference group)은 현재 관계를 맺는 집단, 열망 준거집단(aspirational reference group)은 닮거나 속하고 싶은 집단, 회피 준거집단(dissociative reference group)은 거리를 두고 싶은 집단이다.", "example": "동아리 친구의 옷차림을 따르는 것은 소속 집단, 동경하는 운동선수의 장비를 고르는 것은 열망 집단, 원치 않는 이미지의 집단이 쓰는 브랜드를 피하는 것은 회피 집단의 영향이다."}, {"kind": "concept", "title": "제품·브랜드 선택과 공개성·사치성 (Product and Brand Choice: Public/Private Consumption and Necessities/Luxuries)", "answer": "준거집단의 영향은 제품 구매 여부와 브랜드 선택에 다르게 나타난다. 전형적으로 사치품은 제품 구매 여부에, 공개적으로 소비되는 제품은 브랜드 선택에 집단 영향이 크게 나타난다. 필수성·공개성은 소비 상황에 따라 달라질 수 있다.", "example": "사람들 앞에서 사용하는 고급 시계는 구매 여부와 브랜드 모두에 집단 영향이 클 수 있다. 개인적으로 사용하는 필수품은 두 영향이 상대적으로 작을 수 있다."}, {"kind": "concept", "title": "브랜드 커뮤니티 (Brand Community)", "answer": "특정 브랜드를 중심으로 관심·경험·정체성을 공유하는 소비자 집단이다. 구성원은 사용 정보를 교환하고 소속감을 느낀다. 커뮤니티는 정보적 영향력과 규범적 영향력이 함께 작동하는 장이 될 수 있다.", "example": "러닝화 브랜드 모임에서 회원들은 신발 관리법을 알려 주고, 정기 달리기에 참여하는 문화를 함께 만든다."}, {"kind": "concept", "title": "영향력 도구 (Influence Tools): Online/Offline and One-to-One/One-to-Many", "answer": "영향력 도구는 온라인과 오프라인, 일대일과 일대다로 구분할 수 있다. 일대일 도구는 질문과 맞춤 설명에, 일대다 도구는 넓은 도달 범위에 유리하다. 온라인 도구는 확산과 상호작용을 결합하기도 한다.", "example": "매장 상담은 오프라인 일대일, TV 광고는 오프라인 일대다, 고객 채팅은 온라인 일대일, 공개 제품 영상은 온라인 일대다에 가깝다."}, {"kind": "concept", "title": "규범적 영향력 (Normative Influence)", "answer": "집단이 기대하는 행동을 따르도록 만드는 영향력이다. 소비자는 인정·소속감 같은 보상을 얻거나 비난·배제 같은 제재를 피하려고 행동할 수 있다. 제품 성능을 배워 선택하는 정보적 영향력과 구분한다.", "example": "동료들이 정장 착용을 당연하게 여겨 자신도 정장을 구입했다면 집단의 기대가 소비에 영향을 준 것이다."}, {"kind": "concept", "title": "브랜드 선택 일치성과 동조성 (Brand-Choice Congruence and Conformity)", "answer": "브랜드 선택 일치성은 집단 구성원과 같은 브랜드를 구매하는 현상이다. 동조성은 집단 규범에 맞추어 행동하는 더 넓은 경향으로, 같은 브랜드를 고르는 것 외에 사용 방식이나 소비 행동에도 나타난다.", "example": "친구들과 같은 운동화 브랜드를 사는 것은 브랜드 선택 일치성이다. 친구들이 정한 운동 모임의 복장과 행동 규칙을 따르는 것은 동조성의 예이다."}, {"kind": "concept", "title": "순응과 저항 (Compliance and Reactance)", "answer": "순응은 다른 사람의 명시적 요청에 따라 행동하는 것이다. 저항은 요청에 반대하거나 영향력을 거부하는 반응이다. 선택의 자유가 위협받는다고 느끼면 심리적 반발이 생길 수 있다.", "example": "판매원의 시연 요청에 응하는 것은 순응이다. 구매를 강요받는다고 느껴 상담을 중단하는 것은 저항으로 볼 수 있다."}, {"kind": "concept", "title": "순응을 유도하는 요청 기법 (Compliance Techniques)", "answer": "문간에 발 들여놓기(foot-in-the-door)는 작은 요청을 수락하게 한 뒤 더 큰 요청을 한다. 문전박대(door-in-the-face)는 큰 요청이 거절된 뒤 더 작은 목표 요청을 한다. 아주 작은 기여도 허용하는 요청(even-a-penny-will-help technique)은 참여 부담을 낮춘다.", "example": "짧은 설문 뒤 회원 가입을 부탁하는 것은 작은 요청에서 큰 요청으로 가는 방식이다. 1시간 봉사를 거절한 사람에게 10분 봉사를 요청하는 것은 큰 요청에서 작은 요청으로 가는 방식이다."}, {"kind": "concept", "title": "정보적 영향력 (Informational Influence)", "answer": "다른 사람이 제공하는 정보를 판단 근거로 활용하는 영향력이다. 소비자의 지식과 경험이 부족하거나 제품이 복잡하고 지각된 위험이 높을 때 중요해진다. 같은 원천이 규범적·정보적 영향력을 동시에 행사할 수도 있다.", "example": "처음 카시트를 사는 부모가 안전성과 설치 방법에 관한 전문가 설명을 참고해 제품을 선택한다."}, {"kind": "concept", "title": "소비자 사회화 (Consumer Socialization)", "answer": "소비자로서 필요한 지식·기술·가치와 행동 방식을 배우는 과정이다. 부모, 또래, 미디어가 중요한 주체이며 성인이 된 뒤 새로운 생활 역할을 맡을 때도 이어진다.", "example": "아이가 부모와 장을 보며 가격 비교를 배우고, 대학 입학 뒤 친구에게 중고 거래 방법을 배우는 과정은 모두 소비자 사회화이다."}, {"kind": "concept", "title": "정보의 극성과 전달 양식 (Valence and Modality)", "answer": "극성은 정보가 긍정적인지 부정적인지를 뜻한다. 부정적 정보는 문제를 진단하는 단서로 주목받을 수 있다. 전달 양식은 말·글로 정보를 전달하거나 다른 사람의 행동을 관찰하는 방식 등을 가리킨다.", "example": "청소기가 좋다는 후기와 고장 났다는 후기는 극성이 다르다. 친구가 청소기 뚜껑을 열지 못해 애쓰는 모습을 보고 평가하는 것은 행동 관찰을 통한 영향이다."}, {"kind": "concept", "title": "구전과 소셜 미디어 구전 (Word of Mouth and Social Media Word of Mouth)", "answer": "구전은 소비자 사이에서 제품·브랜드 관련 경험과 정보가 전달되는 것이다. 온라인에서는 후기·댓글·공유 등으로 확산된다. 도움을 주려는 동기뿐 아니라 자기표현과 감정 공유도 구전의 동기가 될 수 있다.", "example": "친구에게 식당을 추천하고, 방문 후기를 SNS에 올리고, 다른 사람이 그 게시물을 공유하면 구전이 여러 관계망으로 확산된다."}, {"kind": "concept", "title": "바이럴 마케팅과 부정적 구전 대응 (Viral Marketing and Responding to Negative Word of Mouth)", "answer": "바이럴 마케팅은 사람들이 브랜드 관련 콘텐츠를 자발적으로 빠르게 전달하도록 유도한다. 확산을 기업이 완전히 통제할 수는 없다. 부정적 구전에는 경청, 사실 확인, 공감, 구체적인 문제 해결과 후속 안내가 중요하다.", "example": "재미있는 제품 영상이 공유되어 인지도가 높아질 수 있다. 반대로 배송 불만이 퍼지면 댓글을 지우기보다 주문 문제를 확인하고 해결 결과를 알려야 한다."}, {"kind": "concept", "title": "영향력 강도: 원천과 수신자 (Strength of Influence: Source and Recipient Characteristics)", "answer": "원천의 전문성(expertise)·신뢰성(credibility)·매력도(attractiveness)와 수신자의 동일시(identification)·지각된 유사성(perceived similarity)은 영향력 정도에 영향을 준다. 어떤 특성이 중요한지는 제품과 상황에 따라 달라진다. 유명하거나 팔로워가 많다는 사실만으로 높은 설득력을 보장하지는 않는다.", "example": "초보 등산객은 전문 산악인의 안전 설명에 주목하고, 자신과 체형·경험이 비슷한 사용자의 등산화 후기에서 유용한 단서를 얻을 수 있다."}, {"kind": "concept", "title": "영향력 강도: 관계와 도구 (Strength of Influence: Relationships and Tools)", "answer": "접촉 빈도(contact frequency), 네트워크 밀도(network density), 유대 강도(tie strength)는 정보 전달과 집단 영향에 관련된다. 강한 유대는 신뢰와 관계 유지 동기를 높일 수 있고, 약한 유대는 새로운 집단의 정보에 접근하게 한다. 도구의 도달 범위(reach)와 쌍방향성(interactivity)도 고려해야 한다.", "example": "친한 친구의 추천은 깊이 고려할 수 있고, 가끔 만나는 지인은 다른 동네의 새로운 가게를 알려 줄 수 있다. 공개 영상은 넓게 도달하고 개별 상담은 질문에 맞춰 설명할 수 있다."}, {"kind": "problem", "topic": "영향력 원천·의견 선도자 (Influence Sources and Opinion Leader)", "title": "노트북 회사 광고와 컴퓨터에 밝은 동아리 선배의 추천을 함께 참고했다. 두 원천을 구분하고, 선배가 의견 선도자가 될 수 있는 이유를 설명하라.", "answer": "회사 광고는 기업이 관리하는 마케팅 원천이다. 독립적으로 조언하는 선배는 비마케팅 원천이며, 특정 제품 범주의 지식과 경험을 다른 사람에게 전달한다는 점에서 의견 선도자가 될 수 있다. 선배에게 협찬 등 상업적 관계가 있는지도 확인해야 한다.", "example": "카메라 매장 광고와 사진 동아리 선배의 독립적인 사용 조언도 같은 방식으로 구분할 수 있다."}, {"kind": "problem", "topic": "인플루언서·원천 특성 (Influencer and Source Characteristics)", "title": "등산화 회사가 팔로워 100만 명의 일상 콘텐츠 제작자와 팔로워 5만 명의 등산 전문가 중 협업 대상을 고르려 한다. 팔로워 수 외에 무엇을 평가해야 하는가?", "answer": "제품과 콘텐츠의 적합성, 등산 관련 전문성, 팔로워의 신뢰와 반응, 목표 소비자와의 관련성, 협찬 관계의 투명성을 평가해야 한다. 넓은 도달 범위와 설득력은 별개이므로 캠페인 목적에 맞추어 판단한다.", "example": "초보자용 등산화의 안전한 사용법을 알리는 목적이라면 실제 산행 경험과 설명 능력이 중요한 판단 기준이 된다."}, {"kind": "problem", "topic": "마켓 메이븐·리뷰어 (Market Maven and Reviewer)", "title": "A는 여러 점포의 가격과 할인 정보를 알려 주고, B는 처음 산 공기청정기의 사용 후기를 남겼다. 두 사람의 역할을 구분하라.", "answer": "여러 제품과 구매처에 걸친 시장 정보를 제공하는 A는 마켓 메이븐에 가깝다. B는 사용 경험을 전달하는 리뷰어이다. 한 번 후기를 작성했다는 사실만으로 B가 의견 선도자라고 단정할 수는 없다.", "example": "생필품 구매처를 두루 아는 사람과 한 호텔의 숙박 후기를 작성한 사람도 구분할 수 있다."}, {"kind": "problem", "topic": "준거집단 (Reference Groups)", "title": "동아리 친구의 옷을 따라 사고, 동경하는 선수의 장비를 고르며, 닮고 싶지 않은 집단의 브랜드는 피한다. 각각 어떤 준거집단의 영향인가?", "answer": "동아리 친구는 소속 준거집단, 동경하는 선수는 열망 준거집단, 거리를 두고 싶은 집단은 회피 준거집단에 해당한다. 준거집단은 따르고 싶은 기준뿐 아니라 피하려는 기준으로도 작동한다.", "example": "현재 직장 동료, 입사하고 싶은 회사의 전문가 집단, 원치 않는 이미지를 가진 집단도 각각의 비교 기준이 될 수 있다."}, {"kind": "problem", "topic": "공개성·사치성 (Public/Private Consumption and Necessities/Luxuries)", "title": "공개적으로 착용하는 고급 시계와 혼자 사용하는 기본 생활용품을 비교하라. 준거집단은 제품 구매 여부와 브랜드 선택에 각각 어떻게 영향을 줄 수 있는가?", "answer": "전형적으로 사치품인 고급 시계는 구매 여부에, 공개적으로 착용한다는 점은 브랜드 선택에 집단 영향을 높일 수 있다. 개인적으로 사용하는 필수 생활용품은 두 영향이 상대적으로 작을 수 있다. 다만 필수성·공개성에 대한 소비자의 인식과 사용 상황을 확인해야 한다.", "example": "같은 운동화도 선수에게는 필수 장비이지만 다른 소비자에게는 과시적 사치품일 수 있어 맥락에 따라 판단이 달라진다."}, {"kind": "problem", "topic": "브랜드 커뮤니티·영향력 도구 (Brand Community and Influence Tools)", "title": "러닝 브랜드가 공개 사용법 영상과 회원별 채팅 상담, 정기 모임을 운영한다. 도구의 특성과 커뮤니티의 역할을 설명하라.", "answer": "공개 영상은 온라인 일대다로 넓게 도달하고, 채팅 상담은 온라인 일대일로 맞춤 질문에 답한다. 정기 모임은 오프라인 상호작용을 만든다. 커뮤니티에서는 사용 정보가 교환되고 참여 규범과 소속감이 형성될 수 있다.", "example": "자전거 브랜드의 정비 영상, 개별 상담, 주말 라이딩 모임도 서로 다른 기능을 결합한다."}, {"kind": "problem", "topic": "규범적·정보적 영향력 (Normative and Informational Influence)", "title": "친구들이 모두 쓰는 가방이라 소외되지 않으려고 산 경우와, 친구의 방수 성능 설명을 듣고 산 경우를 비교하라.", "answer": "소외를 피하고 집단의 기대를 따르려는 구매는 규범적 영향력이다. 방수 성능 정보를 판단 근거로 활용한 구매는 정보적 영향력이다. 실제 구매에서는 두 동기가 함께 작용할 수 있다.", "example": "팀원과 어울리려고 같은 운동화를 고르는 것과 충격 흡수 설명을 참고해 고르는 것도 구분할 수 있다."}, {"kind": "problem", "topic": "브랜드 선택 일치성·동조성·순응 (Brand-Choice Congruence, Conformity, and Compliance)", "title": "친구와 같은 신발 브랜드를 사고, 동아리의 복장 규칙을 따르며, 판매원의 시연 요청에 응했다. 각 행동을 설명하라.", "answer": "같은 브랜드를 구매하는 것은 브랜드 선택 일치성이다. 집단의 복장 규칙을 따르는 것은 동조성이다. 판매원의 명시적인 시연 요청을 수락하는 것은 순응이다. 개념들은 관련되지만 행동을 설명하는 초점이 다르다.", "example": "같은 팀 유니폼 브랜드를 선택하는 행동, 응원 규칙을 따르는 행동, 설문 참여 요청을 수락하는 행동도 구분할 수 있다."}, {"kind": "problem", "topic": "순응 요청 기법·저항 (Compliance Techniques and Reactance)", "title": "① 짧은 설문 뒤 회원 가입을 요청했다. ② 1시간 봉사를 거절한 사람에게 10분 봉사를 요청했다. 두 기법을 구분하고 지나친 압박의 문제를 설명하라.", "answer": "①은 작은 요청에서 큰 요청으로 이어지는 문간에 발 들여놓기이다. ②는 큰 요청이 거절된 뒤 작은 목표 요청을 하는 문전박대이다. 지나친 압박은 선택의 자유를 위협해 심리적 반발과 저항을 유발할 수 있다.", "example": "요청 내용을 명확히 설명하고 거절할 선택권을 주면 강요받는다는 느낌을 줄일 수 있다."}, {"kind": "problem", "topic": "정보적 영향력·지각된 위험 (Informational Influence and Perceived Risk)", "title": "처음 카시트를 사는 소비자가 광고 문구보다 전문가의 안전 설명과 실제 설치 후기를 꼼꼼히 살폈다. 정보적 영향력이 중요해진 이유는 무엇인가?", "answer": "소비자의 사전 지식이 부족하고 제품 선택과 설치가 복잡하며 안전과 관련된 지각된 위험이 높기 때문이다. 전문적 설명과 구체적인 사용 경험은 불확실성을 줄이는 판단 근거가 될 수 있다. 원천의 신뢰성도 함께 평가해야 한다.", "example": "처음 고가의 장비를 구매할 때 전문가의 사양 설명과 실제 사용자의 설치 경험을 함께 확인하는 경우도 유사하다."}, {"kind": "problem", "topic": "소비자 사회화 (Consumer Socialization)", "title": "아이는 부모에게 가격 비교를 배우고, 대학에 입학한 뒤 친구에게 중고 거래 예절을 배웠다. 사회화 주체와 학습 내용을 설명하라.", "answer": "부모와 또래가 각각 사회화 주체이다. 가격 비교는 소비 지식과 기술의 학습이며, 거래 예절은 소비자로서 적절한 행동 규범의 학습이다. 소비자 사회화는 어린 시절에 끝나지 않고 새로운 역할과 환경에서도 이어진다.", "example": "취업 후 동료에게 업무용 의류 선택과 회식 비용 분담 관행을 배우는 것도 소비자 사회화이다."}, {"kind": "problem", "topic": "극성·전달 양식·구전 (Valence, Modality, and Word of Mouth)", "title": "제품을 칭찬하는 글보다 고장 사례가 더 눈에 띄었다. 이후 친구가 제품을 작동시키지 못하는 모습도 보았다. 극성과 전달 양식으로 분석하라.", "answer": "칭찬은 긍정적 정보, 고장 사례는 부정적 정보이다. 부정적 정보가 문제를 진단하는 단서로 지각되면 주목도가 높아질 수 있다. 글로 경험을 접하는 것과 친구의 사용 행동을 직접 관찰하는 것은 전달 양식이 다르다.", "example": "식당 추천 글을 읽는 것과 음식이 계속 남겨지는 모습을 관찰하는 것도 서로 다른 전달 방식이다."}, {"kind": "problem", "topic": "바이럴 마케팅·위기 대응 (Viral Marketing and Crisis Response)", "title": "브랜드 영상은 빠르게 공유되었지만 배송 지연 불만도 확산되었다. 기업이 해야 할 대응을 제안하라.", "answer": "긍정적 확산과 부정적 구전을 함께 모니터링한다. 지연 사실과 범위를 확인하고 고객 불편에 공감하며, 배송 일정·취소·환불 등 구체적인 해결책을 안내한다. 이후 처리 결과를 알리고 반복 원인을 개선한다. 확산을 이유로 불만을 일괄 삭제하는 대응은 신뢰를 해칠 수 있다.", "example": "주문별 확인 창구를 마련하고 고객에게 변경된 도착 예정일과 선택 가능한 조치를 알려 줄 수 있다."}, {"kind": "problem", "topic": "원천·수신자 특성과 영향력 (Source and Recipient Characteristics and Influence)", "title": "초보 러너가 유명 배우의 추천보다 러닝 전문가와 자신처럼 발볼이 넓은 사용자의 후기를 더 참고했다. 어떤 요인이 작용했는가?", "answer": "러닝 전문가는 관련 전문성과 신뢰성을 제공할 수 있다. 발볼이 비슷한 사용자는 수신자가 지각하는 유사성이 높아 착용감을 판단하는 데 도움이 된다. 유명인의 매력이나 인지도만으로 모든 상황에서 더 큰 영향력이 생기는 것은 아니다.", "example": "초보 사진가가 전문 강사의 설명과 자신과 같은 입문자의 사용 후기를 함께 보는 경우도 같은 원리로 설명할 수 있다."}, {"kind": "problem", "topic": "유대 강도·네트워크·도구 (Tie Strength, Networks, and Tools)", "title": "친한 동아리 친구는 구매를 설득했고, 가끔 만나는 지인은 처음 듣는 브랜드를 알려 주었다. 기업이 공개 영상과 개별 상담을 함께 쓰는 이유까지 설명하라.", "answer": "강한 유대는 신뢰와 관계 유지 동기를 통해 영향력을 높일 수 있다. 약한 유대는 다른 관계망의 새로운 정보를 연결할 수 있다. 구성원 간 연결이 촘촘한 네트워크에서는 정보가 빠르게 퍼질 수 있다. 공개 영상은 넓은 도달 범위, 개별 상담은 쌍방향 맞춤 설명에 유리하다.", "example": "동아리 안에서는 추천이 반복되고, 외부 지인을 통해 새로운 선택지가 들어오며, 상담에서 개인의 의문을 해결할 수 있다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제11장 · 소비자 행동에 영향을 미치는 사회적 요인';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
