<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>설문 참여 QR코드 | 소비자행동론</title><link rel="stylesheet" href="styles.css"><style>body{background:white}.projector{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:75px 20px 20px}.projector h1{font-size:clamp(26px,3.2vw,48px);margin:10px 0}.projector>img{height:min(57vh,650px);width:auto;max-width:95vw;object-fit:contain;image-rendering:pixelated}.projector .eyebrow{margin:0}.projector .qr-url{font-size:14px;overflow-wrap:anywhere;color:var(--muted);max-width:950px}.projector p{margin:7px}.projector .tools{position:absolute;right:20px;top:18px;display:flex;gap:8px;flex-wrap:wrap}.projector .button{font-size:13px;padding:10px 15px}#local-qr-warning{max-width:750px}@media print{.tools,#local-qr-warning{display:none!important}.projector{padding:10mm}.projector>img{width:150mm;height:150mm}}</style><script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script></head><body><main class="projector"><div class="tools"><button id="full" class="button secondary">전체화면</button><button id="png" class="button secondary">QR 이미지 저장</button><button id="print" class="button secondary">인쇄</button><a href="index.html" class="button">설문 열기</a></div><p class="eyebrow">소비자행동론 · 제11장 수업 활동</p><h1>휴대폰으로 QR코드를 찍어 주세요</h1><p>온라인 제품 리뷰의 정보 유용성 조사</p><img id="qr" alt="온라인 제품 리뷰 설문 참여 QR코드"><p id="qr-url" class="qr-url"></p><p>이름·학번 없이 익명 응답 · 12개 문항 · 약 2~3분</p><p id="local-qr-warning" class="notice" hidden>이 주소는 현재 PC에서만 열립니다. 학생 배포 시에는 GitHub Pages의 공개 주소를 사용하세요.</p></main><script src="modules/qr-page.js" defer></script></body></html>
