</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "소비자 사회에서의 마케팅, 윤리, 사회적 책임", "source": "20261114_171606.jpg"}, {"kind": "paragraph", "text": "도입\n 오늘날 소비자 사회에서 마케터와 소비자는 마케팅의 ‘밝은 측면’인 우연한 성과를 달성할 수 있는 힘을 갖고 있다. 마케터와 소비자는 함께 그들의 삶뿐이 아닌 세상과 다른 사람들의 삶에 실질적인 변화를 만들어내고 있다. 반면에 비만, 약물 남용, 강박적 도박과 소비자 사생활 침해의 증가 등 마케팅의 어두운 면은 여전히 일어나고 있다. 본 장에서는 마케팅과 소비자의 행동이 어두운 면과 밝은 면을 모두 다룬다. 마케터와 소비자 모두가 자신의 이익과 타인의 이익, 그리고 즉각적인 이익과 장기적인 이익 사이의 균형을 유지해야 할 필요성을 느낀다. 또한 소비자는 개인으로서 혹은 조직과 기부단체에서 특정한 사회적 목표에 지향하거나 마케터에게 특정 조치를 요구함으로써 이 과정에 기여할 수 있다. 이 장에서는 위와 같은 내용을 다루면서 그림 17-1, 소비자와 관련된 사회적 책임의 주요 내용을 요약하고 있다.\n 17-1 균형 추구\n 마케터와 소비자가 의사 결정을 내릴 때는 종종 잠재적으로 상충되는 우선순위의 긴장에 직면한다. 이러한 갈등을 해결하려는 시도는 윤리적 문제를 야기할 수 있다. 사회적 딜레마(social dilemma)는 소비자", "source": "20261114_171606.jpg"}, {"kind": "heading", "text": "17-1a 자신의 이익 또는 타인의 이익", "source": "20261114_171611.jpg"}, {"kind": "paragraph", "text": "의 이기심이 한 명 이상의 다른 사람 또는 사회 전반의 이익과 충돌할 때 발생한다. 예를 들 어, 패션 아이템을 구매해 착용한 뒤 며칠 안 된다는 이유로 온라인 스토어에 전액 환불을 요 청하는 것은 소비자가 자신의 이익을 우선적으로 생각할 때 나타나는 행동이다. 이로써 온라 인 스토어의 사업자와 사회 전반에 손해가 발생하게 된다. 사람들의 잇츠(lets)의 같은 웹사이트에서 대량 생산된 상품을 수제로 속여 판매하여 다른 소비자들을 속이는 경우가 있다.\n 소비자는 당면한 이익이 장기적 이익과 충돌할 때 시간적 딜레마(temporal dilemma)에 직면하 게 된다. 예를 들면, 소비자가 케이크와 쿠키를 먹는 것을 좋아하지만 살을 빼야 한다는 장기 적 목표가 있을 때, 단기적 이익을 우선시하는 경향이 있다. 그림 17-2는 이 두 가지 딜레마를 보여 준다.\n 소비자가 본래의 확산한 것처럼 우리 자신의 즉각적인 자기 이익에 대한 관심을 활용해 실질 적으로 협력을 증가시킬 수 있다. 동시에 다른 사람들의 미래 이익에 관심을 두게 하면 우리의 만족감이 증가되거나 나아진 것 또는 타인의 사람이라도 자아개념에 포함될 수 있다.\n 17-1a 자신의 이익 또는 타인의 이익\n 우리 가까이에 있는 특별한 사람들(예: 가족이나 친구)에 초점을 맞추면 우리의 의사 결정은 ‘나 대 우리(me versus we)’에 관한 것이 된다. 낯선 사람이나 사회 전체에 걸쳐 좀 더 넓 은 범위에 초점을 맞추면 의사 결정은 ‘나 대 그들(me versus them)’에 관한 것이 될 수 있다.\n마케터가 의사 결정을 내릴 때 나에게 초점을 맞출 수 있는데, 이는 소비자 자신이 전문가, 특정 개인적 목표를 의미한다. 다른 초점으로는 우리, 너와 나, 상대방 또는 친구나 연인, 가족, 회사, 또는 동료) 혹은 나 또는 그들(정부 또는 조직 외부의 다른 사람들)에 대한 의사 결정을 내 릴 수 있다.\n 나, 우리, 그들, 또는 모두에게 초점을 두기로 선택하는 것은 본질적으로 중요한 나쁜 것 이 아니다. 유용한 타인 초점(beneficial other-focus)은 타인에 있는 트위터와 페이스북 같은 소셜 미 디어에 게시된 친구나 낯선 사람의 질문에 응답하거나 다른 사람들의 현명한 구매 의사 결 정을 내리도록 도움이 되는 제품 리뷰를 게시하는 것과 같은 아이디어 공유이다.\n 해로운 자기 초점(harmful self-focus)의 한 가지 사례는 절도이다. 절도범은 “그것은 단지 어떤 구모와, 때때사람이기 때문에 다른 사람이나 사회에 거의 해를 끼치지 않는다고 생각할 수 있", "source": "20261114_171611.jpg"}, {"kind": "heading", "text": "17-1b 즉각적인 이익 또는 장기적 이익 / 17-1c ‘어두운’ 결과와 ‘밝은’ 결과", "source": "20261114_171616.jpg"}, {"kind": "paragraph", "text": "다. 그러나 현실적으로 이러한 불법적이고 비윤리적인 행동은 매장 비용으로 인해 가격 상승을 유발함으로써 문제는 더 악화된다. 얼마만한 사실상 다른 쇼핑객들에게 불이익을 준다. 매년 미국 반도둑질로 도난당한 물건의 금액이 적어도 약 1,000억 달러 상당의 상품을 잃게 되며 이는 가격 상승, 훼손된 물 구매경험에서 재정적인 영향뿐 아니라 심리적 영향까지 끼치는 심각한 결과를 초래한다. 그럼에도 불구하고 이는 대부분의 소매점에서 일어나는, 소위 정상과 비정상 사이의 비교적 온건한 도난행위로 간주된다.³ 좀 더 심한 유형의 도난은 무장강도, 강도, 시장 추구 행동의 문제이다. 매매업체가 정직한 고객으로 하여금 자신방어를 위해 도난 방지 장치를 설치하거나 손실을 보전하기 위해 가격을 너무 높임으로써 구매자들이 이 매장을 찾지 않을 수 있으며, 결과적으로 판매와 이익에 해를 끼칠 수 있다.\n 17-1b 즉각적인 이익 또는 장기적 이익\n 시간적 딜레마의 주의 핵심 쟁점은 다음과 같다. 그 의사 결정이 미래와 비교해볼 때 나의 이익, 우리의 이익, 또는 남의 이익에 어떻게 즉각적으로 영향을 미칠 것인가? 펩시 리프레시(Pepsi Refresh) 캠페인은 새로운 소셜 미디어 캠페인 중의 한 예이다. 이 회사는 사회 전반 달리의 보조금을 줄 예산에는 장기적인 브랜드 성장에 초점을 두었기 때문에, 이러한 지원 자격을 얻기 위해 마케팅을 요구하지 않았으며, 즉각적인 재정적 이익도 기대하지 않았다. 미리미래 초경을 갖는 소비자들은 이러한 프로그램에 관련돼 있을 수 있다. 부모가 자녀의 대학 교육을 위한 대학 저축을 하려 할 경우, 단기적인 욕구 충족에 돈을 낭비할 또는 자명의 몫으로 돌아가야 할 자금을 저축해야 한다. 이들은 자녀, 손녀, 그리고 사회 전반에 긍정적인 미래 결과를 기대하면서 투자를 하고 있는 것이다.\n 단기적인 이익을 강조하는 의사 결정은 미래에 긍정적 또는 부정적 영향을 미칠 수 있다. 만약 저렴한 가격에 중고차를 구입할 수 있는 기회가 있다면 이익은 단순한 단기적인 구매를 결정할 수도 있다. 그러나 나중의 비용이 더 클 가능성도 있다. 또 중요한 단기적인 이익은 자신의 구매에 대해 거짓말을 할 때이다. 소비자는 자신이 저지른 행동이 제정 질서를 위협하게 만든다는 사실을 아는 경우가 많다. 물론, 미래에 중심을 둔으면서 의사 결정을 긍정적 또는 부정적인 영향을 미칠 수 있다. 예를 들어, 미래에 중심을 둔으면서 현재의 금전적인 유혹을 경험을 무시하게 깣ს나를 수 있다. 그렇기 때문에 의사 결정을 내릴 때 오늘의 이익과 미래의 이익의 균형을 맞추는 것이 매우 중요하다.\n 17-1c ‘어두운’ 결과와 ‘밝은’ 결과\n 마케팅에서 딜레마로 인해 발생하는 갈등은 가끔 잠재적으로 소비자나 마케터에게 해를 끼칠 수 있는 ‘어두운’ 결과로 이어질 수 있다. 예를 들면, 본 절에서 논의되는 바와 같이 오늘 판매를 목표로 하고 내일의 충성도를 높이기 위해 어린이들에게 광고를 해야만 하는가? 마켓터가 제작자의 수익을 발달하면서도 긍정적으로 구매하지 등록하지 않은 디지털 엔터테인먼트 소비자가 다운로드하면서 공유할 수 있어야 하는가?\n 이러한 딜레마의 경우 마케터의 관리자가 재무적인 결과를 포함한 장·단기적 결과를 모두 고려해야 한다. 이중 딜레마의 경우, 수익 결정은 사회적 딜레마와 시간적 딜레마를 모두 포함한다. 매우 중요한, 극단적인 경우, 수익을 개선해야 한다는 압박을 받는 개인은 나 또는 우리이다. 예를 들면, 회사 규정인 ‘위험(위험)의", "source": "20261114_171616.jpg"}, {"kind": "heading", "text": "17-2 마케팅 윤리, 소비자 윤리, 일탈적 소비자 행동", "source": "20261114_171623.jpg"}, {"kind": "paragraph", "text": "재무 실적을 좋게 만드는 것에 지나치게 집착할 수 있다. 이들은 재무 실적을 부풀리는 것과 같은 비윤리적 행동을 취할 수 있으며, 이러한 행동이 알려지면 주주와 소비자를 해칠 수 있고 직업을 잃지러질 수 있는 파산이라는 ‘아무튼’ 결과를 낳는다. 이런 극단적 상황은 드물게 발생한다.\n대부분의 기업은 단기적인 이익과 장기적인 수익성 및 사람과 세계를 위한 지속 가능한 결과에 ‘반한’ 결과를 촉진 있게 추구하려고 한다. 기업의 사회적 책임 활동은 csr(corporate social responsibility, CSR)로, 기업의 주주 및 소비자 등 이해관계자의 경제적, 사회적, 환경적 이익을 통합한 비즈니스 평형으로 균형을 맞추는 것을 목표로 한다. 즉, 이러한 활동이 회사의 단기 이익에서 자금을 조달할 수 있으므로 수익성의 각주와의 주주 가치 밝다는 점을 보여 수 있다. 이러한 활동은 사회에 지반에 따라 긍정적인 변화, 특히 금융준비를 브랜드를 긍정적으로 변화, 비용이 될 수도 있다. 기업들은 종종 채용, 서비스, 신뢰 유지 등 적절 고객들도부터의 높은 호환 및 평가를 이끌어 있을 있으며, 결국 직원 리포트에서 이어 주주의 가치를 향상시킨다. 사회적 및 환경적 이익은 비즈니스 모델에 통합하는 것은 기업의 핵심 사업의 일부가 될 수 있다. 예를 들면, 네덜란드의 제과 회사인 토니스 초코론리(Tony’s Choccolone)는 초콜릿 제품 브랜드로서, 농민 관점에서 바라본 공정무역 원칙을 도입하였으며, 이는 제퓸 포장에서도 볼 수 있다. 2022년, 토니스 초콜론리는 인권 및 환경 보호 준법에서 최고 수준의 초콜릿 회사 중 하나로 평가받았으며, 코코아 농민의 생활 여건 보장, 아동 노동 문제, 기후 변화에 대한 기업 대응을 포함한 다양한 분야에서 긍정적인 변화를 병어 왔다. 파타고니아(Patagonia) 스포츠 의류 브랜드는 거의 준 첫 번째 기업의 사회적 책임 활동을 채택한 회사로 알려져 있다. 창립자 이본 쉬나드(Yvon Chouinard)는 1970년대에 회사 창립 초기부터 환경 문제에 꾸준히 기도하고 싸우고, 자연과 생물 다양성을 보호하며, 변화하는 지역 사회를 신속하게 지원하는 데 사 간용하도록 했다.* 기업의 사회적 책임 활동은 다양한 이해관계자에게 긍정적인 결과를 제공한다. 이러한 활동은 다음 절에서 다루는 마케팅과 소비자 윤리에 닿는 문제의 일부이다.\n 마케팅 윤리(marketing ethics)는 도덕적 가치, 즉 마케팅 실무에서 옳고 그름을 판단하는 원삭이 기준다. 이러한 도덕적 가치는 내부 및 외부 마케팅 활동에 대해 정직하고, 공정하고, 존중하는 의사 결정을 내릴 수 있도록 개인 및 조직을 안내하는 지침이 된다. 한 영국에 있는 이론에 따르면, 이 돌보게 될 핵을 입히 않으며 하늘과 공정하게 속이지 않는 (1) 정직하고 비상하지 않는다, (2) 4권익의 적존을 보잘린 함, (3) 전정적 책임, (4) 예리한 (5) 신분을 존중하고 훼손하지 않는 것이라는 다섯 가지 도덕적 가치가 중요한 것으로 본다. 한편, (6) 자유를 제한하고 악약을 거부하는 것이 필요할 수 있다* 도덕적 가치는 14장의 사이코그래픽에서 설명한 가족의 연회, 교육, 문화, 종교 등에 따라 사람의 행동과 기초 선호와 관련한 다른 소비자 가치들과는 비슷하지만 다르로. 도덕적 가치는 옳고 그름에 대한 원상이나 기준에 관한 것이다.", "source": "20261114_171623.jpg"}, {"kind": "paragraph", "text": "도덕적 가치에 바탕을 둔 마케팅 윤리는 고객과의 관계뿐만 아니라 종업원, 판매자, 공공 단체 및 기타 이해관계자와의 관계에도 적용된다. 흔히 기업, 전문 집단, 사회 집단이 채택한 윤리 강령으로 공식화된 도덕적 가치는 표적 선정 및 커뮤니케이션에서 추진 및 가격 결정에 이르기까지 모든 것을 포함한다(그림 17-3 참조).\n 비윤리적인 마케팅 활동이 벌벌이 아닌 수준 있을 을 기억하는 것이 중요하다. 마케터가 일반적으로 수용되는 행동 규칙이나 공식적인 윤리 규정을 위반하는 것은 비윤리적이다.\n 소비자 윤리(consumer ethics)는 소비자가 어떤 선택 및 결정과 행동에서 무엇이 도덕적인 것인지를 그들 자신의 기준에 대한 행위이나 개인의 도덕적 가치이다. 이러한 도덕적 가치는 소비자가 소비 물품과 소유물에 대해 규명을 속임수나 도둑질 등에서 벗어나게 해줄 수 있다.윤리적인 신념, 관념, 원칙은 소비자로 하여금 무엇가에 대해 도덕적 것과 잘못된 것을 구별할 수 있게 해준다. 소비자가 비윤리적인 일을 할 때, 비록 다른 사람들의 피에인지 않는 한 도덕적 기준이 떨어졌기 때문에 죄책감을 느낄 수 있다. 행동규칙, 또는 비윤리적인 행동에 대한 옳고 그름으로 개인에 대한 소비자 윤리 감에 따라 달라진다. 소비자는 집단 구성원들의 외부 집단 구성원들 비해 부정적 감정은 갖기가 쉽고, 외부 집단 구성원들에게 무언가를 훔치는 것을 쉽게 용납할 수 있다.\n 일탈적 소비자 행동(controversial consumer behavior)은 특정 집단이나 사회에서 허용된 행동에 있어서 규정을 어기는 불법적, 중독적 또는 공격적이거나 그 외의 규범을 위반하는 행위이다. 그 러므로, 일탈적 소비자 행동은 범법 또는 건강하거나 사회적이지 여겨지는 것을 위반하는 것이다. 어느 소비의 획득 단계, 사용 또는 소유 단계, 처분 단계와 관련될 수 있다. 그리고 이는 불특정 또는 표적 고객, 일반인과 같은 또는 소비자 세그먼트와 관련될 수 있으며, 각 집단이 문화적 요소 분에서 이러한 내용을 다룬다. 그림 17-4는 일반적인 일탈적 소비자 행동을 분류하고 있다.\n 17-2a 취득 쟁점 취득과 관련된 네 가지 일탈적 소비자 행동은 (1) 소비자 절도, (2) 암시장 및 위조품, (3) 중독 및 강박적 행동, (4) 취약 집단에 대한 마케팅이다. 처음 세 가지는 소비자 윤리를 포함하고 있고 네 번째는 마케팅 윤리를 포함한다.\n 소비자 절도 소비자가 법적 권리, 허가 또는 동의 없이 자신의 것이 아닌 물품을 지불하지 않고 가져갈 때 발생하는 것을 절도라고 하며, 이는 불법이다¹. 소비자 절도는 소매점과 서비스 제공자에게 큰 재정적 곤란을 야기하고 있다. 기업들이 반드시 극복해야 할 소비자 절도의 일부 사례들은 상점 절도, 자동차 보험 사기, 신용카드 사기, 스트리밍 서비스 불법 이용, 음악, 영화, 소프트웨어의 불법 복제, 반품사기, 가격표의 변경이나 바꿔치기 등이 있다.²\n 그림 17-5에 제시한 것과 같이 두 가지 주요한 동기, 즉 (1) 절도 행위를 합리화하는 능력이라야 (2) 절도 행위의 위험을 위축하는 욕구³(은) 절도 행위의 위험을 위축하는 욕구라 는 두 가지 심리적 요인이 절도를 결정한다. 이러한 요소들은 제품의 구매 환경, 소비자의 의", "source": "20261114_171627.jpg"}, {"kind": "heading", "text": "절도에 대한 유혹", "source": "20261114_171631.jpg"}, {"kind": "paragraph", "text": "해 영향을 받는다.\n 절도에 대한 유혹 절도에 대한 유혹은 소비자가 합법적으로 구매할 수 없는 제품을 원할 때 일어나며, 제품의 실질적인 비용을 충족시키거나 판매했을 때의 금전적 이익 때문에 나타난다. 소비자도 또한 정상적인 채널을 통해 구매하는 것이 너무 광범위적(예: 과일을 마카라마나 합법적으로 구매할 수 없는(예: 미성년자들에게 술과 담배, 약물) 절도만을 용인되는 유혹에 빠진다.13 (1) 제품이나 서비스의 가격이 높을 때, (2) 절도의 비용이 낮을 때, (3) 상점의 안전성과 감시가 낮을 때, (4) 적발 시 처벌이 낮지 인지될 때 절도의 발생 가능성이 증가한다. 이 네 가지 요인들을 합쳐서 절도에 대한 ‘합리화된’ 정당성 체계를 구성한다고 부정의 많은 요소가 상점 도둑의 인지된 위험에 영향을 미친다.15 거버가 분비거나, 분야의 거대 앞서, 범죄 영향이 높아지거나, 판매원이 거의 없거나, 숨은 맞은 상황이 오거나, 쉽게 바꿀 수 있는 카드로만 사용된 소비자", "source": "20261114_171631.jpg"}, {"kind": "paragraph", "text": "로 하여금 자신의 절도가 눈에 띄지 않으리라고 믿게 만들 때 유혹이 더 커질 수 있다. 첼도에 따르면 네 가지 ‘경제적’ 원인을 넘어, 스릴을 추구하는 경향은 소비자 절도와 관련이 있다. 16 결론에는, 소비자가 물리적 상점에서 온라인으로 이동하면서 소프트웨어 침해, 스트리밍 서비스 불법 접속, 그리고 소비자가 다양한 행사에 착용한 후 패션 의류를 반환하는 ‘럼웨이 등의 절도까지 \n 소비자 절도의 또 다른 원인으로 도벽이나 강박적 절도가 있다. 18 도벽은 훔친 제품을 소유하고 싶어하는 욕구가 아니라, 비정적인 사용이나 이득을 위한 이유가 아니라 물건을 훔치고 싶은 충동을 억제하지 못하는 반복적인 실패로 인한 것이다. 19 \n 절도에 대한 정당화 소비자는 또한 자신의 행동이 해롭지가 외부적인 요인에 의한 것이라고, 예를 들어 정당화할 수 있을 때 절도할 가능성이 높다. 예를 들어, 해군 복지협의회가 개인 무시함을 위한 수준이어서 절도라는 용어를 적당하지 않기 때문에 소비자는 식료품점에서 포도 한 알 같은 가치 품목을 훔치는 일을 정당화할 수 있다. 일부 소비자는 마케팅이 제품 진열대를 번영하거나 일부 없이 쉽게 교체될 수 있는 가치품을 사용하기 때문에 ‘누구나 그렇게 한다’고 정당화한다. “누구나 그렇게 한다”는 것또 다른 방법이지만,", "source": "20261114_171634.jpg"}, {"kind": "heading", "text": "없음", "source": "20261114_171641.jpg"}, {"kind": "paragraph", "text": "이 경우에 사람들은 절도가 규범을 위반하지 않거나 심지어 ‘규범’으로 해석될 수 있기 때문에 ‘도둑질을 해도 괜찮다’고 느낀다. 한 연구에 의하면 응답자의 11%가 돈은 지불하지 않고도 온라인으로 음악을 ‘마음대로’하거나 소프트웨어를 복사하는 것은 잘못이라는 데 동의했지만, 만일 누구나 다 그렇게 한다면 믿는다면 그들도 그런 행동을 따를 수 있다. 요약하면, 도덕적으로 행동할 의사가 없기 때문에가 아니라, 그런 행동만큼 규범에 반대행동을 관행으로 받아들이기 때문에 도둑질은 소비자의 ‘같은’ 가게에서 물건을 훔치거나 다른 일탈 행동을 하는 등 덜 도덕적으로 행동하는 것에 대해 허가를 받았다고 느낄 수도 있다.21\n 암시장과 위조품 소비자 행동은 지불해야 할 물건에 대해 지불하지 않은 것을 말하며, 이는 불법이다. 대조적으로, 소비자는 암시장에서 획득한 물건에 대해 돈을 지불한다. 그러나 구매한 암시장 물건의 출처, 생산과정, 책임자 등은 피해자에게 명시되어 있지 않다.22 암시장에는 의류, 임대 경기, 술집 및 바, 제약품, 의료기기, 카피요인 의류가 유통되는 일이 많다. 이런 제품들은 일반적으로 정품의 제조자가 허가한 이베이 또는 전자 상거래 계정과 같은 서비스를 모방한 관계자에게서 구입할 수 있다. 파프르카 시티처럼 전문 암시장의 사례는 온라인 환경에서도 존재하지만, 대리인이나 관리인의 입장에서도 마찬가지다. 테러리스트들은 마약, 콘서트 티켓, 위조 통화 등 음성적인 제품을 거래한다. 복제품 시장에서는 사회적 욕구를 충족하기도 하지만, 사회적 본성은 위조품에 상응하는 성적적 욕구를 만족시키기도 한다.23\n 정규 상점에서 기원 불확실 한 일반 물품들은 암시장에 거래된다. 예를 들어, 일부 비타민은 인기 있는 스포츠 이벤트의 응원 도중 자원봉사자에게 무료로 배급되었으나 그것이 암시장으로 유입되었다. 어느 연구에 따르면 8%의 영국 소비자들(17%의 이탈리아 소비자, 38%의 그리스 소비자)은 암시장에서 물건을 구입해도 괜찮다고 생각한다.24\n 합법적으로 소비자에게 판매할 수 없는 제품, 예컨대 불법으로 거래되는 또는 서비스는 선거자금이나 도난된 군수품(예: 총기 등)처럼 소비자에게는 불법 또는 규제 상품 및 기타 극악인 사건 중심에 국내 통용외의 가치가 폭락한 변성된다.25\n 암시장은 일반 시장에서 사용하는 일부 상품은 위조품(counterfeit products)이다(그림 17-6 참조). 위조품은 원래 브랜드의 이름, 로고, 포장 및 기타 부정, 즉 ‘트레이드 드레스(trade-dress)’(지적재산권 용어로 제품의 고유한 이미지를 형성하는 색채조합·간판·모양 등을 뜻함)의 역차를 가지고 있지만 가격이 저렴하다. 이 제품들은 소비자 속에 가치가 진짜인 것으로 믿게 하려는 목적을 갖고 있다. 다른 사람들에게 인정받은 유명 고이적품으로 위조 브랜드의 옷을 구입한다는 소비자는 원하는 명품 위조품을 오랫동안 암시장을 찾을 가능성이 크다.26 일부 위조품으로 소비자를 기만하는 위조 제품도 있으며, 이 현상은 정품 제조업체들로 하여금 심각한 경제체계가부담가운데이다. OECD는 위조품 시장의 규모가 연간 약 2천 500억 달러로 추정하고 있다. 구찌(Gucci) 핸드백과 롤렉스(Rolex) 시계는 오랫동안 소비자에게 인기 있는 브랜드 중 하나이다. 이러한 경우에", "source": "20261114_171641.jpg"}, {"kind": "heading", "text": "중독 및 강박적 행동", "source": "20261114_171644.jpg"}, {"kind": "paragraph", "text": "픈 소비자가 구매한 제품의 가격만을 항상 알지 못할 수 있지만, 보통보다 낮은 가격이라는 점이 중요하게 인식될 것이다.28 모조품(copycat)은 원래 브랜드와 약간 다른 이름과 상표를 가지고 있으며, 약물 모조품의 예를 들면 ‘품절이라거나 같은 공장에서 나온 제품’으로 오인을 유도할 만한 다양한 변명을 해놓고 있다. 술이나 시계때문에는 시계의 부정확한 제품이나 꾸지 트렌드따위ㅠ(명백하게 복제품이) 같은 사례가 있다.\n 위조품 및 모조품은 브랜드 소유자와의 경제 관례에 금전적인 피해를 줄 뿐만 아니라 소비자에게 심리적, 신체적 해를 끼칠 수 있다. 섭 기능 장애를 위한 위조 약물에는 잘못된 복용량, 미량 및 오염, 다른 약물과의 혼합물이 포함될 수 있으며, 이는 모두 위험할 수 있다. 말라리아 퇴치를 위한 일부 약물 로 모조품은 아시아에서 동남아시아 아프리카에 이르기까지 한발 뒤쳐진 네트워크에 달려에 달려간다.30 마찬가지로 일부 소비자들은 위조 차량을 구매하는 것은 위조 바퀴를 장착하는 것이며, 위조 음식과 타이어 등이 제품의 유통 생인 및 진통이 필요하다고 설명한데 여전히 낮은 구매 의도를 보였다.31\n 중독 및 강박적 행동\n 소비자 절도의 일종인 구매는 비윤리적이고 불법적이지만, 중독과 강박적 행동은 논란이 있을 수 있으모 비윤리적일 수는 없다.\n 중독(addiction)은 혐오적이면서도 불구하고 술, 담배, 재방 또는 오락을 막무로끝 사움을 계속 복용하려는 반복적인 욕구이다.32 중독된 소비자는 그 결과에 커다란 애환이나 외로움을 느끼고 체구슬을 하기 위해 반드시 그것을 사용해야 한다고 믿는다. 꽤 사람들은 술이나 담배와 같은 약물에 의존하고 운영 색 판매에 중독될 수 있다. 많은 경우에는 도박이나 비디오 게임에 해당되는 제품군이 포함되며, 이러한 중독 행동의 사용을 포함한다. 중독된 사람들은 방그고 싶어도 그렇지 하는 것은 자신의 통제 밖(나 자신을 도울 수가 없다)이라고 믿는다. 중독 사람들은 자신에 관한 해를 끼치면서 후회감을 느끼고 죄악감을 느끼기도 한다. 일부 명족된 소비자들은 이익을 목적으로 이러한 확장을 추잡아 판매하기도 하여 걱정의 일이다.33\n 중독된 동맹 등 도둑질과 약 구구 사말들을 살 수 없게 만들 수 있다. 또한, 예방할 수 없는 죽음의 원인이 흡연은 폐암과 심혈관 질환, 만성시질 질환과 폐생적 피해와 생명을 위협할 수 있는 주 원인이다. 피해자로서 연간 48만 명의 미국에서 흡연자건단숫돌의 15%의 모든 사망자 포함아가 발병하고 전 세계적으로 약 700만 명이 흡연으로 인해 사망하는 것으로 추정된다.35\n 강박적 행동(compulsive behavior)은 혐오든 결매에도 불구하고 의도적으로 수행하지 않다 고 느끼는 반복적인 행동들이다. 예를 들어 손톱에 의도적으로 분갈이를 한다. 강박적 행동자는 자신하기 무엇인가를 말할 수 밖에 없는 상황에 처하게 된다. 그로써 때로는 행동하도록 느낄 수 없기 때문이다. 이 행동은 내면의 불안과 스트레스를 증가시킬 수 있으며 정신적 일생이 난난기부터 심각한 고도 불안증을 것이다. 강박적 행동은 반복되는 공격적인 행동에서 일상적인 난리낄한 생활고통인 구매 및 저장, 성행(OCD의 사례까지 다양하다. 일상 실무에서는 경제생활 전체에 걸쳐 소비자는 자신의 돈과 불쾌적인 대파 논쟁이 있다. 그래서 소비자들은 세상에 가장 중요한 경험을 위한, 고객 중심의 전력적 결재적 선택을 내린다. 중독과 강박적인 소비와 같은 행동은 증상을 보이기 때문에 기업과 정책 입안자들이 사람들의 환자에 영향을 더 잘 이해하는 것이 중요하다. 대부분의 사람들은 이러한 행동을 선택할 수 있다는 점도 인식해야 한다.", "source": "20261114_171644.jpg"}, {"kind": "heading", "text": "강박적 구매 행동과 취약 집단 표적", "source": "20261114_171649.jpg"}, {"kind": "paragraph", "text": "강박적 구매 행동(compulsive buying behavior), 또는 강박적 구매 장애(CBD)라는 심각한 심리적, 사회적, 직업적, 경제적 결과에도 불구하고 지속적이고 과도하게 물건을 구매하는 행동을 말하며, 이러한 강박적 구매는 개인의 삶에 극심한 부정적 결과를 초래한다.40 이 상태를 경험하는 사람들은 소유하거나 사용하는 것이 아니라 구매하는 행위로 만족을 얻는다.\n 강박적 구매는 강한 감정적 요소를 갖고 있으며, 감정은 가장 부정적인 것으로부터 가장 긍정적인 것까지 범위에 걸쳐 있다.41 강박적 구매에는 기분의 변화와 관련된 강한 자극이 있다. 예를 들어, 어떤 소비자는 강박적 구매를 하면 큰 흥분을 느낄 수 있다. 또는 극적인 쾌감과 흥분과 통제의 상실감을 유발하며, 이러한 반응 다음에는 후회의 죄책감, 부끄러움, 우울을 느끼게 된다.\n 사람들이 강박적으로 구매하는 이유는 무엇인가? 근본 이유는 자존감이 낮은 경향이 있다는 것이다. 사실, 강박적 구매로부터의 경험하는 즐거움은 부분적으로 구매에 빠지게 되는 주위의 사회의 승인으로부터 탄탄된다. 대다수의 사람들에게 옷을 입는 행위는 매력적이면서 편리함을 위해 필수적이지만 강박적 구매자에게는 이 행위가 자신의 자존감을 표현할 수 있다. 또한 소비자는 구매를 통해 판매원이나 기업을 기쁘게 해주는 만족을 얻을 수 있다. 이러한 이웃 또는 주위의 사람을 기쁘게 하는 감정은 심리적으로 강박적 구매자의 자존감을 높일 수 있으며 구매 행동을 강화한다.\n 강박적 구매의 재정적, 정서적 그리고 대인 관계의 결과는 파괴적일 수 있다. 이러한 결과는 과도하게 신용카드에 의존하여 신용카드 부채가 많고 최소한의 원리 회수만 지불하는 경향이 있다. 강박적 구매자는 또한 다른 사람들로부터 돈을 빌릴 가능성도 크다.42 강박적 구매자의 지출 습관 때문에 친구와 가족, 중요한 주변인들이 상처를 받을 수 있다.\n 다음의 인물군과 소비자 행동은 어린이와 같은 취약 소비자 집단을 대상으로 하는 마케팅 활동에 대한 것이다.\n 취약 집단 표적\n 일부 소비자 집단은 일시적이나 지속적인 능력 부족으로 인해 그들을 대상으로 하는 마케팅 활동을 이해하거나 대처하는 데 취약할 수 있다.43 이는 개인 특성(나이, 교육, 경험, 건강 상태), 사회 환경(사회 변전, 고용불안), 기업 실천(예: 마케팅의 복잡성)과 같은 여러 요소에 의해서; 혹은 그가 온난화와 관련이 있을 수 있다. 소비자 문해력(consumer literacy)은 최적의 혜택을 계산하는 등의 기술, 매장의 반품 정책 등의 지식, 제품 비교, 단가 확인 등 합리적 혹은 효과적인 소비자 결정을 내리는 데 필요한 기술, 지식, 행동 참여 등을 갖추는 것을 의미한다.44\n 특정 소비자 집단은 나이 때문에 또는 마케팅 자극을 주의 깊고 정확하게 평가할 준비가 되지 않았기 때문에 마케팅 관행에 취약하다. 고령의 소비자는 정보 처리와 회복에 더 많은 어려움을 겪는 경향이 있으며, 성장성과 발달상의 문제나 마케팅 활동을 구별하는 능력이 발달하지 못한다. 결과적으로 그들은 더 쉽게 사기성 설득에 굴복할 수 있다. 미국에서는 연간 약 100만 명의 고령 소비자가 사기의 피해자가 되어 그와 단락에 의한 손실을 입는데, 이에는 각종 사칭 사기, 경품 사기, 전화 사기 때문에.46", "source": "20261114_171649.jpg"}, {"kind": "paragraph", "text": "어린이들의 소비자 문해력 수준이 낮다는 점에서 그들을 대상으로 한 광고는 상당한 논란의 대상이 되어 왔다. 두 살이 되면, 미국 아이들의 90%가 정기적으로 비디오나 TV를 시청하고 있나.47 그램질리슨(동의를 받음)은 웨어러블 카메라를 이용하여 어린이들이 학교와 집에 서 하루 10시간 동안 노출된 마케팅 메시지를 추적하는 연구가 있었다. 이 연구에 따르면, 아이들은 평균 10시간 동안 554개의 브랜드(이릉, label, 광고에 노출됐는데, 특히 음식, 의류, 교육과 같은 카테고리 및 놀이기, 에더느느, 삼성, 맥도날드, 구글 크롬, 윈도우와 같은 브랜드가 많 았다.48\n 이러한 차이를 구분할 수 있는 나이가 되면, 왁시어는 광고와 프로그램을 구분하지 못한다.49 열 살이 되면 아이들은 광고의 목적이 자신에게 어떤 것을 판매하기 위 한 것임을 이해하기 못할 뿐만 아니라.50 어떤 아이들은 성인과 같은 수준의 소비자 문해력에 도달하지 못한다.51 반면 광고 메시지를 비판적 시각에서 보는 것은 그대로 믿을 가능성이 더 높다.51\n 따라서 광고업체, 제품 생산자와 지방정부는 어린이 취약한 나이대의 아이들을 선해함을, 광고는 미친다던 감각적 어필을 넣어 설계해야 한다. 한편 어린이들의 강한 물질 욕구를 만족시킬 수 있도록 부모가 함께 자녀와 함께 텔레비전을 시청하거나 노트북, 태블릿 및 기타 화면에서 보는 콘텐츠를 제한할 수는 없다. 이는 아이들의 소비자 문해력을 높이는 데 방해가 된다. 그 결과, 광고는 아이들의 다체적 효과를 불러일으킬 수 있을 것이다.52 또래 부모에게 더 많은 장난감이나 건강 에해로운 음식과 같은 제품을 구매해 달라는 요청을 증가시킬 수 있고, 이는 가족 갈등으로 이청질 수 있다.54\n 이른바 호칭하거나 은밀한 광고의 효과에 대한 우려가 제기될 수 있듯,55 이런 광고에는 유아학습 머닝 아래 장난감과 학습게임, 특정 브랜드 롱화를 광고하는 메시지는 멘톨, 음료, 간편 조리 제품이 포함.. 는 계체 제품, 소셜 미디어, 특정인 인플루언서가 제작한 콘텐츠 등에 포함될 만. 부모들은 소프트웨어를 사용하여 일부 사이트에 대한 액세스를 차단할 수 있다. 하지만 아이들은 자신이 좋아하는 웹사이트로 차단당한 필요성을 이해, 웹사이트 또는 사이트에서 개인 데이터의 이메일 주소를 요구할 때 이를 제공하지 말아야 할 필요성을 이해하지 못할 수 있다.", "source": "20261114_171652.jpg"}, {"kind": "heading", "text": "마케팅 활동은 중독적이고 강박적 취득 행동을 조장하는가?", "source": "20261114_171657.jpg"}, {"kind": "paragraph", "text": "값싼 상품은 위조 신분이나 처방 약물들과 같이 위험할 수 있다. 자이나이(Zynga)를 포함한 지불식에는 고객들이 위조 처방 약물들을 인식할 때까지 막대한 돈과 무한한(온라인) 우주에 대해 알려주는 인생을 비철로 운영한다.67 소비자 피해를 떠올리게 더키 위해 준슨 앤드 준슨(Johnson & Johnson)은 유통 업체와 약국이 자발적 HIV 안전 프로그램을 개발하는 것을 지원 및 장려해 왔다.68\n 마케팅 활동은 중독적이고 강박적 취득 행동을 조장하는가?\n 물질을 비롯한 다른 주요 이슈에는 2000년 초에 얼마나 마케팅과 물질간에 강한 인과적 관계가 있는지에 대해 많은 논란이었다. 그럼에도 불구하고, 공공 정책을 수용하는 사람들에게서 사회 비평가들은 다양한 마케팅 관행들이 중독적이고 강박적인 소비를 조장하는 것은 물론 소비자 행동에 좋지 보편적 문제로 확대될 수 있다고 주장하고 있다. 한 가지 대표적인 예는 다수의 국가에서 혐오 정보를 다양한 제품의 마케팅에 도입하고 있는 담배이다.\n 흡연율을 감소시키기 위해 다양한 캠페인이 전개되고 있음에도 불구하고, 특히 개발도상국에서는 흡연율이 증가하는 가운데, 많은 국가에서는 잔디 담배를 금지하고 있다. 미국에서는 현재 30개 이상의 주에서 21세 미만의 사람들에게 담배를 금지하고 있다. 담배 관련 각종 경고문과 그림을 의무화했음에도 불구하고, 담배 판매량은 여전히 높은 편이다. 전 세계적으로 매년 600만 명 이상이 담배로 인한 질병 및 부작용으로 목숨을 잃고 있어, 21세 이하의 일부 판매점 전시 판매를 중단하고 있다.69\n 마케팅 활동은 담배 소비를 감소시킨다. 호주에서는 1992년부터 담배 광고가 금지된 이후, 이후 담배는 피우지 않고 보고만 있었던 청소년의 비율이 29%에서 77%로 증가했다. 물론 흡연 중단에 영향을 미치는 요소는 매우 다양하다. 캐나다에서도 청소년 흡연율은 감소추세를 보인 반면, 이는 광고의 효과를 보인 측면도 있겠지만, 금연을 위한 사회 일반의 캠페인도 복합적으로 작용한 것이다.\n 일부 의사와 심리학 및 대인간 전문가 일각에서는 전자 담배 및 궐련형 전자담배 광고가 기존 담배 광고와 마찬가지로 젊은 층의 주의 무분별 가명 판매를 유도한다고 비판해 왔다. 이에 관련한 내용은 그림 15-9에서 자세히 다루고 있다. 또한, 일부 연구 결과에 따르면, 미국 최대 담배 회사인 필립 모리스(Philip Morris)의 오랜 후원이던 페라델(Ferrari) 포뮬러 원 자동차 경주 타이틀의 계약은 2022년에 종료되었다.66\n 지발적인 커뮤니케이션 채택, 정부의 광고 금지, 담배 포장 경고에 대한 엄격한 규제에 더하여 담배 산업은 퍼지 시장감시와 활동을 저하시켜 위해 소셜 미디어에 대한 감시와 간섭을 강화하고 있다.69\n 마케터는 어린이를 대상으로 해야 하는가?\n 기업은 자사가 제공하는 제품과 서비스에 대해 어린이들과 소통한다. 어린이를 대상으로 하는 마케팅 관행을 규제하는 것은 국가 및 국제 정부, 광고 업계 자체, 그리고 개별 기업들에 의해 이루어진다.\n 먼저, 국가 및 국제 정부 기관들은 어린이을 대상으로 한 마케팅을 규제한다. 예컨대 미국에는 아동온라인개인정보보호법(Children’s Online Protection Act: COPPA)과 연방거래위원회(Federal Trade Commission: FTC) 법이 어린이의 개인 정보와 안전을 보호하기 위해 광고를 규제한다. 마케터와 퍼블리셔는 웹사이트에서 어린이의 연령을 확인된 니사이트의 제재사는 어린이 개인 정보의 안전을 유지해야만 있으며, 5세 오락과 관련하여 불필요한 소비자 낭비를 최소화해야 한다. 예컨대 미국 내 어린이 성인과 심사인으로 소통할 수 있는, 안전한 환경을 제공해야 한다. 이 법은 온라인에서의 게임과 채팅을 포함하여 거의 모든 형태의 디지털 커뮤니케이션에 적용된다. 업체는 정보 유출과 악의적 공격으로부터 어린이의 개인 정보와 안전을 보호하기 위해 여러 안전 장치를 마련하고 있다. 단, 이 법은 온·오프라인과 상호작용하는 어린이의 소비자 행동에 비해 매우 엄격한 편이다.\n 둘째, 광고 업계는 상업자율심의협의회(Council of Better Business Bureaus) 내에 어린이광고검토단체(Children’s Advertising Review Unit: CARU)의 어린이 광고에 대한 지침을 제정했다. CARU는 온라인 게임의 이지적인 행태를 인식하고 제품이 줄 수 있는 것에 대해 정확히 알지는 못하고 있다. CARU 인터넷 광고는 특히 어린이와 가족에게 영향을 미치는 나라들로 어린이 광고를 규제하고 광고 표준을 허용하는 기관에 속한다. 예를 들어, 영국 광고표준위원회(Advertising Standards Authority)는 어린이에게 부정확하게 표적으로 하는 광고에 대한 홍보를 조사한다.\n 셋째, 넷플릭스에서는 같은 어린 가족을 사회의 폭이 맞는 미디어 실현에 대한 윤리 기준을 제정했다. 2023년 넷플릭스는 어린이용 대상 콘텐츠에서 식품 광고를 없앴다. 이 회사는 또한 피자 브랜드와의 협상이 실패에 이르는 한계에 맞춰 광고를 제작할 수 없게 되는 콘텐츠를 설명하기로 했다. 이와 마찬가지로 미국 TV 및 온라인 플랫폼에서도 특정 식품 광고 및 콘텐츠를 제한하고 있다.\n 기업은 실천적으로도 같은 여러 기업들은 사회의 윤리 및 마케팅 윤리 어린이를 대상으로 하는 마케팅 커뮤니케이션 전략을 더 많이 고민하고 있다. 세계보건기구는 2023년 보고서를 통해 전 세계 미디어에서 어린이에게 설탕이 함유된 가공 식품 및 음료의 마케팅을 규제할 것을 촉구했다. 각국 정부는 자국의 상황에 맞는 어린이 보호 정책을 수립하고 있으며, 이에 따라 TV 및 온라인 플랫폼, 소셜 미디어 및 게임 플랫폼에도 적용될 것이다.", "source": "20261114_171657.jpg"}, {"kind": "heading", "text": "17-2b 소비 쟁점", "source": "20261114_171700.jpg"}, {"kind": "paragraph", "text": "제품의 사용 또는 소비 또한 윤리적인 논쟁을 일으킬 수 있다. 그림 17-6에서는 쟁점이 되는 소비의 일반적인 형태를 다룬다. 여기에는 (1) 미성년자 음주 및 흡연, 기타 약물 소비, (2) 과식과 비만, (3) 타격적 도박 및 게임을 강조한다. 더불어, 소비자 개인 정보 보호와 이상화된 자아 이미지 홍보에 따른 마케팅 윤리함 규탄한다.\n 미성년자 음주 및 흡연, 기타 약물 소비\n 주류, 담배 및 다른 약물, 그중에서도 오락용 약물을 포함한 소비는 이러한 소비가 금지되어 있는 국가와 주에서 법적 제정이 되는 한 형태의 소비 행동이다. 허용되는 경우에는 제한, 미성년자 소비 및 과도한 소비는 문제가 될 수 있다.\n 흡연자의 약 90%가 18세에 술 담배를 피우기 시작했다.74 이러한 수치는 담배 광고에 대한 규제가 제한된 나라에서 눈에 띄게 나타난다. 건강 외에 외에도 미성년자의 음주와 약물 소비는 범죄, 청소년 자살, 지적, 만성 중독, 폭력, 학습을 저해 하는 원천, 산재들의 불안, 숙주의 고통, 청소년 자각, 학교에서 적응의 어려움, 이들과 같은이 부모의 부정 영향을 미친다. 상당수의 주에서 21개 주의 워싱턴 D.C. 및 몇몇 이웃 마리화나를 법혐화했다.75 예를 들어, 콜로라도주에서는 만 21세 이상이 사람들에게 소량의 최대 1온스의 마리화나를 소지하고 나눌 수 있게 되었다. 미성년자의 소비는 불법이지만 혼한해, 마리화나의 소비가 범행화되었는지에 대해서는 논쟁의 여지가 된다. 옹호자들은 마리화나가 스트레스와 통증을 줄여주고, 중소한 위험하지 않으며, 중독성이 없은 의료를 위해 제공한다고 주장한다. 반대자들은 이것이 공중 보건 및 안전 위협을 초대하며, 일부 범법력을 도덕적으로 반대한다고 주장한다.76\n 과식과 비만\n 비만이 전 세계적인 증가는 일부에서 ‘전염병’이라고 부를 만큼 심각한 보건 문제이다.77 미국의 성인 중 약 42%가 비만이다(비만일 지수 [BMI]가 30보다 큼). 40년 전에 13%에서 상승했다. 영국에서도 성인의 약 25%가 비만이라고 추정되며, 다른 국가들도 유사하거나 더 나쁜 상황임을 보인다.78 비만은 일정의 사람이 주요 원인이며, 만난방법 가운데 다양한 반신환경과 연관되어 있다. 비만의 직접적인 원인은 과포로린 음식의 과다 소비와 소비의 에너지를 충분히 사용하지 못하는 것이다. 만다 신체 활동의 권고된 권고된 음식의 이용 가능성, 집에서 식사를 준비하는 시간과 욕구 감소, 도심가 외부의 보행 가능성 감소, 차량을 포함한 개인 차량에 대한 더 큰 의존 등의,\n 소비자가 과식하고 비만이 될 가능성을 줄이기나 늘리는 여러 요인이 대해 말하는 것이 알려져 있다. 예를 들어, 소비자가 레퍼런스 점의 음식 또는 접시 크기에 추가적인 인센티브(예 경력)의 크기를 조절할 때, 사람들이 절 수 있기 추가적인 인센티브를 선택한다. 설정 인센티브가 작은 사람들은 더 큰 경력 가능성을 선택할 경우 놀라게 만들다. 소비자는 제품을 구매하고 나면 인체에 자기 통제를 성공적으로 발휘했과 상황을 쉽게 기억할 수 있는 식 사 행동을 더 잘 조절할 수 있다.78 그러나 현재의 시사를 통해한다고 노력함에도 소비자는 수익을 자신의 ‘진정한’ 욕구와", "source": "20261114_171700.jpg"}, {"kind": "paragraph", "text": "취향과 딜 일치하는 것으로 인식한다.83 또한, 건강에 해로운 음식에 대한 공익광고는 다이어트를 하는 사람들로 하여금 상대적으로 몸에 좋은 음식을 더 원하게 만들 수 있다.84 모든 사람이 때때로 과식을 하지만, 일부 소비자는 강박적으로 과식을 한다(그림 17-4 참조). 이러한 폭식은 심각한 건강 문제로 이어질 수 있어 관련된 사람들은 그것을 숨기는 데 전문가가 되어 발견하기 어려울 수 있으며, 이는 비만을 더욱 부추기게 된다.85 빅게시판은 현실적인 1회 제공량 정보를 단 눈에 띄게 제공합니다 과식하는 경험을 방지할 수 있다.86 비현실적으로 작은 제공량 정보(간과 제공량: 감자칩 2개 제공량에 대한 정보)는 실제로 과식에 유의한 영향을 미치지 못할 수 있다.87 소비자가 이전에 과식을 했다는 성찰적 사고를 해보도록 하는 것은 과식을 방지하는 데 도움이 되지 않는다.88 고피 소비자들은 때때로 음식 소비에 대한 부정적인 감정을 피하기 위해 이러한 정보들을 알고 싶어하지 않는 경우도 있다.89 구매 시점에 소비자는 건강에 만족하기보다는 가격과 기대된 맛에 민감할 수 있다. 그러면 가격과 기대가 건강에 대한 목표를 가리게 되고, 건강한 음식의 가격이 중요한 울러질수록 주요 근거가 줄어들 수 있다.90 건강한 음식을 섭취하는 데 어려움은 개인별, 가족별, 이타적 가치가 있다. 소비자는 건강식을 보다 건강하지 못한 식품은 맛있고 즐건 만한 것으로 지각하는 경향이 있다. 예를 들면 또한 건강한 음식에 포함하는 덜 걱기 때문에 이러한 음식들은 더 덜 맛있는 것으로 지각한다. 이러한 문제에 대처하기 위해 상품 기획자, 마케터, 식품 과학자는 식품의 맛을 더 건강한 것으로 느껴지게 하기 위해, 이타적, 자신의 체중 조절, 및 자기 프라이드와 관련된 메시지를 사용하여, 건강식을 홍보하기 위해 마케팅용을 개선할 수 있다.91 예를 들어 자신의 체중에 관심을 가질 때, 건강에 좋지 않은 음식(예: 파스타)과 관련된 음식의 섭취율을 대신 샐러드(예: 파스타 샐러드)는 맛이 없고 건강하지 않은 것으로 인식하는 경향이 있다. 그러나 동일한 음식들이 건강에 좋은 이름(예: 샐러드)을 사용하면 건강하고 맛있는 것으로 지각한다.92 소비자들이 샐러드와 관련된 일반적인 사고를 통해 샐러드에 대한 언급을 바꾸었다.93 사실, 메뉴에 건강한 음식(예: 샐러드)이 포함되어 있는 메뉴에서 가장 건강하지 않은 음식을 주문할 가능성이 높아졌다.94 또한, 소비자는 메뉴의 양에 집중하는 대신 갑각질 종류(즉, 맛)에 집중하여 건강에 유해한 음식을 먹는다.95 흥미로운 점은, 온라인으로 선택할 때 실제 상황에서보다 건강에 해로운, 고-열량 음식을 덜 구매하는 것이다. 이는 단순히 그림으로만 보일 때 음식의 유인이 덜 생생하게 다찬 욕구가 줄어들기 때문이다.96 또한, 소비자는 자주 먹지 않은 음식이 자주 먹는 음식보다 더 몸매에 덜 영향을 미친다고 느낀다.97 섭취의 작은 변화들을 통해 소비자가 더 건강하게 만족을 받을수 있다. 예를 들어, 건강한 선택지(예: 샐러드)를 건강에 좋지 않은 선택지(예: 파이)의 왼쪽에 배치하는 것은 건강한 선택지를 선택하는 경향을 늘린다.98 또한, 소비자들은 작은 포크를 사용할 때 더 먹게 되며, 큰 접시를 사용할 때는 더 많은 음식을 담는다.99 뷔페를 사용할 때는 포크를 사용할 때보다 국자를 과소평가하여 더 많이 먹는 경향이 있다.100 음식은 더 큰 테이블에서 먹을 때 사람들은 더 작은 양을 선택한다. 왜냐하면 테이블이 클수록 음식의 양의 양에 대해 덜 크게 만들기 때문이다.101 음식 소비와 식품에 대한 평가는 다른 사람이 먹는 모습과 다른 사람의 선택에 의해서도 영향을 받는다.102 소비자들은 공공장소에서 사회적 상호보다 더 작은 음식을 선택한", "source": "20261114_171706.jpg"}, {"kind": "paragraph", "text": "다.103 밤날는 공공장소에서는 사람들이 얼마나 먹고 있는지에 대한 생각을 방해하여 더 많은 칼로리를 섭취하려는 경향이 있다.104 또한 식당에서 공유하는 음식은 덜 포만을 갖춰서 느끼게 돼 칼로리 섭취량이 늘어난다.105 다른 사람이 대신 선택할 때 소비자는 ‘악한’ 음식을 더 많이 소비한다.106 예를 들어, 육회의 질감과 꾸꾸한 체리 초콜릿 케이크를 먹게 되는 경우가 그러하 다. 그리고 사람들은 다양성을 추구하고 다양성을 추구하고 싶을 때 먹는 양과 칼로리 섭취 량이 더 증가될 수 있다.107\n 강박적 도박과 게임\n 강박적 도박은 약 500만 명의 미국인에게 영향을 미친다.108 일반적으로, 강박적 도박 행동은 여러의 단계에 걸쳐 발전한다. 때로는, 항상은 아니라도, 소비자는 먼저 돈을 승리기 위 한 놀이를 느낀다.109 그러나 놀이가 갈수록 더 부추어지지고 손실이 쌓이면서 개인의 삶이 황폐 해진다. 어떤 사람들은 문제적 도박을 그만두려 했지만 아직까지는 그러지 못하게 된다. 마 지막 단계는 손실을 복구하기 위한 같은 깨달을 떠난 변명한다. 도박은 미국에 400개가 넘는 신 카즈가가 있을 정도로 온라인 카지노 같은 큰 산업이며, 온라인에서도 더 많이 이루어진다.110 2030 까지 전 세계 온라인 도박 이용은 1,500억 달러 이상으로 예상된다.111\n 강박적 게임은 강박적 인정이다.112 세계보건기구(World Health Organization: WHO)에 따 르면 “게임 장애를 진단하려면, 행동 패턴이 개인, 가족, 사회, 교육, 직업 또는 기타 중요한 영역에서 사람의 기능에 중대한 영향을 초래할 정도로 심각해야 하며, 일반적으로 최소 12개 월 동안에 명백하게 나타나야 한다.”고 하였다. 사람의 온라인 게임 패턴은 중요하다. 사람 이나 연령에 따라 달라질 수 있지만, 사람들은 게임을 소유하기보다는, 더 일반적인 것으로서, 강박적 인터 넷(온라인) 또는 강박적 게임과 관련이 있다.113 소비자는 스마트폰에서 화면 시간을 모니터링하 력을 조절하는 것은 가깝게 하지만 그 사용을 제한하려는 의지는 적다.114\n 일탈적 소비 행동을 방지시키고 억제하는 데 마케팅 관행이 미칠 수 있는 직접적인 영 향을 이해하는 것이 중요하다. 또한 마케팅 관행은 개인 정보 보호와 이상적인 자아 이미지 홍보와 관련하여 일탈적 소비에 대한 또 다른 역할을 한다.\n 개인 정보 보호\n 기업은 인터넷 검색이나 소셜 미디어 이용 또는 실제 상점에서 쇼핑을 하고 있거나 공공 장소에 있는 소비자로부터 방대한 양의 상세한 정보를 추출할 수 있다. 이러한 데이터를 사용 하고 소비자의 사생활을 보호하는 것에 대한 사회적 논의는 점점 더 커지고 있다.115 소비자는 자신의 사생활에 대해 신경을 쓸지라도 온라인이나 공공장소에 있을 때 항상 신경 쓰지는 않을 팬더라 그렇게 할 수도 없다. 예를 들어, 소비자는 개인 컴퓨터보다는 스마트폰을 사용할 때 캐 러 광고에 더 많이 노출된다.116 이는 아마도 스마트폰이 더 개인적이고 가깝게 느껴지기 때문인 일 것이다.117 소비자가 페이스북에 사진을 올리거나, 트위터에 메시지를 게시하는 경우, 광고 주는 소비자가 온라인 비디오를 시청하는 경우 이러한 활동이 여러 기업에 의해 추적될 수 있다. 예를 들어, 어떤 온라인 알뜰미디어는 유튜브나 관련된 광고를 소비자에게 제공하는 데 있 다. 때때로 유튜브 온라인 및 오프라인의 소비자와의 상호작용을 강조하기 위해 노력한 다. 이는 관련이 없는 광고에 불편함을 느끼는 소비자가 많을지라도 잠재적인 브랜드에 에 그 다른 가치의 있는 도움을 줄 수 있다. 그러나 일부 소비자의 사생활 보호 또한 법적 및 정부 기관", "source": "20261114_171709.jpg"}, {"kind": "heading", "text": "이상화된 자아 이미지", "source": "20261114_171716.jpg"}, {"kind": "paragraph", "text": "수집된 정보의 양과 유형, 그리고 마케터의 이러한 정보 이용에 대해 걱정하고 있다.119\n 이상화된 자아 이미지 다양성과 포용성이 향상되었음에도 불구하고, 많은 광고는 여전히 젊고, 아름답고, 마르고, 건강하며 능력있는 사람들을 확장하고 균형 잡힌 개인, 가족 및 사회적 상황에서 보여 준다(그림 17-7 참조).120 사회비교이론에 따르면, 소비자와 이상적으로 인식되는 자아 이미지지, 소비자가 현실에서 경험하는 자아와의 동일(또는 단수에 어긋나는 이미지)을 비교할 때 일종의 범주 오류가 발생한다. 즉, 사람들은 스스로를 마케팅 이미지의 모델과 비교함으로써 합리적이 되면 더 매력 있어 보이고, 이는 자존감과 태도에 심지에 장기적인 부정적 영향을 미치게 된다. 사회적 비교 이론(social comparison theory)은 사람들이 객관적인 비교 기준이 없을 때 정확한 자기 평가를 찾고 타인과의 비교를 추구하는 자연스러운 욕구에 의해 평이 이루어진다고 보는 것이다. 비교 감정은 긍정적 자존감을 향상시키거나 소득수준의 기준에 하향화 또는 상향 수준의 기준을 맞추는 심리적 기능을 반영하고 있다.121 광고에서 이상화된 모델이 기준이 되면, 소비자는 상향 비교를 하게 된다. 실제로, 젊은 소비자는 광고에 나오는 모델과 비교하여 모델과 비교를 하며, 이러한 상향 비교는 자존감에 부정적인 영향을 줄 수 있다.122 그렇지만 자존감 수준, 가까운 사람과의 비교 여부, 모델 또는 건강에 관한 기준에 따라 다를 수 있다. 신체에 자신이 없는 소비자는, 예를 들어, 매우 마른 모델과 동일한 옷을 입은 매력적인 사람을 발견했다면 그 옷을 입을 위한 가능성이 낮아지게 된다.124", "source": "20261114_171716.jpg"}, {"kind": "heading", "text": "소비자 사회정의 마케팅, 윤리, 사회적 책임", "source": "20261114_171719.jpg"}, {"kind": "paragraph", "text": "민 단체들이 전통적인 프로모션, 온라인 소셜 미디어를 통한 공공 또는 고지광 신문의 어린이 대상 마케팅을 좀 더 강하게 규제해야 한다고 캠페인을 벌이고 있다. 예를 들어, 영국의 어린이식품 캠페인(Children’s Food Campaign)은 마케터가 브랜드 캐릭터, 애니메이션 및 기타 도구들을 사용하지 않고 식품을 하는 어린이에게 정크 푸드를 더욱 매력적인 것으로 만드는 학교와 당국에 어린이 관련 기관을 요구했다. 미국에서는 농무부의 새로운 학교 내 스마트 스낵(Smart Snacks) 지침을 만들었는데, 이 지침은 어린이들을 위한 더 비만을 예방하기 위한 방법 중 하나로 초등학교에서 판매되는 스낵 식품은 최소 영양 수준을 충족해야 하며, 경제적 비용이 막대하므로, 이 문제를 해결하는 것이 중요한 과제가 되었다. 이를 해결하기 위한 방법의 하나는 건강하지 않은 식품과 음료의 마케팅을 제한하여 어린이의 식습관을 개선하는 것이다. \n 일부 기업들은 건강을 촉진하는 이해와 사회화는 올바른 영양과 신체 습관에 있어서 성인에게 중요한 밑거름을 키운다. 회복력을 키워주고, 소비자 선택권을 높이는 기회를 제공한다. 그러나 건강에 해로운 제품, 특히 어린이에게 판매되는 제품을 마케팅하지 않으며, 건강에 해로운 음식을 먹지 않도록 하는 것이 어려운 선택이 될 수 있다. \n 둘째, 음식 광고 규제, 학교 급식 의무화, 신체 활동 프로그램 제공, 샐러드바 같은 비책 제공 등 다양한 정부 개입은 건강 증진에 긍정적으로 기여할 수 있다. \n 셋째, 기업과 매체들이 건강한 행동을 권장해야 한다는 기업의 사회적 책임을 인식하는 것이다. 식품 제조업자들도 건강식품과 음료를 강조하고, 영양가 있는 제품으로의 광고를 전환해야 한다. 예를 들어, 유명한 펩시콜라(PepsiCo)는 무설탕 음료에서부터 오트밀 바가 더 건강에 좋은 스낵 수단 가치를 한층 높인 음식을 냈다고 광고했다. 또한 보다 매력 있는 것과 같이 인체에 신체 에너지, 요구르트 같은 건강식 음료를 제공했다. 그러나 문제는 이러한 조치가 항상 의도한 결과를 내지는 못한다는 점이다. 건강을 위한다는 메시지가 소비자의 부정적인 인식을 강요하는 공공캠페인은 다이어트를 하는 사람들이 그 음식을 먹을 수 있게 만들 수 있으며, 다이어트를 하지 않는 사람들은 이를 무시할 수 있다. \n 넷째, 소비자는 음식과 제조 회사의 음식성을 보여주기 위한 규제 및 법률 제정을 위해 활동할 수 있다. 예를 들어, 식품회사에 공동으로 행동할 수 있다. 그림 17-8은 이와 같은 비영리 소비자 캠페인의 예를 보여 주고, 이 장의 후반부에서는 해당 소비자 행동 캠페인에 대해 다시 다룬다. 네 번째 예시는 담배 없는 캠페인(“Campaign for Tobacco-Free Kids”) 조직의 웹사이트이다. 담배 없는 어린이를 위한 캠페인은 국가 및 세계에서 담배 사용과 그로 인한 건강 문제를 줄이려는 소비자 행동 운동이다. 이 캠페인은 정치, 법, 대중 교육을 결합하여, 국가 내에서는 주, 시, 지역 사회에서 활동하고 있다. 담배 없는 어린이 캠페인은 먼저 대부분의 담배 제품 소비자가 이미 시작 시점에는 어린 청소년일 때 담배를 피우기 시작하는 점에 초점을 맞춘다. 다양한 캠페인, 프로그램 및 정책 역시, 담배 없는 어린이를 위한 캠페인을 위해 및 기타 대상 커뮤니티를 담합, 건", "source": "20261114_171719.jpg"}, {"kind": "paragraph", "text": "17-2c 처분 쟁점\n 10장은 자발적으로 소유물을 처분할 수 있는 선택권에 대해 기술하였다. 이러한 처분 결과 중 일부는 지속 가능성과 환경 보호 측면에서 논란의 여지가 있다. 10장에서는 또한 쓰레기와 배구재의 불법 투기 및 쓰레기 투기에 대해 이미 논의하였다. 이 절은 두 가지 다른 제품 처분 행동에 초점을 맞춘다. 이 여전히 사용 가능한 제품을 처분한 것과 (2) 제품을 폐기하지 않는 정당 강박 행위이다.", "source": "20261114_171724.jpg"}, {"kind": "heading", "text": "사용 가능한 제품의 처분", "source": "20261114_171726.jpg"}, {"kind": "paragraph", "text": "제품을 사용할 수 있을 때 처분하라는 소비자는 다른 소비자에게 선물로 주거나, 유용한 제품을 교환하거나, 판매 또는 경매하거나, 기부하거나, 재활용할 수 있다. 재활용에 관한 연구는 재활용의 중요성에 대한 구체적 신념과 그것에 대한 일반적인 태도가 소비자의 재활용 행동 참여 여부와 재활용의 본질적 가치 여부에 직접적인 영향을 미칠 수 있음을 증명한다.151 때로는 비용보다 인식률 수 있기 때문에, 단순히 휴대폰과 같은 사용 가능 제품을 버리는 잠재 행위는 논쟁의 여지를 남한다. 예를 들면, 소비자가 전자제품을 업그레이드하여 새 제품으로 교체할 때 중고제품이 기존 제품 없는(사용 가능한 상태)에 대한 적절한 재활용 또는 살발 서비스를 활용하지 못했다는 경구가 있다. 실제로 스마트폰, 노트북, 모니터, TV, 오디오 스피커 등의 전자 기기를 포함한 미국의 전자 폐기물은 연간 약 5,900만 톤으로 추정된다. 최근까지 전 세계 전자 기기를 생산하는 회사 중 약 12%만이 수집되었고 재활용된 것으로 보고되었으며, 나머지 88%는 주거지의 쓰레기 퇴장 및 매립지로 운반되는 등 손실과 상당한 환경 오염을 유발하고 있다. 이러한 무분별한 물질은 인해 경제적 가치의 엄청난 손실과 거대한 환경 영향을 초래한다.152 그리하여 유럽연합(EU)과 미국은 휴대전화 작동 연구에 관해서 전자 및 전기제품의 안전한 처분에 대한 엄격한 법률을 제정하였다.153\n 저장 강박\n 현재 노트북 초기 모델이나 소파, 낡은 식기 세트, 오래된 신발 등 일시적으로 사용하지 않는 내구재 또는 제품을 즉시 버리지 않는 것이 경제적으로 타당하다. 다만 제품을 보관하는 저장행위는 다양한 빌도 체험적으로 또는 상황적으로 그로장가 저장 강박이 되면 또는 저장 강박 장애로 변질될 수 있다. 미국 정신의학회에 따르면, 저장 강박 장애가 있는 사람들은 상품을 보관해야 한다는 인식 때문에 소지품을 없애거나 버리는 데 지속적인 어려움을 겪고 있다. 소유물과 헤어지려는 시도는 심한 고통을 야기하고 그들은 저장하거나 저장하려는 경향으로 이어진다. 결과적으로 발생하는 어수선함은 심한 고통과 비기능적인 수준의 저장 장애로 이어질 수 있다. 종종 저장 강박 또는 도찐 와 관련된 강박적입니다 식물과 곤충을 유지하는 비축을 다룬다. 저장 강박은 야구 카드나 양조장의 티셔츠, 키와와(Kiwawa) 콘서트의 쿠월렉션 등 소장품을 유지하는 것과도 다르다. 수집품은 정리된 습고 조직되어 있어 소비자 및 타인들에게 유희 기능적, 상징적, 및 필요 자원을 가지며 확장된 자아의 일부가 될 수 있다.155 반면에, 저장 강박과 관련된 문제의 있는 사람은 쓰레기 관련물, 캐리백, 폐업, 용기, 신문 또는 의미나 금적적 가치가 거의 없는 물품도 어수선하게 보관할 수 있다. 또한, 옷을 사용하거나 수리할 옷이나 쾌감 같은 물품들도 포함된다.156 사무이 나이흡자 마음속에서 강박 강항 경향이 증가하는데, 미국에서 60세 이상 성인 중 약4-6%가 저장 강박 장애가 되는 잠정적 상황을 내포하고 있으며, 인구 고령화로 인해 저장 강박 문제가 더욱 심각해질 것으로 예상한다.157", "source": "20261114_171726.jpg"}, {"kind": "heading", "text": "17-3 마케팅의 사회적 책임", "source": "20261114_171732.jpg"}, {"kind": "paragraph", "text": "지금까지 이 장에서는 다양한 소비 논란을 독립된 현상으로 묘사했다. 그러나 (1) 일부 강박적 소비 행위가 동시에 발생할 수 있고, 이를 동반 질환(comorbidity)이라고 한다. 또한 (2) 특정 강박적 소비 행위가 소비자의 네 가지 성격 특성과 관련이 있다는 증거가 있으며, 이는 14장에서 나오프로필스에서 설명되었다.\n첫째, 여섯 소비자 프로파일 가운데 강박적 구매와 폭식증이 관련되어 있다.159 미국의 중류 표본에서 강박적인 구매와 강박적인 저장의 관련성이 발견되었다.160 폭식증은 주기적 폭식과 관련되어 있으며,161 강박적인 도박과 쇼핑은 담배, 불법 약물 소비자 모두 관련되어 있다.162 둘째, 2,000명 이상의 참가자를 대상으로 한 연구에서, 포괄적 강박 소비의 결과 높은 수준의 문제적 소비는 신경증성(neuroticism)과 관련이 있으며, 성실성(conscientiousness), 우호성(agreeableness), 개방성(openness) 및 외향성(extraversion)의 수준이 낮다.163 다른 연구에서는 높은 신경성, 외향성 및 개방성이 약물, 담배 및 장부 약물 사용과 높은 관련이 나타났으며, 낮은 성실성 및 우호성은 이러한 물질 사용을 낮게 예측했다.164 이것은 외향성 및 개방성이 물질 남용(높은 수준)과 관련되어 있음을 보여준다. 또 다른 패턴은 불안한 기질을 갖춘 알코올릭들에 관한 연구 결과는 미래에 더욱 자세히 피해처럼 정교한 심리적 특성과 일부러 소비자 행동의 복잡한 패턴을 보여 준다.\n 17-3 마케팅의 사회적 책임\n 경제학자 밀턴 프리드먼(Milton Friedman)은 “기업의 사회적 책임은, 이익을 증대시키는 것”이라는 유명한 말을 했다.165 대부분의 기업은 자신을 위한 단기적인 이익이나 장기적인 사회적 책임을 추구하기보다는 기업의 사회적 책임(CSR)을 전체 전략의 필수 요소로 삼아 두 가지를 병행하는 것을 목표로 한다. 사회적으로 책임 있는 행동을 하는 것은 기업의 브랜드 평판을 향상시키고 소비자가 높거나 낮은 신뢰성을 가진 브랜드 양상을 수용하도록 장려함으로써 기업을 돕는다. 또한 이는 회사의 제품과 서비스를 향상시키고, 과거에 있었던 기업의 무책임을 보상하며, 이후의 무책임에 대비한다.167 그리고 앞에서 말한 것은 대기업뿐만 아니라 중소기업의 마케팅 또한 궁극적으로 한 공동사회의 전반에 걸쳐 사회적으로 준 법이 있어야 있으며 지속 가능한 행동들을 장려하기 위해 중소형 업체에 의해 활동을 행하여야 시작했다.166 물론 소비자의 저항과 회의적인 태에 대한 염려 때문에 초기의 사회적 책임 캠페인은 어떤 영향을 미치지 못하는 경우도 종종 있다. 기업의 사회적 책임 활동은 사회에 미치는 긍정적 영향을 집어하는 소비자에게 ‘따뜻한 감정을 준다.168 하지만 이러한 프로그램은 소비자 행", "source": "20261114_171732.jpg"}, {"kind": "heading", "text": "17-3a 환경 의식적 행동 및 윤리적 소싱", "source": "20261114_171735.jpg"}, {"kind": "paragraph", "text": "동에 의도하지 않은 부정적 영향을 미칠 수도 있다. 예를 들어, 사회적 책임 활동을 강조하는 것은 명품과 사회적 책임이 맞지 않을 때 고가의 명품 브랜드에 해를 끼칠 수도 있다.170\n 고급품 후원부터 프로그램을 포함한 다양성 및 포용 프로그램, 예술 및 문화 행사, 그리 고 환경 보호 노력에 이르기까지 많은 다양한 사회적 책임 활동에 참여하고 있다. 다음 절에서 는 (1) 환경 의식적 행동 및 윤리적 소싱, (2) 지역사회 참여라는 마케팅과 소비자의 주의가 기 욱어진는 두 가지 활동에 관하여 살펴보았다.\n 마케팅은 환경적 요인과 다른 방식으로도 지속 가능한 비즈니스 행동에 기여할 수 있다. 환 경 피해를 줄이기 위해 자동차 회사의 부품 공급 업체, 석유 회사 등은 모두 정부의 무연휘 발유 사용과 연착한 배기가스 규제를 따라야 한다. 이러한 노력은 종종 마케팅 비용을 증가하고 있으며 판매의 잠재적인 기회를 제공한다. 환경친화적인 제품 사용의 수 요가 증가함에 따라 환경친화적인 기항성 세제제품을 판매하는 세븐스 제너레이션(Seventh Generation) 같은 기업에서, 자원을 모의가 되었다.\n 보전 행동(conservation behavior)은 화초, 천연자원의 사용을 제한하고 지속 가능한 소비 를 장려하기 위해 소비자들은 기업의 환경 문제에 대한 개인적 책임을 아무리 보전할 가능성이 가장 크다.171 실제로 거의 모든 소비자(여자는 포함되지 않음)가 소비 때문에 언제가 부족하다는 사실을 인식한 소비자는 이에 대해 무엇인가를 하고 싶은 마음이 높다. 그러나 흔히 많은 환경적 문제에 대해 소비자들은 책임을 느끼지 못하고 행동을 취하지 못함으로 동기부여가 되지 않는다. 설 타서 보전 프로그램이 성공하기 위해서는 전기 사용이나 물 소비와 같은 자원의 보전은 개인의 결 약을 할 수 있는지에 대해 소비자에게 가르치고, 그들의 소비 습관이 전체 문제와 어떻게 관련되어 있다는 메시지를 전달해야 한다. 소비자는 자신의 행동이 차이를 만들어 낼 수 있다고 생각할 때, 즉 지각된 유효성이 높을 경우에 보전 행동을 수행할 가능성이 크다.\n 재활용을 함으로써 소비자가 환경정신을 내보이는 것이 좋다고 마음가짐이 되어 있다. 소비자들은 재활용 환경침해가 될 수 있는 행위이기 때문에 재활용을 하지 않는 것이 좋은 일이 될 수 있다.173\n 환경친화적 행동에 대한 정보와 방법의 신뢰할 만한 지지는 ‘녹색 제품’이란 말에 대한 제조협추들은 다시 환경친화적인 인식과 싸우며, 소비자가 긍정적 녹색 제품을 너무 많이 사용하려는 것은 맞을 수 있다.174\n 한편 관련에 대한 전문가는 소비자가 그들의 환경을 쉽게 내릴 수 있도록 가전제품의 에너지 효 율 표시 사례를 보여 준다. 미국 에너지부는 판매된 대부분의, 백색라벨에는 로고가 포함되어 있다. 제 품에서 이것을 보는 소비자는 만계한 효율한 제품보다 더 에너지 효율적인 것일 수 있다. 이런 효율 표 시 체계는 많은 국가에서 알맞게 제도를 제공한다. 여러 사람이 사용되어 일본 대부분의 제품에 보면 가장 효율적인 녹색부터 가장 비효율적인 빨간색까지의 에너지 효율 등급 표시의 실제 발생, 초 금색 별로 눈에 띄는 디자인을 가지고 있다. 또한 제품 구성에 따라 에너지 효율 표준을 규정하는 표시 롤 나타내는 별 다섯 개까지 등급 표시 제도도 사용한다.\n 이러한 정보는 끌로 소비자를 자신의 사회 규범에 호소할 때 훨씬 더 효과적일 수 있다.175 호 텔 손님들을 대상으로 한 연구에서, 사회적 규범에 병이 머무는 대부분의 다른 투숙인들은 수건을 재 사용합니다)에 대한 호소가 지속 가능성에 대한 호소보다 더 효과적이었다.176 일반적인 소비", "source": "20261114_171735.jpg"}, {"kind": "paragraph", "text": "의 지속 가능성이 소비자 결정에 있어 정기적인 고려 사항이 되도록 브랜드는 반복적으로 소비자에게 상기시키고 자부심과 같은 긍정적인 감정의 호소할 필요가 있다.177\n 또한 마케팅은 때때로 식수 가능성에 대한 호소와 제품 사용으로 절약된다는 등 소비자의 편익 등에도 호소함으로써 효과를 높일 수 있다. 그림 17-9에 언급된 에너지효율라벨은 잘 알려진 정보 라벨이다. 라벨은 제품이 소비되는 환경에 얼마나 어떻게 영향을 준다는 것에 관한 유용한 정보를 포함하고 있다. 안내라벨은 소비자에게 어떤 시점에서 그리고 어떤 방식으로 상쇄 또는 대체행동을 할 수 있다는 정보도 포함하고 있다. 안내라벨을 통해 소비자는 개별 제품과 서비스가 사용하는 자원과 에너지 회사가 지속 가능성에 대한 진정성이 있는지 믿지 않음에 따라 지속 가능한 제품에 대한 선호를 표현할 수 있다.178 에너지효율라벨의 경우, 독립 기관이 발행하는 것이 중요하다. 일부 학문적 문헌과 전문가들로는 검증되지 않은 주장에 근거한 제품은 이미 소비자에게 더 지속 가능하다고 인식되기 때문이다. 이로 인해 이러한 인식이 더욱 강조될 수 있다.\n 또 다른 혹시의 효과로는 소비자들이 탄소 배출저감에 보조에 대한 인센티브를 경험하는 것이다. 소비자들은 높은 세금처럼 경제적인 벌벌에 대한 세금 걷기 같은 인센티브는 싫어한다. 추후적으로 목표를 세우고 피드백을 제공하는 것이 소비자가 에너지 절약이 도움이 될 수 있다. 예를 들어, 샤워하는 동안 얼마나 많은 물을 사용하는지에 대한 피드백을 제공하면 물 사용량을 크게 줄일 수 있다.180\n 환경친화적인 행동에 대한 공공의 관심과 지원은 마케팅 목적을 위한 환경적 주장에 요", "source": "20261114_171740.jpg"}, {"kind": "paragraph", "text": "용을 야기하는 기업 그린 워싱(corporate greenwashing)에 대한 반발을 가져왔다. 마케터가 존재하지 않거나 매우 미미한 환경친화적인 혜택을 홍보하면 때 그린 제품이나 서비스에 대한 소비자의 불신은 단순히 허용하는 것처럼 보이기 때문에 부정적으로 인식될 위험이 있다. 기업 위선(corporate hypocrisy)은 기업의 명시된 높은 도덕적 가치와 실제 행동들 사이의 불일치를 의미한다. 이러한 위선이 드러나면 기업의 환경 수익에 대한 소비자 수용에 경계되어고, 부정적 감정이 들 수 있으며, 기업의 사회적 평판에 부정적인 영향을 미친다.\n 한편, 모든 도덕 문제가 기업 위선이나 친환경주의 마케팅에 대한 인식만을 전반으로 해석 수 있다. 이를 들면, 폭스바겐이 그들의 디젤 자동차가 실제보다 더 친환경적으로 보이도록 소프트웨어를 사용했다는 사실은 인정할 것은 독일 자동차 회사의 방침에 타락을 일린 사례이다. 그러나 소비자들이 폭스바겐 차량에 대해 불만을 품은 국외 정부 국내 정부 모두는 마케터가 환경범죄행위의 윤문동동성을 감추려고 시도했다는 점에서 비판의 지점을 마련했다. 소비자가 도무의 사회적 실천이 아닌 개인의 행동에 부정적 영향을 줄 수 있지. 결국, 정부가 기업의 지속 가능성 개입에 대해 처항할 수 있을지에 관해 도덕적인 욕식이 형성된다.\n 사회적 책임과 지속 가능 가치에 따른 공급이 이루어지고 제품이 생산되는 것을 의미하는 윤리적 소싱(ethical sourcing)에 대한 기업의 소비자 관심이 증가하고 있다. 예를 들어, 스타벅스는 2000년대 초반에 이미 그들의 커피 제품을 재배하고 가공하는 농장의 부문을 위한 구체적인 환경적, 사회적, 경제적 기준을 마련했다. 생산 원천이 공개가 초단정한한 데 대한 소비자의 고발뿐만이 아닌 그들이 북아프리카의 기후 변화에 대한 기여를 고려하는 윤리적 소싱을 통해 그 정체성을 구축하였다. 윤리적 소싱은 소비자 행동에 어떤 영향을 미치는지에 대한 연구에서 소비자들은 다른 사람들에게 그들의 사회적 공헌을 가정하고 드러내는 존재임을 밝혀주고 있다. 많은 실증적인 연구에서 소싱과 관련하여 의사 결정 권한을 가져야 한다는 점에서 연구에 참여를 통하여 소비자의 평거적으로 드러날 때 매달릴 가능성이 있다. 그러나 윤리적 단체에 대한 공공의 관심은 사적인 제도들에 커다란 변화를 가져게 했다.\n 또한, 위선적 행동은 기업이 표방하는 도덕 가치에 따른 가치와 일관되 있도록 행동하지 않을 때, 그들은 온 소비자 위선(consumer hypocrisy)을 나타낸다.106 소비자 그린 워싱(consumer greenwashing)은 소비자 위선의 특수한 형태이다. 이는 소비자가 친환경적이라고 주장하면서도 실질적이지 않고 상징적이기만 한 다양한 행동을 통해 이루어진다. 이와 같은 행태는 과거 연구에서 누군가가 스타벅스 컵을 재활용 용에 버리기보다 내(개인) 제도기를 들고 다니지 않거나 지속 가능성의 정치 장소를 방문하지 않는다. 다른 사람들은 그들의 명시된 가치에 따라 행동하지 않는 것을 비난으로 전환시킨다. 대규모 대조 표본을 가진 네델란드의 한 연구에서는 전문가로 또 소비자가 다른 사람의 위선적 행동을 할 수 있는 능력이 떨어지지만 그러한 행동을 하지 말라는 판단은 상대적으로 높은 동기를 인식하는 것으로 나타났다. 일부 사람들은 광고에서 친환경 가장 행동으로 사람들 가기를 이다고 느끼게 하지만 행동에는 가장 동기가 떨어지는 것이 높은 될 수 있 이 기여를 한다고 느끼지만 도덕적 가치와 실제 행동의 차이는 적당히이다.188 소비자는 “이미 나타 도다. 그러나 여전히 경쟁화된 자기기만의 힘들 은 영향을 받게된다.", "source": "20261114_171743.jpg"}, {"kind": "heading", "text": "17-3b 지역사회 참여", "source": "20261114_171748.jpg"}, {"kind": "paragraph", "text": "어제 물병을 재활용했고, 지난주 출근할 때 자전거를 타고, 지난달 지구의 날 활동에 기부했 다고 이유를 들 수 있다.\n 소비자 위신과 관련 위상은 일반적으로 불법적이거나 중독 또는 강박적 행동을 포함하 지 않으므로, 일탈적 소비 행동과 관련된 그림 17-4에 포함되지 않았 다. 그러나 이 행동들 은 속이고 매심하게 말해야 한다는 도덕적 가치를 위반한다.\n소비자 위신에 따른 예로는 소프트웨어, 영화와 같은 저작권이 있는 자료를 다운로 드하는 것이 있다. 이는 불법적이고 해로운 행위이기도 하다(그림 17-4 참조). 소비자는 습기 의 장점을 가지고 있다고 주장하면서도, 이를 구매하지 않고 다운로딩하고 사용하는 행동을 할 수 있다. 이 때문에 많은 공공서비스 광고들은 시간적 딜레마(지금 행동할 것인가, 아니면 나중에 할 것인가)와 사회적 딜레마(나, 그들, 또는 우리 중 누가 행동해야 하는가)에 대처하려 노력 하면서 때로는 소비자들의 도덕적 가치를 따르지 못하는 모습을 보여준다.\n 17-3b 지역사회 참여\n 기업은 마케팅을 지역사회 기반의 사회적 책임을 위한 준비재료로 사용할 수 있다. 앞서 보 았듯이, 펩시(Pepsi) 는 단체들에게 보조금을 주어 공장과 궁햔으로 고객들과 소비자에 대한 단체의 도움을 받으 아 학자본 하는 것처럼 보조금을 절달하여 단체 및 지역사회 구성원들의 적극적인 참여를 장려했다.\n 기업의 사회적 책임 프로그램의 일환으로, 기업은 일반인들이 근무하는 지역에서의 지역사 회 참여를 권장하는 정정책을 갖고 있는 경우가 많다. 이러한 참여는 애정으로 표명될 수 있 정적 무드 효과를 가져오지만 지역 사회 및 환경을 개선하는 구체적인 혜택을 줄 수 있다.\n다음의 예로 들리는, 타겟(Target)이 많은 직원은 지역 병원에 봉사한 지역 학교의 어린이들에게 책 을 읽어 주는 '읽기 친구'로 참여한. 제너럴 일렉트릭(General Electric)은 41개 나라에서 직원 자 원 봉사 프로그램을 운영한다. 전문가들은 이러한 프로그램들은 사회에 기여가 실제로 기업에게 단체가 마케팅을 창조하는 데 이 시간을 기부하는 것을 사용하려는 것은 다양한 지구의 날 사회 공 한어나? 이라겔 그림 17-10은 이러한 요청과 시간 기부 서허이 어떻게 중요한 영향을 미칠 수 있 는지 보여 준다.", "source": "20261114_171748.jpg"}, {"kind": "heading", "text": "17-4 소비자는 일탈적 마케팅 활동에 어떻게 대응할 수 있는가", "source": "20261114_171751.jpg"}, {"kind": "paragraph", "text": "마케터가 제공하는 서비스와 제품은 최상의 의도와 품질에 대한 세심한 주의를 기울여 만들어졌을 거기보다 작동하지는 않을 수 있다. 불만을 가진 소비자는 불량을 제거하고, 구제를 받기를 요구하고, 미래의 실수를 방지하는 방법으로 자신의 대응할 수 있다(10장에서 설멍). 그러나 마케팅 관행은 때때로 소비자 집단이 도덕적 감정에 따라 채책할 수 있다. 소비자는 이러한 문제를 항상 인식하는 것은 아니다. 마케팅 관행에 마음동화됨 좋은 마케팅 활동을 지원하기 위한 다양한 정치 활동에 참여할 수 있다.\n 첫째, 소비자는 제품, 서비스 또는 기업을 보이콧할 수 있다.193 때때로 개인적인 행동이 될 수 있지만, 보다 일반적인 보이콧(boycott)은 소비자들이 도덕적 가치를 채책하기 위해 조직된 행동이다. 즉 소비자들은 이들이 구매하는 제품이나 서비스를 구매하지 않음으로써, 특정 기업, 제품 또는 나라를 시장에서 고립시키거나 시장 지위를 낮추려는 목적을 가지고 있다. 크게 성장한 초기 보이콧의 예는 1791년 영국에서 일어났던 설탕에 대한 보이콧 운동이다. 설탕은 노예가 생산한 설탕을 거부하고, 납품 과라의 설탕을 선택하였다. 그러난 다른 사례로, 기린(Kirin)맥주 회사는 버마(현재 미얀마)에 있는 군사 독재 정군과 관련 있다는 비난을 받았다. 국제 캠페인organisational Campaign for the Rohingya: IRC)의 요구를 반영하여, IRC는 미얀마 군부의 모든 관련 상품을 중중하였다.194 소비자들은 잘못된 강장 사이의 상벌 균거가 있다는 것과 같은 이유로 회사를 대상으로 보이콧운동을 수행할 수 있다.195\n 한 보고서에 따르면 미국 내 소비자 최대 25%가 언젠지 제품이나 기업에 대한 불매 운동을 벌이고 있는 것으로 나타났다. 보이콧은 단연히 있다. 불매운동은 문화의 성공 진도는 ① 가격 정책을 변경했다는 것이며, ② 대상 사업자의 평판을 떨어뜨려 환경을 조성했다는 점이다.196 또한 ③ 다른 기업이 정치적 행동을 비판하거나 확행한 경우였다.\n 둘째, 소비자는 특정 기업 제품, 서비스 또는 상품 구매 장려할 수 있다. 일반적으로 구매 장려(buycott) 소비자가 높으 든덕간 가치로 인해 특정요인 제품이나 서비스가 구매될 때동의 퍼 의 정리이나 관행으로 인해 소비자가 특정 상품이나 기업을 구매하는 조직적으로 계획되는 것을 목적으로 한다. 이미 따라서, 불매운동과 구매 장려는 근목면에서는 관련이 있지만 특히 어느 정도 다르다. 구매 장려 운종 소비자를 고무했다. 즉, 보다 바람직하다고 여겨지는 회사로부터 많이서 제품과 서비스를 구매하도록 하는 것이다. 예를 들어, 리크 프로젝트 그룹(not just round coffee)은 공정무역 커피를 판매하고 구매를 통해 농민들의 시민적과 경제적 권리를 강화하려는 시민적 집단이다. 커피 판매로 인한 금액은 공정 선별금을 판매하기 시작했으며, 그 실기업 캠페인을 돕기 위해 여러 활동을 증가시켰다.197\n 다양한 고루 관행은 구매 결과를 자극하기 위해 노력한다. 예를 들어, 레인포리스트 연합이온스(Rainforest Alliance)는 식품 라임을 인증하고 지속 가능 생계를 전하는 식물 인증 하여 소비자 행동과 비즈니스 관행을 변화시킨다. 독립적인 제3자가 감사인은 농부들 식출 가능한 향후 윤을 주여하고 있으며,또한 다양한,198 기타 예서는 제3자에의한 에너지스타energy 사용 표지와 100% 재활용 표지가 있다.199 이러한 라벨 종종 소비자의 보수적인 정치 성향을 가진 소비자보다는 진보적 정치 성향을 가진 소비자에게 더 큰 구매 장려 역할을 발휘하는 선호도가 있다.200 조직된 구매 장려 집단은 이러한 불매운동 대중의 관심을 얻을 수 있고, 같은 수의 소비자가 개별적으로 행동하는 것보다 더 큰 영향을 미칠 가능성이 있다.", "source": "20261114_171751.jpg"}, {"kind": "paragraph", "text": "셋째, 소비자는 마케팅 관행이 도덕적 가치를 위반하여 중대한 피해를 초래한 회사를 상대로 집단 소송에 참여할 수 있다. 소비자의 구매 행동을 바꾸기 위해 행동운동가 팔레오즈가 이 일어난 반면, 집단 소송은 소비자의 구매 후 행동에 관한 것이다. 잘못과 경험된 피해에 대하여 소비자들은 마케팅 관행의 직접적인 변화와 종종 상당한 재정적 보상을 요구한다.202 폭스바겐 그룹은 실험실 시험 중에 엔진의 배출 가스 기준을 충족하도록 직접 구입한 디젤 엔진 소프트웨어를 조작한 혐의로 유죄 판결을 받았다. 회사는 도덕적 가치인 정직성과 준법을 저버린 범죄 행위와 환경·공중보건·소비자들에게 끼친 심각한 피해를 야기하였다고 인정하였다. 독일에서 진행된 집단 소송을 해결하기 위해 폭스바겐 그룹은 ‘디젤게이트(Dieselgate)’로 영향을 받은 47만 명의 고객에게 총액 3천억 유로(약 4조 원) 단위의 배상금을 지급하기로 합의하였다.203\n 넷째, 소비자는 회사 및 제3자의 회의에 직접 또는 간접적으로 자신의 문제가 가중된 또는 부정확한, 때로는 불편한 온라인 리뷰를 게시하거나, 심지어 혹사하거나 속이는 방법으로 가해 업체에 대해 복수하거나 방해할 수 있다.204 브랜드가 사들인에서 해당 기사의 공정성을 지키지 않았거나, 소비자가 작성한 개인적인 불신감이 브랜드 기칙지 않았다고는 발달할 수 있다.205 불평한 상품 구매 후 과대 광고나 가격에 불만을 품고 대응하지 않는다는 소비의 도덕적 가치를 위반할 수 있다.\n 다섯째, 소비자는 기만이나 사기를 방지하기 위해 옹호 활동과 캄페인과 시위를 할 수 있으며, 기존 법률·윤리강사나 회사 정책이 소비자의 이익을 시청하지 못하는 아라든지.206 이러한 전략은 종종 사화적으로 부적절하다고 여기는 비즈니스 관행에 대해 대중에게 알리려는 목적으로 사용된다. 미국의 시민 감독단체인 공익 시민단체(Public Citizen)는 온라인 개인 정보 보호 및 공정을 불법이라는 이슈로 행동을 조직하고 있다. 이 단체는 기업을 대상으로 하는 비영리 소비자 옹호 단체이다. 그림 17-8에 나타난 금연 아이들 캠페인도 그 예이다.\n 여섯 번째로, 자신과 다른 사람을 교육하여 소비자 문해력을 높이는 것은 논란을 일으킬 수 있는 마케팅 관행을 사전에 발견하고 이후에 이에 대응하는 데 도움이 될 수 있다. 그러므로 비판 문해력 수준이 증가하는 그 자체로 보람 있는 일일 것이다.", "source": "20261114_171756.jpg"}, {"kind": "paragraph", "text": "특별히 마케팅의 관심을 받는 사회적 책임 문제는 환경 의식적인 행동과 윤리적 소싱, 가격 인상 행동, 지역사회 참여 이다.\n 소비자는 불매운동, 구매 정지, 집단 소송, 보복 또는 방해, 옹호 단체 구성 및 가입, 그리고 자신과 다른 이들의 소비자 문해력 상승을 통해 이러한 마케팅에 대응할 수 있다.", "source": "20261114_171759.jpg"}], "notes": [{"source": "20261114_171606.jpg", "text": "CONSUMER BEHAVIOR 17장\n 그림 17-1 ▸ 17장의 개관: 소비자 사회에서의 마케팅, 윤리, 사회적 책임\n 마케터와 소비자는 의사 결정을 내릴 때 자사의 이익이냐, 다른 사람의 이익, 그리고 즉각적인 이익과 장기적인 이익 사이의 균형을 맞추어야 한다. 소비자 행동은 윤리, 소비자 권리와 의무, 사회적 책임, 소비자의 웰빙으로 지칭할 수 있는 넓은 범주의 영향을 미친다. 마케터들의 윤리적 또는 비윤리적 의사결정은 종종 사회적 책임 활동들에 의해 보완된다.\n 균형 추구 다음을 같은 균형을 이루는 의사결정에서 잠재적인 갈등 발생:\n· 자신의 이익과 다른 사람의 이익 · 즉각적인 이익과 장기적 이익\n 마케팅 윤리, 소비자 윤리 및 일반 행위 다음과 관련된 결정:\n· 획득 · 소비 · 처분\n 사회적 책임 · 유익한 성과를 위한 마케팅 · 소비자, 마케터, 또는 공동에 의해 시작됨\n 학습목표 1. 마케터와 소비자가 마주하는 사회적 및 윤리적 쟁점을 설명한다.\n2. 소비자들이 주요 소비자 행동을 파악한다.\n3. 소비자와 조직이 마케터를 사회적으로 책임 있는 행동을 하도록 촉진하는 방법을 설명한다.\n4. 소비자가 미화되지 않는 마케팅 관행에 저항할 수 있는 방법을 설명한다."}, {"source": "20261114_171611.jpg", "text": "사회적 딜레마 자신의 이익 또는 다른 사람의 이익을 우선으로 할 것인가에 대한 갈증.\n 시간적 딜레마 즉각적인 이익 또는 장기적인 이익을 우선으로 할 것인가에 대한 갈증.\n 그림 17-2 ▶ 사회적 딜레마와 시간적 딜레마 사회적 딜레마는 누구에게 초점을 둘지에 대한 반면 시간적 딜레마는 ‘언제’에 초점을 맞춘다.\n 사회적 딜레마 누구의 이익이 우선인가?\n• 나(개인으로서) 또는 • 우리(나, 가족, 친구, 동료, 나의 고용주, 이웃) 또는 • 그들(경쟁자, 다른 나라 사람, 사회 전반 등에 다른 사람들) • All (or society at large)\n 시간적 딜레마 어떤 타이밍이 우선인가?\n• 단기적 이익 또는 • 장기적 이익"}, {"source": "20261114_171623.jpg", "text": "기업의 사회적 책임 활동 기업의 주주 및 소비자, 등 이해관계자의 경제적, 사회적, 환경적 이익을 통합한 비즈니스 모델.\n 마케팅 윤리 마케팅 활동에 대해 정직하고, 공정하며, 존중하는 의사 결정을 내릴 수 있도록 개인 및 조직을 안내하는 도덕적 가치."}, {"source": "20261114_171627.jpg", "text": "그림 17-3 마케팅 윤리와 소비자 윤리 더바디샵(The Body Shop)은 환경 보존 프로그램과 마케팅 윤리를 적극적으로 홍보해 왔다.\n 소비자 윤리 소비자의 의사 결정과 관련하여 무엇이 도덕적 인지를 영하기 위한 일련의 규칙과 원칙\n 일탈적 소비자 행동 특정하거나 사회에서 허용된 행동의 규정을 어기는 불법적이 거나 규범을 위반하는 행위를 말한다\n ¹ 상점 주인과 소매 서비스 제공자에게(는) 손실과 관련된 비용을 소비자에게 전가하므 로 고객은 더 높은 가격을 지불해야 할 수 있다.\n ² FBI는 미국 내의 자동차 보험 사기로 인한 비용이 대략 매년 300억 달러에 이른다고 추정하고 있다.\n ³ 많은 사람들은 자신이 무의식적으로나 잠재적으로 위험을 바라는 것처럼 행동하기도 한다."}, {"source": "20261114_171631.jpg", "text": "그림 17-4 일탈적 소비자 행동의 분류\n 도둑, 아동, 재판 관여자에 일탈적 소비자 행동이 발생할 수 있다. 절도와 같은 불법 행위부터 중독 및 강박적 행동의 일탈 행동 및 거거 강까지는 다양한 것이 있다. 이에 그들은 일반적인 일탈적 소비자 행동의 유형을 제시한다. 또한 각 행동이 어떤 딜레마를 포함하는지 나타낸다. 소비자들의 행동은 마케팅 및 공중 정책 스트리밍에 반하는 사회적 결과를 강조한다. 도단기적 이익이 건강 이데야·애로쪽에서 큰데 직관에 따라 사람들에게 소비의 이익(또는 쾌락)의 행동이 피해당하는 위험에 비해 크지 않다고 생각되며 우호적 차원으로 유혹에 깊이 시전과 각기 미데이트하여 소비자가 과 거로 해 대하여 있다. 이러한 행동이 소비자가 거친 운명에 속하는 경우, 이 행동을 통해 소비자가 얻을 수 있는 이익과 소비자가 제공해야 하는 비용을 구체적으로 기록하며 이러한 이득 또한 소비자에게 비합리적으로 보이더라도 소비자가 먼저 각 전환 행동을 시키게 되며, 치닫게 하든 수익은 고려하지 않고 공공 이익의 대화를 미리 파악하여야 하는 소비자는 브랜드마다 행동이 다르며 그는 이 다양한 행동은 다양한 측면으로 (그리시 자기 아닌) 삶과 관련된 결과를 유발시킨다.\n 소비 단계 | 일탈적 소비자 행동 | 지배적 딜레마\n 취득 불법 행동:\n• 상점 절도, 신원 도용, 소프트웨어 침해, 불법 다운로드 및 스트리밍 • 도난 자동차 또는 시계, 패션, 차량의 부품에 대한 위조품 구매\n 중독 및 강박 행동:\n• 강박적 구매\n • 사회적 딜레마 • 사회적 및 시간적 딜레마\n • 시간적 딜레마\n 사용 불법 행동:\n• 공공장소 및 문화재에서의 온라인 도박, 음주 • 미성년자 음주 및 흡연\n 중독 및 강박 행동:\n• 알코올 남용, 흡연, 기타 물질 • 게임 남용 • 컴퓨터적 도박, 게임, 인터넷 및 소셜 미디어 사용\n • 사회적 및 시간적 딜레마 • 사회적 및 시간적 딜레마\n • 사회적 및 시간적 딜레마 • 시간적 딜레마\n 처분 불법 행동:\n• 쓰레기 매립 • 쓰레기 투기\n 중독 및 강박 행동:\n• 재정 강박\n • 사회적 딜레마 • 사회적 딜레마\n • 시간적 딜레마"}, {"source": "20261114_171634.jpg", "text": "제품 요소 - 바이촉하지 않거나 부끄러운 제품 - 비교적 높은 비용 환경적 요인 - 이용하기 쉬운 제품 - 제한된 보안 - 혼잡한 쇼핑 환경 소비자 요인 - 제품 욕망 또는 경제적 이익 - 낮은 인지 위험 - 분노, 스릴 추구 - 관람 - 약한 도덕적 가치\n 유혹\n 그림 17-5 ▶ 소비자 절도의 동기 소비자는 (1) 충동적인 유혹을 느끼고 (2) 어떤 방식으로든 자신의 행위를 정당화할 수 있기 때문에 도둑질을 한다. 제품과 환경 요소와 소비자 관련된 다양한 요소가 유혹과 합리화 능력에 영향을 미친다.\n 제품 요소 - 가격이 낮은 상품 환경적 요인 - 적은 잠재적 피해 - 제한된 보안 - 붐비는 쇼핑환경 소비자 요인 - 상점에 대한 태도 - 마케팅에 대한 태도 - 낮게 인지된 피해 - 약한 도덕적 가치\n 정당화"}, {"source": "20261114_171641.jpg", "text": "암시장 불법 상품의 거래를 촉진하고자 하는 국제적 영역의 교환을 비롯하여 국제적 영역의 교환이 이루어지는 시장.\n 위조품 원래 브랜드의 이름, 로고, 포장 및 기타 특성 등이 뜯어져 나간 상품으로, 의도된 드레스 기준 가지고 있지만 가짜 제품이다.\n 그림 17-6 위조품과 암시장 암시장에서 판매되는 디자이너 핸드백 같은 일부 제품은 위조품이며, 진품과 위조품의 차이를 구별하기 어렵다."}, {"source": "20261114_171644.jpg", "text": "강박적 행동 : 되도록 관여도, 의도적으로 행동하고 싶지 않다고 느끼는 반복적인 행동."}, {"source": "20261114_171649.jpg", "text": "강박적 구매 행동 강박적 구매 행동은 심각한 심리적, 사회적, 직업적, 경제적 결과에도 불구하고 지속적이고 과도하게 물건을 구매하는 행동을 말하며, 이러한 강박적 구매 행동은 제품 구매로부터의 정신 건강 장애이다. 이 장애를 경험하는 사람들은 그들이 소유하거니 사용하느 것이 아니라 구매하는 행위를 만족한느 사람이라고도 불림.\n 소비자 문해력 효과적인 소비자 결정을 내리는 데 필요한 기술, 지식, 행동 참여를 갖추는 것."}, {"source": "20261114_171652.jpg", "text": "마케팅 시사점\n 취득 논문은 마케팅와 소비자 및 기타 이해관계자와의 관계에 영향을 미치는 많은 중요한 주제를 제기한다.\n 소비자 절도에 어떻게 대응할 수 있는가?\n업체들은 절도 방지 장치와 보안 시스템 개발을 통해 절도를 방지하거나 줄이기 위해 매장 손상의 달러를 지출한다. 일부 기업은 비디오 카메라를 비롯한 CCTV와 정밀한 컴퓨터 모니터링, 전자 태그 등을 추가하여 매장 곳곳에서 소비자의 움직임을 면밀히 관찰하며 사용한다. 소셜 미디어의 등장과 소비자 집단 사건의 확대에 동시에 모여 집단으로 물건을 빼돌릴 수 있는 초기 경향을 통해 소셜\n 미디어와 인터넷 사이트를 모니터링하고 있다.56 보안 시스템과 장치는 정도를 줄일 수 있지만 고객 대상 서비스 품 방해할 수 있다. 예를 들면, 소매상들은 상품을 유리관 안에 진시하거나 열쇠로 잠궈 두거나 등에 보관해야 한다. 이러한 누가 적의 의한 인입과 접근에 대항해 방식을 비판할 뿐만 아니라 소비자의 제품 접 근의 편의성과 고객에 대한 서비스를 더 어렵게 만들기도 한다. 긴 시간 동안 쇼핑을 하게 한다. 보안 및 보안 시스템은 소비자를 위협할 수도 있다.\n 암시장과 위조품에 어떻게 대처할 수 있는가?\n마케터들은 암시장을 근절하기 위해 다양한 전략을 취하고 있 다. 많은 경우에 암시장을 통해 판매되는 제품은 저렴한 위조품,"}, {"source": "20261114_171716.jpg", "text": "그림 17-7 ▶ 이상화된 자아 이미지 광고 속 모델은 일반적으로 젊고, 매력적이며, 건강하고, 날씬한 이상화된 소비자상을 나타낸다.\n 사회적 비교 이론 사람들은 이상적인 비교 기준이 없을 때 타인과의 비교를 추구하는 경향이 있다. 기준은 소득, 체중, 교육 수준과 같은 변수가 될 수 있다. 또한 보다 높은 수준의 기준을 사용하면 상향 비교가 이루어지며, 낮은 수준의 기준을 사용하면 하향 비교가 이루어진다. 상향비교와 하향 비교 모두 때때로 비교 대상에 따라 응답자에게 긍정적이거나 부정적인 영향을 미치게 된다.\n 마케팅 시사점 마케터는 전략과 활동을 계획할 때 이러한 취득 경쟁으로 인해 제기되는 질문들을 이해해야 한다.\n 마케팅은 미성년의 과도한 음주 및 흡연 또는 다른 물질의 소비를 조장하는가?\n담배, 알코올, 대마 등 물질은 특히 고식선과 관련된 잠재적인 이익과 강력한 쾌락 때문에 여전히 많은 사람들이 소비하고 즐긴다. 이 중에서도 담배 기업, 주류 업체 및 구연 및 구강 관련 제품군 광고는 이러한 소비를 촉진한다. 그럼에도 젊은 소비자들이 주류 광고로 인해 특정 제품의 매력에 대한 인식이 높아지는 현상 때문에 주류를 구입할 가능성이 증가한다.126 마케터로서 대부분의 청소년은 아직 어느 브랜드를 소비할지에 대해 충분한 정보를 축적하지 않았기 때문에 특정 브랜드를 선택한다.127 젊은 소비자들은 또한 영화와 온라인 스트리밍과 같은 광고가 아닌 장면의 배경에서 담배 소비 이미지에 노출된다. 캘리포니아에서의 한 연구에 따르면, 흡주 조건의 오락을 마케팅 판매자(IM)가 의약의 분위에서 청소년의 제품 구매 의사를 높임을 발견했다. 이는 유혹적인 가능성이 높다.128 주류 마케팅 연구는 ‘음주 운전 금지’ 같은 메시지를 전달한다고 하더라도 기업의 목표는 이윤이기 때문에 소비자가 긍정적으로 반응하기를 원할 수도 있다.129\n 마케팅이 과식과 비만을 조장하는가?\n소득 마케팅은 전 세계 비만 문제에 기여한다는 비난을 받아 왔다. 세계보건기구(WHO)에 따르면 젊은 사람 공격의 요인은 뻔하지만 개인 책임 증가, 정부가 젊이들이 사이에 건강하지 못한 습관을 유지하는 기업들의 활동을 규제해야 한다는 책임을 주고 있다.130 환경연구는 젊은 사람들이 특정 음식을 광고하고 특정 브랜드 광고를 접한 시간에 따라 옷을 입을 가능성이 높아진다.131 일부 국가에서는"}, {"source": "20261114_171719.jpg", "text": "그림 17-8 일반을 위한 소비자 캠페인 가령 담배 제품의 판매를 중단하기 위한 소비자 캠페인은 주, 국가 및 국제적 수준에서의 입법 제정 및 유지에 기여할 수 있다. 이 예시는 담배 없는 어린이 캠페인에서 나온 것이다."}, {"source": "20261114_171724.jpg", "text": "한 부모, 고위 및 참여식이고 젊은 커뮤니티 구성원들에게 담배 사용을 피하거나 줄도록 영감을 주는 것을 목표로 하는 문화 를 위한 캠페인(Campaign for the Culture)를 시작했다.\n 1996년에 시작된 이래, 캠페인은 흑인 청소년에게 담배 흡연율 을 80% 감소시키는 데 기여했다. 이 이유로 줄리아니와 조지타운 의 끈질긴 근면함이 지적되었다. 47개주에서는 담배 광고가 금지되 어, 젊은 사람들에게 흡연을 장려하기 어렵게 만들었다. 구체적으 로 그런 광고가 청소년의 행동에 어떻게 영향을 미치는지에 대한 연구를 살펴보자.142\n 강력한 도박과 게임이 마케팅에 영향을 미치는가?\n 온라인 게임, 도박, 그리고 스마트폰과 태블릿의 전면 열풍 은 청소년을 비롯한 젊은 소비자들이 이러한 행동을 더 자주, 그리고 장착적으로 끌리도록 84도했다는 주장을 제기해 왔다. 보고서에 따르면, 미국 고등생의 60~80%가 지난 1년 동안 돈을 걸고 도박을 했다고 한다.143 소비자 행동과 사회 정책에 대한 관점에서 도박 문제의 기록 중 하나 이상을 충족한다고 보고되었다. 예를 들어, 호주에서는 정부, 교육자, 부모, 그리고 다른 청소년 복지 단체에서 수많은 정신 건강 및 복지를 위한 프로그램을 개발하여, 도박 게임과 관련된 위험에 대해 인식의 변화를 이끌어내기 위한 기금을 설치했다. 예를 들어, 호주 레저 및 접대 그룹(Australian Leisure and Hospitality Group)은 전자 게임 기계를 보유한 국가 시설에 도박 문제의식을 알리기 위해 일련의 커뮤니티 프로그램을 운영하고 있다. 이 단체는 안전한 도박과 청소년 도박의 위험 요소, 그리고 우리가 수행할 수 있는 활동과 우리 회사가 도박 대신 사용할 수 있는 안전한 게임 활동에 대해 이 사람들 이 각 단계에서 도움을 요청할 수 있는 곳을 포함한 정보를 제공힙 때문이다.143\n 마케터가 소비자의 프라이버시를 침해하는가?\n 많은 소비자는 기업들이 온라인에서 너무 많은 개인 정보를 집합하고 있다고 믿으며, 개인 사생활에 대한 위협에 대해 염려하 고 있다.144 사업을 위해 위와 조치를 취할 수 있는지 개발적으로 원하는 수준을 달성하기는 어렵다.145 많은 마케터는 개인 정보 보 호 장벽을 설명하고 소비자에게 개인 데이터가 안전하게 보호된다 고 안심시키기 위해 노력하고 있다. 공식적인 국가 및 국제 정책 개입도 개인 정보 보호를 강화하는 역할을 하며 미국의 아동온라인개 인정보보호법(COPPA)은 몇 온라인 웹사이트 운영자가 만 13 세 미만 아동으로부터 온라인으로 개인 정보를 수집할 수 있게 하 면 개인정보 안전을 보호하도록 요구한다.146\n 소비자의 개인 정보를 보호하기 위해 2018년 유럽연합은 일반데이터 보호규정(General Data Protection Regulation, GDPR)을 제정해, 웹사이트에서 쿠키 사용을 포함하는 전자 개인 정보 보호 지침을 추가 하였고, 쿠키를 통한 행동 분석에 더 많은 통제를 허용했다. 유럽 연합 일반 개인정보 보호 규정은 사용자에게 어떤 정보가 어떤 웹 사이 트는 사용자로부터 명시적인 동의를 받게 요구함으로써 해야 하면서 편의 필요한 추가 선택, 예컨대 쿠키 사용을 거부하도록 웹사이트에서 작 결할 수 있어야 한다.147\n 마케팅이 자아 이미지에 영향을 미치는가?\n 일부 기관은 자아 이미지에 대한 마케팅의 부정적인 영 향을 더 근리감있게 보고 있다. 마케팅은 관련 제품군과 다양 하며, 대표적인 문제의 중심은 완보 및 완구다. 유니레버(현장에서 도브(Dove)는 “(가장 및 진실한 얼굴을 위한”관리를 걸한 캠페인을 진 행하며 세상에 전달의 수성 수업을 거부했으며, 다양한 나라의 수업에 참여한 3백만 이상의 여성을 상응했다.\n 영국 게임 개발자 연합체인 우먼 인 게임(Women in Games)이란 집단은 온라인 게임은 대표적으로 여성의 더 많이 참여하 도록 장려하기 위해 열렸으며 구성했다.148\n 온라인 스마트폰세잇은 소비자에게 있어서 옳을 서로 인한 불 편 이유의 자연스러운 비교이고, 이는 전자적인 욕망을 반영한다. 예를 들어 패션 카페에서 현실 세계와 타자들의 스타일과 이미지를 사교적으로 판단하고 평가할 수 있다. 일부 자료들이 있는 사회 과학 실험에서는 개인이 온라인상에서 “미디어 먹다”의 해석 구체화되 었다. 일부 여성의 이미지에 설치 이미지의 얇기 압력의 위협이 생격 성. 또는 사용 환경 전제에서의 역할이다. 마케터들은 반드시 위험성 여부: 의약품 또는 식이 보충제를 공개하여 소비자가 잠재적으로 부정 적 결과를 평가할 수 있도록 해야 한다."}, {"source": "20261114_171726.jpg", "text": "마케팅 시사점\n 사용 가능한 제품의 처분과 저장 강박을 줄이기 위해 마케터가 어떤 역할을 할 수 있을까? 이베이(eBay), 프리사이클 네트워크(Freecycle Network), 굿윌 인더스트리즈 인터내셔널(Goodwill Industries International), 옥스팜(Oxfam) 등 기업 및 비영리단체들은 신상품 구매대금의 일부를 중고를 나눔활동에 하는 마케팅 전략을 통해 사용 가능한 제품의 처분을 용이하게 한다. 이케아(IKEA)를 비롯한 여러"}, {"source": "20261114_171732.jpg", "text": "업체는 매장에 있는 쓰레기통을 이용하여 소비자로 하여금 사용한 배터리를 무료로 재활용하도록 권장함으로써 소비가 매립장에서 쓰레기 처리용을 책임 있는 방식으로 처리되도록 한다. 재활용 공급과 높은 회수 비용으로 인해 일부 마케터들은 소비자가 원치 않는 상품을 다시 그들에게 판매하도록 동기를 부여하려고 노력하고 있다.158 일부, 비영리 단체, 정부 기관에서 일하는 마케터들은 소비자의 제품 재활용을 장려하기 위해 더 많은 노력을 기울이고 있다. 그리고 국립유산보존협회(National Trust for Historic Preservation) 같은 비영리단체는 파쇄되는 유적지를 영원히 손실되지 않도록 하기 위한 구입하길 바꿔 원하는 데 도움이 되는 돈(충증 기업의 파트너십을 통해)을 모으고 있다."}, {"source": "20261114_171735.jpg", "text": "보전 행동 혹은 천연자원의 사용을 제한하고 지속 가능한 소비를 장려하는 행동."}, {"source": "20261114_171740.jpg", "text": "그림 17-9 ▶ 지속 가능한 소비 결정을 안내하는 제품 라벨링\n 미국 환경보호국에서는 일반 제품과 비교하여 우수한 수준에서 에너지 효율이 있는 가전제품에 한해 에너지 스타 라벨을 부여하였다.\n 일본의 에너지효율라벨 프로그램은 에너지 요금 절감 효과가 포함된 몇 가지의 에너지 효율 라벨을 사용한다.\n 유럽연합은 가전제품을 A(녹색: 에너지 효율 최고)부터 G(적색: 에너지 효율 최저)까지 등급을 매긴다."}, {"source": "20261114_171743.jpg", "text": "기업 그린 워싱 마케팅 목적을 위한 환경 관련 주장으로서, 기업의 실제 행동이 명시된 환경 공헌과 불일치하는 상황.\n 윤리적 소싱 사회적 책임과 지속 가능 가치를 지지하는 공급 원천과 제품 생산 상황.\n 소비자 위선 한 발언으로 인식과 소비자가 자신을 바라보는 인식 사이에 도덕적 불일치를 경험하는 상황. 소비자 위선적 행동은 소비자가 공공을 위해 헌신하고자 하는 의사를 가지면서도 이에 부합하는 행동을 하지 않을 때 발생한다.\n 비서 뜻과 욕과 일부 소비자의 위선적인 행동은 소비자의 기대 손실을 야기 할 수 있다. 비서 뜻과 욕은 제품의 품질이 떨어지는 것에 대한 우려와 관련이 있으며, 종종 위선적 행동과 관련하여 나타난다."}, {"source": "20261114_171748.jpg", "text": "그림 17-10 시간과 돈에 대한 요청이 자선 기부에 미치는 영향\n 시간 요청 → 정서적 사고방식 → ‘주는 것이 행복으로 인도한다’ → 실제 기부\n 돈 요청 → 가치 극대화 사고방식"}, {"source": "20261114_171751.jpg", "text": "핵심용어 소비자가 도덕적 가치를 상책하고 의도된 기업의 관행이나 정책을 촉구할 수 있는 정치 행동의 종류를 설명한다.\n 연결해 봅시다 소비자들이 왜 특정 기업이나 제품에 대한 보이콧 또는 구매 장려 운동을 선택하는지 토론해 보자."}, {"source": "20261114_171756.jpg", "text": "요약\n 마케팅 및 소비자 행동에는 소비자와 사회 전반에 혜택을 주는 밝은 면과 소비자와 사회 전반에 해를 끼치는 ‘어두운 면’이 있을 수 있다. 의사 결정자는 종종 사회의 딜레마다’(dilemma)에 직면한다. 이는 가능한 한 시간적 딜레마(즉, 각각의 이익 또는 장기적인 이익이 우선순위로 올라가는가 아니면 이익의 균형을 이루려고 할 때)를 포함한 윤리적 문제에 직면한다.\n 마케팅 윤리는 사회적 가치에 반하여 마케팅 의사 결정을 안내하며 옳고 그름 행동의 규칙 또는 표준이다.\n 소비자 윤리는 또한 사회적 가치에 기반하여 소비자 의사 결정을 안내하며 옳고 그름 행동의 규칙 또는 표준이다. 일반적으로 소비자 행동은 특정 집단이나 사회에서 허용되는 규칙을 보편, 준수, 강박적이지 다른 방식으로 위반함으로써 깨끗된다.\n 취득 상황과 관련된 쟁점은 소비자 절도, 입차, 중독 및 강박적 행동, 상품의 계속된 표절(특허, 어린이 등 네 가지 이다. 소비 상황 관련에서는 쟁점은 만족과 불만족, 품질 및 거짓 정보, 프라이버시와 도박과 게임, 프라이버시와 거너것에 포함될 자아 이미지 형성과 행동, 타인의 개인에 대한 의사결정(제삼자수혜, 타인의 위험과 이익)을 수반하는 의사 결정으로 볼 수 있다. 처분 관련 쟁점은 환경 오염과 쓰레기, 재활용, 불법 상품을 제외하지 않는 경우를 포함한다."}, {"source": "20261114_171759.jpg", "text": "복습과 토론을 위한 질문\n 1. 사회적 딜레마 및 사회적 딜레마와 관련된 의사 결정에 균형이 필요한 이유는 무엇인가?\n2. 일반적 소비자 행동은 무엇이며, 그러한 행동은 항상 불법적인가?\n3. 중독적 행동은 강박적 행동과 어떻게 다른가?\n4. 유혹적 경청이 소비자 결정에 어떤 영향을 미치는가?\n5. 사회적 비교 이론이란 무엇이며, 광고에 어떻게 적용되는가?\n6. 보전 행동에 영향을 미치는 것은 무엇인가?\n7. 도덕 위상이란 무엇이며, 이것은 소비자와 마케터에게 무엇을 의미하는가?\n8. 일반적 마케팅 관행에 대응하기 위해 소비자가 할 수 있는 일은 무엇인가?\n 미주(endnotes)는 한경사 홈페이지 www.hankyungsa.co.kr의 공지사항에서 PDF 파일로 다운로드할 수 있습니다."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch17-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch17-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch17-book-edits',content.innerHTML));const saved=localStorage.getItem('ch17-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
