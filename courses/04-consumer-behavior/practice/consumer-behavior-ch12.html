<script>
const slides=[{"kind": "concept", "title": "소비자 다양성과 시장 세분화", "answer": "소비자 행동은 연령·세대, 성별·성 정체성·성적 지향, 지역, 민족 집단, 종교 등 여러 요인의 영향을 받는다. 집단의 공통점을 이해하면 제품·유통·메시지를 조정할 수 있지만, 한 사람이 여러 집단에 동시에 속하고 집단 내부에도 큰 차이가 있음을 고려해야 한다.", "example": "같은 대학생도 거주 지역, 식생활, 종교, 예산에 따라 원하는 배달 메뉴가 다르다. ‘대학생 메뉴’ 하나보다 실제 욕구를 확인한 선택지가 유용하다."}, {"kind": "concept", "title": "연령·시대·출생 집단 (Age–Period–Cohort)", "answer": "연령 효과는 나이가 들고 생애 단계가 바뀌면서 나타나는 변화이다. 시대 효과는 특정 시기의 사건·환경이 여러 연령층에 미치는 영향이다. 출생 집단 효과는 비슷한 시기에 태어난 사람들이 성장기에 공유한 경험과 관련된다. 한 시점의 연령별 차이만으로 세 효과를 분리하기는 어렵다.", "example": "나이가 들며 큰 글자를 선호하는 변화는 연령 효과, 팬데믹 동안 여러 세대가 비대면 구매를 늘린 변화는 시대 효과, 성장기 디지털 경험이 이후 습관에 남는 현상은 출생 집단 효과로 살펴볼 수 있다."}, {"kind": "concept", "title": "세대별 집단 이론 (Generational Cohort Theory)", "answer": "비슷한 시기에 태어나 중요한 사회적 사건과 생활 환경을 공유한 사람들은 가치·기억·행동에 공통점이 생길 수 있다. 세대 경계와 명칭은 국가·자료에 따라 다르므로 출생연도 암기보다 공유 경험과 소비의 연결을 이해해야 한다. 세대는 개인을 단정하는 기준이 아니다.", "example": "성장기에 모바일 결제를 익힌 집단에게 앱 결제는 익숙할 수 있다. 그러나 같은 세대 안에서도 기기 접근성과 경험에 따라 이용 능력은 다르다."}, {"kind": "concept", "title": "침묵 세대와 고령 소비자", "answer": "교재는 침묵 세대의 절약·익숙함·관계에 대한 가치를 설명한다. 고령 소비자를 위한 마케팅에서는 읽기 쉬운 안내, 간단한 절차, 신뢰할 수 있는 상담과 접근성을 고려한다. 연령만으로 정보 처리 능력이나 기술 이용 수준을 단정해서는 안 된다.", "example": "큰 글자와 명확한 요금 안내를 제공하고 앱 주문과 전화 상담을 함께 운영하면 서로 다른 이용 선호에 대응할 수 있다."}, {"kind": "concept", "title": "베이비붐 세대와 샌드위치 상황", "answer": "베이비붐 세대는 규모와 소비 영향력, 은퇴 준비와 활동적 생활이라는 측면에서 중요하다. 자녀 지원과 부모 돌봄을 동시에 맡는 샌드위치 상황은 시간·예산 배분에 영향을 준다. 이 상황은 특정 세대만의 고정된 특성은 아니다.", "example": "부모 돌봄 비용과 자녀 교육비를 함께 부담하는 가구는 여행 상품에서도 가격, 일정 변경 가능성, 돌봄 공백을 함께 고려할 수 있다."}, {"kind": "concept", "title": "X세대의 소비와 마케팅", "answer": "교재는 X세대가 기술과 매체의 변화를 경험했고 독립적인 정보 탐색, 일과 생활의 균형, 성장기 경험에 대한 향수 등을 보일 수 있다고 설명한다. 실용적 정보와 실제 생활에 맞는 편익을 제공하는 것이 중요하며 집단의 경향을 개인에게 그대로 적용하지 않는다.", "example": "시간이 부족한 소비자에게 가전의 기능을 과장하기보다 청소 시간과 관리 부담을 어떻게 줄이는지 보여 주고 비교 자료를 제공한다."}, {"kind": "concept", "title": "밀레니얼 세대의 디지털 경험", "answer": "밀레니얼 세대는 인터넷과 모바일 환경의 확산을 경험한 집단으로 설명된다. 온라인 정보 탐색, 소셜 미디어, 경험과 가치, 일과 생활의 균형이 소비와 연결될 수 있다. 디지털 친숙함과 충분한 구매력은 별개의 문제이다.", "example": "여행 사진 공유와 체험을 중시하더라도 주거비와 대출 부담 때문에 가격 비교와 할인 조건을 꼼꼼히 확인할 수 있다."}, {"kind": "concept", "title": "Z세대와 알파 세대", "answer": "교재는 Z세대의 모바일·소셜 미디어 친숙함, 자기표현과 다양성에 대한 관심을 다룬다. 알파 세대는 더욱 디지털화된 환경에서 성장하며 부모의 구매와 미디어 이용 환경도 중요하다. 어린 소비자의 이해 수준과 보호 필요성을 고려해야 한다.", "example": "짧은 영상으로 완구를 소개하더라도 실제 구매자인 보호자가 재질·가격·이용 조건을 확인할 수 있도록 정보를 함께 제공한다."}, {"kind": "concept", "title": "청소년의 정체성과 소비", "answer": "청소년에게 소비는 자신을 표현하고 또래와 관계를 형성하는 수단이 될 수 있다. 인정받고 싶은 마음과 독립성을 동시에 고려해야 한다. 광고는 불안이나 소외에 대한 압박을 이용하기보다 선택에 도움이 되는 정보를 제공해야 한다.", "example": "운동화를 ‘이것이 없으면 친구에게 뒤처진다’고 알리기보다 활동별 기능과 다양한 스타일을 제시하여 스스로 고르도록 돕는다."}, {"kind": "concept", "title": "성·성 정체성·성적 지향의 구분", "answer": "성은 생물학적 특성과 관련된 구분이며 일반적으로 출생 시 지정된다. 성 정체성은 자신이 어떤 성별에 속한다고 인식하는가이고, 성적 지향은 누구에게 정서적·성적 끌림을 느끼는가이다. 서로 다른 개념이므로 하나로 다른 하나를 추정하지 않는다.", "example": "어떤 옷을 입는지, 어떤 취미를 갖는지만으로 그 사람의 성 정체성이나 성적 지향을 판단할 수 없다."}, {"kind": "concept", "title": "성 역할과 고정관념", "answer": "성 역할은 사회가 성별에 따라 기대하는 행동과 책임이다. 역할은 문화와 시대에 따라 변하며 가정 내 구매·사용·의사결정 역할과 연결될 수 있다. 소비자 연구에서 관찰한 평균 차이를 모든 사람에게 적용하면 실제 수요를 놓칠 수 있다.", "example": "주방가전 광고에 여성만 등장시키기보다 실제로 요리하는 다양한 사람과 사용 상황을 보여 주고, 기능 요구를 직접 조사한다."}, {"kind": "concept", "title": "포용적 제품과 커뮤니케이션", "answer": "성별이나 성적 지향에 관한 단순한 가정 대신 실제 사용 목적, 신체적 적합성, 자기표현과 생활 맥락을 확인한다. 제품 선택지·서비스 응대·광고 표현까지 일관되게 다양한 소비자를 존중해야 한다.", "example": "같은 분홍색 포장만으로 여성용 공구를 만들기보다 손 크기, 무게, 손잡이의 편안함과 작업 목적에 맞는 제품을 제공한다."}, {"kind": "concept", "title": "지역적 영향과 현지화", "answer": "기후·자연환경, 지역 역사·문화, 생활 방식, 유통 환경은 소비 패턴에 영향을 준다. 같은 나라 안에서도 지역마다 수요가 다를 수 있어 제품 구성과 판매 시기, 유통, 메시지를 조정한다.", "example": "해안 지역에는 방수·방염 관리 정보를, 추운 지역에는 보온과 겨울철 사용 정보를 강조하는 식으로 실제 생활 조건에 맞춘다."}, {"kind": "concept", "title": "지리적 클러스터링 (Geodemographic Clustering)", "answer": "거주 지역의 인구통계·생활 방식·소비 특성을 결합해 비슷한 지역 집단을 찾는 방법이다. 매장 입지, 상권의 상품 구성, 매체 선택에 활용할 수 있다. 지역 평균은 개별 주민의 특성을 보장하지 않으므로 현장 조사와 실제 자료로 검증한다.", "example": "반려동물 관련 수요와 접근성, 경쟁 점포가 있는 상권을 함께 조사해 매장 입지를 검토한다. 주소만 보고 모든 주민이 반려동물을 키운다고 판단하지 않는다."}, {"kind": "concept", "title": "문화 차원과 소비 메시지", "answer": "개인주의·집단주의는 개인의 자율성과 집단의 유대 중 무엇을 더 강조하는지에 관한 차원이다. 수평·수직 지향은 평등과 위계의 강조 차이이다. 교재의 남성성·여성성 차원은 성취·경쟁과 관계·삶의 질에 대한 문화적 가치의 구분이며 개인의 성별을 뜻하지 않는다.", "example": "같은 시계라도 자기 취향을 표현하는 메시지, 가족과 공유하는 의미, 지위를 드러내는 메시지는 서로 다른 가치를 강조한다. 실제 표적 집단에 맞는지 확인해야 한다."}, {"kind": "concept", "title": "민족 집단과 민족 정체성", "answer": "민족 집단은 공통의 기원·역사·가치·관습 등으로 연결될 수 있으며 민족 정체성은 자신의 문화적 소속을 어떻게 인식하는가와 관련된다. 언어·음식·명절·매체 선택에 영향을 줄 수 있지만 같은 집단 안에도 다양한 경험과 선호가 존재한다.", "example": "같은 출신 배경의 소비자라도 이주 시기, 사용하는 언어, 가족 환경에 따라 명절 선물과 광고에 대한 반응이 달라질 수 있다."}, {"kind": "concept", "title": "문화 적응과 이중 문화 소비자", "answer": "문화 적응은 서로 다른 문화가 접촉하면서 가치·습관·행동이 변하는 과정이다. 기존 문화를 모두 버리는 과정과 동일하지 않으며 상호 영향도 가능하다. 이중 문화 소비자는 두 문화의 규범과 관습을 익히고 상황에 따라 활용할 수 있다.", "example": "평소에는 현지 언어로 쇼핑하면서 가족 명절에는 출신 문화의 음식과 선물을 선택할 수 있다. 두 행동은 모순이 아니다."}, {"kind": "concept", "title": "다문화 마케팅과 커뮤니케이션 조정", "answer": "다문화 마케팅은 다양한 문화적 배경을 기획 단계부터 고려해 제품·유통·커뮤니케이션을 설계한다. 교재는 히스패닉·라틴계, 아프리카계, 아시아계 미국인 시장을 예로 든다. 각 집단은 내부적으로도 다양하다. 언어·표현을 조정하는 accommodation은 존중과 관련성을 전달할 수 있지만 단순 번역만으로 충분하지 않다.", "example": "영어·스페인어를 모두 쓰는 소비자에게 두 언어의 선택권을 주고, 실제 식생활과 구매처를 조사해 상품과 유통까지 맞춘다. 아시아계 전체를 하나의 언어권으로 다루지 않는다."}, {"kind": "concept", "title": "종교와 신앙 기반 마케팅 (Faith-Based Marketing)", "answer": "종교적 신념과 실천은 식재료, 의복, 휴일, 선물, 소비 시기와 가치 판단에 영향을 줄 수 있다. 신앙 기반 마케팅은 이를 제품·서비스·커뮤니케이션에 반영한다. 같은 종교 안에서도 실천 수준은 다르므로 구체적 요구를 확인해야 한다.", "example": "할랄 요건을 고려하는 소비자에게는 관련 인증과 원재료 정보를 명확히 제공한다. 종교 이름만 보고 모든 사람이 같은 식품을 선택한다고 가정하지 않는다."}, {"kind": "concept", "title": "다양성 마케팅의 통합 적용", "answer": "연령·세대, 성별, 지역, 민족·종교를 따로 외우는 데서 그치지 않고 소비자의 실제 욕구와 연결해야 한다. 집단 특성으로 가설을 세우고 조사로 검증한 뒤 제품·가격·유통·촉진을 조정한다. 고정관념과 차별적 표현은 신뢰와 시장 접근을 해칠 수 있다.", "example": "대학가 간편식 매장은 예산·언어·식재료·수업 시간대를 함께 조사해 소용량 메뉴, 원재료 표시, 다국어 안내와 픽업 시간을 설계할 수 있다."}, {"kind": "problem", "topic": "연령·시대·출생 집단", "title": "① 나이가 들면서 포장의 작은 글자가 불편해졌다. ② 팬데믹 동안 여러 연령층의 온라인 주문이 늘었다. ③ 성장기에 모바일 서비스를 익힌 집단이 그 습관을 유지한다. 각각 어떤 효과로 설명할 수 있는가?", "answer": "①은 연령 효과, ②는 시대 효과, ③은 출생 집단 효과로 살펴볼 수 있다. 다만 실제 자료에서는 세 효과가 얽힐 수 있으므로 한 번의 연령별 비교만으로 원인을 확정해서는 안 된다.", "example": "같은 25세라도 조사한 시대가 다르면 이용 가능한 기술과 경제 상황이 다를 수 있다."}, {"kind": "problem", "topic": "세대별 집단 이론", "title": "‘Z세대는 모두 같은 취향이며 최신 기기를 잘 다룬다’는 마케터의 판단을 비판하고 조사 방향을 제안하라.", "answer": "공유 경험은 집단의 경향을 설명하는 단서이지만 개인을 결정하지 않는다. 같은 세대 안의 소득, 관심, 기기 접근성, 사용 경험을 함께 조사해야 한다. 세대 경계도 자료와 국가에 따라 다를 수 있다.", "example": "모바일 영상 시청에 익숙해도 문서 편집이나 복잡한 결제 설정에는 익숙하지 않을 수 있다."}, {"kind": "problem", "topic": "고령 소비자와 베이비붐 세대", "title": "여행사가 고령 고객을 대상으로 ‘어려운 앱 사용은 못 한다’고 가정했다. 더 적절한 서비스와 정보 설계를 두 가지 이상 제안하라.", "answer": "큰 글자와 명확한 일정·가격 정보를 제공하고 앱·웹·전화 등 선택 가능한 예약 경로를 마련한다. 실제 디지털 이용 수준과 활동 선호를 조사하고 이동·접근성 요구를 확인한다. 나이만으로 능력이나 여행 취향을 단정하지 않는다.", "example": "활동적인 여행을 원하는 고객에게도 읽기 쉬운 일정과 유연한 상담 경로는 도움이 된다."}, {"kind": "problem", "topic": "샌드위치 상황", "title": "자녀 교육비와 부모 돌봄 비용을 동시에 부담하는 소비자의 구매 결정을 분석하고 적절한 서비스 편익을 제안하라.", "answer": "예산과 시간이 동시에 제약될 수 있어 가격뿐 아니라 시간 절약, 일정의 유연성, 안정적 서비스가 중요해질 수 있다. 간편식, 돌봄 연계 서비스, 변경 가능한 예약 등을 실제 상황에 맞추어 제안할 수 있다. 특정 출생 세대만의 상황으로 보아서는 안 된다.", "example": "최저가보다 일정 변경이 쉬운 예약을 선택하면 돌봄 일정 변화에 대응할 수 있다."}, {"kind": "problem", "topic": "세대별 마케팅 비교", "title": "침묵 세대·베이비붐·X세대·밀레니얼·Z세대·알파 세대를 대상으로 메시지를 기획할 때 살펴볼 경험과 욕구를 설명하라.", "answer": "침묵 세대는 익숙함·접근성, 베이비붐은 은퇴·활동·돌봄, X세대는 독립적 탐색·일상 균형·향수, 밀레니얼은 디지털 경험·가치·재정 제약, Z세대는 모바일·자기표현·다양성, 알파 세대는 디지털 성장 환경·부모의 구매 역할을 조사할 수 있다. 이는 조사 가설이며 모든 구성원의 고정된 특성이 아니다.", "example": "같은 영상 매체를 사용하더라도 소비자가 원하는 기능 설명, 가격 정보, 보호자 안내는 달라질 수 있다."}, {"kind": "problem", "topic": "성·성 정체성·성적 지향", "title": "고객이 선택한 의류만 보고 성 정체성과 성적 지향을 추정했다. 세 개념을 구분하고 이 판단의 문제를 설명하라.", "answer": "성은 생물학적 특성과 관련된 구분, 성 정체성은 자신의 성별에 대한 인식, 성적 지향은 누구에게 정서적·성적 끌림을 느끼는가이다. 의류 취향만으로 이를 판단할 수 없다. 제품의 크기·핏·용도 등 필요한 선호를 직접 확인하는 것이 적절하다.", "example": "헐렁한 셔츠를 고른 이유는 활동성이나 디자인 취향일 수 있으며 정체성에 대한 단서로 단정할 수 없다."}, {"kind": "problem", "topic": "성 역할과 제품 개발", "title": "공구 회사가 기존 제품을 분홍색으로 바꾸어 ‘여성용’으로 판매하려 한다. 소비자 다양성을 반영한 개선안을 제시하라.", "answer": "색에 관한 성별 고정관념보다 손 크기, 제품 무게, 손잡이, 작업 목적, 경험 수준을 조사해야 한다. 다양한 크기와 무게, 이해하기 쉬운 사용 안내를 제공하고 광고에 다양한 사용자를 보여 줄 수 있다.", "example": "손이 작거나 가벼운 공구를 원하는 소비자는 성별과 관계없이 존재한다."}, {"kind": "problem", "topic": "지역적 영향과 현지화", "title": "전국 매장에 같은 계절 상품과 식품을 같은 시기에 공급했더니 일부 지역에서 재고가 쌓였다. 원인과 개선책을 설명하라.", "answer": "기후, 식문화, 생활 방식과 유통 환경의 지역 차이를 무시했을 수 있다. 지역별 판매·날씨·선호 자료와 현장 조사를 바탕으로 상품 구성, 발주 시기, 수량, 메시지를 조정해야 한다.", "example": "따뜻한 지역과 추운 지역은 보온 상품의 수요 시기와 지속 기간이 다를 수 있다."}, {"kind": "problem", "topic": "지리적 클러스터링", "title": "반려동물용품 매장이 상권을 고를 때 클러스터링을 어떻게 활용할 수 있는가? 한계도 설명하라.", "answer": "지역별 가구·생활 방식·반려동물 관련 수요 자료를 결합해 유사 상권을 찾고 접근성·경쟁·비용을 함께 평가할 수 있다. 지역 평균이 모든 주민을 설명하지 않으며 오래된 자료나 개인 추정의 오류를 현장 조사로 보완해야 한다.", "example": "유망 상권을 찾은 뒤 실제 유동인구와 구매 수요를 조사해 입지 가설을 확인한다."}, {"kind": "problem", "topic": "문화 차원", "title": "시계 광고 A는 ‘나만의 스타일’, B는 ‘가족과 함께한 시간’, C는 ‘성공을 보여 주는 상징’을 강조한다. 각 메시지의 문화적 초점을 설명하라.", "answer": "A는 개인의 자율성과 자기표현, B는 관계와 집단의 유대, C는 위계와 지위 상징을 강조한다. 개인주의·집단주의와 수평·수직 지향 등을 분석에 활용할 수 있다. 특정 나라의 모든 소비자가 동일하게 반응한다고 단정해서는 안 된다.", "example": "같은 사람도 선물용인지 자기 사용용인지에 따라 반응하는 가치가 달라질 수 있다."}, {"kind": "problem", "topic": "문화 적응과 이중 문화", "title": "현지 언어로 쇼핑하는 이민 2세가 가족 명절에는 출신 문화의 음식을 구매한다. ‘문화 적응에 실패했다’는 해석이 타당한가?", "answer": "타당하지 않다. 문화 적응은 기존 문화를 전부 버리는 것이 아니다. 두 문화의 관습을 익히고 상황에 따라 활용하는 이중 문화 소비로 이해할 수 있다. 언어 선호와 민족 정체성, 소비 상황을 구분하여 조사해야 한다.", "example": "직장에서는 현지 식사를 즐기고 가족 행사에서는 전통 음식을 준비할 수 있다."}, {"kind": "problem", "topic": "민족 집단과 다문화 마케팅", "title": "미국 시장에서 히스패닉·라틴계, 아프리카계, 아시아계 소비자를 각각 하나의 동일한 집단으로 취급하면 어떤 문제가 생기는가?", "answer": "각 집단 내부의 출신 국가·언어·이주 경험·세대·소득·정체성 차이를 놓친다. 교재가 다루는 세 주요 시장도 단일한 취향을 가진 집단은 아니다. 목표 소비자를 구체적으로 조사해 상품·유통·매체를 설계해야 한다.", "example": "아시아계 소비자 전체에게 한 언어로만 광고하면 여러 언어와 문화적 배경을 가진 소비자에게 맞지 않을 수 있다."}, {"kind": "problem", "topic": "언어 조정과 다문화 소통", "title": "영어와 스페인어를 모두 사용하는 소비자에게 기존 광고를 스페인어로 번역하기만 하면 충분한가? 개선 방향을 설명하라.", "answer": "충분하지 않다. 언어 선호, 문화 적응과 정체성, 구매 상황을 조사해야 한다. 언어 선택권과 자연스러운 표현을 제공하고 제품·유통·서비스도 조정해야 한다. 커뮤니케이션 조정은 존중과 관련성을 전달할 수 있지만 형식적 번역만으로 보장되지는 않는다.", "example": "상품 설명은 두 언어로 제공하면서 가족 행사에 필요한 포장과 구매 경로도 함께 설계할 수 있다."}, {"kind": "problem", "topic": "종교와 신앙 기반 마케팅", "title": "다양한 종교적 배경의 학생이 이용하는 간편식 매장에 필요한 상품·안내·판매 계획을 제안하라.", "answer": "실제 수요를 조사하고 원재료와 조리 정보를 명확히 표시한다. 필요한 경우 관련 인증을 확인한 메뉴와 적절한 선택지를 제공한다. 종교 행사와 식사 시간의 변화도 수요 계획에 고려하되 같은 종교의 실천 수준이 모두 같다고 가정하지 않는다.", "example": "할랄 요건을 고려하는 소비자가 인증과 원재료 정보를 확인할 수 있도록 안내한다. 단순히 고기를 뺐다는 이유만으로 인증을 주장하지 않는다."}, {"kind": "problem", "topic": "통합 적용", "title": "다양한 연령·문화·종교의 소비자가 사는 대학가에 간편식 매장을 연다. 집단 이름을 나열하는 데서 벗어나 실행 가능한 조사와 마케팅 계획을 제안하라.", "answer": "예산·식사 시간·언어·식재료 요구·구매 경로를 조사하고 지역별 수요를 확인한다. 결과에 따라 용량과 메뉴, 가격대, 픽업·배달, 다국어 안내와 원재료 표시를 설계한다. 실제 판매와 고객 반응을 점검해 수정한다. 집단 정보는 가설을 만드는 출발점이다.", "example": "야간 수업 학생의 늦은 픽업, 소식하는 고객의 소용량, 식재료를 확인하려는 고객의 명확한 표시를 함께 제공할 수 있다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제12장 · 소비자 다양성';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
