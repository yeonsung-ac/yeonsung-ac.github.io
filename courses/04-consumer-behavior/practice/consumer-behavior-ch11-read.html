</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "소비자 행동에 영향을 미치는 사회적 요인", "main": [{"kind": "heading", "text": "소비자 문화", "source": "20261111_092123.jpg"}, {"kind": "paragraph", "text": "4부에서는 거시적 관점에서 소비자 행동을 학습하고자 한다. 다양한 소비자 문화 요인이 어떻게 소비자 행동에 영향을 미치는지 알아볼 것이다. 그리고 문화 요인들이 서로 어떻게 영향을 주고 받는지 이해하고자 한다. 11장에서는 인간 행동과 결정에 특정 개인, 집단(친구, 직장 동료, 전통적 매체, 소셜 미디어)의 영향을 받는 것을 설명한다. 12장은 다양성에 초점을 맞춘다. 구체적으로 연령, 성별, 성적 지향성, 지역, 종족, 종교가 소비자 행동에서 어떤 역할을 하는지 설명한다.\n13장에서는 가구와 가족의 다양한 형태를 알아보고 가구 구성원이 어떻게 구매와 소비 의사 결정에 영향을 미치는지 알아본다. 또한 사회계층이 소비자 의사 결정에 미치는 영향을 검토하고자 한다. 14장에서는 다양성, 사회계층, 가구와 더불어 가치, 개성, 라이프스타일의 영향을 알아본다. 이러한 요인들은 소비자 행동에 영향을 미치고 마케터에게 많은 시사점을 준다.", "source": "20261111_092123.jpg"}, {"kind": "heading", "text": "소비자 행동에 영향을 미치는 사회적 요인", "source": "20261111_092217.jpg"}, {"kind": "paragraph", "text": "도입\n 2022년 6월은 엘리자베스 여왕의 즉위 70주년을 기념하는 플래티넘 희년이었고, 축하 행사는 국왕의 96세의 나이로 사망하기 불과 몇 달 전에 거행되었다. BBC, 뉴욕 타임즈(New York Times), 마리 클레르(Marie Claire), 베너티 페어(Vanity Fair), 뉴스위크(Newsweek) 팀 ＜선데이 타임즈＞ 같이 영향력 런천형 형태 준비단에서의 공신력이 높은 언론 매체가 취재했으며 전 세계 수백만 명에게 정보를 영향을 미쳤다. 축하 행사가 뉴스 상사 정보와 함께 패션과 관련된 콘텐츠를 담은 내용의 기사를 통해 그들에게 규범적 영향을 미쳤다! 조안 콜린스(Joan Collins), 케이트 모스(Kate Moss), 나오미 캠벨(Naomi Campbell), 로드 스튜어트(Rod Stewart), 앨리샤 키스(Alicia Keys)와 같은 유명인들이 축하행사에 참석해 방송을 탔다.\n 대형 표지판 수비/출연하는 팬들은 축하 행사를 보고 다양한 소셜 미디어 사이트에 영상을 올렸다. 사용자들이 게시한 콘텐츠는 중복되었으나 신뢰할 수 있는 정보 원천인 듯 팔로워들의 댓글이 게시물은 약 75,000개의 댓글이 기록되었고 수백만 개의 조회 수를 기록하였다. 유명 인사들, 경마 대회, 지역사회 활동과 같은 이벤트가 단합. 한편, 수많은 인플루언서들은, 이 기회를 이용해 피크닉, 파티, 살롱 테마를 선택하여 동일한 제품(예: 패딩 스프레이, 랜턴, 레드 화이트 파란 장식)을 구매하도록 동기 부여했다. 한 유명 메이크업 아티스트는 뷰티 이벤트를 개최하며 영국 출신 화장품 세트를 발표, 샬롯 틸버리(Charlotte Tilbury)가 현장에 메이크업 가방, 로켓 라운던(Luquet London) 다이아몬드 브로치 가방이 선물로 제공되었으며, 많은 참석자들이 행사장에서 줄을 섰었다? 수많은 페이스북 그룹 회원이 행사용 푸드 바구니를 과시했고 빵 가게의 매출은 행사 전 몇 달 동안 최고치를 기록했다. 텔레비전 기념 생방송은 292만 가구가 보는 것으로 기록됐다. TV 시청자들은 여왕과 왕위를 승계할 세자녀 케이트 미들턴(Kate Middleton)이 여왕의 상징처럼 흔히 보여지면서 함께 행동하도록 애를 쓰는 모습(규범적 영향력 발생)을 즐겁게 시청했다.\n 위 내용을 통해 이 장에서 논의할 사회적 영향력(social influence)에 대한 다양한 아이디어를 알 수 있다. 사회적 영향력은 소비자 행동에 영향을 미치는 개인, 집단, 대중매체의 정보와 문화적 또는 명시적 압력이다. 마케팅 관리자는 누가 소비자에게 영향을 미치는지, 소비자에게 영향을 주기 위해 어떤 도구를 사용할 수 있는지, 어떤", "source": "20261111_092217.jpg"}, {"kind": "heading", "text": "11-1 영향력 원천", "source": "20261111_092222.jpg"}, {"kind": "paragraph", "text": "유형의 영향력을 행사할 수 있는지, 특정 원천이 언제 소비자 행동에 영향을 미치는지, 특정 강력한지 이해하면 된다. 그림 11-1은 사회적 영향력이란는 주제와 관련된 다양한 문제를 요약하고 있다. 이 장에서는 영향력 원천을 다루고 나서 영향력 도구, 영향력 유형에 대해 알아볼 것이다. 마지막으로 특정한 영향력이 강력해지는 이유가 무엇인지 설명하면서 각 주제를 순차적으로 논의한다.\n 11-1 영향력 원천\n 11-1a 마케터\n 소비자는 종종 마케터로부터 정보를 받아 신제품에 대해 학습하고 구매하거나 경험한다. 마케팅 원천(marketing source)은 광고, 인적 판매 등 마케터가 관리하는 원천이다. 또한 마케팅 관리자는 소비자 중에 제품을 올바르게 사용하고 과잉하는 방법에 대한 정보를 제공한다. 마케팅 관리자는 제품 리콜에 대한 정보를 제공하고 더욱 만족스러운 제품을 개발하기 위해 노력한다. 다음 절(11-2)에서 볼 수 있듯이 마케팅 관리자는 다양한 도구를 사용하여 고객과 소통한다.\n 11-1b 비마케팅 원천\n 마케터 기업의 통제 밖에 있고 기업을 옹호하지 않는 원천(비마케팅 원천(nonmarketing source))도 소비자 행동에 영향을 미친다.\n 미디어와 조직\n 미디어(신문, 잡지, TV 프로그램)를 통해 신제품, 영화, 이벤트, 음식점 등의 정보는 물론 제품 오염, 제품 관련 사고, 제품 남용, 오용 사건에 대한 뉴스도 의사소통할 수 있다. 새 자동차를 구매하는 소비자는 TV 보도, 온라인 사이트, 블로그와 같이 마케터가 통제할 수 없는 미디어를 통해 리콜과 품질 문제에 대해 학습할 수 있다. 또한 소비자는 팻터 비즈니스협회(Better Business Bureau), 미국암협회(American Cancer Association), 시에라클럽(Sierra Club), 여성유권자동맹(League of Women Voters)과 같은 조직의 정보와 의견의 영향을 받을 수 있다.", "source": "20261111_092222.jpg"}, {"kind": "heading", "text": "의견 선도자", "source": "20261111_092229.jpg"}, {"kind": "paragraph", "text": "사회의 영향력의 특별한 원천은 대중매체, 개인, 집단의 의견과 행동 사이에서 정보 중개자 역할을 하는 사람인 의견 선도자(opinion leader)이다. 일반적으로 의견 선도자는 특정 영역이나 제품 범주와 관련되어 있고 신뢰할 수 있는 정보의 중요한 원천인 지역, 직업 공동체, 친구 중심의 영향력이 있는 집단이다. 소비자는 의견 선도자가 마케팅의 금전적 후원을 받지 않았다고 생각하면 더 신뢰한다. 기술 분야 뉴스와 칼럼니스트의 조애나 스턴(Joanna Stern)은 기술에 관심이 있는 사람들에게 영향을 미치는 글을 쓰며 스트리트 지혜네서(Life!, 2007)는 일론 머스크(Elon Musk), 라탄 타타(Ratan Tata), 팀 쿡(Tim Cook)과 같은 사람들은 소비자의 구매 행동에 영향을 준다고 한다. 간호제품에 영향을 미치는 의견 선도들도 있다. 의견 선도자는 유명인일 필요는 없다. 예를 들면, 의사, 치과의사, 재무 설계자, 교수와 전문가 수준은 일반인보다 훨씬 높기 때문에 의견 선도자가 될 수 있다.\n한 연구자는 의견 선도자의 몇 가지 특징을 관찰했다.¹ 의견 선도자는 제품 종류에 대해 새롭고 흥미를 많이 하며, 신제품이 출시되었을 때 먼저 구매하는 경향이 있다. 또한 주변 사람들에게 자신이 직접 써본 제품에 대한 사용 경험을 공유하고자 한다. 그들은 시장 참여에 있어 신고하려며 시장 정보를 공유하려고 한다. 특정 제품에 대한 본질적인 정보에 대한 질문에 답하기 원하는 의견 선도자가 된다. 의견 선도자는 주위 사람들의 의견과는 상관없이 상이한 가치를 동경하고 자신의 의견을 모방하려는 사람들이 주변의 여론을 싫어할 것이라고 믿기 때문에 정보를 공유한다.\n의견 선도자는 다른 사람들의 자신의 의견에 주의를 기울이는지 여부에 개인적인 이해관계가 있기 때문에 영향을 미치는 경우가 많다. 보통 사람들은 의견 선도자의 의견을 전문적으로 신뢰할 수 있다고 인식한다. 예컨대 복잡한 제품에 대한 자신의 경험이 있어 구입, 사용, 추천 등에 대해 더 정교한 결정을 내릴 수 있고, 소비자가 비전문가이기 때문에 다른 사람들의 경험이 새롭고 기억할 만한지 여부를 판단한다. 어떤 연구는 의견 선도자가 미디어로부터 메시지를 받고 나서 자신의 가정과 친지들에게 정보를 전달한다고 강조하는 연구를 하였다.¹⁴ 실제로 의견 선도자는 여러 방법을 통해서 광고가 소비자에게 전달된다는 의미이다. 예컨대, 실제로 의견 선도자는 신문, 잡지, 소비자보고서 정보를 얻는 경우가 많다.\n 인플루언서 의견 선도자의 특정 유형(잠재적으로 더 관심을 받는)은 ‘인플루언서’이다. 엄밀히 말하면 의견 선도자는 직책과 권위가 있고 정중의 존경을 받기 때문에 인플루언서이다.\n인플루언서(influencer)라는 용어는 특정 제품을 촉진하기 위해(때로는 온라인, 자신의 팔로어를 위한 추천 포함) 미디어를 사용하는 사람들을 포함하는 개념이다. 이 장의 뒷부분에서 더 자세히 살펴보겠지만, 인플루언서의 마케팅은 급성장하고 있다. 인플루언서의 장점으로 성장했으며 기업은 인플루언서를 타깃팅하기 위해 더 많은 투자를 하고 있다. www.influencermarketinghub.com에 따르면 인플루언서는 브랜드 마케팅 목표를 달성하기 위해 협력할 수 있는 사회적인 자산이다.\n일부 의견 선도자는 유명인(celebrity) 지위를 가지고 있으며 이 지위를 이용해 소비자의 구매, 사용, 처분 결정에 영향을 미친다. InfluencerMarketingHub.com에 따르면 카일리 제너(Kylie Jenner), 켄달 제너(Kendall Jenner), 킴 카다시안(Kim Kardashian), 테일러 스위프트(Taylor Swift), 빌리 아일리시(Billie Eilish)와 같은 유명인은 확실한 인플루언서 중 하나이다. 어떤 유명인은 폭넓은 대상이기 때문에 다른 사람들에게 영향을 미친다. 즉, 소비자는 유명인의 전문성과 제품을 동", "source": "20261111_092229.jpg"}, {"kind": "heading", "text": "THE WORLD'S TOP 50 SOCIAL MEDIA INFLUENCERS", "source": "20261111_092233.jpg"}, {"kind": "paragraph", "text": "THE WORLD'S TOP 50 SOCIAL MEDIA INFLUENCERS\n From sports and movie stars to social media personalities and politicians, here are the people with the largest social media followings across platforms.\n TOTAL FOLLOWERS IN 100M\n 1 493M Athlete @Cristiano Cristiano Ronaldo Soccer superstar/forward person on both Instagram and Facebook.\n 2 443M Musician @justinbieber Justin Bieber\n 3 429M Musician @ArianaGrande Ariana Grande\n 4 403M Musician @selenagomez Selena Gomez\n 5 361M Musician @taylorswift Taylor Swift\n 6 342M Actor @therock Dwayne Johnson\n 7 330M Musician @rihanna Rihanna\n 8 333M Other @kyliejenner Kylie Jenner\n 9 319M Other @kimkardashian Kim Kardashian\n 10 298M Athlete @leomessi Lionel Messi\n 11 281M Musician @shakira Shakira\n 12 267M Musician @jlo Jennifer Lopez\n 13 279M Athlete @neymarjr Neymar\n 14 267M Musician @beyonce Beyoncé\n 15 254M Other @ellendegeneres Ellen DeGeneres\n 16 222M Other @barackobama Barack Obama\n 17 232M Musician @nickiminaj Nicki Minaj\n 18 221M Musician @ddlovato Demi Lovato\n 19 222M Actor @willsmith Will Smith\n 20 231M Other @ladygaga Lady Gaga\n 21 219M Athlete @imvkohli Virat Kohli\n 22 193M Musician @eminem Eminem\n 23 194M Musician @brunomars Bruno Mars\n 24 194M Musician @chrisbrownofficial Chris Brown\n 25 185M Other @kevinhart4real Kevin Hart\n 26 180M Other @vindiesel Vin Diesel\n 27 181M Other @realDonaldTrump Donald Trump\n 28 180M Musician @justintimberlake Justin Timberlake\n 29 186M Musician @iamcardib Cardi B\n 30 190M Other @khloekardashian Khloe Kardashian\n 31 191M Athlete @kingjames LeBron James\n 32 175M Other @beingsalmankhan Salman Khan\n 33 160M Other @akshaykumar Akshay Kumar\n 34 170M Actor @vindiesel Vin Diesel\n 35 136M Musician @snoopdogg Snoop Dogg\n 36 144M Musician @brittneyspears Britney Spears\n 37 143M Other @priyankachopra Priyanka Chopra\n 38 133M Musician @billieeilish Billie Eilish\n 39 141M Musician @whinderssonnunes Whindersson Nunes Batista\n 40 130M Other @camila_cabello Camila Cabello\n 41 140M Musician @wizkhalifa Wiz Khalifa\n 42 140M Musician @shakira Shakira\n 43 140M Musician @pitbull Pitbull\n 44 140M Musician @ladygaga Lady Gaga\n 45 138M Musician @dualipa Dua Lipa\n 46 133M Musician @katyperry Katy Perry\n 47 139M Other @deepikapadukone Deepika Padukone\n 48 136M Musician @charlidamelio Charli D'Amelio\n 49 132M Musician @shawnmendes Shawn Mendes\n 50 128M Musician @shawnmendes Shawn Mendes", "source": "20261111_092233.jpg"}, {"kind": "paragraph", "text": "강화하여 하는 일을 모방하고 싶어 한다. 이 장 뒷부분에서 열망 준거집단의 영향력을 설명하면서 이 개념을 확장해서 자세히 설명할 것이다. 또한 유명인은 본인의 유명인 지위를 활용해 자신의 브랜드를 마케팅하기도 한다. 하우스 노브랜더스(Haus Labs)라는 화장품 라인은 레이디 가가(Lady Gaga), 제니퍼 로페즈(Jennifer Lopez)의 제이로(JLo) 뷰티 브랜드, 해리 스타일스(Harry Styles)의 플리징(Pleasing)이 여기에 해당한다.\n유명인 중에는 소셜 미디어에서 매우 강력한 존재감을 가지고 있어서(그림 11-2 참고) 게시한 영상이 큰 대중적 반응에 영향을 미치는 이들이 많다. 예를 들어, 소셜 미디어 팔로워 수가 많은 유명인 중 말론 팔로워 수가 몇 명이 많은 즉각 슈퍼스타 크리에이터가 눈에띈다.\n개인 취향는 유명인이어서가 아니라 특정 카테고리의 소셜 미디어 콘텐츠 때문에 유명인 지위를 얻어 영향력을 미치게 되는 사람들도 있다. 예를 들어, 후다 카탄(Huda Kattan)과 제임스 찰스(James Charles)는 뷰티 카테고리에서 수백만 명의 팔로워를 보유하고 있다. 키아라 페라그니(Chiara Ferragni), 지지 하디드(Gigi Hadid), 벨라 하디드(Bella Hadid)는 패션과 스타일 분야에서 수백만 명의 팔로워를 보유하고 있다. 또한 제임스 찰스(Zoella), 빌리 싱(Billy Sing)은 피트니스와 인플루언서이며 애디슨 레이(Addison Rae)와 찰리 더멜리오(Charli d’Amelio)는 틱톡(TikToker)이다. 펍지(PewDiePie)의 잭(Zach King)은 게임과 마법에 유명 유튜브 팔로워를 보유하고 있다.\n인플루언서는 많은 청중에게 메시지를 전달할 수 있다. 그리고 인플루언트에는 뛰어난 설득 능력이 있어 팔로워를 설득하고 브랜드를 홍보하여 특정 제품을 홍보하는데 매우 효과적이다. 따라서 유명인과 인플루언서를 통해 브랜드는 주류 미디어를 통해 점점 더 많은 고객을 모을 수 있다. 많은 팔로워를 보유하고 있지만 자신은 소수의 사람을 팔로워로 보유한 일반 소비자가 다른 친구와 친분을 갖고 있다고 생각한다. 물론, 소비자가 인플루언서가 브랜드 추천에 대한 귀기울여 듣는 사실은 인플루언서에 대한 소비자의 객관성과 신중성에 대한 평가가 낮기 때문에 소비자 행동에 미치는 인플루언스는 중요하다.\n 마켓 메이븐\n 의견 선도자는 특정 제품과 서비스 범주에서 중요한 영향력 원천인데 연구자들은 다른 특별한 영향력 원천을 파악했다. 바로 마켓 메이븐(market maven), 즉자 전달에 대해 폭넓고 깊은 지식을 갖춰 있는 사람이다. 마켓 메이븐은 가장 중요한 제품뿐만 아니라 매출이 많은 최상의 점포와 소매 웹사이트에 대해 모두 아는 경우가 많다. 이런 메이븐은 사교적 네트워크의 중심 구성원이 되어 자신의 역활에 만족할 수 있지만 중심 구성원의 되면 스트레스를 받는 수도 있다. 따라서 마켓 메이븐들은 시간이 지나면 다른 마켓 메이븐들을 찾아 잘 활용하는 경향이 있다.12\n 리뷰어\n 앞서 언급한 것처럼 일부 의견 선도자는 레스토랑, 영화, 기술 장비, 자동차를 리뷰하는 제품 리뷰어(reviewer) 역할을 한다. 그러나 모든 리뷰어가 의견 선도자는 아니다. 소비자는 아마존닷컴(Amazon.com), 트립어드바이저(TripAdvisor), 에어비앤비(Airbnb)의 구매와 평가 리뷰만 보는 같은, 일반인 리뷰에 의존하는 경우가 많다. 이러한 개인 리뷰는 실제 제품 사용 경험을 기반으로 작성되므로 리뷰 내용에 대해 보상을 받지 않기 때문에 신뢰성이 매우 높다. 실제로 전 세", "source": "20261111_092240.jpg"}, {"kind": "paragraph", "text": "온라인 쇼핑객의 94%는 익숙하지 않은 쇼핑채널에서 구매하기 전에 일반인의 리뷰를 참고한다.13 그림 11-3을 보면 소비자들이 가장 유용하다고 생각하는 리뷰의 정보 유형을 알 수 있다. 소비자가 제품과 서비스에 대한 리뷰를 접할 수 있는 기회는 매우 많다. 옐프(Yelp)라는 자사 플랫폼만 해도 2억 4,000만 개 이상의 리뷰를 보유하고 있으며, 트립어드바이저는 소비자들이 제공한 전 세계 호텔과 여행 업체에 대한 10억 개 이상의 리뷰를 보유하고 있다.14\n 스타티스타(Statista)에 따르면 소비자의 절반 이상이 해외 직구와 같이 개인에게 익숙하지 않은 온라인 쇼핑몰에서 상품을 구매하는 것을 선호하는데,15 한 연구에 따르면 전통적인 리뷰는 추천(‘좋은 공정 거래가 되게 도와드릴게요!’ or ‘편안한 거래를 도와줄 것 같습니다.’)보다 신뢰할 수 있고 제품에 대해 더 많이 가르쳐 준다고 인식된다.16 전체 구매자의 70%가 스타 리뷰 평점(예를 들어 아마존닷컴에서 찾아볼 수 있는 것)으로 제품을 확인하는 것도 리뷰의 중요성을 보여 준다. 여러 연구 결과를 종합해 보면 리뷰는 상품 유형이나 쇼핑 채널과 무관하게 구매 의사결정에 영향을 미친다고 볼 수 있다.17\n 또한, 리뷰는 감성적인 부분도 자극할 수 있다. 예를 들어, 요구사항이 많다는 내용의 리뷰는 불만과 불편함을 초래하는 집단에 기반하고 있음을 시사하며, 이는 종종 소비자에게 공감을 불러일으킨다.18 리뷰는 사람들에게 구매와 관련된 간접적 경험을 제공하고, 리뷰를 읽는 사람에게 즐거움도 줄 수 있다. 한 메타 분석 연구에서는 리뷰가 소비자의 실제 구매 행동에 어떤 영향을 미치는지 조사했다. 리뷰의 양, 평균 평점, 별점의 분포, 별점의 변동성 등 리뷰의 여러 속성을 측정하고 그 영향을 살펴보았다. 연구 결과는 리뷰가 판매량을 증대시키는 데 중요한 역할을 함을 보여 주었다.19\n 일반적으로 제품 리뷰는 긍정과 부정으로 양극화되는데 긍정적 리뷰가 대부분이다.20 그러나 전문가 리뷰에는 리뷰를 올릴 때 많은 정보를 참고하기 때문에 덜 극단적인 경향이 있다.21 리뷰는 읽는 사람의 주의를 사로잡는 내용에 따라 다양하다. 감정을 불러일으키는 내용이 포함된 리뷰가 가장 매력적인 리뷰다. 온라인 리뷰는 매장보다 쇼핑에 더 큰 영향을 미치는 경향이 있다. 매장은 여러 종류의 제품을 판매하지만 쇼핑몰은 단일 제품을 판매하는 경우가 많기 때문이고,22 일반적으로 감정을 일으키는 리뷰는 소비자의 제품 평가를 향상시", "source": "20261111_092244.jpg"}, {"kind": "heading", "text": "준거집단", "source": "20261111_092252.jpg"}, {"kind": "paragraph", "text": "소비자는 다양한 준거집단들에 조직, 언론매체 등 영향력 있는 다른 집단들이 수행하는 비교, 규범 또는 정보제공 등에 의해 준거집단의 사람들의 생각과 감정이 구매결정에 많은 영향을 미치게 된다. 이 장의 초점을 준거집단을 소비자행동에 어떻게 영향을 준다는 점에 맞추기로 하자.\n 1) 일부 준거집단(optimal reference group)소비자가 존경하고 선망하는 집단이다. 일부 준거집단은 가족, 친구, 동료, 연예인 등이 있다. 이들 준거집단은 소비자에게 많은 영향을 미친다. 특히 젊은 층에게 일부 준거집단의 영향이 크다. 예를 들어, 젊은 층은 좋아하는 연예인이 광고하는 제품을 구매하려는 경향이 있다. 또한, 패션, 음악, 스포츠 등에서 일부 준거집단의 영향을 많이 받는다. 대학생들이 특정 브랜드의 가방이나 신발을 선호하는 것은 주변 친구들의 영향을 받은 결과일 수 있다.\n 2) 소속 준거집단(associative reference group)소비자가 현재 소속된 집단이다. 소속 집단, 대조우로, 가족, 직장, 학교, 동호회 등이 여기에 포함된다. 소속 준거집단은 소비자의 일상생활에서 밀접하게 관련되어 있으며, 소비자의 제품 사용과 구매행동에 직접적인 영향을 미친다. 예를 들어, 회사에서 동료들이 사용하는 제품이나 브랜드를 따라 사용하는 경우가 많다. 또한, 가족 구성원의 선호에 따라 특정 제품을 구매하기도 한다. 예를 들어, 가족들이 특정 브랜드의 세제를 사용하면, 그 집안에서는 자연스럽게 그 브랜드의 세제를 계속 사용하게 되는 경우가 많다.\n 3) 분류상 준거집단(dissociative reference group)소비자가 자신과 거리를 두고 싶어 하는 집단이다. 예를 들어, 소비자는 특정 집단의 구성원처럼 보이지 않기 위해 그 집단과 연관된 제품이나 브랜드를 피하는 경우가 있다. 예를 들어, 어떤 소비자는 자신이 속하고 싶지 않은 집단이 선호하는 브랜드의 옷을 입지 않으려고 할 수 있다. 이는 소비자가 자신의 정체성을 특정 집단과 구분하려는 욕구에서 비롯된다. 이와 같이 분류상 준거집단은 소비자의 제품 회피 행동에 영향을 미친다.\n 4) 회피 준거집단(dissociative reference group)은 소비자가 회피하고 싶어 하는 집단이다. 소비자는 이 집단의 구성원처럼 보이고 싶지 않기 때문에 이 집단과 관련된 제품이나 브랜드를 사용하지 않으려 한다. 예를 들어, 한 연구에 따르면 소비자는 자신이 선호하지 않는 집단의 구성원이 즐겨 찾는 브랜드의 제품을 피하는 경향이 있다. 또한, 일부 연구에서는 소비자가 자신이 속하고 싶지 않은 집단이 선호하는 브랜드를 회피함으로써 자신의 정체성을 표현하려는 경향이 있다는 것을 보여준다. 나도 그들이 좋아하는 브랜드에서 멀어지려고 한다. 한 연구자는 소비자가 회피 준거집단과 관련된 브랜드를 회피하는 것은 단지 그 브랜드를 싫어해서가 아니라 그 브랜드와 관련된 집단과의 동일시를 피하려는 욕구에서 비롯된다고 주장하였다. 예를 들어, 어떤 소비자는 자신이 싫어하는 집단과 연관된 브랜드의 옷을 입지 않으려고 할 수 있다. 이처럼 회피 준거집단은 소비자의 브랜드 선택에 중요한 영향을 미친다. 한 연구에서는 소비자가 회피 준거집단과 관련된 브랜드를 완전히 포기하는 것보다 동일한 브랜드에서 반듯이 주목 제품을 업그레이드하는 경향이 있다는 것을 발견했다.", "source": "20261111_092252.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261111_092256.jpg"}, {"kind": "paragraph", "text": "소비자 관련된 영향력 원천을 통해 다양한 마케팅 시사점을 얻을 수 있다.\n 의견 선도자와 인플루언서를 목표로 삼고 투자하라 잠재적 영향력과 시장 정보를 찾고 제공하는 추진력을 자원을 고려할 때 의견 선도자와 인플루언서를 파악하여 타겟팅하는 것은 당연한 전략이다. 예를 들어, 데이비드 베컴이나 라이언 고슬링과 같은 셀러브리티를 패션 및 뷰티 브랜드의 홍보 도구로 삼아 의견 선도적인 셀러브리티의 추종을 통해 남성 소비자에게 영향을 주기도 한다. 또 다른 예로, 블로거 가비 그렉(Gabi Gregg)@gabifresh)은 거의 반만 명의 팔로워를 보유한 매우 성공적인 플러스 사이즈 패션 블로거이다. 그녀의 블로그를 통해 자존감 향상과 플러스 사이즈 바디 포지티브(body-positive)의 중요성에 관한 재능을 펼친다. 인플루언서 마케팅 관리자는 그녀의 블로그가 긍정적이고 개인적인 리뷰를 중심으로 매우 활력이 넘치기 때문에 가비 그렉 또한 개인에게 영향을 미친다고 바라본다. 또한 인플루언서는 소셜미디어 플랫폼에서 선도적인 고객과도 같다. 인플루언서는 소비자 중에서 영향력이 가장 큰 대표단과 영향력이 거의 없는 그룹을 연결하는 중심에 있는 사람을 의미한다. 마케터의 관점에서 인플루언서는 고객에게 브랜드를 눈에 띄게 하고 홍보하는 개인이다. ‘좋아요’나 사진과 동영상을 공유하는 활동은 사적인 관심사를 표현하기도 하지만, 인플루언서에게 동의한다는 의사를 표현하는 것이기도 하다. 따라서 브랜드 관리는 인플루언서를 마케팅 활동의 핵심 부분으로 고려해야 한다.\n 마케터는 인플루언서를 통해 파급력이 커질 수 있는 마케팅 커뮤니케이션 활동을 촉진할 수 있어야 한다. 오늘날 새로운 인플루언서의 전문 영역은 수학 교육, 여행, 체육, 과학 등 광범위하게 분포하며 틱톡(TikTok), 유튜브, 인스타그램 등 수많은 소셜 미디어 플랫폼을 통해 팔로워와 상호작용하고 있다. 전문적인 틱톡 인플루언서로 활동하고 있는 J. K. 헤머(J. K. Hemmer)는 부모들이 수학과 과학을 교육하는데 응용할 수 있는 수천 개의 비디오를 제작하고 있다. 헤머는 또 다른 인플루언서들과 함께 소셜 미디어에서 인플루언서 소사이어티라는 단체를 조직하여 각 인플루언서들의 성공적인 전략과 실수를 공유한다. 이러한 활동들은 학교와 계절적인 교육 프로그램에서 수학과 과학 수업의 질을 높이기 위해 노력하고 있다.\n 문제는 마케팅 관리자가 이러한 인플루언서를 놓치고 있을 때도 있다는 것이다. 그들은 유명하지 않을 수도 있지만 상당한 영향력을 가지고 있다. 따라서 마케팅 담당자는 이러한 소비자들을 찾아내어 이들에게 특별한 혜택을 제공하여 타겟으로 삼아야 한다. 설명하자면, 팀 챔프(Team Champ)로 알려진 네 명의 어린이를 꼽을 수 있다. 이 팀은 11세에서 14세 사이의 어린이들로 유튜브 채널을 통해 토이 언박싱, 게임 후기, 생활 브이로그 등을 공유한다. 이들의 콘텐츠는 친구들뿐 아니라 그들의 부모에게도 매우 인기가 있다. 따라서 이들을 통해 해당 브랜드는 신규 시청자를 네트워크에 확보하고 유지하는 데 큰 영향을 미쳤다.31", "source": "20261111_092256.jpg"}, {"kind": "heading", "text": "제품과 관련 준거집단을 연결하자", "source": "20261111_092303.jpg"}, {"kind": "paragraph", "text": "농가 판매시장의 선도자의상담에도 제한할 수 있다. 연구에 따르면 일반 선도자는 소비자뿐만 아니라 의사나 태도와 행동에도 영향을 미칠 수 있다.\n 제품과 관련 준거집단을 연결하자 세계 여러 문화권의 소비자들이 특정 준거집단을 염두에 두고 자사 제품을 광고한다. 포르셰 자동차의 광고 담당자는 유럽 시장을 마케팅 활동의 중심으로 삼고 있지만 융합된 규범에 대한 사람들의 선호에 중점을 두고 있다. 예컨대 미국인 소비자는 개별성을 상기시키는 메시지에 더 호의적으로 반응하는 반면에 프랑스인과 독일인은 친사회적인 메시지에 더 호의적으로 반응한다. 포르셰 광고 담당자는 포르셰가 제품을 광고하고자 할 경우 고객의 개별성을 강조한다.\n 소스 준거집단을 포함한 대표적인 광고 신제품의 시장점유가 소비자들이 속한 준거집단의 손수 준거집단으로 간주되면 광고에 사용된다. 마케팅 관리자는 소비자들이 어떤 소스 준거집단을 보다 신뢰하는지에 대해 이해할 필요가 있다. 이러한 이해에 기반해 소스 준거집단을 광고모델로 발탁하여 소비자로 하여금 자기 관련적인 느낌을 받고 받아들이도록 하는 것이다. 특히 연예인 소스 준거집단은 대표적인 준거집단이라고 할 수 있다. 예컨대 진티스 보틀러(King Australia)는 크리스티 프리 드라이버가 나타나 캐럴라이나 몬트 조지와 함께 자전거를 타는 광고를 진행했다. LG전자의 경우 싸이 프랭크를 광고모델로 내세워 바디가 커버 소비자가 LG전자의 제품을 활용하는 모습을 보여줌으로써 마케팅 성과를 높였다.\n 준거집단이 제품과 브랜드 구매 결정에 어떤 영향을 미치는지 이해하라 준거집단은 두 가지 유형의 결정에 영향을 미친다. (1) 특정 제품 유형 구매 여부와 (2) 어떤 브랜드를 구매할 것인지를 결정하는 것이다. 준거집단은 특정 제품을 구매할 때 준거집단의 영향력 미칠 수 있다. 그러나 상대적으로 제품군 보다는 구매할 브랜드의 제품을 더 판별한다. (1) 해당 제품이 개인적으로 소비되었는지 아니면 공적으로 소비되었는지에 따라서이다. (2) 필수품인지 사치품인지에 따라 달라진다. 그림 11-5에서 볼 수 있듯이 준거집단은 사치품으로 분류되는 사치품은 반면 매트리스는 개인적으로 소비되는데 반해 쇼핑하기 싫어하는 편이다. 개인적으로 소비되는 경우에는 타인의 주의와 관심을 덜 받기 때문에 준거집단의 영향이 보다 적다.\n 첫 번째 요소는 소비자가 필수품은 반드시 구매해야 하기 때문에 준거집단이 제품 구매 여부에 영향을 미치지 않는다는 것이다. 그러나 사치품의 경우에는 소비자가 상징적인 가치에 대해 더 고려하는 경향이 있다. 이러한 사치품의 경우에는 소비자들은 준거집단이 어떠한 개념을 구입해야 한다는 의사결정에 영향을 받는다는 것이다. 예컨대 어떤 브랜드의 자동차를 구입해야하는지 결정에 영향을 미친다는 연구 결과이다. 또한 명품을 구입하지 않으려는 사람들은 나타내고자 하는 매개변인이 사용자들의 상징성과 인기를 만들어낸다.\n 반면에 공적으로 소비할 수 있는 것은 자동차와 같이 공개된 장소에서 사람들은 제품을 소비하기가 더욱 수월하다. 공적으로 소비하면서 소비자의 표준과 프리미엄이 다른 사람들의 인식을 고려하는 것이다. 반면에 매트리스를 사용하고 있는 사람들의 공적으로 어떤 브랜드를 구매하는 것보다 사적으로 소비되고 있는 경우에 소비자들이 다양한 특성들이 각각 다른 내용을 전달한다. 그런데 외부에 노출되어 공개적으로 소비하는 제품의 경우에는 브랜드 이", "source": "20261111_092303.jpg"}, {"kind": "heading", "text": "11-2 영향력 도구", "source": "20261111_092307.jpg"}, {"kind": "paragraph", "text": "11-2 영향력 도구\n 그림 11-1의 영향력 원천은 오프라인이나 온라인에서 영향을 줄 수 있다. 또한 개인별로 일대일 영향을 주거나 많은 사람에게 동시에 일대다로 영향을 줄 수 있다.\n 11-2a 오프라인 도구\n 마케팅 관리자는 소비자에게 영향을 줄 수 있는 다양한 도구를 가지고 있다. 오프라인 도구에는 인쇄 및 방송 광고, 팸플릿, 브랜드 이벤트, 영업 담당자의 대화, 고객 서비스 담당자의 전화 통화, 구전(또는 추천), 후원 콘테스트, 쿠폰, 제품 및 이벤트가 있다. 맥도날드(Mcdonald’s)와 맥스웰(Maxwell’s)과 맥카피(McCaffe)의 협동 브랜드 및 소비자 구매와 도달을 향상시키기 위해 신문과 TV를 통해 특별 세일과 신제품을 소개할 수 있다. 대부분의 기업은 유명 인사를 광고 매체에 사용하여 커뮤니케이션 도구인데 버드와이저(Budweiser), 바이아(大宇), 윌슨(Wilson), 비보이노는 2002 월드컵 축구를 후원했다. 친구, 이웃, 직장, 낮선 사람(예: 비행기 옆좌석에 앉은 사람), 의사, 서비스 제공자가 주는 다양한 비마케팅 채널은 오프라인 의사소통 도구로 사용된다.\n 11-2b 온라인 도구\n 마케팅 관리자는 온라인 도구를 사용하여 소비자에게 마케팅하는 경우가 많다. 예를 들어, 브랜드 커뮤니티 회원 전용 페이스북 페이지와 트윗을 사용하여 회사가 고객을 만난다. 휴대폰을 통해 전달되는 마케팅 관련 문자 메시지, 고객 서비스 담당자의 온라인 채팅, 블랙 프로모션 이메일도 온라인 도구이다. 페이스북, 인스타그램, 앱포와 같은 소셜 미디어 플랫폼, 트위터(트위터), 컨슈머 리포트(Consumer Reports) 웹사이트는 마케팅과 비마케팅 원천으로 점점 더 많이 사용되고 있다. 세계 인구의 45%가 소셜 미디어를 적극적으로 사용하고", "source": "20261111_092307.jpg"}, {"kind": "paragraph", "text": "있기 때문이다. 이러한 추세는 놀라운 일이 아니다. 실제로 2021년 9월 현재 중국의 소셜 미디어 플랫폼 틱톡의 월 방문자는 10억 명이 넘는다. 이러한 높은 수준으로 인해 모든 종류의 제품이 해시태그 #TikTokMadeMeBuyIt을 사용하여 플랫폼에서 입소문을 내고 있다. 그림 11-6은 미국의 플랫폼별 소셜 미디어 사용자 수를 보여 주고 있다.\n소셜 미디어는 대중성 영향을 갖고 있기 때문에 콘텐츠를 소비하고 공유할 장소, 방법을 선택하기 때문에 좀 더 개인적인 느낌을 준다. 동시에, 유튜브 사용 후 사람들이 소셜 네트워크에 공유하면 믿음이 높아진다. 소비자는 마케터에게 관련성 보장을 하는 마케터의 원하는 소셜 미디어를 선택한다. 소셜 미디어에서 부정적인 댓글을 포함하여 콘텐츠에 대한 토론, 평판, 꼬리표 및 공유가 증가할 수 있다.41 그 결과 마케터는 콘텐츠의 통제를 포기해야 되는 경우도 있다. 이러한 광고들은 유튜브에 게시된 바이럴 동영상과 앱에서 제공되는 짧은 광고 메시지로 도리토스(Doritos)와 같은 소비자 제작 광고도 있다.45 소셜 미디어를 통해 전달되는 마케팅 원천에 대한 반응은 콘텐츠가 재미있고, 정보를 잘 전달하며, 소비자 경험이 가치를 부여할 때 긍정적일 가능성이 높다.46\n 사람들은 다양한 이유로 소셜 미디어에 정보를 공유한다. 때때로 소속감을 느끼기 위해 소셜 미디어를 사용하는가. 예를 들어, 사회적으로 소외된 사람들은 세상을 이해하고 집단적인 의미를 느끼기 위해 온라인 커뮤니티에 게시글을 올리고 뉴스를 공유한다.47 그리고 소셜 미디어는 소비자들이 서로 연결하는 능력을 간단한 예로 제공한다.\n 정보를 공유하는 또 다른 동기는 정보를 받은 사람들의 눈에 자신이 좋게 보이도록 하는 것이다. 하지만 실제로 공유된 정보 때문에 수신자가 공유자를 좋게 볼까? 수신자가 메시지를 쉽게 읽을 수 있으면 공유자가 더 좋아 보일 것이다. 실제로 소비자들은 읽기 쉬운 소셜 미디어 메시지를 만들고, 공유하고, 댓글을 달리는 경향이 있다.50 또한, 공유한 정보는 얼마나 정확히 정", "source": "20261111_092314.jpg"}, {"kind": "heading", "text": "11장 소비자 행동에 영향을 미치는 사회적 요인", "source": "20261111_092318.jpg"}, {"kind": "paragraph", "text": "가합지 여부는 공유자를 얼마나 신뢰하는지에 따라 달라진다.51 사람들은 신뢰할 수 있는 정보원이나 사람이 공유한 정보를 높게 평가한다. 그리고 공유자가 공유라는 사적인 이유에 좋아 보인지 여부도 공유된 콘텐츠에 따라 달라진다. 공유자는 제품 추천을 공유하는 반면, 수신자는 정보를 포함한 감정을 공유한다. 공유자가 재미있는 콘텐츠를 공유하면 수신자가 공유자를 재미있는 사람이라고 믿게 된다.52 소셜 미디어는 스스로 재미있는 콘텐츠를 찾은 사람들에게는 또래들로부터 공유될 가능성이 적다. 왜냐하면 자신이 스스로 발견해서 재미있다고 생각한 콘텐츠를 다른 사람들도 흥미롭다고 생각할지 의구심이 있기 때문이다.53 사회적으로 걱정이 많은 사람들은 특별히 잘 관찰 연구하여 자신의 감정을 진단할 수 있기 때문에, 트위터나 페이스북을 통해 정보 공유를 하는 것을 좋아한다.54 또한 사람들은 특정한 상황에 있을 때와 친구들과 함께 있을 때 다르게 말하는 경향이 있다. 모르는 사람과 대화할 때는 자신을 다른 사람에게 좋게 보이려는 경향이 있지만, 친구와 대화할 때는 기존 우정을 유지하기 위해 감정적으로 연결하려고 노력하는 경향이 있다.55\n 11-2c 일대일, 일대다 영향력 전달 도구\n 앞에서 언급한 것처럼 온·오프라인 도구를 통한 사회적 영향력에는 일대일 영향력이 있으며, 때로는 그와 비슷한 사람들끼리의 개인 대면, 유명 사람이냐 친구의 대면 여부, 웹사이트, 소셜 미디어, 온라인 뉴스레터, 블로그 등의 매체는 하나의 정보 원천에 많은 소비자에게 정보를 전달한다. 일반적으로 일대일로 영향을 전달하는 도구는 양방향 의사소통이 가능한 전화 통화가 한 형태이다. 쉽게 질문하고 답할 수 있다. 대조적으로, 일대다 영향력을 주는 도구는 한 번에 많은 청중에게 다가갈 수 있는 기회를 제공한다.\n 11-3 영향력 유형\n 지금까지 다양한 영향력 원천(예: 마케터, 미디어, 인플루언서)과 영향력 행사 방법(온라인, 오프라인, 대면, 소셜 미디어)에 대해 살펴보았다. 이제 영향력 유형(규범적, 정보적(그림 11-1 참조), 전달의 톤의 특성인 극성(valence), 전달 양식(modality)을 살펴보고자 한다.\n 11-3a 규범적 영향력\n 5장에서는 규범이 행동 의도와 소비 행동에 영향을 미치는 맥락에서 규범적 영향력을 간략하게 논의했다. 여기서는 규범(norm)의 개념에 대해 더 자세히 설명하고자 한다. 규범적 영향력이란 용어는 사회 구성원이 기대하는 행동에 대한 사회의 집단적 결정인 규범에서 유래한다. 예를 들어, 패션, 브랜드, 매장, 스타일에 대한 규범이 있다. 절도와 충동구매를 제한하는 규범이 있다. 또한 서비스 종업원을 대하는 방법에 대한 규범이 있다. 도덕적 가치는 어떤 행동이 옳은지 그른지를 결정하기 때문에 도덕은 규범적 영향력과 관련이 있다. 그리고 규범은 의율의 신이 무엇을 원하는 것에 대한 사람들의 전반적 태도에 큰 영향을 미칠 수 있다. 특정 흡연자가 모여 프롬을 피우는 것에 대한 사람들의 행동 규범이 존재한다는 것을 생각해보자. 코로나19로 마스크 착용 광범위한 식료품점에 한 번에 입장할 수 있는 사람 수, 레스토랑 감소이다. 이는 사람들에게 인식하는 방법(손 세탁 주먹 부딪힘)에 이르게", "source": "20261111_092318.jpg"}, {"kind": "heading", "text": "브랜드 선택 일치성", "source": "20261111_092324.jpg"}, {"kind": "paragraph", "text": "지 어떤 형태의 소비자 행동 규범을 바꾸었다.\n규범적 영향력은 소비자가 규범을 따르지 않을 경우 제재, 처벌, 조롱을 당한다는 것을 암시한다.56 또한 그러한 행동을 하면 보상을 받게 된다는 의미이기도 하다. 예를 들어, 워킹 면접에서 면접관은 지원자의 특정 행동에 따라 칭찬이라는 보상을 주거나 탈락시킬 수 있다. 규범적 영향력은 따라야 할 규칙, 벌금과 같이 소비자의 행동에 미치는 외부적 영향 요인들로 가질 수 있다.57 공항에서는 보안 요원을 통해 규칙을 따르지 않는 승객이 탑승하지 못하도록 하는 제재를 취한다. 도서관은 책을 늦게 반납하는 고객에게 벌금을 부과한다. 이와 같이 규범적 영향력은 소비 행동에 중대한 영향을 미친다.\n 브랜드 선택 일치성 그림 11-7에서 알 수 있는 것처럼 소비자 행동에서 규범적 영향력은 소비자 브랜드 선택 일치성(brand-choice congruence)에 영향을 준다. 다시 말해, 소비자가 집단 내 다른 사람들의 선택과 구매를 구체할 가능성이 생긴다는 것이다. 소비자가 구배할 옷, 음악, 헤어스타일, 자동차 등을 선택할 때, 직접 관계가 있거나 관찰을 지치인 관계가 있는 사람들의 영향을 경험할 수 있는한다. 또는 사람의 존재 때문에 선택의 범위를 공유 자주하게 된다. 영화 영화 보는 것을 즐기는 사람이 있는 경우, 함께 영화를 볼 때 좋아하는 영화, 선호하는 브랜드, 선호하는 영화 보는 방식을 반영할 가능성이 있다.58 나의 소셜 네트워크에 있는 친구, 친척, 다른 사람들은 물론 유명인, 유명인들이 입는 옷, 화장품, 스포츠용품 브랜드 선택에 상당한 영향을 미칠 수 있다. 특정 브랜드 구매는 새로 구배할 제품이나 서비스를 관여사기 위하여 관련 내용을 미리 검색하는 것만으로도 소비자가 그 제품과 기능에 대해 생각하고 느끼는 방식이 바뀔 수 있다.\n 동조성 규범적 영향력은 개인이 집단 내 구성원이 행동 방식처럼 행동하는 성향인 동조성(conformity)에 영향을 준다. 동조성과 브랜드 선택 일치성은 서로 관련된 개념이다. 선택 일치가 동조하는 유일한 방법은 아니다. 외형에서 언급하였가 같이 사람들이 행동하는 방식으로 행동하는 동조 경향이 있다면, 다른 행동들에도 동조할 수 있다. 예를 들면, 파티에서의 행동은 부모님과 함께 있을지 아니면 친구와 함께 있는지에 따라 달라질 수 있다. 각각의 경우, 함께 간 사람에게 적절한 행동 기준이 달라진다.\n 동조 압력은 상당히 클 수 있다.5 미성년자 음주, 유휴 마약 소비에 대한 집단의 압력은 조사한 연구에 따르면 청소년들을 길타이 기피하는 행동에 동조하는 것을 자주 경우가 크다. 젊은 사람들이 자신의 의견이 생각과 걱정을 것으로 나타났다(그림 11-8 참조). 또 다른 연구에 따르면 집단 내 많은 사", "source": "20261111_092324.jpg"}, {"kind": "paragraph", "text": "탐들이 동조할수록 동조 수준이 증가하는 것으로 나타났다. 그러나 정체성 기반 사고(‘나는 환경운동가입니까?’)를 하면 동조 압력에 강하게 저항하였다.63\n 순응과 저항 순응(compliance)은 다른 사람이 특정 행동을 할 것을 명시적으로 요구하는 것에 따라 행동하는 것을 의미하며 규범적 영향력의 또 다른 결과라고 할 수 있다. 예를 들어, 마케팅 조사 설문조사에서의 결과수록은 우리가 규율을 요청받을 때 이를 따르면 순응하는 것이다. 부모는 아이들이 요구하는 음식이나 장난감을 사주거나 할동(예: 파티)을 허용함으로써 아이들의 요구에 순응하기도 한다. 가상 커뮤니티에서는 구성원이 운영하고 있다고 믿기 때문에 기업이나 마케터가 제안한 요구에 쉽게 따르지 않을 수 있다.64\n 선택의 자유가 위협받고 있다고 믿을 때 부메랑 효과가 나타나고 저항하게 된다. 즉, 개인이나 집단이 원하는 것과 반대로 행동한다. 예를 들어, 판매원이 구매해야만 두통이 진정될 것이라고 주장할 때 오히려 저항하고 싶은 마음이 들 수 있다.65 사람들은 이러한 ‘just Do It’슬로건과 같은 강압 주장에도 저항(assertive ads)소비자에게 무리한 하도록 시킨다. 아이러니하게도 브랜드에 가장 중요한 소비자의 주장이 강할 경우에 더 큰 저항을 초래 브랜드 선호도가 낮아지고 제품 평가도 저하된다. 브랜드 커뮤니티에서도 저항의 발생을 관찰할 수 있다. 특정 애플 팬들이 애플의 광고에 대해 더 이상 열광적으로 반응하지 않을 때 애플 애플에 대한 커뮤니티의 원래 열광적인 반응을 잃게 되고, 애플에 대한 광고에 대해 말을 많이 느끼면 커뮤니티 참여 욕구나 브랜드 구매 욕구가 낮아질 수 있다.67", "source": "20261111_092328.jpg"}, {"kind": "heading", "text": "손응 기법 활용하기 / 11-3b 정보적 영향력", "source": "20261111_092334.jpg"}, {"kind": "paragraph", "text": "손응 기법 활용하기 현대 마케터는 소비자 손응을 높이기 위해 다양한 기법을 사용한다. 기문 기법(foot-in-the-door technique)을 통해 소비자는 소비자가 작은 요청을 수락하게 한 다음 점차 더 큰 요청을 하여 최종적으로 큰 요청을 수락하도록 유도하는 행동을 하도록 시도할 수 있다. 예를 들어, 캠벨과 동료들은 잠재고객에게 1달러를 기부해 줄 수 있는 지 여부에 자신 제품에 대해 어떻게 생각하는지 말해볼 것을 부탁한다. 소비자가 회사에 대해 얼마간의 의무감을 느끼면 제품이나 서비스를 구매 제공 구매 가능성이 더 커진다.65 문간에 발 기법(door-in-the-face technique)은 소비자에게 처음에는 큰고 무리였던 요청을 하였다가 나중에 실제 원하는 요청을 하는 것이다. 예를 들어, 판매원이 처음에는 소비자에게 1시간의 시간을 내어 재무설계에 대한 설명을 듣고 포트폴리오를 검토받는 상담을 받으라고 한 다음에 25분만이라도 귀걸이 설명을 들으라고 하는 방식이다.66 소비자는 요청한 내용이 요구에서 작은 것으로 바뀌면서 포기한 부분이 있다고 생각해서 작은 요청에 동의해야 한다는 의무감을 느낄 수 있다. 처음 요청이 현실 보다 너무 뻥쯤 되어야 많이 보이기 때문이다.67 보통 세 번째 접근 방식은 심지세한 기법(even-a-penny-will-help technique)으로, 대개 아주 요청이라도 보기도 않트이 아주 작은 요청을 하는 기법이다. 자정 모금을 요청하는 경우에 연구자들은 ‘단 돈 10원 이라도 기부해 주세요.’라는 문구를 사용했을 때의 손응률과 선택적인 페이소스(‘pennies’) 도메이. 프리를 포함한 여러 설정 점포에서 신용카드로 기부한 때 거스름돈을 기부할 하라고 요청하는 방법이다. 일반적으로 소비자들은 전자보다 많은 사람들의 손응률이 높았으며 후보다 앱에 해당하는 첫 번째 조건에서 사람들은 훨씬 더 많은 기부금을 기부하였다. 단 돈 10원이라도 기부할 수 있다면 순값 5년 동안 도미노 피자 고객들은 2억 달러 이상을 기부했", "source": "20261111_092334.jpg"}, {"kind": "paragraph", "text": "공평위한 정보 탐색을 하지 않을 것이다. 그러므로 믿음직한 친구가 최근에 산 태블릿 PC가 지금까지 사용해 본 것 중 최고라고 이야하면 똑같은 브랜드를 구매할 수 있다.\n소비자는 가격정보와 같이 쉬운내용을 쉽게 이해할 수 있는 반면 복잡한 제품을 구매할 때는 다른 사람들이 제공하는 정보에 더많은 영향을 받는경우가 커진다.또한 제품 구매나 사용에 대한 지각된 위혐의 수준이 높은때도 각각 위험이 높을때 다른 사람들이 제공하는정보에 쉽게 영향을 받는다.예를 들어 돈을 투자하거나 건강, 성능과 같은 소비자가 지각하는 재무적 위험과 안전 위험이 크고 투자 결정을 할 때는 경제적위 험이 크기 때문에 관련 정보에 영향을받는다. 여러 브랜드 간의 차별점을 쉽게 알 수 없을 때 도 정보의 중요성이 커진다.\n마지막으로 문화도 정보의 영향력에 영향을 미칠 수 있다. 한 연구에 따르면 미국 소비자 는 한국 소비자보다 정보 제공 요인에 설득될 가능성이 더 높다고 한다. 한국 문화는 집단과 집단 순응의 중요시 맞춰져 있기 때문에 한국 소비자는 미국 소비자에 비해 규범적 영향력을 더 강하게 받는가.", "source": "20261111_092337.jpg"}, {"kind": "heading", "text": "11-3c 소비자 사회화: 규범적 영향력과 정보적 영향력의 특별한 사례", "source": "20261111_092343.jpg"}, {"kind": "paragraph", "text": "규범력, 정보적 영향은 개인을 사회화하는 데 중요한 역할을 한다. 소비자 사회화(consumer socialization)는 소비자가 되는 법을 배우고 또렷한 가치관을 얻게 되는 과정이다. 그리고 첫차와 사고, 직장을 잡고, 결혼을 하고, 이직이 이루어질 때, 이 규범적, 정보적 영향은 중요한 역할을 한다.83 소비자는 사회화를 통해 삶의 가치를 배우고 소비에 필요한 기술과 지식을 갖게 된다.84 또한 소비자로서 다른 사람과 함께 적절하게 행동하는 방법도 배운다. 어린이는 그림 11-10과 같이 소비 미디어 정보원과 도구의 영향을 받는다.\n 사회화 주체로서 부모\n 부모는 자녀가 노출되는 TV 프로그램, 광고 유형, 일하는 제품 구매를 통해서 자녀의 사회화에 영향을 미친다.85 일부 부모는 자녀가 폭력적이거나 선정적으로 묘사된 프로그램에 노출되는 것을 매우 엄려하며, 자녀의 시청과 게임을 적극적으로 통제하여 제품 사용을 제한할 수 있다. 일부 부모는 신발, 시계, 컴퓨터, 토드, 소비의 장난감을 포함하여 가르침으로써 자녀를 사회화한다. 더 큰 역할은 부모가 그림 11-10처럼 모델 역할을 함으로써 이루어진다. \n 또한 부모는 어린이의 식습관 형성에 중요한 사회화 역할을 한다. 즉, 어린이 비만에 영향을 미치는 유혹을 멀리하게 하고 좋은 음식을 선택하게 함으로써 사회화할 수 있다.87 실제로 한 연구에서는 미국의 어머니 326가구 간 조사 결과, 두뇌건강 식품을 통한 사회화되었다는 연구결과가 있다.86 예를 들어, 부모는 아이들에게 좋은 식품과 나쁜 식품이 무엇인지, 그리고 어린이용 건강식품과 패스트푸드의 차이를 세심한 안내와 교육을 통해 알려 준다. 이런 지식을 갖고 있다는 것은 어린이 이해하게 된다. 또한 제품과 브랜드가 친구를 사귀거나 학교생활을 잘하는 것과 같은 목표를 달성하는 수단이 될 수 있다는 것을 일러 주며 한다. 이러한 소비 관련 능력은 어린이가 성장함에 따라 더욱 뚜렷이 길러지게 된다. \n 또한 부모는 성인 자녀의 행동에 영향을 미칠 수 있다. 예를 들어, 정보, 신념, 자원이 한 세대(부모)에서 다음 세대(자녀)로 전달될 때 세대 간 영향이 나타난다. 예를 들면, 이러한 영향은 특정 제품 범주와 브랜드 구매의 사용에 있어서 나타난다. 예를 들면, 아이는 성장한 후 부모가 구입했던 버터, 세탁 세제, 배터리와 동일한 브랜드를 구매할 가능성이 있다.89\n 부모는 어린 자녀에게 상당한 영향을 주지만 자녀가 자라고 친구들과 상호작용하면서 부모의 영향력은 약해진다. 그러나", "source": "20261111_092343.jpg"}, {"kind": "heading", "text": "11장 소비자 행동에 영향을 미치는 사회적 요인", "source": "20261111_092347.jpg"}, {"kind": "paragraph", "text": "어른이 된 후에도 친구들은 종종 서로의 가치, 태도, 행동에 큰 영향을 주었을 것이 다. 인생을 살면서 많은 집단과 사람을 사귀기 때문에 사회화는 평생 이어지는 과정이다.\n이처럼 소비자 사회화의 형태는 문화마다 다르다는 것에 주목할 필요가 있다.95 부모가 허 용적인 오스트레일리아와 미국과 같은 개인주의 문화에서는 어린 아이들이 소비하는 방법이 소비자 기술을 일찍 배우게 된다. 반대로으로 부모가 엄격한 편인 인도와 같은 집단주의 문화 에서는 더 나이 들 때에 광고 관람을 허락한다.\n 사회화 주체로서 매체와 시장 TV 프로그램, 영화, 비디오, 음악, 비디오 게임, 인터넷, 광고도 사회화 주체로서 역할을 한다. 예를 들어, 광고에서 남자 아이들은 여자 아이들에 비해 지식이 많고 공격적이며 적극적 이고 도구를 잘 사용하는 것으로 묘사된다. 이러한 성 역할 고정관념(sex role typicality) 때문에 여자 아이들이 남자 아이가 되는 것이 좋다는 관념이 생길 수 있다.94\n 11-3d 구전의 파급 및 설득적 영향력 영향력 유형(규범적, 정보적)과 더불어 영향력 특성인 극성(예: 긍정 또는 부정)과 전달 양식(예: 구전 또는 행동)이 소비자에게 영향을 미친다.\n 극성 극성(valence)은 정보가 긍정적인지 부정적인지에 대한 것이다. 연구자들이 부정적 정보와 긍정적 정보가 소비자 행동에 다른 방식으로 영향을 미친다는 사실을 밝혔기 때문에 극성이 매우 중요하다. 불만족스럽지 잘한 이상이 부정적 구전에 편재된다. 다수의 불만족 소비 자는 행동하지 않고 침묵할 것이다. 일부 불만족 소비자들만이 리뷰 웹 사이트에 부정평가 를 게재한다. 특히 소비자 행동 연구자들은 불만족 의견을 좋아하는 사람들은 게시하지 않고 있 다는 점을 인식하고 있다.97 그럼에도 구전에 대한 연구에 따르면, 소비자 인터넷 리뷰에서 긍정적인 것보다 부정적인 내용을 더 많이 발견할 수 있다. 자신의 평가 기준이 높다는 것 을 다른 사람들에게 과시하려고 노력하기 때문이 아닐까? 사람들은 같은 경험에 대한 정보를 추 가로 더 얻어서 자신의 경험을 확인하고 합리화하기를 원하기 때문에 인터넷 구전에 참여 한다. 긍정적 정보에 관한 리뷰 콘텐츠의 통일성은 친숙한 주제에 대한 안심감을 가지게 하 고 구매결정에서 정확성 증가에 도움이 될 수 있다. 반면 부정적인 의견은 리뷰 메시지의 반 복 경로를 만들지 않는다.98 따라서 사람들이 정보 검색을 할 때 긍정적인 리뷰를 접하면 구 매를 완료하고 부정적인 리뷰는 거의 무시할 가능성이 크다. 즉 소비자들이 리뷰를 살펴보는 결정 때문에 떠오르는 나쁜 생각을 하지 않기 위해 부정적인 구매 경험보다 긍정적인 구매 경 험을 공유할 가능성이 더 높다.98\n 연구자들은 사람이 긍정적 정보보다 부정적인 정보에 더 주목하고 비중을 둔다고 가 정한다.99 사람은 대상을 평가할 때 부정적 정보의 진단성이 높아 더 많이 참고한다. 부정적 정보를 통해 대상이 어떻게 다르게 또는 더 잘 알 수 있기 때문이다. 일반적으로 제품들에 대한 공 정적 정보가 많다. 반면에 부정적 정보는 놀랍게 하거나 특이하게 일반적인 것과 다르기 때문 에 주목을 받는다.100 또한 제품에 문제가 발생해 불편을 겪게 되면 부정적 정보를 사용하는 소비자가 아 닌 제품 자체에 문제가 있다고 생각할 수 있다. 예를 들어, 친구가 새로운 식당에서 식사 한 후 아팠다는 사실을 알게 되면 그 원인이 친구가 과식해서가 아니라 나쁜 음식 때문이라 고 생각할 수 있다.", "source": "20261111_092347.jpg"}, {"kind": "paragraph", "text": "전달 양식\n 영향력을 설명하는 또 다른 차원은 전달 양식(modality)이다. 즉, 정보가 구두와 비구두 중 어떤 것으로 전달되는가에 대한 것이다. 전달방의 규범은 구두로 명확하게 의사소통되지만 비구는 관찰을 통해 규범을 추론하기도 한다. 예를 들어, 어떤 사람이 특정 브랜드의 제품은 뚜껑을 열려고 계속 씨름하는 모습을 보고 그 브랜드가 나쁘다고 학습할 수 있다. 또 다른 경우는 입소문 투입메이트가 법매기 브랜드에 대한 경험을 이야기하는 것을 우연히 듣고서 그 브랜드를 평가할 수 있다.\n 구전\n 마케터는 온라인과 오프라인에서 이메일 또는 일대일 구두 형태로 전달되는 구전(word of mouth)에 특별한 관심이 있다. 이웃이 헤어 스타일리스트를 추천할 수도 있고, 첫날 사람이 노드스트롬(Nordstrom)의 상반기 세일이 다음 주에 있다고 말하는 것을 우연히 들을 수도 있다. 만랩 친구가 페이스북에 긍정적인 의견을 올려서 제품을 떠올리게 하거나, 이메일로 보낸 동영상에서 실제로 영화 장면 전체 장면 몇 중 5분 동안의 구전은 소비자에게 영화 경험에 큰 영향을 준다. 또 톰 크루즈(Tom Cruise)의 탑 건: 매버릭(Top Gun: Maverick)은 영화관 개봉 첫 주에 매우 긍정적인 구전으로 전문가들은 이 영화가 흥행할 뿐만 아니라 톰 크루즈의 경력에서 큰 히트가 될 것이라고 보았다.103\n 사람이 구전을 하는 동기는 무엇일까? 구전하는 사람은, 이타적이거나 다른 사람에게 도움 이 되기 위해 구전에 참여한다고 가정할 수도 있지만, 연구에 따르면 구전 동기는 자기(예컨대 멋 내기 욕구)에 의해 생기는 경우가 더 많다.104 특히 자신의 구전이 다른 사람들보다 더 설문 되었다고 보이기 위해 구전 동기를 느끼는 경우도 많다. 자신이 한 평가에 대해 긍정적 느낌을 갖는다면 또한 다른 사 람들의 평가가 더 우호적일 수도 있다. 반면 단지 제품을 별로 좋아하지 않는다는 것을 공유함으로써 설득하기 구전을 하기도 한다. 개인 동기가 클수록 사람들은 특정 행위의 구전에 참여할 가 능성이 높다. 긴장 및 흥분과 같은 감성이 높은 경우는 사람들이 격련 제품을 구전할 가능성이 높다.105 무엇보다 많은 사람이 있어 사회적으로 민감된 상황도 정보 공유와 관련이 있다. 비판 제품에 대한 신뢰를 보내는 역할을 할 수 있다. 즉, 광고 및 판촉 활동을 통해 제품에 대한 단서를 제공하 는 역할을 할 수 있다.107\n 구전은 널리 퍼질 뿐만 아니라 설득력도 매우 높다.108 제품에 대해 나쁜 경험을 했지만 좋은 경험을 한 사람과 개인적인 대화를 나누는 경우 대화 후에 제품을 더 좋아하게 될 것이라 그 이유는 자신의 경험을 의험성 선진처럼 무시하는 경향이 있기 때문이다.109 영화 및 인쇄 도서 구매에도 큰 영향을 미친다. 미국 최대 도서 출판사인 랜덤 하우스(Random House)의 대변 인은 “디지털 시대에도 최고의 판매 도구는 구전입니다. 이것보다 더 좋은 것은 없습니다.”라 고 이야기한다.110", "source": "20261111_092353.jpg"}, {"kind": "heading", "text": "소셜 미디어 구전", "source": "20261111_092357.jpg"}, {"kind": "paragraph", "text": "소셜 미디어 구전\n 트위터, 유튜브, 핀터레스트, 인스타그램, 페이스북과 같은 소셜 미디어는 공개 메시지와 친구에게만 표시되는 메시지를 통해 구전을 퍼뜨리는데 일정이 진정한 사회적 구전이라고 할 수 있다(그림 11-11 참조). 다른 소비자는 원본 메시지 재게시, 자신의 댓글 달기, 반박, 비디오 응답, 공유의 방법으로 메시지를 이와 같은 메시지도 있다.¹¹¹ 이러한 사회적 교육을 전하는 구전은 일기이고 더 많은 소비자가 브랜드나 제품에 대한 대화에 참여하게 된다. 예를 들면, 제품이나 브랜드가 트위터에서 “유행이 되면 많은 사용자는 클릭하여 다른 사람들이 트윗하는 내용을 확인한다. 마찬가지로, 유튜브 동영상에 뜨거운 반응이 있으면 조회수가 급증해 유튜브 홈페이지에 표시되면 추가 노출로 인해 더 많은 조회 수가 발생한다. 소비자가 제품 구매와 소비 중에 소셜 미디어에 저장된 소비자의 기록을 제공하면 실제로 실시간 구전이 촉진된다. 최근 연구에르면, 소셜 미디어를 통해 TV 프로그램 콘텐츠를 공유하는 소비자는 간접으로 시청률이 높아지는 것으로 나타났다. 소셜 미디어를 통해 공유된 콘텐츠를 클릭하는 소비자는 프로그램의 신규 시청자가 될 가능성이 두 배 이상 높다.¹¹²\n 특정 온라인 콘텐츠의 언어가 설득력에 영향을 미칠 수 있다. 제품에 대한 암묵적 추천(implicit endorsement)(예: “좋아요”)은 명시적인 추천(explicit endorsement)(예: “추천합니다”)보다 영향력이 적다. 왜냐하면 설득 메시지가 숨겨졌을 때 소비자가 제품의 즐거움이 진정한지 의심할 것 같은 것처럼 보이기 때문이다. 이러한 효과는 소비자가 제품에 원하는 바가 많다는 사실을 인식하지 못하는 초보 소비자에게 더 크게 나타난다.¹¹³\n 미용, 의류를 든 대부분의 소비자 업계는 전통의 마케팅 광고에 의한 구전 추천, 휘욕과 비평과 함께, 소셜 미디어를 처리하고, 심지어 더 중시하고 있다. 사실 병원사는 추천, 온라인 포럼과 대화장에 소비자라는 것에 의해 소비자들에 의해 전문적인 이미지까지 하락할 것을 두려워하여 구전에 굴복하는 경우가 많다. 그리고 일부 산업(예: 엔터테인먼트)의 성공은 궁극적으로 긍정적 구전과 관련되어 있다. 이런 이유로 기업은 온라인과 소셜 미디어에서 자사 브랜드에 대한 언급을 일상적으로 모니터한다. 또한 마케터가 온라인에 정보를 게시하고 의견과 질문에 응답함으로써 적극적으로 토론을 촉진할 수 있다는 점이 중요하다. 특히 소셜 미디어에 초점을 맞춘다.\n 그러나 구전은 예기치 못한 의미를 가질 수 있다. 한 연구에 따르면 독창성에 대한 욕구가 높은 소비자는 개인적으로 선호되는 제품에 대해서는 구전을 하지만 자신이 소유하고 있는 데 공개적으로 소비되는 제품에 대해서는 긍정적 구전을 하고 싶어 하지 않는 것으로 나타났다. 왜 그럴까? 왜냐하면 긍정적 구전은 제품 판매로 이익을 가능성이 높고, 적어도 소비자의 눈에는 공개적으로 소비되는 제품의 고유성이 희석되기 때문이다.¹¹⁴", "source": "20261111_092357.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261111_092403.jpg"}, {"kind": "paragraph", "text": "구전과 관련된 마케팅 관리자에게 주는 다음과 같은 시사점들이 있다.\n 구전을 통한 정보의 급속한 확산 촉진하기 온라인은 오프라인과는 구전은 소비자의 제품 지각과 제공물의 시장 성과에 극적인 영향을 미칠 수 있다. 예를 들어, 제품 리뷰의 약 6%가 엄청나도록 특수하고 만족스러운 제품 구매와 사용을 한 덕분을 강소시키는 데 큰 도움을 주는, 비어럴 마케팅(viral marketing)은 브랜드/제품 정보를 온라인 상에서 지구상 어느 한 사람들 사이에 급속도로 퍼져나가게 하는 것이다. 예로, 메가폰을 들고 동네를 돌아다니며 대대적으로 소리를 지르는 것과 마찬가지로 마케팅 관리자는 온라인 구전을 장려하고 제품의 정보와 장면에 대해 소음(화제)를 일으켜야 한다. 그러나 긍정적 정보가 점차적으로 지구적으로 떠밀려 전 세계의 소비자를 움직이게 되게 만드는 한편, 궁극적으로 부정적 구전도 역시 퍼져 나가 부정적 효과를 발생할 수 있다는 점을 소비자와 관리자는 항상 조심해야 한다. 또한 기업의 소셜 미디어에 게시된 부정적인 의견에 대해 “삭제하거나 무시하는 것은 절대 해결책이 아니다. 조사 결과를 보면 ‘뚜렷이 나타난 부정적 정보에 대한 구전이 일어날 가능성이 높기 때문에 부정적 구전은 특별히 강력할 수 있다.”¹²³\n 호의적 구전 만들기 마케터들은 의견 선도자를 목표 청중으로 하고, 박람회, 컨벤션, 각종 행사 같은 네트워크 기회를 형성하여 긍정적 구전을 일으킬 수 있다. 이러한 이벤트 마케팅은 페이스북, 트위터 또는 인기 유튜브와 같은 소셜 미디어 사이트들을 통해 종종 소비지의 시장에 대한 대화를 촉진시킨다.¹¹⁹ 의견선도자들을 교육시키고 영향력을 행사하게 도움을 주는 이러한 활동은 상표에 대한 구전 커뮤니케이션을 좌우할 수 있다. 바람직한 구전을 만들어내기 위해 마케터는 광고, 홍보 캠페인, 대중 캠페인, 명사, 유명 인사 등 광고 모델 사용, 지원 브랜드 사이트에 미리 보기를 개발한다. 소비자의 브랜드 자신감 상승이 높으면 부정적 구전보다 긍정적 구전의 영향력이 크다. 결국 소비자는 겉으로 가지는 감정이 실제 지각과 촉정 모두와 상당 부분 연관촌에 재한한다고고, 기업 가능성이 생기는 브랜드에 대한 부정적 정보보다 외양에 더 많은 관심을 기울야다는 것이다.\n 온라인 구전은 고객의 삶을 촉진시키지 않는 제품에 관해서는 소비자가 무의 관심이며, 비판의 경향이 있다는 점을 유의해야 한다. 소셜 미디어 등 온라인 커뮤니케이션 수단의 발달은 소비자들이 욕구를 충족시키면 긍정적 구전은 자극될 가능성이 높다는 데에서 제품을 순위하고 이를 아름다움을 강화하는 새로운 수단을 실제적으로 제공하고 있다. 많은 구전 사이트는 블로그, 댓글, 티핑/조언 등 모든 형태의 구전을 통해 제품이나 브랜드의 소비를 자세하게 묘사할 수 있는 많은 정보를 제공한다.¹²²\n 고객이 구전 행동에 동참하는 것은 사실상 브르랜디 니 대한 자연의 근급이다. 기업에 대한 이해와 애정은 강력한 커뮤니티를 만들어낸다. 최신의 연구에 따르면 마케팅 활동 전반에 걸쳐 지속적 구전의 욕구는 소비자를 통해 형성된다. 예를 들어, 게토레이(Gatorade)의 무삭 브랜드 실행들을 통해 얻은 성과와 같은 수업에서 고객의 커뮤니티에 상징 있는 소셜 미디어에 업로드하면서, 코멘트에 대응하고, 그 밖의 마케팅 노력과 소셜 미디어 활동을 조율하는 역할을 수행한다. 이 기업은 전통적 광고와 소셜 미디어 전략을 결합하고 있다. 한 일환은 다음과 같이 포함한다. “예를 들어, 소셜 미디어에 소비자 대화를 자극하고 싶어 임의적으로 해시태그를 설정한다”¹²³ 페이스북에 게시물을 올리거나 트위터 토론에 참여하는 브랜드는 덴뉴닉의 “Big Beefy Bliss” 태그라인과 같은 시각적 표현 등 브랜드를 확산해 자신 반대를 사용함으로써 자사 게시물 공유 가능성을 높인다.¹²⁴\n 온라인 구전을 만드는 한 가지 방법은 무료 샘플을 제공하는 것이다. 무료 샘플은 소비자들이 제품을 시험해보고, 이를 친구와 가족으로 공유 하여 브랜드에 대한 인식이 제고되게 하는 도구가 된다. 전통적으로 기업은 제품 개발 과정에서 일정량의 제품을 제작하여 구전의 위협에 대비해 왔다.¹²⁵\n 부정적 구전 방지하고 대응하기 마케터들은 오프라인은 온라인에도 부정적 구전을 막고자 활동해야 한다. 또한 부정적 구전이 일어나면 이를 빈틈없이 모니터링해야 한다. 중대한 위기 상황이 발생하여 기업이 정쟁을 한 경우에는 초기 단계에서 정확하게 상황을 진단하고 통찰력 있게 문제점을 조치를 취해야 한다.¹¹; ¹²¹ 참조¹²⁶ 기업이 부정적 구전의 위협을 줄이기 위해 종종 취하는 조치는 고객을 적대적 행동으로 브랜드를 배반하는 브랜드 활동에 동참할 수 있도록 하는 것이다.\n 기업이 고객 불만과 비평적 의견을 무시한다는 불평에 공감하고, 정중한 사과를 제풀하면, 이와 같은 대응은 대개 부정적 구전을 긍정적 구전으로 전환하는 효과를 가져온다. 이때 기업은 고객에 대한 공감 능력을 가지고 있음을 보여주어야 한다. 기업은 불평을 한 고객에게 제공한 제품에 결함 있거나 고객이 기대했던 것과 다르게 작동하면서 나타난 문제에 대해 철저한 해결책을 제시해야 한다. 예를 들어, 소비자 불만 관리 전문 업체들은 기업의 위기가 발생할 경우 계획을 수립하고 있다. 이 수단에는 고객 지원 서비스 핫라인, 온라인 불만 접수 채널, 소셜 미디어 모니터링 등이 포함된다. 이러한 체계적인 접근 방법이 구전의 부정적 영향을 줄이는 데 효과적이다.¹²⁷\n 연구에 의하면 매장이나 온라인에서 불만을 접수한 고객에 대해 기업의 대응이 효과적으로 이루어진 경우에는 제품을 추천하는 경향이 강하다. 즉, 소셜 미디어는 어느 이슈에 대한 부정적 구전의 영향을 확대할 수도 있지만, 동시에 고객 불만을 해결할 경우에는 고객의 충성도를 높일 수 있다.\n 제품이나 브랜드에 대한 모든 유형의 고객 코멘트는 구전화 된다. 앞서 덧된 있는 사건으로는 미국 유명 할인점 타겟(Target)에서 아동용 수영복 광고에 등장한 어린 모델의 옷차림이 지나치게 선정성을 강조했다는 불만과 부모의 트윗이 구전된 일이 있었다. 또 다른 유명한 사건에서는 ‘남아용입니다’ (‘남아용’)으로 적지 못했다 아동용 완움 악보를 납작하게 만든다든지, 일본 한전자 표시에서만 설명을 제공할 수 있는 문방생이나 파란색을 사용하지 않았던 문제점이", "source": "20261111_092403.jpg"}, {"kind": "heading", "text": "소문, 가짜 뉴스, 스캔들 처리하기", "source": "20261111_092406.jpg"}, {"kind": "paragraph", "text": "소문과 가짜 뉴스는 독자나 사회적 영향력 사례이다.13) 예를 들어, 코로나19 팬데믹 초기에는 5G 휴대폰 기지국이 코로나19를 전파한다는 소문이 돌았다. 이러한 소문은 소셜 미디어를 통해 전파되어 실제로 몇몇 통신사가 제작한 기지국이 인묵으로부터 공격받고 파괴되는 데 영향을 끼쳤다. 이 이론을 퍼뜨린 사람들은 이러한 이야기가 언젠가 입증될 수 있다고 믿는다. 소문과 가짜 뉴스는 대개 정치적인 연결성을 갖고 있기 때문에 소비자들이 진실이 무엇인지 식별하기란 어렵다.\n 소문과 가짜 뉴스는 미국 소비자를 불안하게 만든다.14) 어떤 소비자는 일자리, 의료 제공, 그리고 자녀의 미래의 삶에 대해 매우 걱정하고 있다고 말한다. 또한 일부는 ‘가짜 뉴스’의 시대에 자신이 어떻게 정도 무엇을 믿을 수 있을지 고민하고 있다고 하소연한다.\n 소비자는 기업이 브랜드 가치와 브랜드 명성에 대해 인식하고 더 많은 책임을 질 것이라고 말한다.15) 기업은 소비자가 오프라인, 온라인 쇼핑 중 자신의 자사 브랜드에 대해서 어떠한 내용을 인지하고 소문, 가짜 뉴스, 스캔들에 대처할 준비를 해야 한다.\n 기업은 소문, 가짜 뉴스, 스캔들에 어떻게 반응해야 할까?\n 무대응 전략: 기업이 무대응 전략을 선호하는 경우가 흔하다. 왜냐하면 섣불리 마케팅 소문, 가짜 뉴스, 스캔들을 부정하는 시도를 하는 과정에서 더 많은 소비자가 정말 어떤 내용인지 확인하지 않는다. 그러다 소문을 어떻게든 대응하고자 하면 기다렸다는 듯이 이 정보는 갑자기 퍼져나가기 시작한다.\n 일부 기업은 첫 번째 소문이나 가짜 뉴스에 대응하기 어렵다고 판단해서 ‘문제가 생긴 뒤에 차차 설명하자’ 전략을 취하기도 한다.", "source": "20261111_092406.jpg"}, {"kind": "heading", "text": "11-4 영향력 정도", "source": "20261111_092412.jpg"}, {"kind": "paragraph", "text": "11-4 영향력 정도\n 마케팅과 비마케팅 원천들이 소비자 의사 결정에 미치는 규범적 또는 정보적 영향력의 정도는 그림 11-1의 오른쪽에 나오는 여러 요인에 따라 달라진다. 이러한 요인에는 (a) 정보 원천과 관련된 요인, (b) 수신자와 관련된 요인, (c) 정보 원천과 수신자 간의 관계와 관련된 요인이 모두가 관련된 요인들이 있다.\n 11-4a 정보 원천 관련\n 신뢰성을 높이기 위해 비마케팅 정보 원천을 활용하라\n 마케팅 원천과 비마케팅 원천은 신뢰성이 다르다. 소비자는 마케팅 원천을 통해 전달된 정보를 덜 신뢰하고 더 편향되고, 조작적이라고 지각하는 경향이 있다. 대표적으로, 비마케팅 원천은 구매, 소비, 처분 결정의 개인적 이해관계가 없다고 믿기 때문에 더 신뢰한다. 각종 영역 사업에 주는 정보부터 자동차에 관한 견주기 리포트(Consumer Reports)까지가 높은 신뢰성이 높다. 비마케팅 원천은 신뢰성과 공정성이 매우 높기 때문에 마케팅 원천보다 소비자 정보처리와 태도 형성에 대해 더 큰 영향을 미친다. 따라서 마케터는 가능한 한 비마케팅 원천을 통해 마케팅 메시지를 전달해야 한다.\n 신뢰할 수 있는 원천은 전문성을 갖춘 여론이 있어 영향력이 커지는 경우가 많다. 전문성 관련 정보는 원천이의 진단인 전문가일 때, 특히 소비자의 정보와 경험이 부족하거나 제품 정보를 얻고 해석하는 과정이 어려울 때일수록 더 큰 영향을 끼칠 수 있다. 예를 들어, 첫 주택 구매자는 주택 구입 과정", "source": "20261111_092412.jpg"}, {"kind": "heading", "text": "마케터와 비마케터 원천을 활용하라 / 소비자의 목소리를 듣기 위해 소셜 미디어를 활용하라", "source": "20261111_092415.jpg"}, {"kind": "paragraph", "text": "에 대한 지식과 자신감이 부족하기 때문에 부동산 중개인과 같은 전문가가 전달하는 정보를 깊게 고려할 것이다.", "source": "20261111_092415.jpg"}, {"kind": "paragraph", "text": "외적 전문성과 친밀성은 정보 원천력에 영향을 미치기 때문에 마케팅 관리자는 특정 제품 범주의 전문가나 신뢰할 수 있는 원천을 사용한다. 예를 들면, 소비자가 유명한 지인이 추천하는 와인보다 그와 동일한 소믈리에가 추천하는 와인을 구매할 확률이 더 높을 수 있다.\n 전문가는 정보 및 규범적 영향력에 있어서 신뢰할 수 있다. 유명인은 후원 활동에서 여러 개의 제품을 보증하며 추천할 수 있지만, 자신이 실제로 사용하는 제품이나 브랜드이고 자신의 지역에 밀접한 관련이 있는 제품을 추천할 때 가장 큰 영향을 발휘한다. 예를 들면, LA 레이커스의 스타 르브론 제임스(LeBron James)는 스포츠 장비 분야의 인식 선도자이자\n 이 이야기가 제품을 추천하는 광고 모델 대가로 돈을 지불하는 이유이다.137 언더아머는 스테픈 커리(Steph Curry)를 광고 모델로 사용하는데 그는 언더아머 홈페이지에 있는 제품을 소유하고 있다.138 정보 원천인 전문가일 때 규범적 영향력이 더 커지는 경향이 있다.139\n 일부 잡지와 신문 광고는 만나 있지 않은 사전처럼 보이기 때문에 어떤 신문 기사에는 광고주의 이름이 언급된다. 어떤 소비자들은 신문이나 책에 나오는 정보가 마케팅 원천에서 나오는 것인지 비마케팅 원천에서 나오는 것인지 정확하게 판단하기 힘들다. 그리고 소셜 미디어에서의 유료 추천과 무료 추천을 구별하는 것이 어려울 수 있다. 팔로워 수가 많은 트위터 사용자는 브랜드가 마음에 들어서 돈을 받지 않았어도 브랜드에 대해 트윗할 수 있다. 미국 연방거래위원회(Federal Trade Commission)는 소셜 미디어의 입소문 마케팅에서 주요 소셜 인플루언서가 제품을 후원한 브랜드와 맺고 있는 관계를 공개할 것을 요구한다. 이러한 새로운 지침은 브랜드의 제품을 지지할 때 브랜드와의 인물적 결합은 드러나야 한다.140 또한 마케터는 온라인에서 소비자의 일반적인 생활 경험이나 관심사(예: 요리, 예술, 스포츠)를 중심으로 구성된 가상 커뮤니티와 연결하여 목표 집단과 접촉할 수 있다. 예를 들면, 어떤 18명의 사람들이 동일한 페이스북 그룹을 사용하고 있고, 이러한 그 룹을 사용하는 사람들의 절반 이상이 5개 이상의 그룹에 참여한다.141\n 메인스트림뿐만 아니라 비마케팅 영향력 원천은 신뢰성이 높기 때문에 소비자 구매 결정에 강력한 영향을 미친다.\n 마케터와 비마케터 원천을 활용하라", "source": "20261111_092415.jpg"}, {"kind": "paragraph", "text": "많은 기업이 마케팅 원천(예: 광고, 후원)과 비마케팅 원천(예: 고객 리뷰, 블로그)의 결합을 통해 혜택을 받고 있다. 어떤 기업은 기존 고객이 다른 사람을 추천할 때 할인이나 상품으로 보상한다. 마케터 원천(판매 촉진 요소)으로 유도하여 비마케팅 원천(현재 고객)의 신뢰도를 추가함으로써 추천을 촉진하는 것이다.142\n 소비자의 목소리를 듣기 위해 소셜 미디어를 활용하라", "source": "20261111_092415.jpg"}, {"kind": "paragraph", "text": "마케팅 관리자는 제품에 관해서 소셜 미디어 댓글을 볼 수 있다. 예를 들어, 소셜 미디어 콘텐츠를 통해 상품과 계약의 긍정적인지 부정적인지 알 수 있다. 기존 제품이 충족시키지 못하는 요구나 욕구를 알 수 있다. 또한 소셜 미디어를 통해 잠재적 추세와 새로운 문제를 파악할 수 있다. 마지막으로 소셜 미디어를 사용하여 온라인 인플루언서를 찾을 수 있다. 댓글 수, 공유 수, 기업 웹사이트 체류 시간, 회사의 방문 횟수 등과 같이 다양한 소셜 미디", "source": "20261111_092415.jpg"}, {"kind": "paragraph", "text": "이 측정 방법이 있다.\n 매력적인 원천을 활용하라 특정 또래 집단의 매력은 소비자가 그 집단에 순응하는 정도에 영향을 미칠 수 있다. 구성원들이 어떤 집단이 매우 매력적이라고 지각하면, 비록 소비 행동이 불법적이라 할지라도 그 집단이 행하는 것을 따르려는 강한 의도를 갖게 된다. 따라서 미국 어린이와 청소년들이 약물과 같은 불법 활동에 동조하지 않게 하기 위해 약물 남용자를 매력적으로 보이지 않게 만드는 것이 필요하다.\n 11-4b 수신자 관련\n 원천과의 동일시 정도 사회적 영향력 정도에 영향을 미치는 또 다른 요소는 수신자가 정보 원천과 동일시하는 정도이다. 원천이 마케터인 경우 수신자가 브랜드에 대한 애착이 강력한 신제품 구매 경우에 마케터가 큰 영향을 미칠 수 있다. 원천이 의견 선도자, 인플루언서, 마케팅 메이븐, 준거집단 구성원과 같은 마케터일 경우 사회적 영향력 정도는 소비자가 정보 원천에 동일시하는 정도에 따라 달라진다. 한 연구에 따르면 스포츠 이벤트에 참여하는 소비자가 집단 중심 브랜드에 둔감해지기보다는 오히려 팬 관련 재화 구매를 점차적으로 생각하면 스포츠에 재화 구매할 가능성이 높아지는 것으로 나타났다. 이념, 특정 집단(인종 집단 또는 종교적 정체성 등)에 대한 소비자 동일시의 수준을 명확히 동일시에 적합하게 만든 마케팅 자극은 긍정적 반응을 불러 일으킬 수 있다. 대부분의 경우 정보 원천과 관련된 동일시의 수준은 여러 차원에서 관여된다. 구매와 관련한 영향력은 소비자가 집단에 대한 동일의 수준에 따라 달라진다. 가족이나 허위광고와 같은 집단 구성원의 해당 집단 태도, 행동, 가치에 동일시하지 않으면 규범적 준거집단의 영향력은 약화 것이다.\n 원천의 지각된 유사성 아마존닷컴에 로그인하여 마음에 드는 책을 찾으면 추천 시스템은 해당 책을 구입한 소비자의 구매를 기반으로 좋아할 만한 다른 책들을 알려 준다. 비슷한 취향을 가진 사람들의 구매한 책을 사고 싶다는 소비자의 심리 원리를 활용한 것이다. 넷플릭스의 영화 추천 시스템도 마찬가지다. 일부 연구에 따르면 서비스 제공자가 고객에 맞추는 태도를 가지고 있음을 지각가 고객의 역할을 명확히 해 주면 소비자는 서비스 제공자가 요구하는 행동에 더 충족된 결과에 더 만족하는 것으로 나타났다. 또한 소셜 미디어 구조 확산은 온라인 네트워크를 사이의 사회 인구통계적 유사성 정도와 상당히 관련이 있는 반면, 마케팅 비기술 혁신인 소비자들 사이의 상호작용 영향력이 더 클 것이다. 특히, 브랜드에 대한 전자 구전(eWOM)은 해당 브랜드에 관해 공정적인 관련이 있는데, 사용자가 소셜 미디어 플랫폼을 통해 제품 리뷰를 공유한 사람들과 얼마 나 유사한지 확인할 수 있을 때 구전 효과가 더 커진다.", "source": "20261111_092422.jpg"}, {"kind": "heading", "text": "11-4c 수신자와 원천의 관계 관련", "source": "20261111_092425.jpg"}, {"kind": "paragraph", "text": "구성원 간 접촉이 많은 집단을 타깃팅하라\n 소비자는 여러 정보 원천(그림 11-1 참조들)과 자주 또는 제한적으로 접촉할 수 있다. 예를 들어, 얼마나 웹사이트에서 커뮤니케이션 기본 설정을 어떻게 설정했느냐에 따라 특정 정보 원천으로부터 정보, 정보 열람 수 있다. 친한 친구나 가족과 같은 원천과는 직접적이 접촉이 원활한 접촉을 하지만 정치인이나 판매 관리자의 같은 원천과는 접촉이 적을 수 있다. 일반적으로 접촉이 많은 구성원 집단은 영향력이 큰 경향이 있다. 광고에서는 이러한 접촉의 정도를 빈도(frequency)라고 하는데 광고 효과를 측정하는 지표로 잘 알려져 있다. 즉, 광고를 접촉하는 횟수가 많으면 미치는 영향이 커진다. 페이스북에서 특정 브랜드에 ‘좋아요’를 많이 클릭하는 친구가 친구의 구매 행동에 영향을 미치지 않으면 친구가 단순히 좋아한다고 버튼을 무의식적으로 누른 것인지 아니면 진심으로 해당 브랜드를 좋아하는지 여부에 따라 달라질지라도, 향후에 상대 소비자 행동에 영향을 미칠 가능성이 높다. 밀도가 높은 집단은 집단 구성원 모두가 새로운 알고리즘(밀도는 접촉 정도와 관련된) 소셜 미디어에서 흥미롭다고 알고리즘을 판단한다. 밀도가 높은 네트워크는 친구가 ‘누른 좋아요’의 진정한 의미를 정확히 이해할 가능성이 높다.151\n 밀도가 높은 네트워크를 타깃팅하라\n 마케터가 인적 네트워크를 타깃팅하는 것이 합리적인 경우도 있다. 예를 들어, 무선전화 사업자 버라이즌(Verizon Wireless)은 가족끼리 공유할 수 있는 월간 휴대전화 통화 시간과 데이터 용량을 판매한다. 마케터가 소비자에게 “친구에게 우리에 대해 말해 주세요.”라고 요청하면 많은 성과를 도출할 수 있다. 예를 들면, 티모바일(T-Mobile)은 우량 고객이 친구들에게 자사 서비스를 추천하여 가입하면 추천한 고객에게 50달러 보상을 제공했다. 한 연구에 따르면 어떤 유형의 고객이 다른 유형의 고객보다 구전 도입을 선도하는지, 소셜 네트워크에서 사용한 활동 수준에 영향을 미치는 것으로 나타났다. 따라서 마케터가 네트워크의 타깃팅 계획을 세울 때 소셜 미디어 사용자의 상호작용을 연구할 필요가 있다.152 마케터는 밀도가 큰 네트워크를 타깃팅할 때 혜택을 얻는다. 예를 들어, 함께 일하는 사람들로 구성된 집단의 네트워크는 밀도가 높다. 대조적으로, 큰 대학의 교수 네트워크는 구성원이름 좋지, 공통의 사회 네트워크가 적다. 서로의 영향을 미칠 수 있는 기회가 적기 때문에 밀도가 낮다. 네트워크 밀도가 높은 동료로 구성된 집단 내 개인이 상호 작용할 수 있는 기회가 더 많기 때문에 사회적 정보의 전파가 빠를 수 있다. 네트워크의 밀도가 커진다(그림 11-1 참조). 연구에 따르면 소셜 미디어에서 공통의 활동 영역 있을 때 정보를 공유할 가능성이 높다.153 물론, 국가에서 네트워크 밀도는 지역에 따라 다르다. 농촌에서는 가족들이 여러 세대에 걸쳐 알아 왔기 때문에 네트워크 밀도가 높을 수 있지만, 서울의 전반 주민 중 상당수는 서로 알지 못했을 뿐더러 네트워크 밀도가 낮다. 연구에 따르면 밀도가 높은 네트워크는 소비자의 기능적 제품 선택에 특별한 영향을 미치는 것으로 나타났다.154\n 유대 강도를 고려하라\n 영향력의 정도에 영향을 미치는 또 다른 요인은 노인들 간의 유대 강도이다.155", "source": "20261111_092425.jpg"}, {"kind": "paragraph", "text": "발견적 정보는 앤의 세 명의 학교 친구인 케쉬, 경, 마리아와 강한 유대 관계를 가지고 있는 것을 나타낸다. 회색 점선은 앤이 헬스클럽에서 알게 된 친구들과 약한 유대 관계를 가지고 있음을 나타낸다. 또 다른 회색 점선은 마리아가 안 사촌인 타이론과 밀접한 관계를 가지고 있어 앤이 원하는 유대 구조는 무엇의 정도의 영향을 미치는 영향이 강하다는 연구가 영향을 미친다고 한다. 그러나 연구들은 유대 관계는 사람들 사이에서 주고받는 정보량에 커져다는 사실을 발견했다. 왜 그렇게 강한 유대 관계는 정보를 연결하는 강한 힘과 네익서는 약한 유대 관계를 통해 전달된다. 강한 유대 관계를 가진 우대 마케팅은 메시지를 사용하는 마케팅 분야에서 향유한 네트워크를 실행할 수 있다. 예를 들어, 에이브앤암과 같은 자선단체는 개별 소비자들 판매(또는 기금 모금) 대리인으로 타인처럼 다면 관계 네트워크를 통해 다른 사람들에게 다가간다.\n 강한 유대는 두 사람이 빈번한 대인 접촉을 통해 가족과 친밀한 관계로 연결되어 있는 것을 의미한다. 약한 유대는 제한된 대인 접촉으로 덜 관계를 맺고 있음을 의미한다. 그림 11-13은 이러한 유대 강도를 설명하고 있다. 소비자는 가까운 관계를 맺고 있는 사람들로부터 또는 정보를 믿는 경향이 있는데, 가치관과 선호하는 것이 비슷해서 그들의 의견을 신뢰할 수 있는 것이 이유 중의 하나이다.156 유대 강도(tie strength)는 규범적 영향력 정도에도 영향을 미친다. 유대 관계가 강할수록 다른 사람과의 관계를 유지하려고 할 것이다. 정교한 방법에 비해 따르려는 동기를 갖게 된다. 또한 유대 강도는 반사회가 구성은 한 때 수신자의 브랜드 구매 의도에 영향을 미친다.\n 11-4d 도구 관련\n 도달 범위가 넓은 도구 마케터가 대규모 영향력을 행사하려면 도달 범위가 넓은 도구를 사용해야 한다. FIFA 월드컵 기간 동안 30초짜리 TV 광고는 미국, 유럽 및 전 세계에서 수천만 명의 시청자에게 도달할 수 있다. 1억 2,000만 명 이상의 사람들이 2022년 슈퍼볼을 시청했다. 이것이 바로 광고주가 30초 광고에 650만 달러를 지불하는 이유이다.158 또한 많은 군중을 끌어들이는 이벤트를 통해서도 도달력을 높일 수 있다. 이러한 이유 때문에 텍사스의 AT&T 스타디움, 독일 뮌헨의 뱅크 오브 아메리카 스타디움, 멕베렌드의 제임스 원 등 스폰서들이 막대한 금액의 자금 지원을 통해 자사 이름을 넣었다. 이러한 경기장에서 게임이 열릴 때면 시청자는 자연스럽게 기업 브랜드명을 접하게 된다. 토요일과 국가휴일 같은 휴식날은 2022년 올림픽과 같은 대규모 스포", "source": "20261111_092432.jpg"}, {"kind": "paragraph", "text": "즈 이벤트를 후원하기도 한다. 인터넷, 휴대폰 등의 기술은 마케팅 메시지, 제품 뉴스, 유명인 근황 정보, TV 프로그램을 많은 청중에게 전파하여 마케터의 도달 범위를 크게 넓히고 있다.\n 쌍방향 커뮤니케이션 도구 정보를 개인적으로 전달하는 영향력 원천은 쌍방향 정보 흐름이 가능하므로 영향력이 강력하다. 예를 들어, 자동차 판매원은 구매자의 정보 요구에 맞게 판매 정보를 맞추&hellip;조하며, 반론을 반박하며, 중요하거나 복잡한 정보를 반복하고, 구매자의 질문에 답변할 수 있기 때문에 자동차 광고보다 큰 영향을 미친다. 개인적인 대화는 대중매체를 통해 전달되는 정보보다 설득력이 높다. 먼저 자신의 가족과 친지에게 보내는 정보는 필터링과 개인차로 인해 대량적으로 전달되는 정보보다 더 신뢰성 있게 보인다. 사람들은 대화 중에 무슨 말을 하며 왜 그렇게 행동하는지 관찰할 수 있기 때문에, 강요당하고 있다고 느낄 때는 그러한 정보를 피할 가능성도 적다. 또한 개인적 원천을 통해 얻은 정보는 대중매체에서 얻은 정보보다 더 생생하게 보일 수 있다. 외부인을 말하는 사람의 정보를 더 실제감 있게 표현하여 설득력이 크게 때문이다.", "source": "20261111_092437.jpg"}], "notes": [{"source": "20261111_092123.jpg", "text": "11장 소비자 행동에 영향을 미치는 사회적 요인 12장 소비자 다양성 13장 가족과 사회계층의 영향 14장 사이코그래픽스: 가치, 개성, 라이프스타일"}, {"source": "20261111_092217.jpg", "text": "CONSUMER BEHAVIOR 11장\n 소비자 행동에 영향을 미치는 사회적 요인\n 학습목표 1. 소비자 행동에 영향을 주는 다양한 영향력 원천과 각 원천의 중요성을 설명한다.\n2. 마케팅에 활용할 수 있는 다양한 영향력 도구를 파악한다.\n3. 소비자에게 영향을 주는 다양한 형태의 사회적 영향력을 기술한다.\n4. 조건적인 영향력 정도에 영향을 주는 요인을 파악한다.\n 사회적 영향력 개인, 집단, 대중매체에 의해 명시적, 묵시적으로 제시되어 개인이 행동하는 방식에 영향을 주는 정보."}, {"source": "20261111_092222.jpg", "text": "영향력 원천 - 마케터 또는 비마케터 - 명면, 소속, 비소속 준거집단\n 영향력 도구 - 온라인, 오프라인 - 일대일, 일대다\n 영향력 유형 - 규범적, 정보적 - 긍정, 부정 - 언어적 구전, 관철\n 영향력 정도 - 원천 특성 - 수신자 특성 - 원천과 수신 관계 - 도구 특성\n 그림 11-1 11장 개관: 사회적 영향력 이 장에서는 소비자에게 영향을 미치는 원천, 영향력 도구, 영향력 유형, 영향력 강세에 사요되는 도구, 영향력이 강력한 정도를 설명한다.\n 마케팅 원천 광고, 인적 판매와 같은 마케팅 영향력 원천.\n 비마케팅 원천 미디어, 유명인, 가족, 동료 등과 같은 마케터가 통제할 수 없는 영향력 원천."}, {"source": "20261111_092229.jpg", "text": "의견 선도자 대중매체, 개인, 집단의 의견과 행동 사이에서 정보 중개자 역할을 하는 사람.\n 인플루언서 특정 제품을 촉진하기 위해(때로는 온라인, 자신의 팔로어를 위한 추천 포함) 미디어를 사용하는 개인."}, {"source": "20261111_092233.jpg", "text": "11장 소비자 행동에 영향을 미치는 사회적 요인\n 그림 11-2 세계적인 소셜 미디어 인플루언서 상위 50위\n BOOMERS GEN X MILLENNIALS GEN Z\n Twitter YouTube Facebook Instagram TikTok\n Musicians account for half of the top 50 social media influencers.\n The Kardashians and Jenners have grown their dynasty to celebrity, beauty, and socialmedia powerhouses.\n Charli D'Amelio's popular dance videos made her TikTok's largest star and the youngest top social media influencer.\n Overall followers\n VISUAL CAPITALIST\n /visualcapitalist @visualcap @visualcap visualcapitalist.com"}, {"source": "20261111_092240.jpg", "text": "마켓 메이븐은 사람들이 판매자에 대한 정보를 얻기 위해 의존하는 소비자."}, {"source": "20261111_092244.jpg", "text": "11장 소비자 행동에 영향을 미치는 사회적 요인\n 2018년 9월 기준 미국 인터넷 사용자들이 상품평에서 가장 유용하다고 생각하는 정보\n 제품 성능\n 구매자 만족\n 시간경과 후 품질\n 제품 품질\n 설명 정확도\n 구체적 질문\n 가치\n 사용에 대한 조언\n 기대 효과\n 구매 이유\n 기타\n (미국, 2018년 8월 23일~9월 3일, 응답자 2,020명, 18세 이상, 인터넷 사용자)\n 그림 11-3 소비자는 제품 리뷰를 통해 다양한 유형의 정보를 얻는데 정보마다 유용성이 다르다고 생각한다."}, {"source": "20261111_092252.jpg", "text": "영향 준거집단 광고와 준거집단 신뢰 준거집단 어떤 소속 집단의 한 구성원이 되는 것을 매우 바람직하게 생각하여 자발적으로 심리 적 동조를 하게 만드는 준거집단으로 준거집단의 영향이 매우 크게 작용된다. 소속 준거집단 현재 소속된 집단 브랜드 커뮤니티 일정한 상표를 이용하는 사람들 사이에 관계망이 형성되면서 생겨나는 집단으로서 상표에 대한 기술이나 가치관을 공유하는 것은 아니다. 회피 준거집단 분리되고 싶어 하고 싶지 않은 집단"}, {"source": "20261111_092256.jpg", "text": "미국 인플루언서 마케팅 지출 2016-2023 (단위: 10억 달러, %)\n * 소셜 미디어와 사용자가 생성한 콘텐츠 플랫폼에서 제품과 서비스를 촉진하기 위해 인플루언서나 대리인에게 지급된 비용임. 유료 제품 리뷰와 여행 관련 비일상적 제품은 제외, 유료 영화 제외.\n 의견 선도자와 인플루언서를 마케팅 커뮤니케이션에 활용하라 마케터가 통제할 수 있는 마케팅 활동을 통해 의견 선도자가 영향을 미치며 비비례할 수 있는 잠재력을 가진다는 점에서 의견 선도자에 주목해야 한다. 이들을 통해 보다 효율적으로 목표시장에 도달할 수 있다. 예를 들어, 블루문 제임스는 나이키 공장에서 등장하는 한 어린이의 비디오를 통해 화제가 되었다. 이 비디오는 벤자민드릭(Beats by Dre), 아디다스, 나이키 등 여러 브랜드와 연관된 음악과 함께 확산되며 큰 영향을 미쳤다. 마케터는 이와 같은 의견 리더, 인플루언서 및 그들이 자주 이용하는 플랫폼을 파악하여 자사의 제품을 소개하는 전략을 전개해야 한다.\n 의견 선도자와 인플루언서를 소비자에게 소개하라 마케팅 커뮤니케이션은 의견 선도자에게 잠재적 정보를 안내할 수 있다. 예를 들어, 제약 회사는 고혈압 특정 약품이 어떤 도움이 되"}, {"source": "20261111_092303.jpg", "text": "그림 11-5 준거집단이 공개적 및 개인적 소비 제품의 마케팅에 미치는 영향\n 준거 집단은 제품이 사치품인 (필수품은 아니다) 경우에 제품의 구매 여부에 미치는 경향이 있다. 그리고 준거 집단은 제품이 공개적으로 소비될 때만 (비공개적으로 소비될 때는 아닐 때) 어떤 브랜드 선택에 영향을 미치는 경향이 있다. 매트리스의 네 가지 상황에 맞는 예를 제시해 보기 바란다.\n 개인적 소비\n 필수품 준거집단의 브랜드 구매 영향력 낮음\n 사치품 준거집단의 브랜드 구매 영향력 높음\n 공개적 소비\n 필수품 준거집단의 제품 구매 영향력 낮음\n 사치품 준거집단의 제품 구매 영향력 높음"}, {"source": "20261111_092307.jpg", "text": "브랜드 커뮤니티가 발전하도록 도와라\n 현재 많은 브랜드가 페이스북이나 전용 웹사이트에 브랜드 커뮤니티를 만들었다. 이러한 브랜드 커뮤니티는 같은 생각을 가진 소비자들만 모은 브랜드 공동체로 성립된다. 브랜드 커뮤니티는 브랜드와 제품에 대한 긍정적인 태도를 증진하고, 브랜드에 대한 정보를 전달한다. 예를 들어, 보스턴 레드삭스 야구팀은 500만 개가 넘는 좋아요를 받은 페이스북 페이지와 키드 네이션(Kid Nation)과 레드삭스 네이션(Red Sox Nation)이라는 브랜드 커뮤니티가 있는 웹사이트를 운영하고 있다. 야구 시즌 전, 도중, 이후에 전 세계적으로 수천 명의 레드삭스 팬이 브랜드 커뮤니티에서 서로의 기쁨과 좌절을 즐긴다.\n 화제 집단 활용을 피하라\n 기업은 마케팅에서 화제 집단을 사용해서는 안 된다. 법적 지침자는 회사 지시 없이 제품을 사용하는 명확한 오피니언 리더인 화제 집단에 속하기 때문에 그 관계를 공개해야 한다. 경우에, 2005년 유명한 사이클 선수인 랜스 암스트롱(Lance Armstrong)은 선수를 활동하는 동안 경기를 항상 암을 모음했다는 사실이 알려진 나이키와 트렉 바이시(Trek Bicycle) 등 여러 브랜드의 대규모 후원 계약이 끊겼다."}, {"source": "20261111_092314.jpg", "text": "그림 11-6 마케터와 비마케터 모두 영향력 도구로 페이스북과틱톡과 같은 소셜 미디어 네트워크를 점점 더 많이 사용하고 있다.\n Source: Based on Jasmine Enberg, “US Video Influencer Marketing 2022,” eMarketer Insider Intelligence, March 8, 2022.\n 2022년 플랫폼별 미국 소셜 네트워크 사용자 수 단위: 백만 명 왼쪽에서 오른쪽: 페이스북, 인스타그램, 스냅챗, 틱톡, 트위터, 핀터레스트, 링크트인, 레딧, 텀블러, 트위치\n 주: 한 번 이상 한 소셜 네트워크를 사용하는 전 연령대의 인터넷 사용자 *모바일 기기 사용자 **로그인 사용자"}, {"source": "20261111_092318.jpg", "text": "규범 어떤 것이 적절한 행동인가에 대한 집단적 결정."}, {"source": "20261111_092324.jpg", "text": "브랜드 선택 일치성 집단 구성원이 구입한 브랜드를 구입하는 것\n 동조성 집단의 규범에서 기대하는 행동을 따르는 경향\n 그림 11-7 ▶ 브랜드 선택 일치성은 집단 내 다른 구성원이 구매한 제품을 구매할 때 나타나는 현상이다."}, {"source": "20261111_092328.jpg", "text": "그림 11-8 ▷ 사람들은 자신이 집단이 기대하는 행동에 동조하지 않으면 다른 사람들이 자신을 어떻게 생각할 것인지 걱정하는 경우가 많다.\n 순응 집단이나 사회적 영향력에 맞추어 요청대로 다른 행동하\n 저항 개인이나 집단이 요구대로 행동하기보다는 반대로 행동하는 것\n 마케팅 시사점 마케터는 규범적 영향력에 기초해서 다양한 조치와 행동을 할 수 있다.\n 제품 사용 여부에 의한 보상과 제재 마케터는 제품을 사용하느냐 하지 않느냐에 따라 사회적 보상이나 제재가 주어진다는 광고를 통해 규범적 영향력을 활용할 수 있다. 예를 들어, 맥주나 주류 광고에서는 긍정되는 브랜드를 마시는 것을 친구들이 긍정적으로 평가하도록 묘사하기도 한다. 마케터는 회원들만이 조직으로부터 특정한 사회적 보상을 받는 커뮤니티에 특정 브랜드를 사용하지 않은 소비자는 다른 사람들이 좋지 않게 평가하는 장면이 나오기도 한다.\n 집단행동 규범 만들기 마케터는 조직은 소비자 행동 지침 역할을 하는 규범이 있는 집단을 만들 수 있다. 소비가 공개적일 때 규범적 영향력이 더 커지기 때문에 이러한 커뮤니티의 오프라인 모임이나 온라인 활동이 관련된 행동을 공개적으로 함으로써 규범적 영향력이 발생할 수 있다. 예를 들어, 듀올링고(Duolingo) 앱은 서로 다른 언어를 사용하는 사용자가 같은 그룹에 있는 다른 사람들에게 자신의 성과를 공유하게 한다. 핏빗(Fitbit) 사용자들은 운동 데이터를 다른 사람들과 공유한다.\n 동조 압력 만들기 또한 마케터는 동조성을 만드는 시도를 할 수 있다. 예를 들어, 자사 브랜드가 집단 구성원 사이에 보급되도록 하기 위해 브랜드의 특정 친한을 만들 수 있다. 그러면 집단에 참여한 피드백 있는 10대가 등장하는 것처럼 특정 브랜드나 제품과 관련된 행동을 하는 광고 캠페인을 보여 줌으로써 다른 사람들의 동조성을 이끌어내는 시도를 할 수 있을 것이다. 또한 다른 사람들의 동조성은 새로운 동조성을 만들 수 있다. 자선 단체는 학교 자금 모금과 자선"}, {"source": "20261111_092334.jpg", "text": "상품 구매 권유 전화(cold call)를 하는 판매원은 잠채 고객에게 전화하여 1분만 시간을 내 달라고 요청하고 한다. 소비자는 이런 작은 요청을 거절하는 것은 어리석게 보일 수 있다고 생각해서 판매원의 요청에 손응하고 시간을 할애한다.\n 자신의 행동을 예측하도록 요청하기 소비자에게 특정 행동을 할 것인지에 대해 자신의 행동을 예측하게 달라고 요청하는 것이다. 소비자가 실제로 그 행동을 하길 의도한 보인라지도, 이들은 대부분 자신이 행동할 것이라고 하게 된다. 기대로는 소비자에게 재활용된 재료로 만들어진 제품을 구매하자고 요청하고 환경보전에 동참하는 상황을 상상해 보도록 하였다.68 소비자는 이러한 요청을 통해 자신의 행동을 예측하게 하고 그들이 도와 주겠다고 밝히게 되었고 이후 매장에서 실제로 재활용 제품을 구매했다. 판매원은 소비자에 동화와 같은 마수로 인해 머리에 심어 둔 재활용 제품을 향해 나아가도록 할 수 있다.69 소비자가 이와 같은 손응을 통해 소비자에게 제품에 대한 메시지를 던져 놓아야 한다.\n마케터는 사용자 손응을 높이기 위해 손응 기법을 제공할 수 있지만 이러한 전략들은 소비자가 방어벽을 갖도록 하고 이러한 행동을 하지 못했을 때 손응을 깨뜨고 자신이 수행한 행동을 실현시킬 수 있도록 유도해야 한다.\n 선택의 자유 주기 보통 사람은 자유가 침해되고 있다고 느낄 때 나타나기 때문에 마케터는 소비자가 선택의 자유가 있다는 믿게 될 필요가 있다. 예를 들어, 홈 쇼핑에서 다양한 스마트폰을 동시에 제시하여 각각에 대해 좀 더 자세히 설명한다. 소비자는 판매원이 소비자를 속이려고 행동한 것이 아니라 다양한 상품에 주목하고 있다고 생각한다. 이런 상황에서 소비자는 자신이 구매하려는 스마트폰을 선택할 것인지에 대한 통제력을 가지고 있다고 느낀다. 마케터는 제품군의 내에서 소비자에게 다양한 기능을 항한 제품을 제시하여 소비자가 자신의 욕구와 우선순위에 따라 구매하도록 할 수 있다.\n 기문 기법 처음에는 작은 요청에 대한 동의를 받고 차츰 더 큰 요청을 수락하도록 하는 손응 행동을 이끌어내는 방법.\n문간에발 기법 처음에는 아주 크거나 무리한 요청을 했다가 잠시 뒤에 작지만 바라던 요청을 하는 기법, 이때 첫 요청은 보통 실패로 돌려도 상관이 없다.\n심지 세한 기법 너무 작은 요청이라도 어쨌듯지 않는 요청을 하여 손응률을 이끌어내고 내도록 설계된 기법.\n 정보적 영향력 정보로 제공함으로써 소비자에게 미치는 영향력.\n 11-3b 정보적 영향력 준거집단의 영향력 원천은 규범적 영향력과 더불어 의사 결정에 도움을 주는 정보를 제공함으로써 정보적 영향력(informational influence)을 미친다.75 예를 들어, 인터넷 여행 사이트의 사례 그룹은 잠재 여행객에게 여행에 관한 도움말을 제공함으로써 정보적 영향력을 행사한다. 친구들은 특히 극장에서 상영되고 있는 영화에 대해 이야기함으로써 정보적 영향력을 미친다. 그리고 매종패는 특정 식품이 건강에 해롭다는 보도를 통해 정보적 영향력을 미친다.\n 정보적 영향력은 소비자가 정보 탐색과 구매 결정에 투자하는 시간과 노력 정도에 영향을 미친다. 친구로부터 쉽게 정보를 얻을 수 있다면 의사 결정을 할 때 시간이 많이 소요되는"}, {"source": "20261111_092337.jpg", "text": "마케팅 시사점 마케터는 정보적 영향력을 다양한 방법으로 활용할 수 있다.\n 정보적 영향력 매력 만들기 마케팅 관리자는 소비자에게 신제품에 대한 정보를 알리는 광고를 통해 정보적 영향력을 미치는 경우가 많다. 예를 들어, 그림 11-9에서 볼 수 있듯이 레드불 소비자가 레드불에 기대하 는 기호 및 유사하면서 레드불 오렌지 브랜드에는 칼로리가 없 다는 점을 강조하는 광고를 통해 정보적 영향력을 행사한다. 또한 정보적 영향력의 또다른 예로는 복수의 고객집단, 브랜드들이 브랜드에 대한 의견과 정보들 설명하고 나누는 다양한 소셜 미디어 네트워크를 손다. 이러한 네트워크는 소비자들이 는 제품 구매에 내가미하는 모든 특성에 누적되어 작용하는 것이다. 더 많은 긍정적인 입소문과 평판을 쌓을 수록 소비자들은 그들의 정보를 더욱 신뢰하게 될 것이다.\n또한 웹사이트에서 소비자가 제품을 평가하도록 하는 온라인 포럼을 개설하여 제품에 대해 토의하도록 한다. 이러한 평가 토의가 다 양한 경우 긍정의 퍼져 제품 판매 증가에 기여한다.7\n 희소성 정보 제공 고객에게 “수요가 많아 재고가 5개밖에 남았습니다”와 같이 제품 희소성과 판매 단서를 줄 수 있다. 이 전략은 소비자가 ‘공급이 한 정’되어 소외되는 것을 피하기 위해 해당 제품을 구매하도록 유도 한다.\n 정보적 영향력과 규범적 영향력 연결하기 마케팅 노력은 규범적 영향력과 정보적 영향력이 모두 포함될 때 가장 성공적일 수 있다. 한 연구에 따르면 두 가지 형태의 영향\n 그림 11-9 ▸ 마케팅 관리자는 소비자에게 신제품에 대해 알리는 것으로도 정보적 영향력을 미친다."}, {"source": "20261111_092343.jpg", "text": "소비자 사회화 소비자가 되는 법을 학습하는 과정.\n 그림 11-10 부모의 자녀의 사회화에 중요한 역할을 한다."}, {"source": "20261111_092347.jpg", "text": "극성 어떤 대상에 대한 평가나(긍정적 극성) 나쁨(부정적 극성) 정보."}, {"source": "20261111_092353.jpg", "text": "구전 한 사람에게서 다른 사람이나 집단에게 구두로 전달되는 영향력."}, {"source": "20261111_092357.jpg", "text": "그림 11-11 ▶ 소셜 미디어 구전 지금은 소셜 미디어와 다양한 매체로 인해 구전이 실시간으로 일어나는 경우가 많다."}, {"source": "20261111_092403.jpg", "text": "구전을 통한 정보의 급속한 확산 촉진하기\n 바이럴 마케팅 브랜드에 의해 지지된 사람들이 서로에게 브랜드/제품 정보를 빠르게 알린다는 것."}, {"source": "20261111_092406.jpg", "text": "해야 할 일 • 대중의 인식을 이해하기 위해 주의깊게 듣는 것 • 정확한 비폭로고, 일관되고, 적절하게 대꾸하는 것 • 가능한 한 투명하게 하는 것 • 고객을 최우선으로 하는 것 • 고객의 신뢰를 다시 얻기 위한 비상 계획을 수 립하는 것\n 하지 말아야 할 일 • 위기를 무시하는 것 • 반응을 늦추는 것 • 점증을 회피하는 것 • 무료로부터 단호한 노력에 차서 설명하게 대응 하는 것 • 위기 상황에서도 일상적인 사업 운영을 무시 하는 것\n 표 11-1 기업 평판 회복하기\n 위기 관리 전문가들은 위기 상황에 처한 기업에게서는 평판을 재구축하기 위해 해야 할 일과 해서는 안 되는 일이 있다고 제시한다.\n 미국 성인들은 가짜 뉴스를 얼마나 걱정하나?\n% 응답자 비율, 2020년 6월 ~ 2021년 1월\n 매우 걱정 약간 걱정 전혀 걱정하지 않음\n 그림 11-12 소비자와 가짜 뉴스에 대한 걱정의 증가\n 주: 18세 이상, numbers may not add up to 100% due to rounding"}, {"source": "20261111_092412.jpg", "text": "■ 부문 대응 전략: 기업은 소문, 가짜 뉴스, 스캔들에 대해 사려 부문 대응 전략을 활용할 수 있다. 예를 들어, 기업은 특정 소문에 대해 편지를 보내거나 전화하는 사람들이에게 자세한 설명문을 보낼 수 있다. 어떤 경우, 기업은 직원들에게 공개된 고객 대응 방법에 대해 설명할 필요가 있다.\n ■ 신중한 분리 대응 전략: 기업이 신중하게 반응할 수 있다. 예를 들어, 장래 회사들이 법으로 선악 규칙과 공급을 따르게 하는 소문의 떠돌았다. 기업은 사회적으로 바람직한 자사의 행동을 부각하는 공중 관계 캠페인을 시작한다. 소문의 핵심에 근거되지 않거나, 비합리적인 요지는 사운 내용과는 명백히 반대되는 것이다.\n ■ 정면으로 대응하기: 기업은 대립을 피할 수 없는 때까지 자원을 총동원하여 대응해야 한다. 자동차 기업이 문제를 빨리, 조용하게 반응해야 하는 상황에서 신속하고, 적극적인 대응을 펼칠 수도 있고, 자사의 입장을 알리는 매체 인터뷰를 진행할 수도 있고, 사실관계를 설명한 광고를 제작하는 것도 도움이 되는 실례다. 높은 외부 감도의 자동차 그룹장은 “어느 날 소비자들은 일부 안전 검사에서 실패된 볼트(Chevrolet Volt)의 모든 전가 배터리에서 화재 위험성이 있다는 보고가 나오자, 그 기업인 제너럴모터스(General Motors; GM)는 신속하고 공개적으로 해당 차량의 리치 안전 기록을 반복적으로 제시했다. 또한 안전성 문제를 조사하는 기간 동안 차량 소유자에게 무상 대여 차량을 제공했다. 그리고 수주 내에 화재 위험을 낮춘 배터리 케이스를 다시 디자인했다. 해당 증이 브랜드 차량의 무상으로 설치해주었다.134\n ■ 구전 추적하기: 구전이 추천처럼 긍정적으로든 소문의 가까운 뉴스처럼 부정적으로든 기업은 반응성을 확인해야 한다. 대부분 소비자가 어떻게 해당 정보를 어디에서 들었는지는 찾아보고, 왜 인지하는지를 이해하고자 노력해야만 한다. 많은 기업들은 온라인과 소셜 미디어에 올라온 코멘트를 살펴보고 어떤 어디에서의 메시지가 발생하여 어떤 경로를 통해 확산되었는지를 파악한다. 그러고 나서 가장 중요한 이 정보들을 바탕으로 상황에 맞는 대응을 디자인한다. 대부분 애플은 소셜 미디어 플랫폼인 트위터를 활용하였다. 소문이나 가짜 뉴스를 발견한 소비자가 애플의 최고경영자에게 정보를 트윗으로 보내면 애플의 기업 홍보 담당자들이 내용이 누군지와, 그리고 공중연 결정에 미치는 영향을 분석한 다음 반복된 절차를 포함거나 보상하는 방법으로 즉속 조치를 취할 수 있다."}, {"source": "20261111_092432.jpg", "text": "그림 11-13 • 유대 강도와 사회적 영향력\n 유대 강도 친밀한 관계를 통해 개인들이 연결된 정도.\n 강한 유대 약한 유대"}, {"source": "20261111_092437.jpg", "text": "요약 소비자는 다양한 마케팅 및 비마케팅 원천의 영향을 받는다. 소비자는 마케팅 원천보다 비마케팅 원천을 더 신뢰할 수 있으며, 그중 상표 경험이 큰 영향을 미친다. 마케터는 온라인과 오프라인의 영향력 원천인 의견 선도자와 인플루언서를 타깃팅하기 원한다. 개인이 자신을 사람들과 비교할 때 표면 되는 준거집단에는 소속, 열망, 회피 집단이 있다. 마케터의 비마케팅 원천은 준거집단을 활용한 도구들을 사용하며, 이를 소셜 커머스와 온라인 도구로도 활용할 수 있으며 개인적인 접근을 통해 일반인 또는 인플루언서들과 상호 작용하기도 한다. 가족도 소비자 행동에 영향을 미치는 준거집단이 될 수 있다. 정보 원천은 구매 및 정보적, 정서적 영향에 따라 구분된다. 규범적 및 정보적 영향력은 긍정적 집단 압력의 한 양상에 지나지 않는다. 부정적 정보는 더 많은 사람들에게 전달되고 긍정적 정보보다 의사 결정에 더 큰 영향을 미친다. 특히, 마케터들은 온라인과 오프라인, 소셜 미디어에서 긍정적 또는 부정적 구전에 관심이 있다. 그리고 원천 특성(수신자에게 원천의 원칙 정도, 신뢰성, 매력도), 수신자(원천과의 동일시 및 유사성 정도), 원천과 수신자 간의 관계(접촉 정도, 네트워크 밀도, 유대 정도), 도구 특성(도달 범위가 넓거나 쌍방향 의사소통이 가능한지) 사회적 영향력의 강도와 관련이 있다.\n 복습과 토의를 위한 질문 1. 소비자에게 영향을 미치는 정보 원천 유형에는 어떤 것들이 있는가?\n2. 소비자가 마케팅 자극에 주목하기 하기 위해 의견 선도자를 표적으로 삼는 이유는 무엇인가?\n3. 준거집단의 세 가지 유형에는 어떤 것이 있으며 어떻게 설명할 수 있는가?\n4. 소비자는 가족 영향력에 대해 어떻게 반응하는가?\n5. 마케터가 소비자 동조를 호소하기 위해 사용할 수 있는 세 가지 전략은 무엇인가?\n6. 집단 극성과 집단 의사결정 구분하여 설명하라.\n7. 정보 원천의 네 가지 주요 특성은 무엇인가?\n8. 사회적 영향력은 어떤 경우에 더 강력한가?\n 미주(endnotes)는 한경사 홈페이지(www.hankyungsa.co.kr) 공지사항에서 PDF 파일을 다운로드 할 수 있습니다."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('book-edits',content.innerHTML));const saved=localStorage.getItem('book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
