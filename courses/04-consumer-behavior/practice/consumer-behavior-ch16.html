<script>
const slides=[{"kind": "concept", "title": "상징적 소비와 의미", "answer": "소비자는 제품의 기능뿐 아니라 제품이 자신과 타인에게 전달하는 의미를 소비한다. 의미는 문화·사회·개인 경험에서 만들어지며 같은 물건도 사람과 상황에 따라 다를 수 있다.", "example": "평범한 티셔츠가 어느 사람에게는 편한 옷이고 다른 사람에게는 첫 공연의 소중한 기념품일 수 있다."}, {"kind": "concept", "title": "집단 소속의 상징", "answer": "제품·브랜드·의식은 소속된 집단이나 속하고 싶은 집단을 표현할 수 있다. 지리·민족·계층·생활 방식 등의 의미가 담길 수 있지만 소유물을 보고 개인의 정체성을 단정하지 않는다.", "example": "동아리 로고가 있는 옷은 구성원 사이의 소속을 드러낼 수 있다. 로고만으로 개인의 모든 취향을 알 수는 없다."}, {"kind": "concept", "title": "역할 획득 기능", "answer": "제품과 서비스는 새로운 사회적 역할에 익숙해지고 그 역할을 표현하도록 도울 수 있다. 기능적 준비와 정체성 확인이 함께 이루어질 수 있다.", "example": "처음 취업한 사람이 업무용 가방과 옷을 마련하며 직장인 역할에 적응할 수 있다."}, {"kind": "concept", "title": "역할 전환: 분리·전환·통합", "answer": "분리는 이전 역할에서 벗어나는 단계, 전환은 기존·새 역할 사이의 변화 과정, 통합은 새 역할과 행동에 적응하는 단계이다. 소비물의 처분·획득과 의식이 이 과정을 도울 수 있다.", "example": "졸업을 앞두고 학생용 물건을 정리하고 취업 준비를 거쳐 새로운 업무 생활에 자리 잡는 흐름을 살펴볼 수 있다."}, {"kind": "concept", "title": "역할 전환 의식과 타인의 인정", "answer": "의식은 상징적 행동을 통해 역할 변화를 사회적으로 드러낸다. 주변 사람의 반응과 인정은 새 역할을 확인하는 데 영향을 준다. 관련 상품만 구매한다고 역할이 자동 획득되는 것은 아니다.", "example": "졸업식의 가운·졸업장·축하는 학생에서 졸업생으로의 전환에 의미를 부여한다."}, {"kind": "concept", "title": "유대감 기능 (Connectedness)", "answer": "소유물은 중요한 사람·장소·시기·사건과의 연결을 떠올리게 한다. 이러한 연결은 물건의 기능과 가격을 넘어 지속될 수 있다.", "example": "가족과 여행한 곳의 작은 기념품을 보며 함께한 시간을 떠올릴 수 있다."}, {"kind": "concept", "title": "표현 기능 (Expressiveness)", "answer": "소비는 가치·개성·미적 취향과 자신이 누구인지 표현하는 수단이 된다. 표현은 자신을 향할 수도, 다른 사람을 향할 수도 있으며 의도와 타인의 해석은 다를 수 있다.", "example": "수리해 오래 쓰는 물건을 통해 자원 절약이라는 가치를 표현할 수 있다."}, {"kind": "concept", "title": "복합적 기능과 자아 개념", "answer": "하나의 소유물은 집단 소속·역할 획득·유대감·자기표현 기능을 동시에 수행할 수 있다. 소유물은 자아 개념과 연결되지만 개인의 정체성이 물건에만 의존하는 것은 아니다.", "example": "졸업 반지는 학교 소속, 성취, 친구들과의 기억과 새 사회적 역할을 함께 상징할 수 있다."}, {"kind": "concept", "title": "특별한 소유물의 종류", "answer": "교재는 반려동물, 추억이 담긴 물건, 성취의 상징, 수집품 등을 특별한 의미의 대상으로 다룬다. 어떤 물건이 특별한지는 가격이나 제품 범주보다 개인의 관계와 경험에 달려 있다.", "example": "오래된 메달이나 편지는 시장가격이 낮아도 소유자에게 매우 중요할 수 있다."}, {"kind": "concept", "title": "특별한 소유물의 특징", "answer": "대체 불가능성, 강한 애착, 기억과 정체성의 연결, 조심스러운 관리 등이 나타날 수 있다. 기능이 사라져도 처분하지 않거나 경제적 가치만으로 평가하지 않을 수 있다.", "example": "작동하지 않는 시계라도 부모에게 받은 유일한 물건이라면 새 시계로 대체하기 어려울 수 있다."}, {"kind": "concept", "title": "물건이 특별해지는 이유", "answer": "획득 경로, 선물한 사람, 성취와 사건, 시간과 노력의 투자, 유일성 등이 특별한 의미를 만들 수 있다. 마케터는 개인의 경험을 존중하고 의미를 임의로 대신 정의하지 않아야 한다.", "example": "직접 만들고 고친 가구에는 제작에 들인 노력과 함께한 생활의 기억이 쌓일 수 있다."}, {"kind": "concept", "title": "소유물 관련 의식", "answer": "획득·사용·관리·처분 과정의 반복적이고 의미 있는 행동은 소유물의 의미를 만들거나 강화한다. 단순한 습관과 달리 참여자에게 상징적 의미가 있다는 점이 중요하다.", "example": "가족사진을 정해진 날 함께 꺼내 보거나 오래된 악기를 정성껏 관리하는 행동은 의미를 이어 갈 수 있다."}, {"kind": "concept", "title": "신성한 의미와 세속적인 대상", "answer": "신성한 대상은 특별한 존중과 분리된 취급을 받는 사람·사물·장소·사건 등이다. 종교적 대상에 한정되지 않는다. 세속적인 대상은 일상적·실용적인 취급과 연결된다.", "example": "팬에게 특별한 경기장이나 가족의 가보가 일상의 다른 장소·물건과 다르게 취급될 수 있다."}, {"kind": "concept", "title": "신성화·탈신성화와 상업화", "answer": "경험과 의식은 대상을 신성하게 만들 수 있고 부적절한 사용·과도한 상업화는 그 의미를 약화시킬 수 있다. 같은 활용도 집단마다 다르게 해석하므로 맥락과 당사자의 반응을 고려해야 한다.", "example": "추모의 장소를 무관한 판촉 배경으로 사용하면 그곳을 소중히 여기는 사람들의 반발을 부를 수 있다."}, {"kind": "concept", "title": "선물: 의미를 전달하는 과정", "answer": "선물은 물건이나 서비스뿐 아니라 관심·사랑·의무·관계를 전달하는 과정이다. 구상, 증정, 재구성의 세 단계로 분석하며 경제적 가치와 관계적 의미를 구분한다.", "example": "작은 손편지가 비싼 상품보다 상대를 잘 이해했다는 의미를 전달할 수 있다."}, {"kind": "concept", "title": "구상 단계 (Gestation)", "answer": "누구에게 왜 주는지, 무엇을 고를지, 어떤 예산을 쓸지 준비하는 단계이다. 이타적 관심, 관계 유지, 보답과 의무, 자신의 기쁨 등 여러 동기가 함께 작용할 수 있다.", "example": "친구의 새 취미와 생활 공간을 알아보고 실제로 쓸 수 있는 선물을 고르는 과정이다."}, {"kind": "concept", "title": "선물의 적절성·가치·정체성", "answer": "적절성은 수혜자의 욕구·자아 개념, 관계, 문화와 상황에 따라 달라진다. 비싸거나 놀라운 선물이 언제나 좋은 것은 아니며 부담과 답례 의무를 만들 수도 있다.", "example": "공간이 좁은 친구에게 큰 장식품보다 원하는 소모품이나 체험을 선물하는 것이 더 적절할 수 있다."}, {"kind": "concept", "title": "증정 단계 (Presentation)", "answer": "실제 전달과 교환이 이루어지는 단계이다. 포장·말·시기·장소·의식과 받는 사람의 반응이 선물의 의미에 영향을 준다. 주는 이의 의도가 그대로 전달된다고 보장하지는 않는다.", "example": "같은 선물도 공개석상에서 전달할 때와 조용히 개인적으로 건넬 때 느끼는 부담이 다를 수 있다."}, {"kind": "concept", "title": "재구성과 답례 (Reformulation and Reciprocation)", "answer": "선물을 해석한 뒤 관계를 확인하거나 변화시키는 단계이다. 감사·거리감·유대와 향후 답례가 관련된다. 답례의 기대와 방식은 문화·관계·상황에 따라 달라진다.", "example": "친구에게 받은 도움에 다음 기회에 보답할 수 있지만 재난 지원처럼 대등한 답례를 기대하지 않는 상황도 있다."}, {"kind": "concept", "title": "자선 기부와 의미·신뢰", "answer": "기부에는 공감·이타성·연결감·자기표현 등 여러 동기가 관여한다. 수혜자와 필요, 자금 사용 목적과 결과를 구체적으로 설명하고 신뢰를 높이는 것이 중요하다. 메시지의 효과는 기부자와 상황에 따라 다르다.", "example": "기부금이 어떤 지원에 쓰이는지 밝히고 사용 결과를 알리면 참여자가 도움의 의미를 이해하기 쉽다."}, {"kind": "problem", "topic": "상징적 의미", "title": "같은 티셔츠를 A는 편해서 입고 B는 첫 공연의 추억 때문에 보관한다. 차이를 설명하라.", "answer": "A는 기능적 편익이, B는 특정 경험과 연결된 상징적 의미가 두드러진다. 같은 제품도 관계와 기억에 따라 의미가 다르며 기능과 상징은 함께 존재할 수 있다.", "example": "낡아 입을 수 없어져도 공연의 기억 때문에 보관할 수 있다."}, {"kind": "problem", "topic": "집단 소속", "title": "동아리 옷을 입은 사람의 정체성을 어디까지 해석할 수 있는가?", "answer": "소속이나 소속 의사를 표현하는 단서일 수 있다. 그러나 선물로 받았거나 디자인이 좋아 입었을 수도 있어 실제 가입 여부나 모든 가치·취향을 단정할 수 없다.", "example": "상징의 의도와 관찰자의 해석을 구분해야 한다."}, {"kind": "problem", "topic": "역할 획득", "title": "신입 직원이 업무용 가방과 복장을 마련하는 행동의 기능적·상징적 측면을 설명하라.", "answer": "업무 물품을 운반하고 상황에 맞는 옷을 입는 기능과 함께 직장인 역할에 적응하고 표현하는 역할 획득 기능이 있다. 구매 자체가 업무 능력을 보장하지는 않는다.", "example": "직장 동료의 안내와 실제 업무 경험도 역할 적응에 필요하다."}, {"kind": "problem", "topic": "역할 전환", "title": "졸업 전 물건 정리, 취업 준비 기간, 업무 생활 정착을 세 단계로 분석하라.", "answer": "이전 역할에서 벗어나는 분리, 새 역할로 이동하는 전환, 새 행동에 적응하는 통합으로 분석할 수 있다. 실제 전환은 겹치거나 되돌아갈 수도 있다.", "example": "학생 때의 자료를 모두 버려야만 분리가 이루어지는 것은 아니다."}, {"kind": "problem", "topic": "의식과 인정", "title": "졸업식의 가운과 졸업장, 가족의 축하가 역할 전환에 어떤 의미를 갖는가?", "answer": "상징과 의식으로 전환을 드러내고 주변의 인정이 졸업생이라는 새 지위를 확인하게 한다. 개인적 변화와 사회적 인정이 연결되는 과정이다.", "example": "가운은 의식 밖에서는 같은 정도의 의미를 지니지 않을 수 있다."}, {"kind": "problem", "topic": "상징적 기능", "title": "가족에게 받은 졸업 반지가 소속·성취·추억을 동시에 나타낸다. 하나의 기능으로만 분류해야 하는가?", "answer": "그럴 필요가 없다. 학교 집단의 소속, 역할 변화와 성취, 가족과의 유대, 자기표현이 함께 작용할 수 있다. 어떤 의미가 중요한지 당사자에게 확인한다.", "example": "동일한 반지라도 졸업생과 선물한 가족이 강조하는 의미가 다를 수 있다."}, {"kind": "problem", "topic": "유대감과 표현", "title": "여행 기념품으로 가족을 떠올리는 것과 재활용 소품으로 환경 가치를 드러내는 것을 비교하라.", "answer": "앞은 중요한 사람·장소·시간에 대한 유대감 기능, 뒤는 자신의 가치를 나타내는 표현 기능이 두드러진다. 두 기능은 하나의 물건에 함께 나타날 수 있다.", "example": "가족이 함께 만든 재활용 소품은 유대와 가치 표현을 동시에 담을 수 있다."}, {"kind": "problem", "topic": "특별한 소유물", "title": "고장 난 부모님의 시계를 새 시계로 바꿔 주면 같은 만족을 줄 수 있는가?", "answer": "반드시 그렇지 않다. 원래 시계는 특정 사람과 사건에 연결되어 대체 불가능할 수 있다. 기능적 효용을 회복하는 것과 상징적 의미를 대체하는 것은 다르다.", "example": "수리를 원할 수 있으므로 폐기나 교체 전에 소유자의 뜻을 확인해야 한다."}, {"kind": "problem", "topic": "의식과 의미 형성", "title": "매년 가족사진을 함께 꺼내 보는 행동을 단순한 반복과 구분해 설명하라.", "answer": "반복 자체보다 가족의 기억과 관계를 확인하는 상징적 의미가 있다는 점이 중요하다. 의식은 소유물의 의미를 유지하고 강화할 수 있다.", "example": "사진의 보관 방식과 이야기 나누는 과정도 의미 형성에 기여한다."}, {"kind": "problem", "topic": "신성한 의미", "title": "팬의 경기장과 가족의 가보를 신성한 대상으로 볼 수 있는가?", "answer": "당사자가 특별한 존중과 분리된 취급을 부여한다면 볼 수 있다. 신성함은 종교에만 한정되지 않으며 모든 사람이 같은 의미를 공유하지는 않는다.", "example": "일반 방문객에게는 시설인 장소도 팬에게는 특별한 역사의 현장일 수 있다."}, {"kind": "problem", "topic": "상업화와 의미", "title": "추모 장소를 무관한 상품 판촉에 활용한 캠페인이 반발을 샀다. 왜이며 무엇을 고려해야 하는가?", "answer": "신성하거나 특별한 의미를 일상적 상업 목적으로 다뤄 탈신성화로 느껴질 수 있다. 장소의 의미, 관련 공동체의 관점과 적절성을 확인하고 존중해야 한다.", "example": "방문객 수가 많다는 이유만으로 판촉 적합성을 판단해서는 안 된다."}, {"kind": "problem", "topic": "선물의 단계", "title": "친구 취향 조사, 포장해 전달, 이후 감사와 관계 변화는 각각 어떤 단계인가?", "answer": "취향과 예산을 고려한 준비는 구상, 실제 전달과 반응은 증정, 이후 의미 해석과 관계 조정은 재구성이다. 단계를 나누면 어디에서 의미가 달라졌는지 살펴볼 수 있다.", "example": "가격은 적절해도 전달 방식이 부담을 주면 관계에 다른 영향을 줄 수 있다."}, {"kind": "problem", "topic": "선물 적절성", "title": "비싼 장식품을 받은 친구가 부담스러워한다. 가격 외에 무엇을 고려하지 못했을 수 있는가?", "answer": "수혜자의 공간·취향·필요와 자아 개념, 관계의 거리, 문화적 기대와 답례 부담을 놓쳤을 수 있다. 주는 사람의 만족과 받는 사람의 효용은 다를 수 있다.", "example": "원하는 선물을 직접 물어보는 것이 관심 부족을 뜻하지는 않는다."}, {"kind": "problem", "topic": "답례", "title": "생일 선물과 재난 피해 지원에서 답례 기대가 같아야 하는가?", "answer": "그렇지 않다. 답례의 기대는 관계·문화·상황에 따라 다르며 피해 지원에서는 대등한 보답을 기대하지 않을 수 있다. 받은 사람이 의무를 느끼는지도 고려해야 한다.", "example": "선물을 교환 가치만으로 이해하면 도움과 배려의 의미를 놓칠 수 있다."}, {"kind": "problem", "topic": "기부 메시지", "title": "기부 캠페인이 ‘좋은 일에 씁니다’라고만 안내한다. 신뢰와 의미 전달을 개선하라.", "answer": "구체적인 수혜 필요와 사용 목적·집행 방식·결과 보고를 설명한다. 공감을 돕되 사람의 존엄을 존중하고 기부 선택에 과도한 압박을 주지 않는다.", "example": "지원 규모와 전달 결과를 확인할 수 있으면 참여자는 자신의 기여를 이해하기 쉽다."}];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');let current=0;
function render(){const s=slides[current],c=s.kind==='concept',n=c?current+1:current-19;$('category').textContent=c?'핵심 개념 해설':'연습문제 · '+s.topic;$('number').textContent=c?'핵심 '+pad(n):'Q '+pad(n);$('question').textContent=s.title;$('answer-label').textContent=c?'개념 해설':'모범답안';$('answer').textContent=s.answer;$('example').textContent=s.example;$('answers').hidden=true;$('reveal').textContent=c?'개념 해설·예시 보기':'모범답안·예시 보기';$('reveal').setAttribute('aria-expanded','false');$('page').textContent=pad(current+1)+' / 35';$('progress').textContent=(current+1)+' / 35';$('prev').disabled=current===0;$('next').disabled=current===34;}
function move(n){current=Math.max(0,Math.min(34,n));render();window.scrollTo(0,0)}
$('reveal').onclick=()=>{const show=$('answers').hidden;$('answers').hidden=!show;$('reveal').setAttribute('aria-expanded',String(show));$('reveal').textContent=(slides[current].kind==='concept'?'개념 해설·예시 ':'모범답안·예시 ')+(show?'숨기기':'보기')};$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('list').onclick=()=>$('map').showModal();$('close').onclick=()=>$('map').close();$('print').onclick=()=>window.print();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('이 브라우저에서는 전체화면 전환을 사용할 수 없습니다.')}};
document.addEventListener('keydown',e=>{if($('map').open||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();move(current-1)}if(e.key==='Home'){e.preventDefault();move(0)}if(e.key==='End'){e.preventDefault();move(34)}});
slides.forEach((s,i)=>{if(i===0||i===20){const h=document.createElement('h3');h.textContent=i===0?'핵심 개념 해설 · 20개':'연습문제 · 15개';$('map-content').append(h)}const b=document.createElement('button');b.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+'  '+s.title;b.onclick=()=>{move(i);$('map').close();$('question').focus()};$('map-content').append(b);const p=document.createElement('section');p.className='print-slide';const head=document.createElement('header');head.textContent='제16장 · 상징적 소비자 행동';const title=document.createElement('h1');title.textContent=(i<20?'핵심 '+pad(i+1):'문제 '+pad(i-19))+' · '+s.title;p.append(head,title);[['개념 해설','모범답안'][i<20?0:1],'예시로 이해하기'].forEach((label,k)=>{const box=document.createElement('section');box.className='box'+(k?' example':'');const h=document.createElement('h2');h.textContent=label;const text=document.createElement('p');text.textContent=k?s.example:s.answer;box.append(h,text);p.append(box)});const f=document.createElement('footer');f.textContent='소비자행동 교안 · 이현구 교수 · '+(i+1)+' / 35';p.append(f);$('print-content').append(p)});render();
</script></body></html>
