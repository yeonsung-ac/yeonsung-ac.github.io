const slides=JSON.parse(document.getElementById('slide-data').textContent),el=id=>document.getElementById(id);let index=0,revealed=false;
slides.forEach((s,i)=>s.label=s.code||String(i-14).padStart(2,'0'));
function paragraphs(target,items){target.replaceChildren(...items.map(text=>{const p=document.createElement('p');p.textContent=text;return p}))}
function render(){revealed=false;const s=slides[index];document.querySelector('#answers h2').textContent=s.code?'개념 해설':'모범답안';el('question').textContent=s.q;el('topic').textContent=s.topic;paragraphs(el('answer'),s.a);paragraphs(el('example'),s.e);el('number').textContent=s.label;el('number').classList.toggle('textbook-number',Boolean(s.code));el('page').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;el('counter').textContent=(index+1)+' / '+slides.length;el('progress').style.width=((index+1)/slides.length*100)+'%';el('answers').hidden=!revealed;el('reveal').textContent=revealed?(slides[index].code?'개념 해설·예시 숨기기':'모범답안·예시 숨기기'):(slides[index].code?'개념 해설·예시 보기':'모범답안·예시 보기');el('reveal').setAttribute('aria-expanded',String(revealed));el('prev').disabled=index===0;el('next').disabled=index===slides.length-1;document.querySelectorAll('.jump').forEach((b,i)=>{b.classList.toggle('current',i===index);if(i===index)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});window.scrollTo(0,0)}
function move(delta){if(index+delta<0||index+delta>=slides.length)return;index+=delta;render()}
function toggle(){revealed=!revealed;el('answers').hidden=!revealed;el('reveal').textContent=revealed?(slides[index].code?'개념 해설·예시 숨기기':'모범답안·예시 숨기기'):(slides[index].code?'개념 해설·예시 보기':'모범답안·예시 보기');el('reveal').setAttribute('aria-expanded',String(revealed))}
el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('reveal').onclick=toggle;el('list').onclick=()=>el('map').showModal();el('close').onclick=()=>el('map').close();
el('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{el('full').textContent='전체화면 사용 불가'}};
document.addEventListener('fullscreenchange',()=>el('full').textContent=document.fullscreenElement?'전체화면 종료':'전체화면');
el('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(el('map').open||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='Space'&&!e.target.matches('button')){e.preventDefault();toggle()}else if(e.key==='Home'){e.preventDefault();index=0;render()}else if(e.key==='End'){e.preventDefault();index=slides.length-1;render()}});
slides.forEach((s,i)=>{const b=document.createElement('button'),n=document.createElement('b'),t=document.createElement('span');b.className='jump';n.textContent=s.label;t.textContent=s.q;b.append(n,t);b.onclick=()=>{index=i;render();el('map').close();el('reveal').focus()};el('map-content').append(b);const article=document.createElement('article');article.className='print-item';const h=document.createElement('h1');h.textContent=s.label+' · '+s.q;article.append(h);[[s.code?'개념 해설':'모범답안',s.a],['예시로 이해하기',s.e]].forEach(([label,items])=>{const heading=document.createElement('h2'),body=document.createElement('div');heading.textContent=label;paragraphs(body,items);article.append(heading,body)});el('print-view').append(article)});
const jumpButtons=[...el('map-content').children];
[[0,'핵심 개념 해설 · 15개'],[15,'연습문제 · 15개']].forEach(([i,title])=>{const h=document.createElement('h3');h.textContent=title;h.style.cssText='grid-column:1 / -1;margin:18px 0 7px;font-size:17px';el('map-content').insertBefore(h,jumpButtons[i])});
render();
</script></body></html>
