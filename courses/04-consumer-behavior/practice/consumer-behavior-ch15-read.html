:root{--size:19px;--line:1.9;font-family:"Malgun Gothic",sans-serif;color:#202124;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar select,.toolbar input{height:36px;border:1px solid #c7c7c7;border-radius:5px;background:#fff;padding:0 10px}.toolbar input[type=checkbox]{height:auto;width:auto;padding:0}.toolbar button{cursor:pointer;font-weight:700}.toolbar button.primary{background:#1769aa;color:#fff;border-color:#1769aa}.page{max-width:820px;margin:34px auto 100px;padding:0 24px}.title{font-size:34px;margin:0 0 36px}.content{font-size:var(--size);line-height:var(--line);outline:none}.content h2{font-size:1.35em;margin:2.2em 0 .8em}.content p{margin:0 0 1.15em}.active{background:#fff1a8;outline:4px solid #fff1a8}.notes{margin-top:52px;border-top:2px solid #444;padding-top:22px}.notes h2{font-size:24px}.note{border-left:3px solid #9aa0a6;padding-left:15px;color:#4b4b4b;margin:20px 0}.source{display:none}.status{margin-left:auto;color:#5f6368;font-size:13px}@media(max-width:700px){.status{width:100%;margin:0}.title{font-size:28px}.page{margin-top:24px}}
</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "소비자 행동 결과와 쟁점", "source": "20261114_151354.jpg"}, {"kind": "paragraph", "text": "5부에서는 2부, 3부, 4부에서 점검했던 영향력, 과정과 결과에 관련된 핵심 쟁점을 점검한다. 15장에서는 소비자가 혁신적 제품을 어떻게 채택하는지, 채택 결정이 시장을 통한 새로운 자원의 혁신에 어떻게 영향을 미치는지 살펴봄으로써 혁신적 제품에 대한 소비자의 채택과 적응과 확산에 대한 논의를 다룬다. 또한 소비자의 혁신에 대한 채택과 혁신의 채택 사용을 통한 재이용과 확산에 있어 마케터가 고려해야 할 다양한 요인을 알아보게 된다.\n16장에서는 상징적 소비와 행동이라는 매혹적인 주제를 다룬다. 자아와 사회, 자아와 사회 집단은 모두 소비자에게 상징적인 감정이입을 제공하는 요인이다. 오늘날 소비자 의사결정은 과거 대비 훨씬 더 복잡해졌다. 주요한 신경과 관련된 요인에 의해 영향을 받는 감정은 물론, 사회 문화적인 요인들에 의해 많은 영향을 받게 된다. \n 따라서 소비자는 감정에 휘둘리는 존재로 쉽게 전이될 수 있다. 그러므로 상징과 구매, 존재, 지향은 서로 연결되어 있다. 17장에서는 마케팅에서의 윤리, 하나의 추상적인 개념인 윤리의 의미를 살펴본다. 이 장에서는 착취적 구매, 취약한 소비자, 착취적 경향과 같은 논란이 되는 소비자 활동과 사항적 관례, 취약한 소비자 계층을 목표로 하는 기업의 활동을 설명한다. 또한, 지속 가능성 논쟁에 참여하고 옹호 단체에 가입하는 소비자의 유의할 활동과 기업의 사회적 책임 프로그램을 시행하거나 윤리적 제품을 수행하는 기업의 활동도 다룬다.\n 또한 어린이나 낮은 문해력을 가진 사람과 같은 취약한 소비자 계층에 대해 논의한다. 미성년자의 알코올·담배 및 기타 물질 사용, 소비자 프라이버시, 사생활 문제와 같은 논란이 되는 이슈 역시 거슬듯한 전자 폐기물(e-waste)을 포함한 글로벌 폐기, 강력투자 저항 행동, 환경을 의식한 행동, 윤리적인 제품 조달과 관련된 문제들도 논의된다. 마지막으로 불매운동과 옹호 단체 참여와 같은 소비자 운동과 관련된 문제에 대해 설명한다.", "source": "20261114_151354.jpg"}, {"kind": "heading", "text": "혁신: 채택, 저항, 확산", "source": "20261114_151401.jpg"}, {"kind": "paragraph", "text": "도입\n 크라이슬러(Crysler)는 2025년에 새로운 완전 전기식 SUV인 에어플로우(Airflow) 생산을 시작하여, 2028년까지 전기차 전체 라인업을 선보일 예정이다. 이 차량은 201마일의 전기 모터 2개를 장착하여 한 번 충전으로 350~400마일을 주행할 수 있다. 또한, 최신의 인공지능과 디지털 기술을 갖추고 있어, 운전자가 개입하지 않는 한 차를 주행에 가깝게 보류 운전 보조 시스템을 자랑한다. 스마트콕핏(smart-cockpit)을 통해 사용자는 디지털 업무, 탐색, 음악 등 일상적으로 필요에 맞게 맞춤 사용을 할 수 있다. 내장된 카메라에 따라 각 좌석에서 화상회의 기능을 사용할 수 있다. 차량 내부에는 고화질 패널 디스플레이 조명이 시각적인 편안함을 더하며, 조명과 분위기뿐만 아니라 운전자의 요구에 따라 맞춤 설정이 가능하다.\n 전기 및 자율 주행 차량과 같은 혁신적인 제품에 대한 소비자의 결정에는 많은 요소가 영향을 미친다(그림 15-1 참조). 이 장은 먼저 혁신이란 무엇인지를 살펴본다. 그 다음으로, 새로운 제품의 채택은 소비자의 혁신성 또는 채택 역기에 영향을 미친다는 점을 탐구한다. 마지막으로, 신제품이 시장 내에서 신제품이 얼마나 빨리 확산되는지에 영향을 미치는 요인을 살펴본다.\n 15-1 혁신\n 성공적인 신제품을 개발할 수 있는 역량은 기업의 매출, 미래 성장, 장기 생존 관점에서 있어 핵심적이다. 스위스 식품회사인 네슬레(Nestle)의 최고 경영 팀은 그들의 전략에 혁신이 매우 중요하다고 생각하기 때문에, 개발이 가장 잘 장착되어 있는 10대 제품에 대해 혁신 보고서를 발간 및 보고 있으며, 근본적인 과학의 연구와 적용을 통해 높은 영양소를 공급하는 저렴하고 영양가 있는 제품과 갈수록 미네랄이 풍부한 식품의 출시를 대체 중요하게 있다. 더 넓은 혁신을 위해 네슬레는 농업과 과학 분야의 파트너의 협력하여 환경을 보호하고 생산성을 높일 수 있는 관행을 개발할 수 있는 새로운 연구소를 건립했다. 기업의 마케팅 수익성에서 신제품이 수행하는 역할만큼 범위를 보며, 마케터가 신제품과 신제품이 시장에서 성공하게 만드는 요인을 이해하는 것은 중요하다.\n 15-1a 혁신에 대한 정의\n 신제품 또는 혁신(innovation)이란 시장에 내놓는 새로운 제품이다. 넓은 의미로 정의하면, 혁신은 새로 시장에서 소비자에게 배당군 인식되고, 기존 소비 패턴에 영향을 미치는 제품, 서비스, 수업 또는 수", "source": "20261114_151401.jpg"}, {"kind": "heading", "text": "15-1b 참신성의 정도에 따른 혁신 유형", "source": "20261114_151405.jpg"}, {"kind": "paragraph", "text": "아이디어3\n 제품, 서비스, 속성, 포장과 아이디어는 실제로 그림든 그렇지 않든 간에 소비자에 의해 새로운 것이라고 인식되면 혁신이다. 시장에 새로운 제품들을 출시한다고 하더라도, 제품에 대해 소비자가 그다지 특별한 것이 없다고 인식하지 않는다면 실패할 것이다. 또한, 일부 소비자에게는 새롭지 않은 것이 일부 다른 사람들에게는 새로운 것으로 여겨질 수 있다. 예를 들어, 미국은 여러 서구 국가의 소비자들에게는 광부들로 간주되는 특정 가전제품과 전자제품, 개별소장구의 소비자에게는 완전히 새로운 것으로 여겨질 수 있다. 반면에 미국의 유럽 소비자는 개별소장구의 소비자가 오랫동안 사용해 온 것을 새로운 것으로 여길 수도 있다. 유럽연합은 모프자기와 여러 국에서 유럽, 미국 시장에 일반적으로 사용되지 이전에 유럽산 최신의 통합용품을 출시했다.\n 혁신은 물리적 말미와 취득, 소비, 처분 패턴의 변화가 수 있다·있다; 예를 들어, 호텔 앱은 우리가 호텔을 추 검심하고, 선택하고, 체크인하고하는 방식을 변화시켰다·가상 현실은 우리가 엔터테인먼트를 즐기는 방식을 새롭게 만들고 있다. 알고리즘은 목적지로 가는 가장 빠른 물질을 찾는 방법을 변화시키고, 유전자 검사는 소비자가 자신의 자손의 건강 상태를 알아보고 그에 따라 행동할 수 있게 한다.\n마케터는 다음과 같은 세 가지 주요 측면에서 혁신을 분류한다. (1) 혁신 유형, (2) 혁신이 제공하는 혜택의 유형, 더 나아가 소비자는 공동 창조(cocreation)를 통해 혁신 과정에 참여하는 열의 증가하고 있다.\n 15-1b 참신성의 정도에 따른 혁신 유형\n 혁신을 분류하는 방법 중 하나는 혁신에 따라 소비 패턴이 변화하는 정도에 따라 분류하는 것이다7\n ● 연속적 혁신(continuous innovation)은 기존 소비 패턴에 대해 제한된 효과를 갖는다. 혁신 상품이 기존 상품이 이전에 사용되던 것과 같은 방식으로 사용되는 경우이다. 쉽게 예상할 수 있는 바와 같이, 대부분의 신제품은 연속적 혁신이다. 예를 들면, 삼성은 1,800만 화소의 갤럭시 Z플드 4와 1,000만화소의 갤럭시 Z플립 4를 새롭게 선보이고 있다. 이 휴대폰들은 높은 반으로 접히지만, 화면이 스마트폰보다 더 넓은 시각적 공간을 제공할 수 있다. 뿐만", "source": "20261114_151405.jpg"}, {"kind": "paragraph", "text": "놀라운 디자인 덕분에 차만이 흠집과 파손으로부터 보호될 수 있다. 하지만 시장에서의 성공을 의확하게, 주요 스마트폰 제조사들은 이미 기존의 것을 개조한 제품을 확대판으로 개발하고 있다. 물론은 시장이 불만품질의 높은 가격을 받아들이지 않아야하며.\n 동적 연속적 혁신(dynamically continuous innovation)은 소비 관행에 대해 뚜렷이 평범한 효과를 갖는다. 전기차는 판매 동적 연속적 혁신으로 간주되었다. 전기차는 원전에 대한 인연료원을 사용하였기 때문에, 운전자가 수행할 수 있는 거리와 주차 장소, 차량 정비 필요한 것, 소비자들이 이 필요로 하는 주변 제품에: 전기기계가 필요하지 않은 제품(예: 주유소)에 영향을 미친다.\n 단절적 혁신(discontinuous innovation)은 이전에 같은 것이 알려져 있지 않을 정도로 새로운 것이다. 비행기나 인터넷 서비스가 출현함으로써 소비자의 소비 행동은 근본적으로 변화되었다. 단절적 혁신의 예로는 하루, 매타버스(3D 가상 세계) 사례의 네트워크는 2030년까지 5천 명의 사용자를 보유하고 82%에서 15조 달러 이상의 가치를 얻게 될 것으로 예상된다. 이러한 차세대 인터넷의 기반이 되는 가상현실 기술은 하나의 컴퓨터에서 작동되며, 불현의 사람들이 다른 사람들과 대화하고, 게임을 즐기며, 콘서트를 보고, 데이터를더블 즐기고, 교육하고, 정당혼스 하는 데 사용되며, 심지어 일을 하는 데도 쓰인다. 일부 학자들이 주장했던 3D 프린팅은 이제 단절적 혁신으로, 의료(3D 프린팅 귀), 여행(여 가방 설 적), 주방(3D 프린팅 케익틀), 개인화 3D 프린팅 사무실 건물은 17억 달러의 원군품), 환경, 장놈욕(3D 프린팅 부품, 장난감 및 게임(맞춤 제작과 빠른 제조 가능)과 같이 다양한 산업을 급격적으로 변화시키고 있다.11\n 동적 연속적 혁신과 마찬가지로 단절적 혁신도 주변 기기나 관련된 혁신을 만들어 내는 주제가 될 수 있다. 예를 들어, 사용자가 컴퓨터 기능과 인터넷에 접속할 수 있도록 디자인된 안경인 구글 글래스(Google Glass)가 출시되자, 개발자들은 소비자 기타 사용자를 위해 제품에 맞춘 점검된 탐색 애플리케이션(add-on app.)을 만들어 냈다. 어떤 앱은 의료 전문가용이었고, 어떤 앱은 광고 작업용였고, 어떤 앱은 다양한 사용자를 겨냥하고 있었다.12 이제, 차세대 구글 글래스가 증강 현실 세계에 진입하여 소비자 시장을 목표로 하고 있다.13\n 혁신이 매우 새롭고 단절적일 때, 소비자가 그 본질을 이해할 수 있도록 도움을 줄 수 있다. 예를 들어, 새로운 와인 스타일을 “자신만의 와인 바를 가는 것과 같다.”라고 설명하고 “병에 남아 있는 와인은 보존하면서 와인을 사용할 수 있다.”고 말하면 소비자들이 이 새로운 제품이 무엇을 하는지 이해하는 데 도움이 된다.14 새로운 혁신적인 제품은 경쟁 브랜드가 해당 제품 카테고리에 진입하지 않은 것처럼 보이게 만들어 시장의 판도를 뒤흔들 수 있다.15\n 연속적 혁신, 동적 연속적 혁신, 단절적 혁신이라는 혁신 유형에 근거해서, 혁신은 새로운의 연속성에서의 참신성의 정도에 따라 더 상세하게 다를 수 있다(그림 15-2 참조). 즉 혁신은 연속적, 동적 연속적, 또는 단절적으로 구분할 수 있지만, 혁신의 단절성은 연속선상에서 설명될 수 있다.", "source": "20261114_151410.jpg"}, {"kind": "heading", "text": "15-1c 제공된 혜택에 따른 혁신 유형", "source": "20261114_151414.jpg"}, {"kind": "paragraph", "text": "참신함의 정도에 더하여 혁신은 제공하는 혜택의 유형에 따라서도 나눌 수 있다.\n ■ 기능적 혁신(functional innovation)은 기존 대안에 비해 더 나은 기능적 성능에 따른 혜택을 제공하는 것이다. 예를 들면, 애플(Apple)의 에어태그(AirTag)는 소비자가 잃어버린 수하물을 찾는 데 도움을 준다. 항공 여행을 실행하면서 소비자는 자신의 수하물이 자신이 있는 곳과 동일한 나라, 아니면 완건히 다른 장소로 가는 비행기에 실렸는지 알 수 있다.* 또 다른 기능 혁신의 예로는, 미국주류협회의 심판이 정확한 판정을 내릴 수 있도록 지원하기 위해 와인, 수돗물, 3D 센서, 레이저 및 기타 기술을 테스트하고 있다!* 기능적 혁신은 종종 제품을 기존 대안과 구분 짓는 것으로 만드는 새로운- \n ■ 쾌락적 또는 미학적 혁신(hedonic or aesthetic innovation)은 미학적 욕구, 쾌락 추구 욕구, 감각적 욕구 등의 소구하는 것이다. 새로운 형태의 팝댄스, 운동, 새로운 유형의 음악, 새로운 복장 스타일, 새로운 유형의 음식 등이 모두 쾌락적 혁신(경험적 또는 미학적 혁신이라고도 함)에 해당한다. 기술이 다양해지면서 다양한 쾌락적 혁신이 가능하게 되기도 한다. 예를 들면, 음료와 관련기술인 믹솔로지스트(Mixologist)(바의 믹스트올로지에서 알코올 음료를 혼합하는 사람들- 역자주)가 더 나은 음료를 만드는 데 도움을 준다. 믹솔로지스트는 감각기의 오곡원을 사용하여 오르공에서 솟아올 맛이 나는 위스키를 만들 수 있다. 회전증발농축기(Rotary Evaporator)라는 제품은 증발 기법을 사용하여 원하지 않는 성분을 제거하고 다른 성분의 풍미를 증폭시킬 수도 있다. 이처럼, 쾌락적 혁신은 차별화 요소이기도 하고, 소비자가 제품의 성능에 대한 평가를 처리하는 데 영향을 미치기도 한다.\n ■ 상징적 혁신(symbolic innovation)은 사용자와 소유물에 대해 새로운 사회적 의미나 가치를 부여하", "source": "20261114_151414.jpg"}, {"kind": "heading", "text": "혁신과 공동 창조", "source": "20261114_151420.jpg"}, {"kind": "paragraph", "text": "창유이다. 상징적 혁신은 특정 소비자 집단에 의해 반복적으로 활용되면 새로운 제품뿐인 경우도 있다. 따라서 혁신은 활용범위로서, 소비자의 집단 소속감에 대해 의미가 전환되는 경우이다. 특정 인종, 연령, 성별 집단에서 소속감을 전달하는 새로운 스타일의 복장은 상징적 혁신의 한 사례로 간주할 수 있다. 어떤 경우에는 새로운 것이 제품 자체가 아닌 제품의 의미일 때도 있다. 예를 들면, 무스는 한때 주로 라틴계 젊은 남성들 사이에서 남성다움(machismo)의 매개 과시의 상징이었으나, 오늘날엔 신세 예술적인 형태로 간주되며, 모든 연령대의 남녀에게 인기가 있다.\n 로봇공학, 자동화, 인공지능 등은 통행 일부 기업에서는 로봇 노동력으로 사람을 대체할 수 있게 되었다. 연구에 따르면 소비자는 상징적 제품이나 서비스의 혜택이 새로운 기술의 물질적 혜택을 선호하는 않는 상징적인 제품으로부터 나타난다. 상징적인 제품의 혜택이 돌이킬 수 있는 혜택은 여가 시간이 더 잘 제공할 수 있다고 믿기 때문이다.19 일부의 상징적 혁신은 소비자에게 눈에 띄고 주목받을 수 있는 기회를 제공한다. 다른 사람들이 존재하므로 소비자는 이러한 혁신적인 제품을 구매하려는 의지가 높아지게 된다.20\n 혁신은 제공하는 혜택의 유형에 따라 설명할 수 있지만, 실제로 수많은 신제품은 혁신 유형을 혼합한 대변한다. 뉴트리션 바(Nutrition bar)와 같이 어는 제품들은 기능성 혜택으로부터 디자이너였지만, 맛있다는 쾌락적 혜택과 건강에 유익하다는 사회적 의미와 결합된였다.\n 15-1d 혁신과 공동 창조\n 전통적으로 기업에서는 고객의 욕구와 구매 패턴, 고객의 특별한 요청, 신기술을 유지한 수준의 마케팅 투입들에 대한 상체된 지식에 기반하여 새로운 제품들을 개발함으로써 혁신 과정을 통제해 왔다.\n 그러나 오늘날에는 많은 기업이 공동 창조론 통해 혁신을 추구하고 있다. 공동 창조(co-creation)란 신제품 개발에 대한 참여를 통해, 기타 마케팅 활동의 전형 과정에 소비자를 적극적으로 참여시키는 것을 의미한다. 참여형 소비자는 종이에 없기때문에 신제품에 대해 흥을 즐기고, 아이디어를 평가하며 혁신 과정을 오래 관찰하여 확인함으로써 만족감을 얻는다. 기업의 관점에서는 제품 전세에 주류 시장을 대상으로 개발할 수 있는지에 대해 상상력을 발휘할 수 있는 역량을 가진 소비자를 참여시키는 것이 특히 유용하다.22 예를 들면, 그림 15-3의 비비 맨 부모 및 보호자가 함께 공동 창조한 비비 앤 블룸(Vivi and Bloom) 베이비 워시 및 샴푸라는 신제품을 소개한다. 이 회사의 모듈을, 유럽인을 공급되는 무독성 천연 성분을 사용하고 있다.\n 공동 창조를 통해 얻은 신제품 아이디어의 폭발은 소비자가 아이디어 생성 작업에 주의를 기울이는 방식에 따라 달라", "source": "20261114_151420.jpg"}, {"kind": "heading", "text": "15장 혁신: 채택, 저항, 확산", "source": "20261114_151422.jpg"}, {"kind": "paragraph", "text": "점을 수 있다. 예를 들어, 당면한 문제와 직접적으로 관련된 정보만으로 아이디어를 제안하는 소비자는 관련성이 없어 보이는 정보까지 활용하는 소비자에 비해 참신하고 유용하며 매력적인 신제품 아이디어를 도출하기 어렵다.23\n 인터넷과 소셜 미디어로 인해 판매자와 소비자가 상호작용하기 위한 관리하고 접근 가능한 플랫폼을 구축할 수 있게 되었으며 공동 창조 활동은 가속화되고 있다. 소비자가 참가할 수 있는 한 가지 방법으로는 신제품 아이디어를 제시하고, 다른 소비자의 아이디어에 대해 투표하는 방식이 있다. 델(Dell)에서는 이러한 목적을 가진 아이디어스톰닷컴(ideastorm.com)이라는 사이트를 개설했다. 여기에 가장 활발하게 소비자 참가자는 200개 이상의 아이디어를 제안했고, 다른 사람의 아이디어 수천 개에 대해 투표했다.\n 공동 창조의 잠재적 혜택은 다음과 같다.24\n ■ 공동 창조에서 나오는 혁신은 소비자 욕구에 더 잘 맞을 수 있다.\n■ 소셜 미디어나 웹사이트를 통해 아이디어를 수집하는 것은 상대적으로 신속하고 저렴하다.\n■ 공동 창조에 소비자를 참여시키는 것은 기업과의 관계를 강화한다.\n■ 제품을 선택하는 과정에 참가한 소비자는 해당 제품에 대해 더 큰 소유욕을 보인다. 왜냐하면 이들은 심리적 소유감을 느끼게 되기 때문이다.25\n 15-1e 혁신의 결과\n 혁신으로 말미암아 이전에는 없었던 상대적인 혜택과 이점을 경험받을 수 있지만, 사회 전반적으로 봤을 때, 항상 좋기만 한 건 아니다. 일부 혁신은 분명 사회에 도움이 된다. 그중에는 중동과 북아프리카에서 항상 통화와 스마트폰 앱을 사용하여 의료 서비스를 제공하는 이질헬스(easal)과 같은 건강 상담 스타트업도 포함된다. 이 지역에는 의료 서비스를 필요로 하", "source": "20261114_151422.jpg"}, {"kind": "heading", "text": "15-2 저항 대 채택", "source": "20261114_151427.jpg"}, {"kind": "paragraph", "text": "환자 수가 의료 서비스를 제공할 의사 수보다 훨씬 많다.³¹ 그러나 혁신이 때로는 부정적인 사회적 결과도 가져올 수 있다. 한 연구에서 오스트레일리아 담뱃값 상단 한 원주민 부족 내에서 강철 도끼의 확산을 조사한 적이 있다.³² 이 혁신이 도입되기 전에는 돌도끼가 그 부족의 주요 도구로 사용되었다. 이 도끼는 오직 남성들만 사용하였으며, 결혼한 주임자가 일을 할 대가로 전달되었으며, 일반적으로 어느 남성의 권력과 위상의 상징으로 여겨졌다. 그러나 이러한 사회 시스템에 전파되기 전철 도끼는 거쳐야 할 남성, 여성, 아이들에게 나뉘는 것이었다. 이 분배의 결과는 남성의 복수 구성원들 간의 생활과 연령에 따른 역할 차이를 강화하고 전체 사회 체제의 역량을 미화했다.\n혁신은 다음과 같은 또 다른 부정적 사회적 결과를 초래할 수도 있다. 아이폰(iPhone)과 같은 장치는 사진 촬영, 문자 전송, 음악 감상, 비디오 시청뿐 아니라 이메일, 인터넷 검색, 그리고 우리가 필요와 목표를 충족시키기 위한 다양한 기타 애플리케이션을 사용할 기회를 제공한다. 그러나 이러한 장치들은 가정이 당연히 기대해왔던, 또 사회에서 일반적으로 기대해 왔던 가족별 정례를 훼마하게 만들었다는 주장도 있다. 많은 부모들은 자녀와 함께 있을 때 텔레비전을 차단하고, 혼자 있을 때만 시청하기를 솔리하며, 시간을 보내는 것은 때때로 사용해서 안 되는 모덤 휴대전화 사용의 경우와 같다. 많은 사람들은 무시하기도 한다. 휴대전화는 여러 해 동안 사람들이 과도하게 정체된 삶의 모습을 지배한 우울한 유형 중 하나이기도 하다.\n이러한 혁신과의 상호 관계를 반영한 일화로 데버리 시암이 있다. 한 메신저는 그림 15-4가 나타내는 것처럼 사이버 폭력에 대한 매우 부정적인 기회를 창출했다.³³\n 또한 혁신은 부정적인 사회경제적 결과를 초래하기도 한다. 예를 들어, 버드의 연구자들은 CAT 스캐너 하나만으로는 고객 수가 적다는 두 가지 중요한 사회적 결과가 규명되었다. 첫째, 기술이 도시 빈곤 지역에 살고 있는 가족들에게는 활용되지 못했다. 혁신은 일반적으로 부유한 시장에 한정되는 경향이 있다. 둘째, 혁신을 활용하는 것은 고가이므로, 건강관리 비용을 증가시키는 요인이 된다. 또 다른 사례로서, 선진국에서 소비자 교육(사회화)에 따르지 않는 경우에는 전자 결제 시스템의 확산으로 말미암아 대출이 증가하여 부채가 증가했다.³⁴ 마케터, 정책 수립자와 소비자는 혁신의 채택과 확산에 따르는 잠재적인 예상치 못한 부정적 경제적 결과를 우려하며, 부정적 효과를 예방하거나 최소화하도록 노력해야 한다.\n 저항 대 채택\n 많은 회사가 새로운 서비스의 성공에 공을 들이기 때문에, 마케터는 어떤 소비자나 가정이 신제품을 사거나, 채택하기로 마음먹기까지의 과정을 이해할 필요가 있다. 처음에 마케터는 소비자가 신제품을 채택하는 것을 고려하려는 합지, 또는 그것을 사거나 사용하는 것에 저항할지에 대해서도 알고 싶을 것이다. 예를 들어, 의료 분야는 인공지능에 의해 변화되고 있지", "source": "20261114_151427.jpg"}, {"kind": "heading", "text": "15-2a 소비자가 신제품을 채택할 것인가", "source": "20261114_151430.jpg"}, {"kind": "paragraph", "text": "단, 소비자는 자신의 독특한 상황을 이해하는 데 인간이 더 능숙하다고 생각하여 의료 AI에 재항하는 것으로 나타났다.35 추천의 영역에서, 소비자는 AI 기반 추천이 쾌락적인 영역에서는 인간의 추천보다 나쁘지만 실용의 영역에서는 더 나은 것으로 믿고 있다. 그래서 소비자들은 쾌락적인 영역에서는 AI 기반 추천에 저항하게 된다.36 마케터는 또한 소비자들이 어떻게 제품을 채택하고, 신제품을 살지 여부를 결정하는지 알고 싶을 것이다. 예를 들어, 자신보다 더 뛰어난 사람과 자기 자신을 비교하는 경우, 전반적 사고방식이 강한 사람들은 혁신의 혜택에 집중하여 제품을 채택할 가능성이 더 높다. 반면에 분석적으로 생각하는 사람들은 혁신의 위험에 집중하기 때문에 새로운 제품에 저항할 가능성이 높다.37 따라서 매우 위험하다고 인식된 소비자가 일반적으로 먼저 혁신을 구매하는지, 다른 소비자가 채택한 뒤 그것을 구매할 것인제에 대해 흥미가 있다. 심지어 소비자가 자신만의 익전적 혁신을 구혀할 때 영향을 줄 수 있다. 예를 들어, 어두운 조명은 억제력을 줄이 는 경향이 있기 때문에, 이처럼 조명된 환경에서 결정을 내리는 소비자는 혁신적인 제품을 더 구매할 가능성이 있다.38\n 채택(adoption)은 소비자가 신제품에 저항하지 않을 때에만 발생한다. 혁신에 저항하는 소비자는 그것을 사라는 외압과 마주했을 때조차 사지 않기로 결정한다.39 저항과 채택은 별개 개념이다. 개인은 채택까지 나아가기 이전에 혁신을 시도해보거나 구매하는 것에 저항할 수 있 다. 제품을 채택한 경우, 소비자가 스스로의 이유로 모든 구매에 대한 저항을 극복했 것으로 가 정할 수 있다. 그렇지만 소비자가 혁신에 저항하는 이유와 시기를 이해해야 한다. 저항이 너무 늦을 때까지 전혀 드러나지 않으면, 세분 집단의 태도에 숨겨진 저항이 그 혁신의 시장에의 진 출을 방해하고 제품이 실패할 수 있다. 일반적으로 마케터는 다양한 제품을 사용하면서 소비자 혁신에 대한 채택 과 저항을 연구해왔다. 이와 버튼과벗님의 본문에서는 주로 신기술 제품 소비자 가 활용되는 사회 시스템, 그리고 그러한 시스템 내 마케터 전략은 모두 소비자의 혁신에 대한 저항에 영향을 미친다.\n 그림 15-5는 스마트폰 또는 스마트폰 이외의 휴대전화를 채택한 사람(국가별)의 비율을 보여 준다. 한국에서는 성인 인구의 100%가 이러한 장치 중 하나를 소유하고 있다. 미국인은 약 논 나라의 94%인 반면 인도에서는 56%에 가까운데, 이 세 제품을 채택하지 않은 사람은 아마도 그것에 저항한 것이다. 반면에 소비자가 상호작용이 가능한 디지털제품에 느린 채택이 이루어 지면, 다른 국가들은 거의 같은 채택 경향이 있다고 한다.41 소비자가 기존의 이미 익숙한 제품이나 서비스를 계속해서 이용하는 편이 더 간편하거나 선호하기 때문에 신제품을 사용하는 것에 저항한다.\n 저항(resistance)은 소비자가 새로운 제품을 사용하는 행위가 어려움을 내포한 것이라고 생긱한다면 크게 나타날 수 있다. 공훈한 연구에 의하면 기술 선도 기업 간인 장기적인 사람 같은 인 더된(internet of things: IoT)의 일부로서의 스마트워크나 가전제품들의 느린 채택의 이유 중 하나이 다. 또한 연구자들에 따르면 변혁 욕구와 인지 욕구(needs for cognition: 개인이 생각에 빠져있는 생각 자체를 즐기는 성향ㆍ 흥미)가 낮은 소비자가 혁신에 저항할 가능성이 가장 높은 반면에, 변혁 욕구와 인지 욕구가 높은 소비자는 그런 가능성이 가장 낮다.43 또한 소비자가 브랜드와", "source": "20261114_151430.jpg"}, {"kind": "paragraph", "text": "자신을 동일시할 때, 다른 브랜드가 출시한 신제품으로 전환하는 것에 저항할 것이다.44\n 흥미롭게도, 새 제품에 대한 불안이 혁신에 대한 저항에 대한 저항에 영향을 줄 수 있다고 추측할 수 있다. 그러나 소비자가 혁신이 자신을 돕는 것이라는 강한 희망을 가질 때, 불안은 제품을 구매할 가능성을 높일 수 있다. 희망과 불안의 조합을 통해 소비자들은 새 제품을 구매함으로써 희망하는 것이 실현되도록 하고, 걱정되는 일이 일어나지 않도록 어떻게 할 수 있을지 모색하게 된다.45 소비자의 신제품에 대한 희망에 있어서, 안타깝게도, 혁신은 언제나 그가 직면하는 어느 정도의 위험을 수반한다. 또한 소비자는 새로운 서비스에 저항할 가능성이 더 큰데, 그것이 수반하는 위험과 불확실성 때문이다.46 우선순위가 진보와 성장의 촉진 조건을 갖춘 소비자는 최소한의 위험이 부각되지 않는 한 새로운 서비스는 채택할 가능성이 더 크다.", "source": "20261114_151434.jpg"}, {"kind": "heading", "text": "15-2b 소비자는 어떻게 신제품을 채택하는가", "source": "20261114_151437.jpg"}, {"kind": "paragraph", "text": "소비자가 신제품을 채택하는 방식은 의사 결정에 노력이 얼마나 드는지에 따라 달라질 수 있다. 그림 15-6a 상반부에 표현된 고노력 위계적 효과 모형(high-effort hierarchy of effects)은 일정 강도에서 단계로 고노력 정보 조사, 태도 형성, 판단과 선택 과정에 해당된다. 이때 소비자는 신제품에 대해 알게 되고, 그 것에 대해 생각해 보고, 조사한 후에, 이 정보를 토대로 채택(또는 비채택)을 하게 된다. 이 과정의 경우에 소비자는 제품을 사용해 볼 수 있다. 이러한 시도구매(trial)을 통해 소비자는 최종적인 채택 여부를 결정할 수 있다.\n 소비자를 설득하는 데 중요한 것은 소비자가 신제품이 경쟁뿐만 아니라 심리적, 사회적, 위계에 대한 저항과 같은 각종 위험, 예를 들어, 소비자는 새로운 제품을 사용할 수 있는 것이 새롭다는 것에 대한 거부감이 있고, 다른 이들이 그것을 먼저 사기를 기다린다.\n 소비자 채택은 비연속적(discontinuous)연속적(continuous)한 반니 개념인 데 고노력 채택은 때로 이들 중 어느 하나로 일어날 수 있다. 개입도가 높지 않은 상황에서의 경우에는 사람들은 제품을 바칠을 비연속적인 방식으로, 이 경험에 경쟁을 이해하고 평가하기 이전에 이 많은 정보를 필요로 한다. 또한 소비자는 채택 과정을 가속이나 전단에서와 같이 많은 사람이 일정에 관여할 때 사용할 수 있다.\n 소비자가 처음 위험을 내포하고 있을 때에는 연속적인 혁신에 더 적은 사람들이 구매와 정에 개입이 있을 때, 의사 결정 과정을 모도 15(6)에 표현된 것보다 저노력의 위계적 효과 모형(low-effort hierarchy of effects)의 의거할 수 있다. 이 과정에서 소비자는 제품을 사용하기 전에 그것에 대해 고려하고 조사한 후 그 결과에 따라 태도를 형성하는 것이 아니라 일부 듣거나, 태도가 긍정적인 경우에 신제품을 채택한다. 저노력 위계적 효과 모형에서는 신제품에 대한 의식과 그것에 대한 시도난 채택 사이의 시간 간격이 올을 수 있다.", "source": "20261114_151437.jpg"}, {"kind": "heading", "text": "15-2c 소비자가 신제품을 채택하는 시기", "source": "20261114_151443.jpg"}, {"kind": "paragraph", "text": "소비자가 신제품을 채택하는 시기는 다양하다. 그려 15-7에 표현된 프레임워크에서는 다섯 가지의 채택자 집단은 그들의 채택 결정 시기에 따라 나누어진다. 처음 신제품을 채택하는 시장의 2.5%인 혁신자(innovator)로 불린다. 그 다음 13.5%는 초기수용자(early adopter)이다. 그다음 34%은 조기다수자(early majority)로 불린다. 그 다음 34%는 후기다수자(late majority)이고, 마지막으로 제품을 구매하는 16%는 후기채택자(laggard)라고 불린다.\n 채택자 집단의 특성\n 채택자 집단들은 그들에 드러나는 바와 같이 다양한 특성을 보이는 경향이 있다. 예를 들어, 기존에 대해 열정적인 애호자들로는 신기를 제품들을 제일 먼저 갖고 싶어하는데, 몇 가지 오류나 비효율성을 지니고 있다고 하더라도 그러하다.52 애플 아이폰의 광팬들은 매번 신모", "source": "20261114_151443.jpg"}, {"kind": "paragraph", "text": "버전의 첫 구매자가 되기 위해 둘레의 애플 매장 앞에서 몇 시간씩 기다리는 것으로 알려져 있다. 몇몇 전자 게임팬도 비슷한 종류의 열정을 보인다.\n초기가용자는 제품 발주의 선도자이다. 그들은 새로운 제품들의 특징보다는 업무 방식 에 혁신적인 돌파구를 마련한다는 점에서 높이 평가한다.\n조기다수자는 신중한 사람들이다. 그들은 현존하는 제품에서 증가할 것으로 예상되는 발 전을 예의 주시하는 수구적인 반면, 다양한 위험을 감수할 용기가 없다. 때문에 혁신을 만드는 사람들과 사이 평판이 얼마나 좋은지를 중요시한다. 신제품이 자신이 몸담고 있던 현재 상황 범위 및 사용규모와 충 돌지 않는지 있고, 그것을 믿을 수 있을지 우려한다. 가격에 민감하고 경쟁사들이 시장에 좀 더 견고한 입지를 구축할 때까지 기다리면 비용인 혜택을 볼 수 있고 경쟁자의 정책에 대한 믿음을 굳건히 할 수 있기 때문이다. 더 많은 경쟁자가 존재하면 가격을 하락시킬 수 있다.\n후기다수자는 더욱 보수적이고, 진보를 두려워하며, 전통에 의존한다. 그들은 보통 절반 가까운 사람들이 이미 어떤 특정 제품을 구입하고 그 구입으로부터 혜택을 얻는 것을 목격한 후에 비로 소 그들의 결정을 내린다. 그들은 신제품을 사는 것이 어떤 기업의 품질과 서비스에 관계가 있음을 알고 있 지만 그것을 얻기 위해 상당한 가격을 지불하고자 하지 않는다. 그들은 패션에 뒤떨어지는 경향이 있지만, 보통 그들로부터 동조를 이끌어냄으로써 혜택을 얻고자 하는 회사에 대한 평균적인 잠재 고객보다 많은 수 의 친구를 보유하고 있다. 소비자들이 어떤 혁신을 수락할지를 불구하고 거절하는 이들에게 신제품에 대 해 의회적으로 이해할 만한 개념을 줄 수 있다. 예를 들면, 이전 사람들의 신제품에 대해 의문을 제기하는 후기다수자는 한 업소를 스마트한 업종으로 발돋움시켜 줄 기계나 어느 디지털 장치, 특 별한 조 특성을 활용하지 못할 것이라고 두려워하는 것인가? 만약 때는 후향과 유형의 범람을 걱정하는 것 인가? 이런 질문들에 대한 대답은 회사들이 후기다수자에게 더욱 효과적으로 접근하는 데 도움을 줄 수 있다.\n 채택자 집단 범주의 활용\n 채택자 집단의 중요성은 신제품이 시장에 출시되었을 때 모든 집단에 매력적으로 보여야 한다는 점이다. 그러나 잠재적으로 유용한 많은 신제품이 시장에 널리 알려지지 못했는데, 홍보 계획이 채택자 집단의 특성을 고려하지 못했기 때문이다. 이러한 예로는 애플 뉴턴 메시지 패드(Apple Newton Message Pad), 폼릴(flip) 포켓 캠코더, 온라인 신용 거래 플랫폼 플롭(floop) 등을 들 수 있다.\n채택자 집단의 다섯 가지 분류 체계는 누가 다른 집단과 비교해 언제 신제품을 채택하는지에 대한 유용하지만 어느 정도는 이상화된 척도이다. 즉, 혁신에 따라 채택자 집단의 수와 비율이 달라질 수 있다는 뜻이다. 신제품 론칭의 우호적인 수용은 혁신의 위상과 시장에 달려갈 수 있다. 예를 들면, 베스파(Vespa) 스쿠터가 유럽에서 유행하는 아이템이 되었을 때 미국의 일부 초기수용층도 제품이 미국 시장에 출하되기 전에 수입했다. 이러한 소비자들은 조기혁신자(precinnovator)라고 할 수 있는데, 공식적으로 소개되기도 전에 신제품을 채택하기 때문이다.\n또한 채택 곡선의 모양은 일반적인 종 모양(bell-shape)과 다를 수 있다. 제품에 따라 채택 곡선은 편천 채택 곡선(급격한 상성제), 또는 가끔은 급격한 하락세에서 보이는 오른쪽으로 치우친 모습이 보이거나, 또는 특정 건강 관련 혁신(급격한 하락세에서 보이는 왼쪽으로 치우친 모습)이 있을 때도 나타날 수 있다. 그림 15-7에 나타난 종 모양 곡선을 형성하는 채택자 구성비를 끌어들이는 대신, 어떤 제품은 첫 10%의 채택자들을 위해서, 그 다음 60%를 초기수용자, 그", "source": "20261114_151447.jpg"}, {"kind": "paragraph", "text": "다음 30%를 초기채택자, 그 다음 5%를 후기다수자, 그리고 마지막 5%를 후기채택자로서 할당할 수 있다. 마케터가 채택자 집단과 채택 곡선의 개념을 유연하게 사용해서 몇 개의 집단이, 어떤 크기로, 어떤 시기에 소비자들이 회사가 활동하는 특정 시장에서 신제품을 채택하는지를 검토해야 한다. 이번 장의 뒷부분에서 신제품의 확산에 대해 기술할 때 이 문제에 대해 다시 한 번 설명하겠다.", "source": "20261114_151452.jpg"}, {"kind": "heading", "text": "15-3 확산", "source": "20261114_151455.jpg"}, {"kind": "paragraph", "text": "시장에서 더 많은 소비자가 제품을 사용하게 됨에 따라 혁신이 시장에 널리 퍼지게 된다. 즉, 확산이란, 채택 이전의 행동이 반영된 것이라면, 확산(diffusion)은 집단으로서 시장에서의 소비자들의 행동이 반영된 것이다. 더 구체적으로 말하자면, 확산은 특정 시점 전체 소비자(population)중에서 제품을 채택한 사람들의 비율을 의미한다고 할 수 있다.\n마케터는 시장에서 소비자 혁신이 성공적으로 널리 퍼지는 것에 관심이 있기 때문에, 혁신에 관한 주요 쟁점 두 가지를 이해하고자 하게 된다. 시장을 통해 제공물이 어떻게 확산되는가와 얼마나 신속하게 확산되는가이다.\n 15-3a 제공물은 시장에서 어떻게 확산되는가\n 제공물이 시장에서 어떻게 널리 퍼져나가는지를 검토할 수 있는 방법 중 하나는 시간에 따른 채택 패턴을 살펴보는 것이다. 마케터의 관점에서 보면, 특정 수용률을 달성하기 전에 혁신의 생산 비용이 있다고 가정하면, 마케터는 혁신의 생산 비용이 회수되거나 모든 사람이 혁신을 채택할 것이란 보장이 필요하다. 그러나 그런 일은 거의 발생하지 않으며, 현실에는 여러 가지 확산 패턴이 규명돼 왔다.\n S자형 확산 곡선\n 그림 15-8 (a)에 나타난 것처럼, 확산 중 일부는 S자형 확산 곡선(S-shaped diffusion curve)을 보인다. 곡선에 따르면, 채택의 과정은 상대적으로 천천히 시작되고, 예시에 나타낸 시점 1과 2 사이에는 전체 시장에서 상대적으로 적은 비율의 소비자가 제품을 채택한다. 그러나 일정 시간 이후에는 상대적으로 짧은 기간 안에 많은 소비자가 제품을 채택하게 되며, 채택 비율이 극적으로 늘어난다. 시점 3과 4 사이에는 제품을 채택한 소비자의 숫자에서 극적인 증가가 나타난다. 이후에 채택은 점차 줄어드는 비율을 형성하고, 곡선에서 오름세가 멈춘다.\n예를 들면, 전자책과 전자책 리더기의 확산은 최초 시기에는 매우 느렸다. 이후 더 많은", "source": "20261114_151455.jpg"}, {"kind": "heading", "text": "지수 확산 곡선", "source": "20261114_151500.jpg"}, {"kind": "paragraph", "text": "소비자가 기술에 대해 인지하고 알게 되면서 더 많은 기업이 시장에 들어옴에 따라 확산이 커지기 시작했다. 책, 잡지, 신문 같은 다운로드할 수 있는 콘텐츠가 더욱 다양해지고, 라플랑 수준으로 가격이 책정된 기기가 아니든, 반스앤노블(Barnes & Noble) 등의 회사가 이와 같은 틈새에 따라, 수백만 명의 소비자가 전자책 리더기를 구매하게 되었다. 또한 전자책 구독 기능을 제공하는 앱을 설치할 수 있는 브랜치 컴퓨터와 대형 스크린 스마트폰이 대중적 인기를 끌게 되었다. 오늘날 전자책 판매량은 어느새, 하나의 주요 매체가 되었다. 아마존은 2010년대 미국에서 대략 이어졌다. 2021년에는 전자책 판매량이 22% 증가하였으며, 2022년 현재 미국인의 약 33%가 전자책을 읽는다.70\n 지수 확산 곡선 채택 곡선의 또 다른 유형으로는 그림 15-8 (b)에 보이는 지수 확산 곡선(exponential diffusion curve)이 있다.71 영 곡선과는 대조적으로, 지수 확산 곡선(시부문이 누적확률분포를 적용한 확산 곡선_역자 주)에서는 출시되자마자 시장에 많은 비율의 소비자가 제품을 채택함으로써 훨씬 더 빨리 확산이 시작된다. 그러나 시간이 지나면서 채택 증가 속도가 느려진다. 이 곡선의 유용한 예시는 COVID 백신이다. 처음 도입되자마자 관심 있는 사람들은 가능한 한 빨리 접종을 받았다. 그러나 미국에서는 다양한 주(state)에서 의식 많은 소비자를 독려하기 위해 인센티브를 활용했다.", "source": "20261114_151500.jpg"}, {"kind": "heading", "text": "15-3b 확산 곡선의 모양에 영향을 주는 요인 / 15-3c 확산은 어떻게 제품 수명 주기와 연결되는가", "source": "20261114_151503.jpg"}, {"kind": "paragraph", "text": "확산 곡선의 궁극적 형태는 많은 요인에 의해 영향을 받는다. 일반적으로 마케터는 확산이 사회적, 관리적, 경제적 요인이나 상황 또는 물리적 위험과 연관될 때, S자형 확산 곡선이 생길 것이라고 예측하게 된다. 소비자가 제품이 시장에서 장기간 존재하게 될지 여부, 신뢰할 수 있는지 여부를 사전에 파악할 수 있는 능력, 소비자가 기술에 대해 충분한 숙련을 갖고 있는지 여부 등 사회시스템에 내재되어 있는 기술의 양상은 이러한 확산 스타일에 영향을 준다. 불특정 다수에게 영향을 주는 입소문의 상대적 효과를 비롯한 시장 시스템에 내재된 의사전달 양식과 비용은 확산에 영향을 줄 것이다. 예를 들어, 타인의 행동에 영향을 미치기 쉬운 사람이나 전문지를 가진 사람의 비중이 높을수록, 결과가 불확실할 때 사람들은 소문에 의존하려는 경향이 있으므로 확산은 가속화될 것이다. 반대로 구전 의사전달 시스템에서 허구적 정보나 오정보가 차지하는 비중이 높으면 확산은 느려진다.\n 많은 제품과 서비스에서는 소비자 수용 자체가 그리 중요하지 않거나, 완전 비용이 낮거나, 소비자가 신념과 가치관에 근거하여 새로운 제품을 평가하여 사회 시스템 전반에 걸쳐 제품에 대해 입을무르고 하여 제품 확산이 극단적으로 느리거나 갑작스럽게 일어나기도 한다. 예. 혁신 제품 사용에 대한 논의가 시작되거나 기존의 관점이 불안해지기 전, 사회시스템의 어떤 부분이 대부분의 보수적인 사람으로 이루어진 경우이다.\n 15-3c 확산은 어떻게 제품 수명 주기와 연결되는가\n 그림 15-8 (c)에 제시된 제품 수명 주기(product life cycle) 개념은, 제품이 초기에는 도입기로 평가되고, 이후에 경쟁자가 시장에 진입하고, 소비자가 제품을 선택함에 따라 상대적으로 빠르게 성장한다는 것을 보여 준다. 경쟁이 치열해지면, 약한 경쟁자는 단타적인 제품 매출로 정체될 것이다. 일정 시점에 도달하면, 소비자 채택이 사라지면서 제품 매출이 쇠퇴한다.", "source": "20261114_151503.jpg"}, {"kind": "heading", "text": "15-4 채택, 저항, 확산의 영향 요인", "source": "20261114_151508.jpg"}, {"kind": "paragraph", "text": "혁신이 시장에서 빠르게 또는 천천히 확산될 수 있고, 신제품이 성공 여부도 시장 내에서 얼마나 많은 사람이 혁신을 채택하느냐에 달려 있음을 알고 있기 때문에, 마케팅 관리자들은 저항, 채택, 확산에 영향을 미치는 요인들을 이해할 필요가 있다. 혁신의 특성, 혁신이 도입되는 사회 시스템의 특성 같은 다양한 요인을 살펴보자.\n 15-4a 혁신의 특성 저항, 채택, 확산에 영향을 미치는 혁신의 특성은 지각된 가치, 혜택, 비용 등이다.\n 지각된 가치 소비자는 혁신이 기존 대안에 비해 더 큰 지각된 가치(더 큰 지각된 혜택이나 더 낮은 지각된 비용)를 제공할 때 혁신이 가치가 있다고 인식하고자 한다. 높은 지각된 가치를 갖춘 제품은 낮은 지각된 가치를 갖춘 제품에 비해 더 쉽게 채택될 수 있을 것이다. 예를 들면, 스마트폰은 소비자가 커뮤니케이션에 사용할 수 있고 일을 손쉽게 다운로드 받어 설치할 수 있어 오락과 스트리밍 서비스, 게임, 정보적 목적으로는 다양한 용도로 사용할 수 있는 멀티태스킹 매체가 지각되기 때문에 빠르게 채택되었다. 이것은 기존 스마트폰 휴대폰, 전자책 리더, 휴대용 게임기, 휴대용 DVD 플레이어 같은 단일 기능 기기 여러 대를 따로 가지고 다녀야 했을 것에 비해 편리하다. 건설 산업에서 가치를 높일 수 있는 새로운 항목 중 하나는 버스를 이용한 콘크리트 건축, 저택을 만드는 것이다.” 버스는 합쳐지처럼 적용하여 나무 재료로 간단하고 내부가 있으며 내화성이 있는 ‘벽돌로 건립한다.", "source": "20261114_151508.jpg"}, {"kind": "heading", "text": "지각된 혜택", "source": "20261114_151510.jpg"}, {"kind": "paragraph", "text": "소비자에 대한 혁신의 가치는 지각된 상대적 이점(relative advantage)에 의해 영향을 받는 다. 상대적 이점이란 기존 제품의 혜택에 비해 우월한 혜택을 제공하는 정도를 말한다. 새로 운 것이 소비자에게 상당한 혜택을 제공한다는 것은 소비자가 위험을 회피할 수 있거나, 욕구 를 완전히 충족하거나, 문제를 해결하거나 자기 목표를 달성할 수 있도록 해주는 것이다. 이렇기 때 문에 소비자에게 혁신의 수용 결정이 중요만큼이나 어렵다. 실험 연구 결과에 따르면 제품 이점은 신제품 성공에 대한 가장 중요한 요인 중의 하나이다. 또한 연구 결과에 따르면 소비자들은 새로운 제품이 있는 것이 아니라, 제품에서 소비자에게 제공하는 것이라는 점이 우위일 필요가 있다. 따라서 종종 언택트(Ally Beauty)의 화장품 브랜드가 가지는 상대적 장점은 브러시에 나오는 향과, 비타 민, 콜라겐 제공 기능에 있는 것이 아니라 사용자가 브러시를 사용하여 피부의 결을 향상시킬 수 있도록 고안한 구조에 있는 것이다. 물론, 본은 사람이 상대적인 장점으로 보는 것은 다른 사람들이 혜택으로 여기는 것과 다를 수 있다. 예를 들으면, 아마존(Amazon)은 사람들의 목소리로부터 늘 새로 사용하는 알렉사(Alexa) 기장을 비서의 새로운 기능으로 개발 중이며, 이를 위해 필요한 것 은 사람의 잠옷 음악 등을 분석이고, 한편으로는, LVMH와 협력하여 캐리언은 사용을 통해 설렘진 애와 양질전 모델을 개발하고 있다. 이러한 가상 모피가 동물 모피 사용에 대한 윤리적 우려", "source": "20261114_151510.jpg"}, {"kind": "paragraph", "text": "또 전혀 모지를 피하는 소비자들을 유인할 것을 기대한다.81 그렇기에도 불구하고 소비자가 기존 대안이 갖은 혜택에 비해 신제품의 우위를 자각하지 못하거나, 신제품의 우위가 중요하지 않다고만 생각한다면, 혁신은 채택이 되지 않을 것이다. 더 나아가, 소비자는 근본적으로 새로운 제품을 구매하고 사용하는 상황을 구체적으로 그려 보는 데 어려움을 겪곤 한다.82 그렇게도, 신제품에 관한 정보를 받았으면 새로운 혜택의 가치를 볼 수 있는 소비자는 극적으로 재발적인 혁신도 높게 평가하게 된다.83 소비자는 상당히 막막하지의 제품이기 때문에 제품을 재택할 수 있을 때 보수적인 혜택을 더 가치 있는 것으로 인식하고 신다. 사용 혁신(use innovativeness)은 제품을 새롭고 잘 알려지지 않은 목적을 사용하다는 것을 의미한다. 예를 들면, 소비자는 베이킹 소다를 고양이 배변 박스 탈취에 활용하기도 한다.84\n 인지된 비용\n 제품 가치의 또 다른 측면은 인지된 비용이다. 여기서 비용이란 한완을 제품을 채택하는 데 요구하는 금전, 시간, 노력을 포함한 포괄적인 유형의 비용을 의미한다. 대부분의 비용의 높음수 연간 소비자 채택에 영향을 미치는데, 특히 구매 위험이 높을수록 그렇다. 네스카페 파지오(Paggio Past Forward)라는 캡슐는 유럽 내 비디오 홍보로 지타미니데이트(Minten asayson)에 소개되면서 식료품, 음료 최대의 구매를 가능하게 하며 한 사람이 사용할 수 있는 5일치 식료품을 운반할 수 있고, 소비자는 자신의 건강 개선을 위해 동참 수 있다. 지타미니라는 사람을 따라다니면서 무거운 물건을 운반하는 일을 덜어 준다. 그러나 1,850달러의 가격표는 대부분의 소비자에게는 너무 비싸게 다가올 수 있다.85 반면에, 더 저렴한 음악 플레이어는 경쟁과 제조 효율성으로 인해 가격이 하락하게 따라 훨씬 더 빠르게 확산되었다.\n 현재 제품에서 신제품으로 변경하는 데 수반되는 비용인 전환 비용(switching cost) 역시 전체 비용의 일부이다. 예를 들면, 컴퓨터 운영체제를 업그레이드하려는 소비자는 새로운 운영체제와 호환되지 않아서 프린터 같은 주변기기를 교체해야만 할 수 있다.", "source": "20261114_151515.jpg"}, {"kind": "heading", "text": "15-4b 불확실성", "source": "20261114_151518.jpg"}, {"kind": "paragraph", "text": "혁신 촉진을 넘어가서, 혁신은 들쭉날쭉한 불확실성도 채택, 저항, 확산에 영향을 줄 수 있다. 실제로, 연구조사들은 하나의 혁신에 대한 지식이 불확실한 감정을 증폭시킬 수 있다는 것을 발견했다. 소비자들이 대면해야 하는 불확실성은 혁신의 유형에 따라 다르다. 그중 하나는 어떤 것이 산업 표준이 될까에 대한 의심이다. 일부 혁신들은 특정 시장의 케이블에 대한 통일된 산업 표준이 없다는 점이 그 예가 될 수 있다.\n 또 다른 예로는 소비자에게 상당한 수준의 행동적 변화를 하도록 요구하는 제품이 가진 상대적 이점에 관한 불안을 들 수 있다.88 업계의 예측에 익숙하지 않다면, 소비자는 (현존의 혁신에 비해) 단점적 혁신의 우월성에 대해 확신하지 못할 수 있다. 한편, 눈에 보일수록, 신기능을 갖춘 새로운 인터페이스를 접할수록 소비자는 인터페이스 자체에 대해 더 많은 정보를 소비자에게 제공하자, 소비자는 제품이 제공하는 이점에 대해 더 큰 불확신성을 느꼈다. 이러한 현상은 소비자가 새로운 인터페이스에 주의를 덜 기울이게 되며 정보를 처리하려는 과정에서 제품 채택의 부정적 결과를 추론하게 됨에 따라 나타날 수 있다.89\n 불확실성의 세 번째 측면은 제품 수명 주기의 길이에 대한 것이다. 소비자는 유형이나 고정에 비해 길이가 짧은 것으로 유행 상품을 구매하는 데 더 저항감을 느끼게 된다. 예를 들어, 옷을 구입하여 몇 계절이 지나간 것으로 생각하면 길락두려 좀 더 길게 구두를 사는 데 100달러를 쓰는 것을 포기할 것인가? 연구에 따르면 컴퓨터가 수명이 더 긴 배터리를 채용한 것이라고 생각하면 소비자는 새롭게 개발된 컴퓨터 구입을 늦출 것이다. 이러한 유형의 불확실성은 제품이 자주 변경되거나 개선되는 의류나 하이테크 제품 시장에 대해서는 타당한 우려이다.\n 네 번째 불확실성 측면은 유통업자가 그 혁신을 신뢰할 수 있는지 여부이다. 연구에 따르면 소비자는 주관적인 작업예: 최고의 옷가게를 찾는 방법에 대해 객관적인 작업예: 목적지가 가까운 경로보다 알리고줌을 덜 신뢰하는 경향이 있다.\n 마지막으로, 소비자가 지닌 특정한 불확실성에 대해 우려하는 채택 이전 시간의 길이에 따라 다르다. 예를 들어, 먼 미래에 채택하는 경우에 비해 가까운 장래에 혁신을 채택하려고 계획할 때, 전략 비용 같은 불확실성의 불리한 점을 더 우려하게 된다.", "source": "20261114_151518.jpg"}, {"kind": "heading", "text": "15-4c 소비자 학습 요건", "source": "20261114_151523.jpg"}, {"kind": "paragraph", "text": "저항, 채택, 혁신에 영향을 미치는 세 번째 특성은 소비자 학습 요건 즉 소비자가 혁신을 효과적으로 활용하기 위해 해야 하는 것이 무엇인지이다. 이러한 학습 요건은 호환성, 시험 사용 가능성, 복잡성 등과 관계가 있다.\n 호환성\n 소비자는 혁신이 자신의 욕구, 가치관, 규범, 행동과 서로 맞지 않는다고(호환되지 않는다고) 간주하기 때문에 혁신에 저항하고 한다. 혁신이 소비자의 가치관, 규범, 행동과의 호환성(compatibility)이 클수록, 소비자가 혁신에 대한 적응은 쉬워지고 채택 확산은 커질 것이다. 예를 들어, 미국의 의류업체 파타고니아(Patagonia)의 디자인은 오후산(영국군 특수부대에 의해 탈출복으로 고안된 내의, 6,000 피트 이상의 고지나 불모지에서 오랜 시간을 보내야 하는 병사와 특수부대를 위해 만들어진 것)의 기후와의 호환성 때문에 큰 성공을 거두었다.\n 패터슨(Polartec)사의 플리스에서 플리스로 제작한 재킷은 옷을 세탁하기 시작했고, 편리성 가볍고 오래가고 세탁 가능하기 때문에 즉각적인 히트 상품이 되었다. 오늘날 플리스란 환경을 자체로 제품을 만들며 환경친화적인 소구를 하고 있다. 반면, 영국 레핑 휴는 영국의 경우 칠면조는 미국에서처럼 성숙한 제품 범주가 아니고, 영국 소비자는 칠면조 한 마리를 통째로 요리하는 데 익숙하지, 편리함에 기반하여 포지셔닝된 즉석조리용 칠면조 전체 휙제품을 구매하지는 않기 때문이었다. 반면에, 비행 자동차는 큰 호환성 문제를 가지고 있다. 비행 자동차는 입차 공항 또는 전기수직이착륙비행체(eVTOLs)를 만드는 기술은 이미 존재한다. 그러나 가장 큰 문제는 부족한 공역과 활주로 설립의 한계였다. 이러한 장애를 극복하지 못하고 있다. 또한 항공편 수요가 급증하고 이러한 공항 인프라를 경제적으로 수익성 있게 만들기 위해 충분한 장소를 건설하고 허가하거나 폭발적 범람을 아직 결정하지 못했다.\n 혁신이 소비자의 가치관, 목적, 행동과 호환되지 않을 때 상당히 심각한 결과가 초래될 수 있다. 특별한 사례로는 남아메리카, 아프리카, 아시아 지역에서 어머니들에게 영양 분유", "source": "20261114_151523.jpg"}, {"kind": "paragraph", "text": "보급하려고 했던 마케터의 시도를 들 수 있다. 제조업체 광고에서는 예쁘고, 통통하고, 건강한 아기들과 엄마가 함께 있는 사진을 제시했다. 광고 카피는 \"당신 아기에게 사랑과 따뜻한 (Lactogen은 주제와 무관한 다른 브랜드 이름) 우유-아이의 꿈.\"이었다. 광고의 근본적인 이미지는 포동포동, 건강한 소비자의 피부에 고약한 소비자처럼 되기를 바라는 농민 가족을 끌어들였다. 불행히도 대부분의 농민 가정은 현재의 우유의 가격을 감당하기 어려워 영아식품을 몸에 최적화하여 먹였고, 심각한 영양실조를 초래하였다. 더 나아가 아동은 젖꼭지와 병을 소독해야 한다는 사실을 몰랐기 때문에 염증으로 젖꼭지가 부어올라 헐어 아기들이 병에 걸리게 되었다. 따라서 핵심적인 소비자의 행동 간에 혼효작용이 많으며 예상하지 못했던 문제가 발생할 수 있다.100\n 시험 사용 가능성\n 소비자 학습 요인의 두 번째 측면은 혁신의 시험 사용 가능성(trialability)이다. 시험 사용 가능성이란 전체 인구에 한정적 분위기에서 제품이 시험 사용될 수 있는 정도를 의미한다. 예를 들어, 많은 요리사는 새로운 식자재를 구매하는 상점이나 근동구 매에 전에 시식을 해볼 수 있다(그림 15-10의 사례처럼). 많은 스토리의 카페에서는 소비자가 구매 전에 새로운 커피맛이나 비자카 구매 후에 취소해 볼 수 있는 사전 혜택을 제공하고 있는데, 제약 사가 신약에 대해 사용 시험을 제공한다. 그러나 시험 사용 가능성은 가격이 상습의 범위를 벗어난 매우 고가 수술을 받은 환자와 같이 파괴적인 의료시스템에서는 제한적이다. 이처럼 시험 사용 가능성은 어떤 소비자가 제품을 상대적 경사도로 지속 사용해야 할지 여부를 시험해 볼 수 있게 하기 때문에, 시험 사용의 확대는 제품의 채택률을 가속화할 뿐만 아니라 기존 행동이 있는 것들보다 시장에서 더 빠르게 문제를 파악하도록 허용하기도 한다.\n 시험 사용 가능성은 혁신자의 초기수용자와 앞서 언급한 심리학자들이 중요하다고 평가도 하는데, 이들은 혁신의 가치를 알릴 수 있는 많은 연구가 없기 때문이다. 시험 사용 가능성은 초기수용자에 있어서 특히 중요하다. 이는 이들이 위험을 감수하는 정도가 크기는 하지만, 구매를 결정할 때 이성적인 분석을 함께 고려하기 때문이다. 따라서 새로운 아이디어와 사물을 빠르게 접함으로써 새로운 경험 그 자체가 화제의 개방과 연결되어 초기에 새로운 소비자 태도를 형성하게 되었으며, 이는 다양한 소셜미디어를 통해 공유되고 확산되기 때문이다.101\n 복잡성\n 복잡성(complexity)은 채택과 확산에 관계된 마지막 학습 요인이다. 소비자가 신제품을 어떻게 사용할지에 대해 어려움을 겪을 것이라고 예상하면 확산은 늦춰질 것이다. 이러한 경우에 소비자는 짧은 시간만에 그 사용 방법을 배우는 쉬운 제품을 조기 채택하는 경향이 나타난다.103 반면, 이 사항이 강력한 제품을 유형화 보일 수 있지만, 너무 많은 사항을 갖추고 있기 때문에 과도하게 복잡하다는 평판이 커진다. 또한 소비자는 새로운 속성을 가진 복잡한 제품을 낮게 평가할 수 있다. 왜냐하면 새로운 사항을 이해하는 데 필요한 시간을 우려하기 때문이다. 이", "source": "20261114_151526.jpg"}, {"kind": "heading", "text": "마케팅 시사점", "source": "20261114_151531.jpg"}, {"kind": "paragraph", "text": "라는 인식은 마케터에게 도전 과제이다. 왜냐하면 소비자는 자기가 복잡성 문제를 얼마나 잘 다룰 수 있는지에 대해 과소평가하는 경향이 있기 때문이다.106 디지털 사진은 도입 초기 상당한 대중으로 널리 확산되었다. 왜냐하면 디지털 이미지를 카메라에서 컴퓨터로 전송하고, 이미지를 보정하는 소프트웨어를 이해하여 고품질 사진을 인화하는 방법이 복잡할 것이라고 소비자가 인식했기 때문이다.107", "source": "20261114_151531.jpg"}, {"kind": "heading", "text": "15-4d 사회적 적합성", "source": "20261114_151534.jpg"}, {"kind": "paragraph", "text": "저항, 채택, 확산에 영향을 미치는 네 번째 요인은 혁신의 사회적 적합성(social relevance), 즉 특히 혁신에 관한 가능성과 사회적 가치이다. 관찰 가능성은 소비자가 다른 사람들이 혁신을 사용하는 것을 볼 수 있는 정도이다. 일반적으로 소비자에 다른 사람이 혁신 사용과 그에 따 른 이점에 반응할 수 있도록 보여짐의 시간적인 계기가 필요하다. 만일 혁신이 한 사람의 아 이디어에 따라 점차적으로 울론나 사용되고 있다면, 도로로 접근할 수 없고 릴레트리에 안전하지 못한 곳에 위치한 고층 빌딩 뚜껑만을 구주소하는 데 사용될 것이다. 사람들이 그 용도를 보게 되면, 다른 목적으로 사용하는 것에 관란 관심이 높아질 것으로 예상할 수 있다. 제품이 널리 알려지고 유쾌를 제공할 수 있다는 신제품은 채택율이 상대적으로 높아짐에 따라 확산 속도가 빨라질 수 있다.\n또한 사람들이 사용한 제품을 보여주고 자랑고 싶어 한다. 일부 사람들은 자기 몸무게가 얼마나인지 듣게 하고 싶 문 공개적으로 자기 몸무게를 잴 것이다. 따라서 11장에서 기술한 것처럼 이 체중 소비의 공개 적이거나 개인적인 성격에 의해 영향을 받을 것이다.\n 사회적 가치는 제품이 사회적 가치를 갖는 정도이다. 즉 제품이 사회적으로 바람직하거나 적절해 보여서 모방이 뒤따르게 된다는 것이고, 이에 따라 확산의 속도가 나게 된다. 연구 에 따르면, 농부들은 혁신이 값비싸서 사회적 위신(social prestige) 가치를 제공하지 때문에 혁신을 하기도 한다는 점이 발견되었다. 이러한 연구들에의하면114, 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다.\n 그렇다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다.\n 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다. 소비자는 메로나도 제품을 사용할수록 일정 채택할수록 더 많은 위신이 연관되었던으로 나타났다.\n 그뿐만 아니라 제품을 사용함에 따라 우리는 새로운 아이콘 12 프로 카메라의 후광과 렌즈를 사용하고 생각하는 것이 있다. 넣을 각도의 렌즈는 왜곡된 셀카를 만들어내며, 이는 인스타 그램에 그를 채택에 게시되어 시장자들에게 즐거움을 주고 있다.115\n 그러함 이미지에 기반한 제품의 확산은 사회적 가치를 확산시킬 수 있기는 하지만, 위신 이미지에 기반한 제품의 확산은", "source": "20261114_151534.jpg"}, {"kind": "heading", "text": "15-4e 정통성과 적응성", "source": "20261114_151538.jpg"}, {"kind": "paragraph", "text": "실제로는 수명 주기를 단축할한다. 왜냐하면 일단 제품이 대중에 의해 채택되고 나면 더 이상 위신을 세워주지 않기 때문이다. 예를 들어, 한때 위신 및 특권층만 누릴 수 있는 고급스러움과 연관됐던 디자이너 청바지는 시장에서 모든 사람이 입기 시작하자 위신을 세워 주는 상품으로서의 지위를 잃어버렸다.\n 정통성과 적응성 역시 저항, 채택, 혁신에 영향을 미친다. 특히 상황적 혁신과 미학적 혁신의 채택에 영향을 미친다.178 정통성(legitimacy)이란 혁신이 해당 범주에서 적절하다고 여겨지는 기존 가치에 얼마나 따르는지를 말한다. 지나치게 급진적이거나 정통적인 선구자에게 도전하지 않은 혁신은 정통성을 잃은 것이다.\n 예를 들면, 스타벅스에서 미국 소비자에게 커피 문화를 제시할 때, 우유 후에 내린 에스프레소나 라떼를 위해 몇 분 더 기다릴 때의 혜택에 대해 소비자에게 기대하도록 제시하였다. 일단 스타벅스에서 길을 닦고 나자, 푸른 병 커피 내리기 의식을 취한 다른 커피 체인은 지나치게 규칙적이라고 인식될 위험이 줄어들었다. 그림 15-12에서 보이는 것처럼, 소규모지만 선구적인 블루 보틀 커피숍은 콜드 브루 공정을 선보였다(Blue Bottle Coffee).179 그리고 정통성의 경계를 확장해왔다. 자격을 갖춘 전문업원이 각 벽을 커피콩을 갈아서 특별한 필터링 시스템을 사용해 고객의 커피를 한 잔씩 내리는 동안 약 5분 정도를 기다려야 한다. 2021년 6월 현재, 캘리포니아, 뉴욕, 워싱턴 D.C., 일본, 한국, 시카고, 서울, 포틀랜드, 도쿄, 홍콩, 교코하마에 블루 보틀은 99개의 점포를 보유하고 있다.119, 120\n 혁신의 기존 제품이나 스타일에 맞추는 것은 적확적인", "source": "20261114_151538.jpg"}, {"kind": "heading", "text": "15-4f 사회 시스템 특성", "source": "20261114_151541.jpg"}, {"kind": "paragraph", "text": "혁신은 부분적으로는 제품 특성 때문에, 부분적으로는 도입되는 사회 시스템의 특성 때문에 극적으로 확산될 수도 있고, 느리게 확산될 수도 있다. 표절 시장에 속한 소비자의 유형과 사회 시스템 속에서 사람들 간 관계의 성격 모두 혁신의 채택에 영향을 미친다.\n ■ 현대성: 정착, 채택, 확산은 사회 시스템의 현대성에 의해 영향을 받는다. 현대성(modernity)이란 사회 시스템 내의 소비자들이 전통의 변화에 대해 긍정적인 태도를 갖는 정도를 말한다. 현대적일수록 이후에 출시되는 신제품을 보다 쉽게, 깊숙하게 수용하며, 제품포장 혁신 또는 구매와 사용과 관련된 서비스점포 유형, 거래 테크닉과 같은 다양한 분야의 혁신 및 기술적 진보를 자주 접한다.124 사회의 시스템이 현대적일수록 소비자는 이전과는 다르게 보이거나 그동안 보지 못했던 제품에 대해 수용적인 태도다.\n ■ 물질적 거래: 정착, 채택, 확산은 사회 시스템 구성원이 물질적인 트렌드를 따라 빠라지는 경향이 있다. 일례이에서 활동하는 마케터들은 지속해서 변경되는 유행과 트렌드를 쫓아 다니는 때에야 비로소 마케팅에 성공할 수 있다. 마케터들은 물질주의가 높은 계층이 새로운 어프로치와 신제품에 관한 긍정성과 보장 하나 사용했던 신제품에 대해 서로 이야기하는 상황에 기반한다. 이때 이들 소비자는 소비자가 물질적으로 분리되어 있다면 상대방과의 대화 주제가 교육, 가정생활, 취미생활 등에 한정될 것이다.\n ■ 동질성(homophily): 시장에는 동질성의 현상이 있다.126 동질성이라고 불리는 이러한 유형의 유사성은 무엇일까? 첫째, 유사하면 확산도 빨라지는 유형이들 하다. 유사성이 확산 속도를 높일 뿐만 아니라 정보 확대 및 전환 가능성이 커지기 때문이다. 둘째, 유사한 배경의 유사한 특유, 가치, 행동, 경험 등을 가진 사람들은 새로운 정보를 전달할 가능성이 높기 때문이다. 둘째, 유사한 사람들은 서로 상호작용하는 경향이 있다. 또한 규범적 영향을받기2까. 둘셋째, 유사한 사람들은 서로를 모멜로 삼는 경향이 있다.127 이러한 이유에서 동질성(경향)이 높은 사회일수록 동질성이 높아질수록 커질 것이고, 확산에 대한 사회 압력이 커져서 채택과 확산이 촉진되거나 억제되는 결과를 가져올 것이다.\n ■ 의견 리더와 영향력: 1장에서 언급했듯이, 전문가와 의견 선도자처럼 신뢰성을 갖춘 사람들은 제품 채택과 확산에 상당한 영향을 미칠 수가 있다. 왜냐하면 이들은 타인 사람들에게 제품에 대한 긍정적이거나 부정적인 정보를 퍼뜨릴 수 있기 때문이다.128", "source": "20261114_151541.jpg"}, {"kind": "paragraph", "text": "마켓메이븐 의견 선도자들은, 다른 사람에게 영향을 미치기도 하고, 동시에 자기가 속한 소셜 네트워크의 중심에 있을 때 다른 사람으로부터의 정보에 의해 영향을 받기도 한다. 소셜 네트워크의 중심에 있다는 말의 의미는 이들이 네트워크 내에서 많은 연결을 갖고 있기도 하고, 네트워크 안에 속한 개인들을 연결하는 역할을 하기도 한다는 뜻이다.128\n 문화적 차이점: 14장(4)에 언급한 문화적 차이점이 개인주의 또는 집단주의의 성향과 관계해 소비자가 긍정적 태도를 형성하게 되는데 영향을 미친다. 연구에 따르면 개인주의 문화에 속한 소비자는 합리적·실용적 이유로 혁신 제품을 구매할 가능성이 높고, 반면, 집단주의 문화에 속한 소비자는 친지의 혁신 제품을 구매할 가능성이 높다고 한다.129\n 요약\n 혁신은 새로운 시장 속의 소비자가 새로운 것이라고 인식하는 제품, 서비스, 아이디어나 속성을 의미한다. 혁신은 기능상·경험적 또는 상징적·의미적이라는 차원을 통해 특정 특성을 줄 수 있고, 패러디 요구되는 행동 변화의 정도에 따라 연속적인 수준에 있다. 기업에서는 혁신적 신제품을 개발하기 위해 체계적인 계획을 수립하고 노력하고 있다. 제품 혁신성은 연속적인 정도에서 단계적 혁신에 이르는데, 극단적 혁신은 기존의 것을 완전히 대체한다. 혁신은 일시적 유행, 유행 또는 고전으로 나타날 수 있다. 따라서 혁신은 수명 주기, 중간 정도의 수명 주기 또는 장기간에 걸친 수명 주기를 가질 수 있다.\n 혁신을 위해 마케터가 취할 수 있는 전략에는 소비자 혁신에 대한 저항 간극축소, 신뢰 제약 점검, 시장 전반에 걸친 혁신 확산에 영향력 행사하기 포함된다. 자는드 위계적 효과 모형에 따르면, 고관여 위계적 효과 모형을 통한 채택 과정을 혁신의 위헙성이 있다고 간주될 때 발생한다. 혁신의 인지적, 태도적, 행동적 채택 과정이 그 예이다. 혁신은 체험적 관여 유형에는 감정의 수반이 더 많이 포함된다. 저관여 위계적 효과 모형은 혁신이 많은 인지적 노력의 수반 없이 행동 변화에서 시작될 때 적용할 수 있다. 혁신에 대한 마케팅 전략은 소비자의 채택 과정 유형에 따라 달라질 수 있다. 혁신은 위계 모형과 혁신성에 따라 습득 혁신자 집단에서 형성된 긍정적 구전에 의해 다음 소비자의 채택 결정에 영향을 미칠 수 있기 때문이다.", "source": "20261114_151546.jpg"}, {"kind": "paragraph", "text": "저항, 적응, 혁신은 혁신 특성과 혁신이 도입되는 사회 시스템의 특성에 의해 영향을 받는다. 혁신에 대해 소비자가 상대적 이점, 낮은 가격, 낮은 전환 비용 같은 가치를 제공받는 것으로 인지하면 혁신의 가장 쉽다. 혁신에 대한 상업적 승인을 요구되면 소비자의 기존 요구, 가치와 태도에 대해 호환성이 높아져, 즉 시험 사용이 용이하고, 쉽게 사용하게 하고, 위험성은 낮아질 것이다. 혁신이 사회적 규칙과 정부 법령, 적응성이 높다고 보인다면, 이런 요인이 낮다고 인식할 때에 비해 작은 저항을 받을 것이다. 혁신이 도입될 사회 시스템의 특성 역시 저항, 채택, 확산에 영향을 미친다. 또한 사회의 혁신에는 일정 부분 부정적인 사회, 경제적 편감가 수반될 수 있다.", "source": "20261114_151549.jpg"}], "notes": [{"source": "20261114_151354.jpg", "text": "15장 혁신: 채택, 적응, 확산 16장 상징적 소비자 행동 17장 소비자 사회에서의 마케팅, 윤리, 사회적 책임"}, {"source": "20261114_151401.jpg", "text": "학습목표\n 1. 혁신의 참신성과 제공 혜택에 따른 혁신 분류 방안을 제시한다.\n 2. 소비자의 저항과 혁신 수용이 마케터에게 미치는 영향을 논의한다.\n 3. 혁신 곡선이 제품 수용 주기의 여명과 관계되지는 논의한다.\n 4. 채택, 저항과 확산을 강화하는 요인들에 대해서 논의한다."}, {"source": "20261114_151405.jpg", "text": "혁신 → 채택 또는 저항 → 확산\n 채택, 저항, 확산에 영향을 미치는 요인 · 인지된 가치 · 불확실성 · 소비자에게 요구되는 학습 정도 · 사회적 책임성 · 정황성과 채택 가능성 · 사회적 요인\n 그림 15-1 15장의 개관: 혁신(채택, 저항과 확산) 소비자는 새로운 계층을(혁신)에 대해 개혁(책마)하거나 저항(거부) 혹은 연기하지 않는다. 각 관계는 시장의 상류로 헤어져 끼치게 된다. 생산자나 혁신자가 당면하게 되는 계획과 공경의 범위, 혁신이 도입되는 시간을 실선이 대각성과 채택, 저항, 확산은 영향을 받는다.\n 혁신 새로운 시장에서 소비자에 의해 새롭게 여겨지고, 기존 소비 패턴에 영향을 미치는 제품 혹은 아이디어이다.\n 연속적 혁신 기존 소비 패턴에 대해 제한된 효과를 갖는 혁신."}, {"source": "20261114_151410.jpg", "text": "동적 연속적 혁신 소비 관련 예 대해 하에서 표현된 결과로 적며 소비자 행동이 상당한 변구가 일로 혁신.\n 단절적 혁신 이전에 같은 것이 알려져 있지 않을 정도로 새로운 제품."}, {"source": "20261114_151414.jpg", "text": "그림 15-2 혁신 연속선 혁신은 소비자에 대해 얼마만큼의 행동적 변화가 요구되는가에 따라 달라진다. 처음 출시되었을 때 근본적으로 새로운 제품인 단절적 혁신의 경우에는 소비 패턴의 상당한 변화가 요구되지만, 기존 제품의 확장인 경우가 많은 연속적 혁신의 경우에는 아주 작은 변화만이 요구된다.\n 높음 중간 낮음\n 요구되는 행동 변화\n 단절적 혁신 동전 연속적 혁신 연속적 혁신 컴퓨터 개인용 컴퓨터 전자필터리 기능을\n 노트북 컴퓨터 갖춘 담배 필터\n 소형 노트북 컴퓨터 저칼로리 음료\n 태블릿 컴퓨터 전자전기밥솥\n 화장품 성분이 첨가된\n 목욕용 비누 Source: https://eda-dot-geek.com/types-of-tablet-computers/\n 기능적 혁신 기존 대안에 비해 더 나은 기능적 성능에 따른 혜택을 제공하는 제품, 서비스, 경험 혹은 아이디어.\n 쾌락적 또는 미학적 혁신 미 학적 욕구, 쾌락 추구 욕구, 감각 적 욕구 등에 소구하는 혁신.\n 상징적 혁신 새로운 사회적 의미와 가치를 제공하는 제품, 서비스, 경험 또는 아이디어."}, {"source": "20261114_151420.jpg", "text": "공동 창조 신제품 개발에 대한 참여를 통해, 기타 마케팅 활동의 전형 과정에 소비자가 적극적으로 관여시키는 것.\n 그림 15-3 혁신과 공동 창조 비비 앤 블룸의 유아용 클렌징 제품은 부모와 보호자가 함께 만든 제품이다. 모든 제품은 신뢰할 수 있는 천연 무독성 성분을 사용한다.\nSource: https://www.glossy.co/wp-content/uploads/sites/4/2022/07/Vivvi8_washes_EDG_TARFGETngtesive=167"}, {"source": "20261114_151422.jpg", "text": "마케팅 시사점\n 공동 창조는 점점적으로 유행하며, 다양한 산업에서 활용되고 있다. 예를 들어, 나베이는 공동 창조를 통해 새로운 전략적 실험 프로젝트를 개발했다. 예를 들면, 기존 종이 기업의 역사상 가장 상징적인 탁자 램프를 개편하고, 브랜드 혁신 프로젝트에서도 소비자들을 참여시기 시작했다.28 연구 결과에 따르면 소비자를 출시 초기 소비 제품 서비스에 참여시킨 것은 기업에게 재정적으로 유리할 수 있었다. 신제품 공모전과 혁신적인 아이디어에 기꺼이 시험에 신용 시장 국가들에서 소비자들을 참여시키는 이점이 두드러진다27 경우에 따라 기업은 신제품 디자인을 인류 공모하기도 했다. 이를 통해 신제품의 판매를 촉진하고 기업의 재정적 이득을 도모할 수 있기 때문이다.\n 이러한 혜택들에도 불구하고, 공동 창조를 활용하는 마케팅는 신제품 아이디어에 대한 보안 유지와 아이디어를 상업적으로 실행 가능한 혁신으로 발전시키는 도전 과제에 대한 우려를 처리해야 한다. 또 한, 공동 창조에 참여한 소비자 그룹에서 사귐을 통해 돈들이 만든 제품을 공유할 필요가 있다.29 예를 들어, 인은 공동 창조 제품을 교체하게 될다. 실패 가능성을 줄이기 위해 소비자 아이디어를 평가하고 기업의 핵심 전략과의 부합 여부를 면밀히 검토하는 것이 기업에 매우 중요할 수 있다. 마케터가 예산과 조정을 맞춤 메시지(예: “이 신제품을 사용하여 겨울 추위를 물리치세요.”)을 사용하는 것보다 혁신하는 과정을 세심하게 관리하는 것이 새로운 제품의 발명보다도 더 중요할 때가 있다. 게다가 소비자들이 협업해서 개발하는 잠재적 혁신에 대한 만족도가 더 높았다; 이러한 동기가에는 소비자를 자신의 현재 소비계획에 호의적인 태도를 지니는 소비자에게 준파 (self-referencing)비 권하면서 하여 신제품의 채택률을 향상시킨다.30"}, {"source": "20261114_151427.jpg", "text": "그림 15-4 ▶ 사이버 폭력과 휴대전화 긍정적인 특성에도 불구하고, 휴대전화는 몇 가지 예상치 못한 부정적인 사회적 결과를 가져왔다. \n Source: Source: Getty Images: https://www.gettyimages.com/detail/photo/smail-girl-withsmartphone-sitting-indoors-on-sofa-royalty-free-image/1226983594?dpopapp=true"}, {"source": "20261114_151430.jpg", "text": "저항: 신제품을 사라는 외적인 압주와 제품을 샀다가도 환불해도 환불해도 환불해도 환불해도 사지 않으려는 경향 암."}, {"source": "20261114_151434.jpg", "text": "그림 15-5 ▶ 국가별 스마트폰 또는 기타 휴대전화의 채택률\n 선진국에서 스마트폰 보유율이 신흥국보다 높음 성인 중 소유하고 있다고 보고한 비율\n 선진국 대한민국 스마트폰 95 스마트폰이 아닌 휴대전화 3 휴대전화 없음 1 이스라엘 스마트폰 88 스마트폰이 아닌 휴대전화 10 휴대전화 없음 2 네덜란드 스마트폰 87 스마트폰이 아닌 휴대전화 2 휴대전화 없음 2 스웨덴 스마트폰 86 스마트폰이 아닌 휴대전화 5 휴대전화 없음 6 호주 스마트폰 82 스마트폰이 아닌 휴대전화 6 휴대전화 없음 5 미국 스마트폰 81 스마트폰이 아닌 휴대전화 13 휴대전화 없음 5 독일 스마트폰 78 스마트폰이 아닌 휴대전화 10 휴대전화 없음 8 영국 스마트폰 78 스마트폰이 아닌 휴대전화 14 안일 “울려어진” 사례인 테트리도톡씍린(tetrodotoxin)가 포함될 수 있있다고 상각하기 때문이어 이러한 이우로, 라나바드움 고객과 일여의 마케터들은 거의 신젂을 고려하고 그들 샤의 제품이 원고 관렬 과학뎐이 잆다는 점읕 분먕히 알안야 한대.50\n 그림 15-7 채택자 집단 의 프로파일\n 연구자들은 다른 사람들이 신제품을 채택하는 시기를 분류하기 위해 그들을 채택 시기가 다른 다섯 가지 소비자 집단으러 분류한 혁신 자 집단은 시장에서 가장 먼저 신제 품을 채택하자, 후기채택자 집단은 마지막이다. 각 채택 자 집단은 훙렬한 특성과 견 뷰들이 있다.\n 시간 →\n T₁ T₂ T₃ T₄ T₅\n 채택자 집단 혁신자 초기 수용자 초기 다수자 후기 다수자 후기 채택자\n 특성 모험적 기술 동질 계획적 전통적 회의적\n Source: Based on Diffusion of Innovations, 3rd edition by Everett M. Rogers."}, {"source": "20261114_151452.jpg", "text": "마케팅 시사점\n 마케터가 다섯 가지 범주로 된 수용자 분류 체계를 받아들이는지 여부와 상관없이 그들은 신제품을 처음으로 구매하는 소비자들을 어러모로 중요하게 생각한다. 첫 번째로, 혁신자들은 다른 사람들의 인터넷 블로그나 신제품을 채택하기 때문에 마케터가 제공하는 정보를 포함해 신제품에 대한 정보에 수용성이 가능성이 매우 크다. 둘째, 신제품 사용 경험을 통해 많은 사람들에게 오른쪽하려는 경향이 매우 따라서 그들은 새로운 제품의 구전, 정보와 여론형성자로 수 있다(이를 참조). 이러한 면에서 보면 연구자는 혁신자 및 조기 채택자의 사회인구통계적, 인구 및 커뮤니케이션적 특성과 대중에게 노출될 수 있는지 자세히 이해하고 싶어 한다.\n 인구통계\n 1장, 12장, 13장과 14장의 인구통계 변수 중 일부는 혁신자와 관련되어 있다. 연구에 따르면 혁신자는 다른 소비자에 비해 젊고, 소득이 높으며, 더 많이 교육받은 경향이 있는 반면에, 후기채택자는 소득이 낮고 적게 교육받았다. 혁신자는 경제적으로 지위가 높은 것처럼 보이지만, 경제적 지위가 낮다. 그러나 이러한 경우에도, 마케터는 예산상 못한 위치에 처한 소비자도 신제품 측면에서는 중요한 시장이 된다는 사실을 찾아낼 수 있을을 알아야 한다. 예를 들어, 젊은 소비자들처럼 많은 유휴시간을 만들 수 있는 사람들은 신제품에 대한 실험적 연구를 할 수도 있음도 많다. 오히려 나이 든 소비자들이 그것을 발판으로 활동한 수 있다.\n 이 외에도, 연령과 동시에 종교를 들 수 있는데 유니레버(Unilever)사는 네덜란드 시장 진출에 앞서 사람들의 탈취제 사용과 관련된 습관과 종교가 신제품 채택과 관련이 있을 필요도 있다. 예를 들어, 아미시(Amish) 소비자들은 자동차, 전기 전화기 같은 많은 신제품을 기피한다.\n 인구통계적/사회계층 변수와 혁신자 사이의 연관성은 대부분 논리적이다 첫 번째로, 연령은 젊은 사람들은 대중매체를 덜 멀리 접하는 경향이 있기 때문에 다른 사람들보다 새로운 제품에 대해 더 많은 관심을 받게 된다. 둘째, 고소득 소비자들은 신제품을 시험 경제적 능력이 있으며 새로운 것을 채택하는 데 있어 경제적 위험을 적게 느낀다. 가족의 영향과 소득의 같은 인구통계학적 변수를 또한 상호 연관되어 있다. 셋째, 예로 들면, 가족은 집단에 속해 있는 새로운 제품의 채택자로 간주된다. 이 집단은 스마트폰을 통한 구매 대금 결제 제품 채택의 초기 시장 중 하나였다.58\n 사회적 영향\n 혁신자는 1장에서 다른 사회적 영향 요인들과 관련이 있다.59 그들은 그룹화 되지는 초월한 양상한 사회적 영향을 끼치는 의견 선도자가 되는 경향이 있다. 이러한 연구의 대부분은 조사회사 드러났다. 혁신자들은 대부분 특정 제품 범주 메뉴적 범주 사이에서 공무되므로 다른 범주의 신제품에는 그렇듯씩되지 않는다. 또한 이들은 브리지이다. 중요한 제품에 대해 마니어를 일반 소비자와 접목시키는 요소로 브리지이다. 중요한 제품에 대해 마니아를 일반 소비자와 접합시키는 오이므로 브리지이다. 중요한 제품에 대해 마니아를 일반 소비자와 접목시키는 요소로 혁신적인 소비자는 선택된 소비자들이 혁신적인 신제품 채택에 적극적으로 참여할 수 있도록 유도하는 소비자들 사이의 가교 역할을 한다.\n 개성\n 한 가지 성격 특성 또한 신제품의 채택과 관련이 있는데 예를 들어, 혁신자는 자극에 대한 욕구가 크며, 다른 소비자들에 비해 비순응적이고 비합리적이다. 또한 그들은 구매 이전시 감정을 기반에 다른 소비자들에 비해 개성을 발로 하지 않고 신중하지 않는 편이다.62\n 따라서, ‘내재적 혁신성(innate innovativeness)’이란 소비자들이 다른 소비자보다 먼저 더더욱 적극적인 성격 특성을 갖춘다는 제안 이후 여러 이상의 영역에서 혁신성이란 또는 소비자의 욕구를 파악하는 것이 필요하다. 예를 들어, 얼터너티브 음악(alternative music)에 사람 사람을 연결할 수 곧바로 이며, ‘나는 다른 사람들과 다져 얼터너티브 로크 음악을 듣고 있다’는 문장은 긍정적인 반응을 유도하는 것이다. 이들 영역에서의 혁신성은 인지수준일 드러날 수 있다고 된다.63 예를 들면, 패선 영역에서 혁신자가 조기수용자 수 있지만 다른 영역에서는 후기채택자가 될 수 있고, 어떤 소비자들은 전반적으로 신제품을 채택할 준비가 되어 있을 수 있다.\n 문화적 가치관\n 신제품의 채택은 한 문화 및 그와 연관된 가치와 관련이 있었다. 연구에 그와 관련된 한 연구에 따르면 혁신성은 집단주의보다 개인주의 였다. 일부왓나 자기 주장용, 보수보다 변화에 대한 개방성을 지지하기에 여기는 문화와 관련이 있었다. 예들면, 소비자 개인의 제품의 채택 여부에 여타 많은 사람들이 중요한 영향을 미치는 사라요, 또는 앞서 설명한 다른 사람들과 자신을 비교하는 내용 등에서 찾아볼 수 있다.\n 예를 들어, 소비자가 인지 성능을 향상시키기 위해 영혼 또는 또는 능력을 향상시키기 위해 제품을 사용하는 경우, 수"}, {"source": "20261114_151455.jpg", "text": "확산 특정 시점 전체 소비자 중에서 제품을 채택한 사람들의 비율.\n S자형 확산 곡선 확산에서 느린 초기 성장에 이은 급속한 중기를 보이는 확산 곡선."}, {"source": "20261114_151500.jpg", "text": "그림 15-8 ■ 확산 곡선과 제품 수명 주기 곡선 여러 가지 확산 유형이 규명돼 왔다. (a) S자형 확산 곡선에서는 확산이 천천히 시작되어, 급격히 증가하였다가 다시 평평해진다. (b) 지수 확산 곡선(초기에 급속히 성장하는 특징을 갖는 확산 곡선)은 완만히 시작된 다음 급속한 속도로 채택되었다가 완만해진다. (c) 제품 수명 주기 곡선은 시간에 따른 제품의 매출에 대해 누적된 확산이 아닌 매출로 표현된다.\n (a) S자형 확산 곡선 (b) 지수 확산 곡선 (c) 제품 수명 주기 곡선\n 지수 확산 곡선 초기의 급속히 성장하는 특징을 갖는 확산 곡선."}, {"source": "20261114_151503.jpg", "text": "제품 수명 주기 제품이 초기 도입기로 평가돼, 매출 성장기, 성숙기와 쇠퇴기가 따르게 되는 경로를 제시하는 개념.\n 사람의 비율에 초점을 맞추고 있어서, 시장에 있는 사람들 100%가 제품을 구매하면 완료된다. 반면 제품 수명 주기는 시간에 따라 제품 판매 양을 다루고 있다. 더 나아가 확산 곡선은 일반적으로 확산 과정 초기에 혁신적 수용자들의 채택이 느리게 진행되는 반면, 제품 수명 주기는 채택의 절대 수준과 상관없이 처음으로 제품 매출이 증가하는 데만 초점을 맞춘다. 또한 채택이 절반 이상이 확산된 이후에는 더 이상의 매출이 발생하지 않지만 제품 수명 주기는 매출과 채택의 연결성을 직접 반영하지 않는다. 이러한 맥락에서 확산 곡선은 소비자가 제품을 수용하고 그 진전에 기여하는 놀랍도록 흥미로운 방식이 반영되어 있다고 할 수 있다.\n 마케팅 시사점 제품 수명 주기를 이해하는 마케터는 제품의 새로운 용도를 개발한다든지 하는 방법으로 제품의 쇠퇴를 막으려고 할 수 있다. 예를 들어, 나일론은 1940년대에 총처럼 쉽게 하면 활용된 예로, 로프나 낚시에 같은 수입을 요인에 따라 긴 수명 주기를 누리고 있다. 마케터는 새로운 시장세를 창출하거나 현재의 사용을 관성움으로써 자사 제품의 수명 주기를 연장할 수 있다.\n또한 마케터는 자사 제품의 제품 수명 주기를 진단하고자 할 것이다. 확산 곡선이 다른 고객 마케터가 표상하는 제품 수명 주기 곡선이 존재한다. 유행 사용해goda로 아주 짧은 제품 수명 주기를 갖는 성공적 혁신이다. 또한히 십대 만 거북이(Teenage Mutant Ninja Turtles)와 스타워드 또는 동일한 용도들은 일시적 유행(rei)에 이어 일시적 유행은 재유행 형을 춰합하고 나서 몇 년 후에 다시"}, {"source": "20261114_151510.jpg", "text": "상대적 이점 기존 제품의 혜 택에 비해 우월한 혜택을 제공 하는 정도.\n 대사 증가 작업 제품운동 꾸바카 슈퍼내추럴 결혼과 자전거 타기 소울 오브 더 파이트 크로스케리 필력 및 피트니스 던전 파이브 컨텐츠 개발 언더유얼(UNTNU You) 작업 인터벌 트레이닝(Interval training) 인터벌 트레이닝(Interval training)(타바타) 런던 워킷(Wkit) 워킷 하이 모기지셋\n 그림 15-9 ▸ 상대적 이점 명확한 상대적 이점을 갖춘 혁신 은 더 빨리 채택되는 경향이 있 다. 이 그림은 수퍼내추럴 (Supernatural), 소울 오브 더 파 이트(Thrill of the Fight), 잔혹 앱(FitXR)와 같은 운동 혁신 콘텐츠 덕택에 많은 메타 버스 사용자들이 헤드셋 장치를 착용 하고 유산소형과 인터벌 운동을 새롭고 매우 재미있는 것으로 보 고 있다.\n Source: Based on Tatum Hunter, “Let’s Get Meta: Physically, Why Oculus Fitness Actually Works,” The Washington Post, April 23, 2022."}, {"source": "20261114_151515.jpg", "text": "사용 혁신 제품에서 원래의 의도와 사용 방법과 다른 사용 방법을 찾아내는 것\n 마케팅 시사점\n 소비자가 혁신이 상대적 이점을 갖고 있다고 인식하지 않으면, 마케터는 혁신 상품에 대해 물리적으로 재디자인을 하거나 프레지니어링을 함으로써 인지된 상대적 이점을 철저할 필요가 있다.\n 상대적 이점을 알리고 시연하기 기업에서는 제품이 제품의 상대적 이점을 이해하지 못하는 소비자와 소통해야 한다. 예를 들면, 신용카드는 구글 안의 공과금에 의해 제공되어 전자 수신으로 여러 가지 형태를 둘로 수업해 주는 고객 관리 애플리케이션(Apple Pay)이 아이폰에 도입되고 나서, 어리력이 소비자에게 미치는 영향을 이해해야 한다. 기업들은 재무 서비스 파트너와 협 력하여 사용편리성, 지갑 지출 축소, 보안성 등의 상대적 이점을 소비자가 보는 데 강조, 소개 페이지 게시판, 대중매체를 활용했다. 바로 미국의\n (Walgreen)(미국 2위의 약국 체인, 역자 주)과 여타 소매업자들은 모바일 지갑 사용용이 상당한 증가하고 있다고 공지했다.86 혁신의 악년을 알리는 또 다른 방법은 신테르가 보도 뉴큐로에는 빔 윌스트리트 저널(Wall Street Journal) 칼럼리스트와 같은 유명 선도자를 활용하는 것 이다.\n 인지된 비용을 감소시키기 위해 가격 촉진을 활용하기 소비자가 제품이 너무 비싸다고 인식한다면 기업에서는 가격 할인, 리베이트, 환불 같은 가격의 조정을 둔 특별 판매 촉진을 진행하는 것이 바람직하다. 제품의 턴 바써 보여도를 통해 점포의 신뢰를 자 보증을 제공하면 소비자에게도 또 다른 보장을 종으로 작용하여 손실을 낮출 수 있는 만큼 가격 측면‑상 소비자에게 남아지 않도록 할 수 있다. 예를 들면, 각 리애트는 각종 온라인 서비스 서비스에 대해 무료로 시험사용 기간을 부여하여 인지 비용을 감소시킬 수 있다. 이 전략은 디지털 시대의 마케팅에서 활용했던 방법이다."}, {"source": "20261114_151518.jpg", "text": "전환의 유인 제공하기 소비자가 전환 비용이 높다고 생각해서 혁신이 채택되지 않는다면 마케터는 전환의 유인을 제공할 수 있다. 이런 상황은 언뜻기존 가연이 소비자 새로운 세대의 면보다로 전환하도록 하기 위해 무엇 만들기 손실을 배보과 하는 이유를 설명해 준다. 기업에서는 전환하지 않는 데 수반되는 비용을 소비자에게 알리는 광고를 활용할 수 있다. 마지막으로, 마케터는 자사의 혁신이 산업 표준이 되도록 촉진할 수 있다. 예를 들어, 그러려면 이중 번덜러, 저가격을 갖추어서 지배적인 대안이 되도록 행동할 필요가 있다."}, {"source": "20261114_151523.jpg", "text": "마케팅 시사점\n 소비자가 제품들에 갖는 수많은 주기를 올려하며 손해에 저항할 때, 마케터는 제품들이 진짜라면 재빨리 알 수 있는 상징에 둘 수 있을 필요가 있다. 현실적으로는 소비자가 다른 소비자가 혁신자를 자처하는 매장 안의 안내인이나 마니아이 컴퓨터 테블릿(e-book)과 전자책 장치(읽을) 마치 온라인 마이크로 킨들(Kindle) 독서 경험을 개선하고자 하는 것을 위한 기능을 향상시켰다. 가격이 낮아져 가격 부가되므로 수전관에 업그레이드를 거쳐 왔던 때로, 소비자는 구매가 자신에게 효과가 있을지에 대해 불확실함을 느끼고, 혁신자의 시뮬레이션 증강 현실(augmented reality)은 이러한 점에서 도움이 될 수 있는데, 소비자가 사기 전에 시도해 볼 수 있기 때문이다. 예를 들어, 증강 현실은 소비자가 거실에 새로운 소파가 어울릴지, 몸에 어울릴까뿐 아니라, 특히 헤어 스타일에 어울릴지 등에 도움을 제공하는 데 도움을 줄 수 있다. 기타 중요한 혁신의 기능(예: 자동차의 ‘차선 보조’ 기능에 대한 전통적인 게임에 참여한 소비자가 기능의 채택을 점진적으로 수반하는 사실을 보여줌으로써, 소비자가 움직이거나 전혀 참여팬이 모드 만족스럽지 않은 이상한 느낌을 게임). 이 예들은 소비자의 욕구를 자극하고, 새로운 기능에 대한 관심과 상상력을 자극하는 데 초점을 맞추고 있다.\n 호환성 혁신이 개인의 욕구, 가치관, 규범 행동과 서로 일치하는 정도."}, {"source": "20261114_151526.jpg", "text": "시험 사용 가능성: 제품 이전에 소량의 구매에 제한된 분위기에서 제품 사용해볼 수 있는 정도.\n 그림 15-10 시험 사용 가능성 소비자가 학습 경험을 구매 전에 갖기 전지각의 시사조와 관련된 제품의 시험 사용 가능성에서 도움을 받을 수 있다.\nhttps://www.gettyimages.com/detail/photo/woman-on-electric-mountain-bike-royalty-free-image/1247052362?adppopup=true\n 복잡성: 혁신이 이해하거나 사용하기에 복잡한 어려운 정도."}, {"source": "20261114_151531.jpg", "text": "마케팅은 혁신에 대한 저항을 소비자의 중요한 이슈이기 때문에 다양한 전술을 사용할 수 있다.\n 호환성을 강화하거나 복잡성을 줄이기 마케터는 소비자의 욕구와 가치에 부합하는 새로운 제품을 개발할 수 있을 것이다. 버티 테크놀로지스(Beta Technologies)가 개발한 새로운 휘발유 연료 첨가제 포뮬러는 배터리로 구동되며 연료 효율성을 높이고 있다. 마케터는 향후 몇 년 동안의 연료비가 매우 비싸질 수 있다는 사실을 감안하여 제품을 효율적으로 구현해야 한다. 만약 소비자가 연료비를 절감하고 싶어 한다는 생각이 반영된다면, 소비자를 위해 이 제품의 실질적인 효익은 브랜드 인지도를 통해 구별될 수 있을 것이다.\n 호환성에 대해 가르치기 기업에서는 소비자에게 혁신이 실제로 소비자의 욕구, 가치관, 관행이나 경험을 얼마나 잘 맞춘다는 것을 보여주는 것을 지시하는 초기 채택자나 의견 선도자를 사용할 수 있다. 베스트 바이의 한 매장은 고객이 직접 제품을 시험해 보고 그 제품에 대해 더 쉽게 질문을 채택하여 이에 응답할 수 있도록 만들어졌다. 이 회사에서는 보다 많은 고객이 새로운 기술을 편안하게 느끼기를 원하고 있다. 예컨대 은행 예금 업무를 맡는 소프트웨어 인셉서스(Mesaverat) MC20 Cielo 컨택터블 로드스터 슈퍼카가 그 사례 중 하나이다. 이 슈퍼카는 약 235,000달러의 가격으로, 운전자의 패턴에 따라 맞춤 서비스를 제공하는 GPS 내비게이션 기술을 특징으로 한다. 또 다른 사례로는 온로드스터의 모바일 앱을 수동으로 제품을 제어해야 하는 번거로운 요구를 없애기 위해 설계된 점을 들 수 있다. 새로운 기술과 제품의 도입에는 잠재적 구매자에게 이 혜택을 명확히 전달하는 것이 필요하다.\n 변화의 주동자를 활용하기 인지된 호환성을 제고하는 또 다른 방법은 의견 선도자 같은 변화의 주동자를 활용하는 것이다. 다양한 산업에 종사하는 마케터는 신제품으로 포장되지 않은 잠재에 대한 확실한 공감 같고 다른 사람들에게 걸쳐 굳어진 극도의 저항을 줄이는 방식으로 주동자들을 찾고 초청난 컨텐츠를 거쳐와 한다, 예를 들어, 많은 기업에서는 자사의 제품이 여러 매체의 시상식에서 영화 스타들에 배포되는 선물 가방에 포함되기를 열망한다. 왜냐하면 이러한 유명인들이 제품을 채택하는 칭찬 및 마디말으로써 팬들 사이에서 시험 사용이 늘어날 것이기 때문이다.\n 제품 시스템에 맞추기 일부 마케터들은 자신이 생산한 신제품이 기존 제품의 시스템과 함께 작동하는지 확인함으로써 소비자의 복잡성 걱정을 줄일 수 있다. 예를 들어 마이크로소프트사는 새로운 운영체제를 도입할 때 기존 소프트웨어 및 하드웨어와의 호환성을 강조함으로써 소비자의 학습 비용을 감소시켰다. 이러한 전략은 소비자가 새로운 기술을 채택하는 데 따르는 불확실성을 줄이고, 새로운 제품 사용에 대한 자신감을 높이는 데 도움이 된다. 이와 같은 접근은 특히 기술 집약적인 제품에서 더욱 중요하다. 복잡한 기능을 가진 제품일수록 소비자는 기존 시스템과의 연동성을 중시하기 때문이다. 기업은 신제품 개발 단계부터 호환성을 고려해야 하며, 이를 마케팅 커뮤니케이션에서도 명확히 전달해야 한다. 소비자가 새로운 시스템을 도입하면서 기존의 투자를 보호할 수 있다는 인식을 심어주는 것이 중요하다.\n 혁신이 산업 표준이 되도록 추진하기 마케터는 때때로 규제 당국과 함께 혁신의 채택을 요구하도록 협업할 수 있다. 예를 들어, 차량 검지기, 차량 안전, 무연 휘발유 등은 정부에 의해 사용되도록 강제된 혁신들이다. 제조업체와 비즈니스는 여러 국가 및 지역의 규제 기관과 협력하여 공공의 평가 정정 지침에 따라 신규 무해한 제품 사용이 의무화되고 있기 때문이다.\n 시험 사용 가능성을 강조하는 촉진 활동을 활용하기 기업에서는 다양한 촉진 활동을 통해 시험 사용이 이루어지도록 할 수 있다. 예를 들어, 무상 샘플이 주어지지 않으면 제품 시험은 저해될지도 모른다. 사람들이 많이 몰리는 쇼핑몰에서는 샘플 제공을 통해 제품의 맛과 향을 경험하게 함으로써 새로운 식품 제품에 대한 시험 사용을 권장한다. 또한, 코스트코(Costco)에서는 쇼핑객이 자사의 거대한 점포를 돌아다니는 동안에 마주치는 다양한 샘플 시음 기회를 제공하는 것으로 잘 알려져 있다.\n 호환성과 단순성을 보이기 브랜드나 영업 사원에 의해 진행되는 현장 진행 시연(demonstration)이나 광고나 온라인 비디오에서 보여준 시연은 특별히 제품의 사용 용이성과 상대의 욕구, 가치, 행동에 대한 호환성을 시각으로 보여 준다. 블렌더타임(Blendtec)이 믹서기 매출을 자사의 믹서기가 얼마나 튼튼하지 그리고 얼마나 빠르고 쉽게 작동하..."}, {"source": "20261114_151534.jpg", "text": "그림 15-11 호환성과 단순성 소비자들로 블렌더의 인사이트 라이브의 시연전략과 자신의 가치 및 행동과 연결되는 단순한 혁신에 반응함을 보여 주는 비디오를 유튜브에 게시하자 긍정적으로 증가했다는[각주 https://www.youtube.com/watch?v=lAl28d6tXbo\n 15-11 참조). 이 회사에서는 애플워치가 순식간에 가루가 되어버리 는 것과 같은 영상을 만든 새로운 ‘윌잇블렌드?(Will it Blend?)’ 비디오를 지속적으로 촬영하여 게시하고 있다. 현재 브랜드의 공식 유튜브 채널 에는 85만 6천 명이 넘는 구독자가 있고, 이 회사의 비디오 중 일부는 북아메리카를 가로로 만드는 콘텐트리님의 영상수는 1,900만 회 이상의 시청 수를 보이고 있다.\n 시험 사용 시뮬레이션 때로는 마케팅에서 소비자가 실제로 제품을 시험 사용하기보다는 시험 사용을 시뮬레이션하도록 만들수 있다. 하우즈(Houz)는 소비자가 하우즈 제품이 자신의 집에서 어떻게 보일지 뿐만 아니라 잠재적으로 리모델링을 하는 동안 현실성을 부여하도록 한다. 사용자는 제품이 다른 조명 조건에서 어떻게 보일지만을 확인할 수 있다. 모디페이스(Modiface)는 소비자가 화장품 제품을 사용 시험해 보며 더욱 더 자신의 얼굴에 얼마나 어울리는지 볼 수 있는 증강 현실 기술을 활용한다.111\n 사회적 적합성 혁신이 관련된 한 정도 또는 다른 사람이 혁신에 대해 사회적 검색을 중요視한 있다고 간주하는지와 관련된다."}, {"source": "20261114_151538.jpg", "text": "마케팅 시사점\n 관찰 가능성은 특정 있는 포장, 스타일, 색상이나 독특한 촉진 활동을 활용함으로써 증진될 수 있다.176 (예를 3장에서 기술된 것처럼) 지각 강화 기법이 활용된다. 또 제품 포장 및 사용 장면에 인쇄되거 나 제품 사용에 따라 소비자가 사회적으로 보살핌받게 된리려 점을 제시하는 광고를 만들므로써 관찰 가능성을 높일 수 있다. 혁신의 사회적 적합성은 광고를 통해 부각될 수 있다. 특히 제품 사용과 전자사회적 메시지 허용으로 연결되는 광고를 활용할 수 있다. 마케팅는 제품을 포함한 사회적 가치(social entity, 정당성, 가치와 연결된다는 사실 다양한 사회적 가치를 강화할 수 있다. 예) 중국의 브앤드인 완다(Wanda)는 무비, 노래방, 호텔, 스포츠 등의 피파 월드컵(FIFA World Cup)을 후원함으로써 자사 브랜드를 연관시켜 사회적 이용으로 갖는 반응을 도모하고 있다.177\n 15-4e 정통성과 적응성\n 정통성 혁신이 해당 범주에서 적정하다고 여겨지는 기존 가치에 얼마나 따르는 정도이다.\n 그림 15-12 정통성\n 혁신은 정통성 있는 선구자에 기반하거나, 블루 보틀 커피처럼 자신의 정통성을 입증하여 경계를 밀쳐 나가야 한다.\n 적응성 혁신이 새로운 스타일을 조선할 수 있는 정도.\n 적응성(adaptability)은, 채택과 확산에 영향을 미치는 다른 요인이다.121 예를 들면, 유행 혁신이나 가구는 다양한 다른 패션이나 가구 트렌드에 잘 적응할 수 있다. 유대는 같은 가정 제품의 경우에도 다양한 기능을 수행할 수 있기 때문에 높은 적응성을 갖기도 한다."}, {"source": "20261114_151541.jpg", "text": "마케팅 시사점\n 마케터는 혁신이 어떻게 만들어졌는지를 시연하거나, 소비자가 그 범주에 적합하다고 지각하는 것과 일치하는 방식으로 혁신을 마케팅함으로써 성공을 강화할 수 있다. 프리토레이(Frito-lay)예시는 남미 풍미의 도리토스(Doritos)를 레이즈(Lays) Chip을 남미 시장을 염두에 두었기 때문에 이리한 방식을 채택했다. 프리토레이의 마케팅 즉식에서만 따면 자칫해서 브랜드 슈토어로 이해하는데, 왜냐하면 포커스 그룹의 피드백이 “맛은 맞을 것이다만, 우리 회사에 남미 모멘다에서 그것을 찾을 것을 기대하지 않기 때문이다”라고 한 것 때문이다. 대신에 이 회사에서는 멕시코에서 자신의 사브리토레스 칠레앤라임(Sabritones Chile & Lime) 멕시코버전 wheat snack을 수입하기 시작했다. 이 제품은 멕시코에 거주하는 미국의 공동체에 판매하기 위해 점포당 입점에 주된 초점 이었다. 차별이 명심적으로 이루어진 이 제품은 곧 다른 판매채널에서도 판매 가능해졌다.122\n 많은 소비자가 제품에 적응성을 갖지 못했다고 믿는다. 마케터라면 같은 기능을 이성을으로 활용해 볼 수 있다. 예를 들어, 리버레이션 스낵(Liberation snacks)의 크리에이티브 디렉터 제러미 로커(Jeremy Rock)는 그들의 스낵이 사람의 오일의 소스와 혼합되어 두고두고 먹을 수 있도록 제조업자가 의도했다고 말한다. “신문장적 제조업에서는 소비자에게 추가설정을 판매예고된 엉망으로 내는 것 외의 명암을 고려한 결과라고 요청할 수 있다.”123\n 현대성 사회 시스템 내의 소비자들이 전통에 대해 긍정적인 태도를 갖는 정도."}, {"source": "20261114_151546.jpg", "text": "마케팅 시사점\n 마케터는 노력에 따라 사회 시스템에 영향을 미침으로써 저항, 퍼짐 확산에 영향을 미칠 수 있다. 예를 들어, 표적 시장 구성원이 제품, 매장 브랜드와 같이 참여해 있는 소비자의 특정한 행동에 맞는 전략과 전술이 있다면 제품 적합성을 높여 주는 표적 시장에 맞춘 커뮤니케이션 전략을 수행할 수가 있고, 각 소비자에게 도달할 수 있도록 서로 다른 개별적 채널에 통합적 매체를 통해 메시지를 전달할 필요가 있다.\n또한 기업에서는 혁신을 아직 채택하지 않는 소비자가 누구인지를 파악할 필요가 있다. 연구에 따르면 이들 비채택 소비자는 (1) 제품을 실제 사용해 보았지만 다른 사람들에게서 정보를 제공받은 가능성이 낮은 잠재적 수용 소비자, (2) 제품을 실제 사용해 보았지만 다른 사람들로부터의 혁신에 대한 거부적인 정보들이 내려진 가능성이 있는 저항적 수용 소비자, (3) 제품을 아직 사용해 보지 않았지만 적극적 거부자, 적극적 거부자의 세 집단으로 나누어 볼 수 있다. 상이한 채택자 집단에 대응하는 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에 상이한 마케팅 전략이 적절할 것이다.130 예를 들어, 잠재적 채택자 집단에상에텔옆잠재적채택자집단에쳐잠재적채택자집단에적절한것이다.130 예를 들면, 잠재적 채택자가 혁신에 대해 더 큰 도움이 될 수 있도록 하거나 그러나 적극적 거부자들을 이끌어내기보다는 제품 채택을 고려하는 다른 소비자들의 거부적인 태도를 바꿀 수 있어야 한다.\n특히 확산에 영향을 미칠 수 있기 때문에 많은 영향을 받음으로써 채택의 중요성이 크다고 볼 수 있다. 마케터는 논의가 강화되도록 애로사항을 분명히 할 수가 있기 때문에, 왜 잠재 로부터의 장애 요인을 알게 되는 데 도움이 될 수 있기 때문에, 애로사항을 분명히 할 수가 있기 때문에, 왜 잠재 로부터의 장애 요인을 알게 되는 데 도움이 될 수 있기 때문이다. 따라서 비보상/보상인터넷에서 직접 참여하는 커뮤니케이션에 비해 신뢰성이 더 높다. 소비자들은 채택 후 혁신에 대해 적절하게 직접 구전으로 표현 함으로써 긍정적 구전이 일어나도록 자극할 수 있다. 또한 박물관한 온라인, 소셜 미디어와 사이트에 게시된 리뷰나 평론이 소비자들 사이에는 물론 기업에 대한 소비자들의 태도에 영향을 미치게 된다. 마케터는 구전을 주의하고, 긍정적 구전을 만들어 내고, 부정적 구전에 대응하는 대응 절차를 취할 수 있다."}, {"source": "20261114_151549.jpg", "text": "복습과 토론을 위한 질문\n 1. 혁신은 새로운 정도와 혜택의 유형에 따라 어떻게 기술될 수 있는가? 새로운의 정도는 어떻게 소비자 행동 변화에 영향을 미치는가?\n2. 공동 창조란 무엇이며, 공동 창조의 잠재적 혜택은 무엇인가?\n3. 채택과 확산의 차이는 무엇인가? 저항은 채택 개념과 어떻게 연결되는가?\n4. 혁신 채택에 소비자가 고관여 효과와 위치 모멜을 따르게 되는 것은 어떤 상황에서인가?\n5. 소비자는 다른 소비자에 대한 상대적 채택 시점에 따라 어떻게 분류될 수 있는가?\n6. 제품 수명 주기란 무엇인가? 제품 확산과는 어떻게 다른가?\n7. 소비자 학습 요인과 사회적 적합성은 저항, 채택, 확산에 어떻게 영향을 미치는가?\n8. 어떤 사회 시스템 특성이 시장 내에서 혁신 수용에 영향을 미치는가?"}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch15-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch15-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch15-book-edits',content.innerHTML));const saved=localStorage.getItem('ch15-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
