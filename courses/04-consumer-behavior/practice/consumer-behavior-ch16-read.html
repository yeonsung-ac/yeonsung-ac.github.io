</style></head><body><div class="toolbar"><button class="primary" id="play">읽기</button><button id="pause">일시정지</button><button id="stop">정지</button><select id="voice" aria-label="음성"></select><label>속도 <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></label><label>글자 <input id="size" type="range" min="15" max="30" value="19"></label><label><input id="includeNotes" type="checkbox" checked> 참고 포함</label><button id="txt">TXT 저장</button><span class="status" id="status">문단을 클릭하면 그곳부터 읽습니다.</span></div><main class="page"><h1 class="title" id="bookTitle"></h1><article class="content" id="content" contenteditable="true" spellcheck="false"></article><section class="notes" id="notes"><h2 data-read="1" data-note="1">참고 자료</h2></section></main><script id="bookData" type="application/json">{"title": "학습용 교재", "main": [{"kind": "heading", "text": "상징적 소비자 행동", "source": "20261114_170054.jpg"}, {"kind": "paragraph", "text": "도입\n 전 세계적으로 결혼은 사람들의 삶에서 특별한 순간 중 하나이다. 결혼식은 부부가 파혼에서 기혼으로의 전환을 상징하는 의식이다. 문화적, 지역적, 종교적, 가족적 상황이 그 특별한 날의 성격을 결정한다. 예를 들어, 노르웨이에서는 신부가 걸을 때 딸랑거리는 소리를 내는 금발, 은발, 장식이 달린 화환을 착용하는 오랜 전통을 갖고 있다. 다른 소리는 악령을 쫓는다고 한다. 멕시코에서는 신랑의 신랑이 장미 꾸러미와 꽃으로 이루어진 라소(lasso)를 무릎 기호의 모양으로 몸 주위에 두르고 있다. 이 모양은 부부의 결합을 대표하며 예식이 끝날 때까지 유지된다. 신랑은 신부를 위해 기념품을 만들고 친구들과 친지들에게 선물한다. 신랑의 신부는 부부로서의 새로운 삶에서의 첫날을 다 함께 인정하는 장치이다.\n 결혼식 최대의 손님들은 신혼부부에게 새로운 생활을 상징하는 물건들을 선물로 준다. 미국에서는 전통적인 결혼 선물 목록에 선물제공자가 중요한 역할을 하지만, 신랑의 신부의 경제적 실질 선물 대신 특별한 자선단체에 기부를 요청하기도 한다.\n이렇듯 결혼식은 의례적 행사이기 때문에 대부분의 부부들은 세계 어느 나라의 부부보다 더 많은 돈을 쓰는 경향이 있다. 미국은 결혼식을 위해 치장했던 예식에서 뿐만 아니라 개인들은 그 특별한 이벤트에 대한 반다른 특별한 비용을 쓰는데, 미국의 평균 결혼식 비용은 3만 달러를 넘는다. 웨딩 전문가들은 신혼부부를 위해 외길한 웨딩플래너, 사진작가, 뮤지션, 행사 장소, 케이터링, 꽃, 선물 등 다양한 제품과 서비스를 이용한다. 이러한 이유로 미국의 웨딩 서비스가 거의 600억 달러 규모의 산업을 대표하는 것은 그리 놀라운 일이 아니다.\n 16-1 상징적 의미와 그 기능\n 결혼식과 다른 행사 및 소비 활동이 왜 의미를 가지는지 이해하려면, 해당 제품과 관련된 의미가 무엇에 의해 유리한지 이 서비스가 기능이 제공하는 네 기능에 대해 설명할 필요가 있다. 이 네 가지 기능은 상징적 기능, 역할 획득 기능, 연결성 기능, 그리고 자존표현 기능이다.\n 16-1a 상징적 기능\n 일부 제품은 다양한 사회 집단의 구성원 자격을 상징하며, 이것을 상징적 기능(emblematic function)이라고 부른다. 특히 드레스는 신분와 관련 있고, 가운은 졸사나 졸업을 의미한다고 했다. 우리가 단순한 유아류는 나이를 상징하기 때문이다. 문화적으로는 사회적 지위와 상징", "source": "20261114_170054.jpg"}, {"kind": "heading", "text": "16장 상징적 소비자 행동", "source": "20261114_170059.jpg"}, {"kind": "paragraph", "text": "할 수도 있다. 의식적이든 무의식적이든, 우리는 우리가 속해 있는(또는 속하고 싶어 하는) 집단을 상징하는 브랜드와 제품을 사용한다. 동시에, 우리가 그러한 제품들을 사용하는 것을 모르는 사람들은 의식적이든 무의식적이든 간에 우리가 우리가 속해 있는 집단을 분류하여 그 집단에 추천한다. 다른 사람의 그런 집단의 소유물을 보는 것만으로, 우리는 그들의 정보에 관한 보다 많은 정보를 알 수 있다. 예를 들어, 베이비 붐 세대, 저소득층 또는 상류층에 속하는 사람들인지 여부나, 미니밴, 세단, 스포츠카, SUV를 가지고 있는지 판단할 수 있을지도 모른다. 다음에서는 지리적 및 민족적 상징, 사회적 계급 상징, 그리고 생활 상징과 같은 다양한 상징 범주에 대해 논의한다.\n 지리적 및 민족적 상징 제품은 지리적 및 상징적 지표로 상징할 수 있다. 예를 들어, 밝은 색의 헐렁한 옷은 미국에서 캘리포니아, 애리조나, 하와이 같은 상대적으로 화창한 지역을 상징한다. 헤드스카프, 백팩, 샌들, 치파오(전통 중국 의상)와 같은 제품들은 타 지역에 거주하는 사람들이 사용하는 것이라기보다 지리적 및 민족적 정체성을 상징할 수 있다.\n또한, 사람들은 지리적 및 민족적 정체성을 나타내기 위해 특정 종류의 음식을 사용하기도 한다. 예를 들면, 중국에서 계란 국수, 치킨 몰레(chicken mole), 또띠야는 미국, 멕시코, 중국의 정체성을 드러내는 음식으로, 프랑스 사람들은 크루아상과 크루아상 샌드위치를, 네덜란드는 마요네즈를 뿌려 먹는 감자튀김을, 미국 소비자는 감자튀김에 케첩을 뿌려 먹는 반면, 네덜란드는 마요네즈를 뿌려 먹는 것처럼 말이다. 코스타리카에서는 소비자들이 중동 마요네즈와 케첩을 섞어 먹으며, 캐나다에서는 일부 소비자들이 그레이비와 치즈를 섞어 “푸틴(poutine)”을 먹는다. 우주식 가루는 미국으로 이주한 아이티인들에게 민족적 정체성의 중요한 상징으로 작용한다.\n‘크렌섬케이크(kransekake)라고 불리는 아이슬란드 장식된 결혼 케이크는 “우리의 동질성과 결속을 위한 상징”이라고 한 아이슬란드인은 말하였다. “우리가 결혼과 관련된 그 무엇보다 자랑스러워하는 것은 케이크이다!”\n 사람들은 또한 자신의 글로벌 또는 지역 정체성을 반영하기 위해 브랜드를 사용할 수 있다. 최근 연구에 따르면 글로벌(또는 특정 지역) 정체성을 가진 소비자는 글로벌(또는 특정 지역) 브랜드를 선호한다. 지역 정체성을 가진 소비자도 마찬가지로 지역 브랜드를 선호한다. 그러나 불확실성은 사람들의 사람에 대한 생각을 다르게 만들기 때문에, 소비자가 불확실성 상", "source": "20261114_170059.jpg"}, {"kind": "paragraph", "text": "사회계층 상징\n 제품은 또한 사회 계층을 상징할 수 있는데, 이는 럭셔리 브랜드의 상류 사회계층의 소비자들에서 볼 수 있다. 그림 16-2는 상류 사회계층의 소속을 상징하도록 설계된 브로치의 예를 보여 준다. 또 다른 예로, 미국에서는 일부 부유한 럭셔리 구매자들이 샤넬(Chanel), 에르메스(Hermès), 보테가 베네타(Bottega Veneta) 등 고급 브랜드의 희귀하고 가치 있는 럭셔리 상품을 구하기 위해 개인 쇼핑 도우미를 이용한다. 예컨대, 에르메스 버킨(Birkin)의 수제 핸드백은 개당 10,000달러에서 100,000달러 이상까지이기 때문에 명백한 지위 상징으로 여겨진다. 흥미롭게도 여성과 남성 모두 사치품을 상징으로서 사용하지만, 그 이유는 다르다. 남성은 여성에게 매력을 어필하고자 상류 사회계층을 상징하는 제품을 사용하며 그 제품이 소비자 자신에게 현실적으로 다른 성취에서 보이기 위해 그것을 활용한다. 그들은 서로 다른 사회계층 소비 집단에서 다른 상징을 사용한다. 예를 들면, 미국의 상위 계층과 하위 계층의 사람들에 술이 없는 음료, 외식을 중요하게 생각하는 정도, 재정적인 가치가 얼마나 있는지 사용하는 접시와 그릇의 수를 비교할 수 있다. 상위 계층의 소비자들은 자신의 가치, 지위와 소속감을 공공연하게 자신들이 부유하다는 뉘앙스를 통해 표현하고 하며, 동시에 같은 계층의 다른 구성원들에게 자신의 존재를 알린다.¹⁶\n 성별 및 성 정체성 상징\n 음식, 옷, 보석류와 얼굴을 꾸밈은 남녀 성별 범주에 속하는 제품 범주 중 일부에 불과하다. 프랑스 소비자에 대한 한 조사에 따르면, 고기의 특정 유형의 식단은 남성의 반면, 채식 위주의 음식은 '여성적' 음식으로 분류된다. 이러한 음식은 대부분 소비자의 성별 적절성(gender appropriateness)을 반영한다. 스테이크와 고기처럼 거칠게 썰어서 꼭꼭 씹어야 하는 질감이 있으면 물질에서 남성적 특성과 더욱 잘 맞는 것으로 보인다. 일부 제품은 남성용 제품으로, 다른 제품은 여성용 제품으로 간주되기 때문에, 마케터들은 현재 소비자의 성별을 반영하는 구독 패키지를 제공하고 있다.¹⁸\n 상징들은 성 소수자 소비자들에게도 매우 중요한 역할을 한다. 예를 들어, 그림 16-3에 나와 있는 다양한 깃발은 성 소수자, 트랜스젠더, 그리고 유동적 성 정체성의 상징으로 사용될 수 있다.\n 준거집단 상징\n 대학 스포츠 그룹은 제품들이 어떻게 긍정된 내의 구성원 자격을 부여하는 상징이 될", "source": "20261114_170105.jpg"}, {"kind": "paragraph", "text": "수 있는지에 대한 좋은 예이다. 일반적으로, 소비자들은 즐거운 상징에 학교 로고가 박힌 티셔츠를 자신의 자아 개념 중에 자아 정체성과 동일적인 측면(예: 학생인 자기 자신의 이미지)에 반동일적으로 떠올 때를 좋아한다.19\n 상징은 물뿐만 아니라, 의식 또한 집단 소속감이 중요한 지표인지 확인이다. 예를 들면, 졸업식에 참석하는 것과 같은 의식들은 학생과 졸업생 집단에 대한 소속감을 강화하는 것이다. 결혼식과 마지막기도, 여러 의식들은 상징과 같이 집단의 구성원이 되어가거나 의례를 통해 상징과 의식을 통해 집단 소속감을 확인하고 이에 감정적으로 작용한다.20 퀸스페라(예를 들면 가정에서의 퀸세나레(Quinceañera)는 15세 여자가되는 어린 시점에서 성년으로 접어들었다는 전환을 표시하는 의식이다.\n 16-1b 역할 획득 기능\n 집단 소속감의 상징으로 기능하는 것 외에도, 제품은 우리가 새로운 역할을 더욱 편안하게 느끼도록 도와줄 수 있다. 이러한 기능은 역할 획득 기능(role acquisition function)이라고 한다(그림 16-1 참조).\n 역할 획득 과정\n 소비자는 삶 속에서 많은 역할을 수행하며, 이러한 역할은 수시로 변한다. 한 개인은 예를 들어, 딸이자 아내, 며느리 형제자 여자 형제, 그리고 노동자의 역할을 수행하고 있을 수 있다. 한참 어렸을 적집에서는(지금의 사례에서는) 보행이나 아내, 삼촌이나 이모, 부모, 이혼한 사람, 조부모, 은퇴자, 과부 등의 역할을 지니고 있을 수 있다. 사람들은 일반적으로 세 가지", "source": "20261114_170108.jpg"}, {"kind": "heading", "text": "상징의 사용과 역할 전환 의식", "source": "20261114_170113.jpg"}, {"kind": "paragraph", "text": "단계를 통해 한 지위에서 다른 지위로 옮겨간다.21 첫 번째 단계는 지난 역할로부터의 분리(separation) 단계이다. 이것은 자주 버리는 역할과 관련된 제품들을 버린다는 것을 의미하는데, 아이들이 유아기에서 아동기로 접어들게 되기만을 바라는 것이 그렇다. 두 번째 단계는 한 역할에서 다른 역할로의 전환(transition)인데, 새로운 정체성에 대한 심리의 동요를 겪을 수 있다. 전환 단계에서 소비자는 다른 시기였더라면 거부했을 새로운 소유물이나 스타일을 받아들이게 될 것 같 수 있다. 마지막 단계는 통합(incorporation)인데, 소비자는 새로운 역할 및 그 역할에 적절한 행위에 적응하게 된다.\n 상징의 사용과 역할 전환 의식", "source": "20261114_170113.jpg"}, {"kind": "paragraph", "text": "그림 16-4는 우리가 새로운 역할을 획득할 때 상징과 의식을 사용하는 방식과 이유를 보여 준다. 사람들은 새로운 역할을 발굴해 하고 하는데, 그것을 성유하는 데 미숙하고 갈망하는 방법에 대한 지식이 부족하다. 사용 가능한 구조는 명확하지만 이들은 자신들의 지위와 연결되어 있는 제품이 무엇인지 알지 못하는 것이다. 예를 들어, 자신의 직업 관련 학교에서 경영학 석사학위는 다른 경영학 석사들에 비해 비즈니스세계와 일반적으로 연결되어 있는 상징을 사용할 가능성이 더 낮다. 사람들은 새로운 역할의 획득을 상징하기 위해 여러 가지 제품들을 사용한다고 한다. 적절한 제품의 조합은 중요하며, 그것의 없이는 다른 도움을 제공할 수 없다. 이와 같은 것이 무엇인지 묻지 않아야 한다. 예컨대 어떤 사람이 손으로 슈트에 비즈니스 스타트업 업체의 로고가 붙은 운동화를 신고 있었다면, 당신은 그 사람의 역할 반응을 생각해 보라.", "source": "20261114_170113.jpg"}, {"kind": "paragraph", "text": "그림 16-5와 같이, 의식(ritual로 통용되는)행동은, 역할 전환의 중요한 부분이다. 대학 졸업식에서 졸업 모자와 가운을 입고 무대를 걸어 올라가 졸업장을 받은 후 졸업식이 끝날 때 모", "source": "20261114_170113.jpg"}, {"kind": "paragraph", "text": "자를 던지는 것은 혼합 의식 중 하나이다. 미국에서는 입학의 의식들이 미혼에서 기혼 상태가 됨을 알리는데, 약혼식, 웨딩 샤워, 종교 및 처녀 파티, 리허설 디너, 결혼식, 환영 연회, 신 혼여행이 있다. 각 의식에는 적절한 관련 제품들이 있다. 여러 의식에서의 장례식은 선물이나 특정 음식을 먹는 것, 결제 카드로 사는 것과 고이나 유족을 나타내는 사지같이나 귀중품 을 전달하는 등 상징적 연출이 통합되곤 한다.22 형성적* 의례와는 다르게 변화 의례는 도와주는 과정에 관 여하는 이들이 자주 포함된다. 그림 16-5에 보이는 바와 같 이 이들은 자신이 참여하는 역할 전환을 인정하고 있는지 참여자들 에게 브리핑, 벌기 의식과 함께 사용되며 의식에 참여한다.\n이러한 피드백은 재귀 평가(reflexive evaluation)라고 부른다. 역 할의 역할에 대해 더 숙지했음을 느낄 수 있게 만들어 주고, 우리의 새로운 지위를 확정짓는다. 예를 들어, 새로운 합리적 경 영학 석사 학위를 얻은 사람은 가족과 동료 사업가로 인정해 주었 을 때 더 의미를 느낀다. 마찬가지로 많은 전환 의례와 이러한 전환 과정의 상징으 로 사용할 수 있는 제품에 집중해야 보기도 한다.\n 혼인 전환 혼인 미혼에서 기혼 상태로 넘어가는 전환에 있어 제품은 중요한 구성 요소가 된다. 예 비부부는 이전 단계로부터 분리하는 절차로서 각각 가지고 있는 소유물들 중에서 어떤 것을 처 분하고 어떤 것을 새로운 집으로 가져갈 것인지를 미리 정해야 한다. 보통 예비예에게 선행 선물 로 전달되면 상당한 정서와 상징성을 가지고 있다. 예비부부는 통합 단지로서 기존 소비에 문화적으 로 변형하는 과정의 약사를 만들고, 멤도울 줄 수 있는 새로운 제품들로 선택한다. 문화권에 따 라 결혼 의례는 명백하게 다르다.23 예를 들어, 필리핀들로 결혼식은 서 모리너나 파드 티에서 예식 선물을 검색으로서 각인 사례에 대해 상회하는 실행하여 품목으로 남겨준다.\n형성적인 기혼 혼인 전환 과정은 남자 배우자들에게 대초를 제공할 거같다. 이 과정에서는 원래 가지고 있던 것들을 먼저 가져가고, 공동 소유물로 편환한다. 그리고 상황에는 물론에게 는 소유물을 고의로 버릴 수도 있다.24 어떤 사람들이는 소유물을 과대하게 파괴하는데, 이러한 행동은 상징적으로 결혼 생활의 과분을 나타낸다. 이런 배우자를 처벌하며, 결혼을 상징하는 소유물 을 없애든 등 다양한 예식들은 필요하다. 이는라도 대조적으로, 가정 폭력 폐해자는 자신의 특별 한 소지품을 보호하여 가해자가 그 물건까지 자아를 파괴하지 못하도록 할 수 있다.\n사람들은 결혼 생활을 끝냄에 따라 다른 상징제가 기능을 수행해야 네 어려움을 겪을 수 있다. 예를 들어, 배우자 중의 한 사람이 죽을 때 배우자의 지위를 나타냈던 소비 물품들을 재평가하여는 도전을 더 많이 받게 될 것이다. 따라서 전시(전시의 지위를 나타내는 특효한 상 징을 잃는 사람은 상당한 상실을 느낄 수 있다. 그러나 다른 한편으로, 예를 들어 스포츠가 나 일반 경량 자전거(roadbike)를 구매하는 사람들처럼 역할 전환 과정에서 새로운 독신 상태를", "source": "20261114_170116.jpg"}, {"kind": "paragraph", "text": "상징하는 제품을 구매할 수 있다.\n 문화적 전환 소비자는 또한 다른 문화로 이동할 때 역할을 전환하기도 하는데, 이 과정 속에서 오랫된 관습을 버리거나 없애고 새로운 것을 채택한다. 국외 거주자들은 새로운 문화에서 출계해 나가면서 점점과 만나던 장소에 집착한다. 이러한 장벽을 줄이기 위해, 음식, 언어, 비디오, 신문, 보석 등의 같은 고향의 문화를 약간은 유지하고 있다라도 지역 행사나 의식에 참여하고, 지역적 관습에 맞는 소비 패턴에 적응하며, 브랜드를 의식하게 된다.26 어떤 사람이 오래된 관습을 상징하는 소유물로 버리거나 보유하는 것은 그러한 생활양식이 얼마나 지속되는지에 달려 있다. 소비자는 언젠가 원래의 나라로 돌아갈 가능성을 여전히 고려하기 때문에 자신의 고유 문화를 염두에 두기 때문에 물건을 보유할 수도 있다.\n 사회적 지위 전환 ‘누보 리치(nouveaux riches)로 불리는 신흥 부유층은 주로 과시적인 성격의 소유물을 자신이 획득한 지위를 보여 주고 자신의 역할을 강화하기 위해 사용한다. 이 역할 전환은 때로는 영향력 수행을 나타내기 위해 타인의 재평 평가가 중요한 의미를 가지는 그림 16-1의 상징적 역할 전환 모델과 일치한다. 한 작가에 따르면, ‘소비가 만족도, 해당 물품의 긍정적인 속성뿐만 아니라 재화가 서비스로 확장되는 과정에서 구매자가 과시할 의도에 관한 최종의 반응으로부터 나온다.’27 다시 말하자면, ‘뉴 머니(new money) 소비자들은 이 전환을 위해 옷 라벨이 브랜드 라벨이 나오게 읽는 반면에, ‘올드 머니(old money) 소비자들은 라벨을 옷 안에 둔다.", "source": "20261114_170121.jpg"}, {"kind": "heading", "text": "16-1c 유대감 기능", "source": "20261114_170124.jpg"}, {"kind": "paragraph", "text": "상징 혹은 역할 획득 기능을 수행하는 제품의 의미는 물론로부터 유래하지만, 소비자가 습관적으로부터 나올 수도 있다(그림 16-1 참조). 유대감 기능(connectedness function)은 특정 개인과의 개인적인 관계를 상징하며, 예를 들어, 친한 친구에게 받은 선물이라든가 고인이 된 아버지가 물려준 금테 안경과 같이 소비자 자신의 과거에 속한 사람이나 사건 혹은 장소와의 관계를 표상한다. 그러한 제품들은 소비자 개인의 역사에 있어서 중요한 역할을 해 왔기 때문에 소장할 가치가 있는 것으로 간주된다. 브랜드나 상표보다는 개인과의 관련성이 중요하기 때문에 그러한 제품을 대체할 수 있는 제품이란 존재하지 않는다. 제품의 상징적 의미에 관한 최근 연구들은 사람들이 유대감을 목적으로 제품을 소비하고 있다는 사실에 주목하고 있다. 예를 들어, 랏소노바와 베티뉴(Le&#x0301;o&#x0301;nard de vino and D&#x0301;ubuisson-Quellier) 같은 연구자들은 쇼핑이 가족이나 친지, 친구들과의 유대감을 표현하고 강화 향상시키는 수단이 된다고 지적한다. 그러나 예컨대 가족 구성원들이 각자의 직업과 맞벌이로는 일정한 시간대에 모두가 모이기가 힘든 가정도 있을 수 있다. 이런 사정으로 많은 가족 구성원들이 함께 여행을 하거나 혹은 가족 구성원들 간의 유대감을 다지고자 하는 활동에 애를 쓰고 있는 것이다. 다른 한편으로, 가족 구성원들이 함께할 수 있는 시간에는 모두가 즐거워할 수 있는 활동들이 필요하다. 가족 구성원들과 한 번 거리를 여행해야 하더라도 주말가정집 같은 외딴 유대감 상징적인 장소로 가야 할지도 모른다. 미국과 영국의 문화에서는 크리스마스 의식 동안에 가족의 유대감을 강조한다.\n 각각의 가족은 유대감을 조성하는 고유의 전통을 유지한다. 구성원들은 보통 이러한 전통으로부터 멀어지는 것에; 추수감사절 진찐과 요리의 재료 조리법에 대해 경쟁하게 저항한다. 많은 가족들은 예전 가추속진이나 비디오를 보며, 그리고 가족 이야기부터 앞으로의 계획까지를 상호 간에 논의하면서 유대감을 조성한다. 또 어떤 가족들은 가족 유대감 강화를 가미하기 위해 가족 중 한 사람이 기타 가족들을 반날을 위한 세미로 전화로 연락하여 유대를 강화한다. 소비자 행동에 대한 많은 연구에서 나타나듯이, 그러한 가족 전통의 상징적 유대감 기능은 가족 구성원들의 자아를 정의하는 데 있어서 긍정적인 역할을 한다.\n 대중의 전통들도 분만 아니라 과거에 대한 향수에 젖게 만든다.\n 특히폐절들은, 사람들은 제품을 소유했었던 다른 사람들을 알지 못하더라도 제품을 통해 유대감을 느낄 수 있다. 예를 들어, 사람들이 외로움을 느낄 때, 상징적으로 다른 사람들과 연결될 수 있는 중고책과 같은 제품을 선호하는 경향이 있다.35", "source": "20261114_170124.jpg"}, {"kind": "heading", "text": "16-1d 표현 기능", "source": "20261114_170129.jpg"}, {"kind": "paragraph", "text": "16-1d 표현 기능\n 상징으로서 제품은 개인의 독특한 특성을 드러낼 수 있는 잠재력을 지니고 있다.36 이러한 표현 기능(expressiveness function)은 다른 사람들과의 어떻게 관계를 맺느냐가 아니라, 자신이 얼마나 독특한지를 반영한다. 개인은 옷, 집 안의 장식물, 예술, 레저 활동과 음식 소비 같은 서비스들에 특별하게 우리들의 독특한 성격을 표현한다. 우리는 머리 모양, 분장이나 음악취향 자신이 개인으로서 어떤 사람인지를 드러내는 데 특히 적절한 특정 제품군을 찾으려고 모둔다. 특정 제품들은 비표준적이고 독특한 선택으로를 반영하기 때문에 ‘멋지다’고 여겨진다.38\n 16-1e 복합적 기능\n 특정 제품은 앞서 다른 기능들 중 일부를 수행할 수도 있다. 선물의 조부모로부터 결혼 선물로 받은 크리스털 와인 잔은 상징적인 기능을 수행할 수 있는데, 그것의 높은 가격이 사회적 지위를 나타내기 때문이다. 의례적 평가 기능 또한 수행할 수 있는데, 선물부부가 그들의 새로운 결혼 상태를 내면화하도록 도와주기 때문이다. 또한 조부모로부터 받은 선물이기 때문에 유대감 기능을 수행할 수 있는데, 선물부부의 가족들과의 특별한 관계를 상징한다. 마지막으로, 부부가 그 와인 잔을 개인적으로 매력적이라고 느낀다면 이는 개인적인 미적 취향을 상징하게 되고, 이를 통해 또래의 기능을 수행한다.\n 16-1f 상징과 자아 개념\n 제품의 상징적인 기능과 소비 의식은 중요한데, 두 가지가 합쳐져 자신의 누구인", "source": "20261114_170129.jpg"}, {"kind": "paragraph", "text": "대한 정서적 자아인 자아 개념을 정의하고 유지하도록 도와주기 때문이다.43 사회적 정체성 이론은 사람들이 자신의 정체성과 일치하는 정도에 따라 브랜드를 평가한다고 주장한다.44 이 이론에 따르면 자아 개념은 실제적 정체성 스키마(factual identity schema)라고 불리는 여러 범주의 정체성으로부터 형성될 수 있는데, 학업, 노동자, 병든 등이 있다. 이러한 정체성들은 부분적 역할과 다양한 수행방식은 물론 역할의 연속선 상에 존재한다. 이러한 정체성의 존재는 하나의 정체성을 다른 정체성보다 더 현실적이라 증명할 수 있다. 우리의 실제적 정체성은 이상적 정체성 스키마(ideal identity schema)에 의해 만들어질 수 있는데, 우리가 찾는 정체성이 이상적일 행로로 어떻게 실현될지에 대한 생각이다.\n 우리의 실제적 정체성 스키마와 이상적 정체성 스키마는 우리가 사용하는 제품과 어떤 소비 활동에 참여하려하는지를 규본다. 현대 문화의 과소비를 반대하는 소비자들은 사이에서 조직과 브랜드는 종종 반소비 메시지와 구조로 만들어진다. 즉, 업포더블지 속옷, 또는 각종 생산자 협동조합, 착취를 수반하는 생산에 대한 역설에 가득차있다. 이때 연구자에 따르면, 어떤 브랜드의 등가맆 가지고서 우리의 후거니 방식에 영향을 준다고 말로 정체성은 비일상적인 소비자 문화에 의문을 제기하는 사람을 포함한다. 한 조사에서 소비자들은 자산적 정체성을 공유하는 다른 가족구성원들에게 지가의 소비에 대한 통제를 받는다고 밝혔다.\n 이러한 우리의 정체성은 종종 물질적 재품을 도움으로 군다난 사실은 진화심리학적 전쟁에서 소유물을 늘어버란 사람들(예를 들면, 양로원, 앙의 옆에 있는 사람들)이 가끔 경제적 상실을 느끼는 이유를 설명해준다. 실제로, 귀중품을 잃어버리는 것은 사람들에게 좁은 그들의 정체성을 상실하는 것다. 예를 들면 어떤 사람이 자동차를 도요타 캠리와 같이 자기와 일치하는 평균적이고 기능적 자동차로 바꾼 뒤에 무급 봉급 포함 어떠한 기능을 수행하게 되면, 더 이상 미모한 방식이다. 반면에, 수백만 명의 소비자는 디지털로 정체성을 만들고 투사하기 위해 단어와 이미지, 링크 등을 사용하는 개인적인 웹사이트, 블로그 등의 인터넷 사이트를 갖고 있으며, 온라인에서 자아 개념을 다른 친구들과 공유한다.51", "source": "20261114_170132.jpg"}, {"kind": "heading", "text": "16-2 특별한 소유물", "source": "20261114_170136.jpg"}, {"kind": "paragraph", "text": "어떤 제품은 우리 마음속에서 특별하고 중요한 위치를 차지한다.54 이번 절에서는 무엇이 소비자에게 보편다운 제품을 특별하게 만드는지를 살펴본다.\n 16-2a 특별한 소유물의 종류 거의 모든 소유물이 특별해질 수 있지만, 조사자들이 연구한 결과 특별한 소유물은 몇 개의 범주로 나뉜다. 이러한 범주로는 반려동물, 추억이 담긴 물건들, 성취의 상징, 수집품이 있다.55\n 반려동물 그림 16-7과 같이, 미국 소비자는 반려동물을 아주 소중하게 여기는 경향이 있다. 60% 이상의 미국 가정이 반려동물을 기르며 연간 약 1,240억 달러를 소비하고 있다고 통계청을 작성한 계획하는 간에 이들은 종종 다른 구매를 포기하더라도 반려동물을 위해 돈을 쓰겠다는 경향이 있다.56 반려동물은 주인에 대한 반려동물에게 동반자 역할을 하며, 자녀들이 독립하거나 배우자를 잃었을 때 보는 네이도 큰 도움이 될 수 있다. 종종 1960/이라부르는 서비스 상자(box)에 포함되는 제품과 같은 서비스는 반려동물의 행복과 웰빙에 대해 새로운 구매 기회를 사이에서 인기를 끌고 있다. 또한 사람들은 반려동물을 데리고 휴가를 가는 경우가 점점 늘어나며, 브링피도닷컴(BringFido.com) 같은 회사들은 반려동물 친화적인 숙박 시설, 레스토랑, 이벤트 및 활동을 제공하는 종합 정보를 제공하여 유용한 서비스를 제공하고 있다.\n 추억이 담긴 물건들 어떤 제품은 특별한 사람, 장소, 경험에 대한 기억이나 감정을 불러일으키기 때문에 특별한 의미로 간다. 예컨대 가방, 옷등, 기념품과 특별한 사람들로부터 받은 선물인 있다. 종이 조각에 불과할 수 있는 티켓은 이걸 수도 있는가 가장 좋아하는 밴드의 콘서트를 보았던 기억을 자극하기 때문이다. 이러한 소유물은 나이 든 사람들이 행복하게 살 수 있는데, 다른 사람들과의 행복했던 시절에 대한 기억을 떠올릴 수 있다. 한 참가자는 자신의 옛날 새탕들과 함께 찍은 사진을 특별하게 생각하는 소비자가 많은데, 책상이나 벽거, 피아노에 사진을 전시함으로써 ‘성지를 만든다.59\n 성취의 상징 사람들은 업적을 상징하는 소유물 또한 특별한 것으로 간주한다. 1800년대 모로코프로의 위타주 이동을 조사한 한 연구자는 사람들의 대부분 능력을 보여 주는 소유물들을 갖고 있다는 사실을 알아냈다. 예를 들어, 남자들은 공부를 가득 채운 의자를, 바느질 기계의 실용적 기능이 있지만 가정적인 정서 또한 상징한다. 오늘날 스포츠에 참여하는 사람들은 발전", "source": "20261114_170136.jpg"}, {"kind": "paragraph", "text": "로 흔적이나, 심지어 눈에 띄게 소비되는 물건인 롤렉스 시계나 포르쉐 자동차가 있다. 최근 한 연구에서는 조상의 업적을 상징하는 유품이 조상이 숨졌던 것과 관련된 유품보다 더 저렴 한 가격으로 간주될 가능성이 높다는 것을 발견했다.64\n 수집품 수집품은 많은 사람에게 특별한 소유물이다. 흔한 수집 품에는 자동차 모형, 스포츠 기념품, 소라 껍질, 조형 동전, 야 구 카드, 인형, 페즈 사탕통(Pez dispenser)과 같은 어린 시절 물건 등이 있다(그림 16-8를 참조하라). 매틀(Mattel)은 바비 인형을 만드 는 회사로, 70년의 역사를 기념하여 엘리자베스 여왕의 바비를 선보였다. 이 인형은 판매를 위한 웹사이트에서 2시간 만 에 매진되었다. 이 인형은 최초로 눈을 붙임으로써 그동안 입구 가 봉인(봉인된 비닐 백)을 통해서만 확인하던 구입할 수 없는 수집 품에서 희귀하고 귀중한(500개만 생산되었다) 구입할 수 있는 아마도 수집품이 아니게 되었다.\n 수집가들은 보통 수집품은 자기 자신의 열정으로 보며, 개개인은 자신의 직업, 경험, 지인, 개인적 특질 및 능력을 상징한 다고 바라본다. 하나의 수집품일 수 있는 물건에는 승용차, 공구, 시계 및 보석, 남성적인 것과 여성적인 헬로키티 그 인형까지 다양 한 것들이 있다. 특정 수집품의 대표적인 예시로는 베이브 루 스(Babe Ruth)의 마지막 야구 경기에서 바티스티의 해직한 잡지를 찾는 것이 있다. 소비자들은 한때 큰 희귀 가치를 수반한 실물 기록과 정보, 희망지물을 수집한 엔지니어, 토끼 부채질로 슈 퍼 히어로인Bunny를 수집해왔다. 수집품을 보유한 그룹에의 체계적인 은유와 상징성. 연구했 더니, 수집가들이 수집품을 갖고 있을 때 느끼는 쾌락은 그들과 그룹에 새겨진 은유와 상징성, 연구했 더니, 수집가들이 수집품을 갖고 있을 때 느끼는 쾌락은 그들과 그룹의 체계적인 은유와 상징성. 연구했 더니, 수집가들이 수집품을 갖고 있을 때 느끼는 쾌락은 그들과 그룹의 체계적인 은유와 상징성과 관련 지을 수 있다. 수집가들은 자신이 수집물에 애착을 느끼는 것은 부분적으로 자신이 그 것들을 소비를 통해 (예를 들어, 그린 사람들의 초상 그림이라고 규정하듯이) 의의를 부여하기 때문이라고 생각한다.65\n 또 다른 특별한 소유물의 범주는 유품을 판매한 유평인이 소유했던 제품이다. 소비자는 때때로 그 물건을 수집의 목적으로서의 위해 큰 금액을 지출하는데, 그 이유 중 하나는 제품의 유평인이 본 질에 담겨 있는 것처럼 느끼기 때문이다.\n 16-2b 특별한 소유물의 특징 특별한 소유물은 몇몇 특징들을 지니고 있다.66 첫째, 특별한 소유물(가족 반려견이나 아끼는 옷 일렬째)은 주인에 따라 대체제가 적거나 없다. 사실상, 소비자는 특별한 소유물 을 대체 불가능하다고 보는데 그것이 과거의 특정 사건 및 사람들과 연관이 있기 때문이 다(1절 참조). 이러란 감성적 연대 때문에 소비자는 특별한 소유물을 만약 분실한다면 전에 사용 가격에 팔리 것이다. 보통은 물건의 가격에 대해 별로 생각하지 않은 채 특별한 소유물을 구입한. 예를 들 들어, 사람들은 반려동물이나 할머니가 만들어 주신 누비이불을 어떤 가격에도 팔지 않을 것이다.\n 넷째, 사람들은 특별한 소유물을 버리는 데 거부감을 느끼는데, 그것이 기능적인 가치를 잃었을 때도 그렇하다. 어린이들은 이런 면 덜던 도쿄나 봉제 인형을 떨이지는 것을 섭외하", "source": "20261114_170139.jpg"}, {"kind": "heading", "text": "16-2c 어떤 제품이 특별한 이유", "source": "20261114_170144.jpg"}, {"kind": "paragraph", "text": "더 가장 좋아하는 물건이 다 해지 낡을 때까지 간직할 것이다. 또 어떤 이들은 가장 좋아하는 옛날 책을 버리는 것은 귀하다며, 당신의 부모님은 당신의 오래된 성적표와 당신이 그들을 위해 그렸던 그림을 아직도 간직하고 있는가? 당신이 받았던 특별한 생일 선물들은 아직까지 소장하고 있는가?\n 마지막으로, 소비자는 특별한 소유물을 종종 의인화하곤 한다. 여러 이들은 개별 수제품에 이름을 붙이거나 자신의 집에 이름을 붙이고, 자동차나 배를 성처럼 떠받들며 밥을 대신 먹는 동물들에게 인격을 부여한다는 사실을 보았다. 한 수업에서는 이들의 소유물 중 몇 개를 돌보며 거쳐갈 두루마기를 바꾸지 못하는 그 녀에게 물어보며 그것을 입어보면 왜 절망에 빠지는 것이다.68\n 16-2c 어떤 제품이 특별한 이유\n 소유물은 상징적인 가치, 기본 전환 속성, 도구적 중요성을 비롯한 여러 이유에서 특별한 의미를 지닌다. 표 16-1이 이러한 세 가지 일반적 범주 아래에 있는 더 구체적인 이유를 보여준다.", "source": "20261114_170144.jpg"}, {"kind": "heading", "text": "16장 상징적 소비와 생활", "source": "20261114_170147.jpg"}, {"kind": "paragraph", "text": "상징적인 가치: 소유물은 특별할 수 있는데, 이 장 앞부분에서 다룬 상징적 기능, 역할 전 용, 유대감과 표현의 기능을 충족시키기 때문이다. 예를 들어, 사람들은 미술품, 가방, 보 석 등이 자신의 스타일을 표현해 주기 때문에, 그리고 받은 선물이라서 특별한 사람들과 그들을 연결해 주기 때문에 그것들을 아낀다.69\n 개인 차원 형성: 소유물은 개인성을 전환할 수 있는 속성이 있기 때문에 특별할 수 있다.\n예를 들면, 트로피, 균, 칭찬 수, 가족으로부터 물려받은 귀중품 등은 자부심, 정체, 기쁨 같은 감정을 유발한다.\n반대로 품목은 위안과 안정, 클락감을 줄 수 있다. 좋아하는 밴드의 노래는 소비자에게 집 처럼>같이 만들어 특벼하다. 옷은 소비자들이 다른 사람들과는 손쉽게 연락하고 정보를 얻을 수 있어 스트레스 제거와 휴식에 사용할 수 있다.7몇몇 조사에 따르면, 그녀의 옷장을 정리할 때 하는 사람들은 옷이 다른 사람에 행복한 일들을 연상시키기 때문에. 기장히 유쾌한 기억을 떠올리게 하는 것으로 보인다.이로 인해 공간을 깨끗이 정도하면서 매우 긍정적인 기분을 느끼는 사람도 있다. 어떤 소비자들은 좋아하는 수많은 활동을 할 때 입었던 옷을 가장 행복한 일을 할 때 입었던 옷으로 기억한다고 한다. 예를 들면 미래의 남편을 만난 옷(아니면 진부하게 들리겠지만, 처음 키 스를 한 다음날 입었던 옷을 기억한다.\n 실용적인 가치: 소유물이 특벼한 유용성이 있기에 특별할 수도 있다. 차와 지하철, 휴대전화와 컴퓨터를 소비자들은 교통의 도구로서 차량을 인식하고, 대부분의 시간에는 특별하지 않다고 인식한다. 하지만 어떤 현실을 소비자들은 소비재의 도구적 가치를 인식하는 것이다.\n 16-2d 중요한 소유물과 함께 치러지는 의식 우리는 특별한 소유물의 의미를 만들거나, 강화하거나, 향상시키기 위해 자주 의식에 참 여한다. 이러한 의식들은 소비의 획득, 사용이나 처분 단계에서 행해질 수 있다.\n 획득 단계에서 소유 의식(possession ritual)은 새로운 물건에 대한 개인적인 소유권을 주장 할 수 있도록 해준다.7° 예를 들면, 새로운 바지를 살 때 기장은 조정하거나, 구두짝거 맘문 장식을 자로커며, 장식을 추가할 수 있다. 시트커맨 같은 개인적인 침로로 새 자동차를 장식할 수 있다. 새로운 의자는 밥집에 갖다 두지 않고, 그려을 걸고 겨든 노답 입리 가구를 배하지만.\n이러한 단계에 거쳤었던 물건에 대한 소유 의식에는 에전 주인의 흔적을 제거하는 데 목전 거려진다. 크진, 일부 소비자들은 중고 제품이나 가족들로부터 물려밭은 오랜된 물건을 폭 소유 유문장 지도석으로 삼는 답보, 샤전 물건에 대한 의식을 발휘함으로써 새 의미를 넣을 수 있는 이다. 이는 낙서가 새 물건에 개인적인 색위를 부여하며 새 것을 완충하는 이유가 오래된 제품을 요 것은 아니다. 예를 들어, 중고 제품에는 소비자가 자신만의 새 집을 건축하는 이유가 오래된 제품을 옮긴 전의 거주자들에 의해 '오염’되었다는 생각 때문이다. 이는 레이디 가가(Lady Gaga)가 신었던 신 발이나 메이저리그 팀의 사인한 야구공처럼 판매될 혁신적 상품은 전혀의 소유물에서 벗겠던 소 유물을 통해던 소비자가 느끼는 상징적인 혜택 때문이다. 한편, 유명인의 소유했다 않았던 삭 유물을 통해서 소비자가 느끼는 상징적인 혜택 때문이다. 한편, 유명인의 소유했다 않았던 삭 유물을 통해서 소비자가 느끼는 상징적인 혜택 때문이다. 한편, 유명인의 소유했다 않았던 삭 유물을 통해서 소비자가 느끼는 상징적인 혜택 때문이다. 한편, 유명인의 소유했다 않았던 삭 유물을 통해서 소비자가 느끼는 상징적인 혜택 때문이다. 한편, 유명인의 소유물로 묘사하면 획득 한 소비자가 유명인과 일치하지 않는 방식으로 사용할 경우 소비자들은 이를 엄격하게 판단 한 연구들은 소비자가 특정 제품(예: 냄모기에 대해 느끼는 불쾌감 '불쾌한 제품과 물질적으로 닿아 있는 제품들로 전이될 수 있음을 보여 준다. 이러한 박테리아 식처럼 찰점성 높은 일반적인 소비자들에게 비싼보석류 재정의 주식이 육류 패커지가 소매상을 안에 있 는 반들한& 적극으로 촉진된답고 한다.75\n 사용 단계에서 소비자들은 특별한 제품의 최동 상태를 일정에 내거나 유지하기 위해 손질 의식(grooming ritual)을 행할 수 있다. 예를 들어, 소비자를 포함한 일부 페트(애완) 반액에게 반응과 외로움을 느끼는 것을 방징할 수도 있다.” 어떤 소비자들은 맞복적인 도착하기 전에 새 셔츠", "source": "20261114_170147.jpg"}, {"kind": "heading", "text": "16-3 신성한 의미", "source": "20261114_170152.jpg"}, {"kind": "paragraph", "text": "동안 자동차를 세차하고 왁스칠하거나 집을 청소한다. 가끔 손질 의식은 개인에게도 확장되어서 특별한 사건 전에 많은 시간을 들여 자기 자신을 꾸미게 된다.\n마지막으로, 서비스가 상징적인 의미를 잃을 때 소비자는 처분 의식(divestment ritual)을 통해서 개인적인 의미의 흔적을 모두 지우는 경향이 있다. 예를 들면, 많은 사람은 구독하던 잡지를 발행기 전날에 주소 변경을 제출하고, 컴퓨터나 스마트폰을 팔거나 기부하기 전에 개인적인 파일들을 삭제한다. 몇 개의 단계를 거쳐 소유물을 처분하기도 하는데, 완전히 팔거나 버리기 전에 거실에서 다락으로 옮긴다.\n 많은 소유물이 특별한 것으로 간주되지만, 일부는 너무 특별해서 신성한 것으로 여겨진다. 신성한 개체(sacred entity)는 구별되고, 존중받고, 숭배되고, 엄창난 감정을 통해 대접받는 사람이나 물건, 장소이다. 우리는 이러한 개체에게 깊이 감동받고, 그것들을 건드리지 못했을 때 분노와 강한 반발을 느낀다. 반대로, 세속적인 것의 속성은 profane(세속적이라는 뜻) 또는 비종교적인 뜻이며, 세속적인 사물은 더 광범위한 목적에 쓰인다는 사실로 인해 신성한 것과 구별되곤 한다.79\n 영화배우, 유명한 가수, 존 F. 케네디와 마틴 루터 킹 같은 역사적 인물, 피라미드나 부처 같은 종교적 리더는 팬과 신자들에 의해 신성하다고 간주된다. 유명한 사람들의 신성한 지위는 다른 사람들과 구분되는 의미에 의해 만들어진다. 소설가 그레이스(P. Lewis Graceden) 같은 생존해 있거나 고인이 된 유명인에 의한 상품은 높은 부가가치를 만들어주고 싶다.\n가보와 조상들의 사진이 신성한 지위를 얻게 되는 이유 중 하나는 우리가 조상들을 영웅으로 간주하기 때문이다. 조지 워싱턴이 왓슨의 쾌전업에 의한 정체성과 관련된 공로로 신성하게 귀중한 것으로 여겨진 이유로 설명할 수 있다. 개인이나 단체와 관련이 없는 물품은, 이러한 위인들은 국가적 정체성을\n 많은 소비자는 노래, 해주가, 마술쇼, 예술 작품, 가보의 조각품, 명절 같은 전쟁과 박물관, 일반적으로 의식, 태기간행, 다양한 성령 같은 장소 또한 신성한 것으로 간주한다. 이러한 신성한 개체는 가슴을 울리거나 감동시킨다. 특히 강력한 경험이나 위기 상황을 통해 만들어지는 강력한 감정은 불멸이다. 신성한 사람, 사물, 장소, 의의 의도 종교적 휴일, 결혼식, 출생, 사망, 성인 감사기도 같은 특정한 시기의 사전을 신성화한다고 할 수도 있다.\n신성한 개체는 평범한 일에 맞닿아 있는 수수께끼의 신화를 포함한다.80 예를 들어, 교황은 거의 신적인 존재로 여겨진다. 그리고 코비 브라이언트, 메릴린 먼로, 마틴 루터 킹 주니어같은.. 신성적인 존재들은 수수께끼가 관련이 있다(그림 16-9 참조). 신성한 개체는 시간, 장소, 공휴일 같은 생활 속 일부로 자리 잡고 있다. 예를 들어, 알라모(Alamo) 요새에 관하여 역사적인", "source": "20261114_170152.jpg"}, {"kind": "heading", "text": "16-4 선물을 통한 상징적 의미의 전달", "source": "20261114_170154.jpg"}, {"kind": "paragraph", "text": "전략가가 벌어지고 있는 현장에 있는 것처럼 느낄 수 있다.\n 신성한 물체는 또한 강력한 접근/회피 특성을 지니고 있고, 압도적으로 강력하고, 매료된 감정을 만들어 낸다. 예를 들어, 사람들은 영웅이라고 생각하는 사람을 가까이에서 보고 싶고 만져 보고 싶어 그 사람들과 함께 사진을 찍는다. 영웅을 동경에 가깝게 느끼는 것이다. 리버풀 맨체스터 유나이티드 등의 팬들은 이 명문 구단의 경기장에서 성지순례 같은 감정적인 경험을 한다. 이러한 은유의 주제는 마돈나, 말랄라 같은 유명인에게 쉽게 찾을 수 있다. 즉, 이들은 태어나면서부터 영웅의 삶을 산 것이 아니라, 그들의 극복 과정이 이들을 영웅으로 만들 었다는 점에서 더욱 신성하게 여겨진다. 신성한 개체는 사람들에게 희망과 영감을 준다. 이러한 존경의 감정은 사람들로 하여금 자신의 삶을 변화시키고자 하는 동기를 부여한다. 예를 들어, 말랄라(Malala) 같은 영웅의 삶과 업적에 비추어 현재 인생 동안 자신이 이루지 않은 것을 보면 것 같다. 어떤 사람들은 앞서 언급한 마돈나처럼 신성성을 추구하면서 고행의 삶을 살기도 한다. 신성한 개체로 우리는 우리가 속한 세상보다 더 위대한 영적 세상에 살고 있다는 감정적인 느낌이 든다. 예를 들어, 어떤 사람은 말랄라 선물 소비의 다른 중요한 측면은 물질적 재화(예: 옷과 장신구, 레스토랑 식사권)뿐만 아니라, 는 선물을 통해 한 개인으로부터 다른 개인으로 의미가 전달되는 과정을 포함하고 있다는 점이 다. 선물은 세 가지 단계를 통해 이루어진다. 구상 단계(gestation stage)에서는 받는 사람에게 물질적으로 재가 무엇인지 고민한다. 증정 단계(presentation stage)에서는 실제로 선물을 준다. 나아가, 재구성 단계(reformulation stage)에서는 선물 증정 경험을 바탕으로 관계를 재정의한다.85\n 16-4a 구상 단계\n 구상 단계는 선물을 주게 되는 사회적 의무를 의미한다. 예를 들어 사람의 장례식과 같은 경우, 단계에서 고려할 수 있는 한 가지 가능한 선물이 있다. 예를 들어 Macy's에서 상품권이나 경험적인 선물(예: 패미리 상품권) 등을 무엇의 줄 것인지이다. 사람들은 선물을 전달의 상징적인 뜻과", "source": "20261114_170154.jpg"}, {"kind": "heading", "text": "증정의 동기와 감정 / 선물의 적절성과 의미", "source": "20261114_170200.jpg"}, {"kind": "paragraph", "text": "인 선물을 주기 위해서 받는 사람에 대해 더 많은 것을 알아야 한다고 생각한다.87 선물을 주는 사람은 받는 사람이 감동적인 선물을 좋아할지 확신하지 못했기 때문에 감동적인 선물보다 감동적이지 않은 선물을 고려하는 경향이 있다(받는 사람은 감동적인 선물을 좋아할 가능성이 높음에도 불구하고).88 이 절에서 다룰 내용은 구성 단계에서의 선물의 동기와 감정, 선물의 적절성과 의미, 그리고 선물의 가치를 포함한다.\n 증정의 동기와 감정 구성 단계에서 사람들은 선물 증정의 동기를 탐동시킨다. 한편으로는 사람들이 이타적인 이유로 증정할 수 있는데, 받는 사람을 돕거나 그에 대한 사랑을 보여 주기 위한 것이다. 이러한 경우에 그들이 고르는 선물은, 얼마나 획득하기 쉬운지가 아니라 바람직함에 달려 있다.89 한편, 친족을 잃은 친구의 집을 방문할 때, 조문객들은 가족들을 돕기 위해 슬픔을 덜어 줄 수 있는 선물을 준다. 우리는 관계의 이유를, 개인과의 친밀함을 상상하는 선물을 통해 알 수 있다.90 또한 설명하기 어려운 이유로 줄 수 있는데, 증정 행위로 인해 긍정적인 감정적 경험이 얻어지기 때문이다. 이때의 순수적인 이유로 줄 수 있는데, 향상이 더 높은 성적을 기대해서 선생에게 작은 선물을 하는 사람이라면 순수한 마음의 실천으로 보기 어렵다고 기대하는 것이다. 또 다른 소비자는 다른 수취인의 의무적인 이유로 증정하려고 하는데, 상황이나 관계가 그것을 요구한다고 느끼기 때문이다. 실제로 받은 사람들에서는 받은 선물이 긍정적으로 반응하지 않기도 하는데, 이는 화답해야 할 의무를 느끼기 때문이다.\n 때때로 사람들은, 죄책감을 줄이거나 분화한 감정을 완화하고 싶어서 선물을 증정한다. 이를 보상적인 선물(compensatory giving)이라고 부르는데, 예를 들면 어떤 남편은 최근 아내에게 잘못해서 깨어야 하는 배웅가 위여조 청구 과정에서 공정한 보답보다 더 많은 돈을 보상한 던다.91 가끔 사람들은 부정적인 의도로 선물을 주기도 한다. 예를 들어, 좋아하지 않는 사람의 결혼식에 초대받으면 감정, 본인 생각에 별로 마음에 안 든다고 생각하는 선물을 줄 수도 있다.\n가끔 선물을 주는 사람들은 감사의 뜻으로 그냥 줄 수도 있다. 어떤 사람들은 선물이 완벽해야 한다고 느끼거나 적절한 선물을 찾을 시간이 나 돈이 부족할 수도 있다. 이런 사람들의 증정이 받는 사람에(예: 동료들끼리 줄 선물을 고락야 할 때 모두에게 똑같은 선물을 주고 싶지 않아 한다). 대신 소비자에게 완전히 다른 선물을 준다.99 감정 역시 사람들의 선물하는 동기에 영향을 미친다. 행복한 경험을 느낀 사람들은, 자신이 직접 만든 선물을 주고 싶어 한다. 자체적으로 선물이 독특하고 느끼고 싶은 사람들은, 이미 자신의 소유를 팔았던 선물을 주지 않는 다. 예컨대, 자신이 갖고 있지 않은 물건을 선물로 주면, 이는 덜 바람직한 선물을 주는 결과를 초래할 수 있다.95\n 선물의 적절성과 의미 선물의 적절성은 상황과 선물을 주는 사람과 받는 사람 간의 관계에 달려 있다. 예를 들어, 직장은 상사에게 관례로 선물하지 않는다, 지나치게 개인적인 물품이기 때문이다는 바의 가치로, 연구에 따르면 여성들은 연인 초기의 평범 선물보다는 보석류와 같은 비실용적인 선물 을 더 좋다고 생각한다. 이는 평범 선물이 연인 상대와의 권리 관계와 유사하게 일상적인 관계를 연상시키지만 친한 친구들에게는 같은 선물조차 생활필수와 실용적인 것은 남은 관계이기", "source": "20261114_170200.jpg"}, {"kind": "heading", "text": "16장 상징적 소비와 행동", "source": "20261114_170203.jpg"}, {"kind": "paragraph", "text": "때문이다. 선물을 주는 상황이 명확히 정의된 경우에는 상품과 선물이 겹치지 않더라도, 선물이 예상되지 않은 상황에서는 높은 가치를 지닐 수 있다. 아주 작은 것이라도 자발적으로 노동을 제공한 것은 사람의 관심을 나타낼 수 있다.98 따라서 소중한 누군가가 작은 무언가를 보냈을 때 크게 감동받을 수 있다. 깊은 유대관계에 있는 사람에게는 상품적 선물이 매우 중요하다. 자주 만나지 않는 사람들한테 정겹게 생일 카드를 보내는 것은 적절하고 바람직하다.99\n 선물의 가치 선물의 가치는 선물 증정 과정의 중요한 요소이다. 당신은 어머니를 얼마나 사랑하는지 보여 주기 위해 어머니 선물에 돈을 쓸 수 있다. 소비자가 속한 문화는 선물의 가치에 대한 결정에 영향을 미칠 수 있다. 예를 들면, 일본에서는 받은 선물의 가치를 재빨리 계산하고자 하는 경향이 있다. 소비자는 남들을 위해 선물을 증정하기로 결정하여 예산을 배분함으로써 구매 가능한 선물이 가지는 것을 평가한다.100 그리나 주는 사람과 받는 사람의 관계 형성에는 때로는 받는 사람이 선물에 의해 높은 경제적 가치를 때만다뿐더러, 선물을 주는 사람이 가진 것을 주어야 한다. 보통의 경우 선물이 지닌 물질적 가치는 물론, 이때 주는 사람은 물질적 가치에 별다른 느낌을 느끼기 힘든 것이다.\n 16-4b 증정 단계\n 증정 단계는 실제 선물의 교환을 일컫는다. 이 단계에서 주는 과정의 의식 또는 의례적인 측면이 아주 중요해진다.\n 증정식 증정 단계가 진행되는 동안 주는 사람은 선물을 포함하여 말할 때만 그들마다 어떻게 하면 합리적인 결정을 한다. 선물을, 적당한 포장지에 보기 좋게 싸는 행위는 매우 생산적인 선물 증정의 비상징적이며 더 커져가는 행위이다.101 포장을 좋아하는 주는 사람은 그에게 받는 사람이 대한 원하는 관심을 포장한 것임을 의미한다.102 그러나 선물 포장도 중요성을 상당히 형식성과 사실성에 따라 평가될 수 있다. 예를 들면, 비에스에 가까운 사장의 감각적 선물이나 배우자에게 주는 감각 선물로서마치 못한 상한 선물은 그늘에 가려지게 된다. 포장답게 오히려 포장답지 않았을 때 매우 적절한 것이다.\n 시기 선정과 촉발 시기 선정과 촉발의 가능성 모두 선물 증정에서 중요할 수 있다. 예를 들면, 사람들은 선물을 증정 크리스마스 축제는 일반적으로 언제 포장된 선물이 신뢰로 포함하기 경제적 트리가 한 달 안에 걸쳐 동안 경제적으로 불이 있거나 그 속에 들어 있는 내용을 반영하는 것이 핵심인 요소이며, 선물 포장을 받는 사람들이 올바른 포장 속에 있어 있어 있을 수밖에 보편적인 요소이다.", "source": "20261114_170203.jpg"}, {"kind": "paragraph", "text": "육 고조된다.\n 받는 사람에 대한 관심\n 수혜자에게 집중하는 것은 선물 증정 단계의 중요한 부분일 수 있다. 예를 들어, 결혼 선물 증정 파티에 참석하는 사람들은 예비 신부가 선물을 개봉하는 동안 눈을 떼지 않고 쳐다볼 것이다. 고려해야 할 그 밖의 요소는 선물, 수혜자의 자아 개념과 주는 사람의 자아 개념 사이의 조화이다. 구체적으로 말하면, 선물을 주는 사람의 자아 개념과 맞지 않는 선물을 주는 것은 그에게 나쁜 영향을 줄 수 있다. 예를 들어, 친한 친구에게 그가 좋아하는 이미지를 고려해 티셔츠를 선물했지만 그것이 자아 개념과 맞지 않아서 자신의 마음에는 들지 않으면, 자신의 선택에 대해 기분이 좋지 않을 것이다.104\n 받는 사람의 반응\n 또 다른 전략은, 주는 사람이 받는 사람으로부터 끌어내고자 하는 반응을 받는 사람의 실제 반응, 받는 사람의 반응에 대한 주는 사람의 반응이다. 앞서 언급했듯이, 받는 사람의 만족감이 확산되어 가면 선물 증정 단계에서 주는 사람은 매우 좋은 느낌을 갖게 된다. 따라서 선물을 여는 동안 수신자의 반응은 상당히 중요하다.105 증정 단계에서의 불안을 덜기 위해, 선물을 주는 사람들은 시간이 절약되는 선물로 받는 것이 돈이 절약되는 선물을 받는 것보다 좋게 느껴진다는 사실을 아는 것이 좋다.106\n 그렇다면, 가장 좋은 선물은 무엇일까? 받는 사람이 원하는 것을, 정확히 찾는 것은 이상적인 선물이 된다. 기억에 남기면 경험적인 삶을 바꾸는 선물들은 최고의 선물이 될 것이다. 두 선 모두 또 놀라움과 기쁨, 유쾌, 격렬한 감정을 주는 것과 이타적인 마음가짐, 그리고 선물을 받는 사람에게 어떠한 형태의 희생을 요구한다.107\n 16-4c 재구성 단계\n 재구성 단계는 선물 증정 과정의 세 번째이자 마지막 단계이다. 이 단계에서 주는 사람과 받는 사람은 선물 증정 과정에 얽혀서 관계를 재평가한다.\n 관계 결속\n 선물을 주는 사람과 받는 사람 사이의 관계에 다양한 방식으로 영향을 줄 수 있다. 선물은 두 사람 간의 관계를 유지하거나, 강화하거나, 약화시킨다. 선물은 연대, 결속, 혁신의 감정을 전달으로써 관계를 강화할 수 있다. 경험적 선물의 마지막 상품들은 같은 가격의 물질적 선물보다 소비하는 상황에서 더 강렬한 감정을 느끼게 때문에, 관계를 더 향상시키는 경향이 있다.108 또한 선물은 이미 존재하는 친선의 감정을 입증하면서 관계를 확화한다. 조사에 따르면 연인 관계는 한 사람의 높은 사이의 관계를 공식적으로 알리기 위해 다른 이에게 선물을 줄 때 더 큰 지속될 가능성이 높았다. 또 정적적인 측면으로 보, 관계 회복과 선물을 받는 사람이 원하는 바를 찾으려는 노력이 부족하거나 혹은 독단적이거나 신경 쓰지 않은 선물은 관대", "source": "20261114_170209.jpg"}, {"kind": "heading", "text": "담례", "source": "20261114_170212.jpg"}, {"kind": "paragraph", "text": "재구성 단계에는 선물을 받은 사람이 다음 기회에 담례(reciprocation)를 할지 여부와 그 방 법에 대한 암수가 달려 있다. 누군가에게 멋진 선물을 주었다면, 일반적으로 다음 기회에 그 사람이 담례하기를 기대한다. 반면에 주는 사람과 받는 사람 사이의 유대를 악화시키는 선물 을 주었다면, 받은 사람은 다음 기회에 별로 좋지 않은 선물을 주거나 선물을 아예 주지 않을 것이다.\n 담례를 하지 않아도 되는 상황이 사람도 존재한다.110) 예를 들어, 어떤 이가 아프거나 재난을 당했어서 집이 화재로 불타버렸을 때 선물을 준 경우에는 담례를 기대하지 않을 것 이다. 그러나 전혀 기대하지 않았던 사람의 크리스마스 선물을 주었다면 아마 죄책감을 느끼 고 미래에도 선물을 주거나 위의 부채감을 갚게 될 것이다. 경제적 수입이 없는 사람들(어린이, 학생 이나 자기가 낮인 사람들)도 담례해야 할 부담이 적기 때문에 주는 사람이 선물을 주기 더 높은 사 람에게 선물을 주는 것보다 되는 것으로 간주될 수 있다. 따라서 부모가 자녀에게 선물을 주고 보답을 받기를 기대하지 않는다.\n 담례에 대한 사람의 반응은 주는 사람과 받는 사람 간의 관계에 따라 달라진다. 이를 들어, 주고받기 통틀에서의 관계는 제한적이며 잠정적인 교환으로 구성된다. 선물은 주로 동료나 통해 유대감을 형성할 수 없으며 또한 가족과 친한 친구들 사이에는 담례를 권장하지 않는다.111)", "source": "20261114_170212.jpg"}, {"kind": "heading", "text": "16-5 자선 기부", "source": "20261114_170217.jpg"}, {"kind": "paragraph", "text": "마케팅이 자선 활동에 미치는 영향은 중요한 연구 주제로 이어져 왔다. 이는 별로 눈부시지 않은 사안인데, 그도 그럴 것이 미국에는 15만여 개의 자선단체가 있으며, 2021년에는 개인이 자선단체에 326,87억 달러를 기부했다.114 그림 16-11은 18세 이상의 인터넷 사용자가 기부하는 단체의 유형을 보여 준다.\n 16-5a 자선 기부하는 사람들\n 모든 사람이 똑같이 자선단체에 기부할 가능성이 있는 것은 아니다. 자신이 다른 사람들보다 더 낫다고 느끼는 사람들은 이타적인 이유로 다른 사람들에게 기부할 가능성이 크다.115 자선단체의 수혜자가 처해 있는 곤경에 동정하게 되면, 이타적인 소비자는 정당한 분배에 맞춰 모두가 늦게 고통을 경감해야 한다고 느끼며 더 많은 돈을 기부하지만 개인이 기부에 대해 의사결할 때, 소비자는 더 밀접한 공감 능력을 느끼고 더 많은 돈을 기부한다.116 또한, 성을 인격적인 정체 해석으로 가진 소비자(즉, 그들의 일원으로 자신을 더 많이 생각하는 사람들)가 독립적인 자기 해석을 가진 소비자(즉, 자신을 개인으로 생각하는 소비자)보다 자선 활동에 더 개방적이다.117 교육수준이 높고 소득수준이 높은 사람들은 다른 사람들을 돕는 데 더 책임감을 느끼며 기부할 가능성이 높다.118\n 이타의 젊은 사람들은 급진적인 정치성을 가질 가능성이 높아진 반면, 연민적 사람들에게는 기부할 가능성이 높아진다.119 정치적 이념도 자선 기부에 영향을 미친다. 진보자와 보수자는 기부 규모에서는 유사하지만, 진보자들이 더 많은 자-주로 규모가 작은 금액을 기부하는 반면, 보수자들은 적은 기관에 더 많은 금액을 기부하는 경향이 있다.120", "source": "20261114_170217.jpg"}, {"kind": "heading", "text": "16-5b 사람들이 자선을 베풀 때", "source": "20261114_170220.jpg"}, {"kind": "paragraph", "text": "자선 기부에 영향을 미치는 몇 가지 요인은 마케터에게도 중요한 시사점을 줄 수 있다. 예를 들어, 일부 소비자들은 기부 요청을 받으면 무정하거나 무관심하게 보이고 싶지 않아 어려움을 겪는다.121 소비자들은 두 대상보다 한 대상에게 기부 요청을 받았을 때 자선단체에 기부할 가능성이 더 높은데, 한 명에 대한 기부 요청을 받으면, 고객자는 긍정적 감정에 대한 욕구와 도움을 주려는 욕구 사이에서 갈등을 덜 느끼고, 끌린다.122 \n 기부 사이트들은 또 다른 지적 특성의 공간을 제공한다. 기부 요청이 수혜자가 아닌 다른 사람에 의해 작성된 경우 사이트는 더 성공적인 결과를 보여준다. 왜냐하면 이러한 방식이 소비자에게 더 신뢰할 수 있는 메시지를 전달하기 때문이다.123 \n 다른 연구에 따르면, 어떤 소비자들이 자선 활동을 위해 시간을 자원할 의향이 있는지 물어보는 것은 그들의 돈을 기부하려는 생각을 한 부수시켜 감정적 반응을 유발한다고 한다. 이들은 금액적 가치를 크로낸거리면(monetary) 기부를 망설이지만, 그러나 기부 의향을 묻는 것은 용기를 북돋아 그것이 거래처럼 느껴져 기부금은 더 낮은 기부로 귀결된다. \n 일부 자선단체는 세일 시 소비자에게 크게 마크다운 같은 제품을 제공하기도 한다. 연구에 따르면, 이들은 심층인지 제품군보다 쾌락적인 제품을 구매한 후에 더 많이 이루어진다는. 이는 미리 신념과 자선단체의 사명을 구매하기 때문이다.124 \n 또 다른 연구에서는, 사람들이 기부에 대한 선물보다는 ‘자선 구매로 제품이 제시된 바에 가볍할 가능성이 높다’는 것을 보여 주었다. 이는 기부에 대한 때로는 선물을 받는 것에 대해 갈등을 느끼기 때문 요고 생각된다.125 또한, 기부 요청이 손익을 받음이라는 방식으로 제안되었을 때(예, 0.89달러에서 1달러로) 고객자들이 수혜자들에게 타인중 한 긍정적 인식하게 하는 영향을 미쳤다. 수혜자들은 긍정적인 특성을 가진 자격을 있는 집단으로 인식할 때, 소비자는 더 높은 관심을 느끼고 더 많은 돈을 기부한다. 반대로, 수혜자들이 부정적인 특성을 공유하는 것으로 인식되면 기부 금액이 감소한다. \n 연구 결과에 따르면, 소비자는 기업 후원을 받는 자선단체에 기부할 가능성이 적으며, 이는 개인 기부금이 덜 중요하게 여겨질 것이라고 믿기 때문이다.129 또한, 소비자는 도너스초이스(DonorsChoose.org)와 같은 사이트에서 기부한 돈이 선호하는 특정 목적에 사용될 내 배신감을 느낀다. 그 결과, 부정적인 인식으로 되파되므로 다른 자선단체로 기부를 전환한다.130 \n 기억들은 긍정적이거나 부정적인 감정 메시지를 사용해 기부를 유도할 수 있다. 최근 연구에 따르면, 기부 대상에 대한 공감과 기부자에게 엄마 같은 불편감이 함께 유도될 때, 후원자가 각각 단독으로 주어지는 경우보다 더 효과적이다. 예를 들어, 향수(nostalgia)는 사회적 연결을 촉진하기 때문에 이 두 가지 감정을 수반한다. 소비자가 수혜자에 공감할 때 더 효과적이다.131 자선단체에서 잠재적 기부자 상대로 높은 수준의 지원을 유도할 때, 떳떳하지 사고방식을 주입하게 된다. 이들은 수혜자와 같은 행동을 연상하게 된다. 또 다른 연구에 따르면, 후원자가 기부자 집단의 일원이라고 생각하게 만들면 후원자들의 공감을 더 촉진하게 한다.132 또한, 개인적 성공과 관련된 공감을 보여 줄 때, 문제를 엄밀하게 인식하게 하며. 반대로, 자선단체가 기부자와 수혜게의 유사점을 강조할 때, 잠재적 기부자는 무능하게 인식하게 된다. 반대로, 자선단체가 기부자와 수혜자 사이의 차이점을 강조할 때 기부자는 역량과 성공을 지각하게 된다. 이는 상호 의존적인 사고방식의 예방인 사고방식을 가진 사람들의 높은 기부 의사를 보였다.", "source": "20261114_170220.jpg"}, {"kind": "heading", "text": "요약", "source": "20261114_170225.jpg"}, {"kind": "paragraph", "text": "어떤 제공물들은 상징적인 의미를 지닌다. 소비자는 특정 제품을 자신이 속하는 다양한 사회적 집단을 나타내기 위한 의식적 혹은 무의식적인 지표로도 사용한다. 사회적 지위는 사람들이 어떤 직업을 경험해 생활경제 성장의 중요성을 지니는데, 의미 깊은 사람이나 장소, 시기와 연결된 경우에만 선물로서 가능하게 고려되는 장기적 사용 가치를 갖고 있으며 상징적 의미는 소비자의 자아 개념에 영향을 준다.\n소비자는 어떤 소유물이나 브랜드를 아주 특별하게, 혹은 매우 소중하게 느끼거나 생각하기도 한다. 이러한 물품은 가격에 대한 고려를 별로 거치지 않고 소비될 수 있고, 기능적 가치가 없어졌다고 하더라도 잘 버려지지 않는다. 원래 목적대로 사용되지 않는 상징적 제공물들은 선물 자체가 아닌, 개인의 정체성 표현으로도 가능하고, 역할 전환을 촉진하고, 우울을 날려줄 로맨틱한 감정을 표현해 주기 때문이다. 개인적인 숭고함의 억제를 드러내거나 기부를 통해 타인의 욕구를 충족시켜 주는 경우도 있다. 주거, 생활, 환경 같은 배경 특성은 모두 개인이 특별하다고 여기는 물체의 종류에 영향을 끼친다.\n어떤 개체(소유물, 사람, 장소, 문제, 시기, 사건)들은 너무 특별해서 신성한 것으로 간주된다. 소비자는 이러한 소유물을 보호고 보살피며 그것을 다루기 위한 특별한 의식을 자주 고안한다. 그러나 신성한 물체는 상업적, 부적절한 사용이나 부적 양상을 통해 세속화되거나 평범해질 수 있다.\n선물은 세 가지 단계(구성, 증정, 재구성)으로 한 사람에게서 다른 사람으로 의미를 전달하는 과정이다. 이러한 제품들은 명목 표준적으로 규정되지만 시기 선정 면에서 다양할 수 있다. 선물의 첫 두 단계가 방식이 행해지는 방식은 주는 사람과 받는 사람 관계의 장기적 지속 여부에 영향을 미칠 수 있다.\n사람들은 자신이 상대적으로 잘 살고 있다고 느낄 때, 상호 의존적인 자아 구성을 가질 때, 다른 사람들의 복지에 대한 책임감을 느낄 때, 그리고 긍정적 정서가 극대화될 때 자선단체에 기부할 가능성이 커진다. 반대로, 받는 사람이 그들의 도움에 대해 감사해 하지 않으리라고 믿을 때 기부를 않는다. 기부를 요청하는 메시지들은 가급적 일반적인보다 구체적인 방향으로 명확해야 한다. 예로서, 공익 단체는 기부에 관한 세 가지 유형의 메시지를 제창하는 메시지, 기부를 미리 대담한 특정한 자선 구매로 구성하는 메시지가 효과적이다.", "source": "20261114_170225.jpg"}], "notes": [{"source": "20261114_170054.jpg", "text": "CONSUMER BEHAVIOR\n 학습목표\n 1. 상징적 의미의 네 가지 기능을 설명한다.\n2. 특별한 소유물의 특징을 설명한다.\n3. 어떤 존재가 신성해지는 이유를 설명한다.\n4. 선물 주기의 단계들을 설명한다.\n5. 자선 기부에 가장 많이 참여할 가능성이 있는 사람들을 설명한다."}, {"source": "20261114_170059.jpg", "text": "그림 16-1 ▶ 16장의 개관: 상징적 소비자 행동\n 제품과 소비자 행동은 사람들 자신과 다른 이들과의 관계에 대한 것을 상징할 수 있다. 이번 장에서는 제품과 소비자 행동이 어떻게 의미를 가지고 전달하는지 생각해 볼 것이다. 소유물과 소비자 행동이 특별하거나 신성하기까지 한 의미를 갖게 되는 것과 또한 살펴볼 것이다. 또한, 우리가 아는 사람들이나 개인적으로 알지 못하는 사람들에게 선물을 주는 것(자선 기부)에 대해서도 논의할 것이다.\n 상징적 의미 · 상징 기능 · 역할 습득 기능 · 연결 기능 · 표현 기능\n 특별한 소유물 · 종류 · 특징 · 이론적 배경 · 소비자 특성이 무엇이 특별함에 영향을 미침 · 특별한 소유물의 의식\n 신성한 의미\n 선물 증정 · 시기 · 단계\n 자선 기부 · 누가 기부하는가 · 언제 기부하는가\n 상징적 기능 사회 집단의 구성원이 되도록 상징하기 위한 제품 및 사용."}, {"source": "20261114_170105.jpg", "text": "그림 16-2 상위 계층의 구성원 상징 카르티에(Cartier)의 이 다이아몬드 팔찌와 같은 일부 제품과 브랜드는 상위 계층의 구성원 상징으로 디자인되었다."}, {"source": "20261114_170108.jpg", "text": "성 소수자 프라이드 플래그:\n 생명을 위한 빨간색 치유를 위한 주황색 태양을 위한 노란색 자연을 위한 초록색 평정을 위한 파란색 영혼을 위한 보라색\n 트랜스젠더 프라이드 플래그:\n 하늘색은 소년을 상징한다.\n분홍색은 소녀를 상징한다.\n흰색은 성별 정체성이 확립되지 않거나, 전성, 그리고 논바이너리(non-binary), 젠더퀴어(genderqueer) 또는 성통합 정체성을 가진 개인들을 의미할 수 있다.\n습도를 위치가 유동적인 성별 정체성을 가진 사람을 의미할 것이다.\n 젠더 플루이드(Gender Fluid) 프라이드 플래그:\n 여성성을 나타내는 분홍색 모든 성별을 위한 흰색 여성성과 남성성을 나타내는 보라색 상성이 없는 것을 나타내는 검정색 남성성을 나타내는 파란색\n 그림 16-3 성 정체성 상징 성 소수가 공동체와 관련된 깃발과 그 상징적 의미.\n 역할 획득 기능 기존의 새로운 역할을 더욱 편안하게 만들 수 있도록 제품을 상징으로서 사용하는 것."}, {"source": "20261114_170113.jpg", "text": "그림 16-4 역할 획득 모형 우리가 새로운 역할을 획득할 때(혹은 무모 역할) 역할 자아감이 떨어질 수 있다. 따라서 활동에 참여(예: 축하 파티하는 것, 역할획득과 직·간접으로 관련되어 있는 여러 제품(예: 유모차와 같은)들은 이러한 활동 및 제품들은 우리의 행동에 대해 다른 이들의 평가를 용이하게 하여 우리의 역할 자아감을 강화한다.\n 전환에 의한 새로운 역할 → 지식/자신감의 부족 → 역할을 확립하기 위한 제품의 사용과 의식 참여 → 다른 이들로부터의 재귀 평가 → 강화된 역할 자아감 → 자아 개념"}, {"source": "20261114_170116.jpg", "text": "그림 16-5 역할 전환을 상징하는 제품과 활동 대학 졸업은 소비자의 삶에서 큰 전환을 요구하는 관례이다. 졸업 기운 이나 학위복 등과 같은 상징 제품은 이러한 변화를 더욱 의미 있고 특별 하게 해준다. 이러한 공식을 친구 및 가족과 함께하는 의례로서, 전반적 으로 경험이 풍부한 감정으로 이루어져 새로운 지위의 역할을 강화시킨다.\n 기억해 봅시다 우리가 어떻게 역할 전 환을 경우하는지에 대해 토론해 보자.\n당신의 삶 속에서 현재 경험하고 있 는 역할 전환과 관련된 제품 또는 활 동들을 다른 예로 들어보자."}, {"source": "20261114_170121.jpg", "text": "마케팅 시사점 마케터는 소비자의 역할 전환에 대한 지식을 다양한 방식으로 적용한다.\n 역할 전환과 표적 소비자 전환 단계에 있는 소비자는 많은 기업의 중요한 표적 시장이다.28 고등학생에서 대학생으로 전환된 때 당신은 필요로 했던 새로운 회사의 유행을 생각해 보라. 많은 회사가 결혼, 신혼여행, 출산, 이혼법, 첫 주택 구매란 제품을 군 구매할 역할을 커플을 표적으로 한다. 또한 갓 아기를 낳은 소비자를 표적으로 하는 회사도 많다. 보험에서 신생아 이름으로 이름이 이끼에서 살 수 있는 제품이 런건 신을 가능케 주기도 한다.\n 재결 확보 수단으로서의 역할 전환 역할 분리에서 제품의 재결은 중요한 측면이기 때문에, 종교 인사가 술집에서 태배하는 것을 사람을 실망하게 만들고 마케터의 힘들게 확산시킨다. 예를 들어, 술집과 카페는 손님들의 우왕 파송업무를 식별할 수 있을 때 연결될 수 있다. 그들이 역할 전환 과정에서 가꾸어 온 같은 학생 맥락 음료를 처분하고 한다는 사실을 알고 있기 때문이다. 마찬가지로, 이베이(eBay.com), 폐손의 마켓플레이스(Facebook Marketplace), 아마존(Amazon) 같은 온라인 쇼핑몰은 전환하는 소비자가 역할 전환으로 인해 더 이상 쓰지 않는 물건을 버리느라 할 때 수익을 낼 수 있다.\n 역할 전환과 제품 촉진 마케터는 새로운 역할에 편입된 데 그들의 제품이 수단이 된다는 방식으로 촉진하는 것이 유용함을 알 수 있다. 예를 들어, 마케터는 결혼식 선물로서 웨딩 바등록된 투자 재를지 가기 편한 것 중으로 하여금 귀한받다는 사실을 강조할 지지진다. 혼수용 공뮌용 등은 베스트가이(Best Guy), 에이스 하드웨어(Ace Hardware), 뉴욕의 연예인 박물관 같은 다양한 상점 등에 등장하고 있다. 컨테이너 스토어(The Container Store)는 결혼과 이기 관련 품목만이 아니라, 처음 직장을 구하기 위해 대학생과 처음으로 집을 사는 사람을 위한 물품들 주로 꾸미는 대학생과 처음으로 집을 사는 사람을 위한 용품들을 주로\n 제품 배송의 판매 마케터는 역할 획득 단계에서 제품군의 중요성을 소비자에게"}, {"source": "20261114_170124.jpg", "text": "유대감 기능 중요한 사람을 상징하는 재산, 과거의 전통과 생활을 거시던 기억과 과거의 생활양식을 상징하는 사물들"}, {"source": "20261114_170129.jpg", "text": "표현 기능 의도적으로 상징적 의미를 탐색하거나 그러한 기능이 점차적으로 드러나게 하는 특징을 가진 제품들에 의해 수행되는 의사소통 기능\n 마케팅 시사점\n 유대감 기능과 표현적 기능은 다양한 마케팅 함의로 이어진다. 예를 들어, 데이트하는 자녀 제품을 사용, 정보, 상징, 사건과 관련 지음 의 상징 행동에 의해, 소비자는 특히 옷차림, 장난감, 게임, 영화와 음악의 마케터들은 소비자가 이러한 제품을 자기 삶의 특별한 시기와 연관짓도록 상징적으로유도한다.\n또한 마케터는 자사 제품이 독특함을 표현할 수 있음을 제안함으로써 한 가지 방법을 활용하는 행하는 것이다.39 소비자는 맛과 냄새, 시각적 요소(예를 들어 디자인과 같은)로부터 다양하게 느낀다.40 무명한 소비자들은 (브랜드에 디자인이 있건 없건) 디자이너 브랜드를 고용하여 독특한 느낌을 갖게 하려는 경우가 많다.41 상징성과 디자이너의 추천에 의해 주목되는 일부 자동차와 옷 스타일 또한 소비자 자아의 표현을 반영하는 수단이라고 할 수 있다. 표현 기능을 위해 자아를 표현하는 행동을 할 때, 일부는 바디 아트에 자아를 표현한다. 바디 아트는(예를 들어 문신, 그림을 넣은 의상)은 몸을 예술품 표현을 위한 도운으로 삼는다. 이러한 같은 제품은 자기에 실재 개인에게보다 과거의 이상화된 자아를 상징할 수 있으며, 동시에 자신의 꿈을 반영기도 한다.42\n 그림 16-6 표현을 상징하는 제품과 활동 일부 사람들아 자신의 독특성을 표현하는 바디 아트의 한 형태이다."}, {"source": "20261114_170132.jpg", "text": "실제적 정체성 스키마 우리와 일상생활에서 현재 존재하는 여러 가지 다양한 자아 개념\n 이상적 정체성 스키마 우리가 바라는 이상적인 자아 개념이며 이는 개인의 상업 혹은 다른 사람들이 보는 관점에 따라 다를 수 있다\n 마케팅 시사점\n 마케터는 앞서 언급한 개념들에서 도출되는 여러 가지 함의를 고려할 필요가 있다.\n 마케팅과 소비자의 자아 개념 발달 마케터는 개인의 자아 개념이 만들어지고 유지되는 데 모두 영향을 미칠 수 있다. 제품이 우리가 누구인지 정하는 데 도움을 주기도 하지만, 자아 개념과 일치하는 이미지를 가진 제품을 선택함으로써 그것을 유지하기도 한다. 예를 들어, 폴로 셔츠와 체육관 신발인 컨버스(Convers)는 소비자들이 자기 고유의 자아 개념에 맞춰 기억의 웹사이트에서 여러 가지 비공운 운동들을 개인화하도록 응용한다. 이 회사의 많은 제품은 실제 옷으로 입혀지고 각 상품에 이전부터 기록한 이미지와 소비자의 인쇄 셔츠와 사용될 수 있는 프린터가 설치되어 있어 구매자가 직접 디자인한 샘플을 당일에 신을 수 있다.\n 제품과 자아 개념과의 브랜드 적합성 마케터는 브랜드 이미지와 소비자의 실제적 혹은 이상적 정체성이 잘 들어맞는 것을 추구한다. 적합성은 지역의 이미지와 소비자의 자아 이미지와 일치하거나 혹은 상호보완하는 제품을 더욱 잘 조화하게 된다.52 브랜드와 소비자의 자아 개념 연관 브랜드 충성도를 강화하고, 다른 브랜드로 바꿀 가능성을 줄일 수 있다.53"}, {"source": "20261114_170136.jpg", "text": "그림 16-7 ▶ 사람들이 가지고 있는 특별한 소유물 중 하나인 반려동물 미국 소비자들은 반려동물을 매우 특별하게 여기며, 종종 이들을 위해 개인적인 희생을 감수하기도 한다."}, {"source": "20261114_170139.jpg", "text": "그림 16-8 수집품 페즈 사탕통을 포함하여 다양한 제품은 소비자들에게 수집 가 능한 아이템이 될 수 있다."}, {"source": "20261114_170144.jpg", "text": "표 16-1 소유물이 특별한 이유\n 당신이 특별하다고 생각하는 소유물이 지닌 상징적인 가치, 기본 전환 속성, 실용의 유용한 가치 가운데 어떤 의미를 띠는지 먼저 7장 순서에 따라 이유 메시지 7-매- 무엇이든, 이러한 이유에 다음 설명으로 대답하라.\n 이 소유물이 내게 소중한 이유는 …\n 상징적인 가치 개인적인 역사/성장한 삶 • 특별한 사건이나 추상화된 획일적 표현 • 개인적인 역사 기념품 • 폐품하거나 유지하는 데 더 많은 헌신적/정서적 투자 업적과 대표완 • 자신의 신념과 전달할 문자적 능력 • 개인이나 집단의 사회적/경제적 성취를 주목가능 • 교육적 성취 여부를 상징 • 가족의 수입이나 재산력평\n 인간관계를 용이하게 함 지원호 보여줌 • 친밀한 인간관계, 결속의 기능 • 진실한 자아를 유지하면서도 사람들과의 새로운 관계를 맺을 수 있도록 함 자기표현적임 • 자기 자신을 드러낼 수 있도록 함 • 본인의 독특한 감, 능력과 다른 점을 표현해 줌\n 기본 전환 속성 즐거움을 제공함 • 감각, 오락이나 유쾌한 제공함 • 기분 좋게 함 • 편안함이나 정서적 안전을 제공함 정신적인 • 신성하거나 종교 의식과 영적 연결고리를 제공함 결론과 관련이 있음 • 보기에 아름답거나, 반짝거림 • 보는 이에게 보인 시각적인 감정의 형상시키면\n 실용적인 가치 실용적인 • 일상생활이나 일터에서도 직접적인 편리함을 줌 • 대부분의 사람들과 가족의 생의 지선 • 자주 사용을 제공함 재정적인 손해를 지님 • 재정적 면에서 가치가 있음\n Source: Adapted from Marsha Richins, “Valuing Things: The Public and Private Meanings of Possessions,” Journal of Consumer Research 21, December 1994, pp. 504-521."}, {"source": "20261114_170147.jpg", "text": "소유 의식 우리가 처응으로 상품을 얻는데 따른 일욕한 조우 또는 단가 의식.\n 손질 의식 특별한 소지품또는 애완동물을 출만하게 보이게 나나 유지 할 위해 하는 일정한 행동."}, {"source": "20261114_170152.jpg", "text": "처분 의식 처분 단계에서 지금에 맡긴 제품의 의미와 모든 연결을 제거하기 위해 취해지는 의식.\n 신성한 개체 구별되고, 존중받고, 숭배되고, 엄청난 감정을 통해 대접받는 사람, 물건, 장소이다.\n 세속적 개념 비종교적이기 때문에 무엇인가가 신성한 개체와 동일한 의미를 지니지 못하는 사물.\n 그림 16-9 ▶ 신성한 개체 농구계의 레전드인 코비 브라이언트처럼 유명한 사람이나 사용, 장소는 아주 특별해서 신성한 지위를 획득하고 소비자들의 감정을 이끌어 낸다."}, {"source": "20261114_170154.jpg", "text": "마케팅 시사점\n 마케터는 사람, 물건, 장소, 사건이 소비자에게 줄 수 있는 신 성한 의미를 알고 있어야 한다.\n 신성함을 만들고 유지하기\n 가끔 마케터는 사람이나 사물이 신성함을 창조한다. 예를 들 어, 많은 영화배우와 유명인 담당자들은 신비적으로 포장하려 고 강력하다. 그들 그룹으로 애플은 신성한 제품을 만드는 회 사이다. 신성한 대상을 만들고 유지하고자 하는 전략에서, 마케터는 소비자 만족에도 도움을 줄 수 있는데, 수집품, 순수 예술품, 희귀한 보석 같은 신성한 물건의 가격을 아주 높게 유지하는 방법 이 있다. 예를 들어, 2001년의 소더비(sotheby) 경매에서는 가수 엘비스 프레슬리의 것이라고 여겨 작고 낡은 신발 한 결혼식 구두가 1쌍에 56만 달러에 팔렸다.83\n 신성한 측면 개체의 세속화 방지\n 마케터는 가능한 오래 신성함을 통해 신성한 문제를 피 하고, 여러 소비자들은 매일 다른 종교 활동을 소비한다. 수많은 종교 단체들은 직접 상업적 활동을 한다. 그중 가장 많이 알려진 예 중의 하나는 '기독교 영화'이다. 이 영화들은 기독교에 관련된 역 바깥에 종교적이고 청구권과 피는 역할 영화에 여러 영역에 속하는 것이다.\n 구상 단계 선물 증정의 첫 번 째 단계로서, 선물의 의미와 성격을 고려하는 단계이다.\n 증정 단계 선물을 주는 단계. 단계가 끝나면, 선물이 언제 어떻게 주어졌는지에 따른 결과 관계가 재구성 되는지 등이 결정된다.\n 재구성 단계 선물을 주고 받는 사람들 간의 관계를 선물 증정 경험 이후에 재정의하는 단계이다."}, {"source": "20261114_170203.jpg", "text": "그림 16-10 선물 증정 단계 선물을 정성으로 포장하는 것으로 물건은 비상물화하며 더 개인적으로 보이게 하는 과정의 일부이다."}, {"source": "20261114_170212.jpg", "text": "마케팅 시사점\n 기업들은 소비자에게 더 효과적으로 마케팅하기 위해 선물 증 정에 관한 다양한 관점을 구축할 수 있다.\n 재화와 서비스로 선물용 홍보 많은 마케터들은 자사 제품을 선물 증정 상황에 적합한 것으로 호환하고, 그런 선물을 증정 상황의 시점에서 소비자 마인드를 지배 하여 상표 선택이 이루어지도록 개발야 한다. 예를 들어 미국 소비자들은 연말 선물 쇼핑에 많은 돈을 쓴다. 그들은 2010년에는 평균적으로 선물에 약 659달러 지켰을 었는데, 이는 약 79명 달러에 맞는 소비해 방에 해당된 달한다. 이 중, 생일 카드가 가장 많이 있고 있는 선물 종류이며, 그 다음 으로는 조의 카드, 감사 카드, 결혼식 카드가 있다. 여성들이 전체 엽서의 80%를 구매한다.112)\n 온라인 쇼핑은 선물을 찾을 때 가장 보편적인 경로이기 때문에, 마케터들은 선물을 제안하거나 선물 구매자들이 잠재적인 선물 후보를 쉽게 사럴할 수 있도록 도와야 한다. 소매 업체들은 또한 강력한 역할을 한 소비자들 사이에서 선물에 대한 영감을 얻도록 도와주는 강력한 역할을 한한다. 온라인 선물 가이드는 또한 선물을 찾는 사람들에게 인기 있\n 는 채널이다. 창의적인 제품 디스플레이는 소비자가 특정 아이템을 선물로 고려할 가능성을 높일 수 있다. 판매의 동안 소비자들은 가 격 인식가 크게 감소하지만, 실제로 판매 프로모션이 없이 이러한 가격 인하는 계속 유지되고 있다. 따라서 프로모션이 선물 구매 결정을 시 효과적으로 사용할 수 있다.\n 선물을 받은 사람들이 선물을 반핲를 왜 있기 때문에, 온라인 과 오프라인 소매마저들은 선물을 잘못 생각 화려려는 받아들여야만 한다. 지속 가능한 마케팅을 위해서도, 소매 업체들은 반한되고 선물들 의 일부를 재판매하여 선물의 생을 연장하도록 해야 한다. 특히 예약 판매 선물 카드인 경험 좋은 경험이 동반한 선물을 구매하는 사람에게 자신이 구매해야도 한다. 따라서 마케터들은 선물을 주는 사람에게 자신이 에도 좋은 것을 받을 자있 있는 메시지를 통해 이러한 기회를 활용할 수 있다.113)\n 마지막으로, 선물 정잔을 용이하게 하기 위해 마케터들은 때리는 기프트리턴(gift-now)와 같은 조직과 제휴하여 온라인 고객이 선물을 구매할 후 몇 분 이내에 선물 수령자에게 메시지와 카드를 보낼 수 있다. 수신자는 도착하기 전에 선택을 수정하거나 선물을 교환할 수 있다."}, {"source": "20261114_170217.jpg", "text": "그림 16-11 ▶ 자선 단체에 대한 기부 소비자들은 기부하는 단체의 유형에 따라 다양하게 분류될 수 있다.\n 종교단체/교회 인권/시민권 환경 노인/은퇴자 재해 관련 단체 교육 재해 서사 개발 동물 복지 재난 구조 예술 박사 건강 관련(의료 연구)\n 지난 12개월 동안 기부한 적이 있다.\n과거에 기부한 적은 있지만, 지난 12개월 동안은 없다.\n받도 기부한 적이 없다.\n Source: Based on Carol Wong, U.S. Attitudes Toward Nonprofits-US 202: Mintel, 2023."}, {"source": "20261114_170225.jpg", "text": "복습과 토론을 위한 질문 1. 제품의 상징적 가능과 역할 획득 기능을 비교하라, 또한 구매와 기능으로 표현되는 기능과 비교하라.\n2. 역할 정체란 무엇이며, 역할 획득이 어떻게 영향을 미치는가?\n3. 개인의 이상적 정체성과 실제의 정체성 조기가와 어떻게 관련되어 있는가?\n4. 선물은 특별한 의미를 갖는 세 가지 주된 이유는 무엇인가?\n5. 소비자들은 왜 숭고, 존경, 자본 의식을 축여하는가?\n6. 신성한 개체란 무엇이며, 어떻게 세속화되는가?\n7. 선물의 세 단계를 구분하고, 선물의 주는 사람과 받는 사람 사이의 관계에 어떻게 영향을 미치는지 설명하라.\n8. 소비자가 언제 기부할 가능성이 높은지 설명하라."}]}</script><script>
const data=JSON.parse(document.getElementById('bookData').textContent),content=document.getElementById('content'),notes=document.getElementById('notes');document.title=data.title;document.getElementById('bookTitle').textContent=data.title;
data.main.forEach((x,i)=>{const el=document.createElement(x.kind==='heading'?'h2':'p');el.textContent=x.text;el.dataset.read='1';el.dataset.index=i;el.title=x.source;content.appendChild(el)});data.notes.forEach(x=>{const el=document.createElement('div');el.className='note';el.textContent=x.text;el.dataset.read='1';el.dataset.note='1';el.title=x.source;notes.appendChild(el)});if(!data.notes.length)notes.hidden=true;
const includeNotes=document.getElementById('includeNotes');let items=[],index=+(localStorage.getItem('ch16-tts-index')||0),stopped=true;const synth=speechSynthesis,voice=document.getElementById('voice'),status=document.getElementById('status');function refreshItems(){items=[...document.querySelectorAll('[data-read]')].filter(el=>includeNotes.checked||el.dataset.note!=='1');if(index>=items.length)index=0}refreshItems();
function voices(){const current=voice.value;voice.innerHTML='';synth.getVoices().filter(v=>v.lang.startsWith('ko')).concat(synth.getVoices().filter(v=>!v.lang.startsWith('ko'))).forEach(v=>{const o=new Option(v.name+' · '+v.lang,v.name);voice.add(o)});if(current)voice.value=current}voices();synth.onvoiceschanged=voices;
function mark(){items.forEach(x=>x.classList.remove('active'));if(items[index]){items[index].classList.add('active');items[index].scrollIntoView({block:'center',behavior:'smooth'});localStorage.setItem('ch16-tts-index',index)}}
function speak(){if(index>=items.length){stopped=true;status.textContent='끝까지 읽었습니다.';return}stopped=false;mark();const u=new SpeechSynthesisUtterance(items[index].innerText);u.lang='ko-KR';u.rate=+document.getElementById('rate').value;u.voice=synth.getVoices().find(v=>v.name===voice.value)||null;u.onend=()=>{if(!stopped){index++;speak()}};u.onerror=e=>{if(e.error!=='canceled')status.textContent='TTS 오류: '+e.error};status.textContent=`${index+1} / ${items.length} 문단 읽는 중`;synth.speak(u)}
document.getElementById('play').onclick=()=>{if(synth.paused){synth.resume();status.textContent='이어 읽는 중';return}if(!synth.speaking)speak()};document.getElementById('pause').onclick=()=>{synth.pause();status.textContent='일시정지'};document.getElementById('stop').onclick=()=>{stopped=true;synth.cancel();status.textContent='정지'};
document.querySelector('.page').onclick=e=>{const el=e.target.closest('[data-read]');if(!el||!items.includes(el))return;stopped=true;synth.cancel();index=items.indexOf(el);mark()};includeNotes.onchange=()=>{stopped=true;synth.cancel();refreshItems();mark();status.textContent=includeNotes.checked?'본문 뒤에 참고자료도 읽습니다.':'본문만 읽습니다.'};document.getElementById('size').oninput=e=>document.documentElement.style.setProperty('--size',e.target.value+'px');
document.getElementById('txt').onclick=()=>{const text=data.title+'\n\n'+content.innerText+(notes.hidden?'':'\n\n참고 자료\n\n'+notes.innerText.replace(/^참고 자료\s*/,''));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=data.title+'.txt';a.click();URL.revokeObjectURL(a.href)};
content.addEventListener('input',()=>localStorage.setItem('ch16-book-edits',content.innerHTML));const saved=localStorage.getItem('ch16-book-edits');if(saved){content.innerHTML=saved;refreshItems()}
</script></body></html>
