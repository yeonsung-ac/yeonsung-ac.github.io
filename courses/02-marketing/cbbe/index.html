<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>브랜드자산 형성과정 | 이현구</title>
  <link rel="stylesheet" href="../../../styles.css">
  <link rel="stylesheet" href="../brand.css">
  <style>
    /* 이 낱장은 교안 보관함 밖에 있다. 소비자행동론 4장(지식·기억·인출)에서
       건너오는 길이라, 마케팅 문을 지나지 않고도 그림만 볼 수 있어야 한다.
       그림 자체는 보관함 안의 것과 같은 파일을 쓴다 — 두 벌을 두면 언젠가
       어긋난다. */
    body{background:#f7f9f5;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px}
    .back{display:inline-block;margin:0 0 14px;color:var(--muted);
      text-decoration:none;font-size:.83rem}
    .back:hover{color:var(--navy)}
    .why{
      margin:0 0 20px;padding:14px 17px;border-radius:11px;
      border-left:4px solid var(--navy);background:#eef1ec;
      color:#4a5750;font-size:.87rem;line-height:1.8;
    }
    .why b{color:var(--navy)}
    .why a{color:var(--navy)}
  </style>
</head>
<body>

<header class="page-header" style="background:#fff;border-bottom:1px solid var(--line)">
  <a class="wordmark" href="../../../" aria-label="홈으로 이동" style="color:var(--navy)">
    <b style="color:var(--navy)">이현구</b><span style="color:var(--muted)">연성대학교 경영학과 겸임교수</span>
  </a>
</header>

<main class="wrap">
  <a class="back" href="../../04-consumer-behavior/map/">← 소비자 행동 모델 지도</a>

  <p class="why">
    소비자행동론 <b>4장 · 지식 · 기억 · 인출</b>에서 건너온 그림입니다.
    소비자 머릿속에 <b>무엇이 어떻게 쌓여 있는가</b>를 브랜드 쪽에서 본 것이
    바로 이 <b>브랜드 지식(brand knowledge)</b>입니다. 4장이 기억의 얼개를
    다룬다면, 이 그림은 그 기억에 담긴 것이 브랜드에서 어떤 모습을 띠는지를 보여 줍니다.
  </p>

  <section class="brand" id="brand"></section>
</main>

<script type="module">
  import { drawBrand } from "../brand.js";
  drawBrand(document.getElementById("brand"));
</script>
</body>
</html>
