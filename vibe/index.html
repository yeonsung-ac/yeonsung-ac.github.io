<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="바이브코딩이 무엇인지 열다섯 장면으로 보는 인트로.">
  <title>바이브코딩이란 | 이현구</title>
  <link rel="preload" as="image" href="shots/01.jpg">
  <style>
    /* 강의실 스크린에 띄우는 화면이다. 사진이 주인공이므로 화면을 사진에 다 내준다.
       나머지는 손이 닿을 때만 드러난다. */
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:#0c1523;color:#f7f9f5;overflow:hidden;
      font-family:"Malgun Gothic","맑은 고딕",-apple-system,Arial,sans-serif;
    }

    .stage{position:relative;height:100vh;height:100dvh;display:grid;place-items:center}

    .shot{
      position:absolute;inset:0;margin:auto;
      max-width:100%;max-height:100%;object-fit:contain;
      opacity:0;transition:opacity .45s ease;
    }
    .shot.on{opacity:1}

    /* 손을 대면 드러나고, 가만두면 사라진다. 스크린에 군더더기를 남기지 않는다. */
    .ui{opacity:0;transition:opacity .25s}
    .ui.show{opacity:1}

    .arm{
      position:fixed;top:50%;transform:translateY(-50%);z-index:3;
      width:clamp(48px,4.4vw,66px);height:clamp(48px,4.4vw,66px);
      border:0;border-radius:50%;background:rgba(12,21,35,.55);color:#fff;
      font-size:clamp(24px,2.4vw,34px);line-height:1;cursor:pointer;
      backdrop-filter:blur(3px);
    }
    .arm:hover{background:rgba(12,21,35,.8)}
    .arm.prev{left:clamp(12px,1.6vw,26px)}
    .arm.next{right:clamp(12px,1.6vw,26px)}

    .bottom{
      position:fixed;left:0;right:0;bottom:0;z-index:3;
      display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.4vw,18px);
      padding:clamp(12px,2vh,22px) clamp(14px,2vw,26px) clamp(18px,2.6vh,28px);
      background:linear-gradient(to top, rgba(12,21,35,.82), transparent);
    }
    .btn{
      display:inline-flex;align-items:center;gap:7px;
      height:clamp(40px,4vh,48px);padding:0 clamp(14px,1.5vw,20px);
      border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;
      font:inherit;font-weight:700;font-size:clamp(.8rem,1.05vw,.94rem);cursor:pointer;
      backdrop-filter:blur(3px);
    }
    .btn:hover{background:rgba(255,255,255,.26)}
    .btn.on{background:#c8ef64;color:#101b2d}

    .count{
      color:#dfe7f2;font-size:clamp(.82rem,1.1vw,.98rem);font-variant-numeric:tabular-nums;
      min-width:4.4em;text-align:center;
    }
    .count b{font-weight:700}
    .count span{color:#8fa3c0}

    /* 남은 시간을 실처럼 보여 준다. 언제 넘어갈지 눈으로 잡힌다. */
    .tick{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1);z-index:4}
    .tick span{display:block;height:100%;width:0;background:#c8ef64}
    .tick.run span{transition:width linear}
    .tick.off{opacity:0}

    .home{
      position:fixed;top:clamp(12px,2vh,22px);left:clamp(12px,1.6vw,24px);z-index:3;
      color:#dfe7f2;text-decoration:none;font-size:clamp(.76rem,1vw,.9rem);
      padding:9px 14px;border-radius:999px;background:rgba(12,21,35,.55);backdrop-filter:blur(3px);
    }
    .home:hover{background:rgba(12,21,35,.8)}

    .title{
      position:fixed;top:clamp(12px,2vh,22px);left:50%;transform:translateX(-50%);z-index:3;
      margin:0;padding:9px 18px;border-radius:999px;background:rgba(12,21,35,.55);
      color:#dfe7f2;font-size:clamp(.78rem,1.05vw,.94rem);white-space:nowrap;
      backdrop-filter:blur(3px);
    }
    .title b{color:#c8ef64;font-weight:700}

    /* 한눈에 보기 */
    .map{
      position:fixed;inset:0;z-index:6;background:rgba(12,21,35,.97);
      display:none;align-content:start;gap:12px;padding:clamp(20px,3vw,44px);overflow:auto;
      grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    }
    .map.on{display:grid}
    .map button{
      border:2px solid transparent;border-radius:10px;background:none;padding:0;
      cursor:pointer;overflow:hidden;line-height:0;
    }
    .map button img{width:100%;height:auto;display:block;border-radius:8px}
    .map button.now{border-color:#c8ef64}
    .map-x{
      position:fixed;top:clamp(12px,2vh,22px);right:clamp(12px,1.6vw,24px);z-index:7;
      width:46px;height:46px;border:0;border-radius:50%;
      background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer;
    }

    @media(max-width:700px){
      .title{display:none}
      .btn span.long{display:none}
    }
    @media(prefers-reduced-motion:reduce){.shot{transition:none}.tick span{transition:none}}
  </style>
</head>
<body>

<div class="stage" id="stage"></div>

<p class="title ui" id="ui-title"><b>바이브코딩이란</b> · 인트로</p>
<a class="home ui" href="../">← 홈</a>

<button class="arm prev ui" id="prev" type="button" aria-label="이전">‹</button>
<button class="arm next ui" id="next" type="button" aria-label="다음">›</button>

<div class="bottom ui">
  <button class="btn" id="play" type="button">⏸ <span class="long">멈춤</span></button>
  <p class="count"><b id="now">1</b> <span>/ <span id="all">15</span></span></p>
  <button class="btn" id="mapgo" type="button">▦ <span class="long">한눈에</span></button>
  <button class="btn" id="full" type="button">⛶ <span class="long">전체 화면</span></button>
</div>

<div class="tick" id="tick"><span></span></div>

<div class="map" id="map"></div>
<button class="map-x" id="map-x" type="button" aria-label="닫기" hidden>×</button>

<script>
  const N = 15;
  const EVERY = 3000;              // 3초마다 넘어간다

  const stage = document.getElementById("stage");
  const map = document.getElementById("map");
  const tick = document.getElementById("tick");
  let at = 0, playing = true, timer = null;

  /* 사진을 미리 다 넣어 둔다. 열다섯 장 2MB 라 한 번에 들여도 무겁지 않고,
     넘길 때 흰 화면이 스치지 않는다. */
  const shots = [];
  for (let i = 1; i <= N; i++) {
    const no = String(i).padStart(2, "0");
    const im = new Image();
    im.className = "shot";
    im.src = `shots/${no}.jpg`;
    im.alt = `바이브코딩 인트로 ${i}번째 장면`;
    im.loading = i <= 3 ? "eager" : "lazy";
    stage.appendChild(im);
    shots.push(im);

    const b = document.createElement("button");
    b.type = "button";
    b.dataset.go = i - 1;
    b.innerHTML = `<img src="shots/${no}.jpg" alt="" loading="lazy">`;
    b.addEventListener("click", () => { go(i - 1); showMap(false); });
    map.appendChild(b);
  }
  document.getElementById("all").textContent = N;

  function go(i) {
    at = (i + N) % N;                       // 끝에서 처음으로 돈다
    shots.forEach((s, k) => s.classList.toggle("on", k === at));
    document.getElementById("now").textContent = at + 1;
    map.querySelectorAll("[data-go]").forEach((b) => {
      b.classList.toggle("now", Number(b.dataset.go) === at);
    });
    if (playing) start();
  }

  /* 남은 시간을 실로 보여 준다. 한 번 0 으로 되돌린 뒤 늘려야 다시 그려진다. */
  function start() {
    stop();
    tick.classList.remove("off", "run");
    tick.firstElementChild.style.width = "0%";
    void tick.offsetWidth;
    tick.classList.add("run");
    tick.firstElementChild.style.transitionDuration = EVERY + "ms";
    tick.firstElementChild.style.width = "100%";
    timer = setTimeout(() => go(at + 1), EVERY);
  }

  function stop() {
    clearTimeout(timer);
    timer = null;
    tick.classList.remove("run");
    tick.firstElementChild.style.transitionDuration = "0ms";
  }

  function play(on) {
    playing = on === undefined ? !playing : on;
    const b = document.getElementById("play");
    b.innerHTML = playing ? '⏸ <span class="long">멈춤</span>' : '▶ <span class="long">이어서</span>';
    b.classList.toggle("on", !playing);
    if (playing) { start(); } else { stop(); tick.classList.add("off"); }
  }

  function showMap(on) {
    const yes = on === undefined ? !map.classList.contains("on") : on;
    map.classList.toggle("on", yes);
    document.getElementById("map-x").hidden = !yes;
    if (yes) { stop(); } else if (playing) { start(); }
  }

  document.getElementById("prev").addEventListener("click", () => go(at - 1));
  document.getElementById("next").addEventListener("click", () => go(at + 1));
  document.getElementById("play").addEventListener("click", () => play());
  document.getElementById("mapgo").addEventListener("click", () => showMap());
  document.getElementById("map-x").addEventListener("click", () => showMap(false));
  document.getElementById("full").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(at + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(at - 1); }
    else if (e.key === " ") { e.preventDefault(); play(); }          // 스페이스로 세우고 잇는다
    else if (e.key === "m" || e.key === "M") { showMap(); }
    else if (e.key === "f" || e.key === "F") { document.getElementById("full").click(); }
    else if (e.key === "Escape") { showMap(false); }
    else if (e.key === "Home") { go(0); }
    else if (e.key === "End") { go(N - 1); }
  });

  /* 사진을 누르면 멈춘다. 설명하다 붙들고 싶을 때 손이 먼저 간다. */
  stage.addEventListener("click", () => play(false));

  let x0 = null;
  addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) go(at + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive: true });

  /* 단추는 손이 움직일 때만 드러낸다. 스크린에 군더더기를 남기지 않는다. */
  const ui = [...document.querySelectorAll(".ui")];
  let hideAt = null;
  function wake() {
    ui.forEach((el) => el.classList.add("show"));
    clearTimeout(hideAt);
    hideAt = setTimeout(() => {
      if (!map.classList.contains("on")) ui.forEach((el) => el.classList.remove("show"));
    }, 2600);
  }
  ["mousemove", "touchstart", "keydown"].forEach((k) => addEventListener(k, wake));

  go(0);
  play(true);
  wake();
</script>

</body>
</html>
